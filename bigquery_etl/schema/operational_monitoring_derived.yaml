fields:
- name: active_hours_mean
  description: Array of statistical summaries (mean with confidence intervals) for
    the active_hours metric per experiment branch.
- name: ad_clicks_mean
  description: Array of statistical summaries (mean with confidence intervals) for
    the ad_clicks metric per experiment branch.
- name: branch
  description: The experiment branch for which statistics are reported (e.g. 'enabled'
    or 'disabled').
- name: build_id
  description: The Firefox build identifier used to segment statistics; NULL when
    the experiment is not build-specific.
- name: days_of_use_mean
  description: Array of statistical summaries (mean with confidence intervals) for
    the days_of_use metric per experiment branch.
- name: memory_total_percentile
  description: Array of statistical summaries (percentile distribution with confidence
    intervals) for the memory_total metric per experiment branch.
- name: qualified_cumulative_days_of_use_mean
  description: Array of statistical summaries (mean with confidence intervals) for
    the qualified_cumulative_days_of_use metric, indicating average cumulative qualified
    usage days per branch.
- name: retained_mean
  description: Array of statistical summaries (mean with confidence intervals) for
    the retained metric, broken down by statistic type and optional parameter.
- name: search_count_mean
  description: Array of statistical summaries (mean with confidence intervals) for
    the search_count metric per experiment branch.
- name: uri_count_mean
  description: Array of statistical summaries (mean with confidence intervals) for
    the uri_count metric per experiment branch.
- name: active_hours
  description: The total number of hours the client was actively browsing on the submission
    date, measured in fractional hours.
- name: ad_clicks
  description: The total number of advertisement clicks recorded for the client on
    the submission date.
- name: branch
  description: The experiment branch to which the client was assigned (e.g. 'enabled'
    or 'disabled').
- name: build_id
  description: The Firefox build identifier associated with the client's submission,
    used to segment results by browser build.
- name: days_of_use
  description: The number of days the client actively used Firefox on the submission
    date, typically 1 for daily snapshots.
- name: qualified_cumulative_days_of_use
  description: The cumulative number of qualified days of use for the client up to
    and including the submission date; a day qualifies if the client met minimum activity
    thresholds.
- name: retained
  description: Whether the client was retained on this submission date; 1 indicates
    the client was active and retained, 0 indicates not retained.
- name: search_count
  description: The total number of searches performed by the client on the submission
    date across all search engines.
- name: uri_count
  description: The total number of URIs (web pages) visited by the client on the submission
    date.
- name: active_hours_mean
  description: Array of statistical summaries (mean with confidence intervals) for
    the active_hours metric per branch.
- name: ad_clicks_mean
  description: Array of statistical summaries (mean with confidence intervals) for
    the ad_clicks metric per branch.
- name: branch
