- name: sync_count_mobile_mean
  description: Mean number of syncs to/from mobile devices on the submission date.
    Null if sync is not configured (sampled 2026-05-29).
- name: sync_count_mobile_sum
  description: Total number of syncs with mobile devices on the submission date.
- name: telemetry_enabled
  description: State of the legacy telemetry opt-out pref. True if the client has
