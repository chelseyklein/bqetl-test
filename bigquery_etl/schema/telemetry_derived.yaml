- name: ad_click
  description: Total number of ad clicks recorded for the client on the submission
    date, aggregated across all search engines. Null when no search data is available
    (sampled 2026-06-02).
- name: count_picked_by_position
  description: An array of key-value pairs mapping each 1-indexed position in the
    urlbar dropdown to the count of times the client picked a result at that position
    on the submission date. Position -1 (index 0) represents results picked outside
    the standard dropdown.
- name: count_picked_by_type
  description: An array of key-value pairs mapping each urlbar result type (e.g. 'searchengine',
    'history', 'bookmark', 'topsite', 'searchsuggestion') to the total count of times
    the client picked a result of that type on the submission date.
- name: count_picked_total
  description: Total number of urlbar result items picked (selected) by the client
    across all result types and positions on the submission date. Null for ~96% of
    clients who made no picks (sampled 2026-06-02).
- name: in_navbar
  description: Whether the search bar is integrated in the navigation bar (browser.widget.in-navbar
    pref). True means no separate search box is shown; false means the dedicated search
    bar is visible (sampled 2026-06-02).
- name: quicksuggest_data_collection_enabled
  description: Whether the user has opted into data collection for Firefox Suggest
    (browser.urlbar.quicksuggest.dataCollection.enabled pref). Values are 'true' or
    'false' as strings; null for ~87% of clients where the pref was not sampled (sampled
    2026-06-02).
- name: quicksuggest_onboarding_dialog_choice
  description: The user's choice in the Firefox Suggest onboarding dialog, e.g. 'accept_2',
    'reject_2', 'not_now_2', 'close_1', 'dismiss_1'. Null for nearly all clients who
    have not seen the dialog (sampled 2026-06-02).
- name: search_region
  description: The browser search region pref (browser.search.region) representing
    the region configured for search. Null when not set by the client (sampled 2026-06-02).
- name: show_search_suggestions_first
  description: Whether search suggestions are shown before browsing history in the
    urlbar dropdown (browser.urlbar.showSearchSuggestionsFirst pref). Null for most
    clients where the pref was not sampled (sampled 2026-06-02).
- name: suggest_enabled
  description: Whether the browser urlbar suggest feature is enabled (browser.search.suggest.enabled
    pref). True means suggestions are shown in the urlbar. Null for most clients where
    the pref was not sampled (sampled 2026-06-02).
- name: suggest_quicksuggest
  description: Whether the deprecated browser.urlbar.suggest.quicksuggest pref is
    enabled. Null for nearly all clients as this pref was replaced by suggest_quicksuggest_nonsponsored
    and suggest_quicksuggest_sponsored (sampled 2026-06-02).
- name: suggest_quicksuggest_nonsponsored
  description: Whether the urlbar is configured to show non-sponsored Firefox Suggest
    results (browser.urlbar.suggest.quicksuggest.nonsponsored pref). Null for ~87%
    of clients where the pref was not sampled (sampled 2026-06-02).
- name: suggest_quicksuggest_sponsored
  description: Whether the urlbar is configured to show sponsored Firefox Suggest
    results (browser.urlbar.suggest.quicksuggest.sponsored pref). True for approximately
    31% of clients (sampled 2026-06-02).
- name: suggest_searches
  description: Whether the urlbar is configured to suggest search terms (browser.urlbar.suggest.searches
    pref). Null for the majority of clients where the pref was not sampled (sampled
    2026-06-02).
- name: urlbar_picked_by_type_by_position
  description: An array of structs, one per urlbar result type, each containing the
    type name and a nested array of key-value pairs mapping 1-indexed dropdown positions
    to pick counts. Types include 'searchengine', 'history', 'bookmark', 'topsite',
    'searchsuggestion', 'formhistory', 'autofill', 'tip', 'switchtab', 'tabtosearch',
    'visiturl', 'keyword', 'remotetab', 'extension', 'dynamic', and 'unknown'.
