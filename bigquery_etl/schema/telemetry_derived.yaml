- name: update_background
  description: True if Firefox is configured to install updates in the background
    while the browser is not running; false otherwise.
- name: update_channel
  description: The Firefox update channel from the build configuration, not normalized
    (e.g. 'release', 'esr', 'beta', 'nightly', 'default').
- name: update_enabled
  description: True if Firefox automatic updates are enabled; false if updates have
    been disabled.
- name: user_pref_app_shield_optoutstudies_enabled
  description: 'Value of the ''app.shield.optoutstudies.enabled'' user preference:
    ''true'' if Shield studies are allowed, ''false'' if opted out. Null if not set
    (sampled 2026-05-29).'
- name: user_pref_browser_newtabpage_enabled
  description: 'Value of the ''browser.newtabpage.enabled'' pref: ''false'' if the
    New Tab page is disabled; ''true'' otherwise. Null if default (sampled 2026-05-29).'
- name: user_pref_browser_search_region
  description: The search region preference configured for the client's browser (ISO
    3166-1 alpha-2 country code, e.g. 'US', 'DE').
- name: user_pref_browser_search_suggest_enabled
  description: 'Value of ''browser.search.suggest.enabled'': ''false'' if search suggestions
    are disabled; ''true'' if enabled. Null if default (sampled 2026-05-29).'
- name: user_pref_browser_urlbar_quicksuggest_data_collection_enabled
  description: 'Value of the Firefox Suggest data collection preference: ''false''
    if the user has opted out of data collection for Firefox Suggest. Null if default
    (sampled 2026-05-29).'
- name: user_pref_browser_urlbar_quicksuggest_onboarding_dialog_choice
  description: 'The user''s choice in the Firefox Suggest (Quicksuggest) onboarding
    dialog: ''close_1'', ''not_now_2'', or ''reject_2''. Null if the dialog was not
    shown (sampled 2026-05-29).'
- name: user_pref_browser_urlbar_show_search_suggestions_first
  description: 'Value of ''browser.urlbar.showSearchSuggestionsFirst'': ''false''
    if history results are shown before search suggestions in the URL bar. Null if
    default (sampled 2026-05-29).'
- name: user_pref_browser_urlbar_suggest_bestmatch
  description: 'Value of ''browser.urlbar.bestMatch.enabled'': ''true'' if best match
    suggestions are shown in the URL bar. Null if default (sampled 2026-05-29).'
- name: user_pref_browser_urlbar_suggest_quicksuggest
  description: 'Value of ''browser.urlbar.suggest.quicksuggest'': controls legacy
    Firefox Suggest UI. Null if default (sampled 2026-05-29).'
- name: user_pref_browser_urlbar_suggest_quicksuggest_nonsponsored
  description: 'Value of ''browser.urlbar.suggest.quicksuggest.nonsponsored'': ''true''
    if non-sponsored Firefox Suggest results are enabled; ''false'' if disabled.'
- name: user_pref_browser_urlbar_suggest_quicksuggest_sponsored
  description: 'Value of ''browser.urlbar.suggest.quicksuggest.sponsored'': ''true''
    if sponsored Firefox Suggest results are shown; ''false'' if disabled.'
- name: user_pref_browser_urlbar_suggest_searches
  description: 'Value of ''browser.urlbar.suggest.searches'': ''false'' if URL bar
    search suggestions are disabled. Null if default (sampled 2026-05-29).'
- name: user_pref_browser_widget_in_navbar
  description: 'Value of the Firefox widget-in-navbar pref: ''true'' if a specific
    widget is shown in the navigation bar; ''false'' otherwise. Null if default (sampled
    2026-05-29).'
- name: utility_crash_count
  description: Total number of Firefox utility process crashes on the submission date.
- name: vendor
  description: The application vendor string (always 'Mozilla' for Firefox).
- name: vr_crash_count
  description: Total number of Firefox VR process crashes on the submission date.
- name: web_notification_shown_sum
  description: Total number of Web Notification permission prompts shown to the user
    on the submission date.
- name: windows_build_number
  description: Windows OS build number (e.g. 26200 for Windows 11 24H2). Null for
    non-Windows clients (sampled 2026-05-29).
- name: windows_ubr
  description: Windows Update Build Revision (UBR) number, a sub-version of the build
    number representing cumulative update patches. Null for non-Windows clients (sampled
    2026-05-29).
- name: attribution_dlsource
  description: The download source that served the Firefox installer (e.g. 'mozorg',
    'mozillaci', 'fxdotcom', 'desktoplauncher'), as recorded in the attribution data.
- name: attribution_dltoken
  description: A unique token identifying the specific download event that led to
    this installation, used to correlate installs with download records.
- name: attribution_ua
  description: The user-agent family of the browser used to download Firefox, derived
    from the attribution data (e.g. 'chrome', 'edge', 'firefox', 'ie', 'other').
- name: build_id
  description: The Firefox build ID (application.buildId) of the build that generated
    the first-seen ping, in YYYYMMDDHHMMSS format.
- name: days_interacted_bits
  description: A 28-bit integer bitmask recording which of the 28 days the client
    had at least one active interaction (active ticks); used together with days_visited_1_uri_bits
    to compute qualified DAU metrics.
- name: days_seen_bits
  description: A 28-bit integer bitmask recording which of the 28 days after first_seen_date
    the client sent at least one main ping; the most-significant bit represents day
    1 and the least-significant bit represents day 28.
- name: days_visited_1_uri_bits
  description: A 28-bit integer bitmask recording which of the 28 days the client
    visited at least one URI; used together with days_interacted_bits to compute qualified
    DAU metrics.
- name: app_display_version
  description: The user-visible version string of the Firefox application, which may
    include a suffix such as 'esr' (e.g. '140.11.0esr') (sampled 2026-05-29).
- name: channel
  description: The Firefox update channel as reported by the client (e.g. 'release',
    'beta', 'nightly', 'esr'); may differ from normalized_channel for unrecognized
    values (sampled 2026-05-29).
- name: default_private_search_engine
  description: The internal identifier of the client's default private-browsing search
    engine; null if no separate private engine was configured (sampled 2026-05-29).
- name: default_private_search_engine_data_load_path
  description: The load path of the default private-browsing search engine configuration;
    null when no separate private engine was configured (sampled 2026-05-29).
- name: default_private_search_engine_data_name
  description: The human-readable name of the default private-browsing search engine;
    null when no separate private engine was configured (sampled 2026-05-29).
- name: default_private_search_engine_data_origin
  description: The origin of the default private-browsing search engine configuration;
    null when no separate private engine was configured (sampled 2026-05-29).
- name: default_private_search_engine_data_submission_url
  description: The search submission URL for the default private-browsing search engine;
    null when no separate private engine was configured (sampled 2026-05-29).
- name: default_search_engine
  description: The internal identifier of the client's default search engine on the
    first seen date (e.g. 'google-b-d', 'baidu') (sampled 2026-05-29).
- name: default_search_engine_data_load_path
  description: The load path of the default search engine configuration, indicating
    whether it was bundled with the app, an add-on, or installed via another method
    (sampled 2026-05-29).
- name: default_search_engine_data_name
  description: The human-readable name of the client's default search engine on the
    first seen date (e.g. 'Google', 'DuckDuckGo') (sampled 2026-05-29).
- name: default_search_engine_data_origin
  description: 'The origin of the default search engine configuration: ''default''
    for built-in engines, ''verified'' for user-installed with valid hash, ''unverified''
    otherwise; null if not reported (sampled 2026-05-29).'
- name: default_search_engine_data_submission_url
  description: The search submission URL of the default search engine, used to construct
    search queries; not recorded for user-installed engines to protect privacy (sampled
    2026-05-29).
- name: second_seen_date
  description: The second date on which the server received a ping from this client;
    null if the client has only been seen once (sampled 2026-05-29).
- name: metadata
  description: A struct capturing which telemetry pings were observed for this client
    on or before first_seen_date, including which ping type was the source of the
    first-seen date.
- name: histogram_aggregates
  description: Array of per-metric histogram aggregates for this client, each describing
    one histogram probe across a specific process, key, and bucket configuration.
- name: histogram_aggregates.agg_type
  description: The aggregation method applied to the histogram values for each entry
    in histogram_aggregates; always 'summed_histogram' in this table.
- name: histogram_aggregates.first_bucket
  description: The lower bound of the first bucket in the histogram's bucket range
    for each entry in histogram_aggregates.
- name: histogram_aggregates.key
  description: An optional keyed-histogram key for each entry in histogram_aggregates;
    empty string for non-keyed histograms.
- name: histogram_aggregates.last_bucket
  description: The upper bound of the last bucket in the histogram's bucket range
    for each entry in histogram_aggregates.
- name: histogram_aggregates.latest_version
  description: The most recent Firefox major version observed for this client's histogram
    entry within histogram_aggregates, used to determine version currency.
- name: histogram_aggregates.metric
  description: The name of the telemetry histogram probe (e.g. 'network_dns_end_to_connect_start_exp_ms')
    for each entry in histogram_aggregates.
- name: histogram_aggregates.metric_type
  description: The histogram type for each entry in histogram_aggregates, e.g. 'histogram-exponential',
    'histogram-enumerated', 'histogram-boolean', 'histogram-categorical', 'histogram-linear',
    or 'histogram-count'.
- name: histogram_aggregates.num_buckets
  description: The total number of buckets in the histogram for each entry in histogram_aggregates.
- name: histogram_aggregates.process
  description: The Firefox process type from which the histogram was recorded (e.g.
    'parent', 'content', 'gpu') for each entry in histogram_aggregates.
- name: join_key
  description: A composite string key used to join this table with clients_histogram_aggregates_v2;
    formed by concatenating client_id, os, app_version, app_build_id, and channel.
- name: histogram_aggregates
  description: Repeated array of per-metric histogram aggregates for this client,
    each representing one histogram probe across a specific process, key, and bucket
    configuration. New data from clients_histogram_aggregates_new_v1 is merged into
    the previous day's data to produce this rolling per-client view.
- name: histogram_aggregates.agg_type
  description: The aggregation method applied to the histogram values for each entry
    in histogram_aggregates; always 'summed_histogram' in this table.
- name: histogram_aggregates.aggregates
  description: Repeated array of key-value pairs within each histogram_aggregates
    entry, where key is the histogram bucket index (as a string) and value is the
    aggregated count for that bucket across submissions.
- name: histogram_aggregates.first_bucket
  description: The lower bound of the first bucket in the histogram's bucket range
    for each entry in histogram_aggregates.
- name: histogram_aggregates.key
  description: An optional keyed-histogram key for each entry in histogram_aggregates;
    empty string for non-keyed histograms.
- name: histogram_aggregates.last_bucket
  description: The upper bound of the last bucket in the histogram's bucket range
    for each entry in histogram_aggregates.
- name: histogram_aggregates.metric
  description: The name of the telemetry histogram probe (e.g. 'network_dns_end_to_connect_start_exp_ms')
    for each entry in histogram_aggregates.
- name: histogram_aggregates.metric_type
  description: The histogram type for each entry in histogram_aggregates, e.g. 'histogram-exponential',
    'histogram-enumerated', 'histogram-boolean', 'histogram-categorical', 'histogram-linear',
    or 'histogram-count'.
- name: histogram_aggregates.num_buckets
  description: The total number of buckets in the histogram for each entry in histogram_aggregates.
- name: histogram_aggregates.process
  description: The Firefox process type from which the histogram was recorded (e.g.
    'parent', 'content', 'gpu') for each entry in histogram_aggregates.
- name: agg_type
  description: The client-level aggregation method; always 'summed_histogram', indicating
    that histogram bucket counts are summed across a client's submissions.
- name: first_bucket
  description: The lower bound of the first bucket in this histogram's bucket range.
- name: key
  description: The keyed-histogram key; empty string for non-keyed histograms. For
    keyed histograms, identifies the specific sub-metric (e.g. an add-on ID or a domain
    name).
- name: last_bucket
  description: The upper bound of the last bucket in this histogram's bucket range.
- name: metric
  description: The name of the telemetry histogram probe being aggregated (e.g. 'webext_extension_startup_ms_by_addonid').
- name: metric_type
  description: The histogram type, one of 'histogram-exponential', 'histogram-enumerated',
    'histogram-boolean', 'histogram-categorical', 'histogram-linear', or 'histogram-count'.
- name: non_norm_record
  description: A struct holding the raw (non-normalized) bucket count for a single
    histogram bucket, where key is the bucket index as a string and value is the raw
    summed count across all clients.
- name: non_norm_record.key
  description: The histogram bucket index (as a string) within the non_norm_record
    struct.
- name: non_norm_record.value
  description: The raw (non-normalized) summed count for this histogram bucket within
    the non_norm_record struct, expressed as a float.
- name: num_buckets
  description: The total number of buckets in the histogram.
- name: process
  description: The Firefox process type from which the histogram was recorded, one
    of 'parent', 'content', or 'gpu'.
- name: record
  description: A struct holding the normalized (Dirichlet-smoothed) bucket count for
    a single histogram bucket, where key is the bucket index as a string and value
    is the aggregated normalized count across all clients.
- name: record.key
  description: The histogram bucket index (as a string) within the record struct.
- name: record.value
  description: The normalized (Dirichlet-smoothed) aggregated count for this histogram
    bucket within the record struct, expressed as a float.
- name: agg_type
  description: The population-level aggregation type; always 'histogram', indicating
    that per-client histograms are aggregated across all clients matching the row's
    dimensions.
- name: aggregates
  description: Repeated array of normalized (Dirichlet-smoothed) histogram bucket
    proportions, where key is the bucket index as a string and value is the population-level
    proportion for that bucket.
- name: aggregates.key
  description: The histogram bucket index as a string within the aggregates array.
- name: aggregates.value
  description: The Dirichlet-normalized proportion of clients in this bucket within
    the aggregates array; values sum to approximately 1.0 across all buckets for a
    given row.
- name: client_agg_type
  description: The aggregation type applied at the per-client level before population
    aggregation; always 'summed_histogram' in this table.
- name: first_bucket
  description: The lower bound of the first bucket in this histogram's bucket range.
- name: key
  description: The keyed-histogram key; empty string for non-keyed histograms. For
    keyed histograms, identifies the specific sub-metric (e.g. an add-on ID or a domain
    name).
- name: last_bucket
  description: The upper bound of the last bucket in this histogram's bucket range.
- name: metric
  description: The name of the telemetry histogram probe being aggregated (e.g. 'webext_extension_startup_ms_by_addonid').
- name: metric_type
  description: The histogram type, one of 'histogram-exponential', 'histogram-enumerated',
    'histogram-boolean', 'histogram-categorical', 'histogram-linear', or 'histogram-count'.
- name: non_norm_aggregates
  description: Repeated array of raw (non-normalized) histogram bucket counts, where
    key is the bucket index as a string and value is the summed raw count across all
    clients for that bucket.
- name: non_norm_aggregates.key
  description: The histogram bucket index as a string within the non_norm_aggregates
    array.
- name: non_norm_aggregates.value
  description: The raw (non-normalized) summed count for this bucket across all contributing
    clients within the non_norm_aggregates array.
- name: num_buckets
  description: The total number of buckets in the histogram.
- name: process
  description: The Firefox process type from which the histogram was recorded, one
    of 'parent', 'content', or 'gpu'.
- name: total_users
  description: The total number of clients contributing to this row's aggregated histogram,
    used as the denominator for normalized proportions.
- name: days_logged_event_bits
  description: A 28-bit integer bitmask representing the days in the last 28 days
    on which the client had at least one logged telemetry event; bit 0 (LSB) corresponds
    to submission_date and bit 27 to 27 days prior.
- name: days_used_pictureinpicture_bits
  description: A 28-bit integer bitmask representing the days in the last 28 days
    on which the client created at least one picture-in-picture window; bit 0 corresponds
    to submission_date.
- name: days_viewed_protection_report_bits
  description: A 28-bit integer bitmask representing the days in the last 28 days
    on which the client viewed the Privacy Protections report; bit 0 corresponds to
    submission_date.
- name: n_created_pictureinpicture
  description: The cumulative count of picture-in-picture windows created by this
    client across the active 28-day window; 0 for the vast majority of clients (sampled
    2026-06-02).
- name: n_logged_event
  description: The cumulative count of telemetry events logged by this client across
    the active 28-day window, summed from clients_daily_event_v1.
- name: n_viewed_protection_report
  description: The cumulative count of times the client viewed the Privacy Protections
    report across the active 28-day window; 0 for nearly all clients (sampled 2026-06-02).
- name: aborts_content_sum
  description: Total number of Firefox content-process abort events (unclean process
    terminations) aggregated over the reporting period; null when no aborts occurred
    (sampled 2026-05-29).
- name: aborts_gmplugin_sum
  description: Total number of Gecko Media Plugin (GMP) process abort events aggregated
    over the reporting period; null when no aborts occurred (sampled 2026-05-29).
- name: aborts_plugin_sum
  description: Total number of NPAPI plugin process abort events aggregated over the
    reporting period; null when no aborts occurred (sampled 2026-05-29).
- name: active_addons_count_mean
  description: Mean number of active add-ons installed across the client's subsessions
    on the reporting day; typically around 7 for most users (sampled 2026-05-29).
- name: active_experiment_branch
  description: The branch of the active legacy Normandy experiment the client is enrolled
    in; null when no experiment is active. Fully null in sampled data (sampled 2026-05-29).
- name: active_experiment_id
  description: The identifier of the active legacy Normandy experiment the client
    is enrolled in; null when no experiment is active. Fully null in sampled data
    (sampled 2026-05-29).
- name: active_hours_sum
  description: Total number of hours the client was actively using Firefox (based
    on five-second active ticks), summed across all subsessions on the reporting day
    (sampled 2026-05-29).
- name: ad_clicks_count_all
  description: Total number of clicks on search-result advertisements across all search
    access points on the reporting day; null for ~95% of clients (sampled 2026-05-29).
- name: addon_compatibility_check_enabled
  description: Whether application compatibility is enforced for add-ons; true for
    virtually all clients (sampled 2026-05-29).
- name: attribution.campaign
  description: Marketing campaign identifier that led to the Firefox download (e.g.
    'SET_DEFAULT_BROWSER', '%2528not%2Bset%2529'); null when attribution is unavailable
    (sampled 2026-05-29).
- name: attribution.content
  description: Specific link or content identifier within a marketing campaign that
    drove the Firefox download; null when attribution is unavailable (sampled 2026-05-29).
- name: attribution.dlsource
  description: Identifier indicating where the Firefox installation originated (e.g.
    'mozillaci', 'mozorg', 'fxdotcom'); null for ~52% of clients where attribution
    is unavailable (sampled 2026-05-29).
- name: attribution.dltoken
  description: Unique token assigned at Firefox download time to correlate the install
    with a specific download event; null when attribution is unavailable (sampled
    2026-05-29).
- name: attribution.experiment
  description: Funnel experiment parameter captured at Firefox download time; null
    when no experiment was active or attribution is unavailable (sampled 2026-05-29).
- name: attribution.medium
  description: Category of the marketing source that led to the Firefox download (e.g.
    'referral', 'paidsearch', 'cpc'); null when attribution is unavailable (sampled
    2026-05-29).
- name: attribution.source
  description: Referring partner domain when the Firefox install originated via a
    known partner (e.g. 'www.google.com', 'www.bing.com'); null when attribution data
    is unavailable (sampled 2026-05-29).
- name: attribution.ua
  description: Derived user agent type of the browser used when downloading Firefox
    (e.g. 'edge', 'chrome', 'firefox'); null for ~68% of clients (sampled 2026-05-29).
- name: attribution.variation
  description: Funnel experiment variation parameter captured at Firefox download
    time (e.g. 'treatment', 'control'); null when no experiment was active (sampled
    2026-05-29).
- name: blocklist_enabled
  description: Whether the Firefox add-on blocklist is enabled; true for nearly all
    clients (sampled 2026-05-29).
- name: bookmark_migrations_quantity_all
  description: Total number of bookmarks migrated from all browsers combined; null
    for ~99.4% of clients who have not performed any bookmark migration (sampled 2026-05-29).
- name: bookmark_migrations_quantity_chrome
  description: Number of bookmarks migrated from Google Chrome; null for ~99.9% of
    clients who have not performed a Chrome bookmark migration (sampled 2026-05-29).
- name: bookmark_migrations_quantity_edge
  description: Number of bookmarks migrated from Microsoft Edge; null for ~99.9% of
    clients who have not performed an Edge bookmark migration (sampled 2026-05-29).
- name: bookmark_migrations_quantity_safari
  description: Number of bookmarks migrated from Safari; null for ~100% of clients
    who have not performed a Safari bookmark migration (sampled 2026-05-29).
- name: browser_backup_archive_enabled
  description: Whether the Firefox browser backup archiving feature is enabled; null
    for ~33% of clients (older Firefox versions) (sampled 2026-05-29).
- name: browser_backup_scheduler_enabled
  description: Whether the Firefox browser backup scheduler is enabled; null for ~43%
    of clients (older Firefox versions lacking this feature) (sampled 2026-05-29).
- name: client_clock_skew_mean
  description: Mean difference in seconds between the client clock and the server
    clock at submission time, averaged across subsessions; 0.0 is the most common
    value (sampled 2026-05-29).
- name: client_submission_latency_mean
  description: Mean latency in seconds between when the ping was created and when
    it was received by the server, averaged across subsessions; 0 indicates pings
    sent nearly immediately (sampled 2026-05-29).
- name: crash_submit_attempt_content_sum
  description: Total number of crash report submission attempts for content-process
    crashes; null when no such attempts occurred (sampled 2026-05-29).
- name: crash_submit_attempt_main_sum
  description: Total number of crash report submission attempts for main-process crashes;
    null when no such attempts occurred (sampled 2026-05-29).
- name: crash_submit_attempt_plugin_sum
  description: Total number of crash report submission attempts for NPAPI plugin crashes;
    null when no such attempts occurred (sampled 2026-05-29).
- name: crash_submit_success_content_sum
  description: Total number of successfully submitted crash reports for content-process
    crashes; null when no such successes occurred (sampled 2026-05-29).
- name: crash_submit_success_main_sum
  description: Total number of successfully submitted crash reports for main-process
    crashes; null when no such successes occurred (sampled 2026-05-29).
- name: crash_submit_success_plugin_sum
  description: Total number of successfully submitted crash reports for NPAPI plugin
    crashes; null when no such successes occurred (sampled 2026-05-29).
- name: crashes_detected_content_sum
  description: Total number of Firefox content-process crashes detected and reported
    over the reporting period; null when no crashes occurred (sampled 2026-05-29).
- name: crashes_detected_gmplugin_sum
  description: Total number of Gecko Media Plugin (GMP) process crashes detected over
    the reporting period; null when no crashes occurred (sampled 2026-05-29).
- name: crashes_detected_plugin_sum
  description: Total number of NPAPI plugin process crashes detected over the reporting
    period; null when no crashes occurred (sampled 2026-05-29).
- name: days_created_profile_bits
  description: Bit-pattern integer indicating the days in the past 28 on which a new
    Firefox profile was created on the client; non-zero on profile-creation days (sampled
    2026-05-29).
- name: days_had_8_active_ticks_bits
  description: Bit-pattern integer for the days in the past 28 on which the client
    accumulated at least 8 five-second activity ticks, indicating substantive browser
    engagement.
- name: days_interacted_bits
  description: Bit-pattern integer for the days in the past 28 on which the client
    had at least one active-tick interaction with the browser (sampled 2026-05-29).
- name: days_logged_event_bits
  description: Bit-pattern integer for the days in the past 28 on which the client
    had at least one Telemetry event logged; null for ~2.3% of clients (sampled 2026-05-29).
- name: days_opened_dev_tools_bits
  description: Bit-pattern integer for the days in the past 28 on which the client
    opened Firefox Developer Tools at least once (sampled 2026-05-29).
- name: days_seen_bits
  description: A bit-pattern integer representing the days within the past 28 days
    on which the client submitted at least one ping, where the least-significant bit
    represents the most recent day.
- name: days_used_pictureinpicture_bits
  description: Bit-pattern integer for the days in the past 28 on which the client
    used Picture-in-Picture video; null for ~2.3% of clients (sampled 2026-05-29).
- name: days_viewed_protection_report_bits
  description: Bit-pattern integer for the days in the past 28 on which the client
    viewed the Privacy Protections report; null for ~2.3% of clients (sampled 2026-05-29).
- name: days_visited_10_uri_bits
  description: Bit-pattern integer for the days in the past 28 on which the client
    visited at least 10 URIs, a stronger engagement signal than the 5-URI threshold
    (sampled 2026-05-29).
- name: days_visited_1_uri_bits
  description: Bit-pattern integer for the days in the past 28 on which the client
    visited at least 1 URI, in normal or private browsing mode (sampled 2026-05-29).
- name: days_visited_1_uri_normal_mode_bits
  description: Bit-pattern integer for the days in the past 28 on which the client
    visited at least 1 URI in a normal (non-private) browsing window (sampled 2026-05-29).
- name: days_visited_1_uri_private_mode_bits
  description: Bit-pattern integer for the days in the past 28 on which the client
    visited at least 1 URI in a private browsing window; null-equivalent 0 indicates
    no private browsing on that day (sampled 2026-05-29).
- name: days_visited_5_uri_bits
  description: Bit-pattern integer for the days in the past 28 on which the client
    visited at least 5 URIs, used as a lightweight engagement threshold (sampled 2026-05-29).
- name: default_private_search_engine
  description: Identifier of the client's default private browsing search engine;
    null for ~100% of clients where the private search engine is not explicitly set
    (sampled 2026-05-29).
- name: default_private_search_engine_data_load_path
  description: Anonymized load path for the default private browsing search engine;
    null for ~100% of clients where no private engine is explicitly set (sampled 2026-05-29).
- name: default_private_search_engine_data_name
  description: Human-readable name of the private browsing default search engine (e.g.
    'DuckDuckGo'); null for ~100% of clients (sampled 2026-05-29).
- name: default_private_search_engine_data_origin
  description: How the private browsing default search engine was set; null for ~100%
    of clients where it is not explicitly configured (sampled 2026-05-29).
- name: default_private_search_engine_data_submission_url
  description: The HTTP URL template used for private browsing searches; null for
    ~100% of clients where no private engine is explicitly set (sampled 2026-05-29).
- name: default_search_engine
  description: Identifier of the client's default search engine (e.g. 'google-b-d',
    'baidu', 'ddg'); null for ~1% of clients where the setting could not be determined
    (sampled 2026-05-29).
- name: default_search_engine_data_load_path
  description: Anonymized file path indicating how the default search engine was loaded
    (e.g. '[app]google', '[addon]google@search.mozilla.org'); null for ~1% of clients
    (sampled 2026-05-29).
- name: default_search_engine_data_name
  description: Human-readable name of the client's default search engine (e.g. 'Google',
    'DuckDuckGo'); null for ~1% of clients (sampled 2026-05-29).
- name: default_search_engine_data_origin
  description: How the default search engine was set; values include 'default' (built-in),
    'verified', 'unverified', 'invalid'; null for ~87% of clients (sampled 2026-05-29).
- name: default_search_engine_data_submission_url
  description: The HTTP URL template used when submitting searches to the default
    engine (e.g. 'https://www.google.com/search?client=firefox-b-d&q='); not recorded
    for user-installed engines (sampled 2026-05-29).
- name: devtools_toolbox_opened_count_sum
  description: Total number of times the Firefox DevTools toolbox was opened across
    all sessions on the reporting day; null for ~99% of clients who did not open DevTools
    (sampled 2026-05-29).
- name: distribution_version
  description: Version string of the Firefox distribution package (e.g. '1.0', '2023.6');
    null for ~81% of clients without a partner distribution (sampled 2026-05-29).
- name: distributor
  description: Name of the organization that distributed this Firefox build (e.g.
    'canonical', 'mozillaonline', 'mint', 'archlinux'); null for ~91% of clients without
    a distributor (sampled 2026-05-29).
- name: distributor_channel
  description: Distribution channel of the Firefox build (e.g. 'mainWinStub', 'ubuntu');
    null for ~91% of clients without a distributor (sampled 2026-05-29).
- name: dom_parentprocess_private_window_used
  description: Whether a private browsing window was opened at any point on the reporting
    day; true for ~5% of clients (sampled 2026-05-29).
- name: e10s_enabled
  description: Whether Electrolysis (multi-process Firefox) was enabled; true for
    nearly all clients (sampled 2026-05-29).
- name: env_build_arch
  description: CPU architecture of the Firefox build (e.g. 'x86-64', 'x86', 'aarch64')
    (sampled 2026-05-29).
- name: env_build_id
  description: The build ID of the environment (same as app_build_id); a timestamp
    string identifying the exact Firefox build, e.g. '20260511200624' (sampled 2026-05-29).
- name: env_build_platform_version
  description: Platform (XULRunner) version string from the build environment; matches
    env_build_version (sampled 2026-05-29).
- name: env_build_version
  description: The application version string from the build environment (e.g. '150.0.3',
    '151.0.1'), same as app_version (sampled 2026-05-29).
- name: env_build_xpcom_abi
  description: The XPCOM ABI string identifying the build's processor and compiler
    combination (e.g. 'x86_64-msvc', 'x86_64-gcc3', 'aarch64-gcc3') (sampled 2026-05-29).
- name: first_document_id
  description: Document ID (UUID) of the first telemetry ping received from this client
    on the reporting day, used to uniquely identify a submission.
- name: first_paint_mean
  description: Mean time in milliseconds from Firefox startup until the first browser
    paint (first visible frame), averaged across subsessions; null for ~10% of clients
    (sampled 2026-05-29).
- name: flash_version
  description: Version string of the Adobe Flash plugin installed on the client (e.g.
    '32.0.0.465'); null for ~99.6% of clients where Flash is absent (sampled 2026-05-29).
- name: fxa_configured
  description: Whether Firefox Accounts is configured on the client; null for ~86%
    of clients who have not signed in to an FxA account (sampled 2026-05-29).
- name: histogram_parent_devtools_aboutdebugging_opened_count_sum
  description: Total number of times the about:debugging DevTools panel was opened
    by the client; null for ~100% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_animationinspector_opened_count_sum
  description: Total number of times the DevTools Animation Inspector panel was opened;
    null for ~100% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_browserconsole_opened_count_sum
  description: Total number of times the DevTools Browser Console was opened; null
    for ~100% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_canvasdebugger_opened_count_sum
  description: Total number of times the DevTools Canvas Debugger panel was opened;
    always null in sampled data (deprecated tool) (sampled 2026-05-29).
- name: histogram_parent_devtools_computedview_opened_count_sum
  description: Total number of times the DevTools Computed View CSS panel was opened;
    null for ~99.9% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_custom_opened_count_sum
  description: Total number of times a custom DevTools panel was opened; null for
    ~100% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_developertoolbar_opened_count_sum
  description: Total number of times the DevTools developer toolbar was opened; always
    null in sampled data (deprecated tool) (sampled 2026-05-29).
- name: histogram_parent_devtools_dom_opened_count_sum
  description: Total number of times the DevTools DOM panel was opened; null for ~100%
    of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_eyedropper_opened_count_sum
  description: Total number of times the DevTools color eyedropper tool was opened;
    null for ~100% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_fontinspector_opened_count_sum
  description: Total number of times the DevTools Font Inspector panel was opened;
    null for ~100% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_inspector_opened_count_sum
  description: Total number of times the DevTools Inspector (DOM/CSS panel) was opened;
    null for ~99% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_jsbrowserdebugger_opened_count_sum
  description: Total number of times the DevTools Browser Toolbox JS debugger was
    opened; null for ~100% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_jsdebugger_opened_count_sum
  description: Total number of times the DevTools JavaScript Debugger panel was opened;
    null for ~99.9% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_jsprofiler_opened_count_sum
  description: Total number of times the DevTools JavaScript Profiler panel was opened;
    null for ~99.9% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_layoutview_opened_count_sum
  description: Total number of times the DevTools Layout View (box model / grid inspector)
    panel was opened; null for ~99% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_memory_opened_count_sum
  description: Total number of times the DevTools Memory panel was opened; null for
    ~100% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_menu_eyedropper_opened_count_sum
  description: Total number of times the DevTools menu eyedropper was opened via the
    menu; null for ~100% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_netmonitor_opened_count_sum
  description: Total number of times the DevTools Network Monitor panel was opened;
    null for ~99.7% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_options_opened_count_sum
  description: Total number of times the DevTools Options/Settings panel was opened;
    null for ~100% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_paintflashing_opened_count_sum
  description: Total number of times the DevTools Paint Flashing tool was opened;
    always null in sampled data (deprecated tool) (sampled 2026-05-29).
- name: histogram_parent_devtools_picker_eyedropper_opened_count_sum
  description: Total number of times the DevTools color picker eyedropper was opened;
    null for ~100% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_responsive_opened_count_sum
  description: Total number of times the DevTools Responsive Design Mode was opened;
    null for ~99.9% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_ruleview_opened_count_sum
  description: Total number of times the DevTools CSS Rule View panel was opened;
    null for ~99% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_scratchpad_opened_count_sum
  description: Total number of times the DevTools Scratchpad editor was opened; always
    null in sampled data (removed tool) (sampled 2026-05-29).
- name: histogram_parent_devtools_scratchpad_window_opened_count_sum
  description: Total number of times a DevTools Scratchpad window was opened; nearly
    always null (sampled 2026-05-29).
- name: histogram_parent_devtools_shadereditor_opened_count_sum
  description: Total number of times the DevTools Shader Editor panel was opened;
    always null in sampled data (deprecated tool) (sampled 2026-05-29).
- name: histogram_parent_devtools_storage_opened_count_sum
  description: Total number of times the DevTools Storage Inspector panel was opened;
    null for ~99.9% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_styleeditor_opened_count_sum
  description: Total number of times the DevTools Style Editor panel was opened; null
    for ~99.9% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_webaudioeditor_opened_count_sum
  description: Total number of times the DevTools Web Audio Editor panel was opened;
    always null in sampled data (deprecated tool) (sampled 2026-05-29).
- name: histogram_parent_devtools_webconsole_opened_count_sum
  description: Total number of times the DevTools Web Console panel was opened; null
    for ~99.7% of clients (sampled 2026-05-29).
- name: histogram_parent_devtools_webide_opened_count_sum
  description: Total number of times the DevTools WebIDE panel was opened; nearly
    always null (deprecated tool) (sampled 2026-05-29).
- name: history_migrations_quantity_all
  description: Total number of history entries migrated from all browsers combined;
    null for ~99.4% of clients (sampled 2026-05-29).
- name: history_migrations_quantity_chrome
  description: Number of history entries migrated from Google Chrome; null for ~99.9%
    of clients who have not performed a Chrome history migration (sampled 2026-05-29).
- name: history_migrations_quantity_edge
  description: Number of history entries migrated from Microsoft Edge; null for ~99.9%
    of clients (sampled 2026-05-29).
- name: history_migrations_quantity_safari
  description: Number of history entries migrated from Safari; null for ~100% of clients
    who have not performed a Safari history migration (sampled 2026-05-29).
- name: logins_migrations_quantity_all
  description: Total number of saved passwords migrated from all browsers combined;
    null for ~99.4% of clients (sampled 2026-05-29).
- name: logins_migrations_quantity_chrome
  description: Number of saved passwords migrated from Google Chrome; null for ~99.9%
    of clients (sampled 2026-05-29).
- name: logins_migrations_quantity_edge
  description: Number of saved passwords migrated from Microsoft Edge; null for ~99.9%
    of clients (sampled 2026-05-29).
- name: logins_migrations_quantity_safari
  description: Number of saved passwords migrated from Safari; null for ~100% of clients
    who have not migrated Safari logins (sampled 2026-05-29).
- name: max_subsession_counter
  description: Highest subsession counter value seen across all pings on the reporting
    day, reflecting the maximum number of subsessions since the last profile creation
    (sampled 2026-05-29).
- name: media_play_time_ms_audio_sum
  description: Total milliseconds of audio media playback on the reporting day; null
    for ~100% of clients with no audio playback recorded (sampled 2026-05-29).
- name: media_play_time_ms_video_sum
  description: Total milliseconds of video media playback on the reporting day; null
    for ~100% of clients with no video playback recorded (sampled 2026-05-29).
- name: min_subsession_counter
  description: Lowest subsession counter value seen across all pings on the reporting
    day; 1 is the most common value, indicating a fresh session (sampled 2026-05-29).
- name: n_created_pictureinpicture
  description: Number of Picture-in-Picture video sessions created by the client on
    the reporting day; null for ~2.3% of clients (sampled 2026-05-29).
- name: n_logged_event
  description: Number of Telemetry events logged by the client on the reporting day;
    null for ~2.3% of clients (sampled 2026-05-29).
