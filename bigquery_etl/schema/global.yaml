fields:
- name: account_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: Whether the user's logged in to an FxA account.
- name: activity_segment
  type: STRING
  description: Classification of users based on their browsing activity.
    E.g., infrequent, casual, regular.
  aliases:
  - segment
  possible_values:
  - casual_user
  - core_user
  - infrequent_user
  - regular_user
  - other
- name: adjust_network
  type: STRING
  mode: NULLABLE
  description: The name of the Adjust Network that sourced the installation.
- name: app_build_id
  type: STRING
  description: The build ID of the application.
  aliases:
  - build_id
- name: app_version
  type: INTEGER
  description: User visible version string (e.g. "1.0.3") for the browser.
  aliases:
  - version
  - app_display_version
- name: app_version_major
  type: INTEGER
  description: The major version of the user visible app version string for the browser,
    e.g. "142.1.3", has major version 142
- name: app_version_minor
  type: INTEGER
  description: The minor version of the user visible app version string for the browser,
    e.g. "142.1.3" has minor version 1
- name: app_version_patch
  type: INTEGER
  description: The patch version of the user visible app version string for the browser,
    e.g. "142.1.3" has patch version 3
- name: app_name
  type: STRING
  description: The name of the browser or application.
- name: architecture
  type: STRING
  description: The architecture of the device, (e.g. "arm", "x86").
- name: branch
  type: STRING
  description: The Nimbus experiment branch to which the client was assigned
    (e.g., "control", "treatment-a", "treatment-b").
- name: attribution_campaign
  type: STRING
  description: The campaign this client/install was attributed to (utm_campaign
    value, identifying a specific marketing campaign or promotion).
- name: attribution_content
  type: STRING
  description: The attribution content; similar or the same as UTM content.
- name: attribution_experiment
  type: STRING
  description: The attribution experiment key.
- name: attribution_medium
  type: STRING
  description: The attribution medium; similar or the same as UTM medium.
- name: attribution_source
  type: STRING
  description: The attribution source; similar or the same as UTM source.
- name: attribution_variation
  type: STRING
  description: The attribution variation key.
- name: client_id
  type: STRING
  description: A unique identifier (UUID) for the client.
- name: context_id
  type: STRING
  description: A unique identifier (UUID) for clients in contextual services user
    interaction pings, e.g. top-sites ping.
- name: country
  type: STRING
  description: Name of the country in which the activity took place, as determined by
    the IP geolocation.
  aliases:
  - normalized_country
  - geo
- name: country_code
  type: STRING
  description: Code of the country in which the activity took place, as determined by
    the IP geolocation. Unknown or NULL values are normally stored as '??'.
  aliases:
  - normalized_country_code
- name: created_at
  type: TIMESTAMP
  description: Timestamp when the row was created.
  aliases:
  - created_timestamp
  - created_date
- name: dau
  type: INTEGER
  description: The number of daily active users, corresponding to the count of clients that reported
    at least one ping on the submission_date and qualify as active.
- name: first_run_date
  type: DATE
  mode: NULLABLE
  description: The date of the first run of the application.
- name: first_seen_date
  type: DATE
  mode: NULLABLE
  description: Date when the server first received a ping from this client.
- name: wau
  type: INTEGER
  description: The number of weekly active users, corresponding to the count of clients that reported
    at least one ping on the previous 7 days from the submission_date and qualify as active.
- name: mau
  type: INTEGER
  description: The number of monthly active users, corresponding to the count of clients that reported
    at least one ping on the previous 28 days from the submission_date and qualify as active.
- name: distribution_id
  type: STRING
  description: The distribution id associated with the install of Firefox.
- name: document_id
  type: STRING
  description: The document ID specified in the URI when the client sent this message.
- name: is_bot_generated
  type: BOOLEAN
  description: A flag indicating whether the record was generated by a bot rather
    than a real user interaction.
- name: is_default_browser
  type: BOOLEAN
  description: A flag indicating whether the browser is set as the default browser on the client side.
- name: is_desktop
  type: BOOLEAN
  description: Indicates if the client is included in the desktop KPI.
- name: is_mobile
  type: BOOLEAN
  description: Indicates if the client is included in the mobile KPI.
- name: isp_name
  type: STRING
  description: The name of the internet service provider associated with the client's IP address.
  aliases:
  - isp
- name: locale
  type: STRING
  description: Set of language- and/or country-based preferences for a user interface.
- name: normalized_channel
  description: The normalized channel the application is being distributed on.
  type: STRING
  aliases:
  - channel
  possible_values:
  - release
  - beta
  - nightly
  - aurora
  - esr
  - Other
- name: normalized_os
  type: STRING
  description: The normalized name of the operating system running at the client.
  aliases:
  - os
- name: os_code
  type: STRING
  mode: NULLABLE
  description: The operating system code based on the Common Platform Enumeration CPE.
- name: os_version
  type: STRING
  description: The operating system version running at the client prior to
    normalization (e.g. "4.18.0-553.97.1.el8_10.aarch64" or
    "6.11+parrot-amd64" for Linux; "10.0" for Windows, "25.3.0" for macOS,
    "26.3.1" for iOS, "16" for Android). Windows 10 and Windows 11 both
    show "10.0". Use `windows_build_number >= 22000` to identify
    Windows 11.
- name: normalized_os_version
  type: STRING
  description: The operating system version normalized to a consistent format
    at ingestion (e.g. "10.0" for Windows, "16" for Android, "26.3.1" for
    iOS, "25.3.0" for macOS, "6.8" for Linux). Windows 10 and Windows 11
    both show "10.0". Use `windows_build_number >= 22000` to identify
    Windows 11.
- name: os_major
  type: INTEGER
  description: Major or first part of the operating system version running at the
    client. E.g. for version "100.9.11", the major is 100.
  aliases:
  - os_major_version
  - os_version_major
- name: os_minor
  type: INTEGER
  description: Minor part of the operating system version running at the client. E.g.
    for version "100.9.11", the minor is 9.
  aliases:
  - os_minor_version
  - os_version_minor
- name: profile_group_id
  type: STRING
  description: A UUID uniquely identifying the profile group, not shared with other telemetry data.
- name: sample_id
  type: INTEGER
  description: A number, 0-99, that samples by client_id and allows filtering data for analysis.
    It is a pipeline-generated artifact that should match between pings.
- name: source_column
  type: STRING
  description: Column name in the source used to ingest the data.
- name: source_report
  type: STRING
  description: Name of the report file used to ingest the data.
  aliases:
  - source_file
- name: submission_date
  type: DATE
  description: The date when the telemetry ping is received on the server side.
- name: submission_hour
  type: TIMESTAMP
  description: The submission_timestamp truncated to the hour.
- name: submission_month
  type: DATE
  description: First calendar day of the month extracted from submission_date or
    submission_timestamp.
- name: submission_timestamp
  type: TIMESTAMP
  description: Timestamp when the ping is received on the server side.
- name: telemetry_sdk_build
  type: STRING
  description: The version of the Glean SDK at the time the ping was collected (e.g. 25.0.0).
- name: updated_at
  type: TIMESTAMP
  description: Most recent date and time when the row was updated.
  aliases:
  - updated_timestamp
  - updated_date
- name: normalized_app_name
  description: Normalized, human-readable Mozilla application name (e.g., 'Firefox Desktop', 'Fenix', 'Firefox iOS'). Set to 'Other' for unrecognized
    names.
- name: legacy_telemetry_client_id
  description: UUID identifying the client from pre-Glean (legacy) telemetry. Null when legacy telemetry was not initialized or is not applicable.
- name: additional_properties
  description: JSON string of payload properties not mapped to typed schema columns, preserving extra fields outside the structured schema.
- name: event_timestamp
  description: Timestamp when the event occurred, as reported by the client or source. Precision and reference point vary by platform and pipeline.
- name: event_name
  description: Name of the recorded event identifying the specific action within its category. Together with event_category, uniquely identifies the
    event type.
- name: event_category
  description: Category grouping related events by functional area, as defined in the application's metrics configuration (e.g., 'normandy', 'navigation').
- name: event
  description: Glean or telemetry event name within its category, identifying the specific action recorded. Together with the category, uniquely identifies
    the interaction type.
- name: city
  description: City associated with the client's IP address via geolocation. Set to 'unknown' or '??' when undetermined or below the population threshold.
- name: event_id
  description: UUID uniquely identifying a single event row. Use COUNT(DISTINCT event_id) when aggregating across unnested result sets to avoid double-counting.
- name: reason
  description: 'Reason associated with the event or record. Meaning depends on context: ping submission reason, subscription event cause, or free-text
    explanation.'
- name: days_seen_bits
  description: 28-bit bitmask for the days within the last 28 days the client sent a ping. Bit 0 is the current submission date; higher bits are earlier
    days.
- name: event_extra
  description: JSON object of additional key-value pairs specific to the event, supplementing standard fields. Keys and values vary by event type.
- name: experiments
  description: JSON object listing Nimbus experiments and rollouts the client was enrolled in at ping time, with slug and branch for each enrollment.
- name: device_manufacturer
  description: Manufacturer of the device running the application (e.g., 'Samsung', 'Google'). Null when undetermined or not applicable to the platform.
- name: app_channel
  description: Release channel on which the application is distributed, as reported by the client (e.g., 'release', 'beta', 'nightly').
- name: device_model
  description: Model identifier of the device running the application. On Android this is Build.MODEL; on iOS the hardware identifier (e.g., 'iPhone14,5').
    Null for desktop.
- name: is_new_profile
  description: True if the client's profile was first created on the current submission_date (i.e., equals first_seen_date); false for returning clients.
- name: policies_is_enterprise
  description: True if the client is determined to be an enterprise user based on managed policy signals. Null when enterprise status cannot be determined.
- name: active_hours_sum
  description: Total hours the browser was actively used by the client, computed from 5-second active tick intervals with detected user input.
- name: app_build
  description: Build identifier generated by the CI system for the application (e.g., '1234/A'). Set to 'Unknown' when not provided through configuration.
- name: attribution_dltoken
  description: Unique token generated at Firefox download time for installation attribution. Null when download attribution data is unavailable.
- name: days_active_bits
  description: 28-bit bitmask for the days within the last 28 days on which the client was active. Bit 0 is the current submission date; higher bits
    are earlier days.
- name: days_created_profile_bits
  description: 28-bit bitmask for the days within the last 28 days on which this client's profile was created. Used to identify new-profile cohorts.
- name: durations
  description: Total foreground session duration across all baseline pings on the relevant date. In seconds for mobile; in hours for desktop.
- name: install_source
  description: Source from which the application was installed. On Android, the package name of the installing app (e.g., 'com.android.vending' for
    Google Play).
- name: windows_build_number
  description: Windows OS build number reported by the OS (e.g., 19041 for Windows 10 2004, 22000 for Windows 11). Null for non-Windows platforms.
- name: android_sdk_version
  description: Android SDK API level on the device (e.g., '35' for Android 15). Null for non-Android platforms.
- name: geo_subdivision
  description: First-level administrative subdivision code (e.g., state or province) from IP geolocation. Null when undetermined.
- name: attribution_dlsource
  description: Identifier for the download site or channel from which Firefox was installed (e.g., 'mozorg', 'fxdotcom'). Null when unavailable.
- name: attribution_ua
  description: User agent string of the browser used to download the Firefox installer, captured at install time. Common values include 'chrome' or
    'firefox'.
- name: days_seen_session_end_bits
  description: 28-bit bitmask for the days within the last 28 days on which this client recorded a session end event. Bit 0 is the current submission
    date.
- name: days_seen_session_start_bits
  description: 28-bit bitmask for the days within the last 28 days on which this client recorded a session start event. Bit 0 is the current submission
    date.
- name: distribution_version
  description: Version string of the Firefox distribution package for this installation (e.g., '1.0', '2023.6'). Null when no partner distribution
    is configured.
- name: document_event_number
  description: Ordinal position of this event within its source document or ping, used to distinguish multiple events emitted in the same submission.
- name: browser_engagement_active_ticks
  description: Count of 5-second intervals with detected keyboard or mouse activity during the browser session.
- name: browser_engagement_uri_count
  description: Total count of non-unique HTTP(S) URIs visited in the browser session, including reloads after restore. Excludes private browsing URIs.
- name: distributor
  description: Name of the organization or channel that distributed this Firefox build (e.g., 'canonical', 'mozillaonline'). Read from app.distributor;
    null when absent.
- name: distributor_channel
  description: Sub-channel or tier within the distribution channel (e.g., 'mainWinStub', 'ubuntu'). Read from app.distributor.channel; null when not
    set.
- name: startup_profile_selection_reason_first
  description: Reason the Firefox profile was selected at first launch (e.g., 'default', 'firstrun-created-default'). Null when the reason was not
    recorded.
- name: attribution_msclkid
  description: Microsoft Click ID (msclkid) from Microsoft Advertising attribution, assigned at Firefox download via Bing or Microsoft Store. Null
    when not applicable.
- name: distribution_partner_id
  description: Partner identifier for this Firefox installation's distribution, from mozilla.partner.id preference. Null when no partner distribution
    is configured.
- name: metrics
  description: Nested struct of computed usage or telemetry metrics for the client, organized by metric type and name. Specific subfields vary by table
    and pipeline.
- name: days_visited_1_uri_bits
  description: 28-bit bitmask for the days within the past 28 days on which the client visited at least one URI. Bit 0 is the current submission date.
- name: days_since_seen
  description: Days elapsed since this client last sent any ping, relative to submission_date. A value of 0 means the client was seen on submission_date.
- name: days_since_created_profile
  description: Days elapsed since the client's profile was first created. Null when the creation date is unavailable.
- name: days_since_active
  description: Days elapsed since the client was last considered active, relative to submission_date. Null when the client has never been recorded
    as active.
- name: days_since_seen_session_end
  description: Days elapsed since this client last recorded a session end event, relative to submission_date. Null when none has been recorded.
- name: days_since_seen_session_start
  description: Days elapsed since this client last recorded a session start event, relative to submission_date. Null when none has been recorded.
- name: days_since_visited_1_uri
  description: Days elapsed since this client last visited at least one URI, relative to submission_date. Null when URI tracking is not available.
- name: experiment_branch
  description: Nimbus experiment branch assigned to the client (e.g., 'control', 'treatment'). Identifies which experiment variant the client experienced.
