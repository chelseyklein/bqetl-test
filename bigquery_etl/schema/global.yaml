fields:
- name: account_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: Whether the user's logged in to an FxA account.
- name: activity_segment
  type: STRING
  description: Classification of users based on their browsing activity.
    E.g., infrequent, casual, regular.
  aliases:
  - segment
  possible_values:
  - casual_user
  - core_user
  - infrequent_user
  - regular_user
  - other
- name: adjust_network
  type: STRING
  mode: NULLABLE
  description: The name of the Adjust Network that sourced the installation.
- name: app_build_id
  type: STRING
  description: The build ID of the application.
  aliases:
  - build_id
- name: app_version
  type: INTEGER
  description: User visible version string (e.g. "1.0.3") for the browser.
  aliases:
  - version
  - app_display_version
- name: app_version_major
  type: INTEGER
  description: The major version of the user visible app version string for the browser,
    e.g. "142.1.3", has major version 142
- name: app_version_minor
  type: INTEGER
  description: The minor version of the user visible app version string for the browser,
    e.g. "142.1.3" has minor version 1
- name: app_version_patch
  type: INTEGER
  description: The patch version of the user visible app version string for the browser,
    e.g. "142.1.3" has patch version 3
- name: app_name
  type: STRING
  description: The name of the browser or application.
- name: architecture
  type: STRING
  description: The architecture of the device, (e.g. "arm", "x86").
- name: branch
  type: STRING
  description: The Nimbus experiment branch to which the client was assigned
    (e.g., "control", "treatment-a", "treatment-b").
- name: attribution_campaign
  type: STRING
  description: The campaign this client/install was attributed to (utm_campaign
    value, identifying a specific marketing campaign or promotion).
- name: attribution_content
  type: STRING
  description: The attribution content; similar or the same as UTM content.
- name: attribution_experiment
  type: STRING
  description: The attribution experiment key.
- name: attribution_medium
  type: STRING
  description: The attribution medium; similar or the same as UTM medium.
- name: attribution_source
  type: STRING
  description: The attribution source; similar or the same as UTM source.
- name: attribution_variation
  type: STRING
  description: The attribution variation key.
- name: client_id
  type: STRING
  description: A unique identifier (UUID) for the client.
- name: context_id
  type: STRING
  description: A unique identifier (UUID) for clients in contextual services user
    interaction pings, e.g. top-sites ping.
- name: country
  type: STRING
  description: Name of the country in which the activity took place, as determined by
    the IP geolocation.
  aliases:
  - normalized_country
  - geo
- name: country_code
  type: STRING
  description: Code of the country in which the activity took place, as determined by
    the IP geolocation. Unknown or NULL values are normally stored as '??'.
  aliases:
  - normalized_country_code
- name: created_at
  type: TIMESTAMP
  description: Timestamp when the row was created.
  aliases:
  - created_timestamp
  - created_date
- name: dau
  type: INTEGER
  description: The number of daily active users, corresponding to the count of clients that reported
    at least one ping on the submission_date and qualify as active.
- name: first_run_date
  type: DATE
  mode: NULLABLE
  description: The date of the first run of the application.
- name: first_seen_date
  type: DATE
  mode: NULLABLE
  description: Date when the server first received a ping from this client.
- name: wau
  type: INTEGER
  description: The number of weekly active users, corresponding to the count of clients that reported
    at least one ping on the previous 7 days from the submission_date and qualify as active.
- name: mau
  type: INTEGER
  description: The number of monthly active users, corresponding to the count of clients that reported
    at least one ping on the previous 28 days from the submission_date and qualify as active.
- name: distribution_id
  type: STRING
  description: The distribution id associated with the install of Firefox.
- name: document_id
  type: STRING
  description: The document ID specified in the URI when the client sent this message.
- name: is_bot_generated
  type: BOOLEAN
  description: A flag indicating whether the record was generated by a bot rather
    than a real user interaction.
- name: is_default_browser
  type: BOOLEAN
  description: A flag indicating whether the browser is set as the default browser on the client side.
- name: is_desktop
  type: BOOLEAN
  description: Indicates if the client is included in the desktop KPI.
- name: is_mobile
  type: BOOLEAN
  description: Indicates if the client is included in the mobile KPI.
- name: isp_name
  type: STRING
  description: The name of the internet service provider associated with the client's IP address.
  aliases:
  - isp
- name: locale
  type: STRING
  description: Set of language- and/or country-based preferences for a user interface.
- name: normalized_channel
  description: The normalized channel the application is being distributed on.
  type: STRING
  aliases:
  - channel
  possible_values:
  - release
  - beta
  - nightly
  - aurora
  - esr
  - Other
- name: normalized_os
  type: STRING
  description: The normalized name of the operating system running at the client.
  aliases:
  - os
- name: os_code
  type: STRING
  mode: NULLABLE
  description: The operating system code based on the Common Platform Enumeration CPE.
- name: os_version
  type: STRING
  description: The operating system version running at the client prior to
    normalization (e.g. "4.18.0-553.97.1.el8_10.aarch64" or
    "6.11+parrot-amd64" for Linux; "10.0" for Windows, "25.3.0" for macOS,
    "26.3.1" for iOS, "16" for Android). Windows 10 and Windows 11 both
    show "10.0". Use `windows_build_number >= 22000` to identify
    Windows 11.
- name: normalized_os_version
  type: STRING
  description: The operating system version normalized to a consistent format
    at ingestion (e.g. "10.0" for Windows, "16" for Android, "26.3.1" for
    iOS, "25.3.0" for macOS, "6.8" for Linux). Windows 10 and Windows 11
    both show "10.0". Use `windows_build_number >= 22000` to identify
    Windows 11.
- name: os_major
  type: INTEGER
  description: Major or first part of the operating system version running at the
    client. E.g. for version "100.9.11", the major is 100.
  aliases:
  - os_major_version
  - os_version_major
- name: os_minor
  type: INTEGER
  description: Minor part of the operating system version running at the client. E.g.
    for version "100.9.11", the minor is 9.
  aliases:
  - os_minor_version
  - os_version_minor
- name: profile_group_id
  type: STRING
  description: A UUID uniquely identifying the profile group, not shared with other telemetry data.
- name: sample_id
  type: INTEGER
  description: A number, 0-99, that samples by client_id and allows filtering data for analysis.
    It is a pipeline-generated artifact that should match between pings.
- name: source_column
  type: STRING
  description: Column name in the source used to ingest the data.
- name: source_report
  type: STRING
  description: Name of the report file used to ingest the data.
  aliases:
  - source_file
- name: submission_date
  type: DATE
  description: The date when the telemetry ping is received on the server side.
- name: submission_hour
  type: TIMESTAMP
  description: The submission_timestamp truncated to the hour.
- name: submission_month
  type: DATE
  description: First calendar day of the month extracted from submission_date or
    submission_timestamp.
- name: submission_timestamp
  type: TIMESTAMP
  description: Timestamp when the ping is received on the server side.
- name: telemetry_sdk_build
  type: STRING
  description: The version of the Glean SDK at the time the ping was collected (e.g. 25.0.0).
- name: updated_at
  type: TIMESTAMP
  description: Most recent date and time when the row was updated.
  aliases:
  - updated_timestamp
  - updated_date
- name: normalized_app_name
  description: Normalized, human-readable Mozilla application name (e.g., 'Firefox Desktop', 'Fenix', 'Firefox iOS'). Set to 'Other' for unrecognized
    names.
- name: legacy_telemetry_client_id
  description: UUID identifying the client from pre-Glean (legacy) telemetry. Null when legacy telemetry was not initialized or is not applicable.
- name: additional_properties
  description: JSON string of payload properties not mapped to typed schema columns, preserving extra fields outside the structured schema.
- name: event_timestamp
  description: Timestamp when the event occurred, as reported by the client or source. Precision and reference point vary by platform and pipeline.
- name: event_name
  description: Name of the recorded event identifying the specific action within its category. Together with event_category, uniquely identifies the
    event type.
- name: event_category
  description: Category grouping related events by functional area, as defined in the application's metrics configuration (e.g., 'normandy', 'navigation').
- name: event
  description: Glean or telemetry event name within its category, identifying the specific action recorded. Together with the category, uniquely identifies
    the interaction type.
- name: city
  description: City associated with the client's IP address via geolocation. Set to 'unknown' or '??' when undetermined or below the population threshold.
- name: event_id
  description: UUID uniquely identifying a single event row. Use COUNT(DISTINCT event_id) when aggregating across unnested result sets to avoid double-counting.
- name: reason
  description: 'Reason associated with the event or record. Meaning depends on context: ping submission reason, subscription event cause, or free-text
    explanation.'
- name: days_seen_bits
  description: 28-bit bitmask for the days within the last 28 days the client sent a ping. Bit 0 is the current submission date; higher bits are earlier
    days.
- name: event_extra
  description: JSON object of additional key-value pairs specific to the event, supplementing standard fields. Keys and values vary by event type.
- name: experiments
  description: JSON object listing Nimbus experiments and rollouts the client was enrolled in at ping time, with slug and branch for each enrollment.
- name: device_manufacturer
  description: Manufacturer of the device running the application (e.g., 'Samsung', 'Google'). Null when undetermined or not applicable to the platform.
- name: app_channel
  description: Release channel on which the application is distributed, as reported by the client (e.g., 'release', 'beta', 'nightly').
- name: device_model
  description: Model identifier of the device running the application. On Android this is Build.MODEL; on iOS the hardware identifier (e.g., 'iPhone14,5').
    Null for desktop.
- name: is_new_profile
  description: True if the client's profile was first created on the current submission_date (i.e., equals first_seen_date); false for returning clients.
- name: policies_is_enterprise
  description: True if the client is determined to be an enterprise user based on managed policy signals. Null when enterprise status cannot be determined.
- name: active_hours_sum
  description: Total hours the browser was actively used by the client, computed from 5-second active tick intervals with detected user input.
- name: app_build
  description: Build identifier generated by the CI system for the application (e.g., '1234/A'). Set to 'Unknown' when not provided through configuration.
- name: attribution_dltoken
  description: Unique token generated at Firefox download time for installation attribution. Null when download attribution data is unavailable.
- name: days_active_bits
  description: 28-bit bitmask for the days within the last 28 days on which the client was active. Bit 0 is the current submission date; higher bits
    are earlier days.
- name: days_created_profile_bits
  description: 28-bit bitmask for the days within the last 28 days on which this client's profile was created. Used to identify new-profile cohorts.
- name: durations
  description: Total foreground session duration across all baseline pings on the relevant date. In seconds for mobile; in hours for desktop.
- name: install_source
  description: Source from which the application was installed. On Android, the package name of the installing app (e.g., 'com.android.vending' for
    Google Play).
- name: windows_build_number
  description: Windows OS build number reported by the OS (e.g., 19041 for Windows 10 2004, 22000 for Windows 11). Null for non-Windows platforms.
- name: android_sdk_version
  description: Android SDK API level on the device (e.g., '35' for Android 15). Null for non-Android platforms.
- name: geo_subdivision
  description: First-level administrative subdivision code (e.g., state or province) from IP geolocation. Null when undetermined.
- name: attribution_dlsource
  description: Identifier for the download site or channel from which Firefox was installed (e.g., 'mozorg', 'fxdotcom'). Null when unavailable.
- name: attribution_ua
  description: User agent string of the browser used to download the Firefox installer, captured at install time. Common values include 'chrome' or
    'firefox'.
- name: days_seen_session_end_bits
  description: 28-bit bitmask for the days within the last 28 days on which this client recorded a session end event. Bit 0 is the current submission
    date.
- name: days_seen_session_start_bits
  description: 28-bit bitmask for the days within the last 28 days on which this client recorded a session start event. Bit 0 is the current submission
    date.
- name: distribution_version
  description: Version string of the Firefox distribution package for this installation (e.g., '1.0', '2023.6'). Null when no partner distribution
    is configured.
- name: document_event_number
  description: Ordinal position of this event within its source document or ping, used to distinguish multiple events emitted in the same submission.
- name: browser_engagement_active_ticks
  description: Count of 5-second intervals with detected keyboard or mouse activity during the browser session.
- name: browser_engagement_uri_count
  description: Total count of non-unique HTTP(S) URIs visited in the browser session, including reloads after restore. Excludes private browsing URIs.
- name: distributor
  description: Name of the organization or channel that distributed this Firefox build (e.g., 'canonical', 'mozillaonline'). Read from app.distributor;
    null when absent.
- name: distributor_channel
  description: Sub-channel or tier within the distribution channel (e.g., 'mainWinStub', 'ubuntu'). Read from app.distributor.channel; null when not
    set.
- name: startup_profile_selection_reason_first
  description: Reason the Firefox profile was selected at first launch (e.g., 'default', 'firstrun-created-default'). Null when the reason was not
    recorded.
- name: attribution_msclkid
  description: Microsoft Click ID (msclkid) from Microsoft Advertising attribution, assigned at Firefox download via Bing or Microsoft Store. Null
    when not applicable.
- name: distribution_partner_id
  description: Partner identifier for this Firefox installation's distribution, from mozilla.partner.id preference. Null when no partner distribution
    is configured.
- name: metrics
  description: Nested struct of computed usage or telemetry metrics for the client, organized by metric type and name. Specific subfields vary by table
    and pipeline.
- name: days_visited_1_uri_bits
  description: 28-bit bitmask for the days within the past 28 days on which the client visited at least one URI. Bit 0 is the current submission date.
- name: days_since_seen
  description: Days elapsed since this client last sent any ping, relative to submission_date. A value of 0 means the client was seen on submission_date.
- name: days_since_created_profile
  description: Days elapsed since the client's profile was first created. Null when the creation date is unavailable.
- name: days_since_active
  description: Days elapsed since the client was last considered active, relative to submission_date. Null when the client has never been recorded
    as active.
- name: days_since_seen_session_end
  description: Days elapsed since this client last recorded a session end event, relative to submission_date. Null when none has been recorded.
- name: days_since_seen_session_start
  description: Days elapsed since this client last recorded a session start event, relative to submission_date. Null when none has been recorded.
- name: days_since_visited_1_uri
  description: Days elapsed since this client last visited at least one URI, relative to submission_date. Null when URI tracking is not available.
- name: experiment_branch
  description: Nimbus experiment branch assigned to the client (e.g., 'control', 'treatment'). Identifies which experiment variant the client experienced.
- name: normalized_app_id
  description: The normalized application identifier used to distinguish product variants (e.g., 'org_mozilla_firefox', 'org_mozilla_fenix'). Derived
    from the raw app ID reported in the ping.
- name: experiment
  description: The unique slug identifier of the Nimbus experiment associated with the record (e.g., 'smart-shortcuts-v4p1'). Null when the record
    is not associated with a specific experiment.
- name: total_events
  description: The total count of events recorded for the given dimension combination or time window. Excludes page-view events where applicable.
- name: window_end
  description: The end timestamp of the aggregation window for the row. Together with window_start, it defines the time interval over which events
    are counted.
- name: window_start
  description: The start timestamp of the aggregation window for the row. Together with window_end, it defines the time interval over which events
    are counted.
- name: event_extra_key
  description: A key from the extra fields map attached to a Glean event, used to further qualify or categorize the event beyond its category and name.
- name: days_sent_metrics_ping_bits
  description: A 28-bit integer bitmask recording the days within the past 28-day window on which the client sent a metrics ping, with the least-significant
    bit representing the most recent day.
- name: n_metrics_ping
  description: The number of metrics pings received from this client on or within the relevant date window.
- name: date
  description: The calendar date associated with the record, used as the primary date dimension and often the table partition key.
- name: id
  description: A unique identifier for the record within its source system. The format and scope (integer, UUID, hex string) vary by context.
- name: type
  description: A string indicating the category or kind of the record within its source system (e.g., event type, transaction type, or metric type).
- name: is_active
  description: A boolean flag indicating whether the entity (client, subscription, advertiser, or DAG) was active at the time of the record. True means
    active; false means inactive.
- name: days_seen_bytes
  description: A binary (byte-array) representation of the days this client was active over the past year, where each bit corresponds to one day and
    the rightmost bit represents the most recent day.
- name: status
  description: The current lifecycle or processing state of the record within its source system (e.g., 'active', 'open', 'closed', 'canceled'). Exact
    values depend on the source.
- name: baseline_profile_group_id
  description: A UUID identifying the profile group as reported in the baseline ping. Null when the client does not have a profile group assigned.
- name: search_count
  description: The total number of searches performed by the client or clients in the dimension grouping, across all search engines and access points.
- name: name
  description: A human-readable display name for the entity (e.g., a product, service, project, country, or add-on).
- name: days_active_bytes
  description: A binary (byte-array) representation of the days this client was considered active over the past year, where each bit corresponds to
    one day and the rightmost bit represents the most recent day.
- name: region
  description: The geographic region or subdivision code associated with the record, such as a country region, ISO subdivision code, or market identifier.
- name: source
  description: A string identifying the origin of the data or event, such as a referring domain, data pipeline, traffic channel, or upstream system.
- name: app_id
  description: The application identifier for the Mozilla product that generated the record, in dot-notation (e.g., 'org.mozilla.firefox', 'firefox.desktop').
- name: platform
  description: The operating system or platform on which the application is running (e.g., 'Windows', 'Android', 'iOS', 'web').
- name: usage_profile_id
  description: A UUID uniquely identifying a usage-reporting profile. Used to track client activity in usage-reporting tables without linking to other
    telemetry identifiers.
- name: value
  description: 'A generic value field whose meaning depends on context: a numeric measurement, a configuration value, or a string providing event-specific
    context.'
- name: url
  description: A Uniform Resource Locator (URL) associated with the record, such as a clicked link, content location, or source repository address.
- name: created
  description: The timestamp at which the entity or record was first created in the source system.
- name: state
  description: A string representing the current state of the entity in a state machine or lifecycle model (e.g., a Markov state, DAG run state, or
    email suppression state).
- name: partition_date
  description: The date used to partition the table, typically matching submission_date. Used for efficient query filtering and backfill management.
- name: product
  description: The Mozilla product associated with the record (e.g., 'Firefox', 'Firefox for Android', 'Mozilla VPN'). The level of normalization varies
    by table.
- name: campaign_id
  description: The unique identifier of the advertising or marketing campaign associated with the record, as assigned by the relevant ad platform or
    CRM system.
- name: impressions
  description: The number of times an ad or content item was displayed to users for the given dimension combination.
- name: campaign_name
  description: The human-readable name of the advertising or marketing campaign associated with the record.
- name: description
  description: A human-readable text field providing additional context or explanation for the record, such as a label, summary, or free-text note.
- name: end_date
  description: The date on which a time-bounded entity (experiment, campaign, subscription period, or job run) ended or is scheduled to end.
- name: device_type
  description: A categorical label describing the type of device from which the data was collected (e.g., 'desktop', 'mobile', 'tablet', 'phone').
- name: category
  description: A high-level classification grouping related events, content, or records into a named functional area (e.g., a Glean event category,
    content category, or issue category).
- name: language
  description: The language code representing the user's or device's language setting, expressed as an IETF BCP 47 language tag (e.g., 'en', 'de',
    'fr-FR').
- name: metric
  description: The name or identifier of the metric being measured or aggregated (e.g., a Glean metric name, KPI label, or scalar name).
- name: start_date
  description: The date on which a time-bounded entity (experiment, campaign, subscription period, or job run) began or is scheduled to begin.
- name: user_id
  description: A unique identifier for a user within the source system. The format varies by system (UUID, integer, or opaque string).
- name: active_metric_date
  description: A count or flag indicating whether the client was active on the metric date. When numeric, represents the number of active profiles
    on that date; when boolean, indicates individual client activity.
- name: country_name
  description: The full standardized name of the country associated with the record (e.g., 'United States', 'Germany'), as determined by IP geolocation
    or a static mapping.
- name: first_submission_timestamp
  description: The timestamp of the first telemetry submission received from this client for the event or criteria being tracked.
- name: new_profiles
  description: The count of newly created client profiles first seen on the relevant date for the given dimension grouping.
- name: retained_week_4
  description: A count or boolean indicating whether the client returned to use the browser during the fourth week (approximately days 21–28) after
    their first-seen date.
- name: timestamp
  description: The datetime at which the event or record occurred, as reported by the source system.
- name: update_count
  description: The number of experiment update events recorded within the aggregation window.
- name: criteria
  description: The event-filtering criteria or condition applied to determine which events are included in the table (e.g., 'any_event', 'chatbot_usage').
- name: device
  description: The device type or form factor from which the data originates (e.g., 'desktop', 'mobile', 'tablet', 'phone'). May also contain raw device
    OS strings in some sources.
- name: event_type
  description: A string identifying the category or kind of event that occurred (e.g., 'impression', 'click', 'fxa_login - complete', 'New', 'Cancelled').
- name: retained_week_4_new_profiles
  description: Count of new profiles from the metric_date that were active between days 22 and 28 after the metric_date, indicating fourth-week retention.
- name: disqualification_count
  description: Number of experiment disqualification events in the aggregation window, where clients were removed from the experiment for no longer
    meeting targeting criteria.
- name: campaign
  description: Identifier for the marketing campaign associated with the client or event, typically sourced from the utm_campaign URL parameter or
    an equivalent attribution signal.
- name: client_count
  description: The number of distinct clients represented in a row or aggregation group.
- name: default_search_engine
  description: The identifier or name of the search engine configured as the default in the browser (e.g., 'google-b-d', 'baidu', 'DuckDuckGo').
- name: duration
  description: The elapsed time of an activity or session, expressed in seconds.
- name: is_dau
  description: Boolean flag indicating whether the client is counted as a daily active user on the submission date.
- name: is_mau
  description: Boolean flag indicating whether the client is counted as a monthly active user, meaning it was active within the 28 days ending on the
    submission date.
- name: is_wau
  description: Boolean flag indicating whether the client is counted as a weekly active user, meaning it was active within the 7 days ending on the
    submission date.
- name: os_name
  description: The human-readable name of the operating system running on the client (e.g., 'Windows', 'Mac OS X', 'Android', 'Linux').
- name: paid_vs_organic
  description: Classification of the client's attribution as either 'Paid' (attributed to a paid marketing source) or 'Organic' (not attributed to
    a paid source).
- name: priority
  description: The priority level assigned to a job, task, or issue, indicating its relative urgency or importance.
- name: slug
  description: A URL-safe, human-readable identifier string used as a unique path segment or key for a resource (e.g., an article or experiment).
- name: active_hours
  description: The total number of hours the client was actively using the browser, expressed in fractional hours.
- name: app_version_is_major_release
  description: Boolean flag indicating whether the app version corresponds to a major release (patch/revision is 0), as opposed to a point or patch
    release.
- name: app_version_patch_revision
  description: The patch or revision component of the app version string (e.g., for '142.1.3' this is 3); null for major releases where the patch revision
    is 0.
- name: early_engagements
  description: The count of early engagement actions recorded for a new profile within its first days of use.
- name: num_days_active_day_2_7
  description: The number of days the client was active between day 2 and day 7 (inclusive) after the first-seen date.
- name: num_days_seen_day_2_7
  description: The number of days a ping was received from the client between day 2 and day 7 (inclusive) after the first-seen date.
- name: os_grouped
  description: The operating system name grouped into broad platform categories such as 'Windows', 'Mac', 'Linux', 'Android', 'iOS', or 'Other'.
- name: paid_vs_organic_gclid
  description: Classification of the install as 'Paid' (attributed to a Google Click ID / gclid present in the Play Store referrer) or 'Organic' (no
    gclid detected).
- name: position
  description: The ordinal position of a content element, tile, or ad slot within a page or grid layout.
- name: sap
  description: Search Access Point — the UI location from which a search was initiated (e.g., the address bar, search bar, or a contextual suggestion).
- name: subdivision1
  description: The first-level administrative subdivision (e.g., state, province, or county) inferred from the client's IP geolocation, typically using
    ISO 3166-2 subdivision codes.
- name: activity_date
  description: The date on which the activity, conversion, or event being measured took place.
- name: clients
  description: The count of distinct clients included in the aggregation.
- name: crash_signature
  description: A string that uniquely identifies the type or location of a browser crash, used to group and triage crash reports.
- name: geo_country
  description: The ISO 3166-1 alpha-2 country code inferred from the client's IP address.
- name: organic_search_count
  description: The total number of organic (non-ad-triggered) searches performed by the client or aggregation group.
- name: surface
  description: The Mozilla product surface or form factor where the event or ad was served (e.g., 'desktop', 'mobile', 'tablet').
- name: total_downloads
  description: The total number of downloads recorded for the item (e.g., an add-on or app) within the reporting period.
- name: updated
  description: Timestamp of the most recent update to the record in the source system.
- name: appVersion
  description: The user-visible version string of the application as recorded by the client at the time of the event or targeting context capture (e.g.,
    '137.0.2').
- name: as_of_date
  description: The logical date associated with the state of the data in this row, representing the point in time for which the values are valid.
- name: creation_date
  description: The date or timestamp when the record, content item, or ping was originally created.
- name: events
  description: A compact encoded representation of user interaction events associated with the client or session for the given date.
- name: expires
  description: The expiry condition for a metric or entity; can be a specific date, a version number, or 'never' if the item does not expire.
- name: fxa_uid
  description: The Firefox Accounts (FxA) user identifier (SHA-256 hex string) linking the record to a specific FxA account.
- name: index
  description: A compact string encoding of a numeric index, used to represent an event type or lookup key efficiently in compressed event columns.
- name: is_activated
  description: Boolean flag indicating whether a client or entity has met the activation criterion (e.g., returned to use the product within a defined
    window after first install).
- name: new_profile_metric_date
  description: Boolean flag indicating whether the client was a new profile on the retention metric date.
- name: plan_id
  description: The Stripe price or plan identifier for the billing plan associated with a subscription (e.g., 'price_1JmRSRJNcmPzuWtRN9MG5cBy').
- name: price
  description: The monetary price of the item or transaction, typically in the smallest currency unit (e.g., cents).
- name: product_name
  description: The human-readable name of the Mozilla product or subscription offering (e.g., 'Mozilla VPN', 'Firefox Relay', 'Relay Premium').
- name: repeat_profile
  description: Boolean flag indicating whether the client was classified as a daily active user on at least two separate days within the first 28 days
    after the profile was created.
- name: retained_week_4_new_profile
  description: Boolean flag indicating whether the client, identified as a new profile on the metric date, was retained (active) in the fourth week
    after first seen.
- name: subscription_id
  description: The Stripe subscription identifier uniquely identifying a subscriber's subscription record (e.g., 'sub_1LZXOfJNcmPzuWtRX6qIHqHA').
- name: _fivetran_synced
  description: Timestamp indicating when Fivetran last synced this record from the source system.
- name: activated
  description: Boolean flag indicating whether the client met the new-profile activation criterion, typically defined as returning to use the browser
    within the first week after install.
- name: addon_id
  description: The unique identifier string for a browser add-on (e.g., 'uBlock0@raymondhill.net', 'formautofill@mozilla.org').
- name: addon_version
  description: The version string of the browser add-on at the time of the event or observation.
- name: app
  description: The name of the application or product associated with the record (e.g., 'Firefox', 'Firefox iOS', 'Desktop').
- name: crash_count
  description: The number of application crashes recorded for a client or session within the reporting period.
- name: crash_process_type
  description: The type of process in which the crash occurred (e.g., 'main', 'content', 'gpu', 'utility'), identifying which part of the application
    was running when the crash happened.
- name: customer_id
  description: The unique identifier for a billing customer account, typically a Stripe customer ID (e.g., 'cus_MFFy4ibodsAQ0Z') or an equivalent identifier
    from another payment provider.
- name: ended_at
  description: The timestamp at which the subscription ended. Null for currently active subscriptions.
- name: first_reported_country
  description: The first country code reported by this client, as determined by IP geolocation from the earliest ping received.
- name: installs
  description: The count of successful application installations attributed to a given source, campaign, or time period.
- name: is_daily_user
  description: Whether the client is considered a daily active user on the given date, based on having reported a qualifying ping on that day.
- name: is_monthly_user
  description: Whether the client is considered a monthly active user on the given date, based on having reported a qualifying ping within the preceding
    28 days.
- name: is_weekly_user
  description: Whether the client is considered a weekly active user on the given date, based on having reported a qualifying ping within the preceding
    7 days.
- name: medium
  description: The traffic or attribution medium describing the category of the channel through which a user arrived (e.g., 'organic', 'cpc', 'referral',
    'email'), corresponding to the utm_medium parameter.
- name: model
  description: The identifier of the machine learning or AI model used to process a request (e.g., 'claude-sonnet-4-20250514', 'gpt-4o-2024-08-06').
- name: project
  description: The identifier of the cloud or organizational project under which a resource or workload is billed or operated.
- name: release_channel
  description: The Firefox release channel from which the client is reporting (e.g., 'release', 'beta', 'nightly', 'esr').
- name: run_id
  description: A zero-based integer or string identifier distinguishing individual retry attempts of a task run, where 0 represents the first attempt.
- name: time
  description: A Unix timestamp (seconds since epoch) indicating when an event occurred.
