fields:
- name: account_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: Whether the user's logged in to an FxA account.
- name: activity_segment
  type: STRING
  description: Classification of users based on their browsing activity. E.g., infrequent,
    casual, regular.
  aliases:
  - segment
  possible_values:
  - casual_user
  - core_user
  - infrequent_user
  - regular_user
  - other
- name: adjust_network
  type: STRING
  mode: NULLABLE
  description: The name of the Adjust Network that sourced the installation.
- name: app_build_id
  type: STRING
  description: The build ID of the application.
- name: app_version
  type: INTEGER
  description: User visible version string (e.g. "1.0.3") for the browser.
  aliases:
  - version
  - app_display_version
- name: app_version_major
  type: INTEGER
  description: The major version of the user visible app version string for the browser,
    e.g. "142.1.3", has major version 142
- name: app_version_minor
  type: INTEGER
  description: The minor version of the user visible app version string for the browser,
    e.g. "142.1.3" has minor version 1
- name: app_name
  type: STRING
  description: The name of the browser.
- name: architecture
  type: STRING
  description: The architecture of the device, (e.g. "arm", "x86").
- name: attribution_campaign
  type: STRING
  description: The attribution campaign; similar or the same as UTM campaign.
- name: attribution_content
  type: STRING
  description: The attribution content; similar or the same as UTM content.
- name: attribution_experiment
  type: STRING
  description: The attribution experiment key.
- name: attribution_medium
  type: STRING
  description: The attribution medium; similar or the same as UTM medium.
- name: attribution_source
  type: STRING
  description: The attribution source; similar or the same as UTM source.
- name: attribution_variation
  type: STRING
  description: The attribution variation key.
- name: client_id
  type: STRING
  description: A unique identifier (UUID) for the client.
- name: context_id
  type: STRING
  description: A unique identifier (UUID) for clients in contextual services user
    interaction pings, e.g. top-sites ping.
- name: country
  type: STRING
  description: Name of the country in which the activity took place, as determined
    by the IP geolocation.
  aliases:
  - normalized_country
  - geo
- name: country_code
  type: STRING
  description: Code of the country in which the activity took place, as determined
    by the IP geolocation. Unknown or NULL values are normally stored as '??'.
  aliases:
  - normalized_country_code
- name: created_at
  type: TIMESTAMP
  description: Timestamp when the row was created.
  aliases:
  - created_timestamp
  - created_date
- name: dau
  type: INTEGER
  description: The number of daily active users, corresponding to the count of clients
    that reported at least one ping on the submission_date and qualify as active.
- name: first_run_date
  type: DATE
  mode: NULLABLE
  description: The date of the first run of the application.
- name: first_seen_date
  type: DATE
  mode: NULLABLE
  description: Date when the server first received a ping from this client.
- name: wau
  type: INTEGER
  description: The number of weekly active users, corresponding to the count of clients
    that reported at least one ping on the previous 7 days from the submission_date
    and qualify as active.
- name: mau
  type: INTEGER
  description: The number of monthly active users, corresponding to the count of clients
    that reported at least one ping on the previous 28 days from the submission_date
    and qualify as active.
- name: distribution_id
  type: STRING
  description: The distribution id associated with the install of Firefox.
- name: document_id
  type: STRING
  description: The document ID specified in the URI when the client sent this message.
- name: is_default_browser
  type: BOOLEAN
  description: A flag indicating whether the browser is set as the default browser
    on the client side.
- name: is_desktop
  type: BOOLEAN
  description: Indicates if the client is included in the desktop KPI.
- name: is_mobile
  type: BOOLEAN
  description: Indicates if the client is included in the mobile KPI.
- name: isp_name
  type: STRING
  description: The name of the internet service provider associated with the client's
    IP address.
  aliases:
  - isp
- name: locale
  type: STRING
  description: Set of language- and/or country-based preferences for a user interface.
- name: normalized_channel
  description: The normalized channel the application is being distributed on.
  type: STRING
  aliases:
  - channel
  possible_values:
  - release
  - beta
  - nightly
  - aurora
  - esr
  - Other
- name: normalized_os
  type: STRING
  description: The normalized name of the operating system running at the client.
  aliases:
  - os
- name: os_code
  type: STRING
  mode: NULLABLE
  description: The operating system code based on the Common Platform Enumeration
    CPE.
- name: os_version
  type: INTEGER
  description: Version of the operating system version running at the client. E.g.
    "100.9.11".
  aliases:
  - normalized_os_version
- name: os_major
  type: INTEGER
  description: Major or first part of the operating system version running at the
    client. E.g. for version "100.9.11", the major is 100.
  aliases:
  - os_major_version
  - os_version_major
- name: os_minor
  type: INTEGER
  description: Minor part of the operating system version running at the client. E.g.
    for version "100.9.11", the minor is 9.
  aliases:
  - os_minor_version
  - os_version_minor
- name: profile_group_id
  type: STRING
  description: A UUID uniquely identifying the profile group, not shared with other
    telemetry data.
- name: sample_id
  type: INTEGER
  description: A number, 0-99, that samples by client_id and allows filtering data
    for analysis. It is a pipeline-generated artifact that should match between pings.
- name: source_column
  type: STRING
  description: Column name in the source used to ingest the data.
- name: source_report
  type: STRING
  description: Name of the report file used to ingest the data.
  aliases:
  - source_file
- name: submission_date
  type: DATE
  description: The date when the telemetry ping is received on the server side.
- name: submission_hour
  type: TIMESTAMP
  description: The submission_timestamp truncated to the hour.
- name: submission_month
  type: DATE
  description: First calendar day of the month extracted from submission_date or submission_timestamp.
- name: submission_timestamp
  type: TIMESTAMP
  description: Timestamp when the ping is received on the server side.
- name: telemetry_sdk_build
  type: STRING
  description: The version of the Glean SDK at the time the ping was collected (e.g.
    25.0.0).
- name: updated_at
  type: TIMESTAMP
  description: Most recent date and time when the row was updated.
  aliases:
  - updated_timestamp
  - updated_date
- name: os
  description: The name of the operating system running at the client (e.g. Android).
- name: channel
  description: The normalized release channel of the application (e.g. release, beta,
    nightly).
- name: os
  description: The name of the operating system running at the client (e.g. Android).
- name: os_version_major
  description: The major version number of the operating system (e.g. 13 for Android
    13).
- name: os_version_minor
  description: The minor version number of the operating system (e.g. 1 for Android
    13.1).
- name: segment
  description: Classification of users based on their browsing activity frequency
    (e.g. infrequent_user, casual_user, regular_user, core_user, other).
- name: channel
  description: The normalized release channel of the application (e.g. release, beta,
    nightly).
- name: os
  description: The name of the operating system running at the client (e.g. Android).
- name: os_version_major
  description: The major version number of the operating system (e.g. 13 for Android
    13).
- name: os_version_minor
  description: The minor version number of the operating system (e.g. 1 for Android
    13.1).
- name: segment
  description: Classification of users based on their browsing activity frequency
    (e.g. infrequent_user, casual_user, regular_user, core_user, other).
- name: channel
  description: The normalized release channel of the application (e.g. release, beta,
    nightly).
- name: os
  description: The name of the operating system running at the client (e.g. Android).
- name: os_version_major
  description: The major version number of the operating system (e.g. 13 for Android
    13).
- name: os_version_minor
  description: The minor version number of the operating system (e.g. 1 for Android
    13.1).
- name: segment
  description: Classification of users based on their browsing activity frequency
    (e.g. infrequent_user, casual_user, regular_user, core_user, other).
- name: channel
  description: 'The normalized release channel of the application. Observed values:
    release, beta, nightly (sampled 2026-05-28).'
- name: os
  description: The name of the operating system running at the client. All sampled
    rows are Android (sampled 2026-05-28).
- name: os_version_major
  description: 'The major version number of the operating system. Top values: 16,
    13, 14, 15, 12. A small number of rows contain anomalous values (sampled 2026-05-28).'
- name: os_version_minor
  description: The minor version number of the operating system. Most rows (95%) have
    value 0 (sampled 2026-05-28).
- name: segment
  description: 'Classification of users based on their browsing activity frequency.
    Observed values: infrequent_user, casual_user, core_user, regular_user, other
    (sampled 2026-05-28).'
- name: channel
  description: The normalized release channel of the application (e.g. release, beta,
    nightly). Null in ~91% of rows (sampled 2026-05-28).
- name: android_sdk_version
  description: The optional Android SDK version of the software running on this hardware
    device (e.g. '35' for Android 15, '36' for Android 16). Null for ~0.1% of clients
    (sampled 2026-05-28).
- name: app_display_version
  description: User visible version string (e.g. '150.0.3') for the browser.
- name: attribution.campaign
  description: The optional attribution campaign; similar to or the same as UTM campaign.
    Fully null in the sampled data (sampled 2026-05-28).
- name: attribution.content
  description: The optional attribution content; similar to or the same as UTM content.
    Fully null in the sampled data (sampled 2026-05-28).
- name: attribution.medium
  description: The optional attribution medium; similar to or the same as UTM medium.
    Fully null in the sampled data (sampled 2026-05-28).
- name: attribution.source
  description: The optional attribution source; similar to or the same as UTM source.
    Fully null in the sampled data (sampled 2026-05-28).
- name: attribution.term
  description: The optional attribution term; similar to or the same as UTM term.
    Fully null in the sampled data (sampled 2026-05-28).
- name: city
  description: Name of the city in which the activity took place, as determined by
    IP geolocation. Fully null in the sampled data, indicating this field is not populated
    in the joined view (sampled 2026-05-28).
- name: device_manufacturer
  description: The manufacturer of the device the application is running on (e.g.
    'samsung', 'Xiaomi', 'motorola') (sampled 2026-05-28).
- name: device_model
  description: The model of the device the application is running on. On Android,
    this is Build.MODEL, the user-visible marketing name, like 'Pixel 2 XL' (sampled
    2026-05-28).
- name: isp
  description: The name of the internet service provider associated with the client's
    IP address (sampled 2026-05-28).
- name: normalized_os_version
  description: The user-visible version of the operating system (e.g. '16', '15',
    '14' for Android versions) (sampled 2026-05-28).
- name: normalized_os_version
  description: The user-visible version of the operating system (e.g. '15', '14',
    '13' for Android versions). If version detection fails, set to 'Unknown' (sampled
    2026-05-28).
- name: device_manufacturer
  description: The manufacturer of the device the application is running on (e.g.
    'samsung', 'xiaomi', 'motorola') (sampled 2026-05-28).
- name: android_sdk_version
  description: The optional Android SDK version of the software running on this hardware
    device (e.g. '35' for Android 15).
- name: app_display_version
  description: User visible version string (e.g. '1.0.3') for the browser.
- name: channel
  description: The release channel of the Firefox build (e.g. 'release', 'beta', 'nightly'),
    as used for event data routing.
- name: city
  description: Name of the city in which the activity took place, as determined by
    the IP geolocation.
- name: device_manufacturer
  description: The manufacturer of the device the application is running on. Not set
    if the device manufacturer cannot be determined.
- name: device_model
  description: The model of the device the application is running on. On Android,
    this is Build.MODEL, the user-visible marketing name, like 'Pixel 2 XL'.
- name: os
  description: The name of the operating system (e.g. 'Android').
