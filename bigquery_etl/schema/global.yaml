fields:
- name: account_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: Whether the user's logged in to an FxA account.
- name: activity_segment
  type: STRING
  description: Classification of users based on their browsing activity.
    E.g., infrequent, casual, regular.
  aliases:
  - segment
  possible_values:
  - casual_user
  - core_user
  - infrequent_user
  - regular_user
  - other
- name: adjust_network
  type: STRING
  mode: NULLABLE
  description: The name of the Adjust Network that sourced the installation.
- name: app_build_id
  type: STRING
  description: The build ID of the application.
  aliases:
  - build_id
- name: app_version
  type: INTEGER
  description: User visible version string (e.g. "1.0.3") for the browser.
  aliases:
  - version
  - app_display_version
- name: app_version_major
  type: INTEGER
  description: The major version of the user visible app version string for the browser,
    e.g. "142.1.3", has major version 142
- name: app_version_minor
  type: INTEGER
  description: The minor version of the user visible app version string for the browser,
    e.g. "142.1.3" has minor version 1
- name: app_version_patch
  type: INTEGER
  description: The patch version of the user visible app version string for the browser,
    e.g. "142.1.3" has patch version 3
- name: app_name
  type: STRING
  description: The name of the browser or application.
- name: architecture
  type: STRING
  description: The architecture of the device, (e.g. "arm", "x86").
- name: branch
  type: STRING
  description: The Nimbus experiment branch to which the client was assigned
    (e.g., "control", "treatment-a", "treatment-b").
- name: attribution_campaign
  type: STRING
  description: The campaign this client/install was attributed to (utm_campaign
    value, identifying a specific marketing campaign or promotion).
- name: attribution_content
  type: STRING
  description: The attribution content; similar or the same as UTM content.
- name: attribution_experiment
  type: STRING
  description: The attribution experiment key.
- name: attribution_medium
  type: STRING
  description: The attribution medium; similar or the same as UTM medium.
- name: attribution_source
  type: STRING
  description: The attribution source; similar or the same as UTM source.
- name: attribution_variation
  type: STRING
  description: The attribution variation key.
- name: client_id
  type: STRING
  description: A unique identifier (UUID) for the client.
- name: context_id
  type: STRING
  description: A unique identifier (UUID) for clients in contextual services user
    interaction pings, e.g. top-sites ping.
- name: country
  type: STRING
  description: Name of the country in which the activity took place, as determined by
    the IP geolocation.
  aliases:
  - normalized_country
  - geo
- name: country_code
  type: STRING
  description: Code of the country in which the activity took place, as determined by
    the IP geolocation. Unknown or NULL values are normally stored as '??'.
  aliases:
  - normalized_country_code
- name: created_at
  type: TIMESTAMP
  description: Timestamp when the row was created.
  aliases:
  - created_timestamp
  - created_date
- name: dau
  type: INTEGER
  description: The number of daily active users, corresponding to the count of clients that reported
    at least one ping on the submission_date and qualify as active.
- name: first_run_date
  type: DATE
  mode: NULLABLE
  description: The date of the first run of the application.
- name: first_seen_date
  type: DATE
  mode: NULLABLE
  description: Date when the server first received a ping from this client.
- name: wau
  type: INTEGER
  description: The number of weekly active users, corresponding to the count of clients that reported
    at least one ping on the previous 7 days from the submission_date and qualify as active.
- name: mau
  type: INTEGER
  description: The number of monthly active users, corresponding to the count of clients that reported
    at least one ping on the previous 28 days from the submission_date and qualify as active.
- name: distribution_id
  type: STRING
  description: The distribution id associated with the install of Firefox.
- name: document_id
  type: STRING
  description: The document ID specified in the URI when the client sent this message.
- name: is_bot_generated
  type: BOOLEAN
  description: A flag indicating whether the record was generated by a bot rather
    than a real user interaction.
- name: is_default_browser
  type: BOOLEAN
  description: A flag indicating whether the browser is set as the default browser on the client side.
- name: is_desktop
  type: BOOLEAN
  description: Indicates if the client is included in the desktop KPI.
- name: is_mobile
  type: BOOLEAN
  description: Indicates if the client is included in the mobile KPI.
- name: isp_name
  type: STRING
  description: The name of the internet service provider associated with the client's IP address.
  aliases:
  - isp
- name: locale
  type: STRING
  description: Set of language- and/or country-based preferences for a user interface.
- name: normalized_channel
  description: The normalized channel the application is being distributed on.
  type: STRING
  aliases:
  - channel
  possible_values:
  - release
  - beta
  - nightly
  - aurora
  - esr
  - Other
- name: normalized_os
  type: STRING
  description: The normalized name of the operating system running at the client.
  aliases:
  - os
- name: os_code
  type: STRING
  mode: NULLABLE
  description: The operating system code based on the Common Platform Enumeration CPE.
- name: os_version
  type: STRING
  description: The operating system version running at the client prior to
    normalization (e.g. "4.18.0-553.97.1.el8_10.aarch64" or
    "6.11+parrot-amd64" for Linux; "10.0" for Windows, "25.3.0" for macOS,
    "26.3.1" for iOS, "16" for Android). Windows 10 and Windows 11 both
    show "10.0". Use `windows_build_number >= 22000` to identify
    Windows 11.
- name: normalized_os_version
  type: STRING
  description: The operating system version normalized to a consistent format
    at ingestion (e.g. "10.0" for Windows, "16" for Android, "26.3.1" for
    iOS, "25.3.0" for macOS, "6.8" for Linux). Windows 10 and Windows 11
    both show "10.0". Use `windows_build_number >= 22000` to identify
    Windows 11.
- name: os_major
  type: INTEGER
  description: Major or first part of the operating system version running at the
    client. E.g. for version "100.9.11", the major is 100.
  aliases:
  - os_major_version
  - os_version_major
- name: os_minor
  type: INTEGER
  description: Minor part of the operating system version running at the client. E.g.
    for version "100.9.11", the minor is 9.
  aliases:
  - os_minor_version
  - os_version_minor
- name: profile_group_id
  type: STRING
  description: A UUID uniquely identifying the profile group, not shared with other telemetry data.
- name: sample_id
  type: INTEGER
  description: A number, 0-99, that samples by client_id and allows filtering data for analysis.
    It is a pipeline-generated artifact that should match between pings.
- name: source_column
  type: STRING
  description: Column name in the source used to ingest the data.
- name: source_report
  type: STRING
  description: Name of the report file used to ingest the data.
  aliases:
  - source_file
- name: submission_date
  type: DATE
  description: The date when the telemetry ping is received on the server side.
- name: submission_hour
  type: TIMESTAMP
  description: The submission_timestamp truncated to the hour.
- name: submission_month
  type: DATE
  description: First calendar day of the month extracted from submission_date or
    submission_timestamp.
- name: submission_timestamp
  type: TIMESTAMP
  description: Timestamp when the ping is received on the server side.
- name: telemetry_sdk_build
  type: STRING
  description: The version of the Glean SDK at the time the ping was collected (e.g. 25.0.0).
- name: updated_at
  type: TIMESTAMP
  description: Most recent date and time when the row was updated.
  aliases:
  - updated_timestamp
  - updated_date
- name: _fivetran_synced
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp recording when Fivetran last synced this record from the source system.
- name: activated
  type: BOOLEAN
  mode: NULLABLE
  description: Boolean flag indicating whether the client met the new-profile activation criterion, typically defined as returning to use the product
    within the first week after installation.
- name: activations
  type: INTEGER
  mode: NULLABLE
  description: Count of new client profiles that met the activation criterion, typically defined as returning to use the application within a specified
    window after first install.
- name: active
  type: BOOLEAN
  mode: NULLABLE
  description: Indicates whether the entity (e.g., account, user, or plan) is currently active. For accounts, this typically means the account is not
    disabled and has a verified email address.
- name: active_hours
  type: FLOAT
  mode: NULLABLE
  description: The total number of hours the client spent actively using the browser, expressed in fractional hours.
- name: active_hours_sum
  type: FLOAT
  mode: NULLABLE
  description: The total number of hours the browser was actively used by the client, derived from active ticks (5-second intervals with detected user
    interaction). Null for platforms where active-tick tracking is unavailable.
- name: active_metric_date
  type: INTEGER
  mode: NULLABLE
  description: A count or boolean flag indicating whether the client or profile was active on the metric date. When used as a count, represents the
    number of active profiles on that date.
- name: activity_date
  type: DATE
  mode: NULLABLE
  description: The calendar date on which a user action or conversion event took place, which may differ from the submission date when events are reported
    with a delay.
- name: ad_click
  type: INTEGER
  mode: NULLABLE
  description: The total number of advertisement clicks recorded for the client in the reporting period, aggregated across all applicable search engines
    and access points.
- name: ad_clicks
  type: INTEGER
  mode: NULLABLE
  description: The total number of advertisement clicks recorded for the client or dimension grouping in the reporting period, aggregated across all
    applicable search access points or surfaces.
- name: ad_clicks_count
  type: INTEGER
  mode: NULLABLE
  description: Number of ad click events recorded for enrolled experiment clients in the aggregation window, counting clicks on advertisements shown
    on search engine result pages.
- name: additional_properties
  type: STRING
  mode: NULLABLE
  description: A JSON string containing any payload fields present in the original ping that were not mapped to typed columns in the schema. Preserves
    forward-compatibility with fields added after schema generation.
- name: addon_version
  type: STRING
  mode: NULLABLE
  description: The version string of the installed browser add-on or extension.
- name: android_sdk_version
  type: STRING
  mode: NULLABLE
  description: The Android SDK API level of the software running on the device (e.g. '35' for Android 15). Null for non-Android clients.
- name: appVersion
  type: STRING
  mode: NULLABLE
  description: The version string of the application as recorded by the client at the time of the event or context snapshot.
- name: app_build
  type: STRING
  mode: NULLABLE
  description: The build identifier generated by the CI system for this application version (e.g. '1234/A', '2016160439'). Set to 'Unknown' when not
    provided through configuration.
- name: app_channel
  type: STRING
  mode: NULLABLE
  description: The release channel on which the application is distributed, as reported by the client (e.g. 'release', 'beta', 'nightly'). This is
    the raw, unnormalized value; use normalized_channel for a consistent representation.
- name: app_id
  type: STRING
  mode: NULLABLE
  description: The application identifier for the Mozilla product that sent the event or ping (e.g., 'org.mozilla.firefox', 'firefox.desktop'). Uses
    dot notation as defined in the Glean app registry.
- name: app_version_is_major_release
  type: BOOLEAN
  mode: NULLABLE
  description: Boolean flag indicating whether the installed app version is a major release (i.e., the patch/revision component of the version string
    is zero).
- name: app_version_patch_revision
  type: NUMERIC
  mode: NULLABLE
  description: The patch or revision number component of the app version string (e.g., for version '142.1.3', the patch revision is 3); null for major
    releases where no patch revision exists.
- name: as_of_date
  type: DATE
  mode: NULLABLE
  description: The logical date associated with the data snapshot; rows reflect the state of the system as of this date.
- name: attributed
  type: BOOLEAN
  mode: NULLABLE
  description: True if the client or install has a known attribution source (i.e., both attribution source and medium are present); false if the install
    was organic or attribution data is unavailable.
- name: attribution_dlsource
  type: STRING
  mode: NULLABLE
  description: An identifier indicating the download source from which the Firefox installer was obtained (e.g. 'mozorg', 'fxdotcom'). Used for install
    attribution.
- name: attribution_dltoken
  type: STRING
  mode: NULLABLE
  description: A unique token generated at Firefox download time, used to attribute a specific installation to a particular download event. Null when
    download attribution is unavailable.
- name: attribution_msclkid
  type: STRING
  mode: NULLABLE
  description: The Microsoft Click ID (msclkid) from Microsoft Advertising attribution, captured at Firefox download time. Null when Microsoft attribution
    is not applicable.
- name: attribution_ua
  type: STRING
  mode: NULLABLE
  description: The browser user agent string recorded at the time the Firefox installer was downloaded, identifying the browser used to obtain the
    installer (e.g. 'chrome', 'firefox'). Null when not captured.
- name: baseline_profile_group_id
  type: STRING
  mode: NULLABLE
  description: A UUID identifying the profile group as reported in the Glean baseline ping. Identifies which group of profiles this client belongs
    to across baseline-ping-derived tables.
- name: browser
  type: STRING
  mode: NULLABLE
  description: The web browser used by the client or visitor (e.g., 'Firefox', 'Chrome', 'Safari'), as parsed from the user agent string.
- name: browser_engagement_active_ticks
  type: INTEGER
  mode: NULLABLE
  description: The number of five-second intervals during which the user was considered active (keyboard or mouse interaction detected) in the browser
    session.
- name: browser_engagement_uri_count
  type: INTEGER
  mode: NULLABLE
  description: The total number of non-unique HTTP(S) URIs visited during the browser session, including page reloads, after session restoration. URIs
    in private browsing mode or without user interaction may be excluded.
- name: campaign
  type: STRING
  mode: NULLABLE
  description: Identifier for the marketing campaign associated with an install or visit, typically sourced from the utm_campaign URL parameter or
    an equivalent attribution signal.
- name: campaign_id
  type: INTEGER
  mode: NULLABLE
  description: The unique identifier for an advertising or marketing campaign, as assigned by the originating ad platform or internal system.
- name: campaign_name
  type: STRING
  mode: NULLABLE
  description: The human-readable name of the advertising or marketing campaign associated with the record.
- name: city
  type: STRING
  mode: NULLABLE
  description: The name of the city in which the activity took place, as determined by IP geolocation. Null or '??' when the city cannot be determined
    or the population threshold is not met.
- name: clicks
  type: INTEGER
  mode: NULLABLE
  description: The total number of times a user clicked on an ad or link within the reporting period.
- name: client_count
  type: INTEGER
  mode: NULLABLE
  description: The number of distinct clients contributing to the row or aggregation.
- name: clients
  type: INTEGER
  mode: NULLABLE
  description: Count of distinct clients contributing to the aggregation.
- name: content
  type: STRING
  mode: NULLABLE
  description: The UTM content parameter associated with a traffic source or campaign, used to identify the specific link or creative variant within
    a campaign.
- name: country_name
  type: STRING
  mode: NULLABLE
  description: The full standardized name of the country associated with the record, as determined by IP geolocation or subscription data (e.g., 'United
    States', 'Germany').
- name: crash_count
  type: INTEGER
  mode: NULLABLE
  description: The number of crashes recorded for the client or entity within the observation window. A value of zero indicates no crashes occurred
    during that period.
- name: crash_process_type
  type: STRING
  mode: NULLABLE
  description: The type of process in which the crash occurred (e.g., 'main', 'content', 'gpu', 'extension'). Identifies which browser process component
    was responsible for the crash.
- name: crash_signature
  type: STRING
  mode: NULLABLE
  description: A string identifying the type or location of a browser crash, used to group and classify crash events.
- name: created
  type: TIMESTAMP
  mode: NULLABLE
  description: The timestamp at which the entity (e.g., a customer record, subscription, or plan) was first created in the source system.
- name: creation_date
  type: STRING
  mode: NULLABLE
  description: The date or timestamp when the record (e.g., question, ping, or table) was originally created.
- name: criteria
  type: STRING
  mode: NULLABLE
  description: A string or label identifying the filtering condition or eligibility rule applied to select events or clients for the given row (e.g.,
    a named event-selection criteria like 'any_event' or 'chatbot_usage').
- name: currency
  type: STRING
  mode: NULLABLE
  description: The three-letter ISO 4217 currency code (e.g., 'usd', 'eur') representing the currency used for the transaction or pricing.
- name: customer_id
  type: STRING
  mode: NULLABLE
  description: The unique identifier for the billing customer account assigned by the payment provider (e.g., a Stripe customer ID prefixed with 'cus_').
    Used to associate subscriptions and charges with a single billing customer.
- name: daily_users
  type: INTEGER
  mode: NULLABLE
  description: Count of clients that sent at least one ping on the submission date, used as the daily active user count for the given dimension grouping.
- name: days_active_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask recording the days within the last 28 days on which the client was considered active (e.g. sent a qualifying
    ping or met an activity threshold), with bit 0 (rightmost) representing the current submission date.
- name: days_active_bytes
  type: BYTES
  mode: NULLABLE
  description: A binary representation of the days this client was considered active over a trailing window, encoded as a byte sequence with the most
    recent day in the least-significant bit position.
- name: days_created_profile_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask indicating the days within the last 28 days on which this client's profile was first created. Used to identify
    newly created profiles within a rolling window.
- name: days_seen_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask indicating on which of the last 28 days the client was observed sending a ping, with bit 0 (rightmost) representing
    the current submission date and bit 27 (leftmost) representing 27 days prior.
- name: days_seen_bytes
  type: BYTES
  mode: NULLABLE
  description: A 365-bit (46-byte) binary representation of the days this client was seen over the past year, where the rightmost bit corresponds to
    the most recent day.
- name: days_seen_session_end_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask recording the days within the last 28 days on which the client recorded a session end event, with bit 0 (rightmost)
    representing the current submission date.
- name: days_seen_session_start_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask recording the days within the last 28 days on which the client recorded a session start event, with bit 0 (rightmost)
    representing the current submission date.
- name: days_sent_metrics_ping_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask recording the days within the past 28-day window on which the client sent a metrics ping, with the least-significant
    bit representing the most recent day.
- name: days_since_active
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client was last considered active (met the activity criteria). Null for clients who have never been recorded
    as active.
- name: days_since_created_profile
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client's profile was first created, derived from the profile creation date. Null when the profile creation
    date is unavailable.
- name: days_since_seen
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client was last observed sending any ping, relative to the submission date. A value of 0 means the client
    was seen on the submission date itself.
- name: days_since_seen_session_end
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client last recorded a session end event. Null when no session end has ever been recorded for the client.
- name: days_since_seen_session_start
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client last recorded a session start event. Null when no session start has ever been recorded for the client.
- name: days_since_visited_1_uri
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client last visited at least one URI. Null when URI visit tracking is unavailable or no URI visit has been
    recorded.
- name: days_visited_1_uri_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask indicating the days within the last 28 days on which the client visited at least one URI, with bit 0 (rightmost)
    representing the current submission date.
- name: default_search_engine
  type: STRING
  mode: NULLABLE
  description: The identifier or name of the default search engine configured by the client (e.g., 'google-b-d', 'baidu', 'DuckDuckGo').
- name: device
  type: STRING
  mode: NULLABLE
  description: The device type or form factor associated with the activity (e.g., 'desktop', 'mobile', 'tablet'). May also carry a raw OS or hardware
    string from certain ad-platform sources.
- name: device_manufacturer
  type: STRING
  mode: NULLABLE
  description: The manufacturer of the device on which the application is running (e.g. 'Samsung', 'Google'). Null when the manufacturer cannot be
    determined or is not applicable to the platform.
- name: device_model
  type: STRING
  mode: NULLABLE
  description: The model identifier of the device on which the application is running (e.g. 'iPhone14,5', 'SM-G955U'). On Android this is Build.MODEL,
    the user-visible marketing name. Null for platforms where device model is not applicable.
- name: device_type
  type: STRING
  mode: NULLABLE
  description: The category of device on which the activity occurred (e.g., 'Desktop', 'Mobile', 'Tablet'). Encoding and permitted values vary by source.
- name: disqualification_count
  type: INTEGER
  mode: NULLABLE
  description: Number of experiment disqualification events recorded in the aggregation window, reflecting how many times a client was removed from
    an experiment due to targeting criteria no longer being met.
- name: distribution_partner_id
  type: STRING
  mode: NULLABLE
  description: The partner identifier associated with the distribution of this Firefox install, used to attribute the installation to a specific distribution
    partner. Null when no partner ID is set.
- name: distribution_version
  type: STRING
  mode: NULLABLE
  description: The version string of the partner distribution package associated with this Firefox install. Null when no distribution is configured.
- name: distributor
  type: STRING
  mode: NULLABLE
  description: The name of the organization or channel that distributed this Firefox build (e.g. 'canonical', 'mozillaonline', 'mint'). Null when no
    distributor is set (standard Mozilla distribution).
- name: distributor_channel
  type: STRING
  mode: NULLABLE
  description: The specific sub-channel or tier within the distributor's distribution network (e.g. 'mainWinStub', 'ubuntu'). Null when no distributor
    channel is configured.
- name: document_event_number
  type: INTEGER
  mode: NULLABLE
  description: The sequential index of an event within its source document or ping, used to preserve ordering when a single submission contains multiple
    events.
- name: duration
  type: FLOAT
  mode: NULLABLE
  description: A time interval measured in seconds representing the elapsed time of a task, session, or participation window.
- name: durations
  type: INTEGER
  mode: NULLABLE
  description: The total foreground session duration in seconds for the client on the relevant date, aggregated across all baseline pings received.
    For desktop, this may be expressed in hours depending on the table.
- name: early_engagements
  type: INTEGER
  mode: NULLABLE
  description: Count of early-engagement events recorded for a new profile within the first few days after installation, used to measure initial activation
    quality.
- name: email
  type: STRING
  mode: NULLABLE
  description: The primary email address associated with the user or contact. This field contains personally identifiable information (PII) and should
    be handled accordingly.
- name: end_date
  type: DATE
  mode: NULLABLE
  description: The date or timestamp marking the end of the period or entity described by the record (e.g., experiment end date, subscription end date,
    or time-window boundary).
- name: ended_at
  type: TIMESTAMP
  mode: NULLABLE
  description: The timestamp at which the subscription or entity definitively ended. Null for records that are still active.
- name: enroll_count
  type: INTEGER
  mode: NULLABLE
  description: Number of experiment enrollment events recorded in the aggregation window, reflecting how many times clients were successfully enrolled
    into an experiment branch.
- name: enroll_failed_count
  type: INTEGER
  mode: NULLABLE
  description: Number of failed experiment enrollment attempts recorded in the aggregation window, where the client attempted but did not successfully
    join an experiment.
- name: event
  type: STRING
  mode: NULLABLE
  description: The name of the event within its category, identifying the specific user action or system occurrence that was recorded (e.g. 'trigger.reason',
    'click', 'open'). Together with the category, uniquely identifies the event type.
- name: event_category
  type: STRING
  mode: NULLABLE
  description: The category of the recorded event as defined in the application's metrics configuration (e.g. 'normandy', 'navigation'). Groups related
    events by functional area.
- name: event_date
  type: DATE
  mode: NULLABLE
  description: The calendar date on which the event occurred or was recorded.
- name: event_extra
  type: JSON
  mode: NULLABLE
  description: A JSON object containing additional event-specific key-value pairs that supplement the core event fields. The set of keys varies by
    event type and is defined in the application's metrics configuration.
- name: event_extra_key
  type: STRING
  mode: NULLABLE
  description: The name of an extra key attached to a telemetry event, used to further classify or parameterize the event beyond its category and name.
- name: event_id
  type: STRING
  mode: NULLABLE
  description: A UUID that uniquely identifies a single event row. Use COUNT(DISTINCT event_id) to count events accurately when unnesting repeated
    event structures.
- name: event_name
  type: STRING
  mode: NULLABLE
  description: The name of the recorded event as defined in the application's metrics configuration (e.g. 'engagement', 'abandonment'). Together with
    event_category, uniquely identifies the type of interaction.
- name: event_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: The timestamp at which the event occurred on the client side. The exact semantics (wall-clock time, session-relative offset, or server-assigned
    time) vary by data source.
- name: event_type
  type: STRING
  mode: NULLABLE
  description: The high-level type or category of the recorded event, describing what kind of interaction or lifecycle change occurred (e.g., 'login',
    'New', 'Cancelled', 'contact').
- name: experiment
  type: STRING
  mode: NULLABLE
  description: The unique slug identifier of the Nimbus experiment for which data is aggregated or recorded (e.g., 'smart-shortcuts-v4p1'). Null when
    the row is not scoped to a specific experiment.
- name: experiment_branch
  type: STRING
  mode: NULLABLE
  description: The experiment branch to which the client was assigned (e.g. 'control', 'treatment'). Identifies which variant of an experiment a given
    record is associated with.
- name: experiments
  type: ARRAY<STRUCT<key STRING, value STRUCT<branch STRING, extra STRUCT<type STRING, enrollment_id STRING>>>>
  mode: REQUIRED
  description: An array of key-value pairs listing the Nimbus experiments and rollouts the client was enrolled in at the time of the ping, where the
    key is the experiment slug and the value contains the assigned branch and enrollment metadata.
- name: expires
  type: TIMESTAMP
  mode: NULLABLE
  description: The expiry specification for a metric or probe, expressed as 'never', a calendar date, or a browser version number after which collection
    stops.
- name: exposure_count
  type: INTEGER
  mode: NULLABLE
  description: Number of experiment exposure events recorded in the aggregation window, reflecting how many times enrolled clients encountered the
    experimental feature or surface being tested.
- name: first_event_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: The timestamp of the first qualifying event observed for the client, used to anchor event-based cohort or first-seen analysis.
- name: first_reported_country
  type: STRING
  mode: NULLABLE
  description: The first country code reported by the client, as observed in the earliest ping received from that client. Represents the country at
    the time of initial activity.
- name: first_seen_city
  type: STRING
  mode: NULLABLE
  description: The city where the client was first observed, as determined by IP geolocation on the date of first contact with Mozilla's telemetry
    pipeline.
- name: first_seen_city_date
  type: DATE
  mode: NULLABLE
  description: The date on which the client's first-seen city was recorded, corresponding to the earliest geolocation observation for the client.
- name: first_seen_country
  type: STRING
  mode: NULLABLE
  description: The ISO 3166-1 alpha-2 country code of the country where the client was first observed, as determined by IP geolocation on the date
    of first contact with Mozilla's telemetry pipeline.
- name: first_seen_subdivision1
  type: STRING
  mode: NULLABLE
  description: The first-level administrative subdivision (e.g., state or province code) where the client was first observed, as determined by IP geolocation
    on the date of first contact with Mozilla's telemetry pipeline.
- name: first_seen_subdivision2
  type: STRING
  mode: NULLABLE
  description: The second-level administrative subdivision where the client was first observed, as determined by IP geolocation. Not applicable for
    most countries and is typically null.
- name: first_seen_year
  type: INTEGER
  mode: NULLABLE
  description: The calendar year in which the client profile was first observed by Mozilla's telemetry pipeline, extracted from first_seen_date and
    used for cohort-level analysis.
- name: first_submission_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: The timestamp of the first telemetry submission received from this client for the relevant event or entity, as recorded on the server
    side.
- name: fxa_uid
  type: STRING
  mode: NULLABLE
  description: The Firefox Accounts user ID (SHA-256 hex string) that uniquely identifies a Mozilla account holder.
- name: geo_country
  type: STRING
  mode: NULLABLE
  description: ISO 3166-1 alpha-2 country code derived from the client's IP address geolocation.
- name: geo_subdivision
  type: STRING
  mode: NULLABLE
  description: The first-level administrative subdivision (e.g. state, province, or region) of the client's IP-geolocated location. Null when the subdivision
    cannot be determined.
- name: graduate_count
  type: INTEGER
  mode: NULLABLE
  description: Number of experiment graduation events recorded in the aggregation window, reflecting how many times clients transitioned out of an
    experiment upon its conclusion.
- name: impressions
  type: INTEGER
  mode: NULLABLE
  description: The count of times an ad, content item, or search result was displayed to a user for the given dimension combination in the aggregation
    period.
- name: install_source
  type: STRING
  mode: NULLABLE
  description: The source from which the application was installed (e.g. 'com.android.vending' for Google Play Store on Android). Null or absent when
    the install source cannot be determined.
- name: installs
  type: INTEGER
  mode: NULLABLE
  description: The count of successful installations within the observation period or cohort. Excludes reinstalls, upgrades, or ineligible install
    events unless the specific table indicates otherwise.
- name: is_activated
  type: BOOLEAN
  mode: NULLABLE
  description: Boolean flag indicating whether a client or entity has met the defined activation criterion (e.g., returning to use the product within
    a specified window after first install).
- name: is_active
  type: BOOLEAN
  mode: NULLABLE
  description: Boolean flag indicating whether the entity (e.g., subscription, client, advertiser, or DAG) was active at the time of the record. True
    means active; false means inactive or churned.
- name: is_daily_user
  type: BOOLEAN
  mode: NULLABLE
  description: Boolean flag indicating whether the client qualifies as a daily active user on the given submission date, meaning a qualifying activity
    ping was received on that day.
- name: is_dau
  type: BOOLEAN
  mode: NULLABLE
  description: Boolean flag indicating whether the client qualifies as a daily active user on the given submission date.
- name: is_mau
  type: BOOLEAN
  mode: NULLABLE
  description: Boolean flag indicating whether the client qualifies as a monthly active user, i.e., was active at least once in the 28 days ending
    on the submission date.
- name: is_monthly_user
  type: BOOLEAN
  mode: NULLABLE
  description: Boolean flag indicating whether the client qualifies as a monthly active user on the given submission date, meaning a qualifying ping
    was received within the preceding 28 days inclusive.
- name: is_new_profile
  type: BOOLEAN
  mode: NULLABLE
  description: True if the client's profile was created for the first time on the submission date (i.e. submission_date equals first_seen_date), indicating
    a new profile; false for returning clients.
- name: is_wau
  type: BOOLEAN
  mode: NULLABLE
  description: Boolean flag indicating whether the client qualifies as a weekly active user, i.e., was active at least once in the 7 days ending on
    the submission date.
- name: is_weekly_user
  type: BOOLEAN
  mode: NULLABLE
  description: Boolean flag indicating whether the client qualifies as a weekly active user on the given submission date, meaning a qualifying ping
    was received within the preceding 7 days inclusive.
- name: language
  type: STRING
  mode: NULLABLE
  description: The language setting of the user's device or account, typically expressed as an IETF BCP 47 language tag (e.g., 'en-US', 'de-DE').
- name: last_seen_city
  type: STRING
  mode: NULLABLE
  description: The city where the client was most recently observed, as determined by IP geolocation on the date of last contact with Mozilla's telemetry
    pipeline.
- name: last_seen_city_date
  type: DATE
  mode: NULLABLE
  description: The date on which the client's last-seen city was recorded, corresponding to the most recent geolocation observation for the client.
- name: last_seen_country
  type: STRING
  mode: NULLABLE
  description: The ISO 3166-1 alpha-2 country code of the country where the client was most recently observed, as determined by IP geolocation on the
    date of last contact with Mozilla's telemetry pipeline.
- name: last_seen_subdivision1
  type: STRING
  mode: NULLABLE
  description: The first-level administrative subdivision (e.g., state or province code) where the client was most recently observed, as determined
    by IP geolocation on the date of last contact with Mozilla's telemetry pipeline.
- name: last_seen_subdivision2
  type: STRING
  mode: NULLABLE
  description: The second-level administrative subdivision where the client was most recently observed, as determined by IP geolocation. Not applicable
    for most countries and is typically null.
- name: legacy_telemetry_client_id
  type: STRING
  mode: NULLABLE
  description: A UUID identifying the client from the pre-Glean (legacy) telemetry pipeline. Null when legacy telemetry was not initialized or is not
    applicable for the platform.
- name: metric
  type: STRING
  mode: NULLABLE
  description: The name of the specific metric or measurement being recorded or aggregated for the row (e.g., a Glean metric name, a KPI name, or a
    scalar identifier).
- name: metric_date
  type: DATE
  mode: NULLABLE
  description: The reference date used as the anchor for a retention or feature-usage measurement, typically representing the cohort date from which
    downstream activity is measured.
- name: metrics
  type: STRUCT<labeled_counter STRUCT<glean_error_invalid_label ARRAY<STRUCT<key STRING, value INT64>>, glean_error_invalid_overflow ARRAY<STRUCT<key
    STRING, value INT64>>, glean_error_invalid_state ARRAY<STRUCT<key STRING, value INT64>>, glean_error_invalid_value ARRAY<STRUCT<key STRING, value
    INT64>>>, string STRUCT<glean_client_annotation_experimentation_id STRING>, string_list STRUCT<glean_ping_uploader_capabilities ARRAY<STRING>>>
  mode: NULLABLE
  description: A nested struct containing Glean metric values collected with the ping. The structure varies by ping type and is defined by the application's
    metrics.yaml; consult the Glean Dictionary for field-level documentation.
- name: monthly_users
  type: INTEGER
  mode: NULLABLE
  description: Count of clients that sent at least one ping in the 28-day window ending on the submission date, used as the monthly active user count
    for the given dimension grouping.
- name: n_metrics_ping
  type: INTEGER
  mode: NULLABLE
  description: The number of metrics pings received from this client on the submission date or within the aggregation window.
- name: new_profile_metric_date
  type: BOOLEAN
  mode: NULLABLE
  description: Boolean flag indicating whether the client's profile was newly created on the metric date being evaluated.
- name: new_profiles
  type: INTEGER
  mode: NULLABLE
  description: The count of client profiles first seen on the date or within the dimension grouping represented by the row.
- name: new_profiles_metric_date
  type: INTEGER
  mode: NULLABLE
  description: Count of new client profiles first seen on the metric date, used as the cohort base for retention calculations.
- name: normalized_app_id
  type: STRING
  mode: NULLABLE
  description: The normalized application identifier for the Mozilla product (e.g., 'org_mozilla_firefox', 'org_mozilla_fenix'). Distinguishes product
    variants and release channels within the same product family.
- name: normalized_app_name
  type: STRING
  mode: NULLABLE
  description: The normalized, human-readable name of the Mozilla application (e.g. 'Firefox Desktop', 'Fenix', 'Firefox iOS', 'Focus Android'). Set
    to 'Other' when the application name is unrecognized.
- name: num_days_active_day_2_7
  type: INTEGER
  mode: NULLABLE
  description: The number of days the client was active between day 2 and day 7 (inclusive) after the first-seen date.
- name: num_days_seen_day_2_7
  type: INTEGER
  mode: NULLABLE
  description: The number of days the client submitted a ping between day 2 and day 7 (inclusive) after the first-seen date.
- name: organic_search_count
  type: INTEGER
  mode: NULLABLE
  description: The total number of organic (non-ad-click) searches performed by the client or cohort.
- name: os_grouped
  type: STRING
  mode: NULLABLE
  description: Operating system grouped into high-level categories such as 'Windows', 'Mac', 'Linux', 'Android', 'iOS', or 'Other'.
- name: os_name
  type: STRING
  mode: NULLABLE
  description: The human-readable name of the operating system on which the client was running (e.g., 'Windows', 'Mac', 'Android').
- name: paid_vs_organic
  type: STRING
  mode: NULLABLE
  description: Classification of a client's attribution as 'Paid' (attributed to a paid marketing channel) or 'Organic' (not attributed to paid spend).
- name: paid_vs_organic_gclid
  type: STRING
  mode: NULLABLE
  description: Classification of an install as 'Paid' when the install referrer response contains a Google Click ID (gclid), or 'Organic' otherwise.
- name: partition_date
  type: TIMESTAMP
  mode: NULLABLE
  description: The date used to partition this table's storage, typically matching submission_date and included to enable efficient partition-pruning
    queries.
- name: ping_sent_metric_date
  type: INTEGER
  mode: NULLABLE
  description: Count of client profiles that sent a telemetry ping on the metric date, used to measure activity at the cohort anchor point.
- name: ping_sent_week_4
  type: INTEGER
  mode: NULLABLE
  description: Count of client profiles that sent a telemetry ping between days 22 and 28 after the metric date, used to measure four-week retention.
- name: plan_id
  type: STRING
  mode: NULLABLE
  description: The Stripe price or plan identifier (e.g., 'price_1JmRSRJNcmPzuWtRN9MG5cBy') representing the billing plan associated with a subscription.
- name: platform
  type: STRING
  mode: NULLABLE
  description: The operating system or device platform on which the event or activity occurred (e.g., 'Windows', 'Android', 'iOS', 'web'). Encoding
    and granularity vary by source.
- name: policies_is_enterprise
  type: BOOLEAN
  mode: NULLABLE
  description: True if the client is determined to be an enterprise user based on various policy signals (e.g. presence of managed policies). Null
    when the determination cannot be made.
- name: position
  type: INTEGER
  mode: NULLABLE
  description: The ordinal position of a content or ad element within a page or grid layout; indexing convention (0-based or 1-based) may vary by context.
- name: price
  type: FLOAT
  mode: NULLABLE
  description: The monetary price associated with a product, ad placement, or billing item.
- name: priority
  type: STRING
  mode: NULLABLE
  description: A label indicating the importance or urgency level assigned to a record (e.g., job, issue, or task).
- name: product
  type: STRING
  mode: NULLABLE
  description: The Mozilla product or ad product associated with the record (e.g., 'Firefox', 'tile', 'spoc'). Interpretation and normalization depend
    on the source system.
- name: product_id
  type: STRING
  mode: NULLABLE
  description: An identifier for a product record, which may represent a Mozilla ad product, a subscription product, or a reference to a product in
    an external system such as Stripe or an ad server.
- name: product_name
  type: STRING
  mode: NULLABLE
  description: The human-readable name of the Mozilla product or service the user is subscribed to or interacting with (e.g., 'Mozilla VPN', 'Firefox
    Relay').
- name: provider
  type: STRING
  mode: NULLABLE
  description: The name of the external service or platform that provides the resource, product, or service described by the row (e.g., an ad server,
    subscription platform, or AI service).
- name: reason
  type: STRING
  mode: NULLABLE
  description: 'The reason associated with the record, whose meaning depends on context: the reason a ping was submitted, the cause of an event, or
    an explanation for a status change. Specific values are defined per ping type or data source.'
- name: region
  type: STRING
  mode: NULLABLE
  description: The geographic region (e.g., a country subdivision or market area) associated with the client or event. Encoding and granularity vary
    by source (e.g., ISO subdivision code, free-text region name).
- name: release_channel
  type: STRING
  mode: NULLABLE
  description: The Firefox release channel on the client at the time the event or ping was recorded (e.g., 'release', 'beta', 'nightly', 'esr'). Reflects
    the raw channel value, distinct from the normalized channel.
- name: repeat_profile
  type: BOOLEAN
  mode: NULLABLE
  description: Boolean flag indicating whether a new profile from the metric date was counted as a daily active user on at least two separate days
    within their first 28 days.
- name: repeat_profiles
  type: INTEGER
  mode: NULLABLE
  description: Count of new profiles created on the metric date that were recorded as daily active users at least twice in the following 28-day window,
    indicating early retention.
- name: retained_week_4
  type: INTEGER
  mode: NULLABLE
  description: A count or boolean indicating whether the client returned during the fourth week (approximately days 21–28) after the profile's first-seen
    date, used as a 28-day retention metric.
- name: retained_week_4_new_profile
  type: BOOLEAN
  mode: NULLABLE
  description: Boolean flag indicating whether a new profile from the metric date was retained through week 4 (i.e., submitted at least one qualifying
    ping in the fourth week after first seen).
- name: retained_week_4_new_profiles
  type: INTEGER
  mode: NULLABLE
  description: Count of new profiles created on the metric date that were recorded as daily active users at least once between days 22 and 28 after
    the metric date, indicating four-week retention.
- name: sap
  type: INTEGER
  mode: NULLABLE
  description: Search Access Point — the entry point through which a user initiated a search (e.g., the address bar, a search box, or a new-tab tile).
- name: search_count
  type: INTEGER
  mode: NULLABLE
  description: The total number of searches performed by the client or cohort for the given dimension combination on the submission date or aggregation
    window.
- name: search_with_ads
  type: INTEGER
  mode: NULLABLE
  description: The total number of search engine result pages that contained advertisements, seen by the client or dimension grouping in the reporting
    period.
- name: search_with_ads_count
  type: INTEGER
  mode: NULLABLE
  description: Number of search engine result pages that contained advertisements, as recorded for enrolled experiment clients in the aggregation window.
- name: sessions
  type: INTEGER
  mode: NULLABLE
  description: The number of distinct browsing sessions recorded for the client or dimension grouping in the reporting period.
- name: slug
  type: STRING
  mode: NULLABLE
  description: A URL-safe string identifier used as a path segment to uniquely reference a resource (e.g., an article, experiment, or content item).
- name: start_date
  type: DATE
  mode: NULLABLE
  description: The date or timestamp marking the beginning of the period or entity described by the record (e.g., experiment start date, subscription
    start date, or time-window boundary).
- name: startup_profile_selection_reason_first
  type: STRING
  mode: NULLABLE
  description: The reason the Firefox profile was selected when the browser first launched (e.g. 'default', 'firstrun-created-default', 'restart').
    Null when the selection reason was not recorded.
- name: subdivision1
  type: STRING
  mode: NULLABLE
  description: The first-level administrative subdivision (e.g., state, province, or region) derived from IP geolocation, typically represented as
    an ISO 3166-2 subdivision code.
- name: subscription_id
  type: STRING
  mode: NULLABLE
  description: The Stripe subscription identifier (e.g., 'sub_1LZXOfJNcmPzuWtRX6qIHqHA') that uniquely identifies a subscriber's subscription record.
- name: surface
  type: STRING
  mode: NULLABLE
  description: The high-level platform or form factor on which the client is running (e.g., 'desktop', 'mobile', 'tablet').
- name: timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: The date and time at which the event, change, or data point occurred, as recorded by the originating system. Precision and timezone
    encoding vary by source.
- name: total_downloads
  type: INTEGER
  mode: NULLABLE
  description: The total number of times a resource (such as an app or add-on) was downloaded in the reporting period.
- name: total_events
  type: INTEGER
  mode: NULLABLE
  description: The total count of events recorded for the given dimension combination in the aggregation period. Excludes page-view events where distinguished.
- name: unenroll_count
  type: INTEGER
  mode: NULLABLE
  description: Number of experiment unenrollment events recorded in the aggregation window, reflecting how many times clients exited an experiment
    before its conclusion.
- name: unenroll_failed_count
  type: INTEGER
  mode: NULLABLE
  description: Number of failed experiment unenrollment attempts recorded in the aggregation window, where a client attempted but did not successfully
    exit an experiment.
- name: update_count
  type: INTEGER
  mode: NULLABLE
  description: The count of update events recorded for the entity within the aggregation window.
- name: update_failed_count
  type: INTEGER
  mode: NULLABLE
  description: Number of failed experiment recipe update attempts recorded in the aggregation window, where the client could not successfully apply
    an updated experiment configuration.
- name: updated
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp indicating when the record was last modified in the source system.
- name: uri_count
  type: INTEGER
  mode: NULLABLE
  description: The total number of URIs (web pages) visited by the client in the reporting period, derived from browser engagement scalars or equivalent
    telemetry.
- name: usage_profile_id
  type: STRING
  mode: NULLABLE
  description: A UUID that uniquely identifies a Firefox usage-reporting profile. Used as the primary identifier in usage-reporting pipeline tables.
- name: user_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier for a user within the source system. The format and scoping (e.g., UUID, integer, or hex string) depend on the system
    of origin.
- name: validation_failed_count
  type: INTEGER
  mode: NULLABLE
  description: Number of experiment validation failure events recorded in the aggregation window, where a client's experiment configuration failed
    a validation check.
- name: weekly_users
  type: INTEGER
  mode: NULLABLE
  description: Count of clients that sent at least one ping in the 7-day window ending on the submission date, used as the weekly active user count
    for the given dimension grouping.
- name: window_end
  type: TIMESTAMP
  mode: NULLABLE
  description: The exclusive end timestamp of the aggregation window for the row's time-bucketed metrics.
- name: window_start
  type: TIMESTAMP
  mode: NULLABLE
  description: The inclusive start timestamp of the aggregation window for the row's time-bucketed metrics.
- name: windows_build_number
  type: INTEGER
  mode: NULLABLE
  description: The Windows OS build number as reported by the operating system (e.g. 22000 for Windows 11 21H2). Null for non-Windows clients.
