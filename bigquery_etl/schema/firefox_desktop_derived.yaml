fields:
- name: additional_properties
  description: JSON string containing any fields from the ping payload that were not explicitly mapped to columns, preserved for forward compatibility.
- name: client_info.android_sdk_version
  description: The Android SDK version of the operating system on the hardware device, if applicable. Not set on non-Android platforms.
- name: client_info.app_build
  description: The build identifier generated by the CI system (e.g. "1234/A"). Set to 'Unknown' when not provided through configuration.
- name: client_info.app_channel
  description: The channel the application is being distributed on (e.g. "release", "beta", "nightly").
- name: client_info.app_display_version
  description: The user-visible version string of the application (e.g. "1.0.3"). Set to 'Unknown' when not provided through configuration.
- name: client_info.attribution.ext
  description: Extended attribution fields not covered by the standard attribution columns, stored as a JSON object.
- name: client_info.build_date
  description: The date and time the application was built, as reported by the Glean SDK.
- name: client_info.device_manufacturer
  description: The manufacturer of the device on which the application is running. Not set when the manufacturer cannot be determined; currently collected only on
    Android and iOS.
- name: client_info.device_model
  description: The model of the device on which the application is running (e.g. "Pixel 2 XL" on Android). Not set when the model cannot be determined; currently
    collected only on Android and iOS.
- name: client_info.distribution.ext
  description: Extended distribution fields not covered by the standard distribution columns, stored as a JSON object.
- name: client_info.distribution.name
  description: The optional distribution name for this client, identifying a partner name or distribution configuration preset.
- name: client_info.session_count
  description: The running count of sessions started by this client since the first run.
- name: client_info.session_id
  description: A UUID identifying the current browser session for this client.
- name: client_info.windows_build_number
  description: The Windows build number as reported by the OS (e.g. 22000). Only set on Windows; null on other platforms. Values >= 22000 indicate Windows 11.
- name: events.category
  description: The category of each Glean event within the events array, grouping related events by functional area (e.g. "perf" for performance-related events).
- name: events.name
  description: The name of each Glean event within the events array, identifying the specific event type (e.g. "page_load" for a top-level content document load).
- name: events.session.event_seq
  description: The sequential index of each event within its session, used to order events within the session recorded in each entry of the events array.
- name: events.session.session_id
  description: The UUID identifying the session in which each event in the events array was recorded.
- name: events.session.session_sample_rate
  description: The sampling rate applied to the session for each event in the events array, expressed as a float between 0 and 1. Used to weight events recorded under
    session sampling.
- name: events.session.session_seq
  description: The sequential index of the session within the client's overall session history for each event in the events array.
- name: events.session.session_start_time
  description: The ISO 8601 start time of the session in which each event in the events array was recorded.
- name: events.timestamp
  description: The time offset in milliseconds from the start of the ping collection window to when each event in the events array was recorded.
- name: metadata.geo.city
  description: The city where the client is located, derived from IP geolocation.
- name: metadata.geo.country
  description: The country where the client is located, derived from IP geolocation.
- name: metadata.geo.db_version
  description: The version of the MaxMind GeoIP database used to derive geographic attributes from the client's IP address.
- name: metadata.geo.subdivision1
  description: The first-level administrative subdivision (e.g. state or province) where the client is located, derived from IP geolocation.
- name: metadata.geo.subdivision2
  description: The second-level administrative subdivision (e.g. county or district) where the client is located, derived from IP geolocation.
- name: metadata.header.date
  description: The raw Date HTTP header value from the ping submission request.
- name: metadata.header.dnt
  description: The value of the DNT (Do Not Track) HTTP header from the ping submission request.
- name: metadata.header.parsed_date
  description: The parsed TIMESTAMP representation of the Date HTTP header from the ping submission request.
- name: metadata.header.parsed_x_lb_tags.tls_cipher_hex
  description: The TLS cipher suite in hexadecimal notation, as parsed from the X-LB-Tags header of the ping submission request.
- name: metadata.header.parsed_x_lb_tags.tls_version
  description: The TLS version used for the ping submission request connection, as parsed from the X-LB-Tags header.
- name: metadata.header.parsed_x_source_tags
  description: The X-Source-Tags header values parsed into an array of individual source tag strings.
- name: metadata.header.x_debug_id
  description: The optional X-Debug-Id HTTP header value from the ping submission request, used to tag debug pings submitted via the Glean debug view.
- name: metadata.header.x_foxsec_ip_reputation
  description: The IP reputation score attached by the FoxSec pipeline to the ping submission request, used to identify potentially abusive traffic.
- name: metadata.header.x_lb_tags
  description: The raw X-LB-Tags HTTP header string from the load balancer, containing connection metadata such as TLS version and cipher.
- name: metadata.header.x_pingsender_version
  description: The version of the Glean PingSender used to submit this ping, if the ping was sent by PingSender rather than the main application.
- name: metadata.header.x_source_tags
  description: The raw X-Source-Tags HTTP header string from the ping submission request, identifying the source of the ping.
- name: metadata.header.x_telemetry_agent
  description: The value of the X-Telemetry-Agent HTTP header, identifying the telemetry agent or SDK that submitted the ping.
- name: metadata.isp.db_version
  description: The version of the ISP lookup database used to identify the client's internet service provider.
- name: metadata.isp.organization
  description: The organization name associated with the client's IP address, as determined by ISP lookup.
- name: metadata.user_agent.browser
  description: The browser name as parsed from the User-Agent header of the ping submission request.
- name: metadata.user_agent.os
  description: The operating system as parsed from the User-Agent header of the ping submission request.
- name: metadata.user_agent.version
  description: The browser version as parsed from the User-Agent header of the ping submission request.
- name: normalized_app_name
  description: The normalized name of the application (e.g. "Firefox Desktop"), as assigned by the ingestion pipeline.
- name: ping_info.end_time
  description: The end time of the data collection window for this ping, in local time with minute precision including timezone information. Also represents the time
    the ping was generated.
- name: ping_info.experiments
  description: An array of active Nimbus experiments for this client at the time of submission. Each entry contains the experiment slug as key and the assigned branch
    and enrollment ID as values.
- name: ping_info.parsed_end_time
  description: The parsed TIMESTAMP representation of ping_info.end_time, as processed by the ingestion pipeline.
- name: ping_info.parsed_start_time
  description: The parsed TIMESTAMP representation of ping_info.start_time, as processed by the ingestion pipeline.
- name: ping_info.ping_type
  description: The type of Glean ping submitted (e.g. "pageload").
- name: ping_info.reason
  description: The optional reason the ping was submitted, as defined in the ping's pings.yaml file.
- name: ping_info.seq
  description: A running counter of the number of times pings of this type have been sent from this client.
- name: ping_info.server_knobs_config.event_threshold
  description: The maximum number of events that can be recorded per ping, as set by the Server Knobs remote configuration.
- name: ping_info.server_knobs_config.metrics_enabled
  description: An array of key-value pairs indicating which metrics are enabled or disabled per the Server Knobs remote configuration.
- name: ping_info.server_knobs_config.pings_enabled
  description: An array of key-value pairs indicating which ping types are enabled or disabled per the Server Knobs remote configuration.
- name: ping_info.start_time
  description: The start time of the data collection window for this ping, in local time with minute precision including timezone information.
