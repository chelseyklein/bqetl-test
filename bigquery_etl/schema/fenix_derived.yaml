    IP geolocation.
- name: first_seen_year
  description: The calendar year in which the client's profile was first seen, used
    for cohort-level analysis.
- name: install_source
  description: The source from which the app was installed (e.g. com.android.vending
    for Google Play Store, Unknown when not determinable).
- name: language_name
  description: The display name of the user interface language selected in the application
    (e.g. English, German).
- name: new_profiles
  description: The count of new Firefox for Android client profiles first seen on
    submission_date for this row's dimension grouping.
- name: organic_search_count
  description: The total number of organic (non-SAP) searches performed by clients
    in this dimension grouping.
- name: search_count
  description: The total number of searches performed by clients in this dimension
    grouping.
- name: search_with_ads
  description: The total number of searches that showed ads on the search engine result
    page for clients in this dimension grouping.
- name: uri_count
  description: The total number of URIs visited by clients in this dimension grouping
    on the submission_date.
- name: active_hours
  description: The total hours clients in this dimension grouping spent actively using
    the browser. Null in 100% of sampled rows for this table version (sampled 2026-05-28).
- name: attributed
  description: True if the client has a known attribution source; false if the install
    was organic or attribution is unavailable. All sampled rows were false, consistent
    with attribution_medium and attribution_source being null (sampled 2026-05-28).
- name: city
  description: Name of the city in which the activity took place, as determined by
    IP geolocation. Null in 100% of sampled rows for this table version (sampled 2026-05-28).
- name: daily_users
  description: The count of clients that reported activity on the submission_date
    within this dimension grouping (sampled 2026-05-28).
- name: first_seen_year
  description: The calendar year in which the client's profile was first seen, used
    for cohort-level analysis. Ranges from 2017 to 2026 (sampled 2026-05-28).
- name: install_source
  description: The source from which the app was installed (e.g. com.android.vending
    for Google Play Store, Unknown, Other). Null in ~3% of rows (sampled 2026-05-28).
- name: monthly_users
  description: The count of clients active in the 28-day window ending on submission_date
    within this dimension grouping (sampled 2026-05-28).
- name: uri_count
  description: The total number of URIs visited by clients in this dimension grouping.
    Null in ~53% of rows, populated only for active clients with tracked URI activity
    (sampled 2026-05-28).
- name: weekly_users
  description: The count of clients active in the 7-day window ending on submission_date
    within this dimension grouping (sampled 2026-05-28).
- name: adjust_ad_group
  description: The Adjust ad group name for the campaign associated with the installation.
    Null in ~99% of rows (sampled 2026-05-28).
- name: adjust_campaign
  description: The Adjust campaign name associated with the installation attribution.
    Null in ~99% of rows (sampled 2026-05-28).
- name: adjust_creative
  description: The Adjust creative identifier for the ad unit associated with the
    installation. Null in ~99% of rows (sampled 2026-05-28).
- name: android_version
  description: The Android OS version string on the client device (e.g. 16, 15, 13).
    Null in ~91% of rows (sampled 2026-05-28).
- name: default_browser
  description: The count of times clients in this cohort set Firefox for Android as
    the default browser during or after onboarding. Null in ~91% of rows (sampled
    2026-05-28).
- name: device_manufacturer
  description: The manufacturer of the device running the application (e.g. samsung,
    Xiaomi, OPPO). Null in ~91% of rows (sampled 2026-05-28).
- name: device_model
  description: The marketing model name of the device running the application (e.g.
    SM-S928B). Null in ~91% of rows (sampled 2026-05-28).
- name: first_card_impression
  description: The count of times the first onboarding card was shown to clients in
    this cohort. Null in ~91% of rows (sampled 2026-05-28).
- name: first_card_primary_click
  description: The count of primary button clicks on the first onboarding card (e.g.
    accepting a prompt). Null in ~91% of rows (sampled 2026-05-28).
- name: first_card_secondary_click
  description: The count of secondary button clicks on the first onboarding card (e.g.
    skipping a prompt). Null in ~91% of rows (sampled 2026-05-28).
- name: funnel
  description: The funnel category for this row; always onboarding_funnel, identifying
    all rows as belonging to the Firefox for Android onboarding analysis (sampled
    2026-05-28).
- name: funnel_id
  description: A string encoding the ordered sequence of onboarding cards presented
    to the user (e.g. terms_of_service_default_search_widget_sync_notification_toolbar_placement).
    Null in ~91% of rows where users did not complete a new-profile cohort day (sampled
    2026-05-28).
- name: install_source
  description: The source from which the app was installed (e.g. Unknown, com.android.vending).
    Null in ~91% of rows (sampled 2026-05-28).
- name: new_profile
  description: The count of new browser profiles recorded on first_seen_date within
    this funnel cohort. Null in ~91% of rows (sampled 2026-05-28).
- name: onboarding_completed
  description: The count of times clients in this cohort completed the full onboarding
    flow. Null in ~91% of rows (sampled 2026-05-28).
- name: repeat_first_month_user
  description: True if the client returned to use the browser more than once within
    their first calendar month. Null in ~91% of rows where not applicable (sampled
    2026-05-28).
- name: retained_week_2
  description: True if the client returned to use the browser approximately 2 weeks
    after first_seen_date. Null in 100% of sampled rows, indicating this metric is
    not yet populated (sampled 2026-05-28).
- name: retained_week_4
  description: True if the client returned to use the browser approximately 4 weeks
    after first_seen_date. Null in ~91% of rows where not yet applicable (sampled
    2026-05-28).
- name: second_card_impression
  description: The count of times the second onboarding card was shown to clients
    in this cohort. Null in ~91% of rows (sampled 2026-05-28).
- name: second_card_primary_click
  description: The count of primary button clicks on the second onboarding card. Null
    in ~91% of rows (sampled 2026-05-28).
- name: second_card_secondary_click
  description: The count of secondary button clicks on the second onboarding card.
    Null in ~91% of rows (sampled 2026-05-28).
- name: sync_sign_in
  description: The count of times clients in this cohort clicked the Sign In button
    from the sync onboarding card. Null in ~91% of rows (sampled 2026-05-28).
- name: third_card_impression
  description: The count of times the third onboarding card was shown to clients in
    this cohort. Null in ~91% of rows (sampled 2026-05-28).
- name: third_card_primary_click
  description: The count of primary button clicks on the third onboarding card. Null
    in ~91% of rows (sampled 2026-05-28).
- name: third_card_secondary_click
  description: The count of secondary button clicks on the third onboarding card.
    Null in ~91% of rows (sampled 2026-05-28).
- name: activated
  description: True if the client met the new-profile activation criterion (returned
    to use the browser within the first week). False in ~99.8% of sampled rows, as
    activation is rare on any given day (sampled 2026-05-28).
- name: ad_clicks
  description: The total number of ad clicks on search engine result pages recorded
    for the client on submission_date. Null in ~94% of rows when no ad clicks occurred
    (sampled 2026-05-28).
- name: adjust_adgroup
  description: The Adjust ad group name for the campaign that sourced the installation
    (e.g. a specific keyword group). Empty string when not applicable (sampled 2026-05-28).
- name: adjust_campaign
  description: The Adjust campaign name associated with the installation attribution
    (e.g. gads_v2_firefox_challengeTheDefault_...). Empty string for organic installs
    (sampled 2026-05-28).
- name: adjust_creative
  description: The Adjust creative identifier for the ad unit that drove the installation
    (e.g. Search GoogleSearch, Display). Empty string for organic installs (sampled
    2026-05-28).
- name: cohort_date
  description: The date the client's profile was first seen (first_seen_date), used
    to group clients into acquisition cohorts. Ranges across several years of historical
    data (sampled 2026-05-28).
- name: is_new_install
  description: True if the client both first appeared on submission_date and reported
    a first-session ping on that date, indicating a fresh installation. False for
    returning profiles (sampled 2026-05-28).
- name: is_new_profile
  description: True if the client's cohort_date equals the submission_date, indicating
    the profile was created on that day. False for previously seen profiles (sampled
    2026-05-28).
- name: searches
  description: The total number of searches performed by the client on submission_date,
    sourced from in-content search metrics (Fenix >= 107) or mobile_search_clients_daily.
    Null in ~61% of rows when no search activity was recorded (sampled 2026-05-28).
- name: searches_with_ads
  description: The total number of searches where ads were shown on the search engine
    result page on submission_date. Null in ~87% of rows when no ad-showing searches
    occurred (sampled 2026-05-28).
- name: install_source
  description: The Android package name of the app that installed Firefox (e.g. 'com.android.vending'
    for the Google Play Store). Populated from the Glean first-session ping; null
    for ~15% of clients (sampled 2026-05-28).
- name: app_id
  description: The application identifier for the Fenix product that sent the ping
    (e.g. 'org.mozilla.firefox', 'org.mozilla.firefox_beta', 'org.mozilla.fenix')
    (sampled 2026-05-28).
- name: first_seen_city
  description: The city name where this client was first seen, as determined by IP
    geolocation (sampled 2026-05-28).
- name: first_seen_city_date
  description: The date on which this client was first seen in the first_seen_city
    (sampled 2026-05-28).
- name: first_seen_country
  description: The ISO 3166-1 alpha-2 country code where this client was first seen,
    as determined by IP geolocation (sampled 2026-05-28).
- name: first_seen_subdivision1
  description: The first-level administrative subdivision (e.g. state or province
    code) where this client was first seen, as determined by IP geolocation. Null
    for ~1% of clients where subdivision cannot be determined (sampled 2026-05-28).
- name: first_seen_subdivision2
  description: The second-level administrative subdivision where this client was first
    seen, as determined by IP geolocation. Null for ~91% of clients (sampled 2026-05-28).
- name: last_seen_city
  description: The city name where this client was most recently seen, as determined
    by IP geolocation. Updated each time the client is seen in a new city (sampled
    2026-05-28).
- name: last_seen_city_date
  description: The date on which this client was most recently seen in last_seen_city
    (sampled 2026-05-28).
- name: last_seen_country
  description: The ISO 3166-1 alpha-2 country code where this client was most recently
    seen, as determined by IP geolocation (sampled 2026-05-28).
- name: last_seen_subdivision1
  description: The first-level administrative subdivision (e.g. state or province
    code) where this client was most recently seen, as determined by IP geolocation.
    Null for ~1% of clients (sampled 2026-05-28).
- name: last_seen_subdivision2
  description: The second-level administrative subdivision where this client was most
    recently seen, as determined by IP geolocation. Null for ~91% of clients (sampled
    2026-05-28).
- name: app_build
  description: The build identifier generated by the CI system (e.g. '2016160439').
    If not provided through configuration, set to 'Unknown' (sampled 2026-05-28).
- name: app_channel
  description: The raw channel the application is distributed on as reported by the
    client (e.g. 'release', 'nightly', 'beta', 'benchmark'). Differs from normalized_channel
    in preserving the original reported value (sampled 2026-05-28).
- name: days_active_bits
  description: A 28-bit integer bitmask recording the days within the last 28 days
    on which this client was considered active (sent a baseline ping or equivalent);
    bit 0 (rightmost) represents the current submission_date (sampled 2026-05-28).
- name: days_created_profile_bits
  description: A 28-bit integer bitmask indicating which of the last 28 days this
    client's profile was created. Zero (0) for ~70% of clients where profile creation
    date is unavailable (sampled 2026-05-28).
- name: days_seen_bits
  description: A 28-bit integer bitmask indicating which of the last 28 days this
    client was seen; bit 0 (rightmost) represents the current submission_date. All
    bits set (268435455) indicates the client was seen every day for 28 consecutive
    days (sampled 2026-05-28).
- name: days_seen_session_end_bits
  description: A 28-bit integer bitmask recording the days within the last 28 days
    on which this client ended a session; bit 0 (rightmost) represents the current
    submission_date (sampled 2026-05-28).
- name: days_seen_session_start_bits
  description: A 28-bit integer bitmask recording the days within the last 28 days
    on which this client started a session; bit 0 (rightmost) represents the current
    submission_date. Zero indicates no session starts in the window (sampled 2026-05-28).
- name: days_since_active
  description: Number of days since this client was last considered active. Null for
    ~9% of clients who have never been recorded as active (sampled 2026-05-28).
- name: days_since_created_profile
  description: Number of days since this client's profile was created. Null for ~70%
    of clients where profile creation date is unavailable (sampled 2026-05-28).
- name: days_since_seen
  description: Number of days since this client last sent any ping (0 = seen today).
    Ranges from 0–27, representing the 28-day activity window (sampled 2026-05-28).
- name: days_since_seen_session_end
  description: Number of days since this client last recorded a session end event.
    Null for ~1% of clients where no session end has been recorded (sampled 2026-05-28).
- name: days_since_seen_session_start
  description: Number of days since this client last recorded a session start event.
    Null for ~9% of clients where no session start has been recorded (sampled 2026-05-28).
- name: durations
  description: The total foreground session duration (in seconds) for this client
    on the most recent active day, as reported in the baseline ping (sampled 2026-05-28).
- name: geo_subdivision
  description: The first-level administrative subdivision code for the client's IP-geolocated
    location. Fully null in the sampled data for this joined view (sampled 2026-05-28).
- name: install_source
  description: The Android package name of the app that installed Firefox (e.g. 'com.android.vending'
    for the Play Store). Null for ~79% of clients in this joined table (sampled 2026-05-28).
- name: is_new_profile
  description: True if this client's profile was created for the first time on this
    submission_date; false for returning clients. ~23% of sampled clients are new
    profiles (sampled 2026-05-28).
- name: normalized_app_id
  description: The normalized application identifier for the Fenix product variant
    (e.g. 'org_mozilla_firefox', 'org_mozilla_fenix', 'org_mozilla_firefox_beta')
    (sampled 2026-05-28).
- name: app_build
  description: The build identifier generated by the CI system (e.g. '2016160439').
    If not provided through configuration, set to 'Unknown' (sampled 2026-05-28).
- name: app_channel
  description: The raw channel the application is distributed on, as reported by the
    client (e.g. 'release', 'nightly', 'beta', 'benchmark', 'fenixProduction'). Differs
    from normalized_channel in that it preserves the original reported value (sampled
    2026-05-28).
- name: days_seen_bytes
  description: A 365-bit (46-byte) binary representation of the days this client was
    active over the past year, where the rightmost bit represents the current day.
    Used to compute rolling activity windows without requiring a full history scan
    (sampled 2026-05-28).
- name: days_seen_session_end_bits
  description: A 28-bit integer bitmask recording the days within the last 28 days
    on which this client ended a session; bit 0 (rightmost) represents the current
    day. Null for ~0.5% of clients (sampled 2026-05-28).
- name: days_seen_session_start_bits
  description: A 28-bit integer bitmask recording the days within the last 28 days
    on which this client started a session; bit 0 (rightmost) represents the current
    day. Null for ~18% of clients where no session start was recorded (sampled 2026-05-28).
- name: durations
  description: The total foreground duration (in seconds) of all browser sessions
    for this client on this submission_date, as reported in the baseline ping (sampled
    2026-05-28).
- name: geo_subdivision
  description: The first-level administrative subdivision code (e.g. US state or Canadian
    province) for the client's IP-geolocated location. Null for ~61% of clients where
    subdivision cannot be determined (sampled 2026-05-28).
- name: is_new_profile
  description: True if this client's profile was created for the first time on this
    submission_date; false if it is a returning profile. Approximately 51% of rows
    in the sample are new profiles (sampled 2026-05-28).
- name: install_source
  description: The Android package name of the app that installed Firefox (e.g. 'com.android.vending'
    for the Google Play Store, 'com.sec.android.app.samsungapps' for Samsung Galaxy
    Store). Null for ~33% of clients (sampled 2026-05-28).
- name: play_store_attribution_campaign
  description: The Google Play Store campaign name from the install referrer for this
    client. Null for ~97% of clients (sampled 2026-05-28).
- name: play_store_attribution_medium
  description: The attribution medium from the Google Play Store install referrer
    (e.g. 'organic', 'preload', 'referral'). Null for ~45% of clients (sampled 2026-05-28).
- name: play_store_attribution_source
  description: The attribution source from the Google Play Store install referrer
    (e.g. 'google-play', 'eea-browser-choice', 'google'). Null for ~44% of clients
    (sampled 2026-05-28).
- name: category
  description: The Glean event category for this event type (e.g. 'events', 'tabs_tray',
    'onboarding'). Each category groups related user interaction events in the Fenix
    events ping.
- name: event
  description: The Glean event name within the category. Together with category, uniquely
    identifies the type of user interaction recorded.
- name: first_timestamp
  description: The timestamp at which this event type was first observed in the Fenix
    events ping, captured when the event type was added to the history.
- name: index
  description: A compact string encoding of the numeric_index for efficient storage
    and lookup of event types in event string columns.
- name: numeric_index
  description: A unique integer index assigned to each event type, used for compact
    event encoding in downstream tables such as events_daily_v1.
- name: category
  description: The Glean event category for this event type (e.g. 'events', 'tabs_tray',
    'onboarding', 'media_state'). Each category groups related user interaction events
    in the Fenix events ping (sampled 2026-05-28).
- name: event
  description: The Glean event name within the category (e.g. 'pause', 'play', 'opened',
    'home_screen_displayed'). Together with category, uniquely identifies the type
    of user interaction recorded (sampled 2026-05-28).
- name: first_timestamp
  description: The timestamp at which this event type was first observed in the Fenix
    events ping history (sampled 2026-05-28).
- name: index
  description: A compact string encoding of the numeric_index, used for efficient
    storage and lookup of event types in event string columns (sampled 2026-05-28).
- name: numeric_index
  description: A unique integer index assigned to each event type, used for compact
    event encoding in downstream tables such as events_daily_v1 (sampled 2026-05-28).
- name: app_build
  description: The build identifier generated by the CI system (e.g. '2016160439').
    If not provided through configuration, set to 'Unknown'.
- name: app_channel
  description: The raw channel the application is distributed on as reported by the
    client (e.g. 'release', 'nightly', 'beta').
- name: subdivision1
  description: The first-level administrative subdivision code (e.g. US state or Canadian
    province) for the client's IP-geolocated location.
