fields:
- name: activations
  description: The count of new profiles that met the activation criterion (returning
    to use the browser within the first week) within this row's dimensions.
- name: adjust_ad_group
  description: The Adjust ad group name associated with the campaign that sourced
    the installation.
- name: adjust_campaign
  description: The Adjust campaign name associated with the installation attribution.
- name: adjust_creative
  description: The Adjust creative identifier for the ad unit associated with the
    installation attribution.
- name: city
  description: Name of the city in which the activity took place, as determined by
    IP geolocation.
- name: device_manufacturer
  description: The manufacturer of the device the application is running on (e.g.
    Samsung, Xiaomi). Not set if the device manufacturer cannot be determined.
- name: device_type
  description: The category of the device (e.g. phone, tablet) on which the application
    is running.
- name: geo_subdivision
  description: The geographic subdivision (e.g. state or province) of the client,
    as determined by IP geolocation.
- name: install_source
  description: The source from which the app was installed (e.g. com.android.vending
    for Google Play Store, Unknown when not determinable).
- name: meta_attribution_app
  description: The Meta (Facebook) attribution app identifier associated with the
    client's installation.
- name: new_profiles
  description: The count of new Firefox for Android profiles first seen on first_seen_date,
    grouped by this row's dimensions.
- name: play_store_attribution_campaign
  description: The Google Play Store attribution campaign name associated with the
    client's installation.
- name: play_store_attribution_content
  description: The Google Play Store attribution content parameter associated with
    the client's installation.
- name: play_store_attribution_medium
  description: The Google Play Store attribution medium (e.g. organic, cpc) associated
    with the client's installation.
- name: play_store_attribution_source
  description: The Google Play Store attribution source associated with the client's
    installation.
- name: play_store_attribution_term
  description: The Google Play Store attribution search term associated with the client's
    installation.
- name: retained_week_4
  description: The count of new profiles from first_seen_date that were still active
    approximately 4 weeks later, used to measure early retention.
- name: active_hours
  description: The total number of hours clients in this dimension grouping spent
    actively using the browser on the submission_date.
- name: ad_clicks
  description: The total number of ad clicks recorded on search engine result pages
    for clients in this dimension grouping.
- name: attributed
  description: True if the client has a known attribution source; false if the install
    was organic or attribution data is unavailable.
- name: city
  description: Name of the city in which the activity took place, as determined by
    IP geolocation.
- name: daily_users
  description: The count of clients that sent at least one ping on the submission_date,
    representing daily active users (deprecated alias; prefer dau).
- name: first_seen_year
  description: The calendar year in which the client's profile was first seen, used
    for cohort-level analysis.
- name: language_name
  description: The display name of the user interface language selected in the application
    (e.g. English, German).
- name: monthly_users
  description: The count of clients active in the 28-day window ending on submission_date
    (deprecated alias; prefer mau).
- name: montly_users
  description: 'The count of clients active in the 28-day window ending on submission_date.
    Note: this field name contains a typo (montly instead of monthly); prefer mau
    for analysis.'
- name: new_profiles
  description: The count of new Firefox for Android client profiles first seen on
    submission_date for this row's dimension grouping.
- name: organic_search_count
  description: The total number of organic (non-SAP) searches performed by clients
    in this dimension grouping.
- name: partition_date
  description: The date used to partition this table, typically matching submission_date
    and used for efficient query filtering.
- name: search_count
  description: The total number of searches performed by clients in this dimension
    grouping.
- name: search_with_ads
  description: The total number of searches that showed ads on the search engine result
    page for clients in this dimension grouping.
- name: uri_count
  description: The total number of URIs visited by clients in this dimension grouping
    on the submission_date.
- name: weekly_users
  description: The count of clients active in the 7-day window ending on submission_date
    (deprecated alias; prefer wau).
