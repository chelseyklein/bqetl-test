- name: mau
  type: INT64
  mode: NULLABLE
  description: The count of distinct onboarding clients active within the past 28 days (Monthly Active Users) for this combination of dimensions on the
    submission date.
- name: wau
  type: INT64
  mode: NULLABLE
  description: The count of distinct onboarding clients active within the past 7 days (Weekly Active Users) for this combination of dimensions on the
    submission date.
- name: dau
  type: INT64
  mode: NULLABLE
  description: The count of distinct onboarding clients active within the past 1 day (Daily Active Users) for this combination of dimensions on the submission
    date.
