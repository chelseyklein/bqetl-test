fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: days_seen_bits
  type: INTEGER
  mode: NULLABLE
  description: !include-field-description
    file: /bigquery_etl/schema/messaging_system_derived.yaml
    field: days_seen_bits
- name: days_seen_whats_new_bits
  type: INTEGER
  mode: NULLABLE
  description: !include-field-description
    file: /bigquery_etl/schema/messaging_system_derived.yaml
    field: days_seen_whats_new_bits
- name: impression_id
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: /bigquery_etl/schema/messaging_system_derived.yaml
    field: impression_id
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: seen_whats_new
  type: BOOLEAN
  mode: NULLABLE
  description: Whether the user was shown the What's New panel on `submission_date`. True indicates the What's New panel was displayed; False indicates
    it was not seen on that day.
- name: release_channel
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: /bigquery_etl/schema/messaging_system_derived.yaml
    field: release_channel
- name: locale
  type: STRING
  mode: NULLABLE
  description: Set of language- and/or country-based preferences for a user interface.
- name: country
  type: STRING
  mode: NULLABLE
  description: Name of the country in which the activity took place, as determined
    by the IP geolocation.
- name: version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
