fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: days_seen_bits
  type: INTEGER
  mode: NULLABLE
- name: days_seen_whats_new_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer encoding the history of days on which the user was seen viewing the "What's New" panel, over the past 28 days. Each bit
    corresponds to one day, with the least-significant (rightmost) bit representing the current submission date; a set bit indicates the user had a "What's
    New" impression on that day.
- name: impression_id
  type: STRING
  mode: NULLABLE
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: seen_whats_new
  type: BOOLEAN
  mode: NULLABLE
- name: release_channel
  type: STRING
  mode: NULLABLE
- name: locale
  type: STRING
  mode: NULLABLE
  description: Set of language- and/or country-based preferences for a user interface.
- name: country
  type: STRING
  mode: NULLABLE
  description: Name of the country in which the activity took place, as determined
    by the IP geolocation.
- name: version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
