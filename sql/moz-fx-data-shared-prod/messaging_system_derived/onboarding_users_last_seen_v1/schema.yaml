fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: days_seen_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer encoding the history of days on which the client was seen, with the rightmost bit representing the current submission
    date. Each bit shift to the left represents one additional day in the past.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: release_channel
  type: STRING
  mode: NULLABLE
  description: The Firefox release channel the client is on (e.g. "release", "beta", "nightly", "esr").
- name: locale
  type: STRING
  mode: NULLABLE
  description: Set of language- and/or country-based preferences for a user interface.
- name: country
  type: STRING
  mode: NULLABLE
  description: Name of the country in which the activity took place, as determined
    by the IP geolocation.
- name: version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
