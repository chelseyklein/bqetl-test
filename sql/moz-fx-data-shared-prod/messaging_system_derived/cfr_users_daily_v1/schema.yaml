fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: !include-field-description
    file: /bigquery_etl/schema/messaging_system_derived.yaml
    field: submission_date
- name: impression_id
  type: STRING
  mode: NULLABLE
  description: A UUID (formatted with curly braces) that identifies the Firefox browser instance for CFR purposes. Used together with client_id to uniquely
    identify a user-day record; may be null when not set on the client.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: /bigquery_etl/schema/messaging_system_derived.yaml
    field: client_id
- name: seen_whats_new
  type: BOOLEAN
  mode: NULLABLE
  description: Indicates whether the user saw a What's New CFR recommendation at any point during the submission day. True when at least one CFR ping
    for the user on that day had a bucket_id matching the pattern '%WHATS_NEW%'.
- name: release_channel
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: /bigquery_etl/schema/messaging_system_derived.yaml
    field: release_channel
- name: locale
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: /bigquery_etl/schema/messaging_system_derived.yaml
    field: locale
- name: country
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: /bigquery_etl/schema/messaging_system_derived.yaml
    field: country
- name: version
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: /bigquery_etl/schema/messaging_system_derived.yaml
    field: version
