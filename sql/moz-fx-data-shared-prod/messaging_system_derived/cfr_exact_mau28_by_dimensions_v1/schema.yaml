- name: whats_new_mau
  type: INT64
  mode: NULLABLE
  description: The count of unique clients in this dimension group who interacted with the What's New panel within the last 28 days relative to the submission_date
    (Monthly Active Users for the What's New feature).
- name: whats_new_wau
  type: INT64
  mode: NULLABLE
  description: The count of unique clients in this dimension group who interacted with the What's New panel within the last 7 days relative to the submission_date
    (Weekly Active Users for the What's New feature).
- name: whats_new_dau
  type: INT64
  mode: NULLABLE
  description: The count of unique clients in this dimension group who interacted with the What's New panel within the last 1 day relative to the submission_date
    (Daily Active Users for the What's New feature).
