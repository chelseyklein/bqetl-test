- name: whats_new_mau
  type: INT64
  mode: NULLABLE
  description: Number of distinct clients who were active in the CFR What's New panel within the past 28 days relative to the submission date (days_since_seen_whats_new
    < 28). This is the monthly active user count scoped to What's New panel interactions.
- name: whats_new_wau
  type: INT64
  mode: NULLABLE
  description: Number of distinct clients who were active in the CFR What's New panel within the past 7 days relative to the submission date (days_since_seen_whats_new
    < 7). This is the weekly active user count scoped to What's New panel interactions.
- name: whats_new_dau
  type: INT64
  mode: NULLABLE
  description: Number of distinct clients who were active in the CFR What's New panel on the submission date (days_since_seen_whats_new < 1). This is
    the daily active user count scoped to What's New panel interactions.
