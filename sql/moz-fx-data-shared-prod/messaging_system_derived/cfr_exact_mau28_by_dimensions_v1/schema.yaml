    field: dau
- name: whats_new_mau
  type: INT64
  mode: NULLABLE
  description: The count of distinct CFR clients who engaged with the What's New panel within the 28 days ending on the submission_date, across the given
    dimension combination.
- name: whats_new_wau
  type: INT64
  mode: NULLABLE
  description: The count of distinct CFR clients who engaged with the What's New panel within the 7 days ending on the submission_date, across the given
    dimension combination.
- name: whats_new_dau
  type: INT64
  mode: NULLABLE
  description: The count of distinct CFR clients who engaged with the What's New panel on the submission_date itself (days_since_seen_whats_new < 1),
    across the given dimension combination.
