fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: days_seen_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer encoding the client's daily activity history over the past 28 days. The rightmost (least significant) bit represents
    whether the client was active on the current submission date, with each successive bit representing one day further in the past. This field is computed
    by combining the previous day's shifted bit pattern with the current day's activity using `combine_adjacent_days_28_bits` and `shift_28_bits_one_day`
    UDFs.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: release_channel
  type: STRING
  mode: NULLABLE
  description: The Firefox release channel from which the client submitted the snippets ping (e.g. "release", "beta", "nightly"). Inherited from the
    upstream `snippets_users_daily_v1` table and carried forward in the last-seen rollup.
- name: locale
  type: STRING
  mode: NULLABLE
  description: Set of language- and/or country-based preferences for a user interface.
- name: country
  type: STRING
  mode: NULLABLE
  description: An ISO 3166-1 alpha-2 country code
- name: version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
