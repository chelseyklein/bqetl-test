fields:
- name: ad_content
  description: The UTM ad content parameter associated with the traffic source, used to differentiate ads or links pointing to the same URL. Null
    when no ad content parameter was present in the referring URL.
  type: STRING
- name: all_reported_install_targets
  description: An array of all install target event names (e.g. product_download, firefox_download) reported across events within a session or
    record. Captures the full history of download intent signals.
  type: STRING
- name: all_reported_stub_session_ids
  description: An array of all stub installer session IDs reported across events within a session or record. Used to associate web analytics sessions
    with Firefox stub installer telemetry sessions.
  type: STRING
- name: blog
  description: The name or slug of the Mozilla blog section associated with the content, such as 'security', 'addons', or 'community'. A value
    of 'other' indicates content that does not map to a named blog category.
  type: STRING
- name: bounces
  description: The number of single-page sessions in which the user left without interacting further. A value of 0 indicates no bounces occurred
    within the aggregation period.
  type: INT64
- name: browser
  description: The name of the web browser used by the visitor, such as Firefox, Chrome, or Safari. Null values indicate cases where the browser
    could not be determined.
  type: STRING
- name: browser_version
  description: The major version number of the web browser used by the visitor. Null when the browser version could not be determined from the
    user agent string.
  type: STRING
- name: campaign
  description: The UTM campaign parameter identifying the marketing campaign that drove the traffic, such as '(organic)' or '(referral)' for non-campaign
    traffic. Null when no campaign parameter was present.
  type: STRING
- name: city
  description: The city associated with the visitor's IP address as resolved by geo-IP lookup. An empty string indicates the city could not be
    determined.
  type: STRING
- name: content
  description: The UTM content parameter used to identify which specific link or creative within a campaign was clicked. Null when no content
    parameter was present in the referring URL.
  type: STRING
- name: country
  description: The country associated with the visitor's IP address as resolved by geo-IP lookup. An empty string indicates the country could
    not be determined.
  type: STRING
- name: date
  description: The calendar date of the recorded activity or aggregation period. Used as the primary date partition key across tables.
  type: DATE
- name: device_category
  description: The general category of the device used by the visitor, such as 'desktop', 'mobile', 'tablet', or 'smart tv'. Derived from the
    user agent string.
  type: STRING
- name: distinct_campaigns_from_event_params
  description: An array of distinct campaign values extracted from GA4 event parameters within a session or record. Captures all campaigns observed
    across multiple events.
  type: STRING
- name: downloads
  description: The total count of product download events attributed to a session or page. A value of 0 indicates no downloads occurred.
  type: INT64
- name: entrances
  description: The number of times a page or screen served as the entry point to a session. A value of 0 indicates the page was not a session
    landing page.
  type: INT64
- name: event_action
  description: The action component of an analytics event, describing what interaction occurred, such as 'cta_click', 'firefox_download', or 'form_submit'.
    Mirrors the GA4 event name for Universal Analytics compatibility.
  type: STRING
- name: event_category
  description: The category component of an analytics event, grouping related interactions together, such as 'product_download', 'scroll', or
    'newsletter_subscribe'. Mirrors the GA4 event name for Universal Analytics compatibility.
  type: STRING
- name: event_date
  description: The calendar date on which the analytics event was recorded. Used to partition and filter event-level data by day.
  type: DATE
- name: event_label
  description: The label component of an analytics event providing additional context about the interaction, such as the specific element or product
    involved. Mirrors the GA4 event name for Universal Analytics compatibility.
  type: STRING
- name: event_name
  description: The GA4 event name describing the type of user interaction recorded, such as 'page_view', 'session_start', 'cta_click', or 'product_download'.
    This is the primary identifier for event classification.
  type: STRING
- name: exits
  description: The number of times a session ended on a given page or screen. A value of 0 indicates the page was never the last page viewed in
    a session.
  type: INT64
- name: firefox_desktop_downloads
  description: The count of Firefox desktop product download events attributed to a session or record. A null value indicates no desktop Firefox
    download data was available for the record.
  type: INT64
- name: first_campaign_from_event_params
  description: The first campaign value observed in GA4 event parameters for a session or user, representing the initial marketing campaign that
    drove the visit. Null when no campaign parameter was recorded.
  type: STRING
- name: ga_client_id
  description: The Google Analytics client identifier that pseudonymously identifies a browser or device across sessions. Used to stitch together
    sessions and events belonging to the same visitor.
  type: STRING
- name: ga_session_id
  description: The Google Analytics session identifier that uniquely identifies a single visit or session for a given client. Combined with ga_client_id
    it uniquely scopes a session.
  type: STRING
- name: gclid
  description: The Google Click Identifier (gclid) passed in the URL when a visitor arrives via a Google Ads click. Null when the visit was not
    attributed to a Google Ads click.
  type: STRING
- name: gclid_array
  description: An array of all Google Click Identifiers (gclids) observed across events within a session or record. Captures cases where multiple
    paid Google Ads clicks are associated with a single session.
  type: STRING
- name: had_download_event
  description: Indicates whether at least one product download event was recorded in the session or record. True means a download event occurred;
    false means no download event was observed.
  type: BOOLEAN
- name: is_first_session
  description: Indicates whether the session is the user's first recorded session. True means this is the user's first visit; false means the
    user has visited before.
  type: BOOLEAN
- name: landing_page
  description: The path component of the URL where the visitor first landed when entering the site. Represents the entry page without the domain
    prefix.
  type: STRING
- name: landing_screen
  description: The full URL of the page where the visitor first landed when entering the site, including the domain. Null when the landing page
    URL could not be determined.
  type: STRING
- name: language
  description: The browser's preferred language setting as reported in the user agent or Accept-Language header, formatted as a language or locale
    code (e.g. 'en-us', 'fr-fr'). Reflects the visitor's configured language preference.
  type: STRING
- name: last_reported_install_target
  description: The most recently reported install target event name within a session, such as 'product_download' or 'firefox_download'. Null when
    no install target event was recorded.
  type: STRING
- name: last_reported_stub_session_id
  description: The most recently reported stub installer session ID within a session or record. Null when no stub session ID was reported, which
    is the case for the vast majority of sessions.
  type: STRING
- name: locale
  description: The locale of the mozilla.org page visited, representing the language and regional variant served to the user (e.g. 'en-US', 'fr',
    'es-ES'). Derived from the URL path prefix.
  type: STRING
- name: manual_campaign_id
  description: The manually specified campaign identifier passed via UTM or custom parameters, used to track specific marketing campaigns. Null
    when no manual campaign ID was provided in the URL.
  type: STRING
- name: manual_term
  description: The UTM term parameter capturing the search keyword or phrase that drove the visit, typically from paid or organic search. Null
    when no term parameter was present.
  type: STRING
- name: medium
  description: The UTM medium parameter describing the marketing channel that drove the traffic, such as 'organic', 'referral', 'email', or 'social'.
    Null when no medium parameter was recorded.
  type: STRING
- name: mobile_device_model
  description: The model name of the mobile device used by the visitor, such as 'iPhone' or 'Firefox for Android'. Null for desktop visits or
    when the device model could not be determined.
  type: STRING
- name: mobile_device_string
  description: The marketing or commercial name of the mobile device, such as 'Galaxy A54' or 'Galaxy S24 Ultra'. Null for desktop visits or when
    the specific device name could not be resolved.
  type: STRING
- name: newsletter_subscription
  description: The count of newsletter subscription events attributed to a session or record. A value of 0 indicates no newsletter subscriptions
    occurred.
  type: INT64
- name: non_fx_downloads
  description: The count of non-Firefox product download events (e.g. VPN, Relay) attributed to a session or record. A value of 0 indicates no
    non-Firefox downloads occurred.
  type: INT64
- name: non_fx_sessions
  description: The number of sessions attributed to visitors using a non-Firefox browser. A value of 0 indicates no non-Firefox sessions were
    recorded in the aggregation period.
  type: INT64
- name: operating_system
  description: The name of the operating system used by the visitor, such as 'Windows', 'Android', 'Macintosh', or 'iOS'. Null when the operating
    system could not be determined from the user agent.
  type: STRING
- name: os
  description: The name of the operating system used by the visitor, such as 'Windows', 'Linux', 'Android', or 'iOS'. Null when the operating
    system could not be determined from the user agent.
  type: STRING
- name: os_version
  description: The name and version of the operating system used by the visitor, such as 'Windows 10' or 'iOS 13'. Null when the OS version could
    not be determined.
  type: STRING
- name: page_level_1
  description: The first path segment of the page URL after the locale prefix, representing the top-level site section (e.g. 'firefox', 'products',
    'about'). An empty string indicates the root or home page of a locale.
  type: STRING
- name: page_level_2
  description: The second path segment of the page URL, representing a sub-section or version number within a top-level section (e.g. '127.0',
    'vpn'). Used alongside page_level_1 to describe page hierarchy.
  type: STRING
- name: page_level_3
  description: The third path segment of the page URL, representing a more specific page within a section hierarchy (e.g. 'whatsnew', 'download',
    'desktop-esr'). Null when the URL does not have a third path segment.
  type: STRING
- name: page_level_4
  description: The fourth hierarchical segment of the page URL path, representing a deeper subdivision of site content below the top three path
    levels. May be empty or null when the page URL does not have a fourth path segment.
  type: STRING
- name: page_level_5
  description: The fifth hierarchical segment of the page URL path, capturing the most granular URL path subdivision tracked. Frequently null
    or empty, as most pages do not have five or more path segments.
  type: STRING
- name: page_name
  description: The locale-agnostic canonical path of the page visited on mozilla.org, excluding locale prefixes (e.g. '/products/vpn/'). Used
    to aggregate metrics across all language variants of the same page.
  type: STRING
- name: page_path
  description: The full URL path of the page visited on mozilla.org, including the locale prefix (e.g. '/en-US/products/vpn/'). Uniquely identifies
    a specific localized page within the site.
  type: STRING
- name: pageviews
  description: The total number of times a page was viewed, including repeated views of the same page within a session. A value of 0 indicates
    the page was not viewed in the given context.
  type: INT64
- name: region
  description: The geographic region (e.g. state, province, or city-level administrative area) associated with the user's session, as determined
    by IP geolocation. May be empty when the region cannot be determined.
  type: STRING
- name: session_date
  description: The calendar date on which the user session occurred. Used as the primary date dimension for partitioning and filtering session-level
    data.
  type: DATE
- name: session_number
  description: A sequential counter indicating which session this is for a given user, starting at 1 for the first session. Higher values indicate
    returning visitors on subsequent visits.
  type: INT64
- name: sessions
  description: The total number of distinct user sessions recorded in the given context or grouping. Each session represents a single continuous
    visit to the site by a user.
  type: INT64
- name: single_page_sessions
  description: The count of sessions during which the user viewed only a single page before leaving the site (i.e. bounced). A value of 0 indicates
    the user navigated to at least one additional page during the session.
  type: INT64
- name: social_share
  description: An integer flag indicating whether a social sharing action occurred, where 1 means a social share event was recorded and 0 means
    no social share took place.
  type: INT64
- name: source
  description: The referring source that brought the user to the site, such as a search engine name or a referring domain (e.g. 'google', 'www.mozilla.org').
    Null when the traffic source cannot be attributed.
  type: STRING
- name: standardized_country_name
  description: The standardized English name of the country associated with the user's session, as determined by IP geolocation. Used to ensure
    consistent country naming across datasets.
  type: STRING
- name: subblog
  description: The blog or sub-section of the Mozilla blog where the content was published, such as 'Main' for the primary blog or locale-specific
    press blogs (e.g. 'press-fr', 'press-de'). Distinguishes content by editorial channel.
  type: STRING
- name: time_on_site
  description: The total time in seconds a user spent on the site during a session. A value of 0 typically indicates a single-page session where
    no subsequent page load was available to calculate elapsed time.
  type: INT64
- name: total_events
  description: The total count of all tracked interaction events fired during a session or in a given context, including repeated firings of the
    same event type. Reflects overall user engagement activity.
  type: INT64
- name: traffic_source_medium
  description: The marketing medium through which the user arrived at the site, such as 'organic', 'referral', or 'firefox-desktop'. A value of
    '(none)' indicates direct traffic with no attributed medium.
  type: STRING
- name: traffic_source_name
  description: The name of the traffic source campaign or entry point that directed the user to the site, such as a campaign identifier or '(direct)'
    for unattributed direct traffic.
  type: STRING
- name: traffic_source_source
  description: The specific originating source of the traffic, such as a search engine ('google'), a Mozilla product entry point ('update', 'toolbar'),
    or '(direct)' for sessions with no referring source.
  type: STRING
- name: unique_events
  description: The number of unique interaction events recorded, deduplicated so that repeated firings of the same event within a session are
    counted only once. Provides a measure of distinct engagement actions.
  type: INT64
- name: unique_pageviews
  description: The number of unique page views, where multiple views of the same page within a single session are counted only once. A value of
    0 indicates the page was not uniquely viewed in the given context.
  type: INT64
- name: visit_identifier
  description: A unique string identifier for an individual site visit, typically composed of a client ID and timestamps (e.g. '686264402.1785773656-1785773656').
    Used to distinguish and join session-level records across tables.
  type: STRING
- name: visits
  description: The total number of site visits (sessions) recorded for a given user or grouping. Reflects how frequently users or segments accessed
    the site within the reporting period.
  type: INT64
- name: first_reported_browser
  description: The web browser used in the first recorded session for this GA client (e.g., 'Firefox',
    'Chrome', 'Edge', 'Safari').
- name: first_reported_browser_version
  description: The version of the browser used in the first recorded session for this GA client.
- name: first_reported_campaign
  description: The marketing campaign name (utm_campaign) from the first recorded session for this GA
    client (e.g., '(organic)', '127', '(referral)').
- name: first_reported_campaign_id
  description: The Google Ads campaign ID from the first recorded session for this GA client. Null for
    most clients.
- name: first_reported_city
  description: The city associated with the first recorded session for this GA client, based on IP address.
- name: first_reported_content
  description: The ad content dimension (utm_content) from the first recorded session for this GA client,
    used to distinguish between ads or links in the same campaign. Null for most clients.
- name: first_reported_country
  description: The country associated with the first recorded session for this GA client, based on IP
    address.
- name: first_reported_device_category
  description: The device type (e.g., 'desktop', 'mobile', 'tablet', 'smart tv') from the first recorded
    session for this GA client.
- name: first_reported_ga_session_id
  description: The GA session ID from the first recorded session for this GA client. Useful for understanding
    the client's earliest session and its associated campaign attribution.
- name: first_reported_language
  description: The device language setting (IETF language code) from the first recorded session for this
    GA client (e.g., 'en-us', 'zh-cn', 'de').
- name: first_reported_medium
  description: The traffic medium from the first recorded session for this GA client (e.g., 'firefox-desktop',
    'organic', 'referral'). Null for direct visits.
- name: first_reported_mobile_device_string
  description: The full branding, model, and marketing name string for the mobile device from the first
    recorded session for this GA client.
- name: first_reported_os
  description: The operating system from the first recorded session for this GA client (e.g., 'Windows',
    'Macintosh', 'Android', 'Linux').
- name: first_reported_os_version
  description: The operating system version from the first recorded session for this GA client (e.g.,
    'Windows 10', 'Macintosh Intel 10.15').
- name: first_reported_region
  description: The sub-national region (state, province, etc.) associated with the first recorded session
    for this GA client.
- name: first_reported_source
  description: The traffic source from the first recorded session for this GA client (e.g., 'update',
    'google', 'addons.mozilla.org'). Null for direct visits.
- name: first_reported_term
  description: The search keyword or term from the first recorded session for this GA client. '(not provided)'
    for organic Google searches; null for most clients.
- name: first_seen_date
  description: The earliest date on which this GA client was observed in any session.
- name: last_seen_date
  description: The most recent date on which this GA client was observed in any session.
- name: distinct_contents_from_event_params
  description: All non-null ad content values reported across all events in this session.
- name: distinct_mediums_from_event_params
  description: All non-null traffic medium values reported across all events in this session.
- name: distinct_sources_from_event_params
  description: All non-null traffic source values reported across all events in this session.
- name: distinct_terms_from_event_params
  description: All non-null search term values reported across all events in this session.
- name: first_content_from_event_params
  description: The first non-null ad content value encountered in GA4 event_params for this session.
- name: first_medium_from_event_params
  description: The first non-null traffic medium value encountered in GA4 event_params for this session.
- name: first_source_from_event_params
  description: The first non-null traffic source value encountered in GA4 event_params for this session.
- name: first_term_from_event_params
  description: The first non-null search term value encountered in GA4 event_params for this session.
- name: manual_campaign_name
  description: The manual campaign name from collected_traffic_source during the session_start event,
    sourced from utm_campaign (e.g., '127', '143', '(organic)').
- name: manual_content
  description: The manual ad content from collected_traffic_source during the session_start event, used
    to distinguish between ads within the same campaign.
- name: manual_medium
  description: The manual traffic medium from collected_traffic_source during the session_start event
    (e.g., 'firefox-desktop', 'organic', 'referral', 'cpc').
- name: manual_source
  description: The manual traffic source from collected_traffic_source during the session_start event
    (e.g., 'update', 'google', 'toolbar').
