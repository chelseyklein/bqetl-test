fields:
- name: event_date
  description: The calendar date on which blog page view events were recorded on blog.mozilla.org.
- name: date
  type: DATE
  description: The calendar date on which the visit-level goal events occurred on blog.mozilla.org.
- name: visit_identifier
  type: STRING
  description: A unique identifier for the visit, formed by concatenating user_pseudo_id and ga_session_id. Used to join with blogs_sessions_v2
    to attach session-level dimensions to goal events.
- name: country
  type: STRING
  description: The country from which the What's New page visit was reported, determined by IP address.
- name: device_category
  type: STRING
  description: The type of device used to view the What's New page, such as 'desktop' or 'mobile', as reported by GA4.
- name: operating_system
  type: STRING
  description: The operating system of the device that viewed the What's New page (e.g., 'Windows', 'Macintosh', 'Linux').
- name: first_reported_browser
  description: The web browser used in the first recorded session for this GA client (e.g., 'Firefox', 'Chrome', 'Edge', 'Safari').
- name: first_reported_browser_version
  description: The version of the browser used in the first recorded session for this GA client.
- name: first_reported_campaign
  description: The marketing campaign name (utm_campaign) from the first recorded session for this GA client (e.g., '(organic)', '127', '(referral)').
- name: first_reported_campaign_id
  description: The Google Ads campaign ID from the first recorded session for this GA client. Null for most clients.
- name: first_reported_city
  description: The city associated with the first recorded session for this GA client, based on IP address.
- name: first_reported_content
  description: The ad content dimension (utm_content) from the first recorded session for this GA client, used to distinguish between ads or links
    in the same campaign. Null for most clients.
- name: first_reported_country
  description: The country associated with the first recorded session for this GA client, based on IP address.
- name: first_reported_device_category
  description: The device type (e.g., 'desktop', 'mobile', 'tablet', 'smart tv') from the first recorded session for this GA client.
- name: first_reported_ga_session_id
  description: The GA session ID from the first recorded session for this GA client. Useful for understanding the client's earliest session and
    its associated campaign attribution.
- name: first_reported_language
  description: The device language setting (IETF language code) from the first recorded session for this GA client (e.g., 'en-us', 'zh-cn', 'de').
- name: first_reported_medium
  description: The traffic medium from the first recorded session for this GA client (e.g., 'firefox-desktop', 'organic', 'referral'). Null for
    direct visits.
- name: first_reported_mobile_device_string
  description: The full branding, model, and marketing name string for the mobile device from the first recorded session for this GA client.
- name: first_reported_os
  description: The operating system from the first recorded session for this GA client (e.g., 'Windows', 'Macintosh', 'Android', 'Linux').
- name: first_reported_os_version
  description: The operating system version from the first recorded session for this GA client (e.g., 'Windows 10', 'Macintosh Intel 10.15').
- name: first_reported_region
  description: The sub-national region (state, province, etc.) associated with the first recorded session for this GA client.
- name: first_reported_source
  description: The traffic source from the first recorded session for this GA client (e.g., 'update', 'google', 'addons.mozilla.org'). Null for
    direct visits.
- name: first_reported_term
  description: The search keyword or term from the first recorded session for this GA client. '(not provided)' for organic Google searches; null
    for most clients.
- name: first_seen_date
  description: The earliest date on which this GA client was observed in any session.
- name: ga_client_id
  type: STRING
  description: The Google Analytics client identifier, set via a cookie on mozilla.org, uniquely identifying a browser/device across all sessions
    over time.
- name: had_download_event
  type: BOOLEAN
  description: True when this GA client has ever had a Firefox download event across any of their sessions; false otherwise.
- name: last_seen_date
  description: The most recent date on which this GA client was observed in any session.
- name: all_reported_install_targets
  type: STRING
  description: All install targets reported during this session. Useful when a single session triggered downloads for multiple Firefox products.
- name: all_reported_stub_session_ids
  type: STRING
  description: All stub session IDs reported during this session. Can be used to join with dl_ga_triplets to retrieve download tokens for each
    Windows stub installer run.
- name: browser
  type: STRING
  description: The web browser used during this session (e.g., 'Firefox', 'Chrome', 'Safari', 'Edge').
- name: browser_version
  type: STRING
  description: The version of the web browser used during this session.
- name: campaign
  type: STRING
  description: The marketing campaign name associated with this session, set via the utm_campaign URL parameter (e.g., '127', '143', '(organic)',
    '(referral)').
- name: city
  type: STRING
  description: The city associated with this session, based on the user's IP address. Empty string when the city cannot be determined.
- name: content
  description: The ad content dimension associated with this session, set via utm_content to distinguish between ads or links within the same
    campaign. Null for most sessions.
- name: distinct_campaigns_from_event_params
  type: STRING
  description: All non-null campaign values reported in GA4 event_params across all events in this session.
- name: firefox_desktop_downloads
  type: INT64
  description: The number of Firefox desktop download events recorded during this session. Null for sessions without download events in this table
    version.
- name: first_campaign_from_event_params
  type: STRING
  description: The first non-null campaign value encountered in GA4 event_params during this session, reflecting the earliest campaign attribution
    seen for the visit.
- name: ga_session_id
  type: STRING
  description: The Google Analytics session identifier, uniquely identifying a single continuous browsing session.
- name: gclid
  type: STRING
  description: The last reported Google Click ID (gclid) for this session, uniquely identifying an ad click in Google Ads. Null for nearly all
    sessions.
- name: gclid_array
  type: STRING
  description: All Google Click IDs reported during this session. Can be used to trace back to Google Ads clicks when multiple gclids appear in
    one session.
- name: is_first_session
  type: BOOLEAN
  description: True when this is the first recorded session for this GA client; false for all subsequent sessions.
- name: landing_screen
  type: STRING
  description: The first page URL visited during this session on mozilla.org. Most sessions have a single landing page, making this the most reliable
    landing URL to use.
- name: language
  type: STRING
  description: The language setting of the device used during this session, expressed as an IETF language code (e.g., 'en-us', 'zh-cn', 'pt-br').
- name: last_reported_install_target
  type: STRING
  description: The last install target reported during this session, indicating which Firefox product the user downloaded (e.g., 'product_download',
    'firefox_download', 'firefox_mobile_download'). Null when no download occurred.
- name: last_reported_stub_session_id
  type: STRING
  description: The last reported Windows installer stub session ID for this session, which can be joined with dl_ga_triplets to retrieve download
    tokens. Null for non-stub installs.
- name: medium
  type: STRING
  description: The traffic medium associated with this session, such as 'organic', 'referral', 'firefox-desktop', or the utm_medium value. Null
    for direct visits.
- name: mobile_device_model
  type: STRING
  description: The model name of the mobile device used during this session (e.g., 'iPhone', 'Firefox for Android'). Null for desktop sessions.
- name: mobile_device_string
  type: STRING
  description: The full branding, model, and marketing name string for the mobile device used during this session. Null for most sessions where
    this is not a mobile device.
- name: os
  type: STRING
  description: The operating system of the device used during this session (e.g., 'Windows', 'Linux', 'Android', 'Macintosh', 'iOS').
- name: os_version
  type: STRING
  description: The specific version of the operating system used during this session (e.g., 'Windows 10', 'iOS 13'). Null when the OS version
    cannot be determined.
- name: pageviews
  type: INT64
  description: The total number of page view events recorded during this session.
- name: region
  type: STRING
  description: The sub-national region (state, province, etc.) associated with this session, based on IP address.
- name: session_date
  type: DATE
  description: The date of the session. For sessions that span midnight, the earlier date is used.
- name: session_number
  type: INT64
  description: The sequential session count for this GA client, starting at 1 for the first session and incrementing by 1 for each subsequent
    session.
- name: source
  type: STRING
  description: The traffic source associated with this session, such as a search engine name, referring hostname, or utm_source value (e.g., 'update',
    'google', 'toolbar'). Null for direct visits.
- name: time_on_site
  type: INT64
  description: The duration in seconds between the first and last events of the session, representing time spent on the site.
- name: distinct_contents_from_event_params
  description: All non-null ad content values reported across all events in this session.
- name: distinct_mediums_from_event_params
  description: All non-null traffic medium values reported across all events in this session.
- name: distinct_sources_from_event_params
  description: All non-null traffic source values reported across all events in this session.
- name: distinct_terms_from_event_params
  description: All non-null search term values reported across all events in this session.
- name: first_content_from_event_params
  description: The first non-null ad content value encountered in GA4 event_params for this session.
- name: first_medium_from_event_params
  description: The first non-null traffic medium value encountered in GA4 event_params for this session.
- name: first_source_from_event_params
  description: The first non-null traffic source value encountered in GA4 event_params for this session.
- name: first_term_from_event_params
  description: The first non-null search term value encountered in GA4 event_params for this session.
- name: manual_campaign_id
  type: STRING
  description: The manual campaign ID from collected_traffic_source during the session_start event, sourced from utm_id.
- name: manual_campaign_name
  description: The manual campaign name from collected_traffic_source during the session_start event, sourced from utm_campaign (e.g., '127',
    '143', '(organic)').
- name: manual_content
  description: The manual ad content from collected_traffic_source during the session_start event, used to distinguish between ads within the
    same campaign.
- name: manual_medium
  description: The manual traffic medium from collected_traffic_source during the session_start event (e.g., 'firefox-desktop', 'organic', 'referral',
    'cpc').
- name: manual_source
  description: The manual traffic source from collected_traffic_source during the session_start event (e.g., 'update', 'google', 'toolbar').
- name: manual_term
  type: STRING
  description: The manual search term from collected_traffic_source during the session_start event.
- name: ad_content
  type: STRING
  description: The ad content dimension for the download event from collected_traffic_source, sourced from utm_content. Used to distinguish between
    ads or links within the same campaign. Null for most sessions.
- name: locale
  type: STRING
  description: The locale code parsed from the first path segment of the page URL (e.g., 'en-US', 'zh-CN', 'ru', 'de'), identifying the language/region
    version of the page.
- name: page_level_2
  type: STRING
  description: The Firefox version string parsed from the third path segment of page_location (e.g., '127.0', '143.0.1'), corresponding to the
    version of Firefox whose What's New page was displayed.
- name: downloads
  type: INT64
  description: The count of 'download_click' events recorded for this visit and date, representing the number of Firefox download button clicks
    on blog.mozilla.org.
- name: traffic_source_source
  type: STRING
  description: The GA4 traffic_source.source field representing the first-ever source that acquired this user (e.g., 'update' for Firefox auto-update
    flow, '(direct)' for direct visits).
- name: traffic_source_name
  type: STRING
  description: The GA4 traffic_source.name field representing the first-ever campaign that acquired this user, typically the Firefox version number
    (e.g., '127', '143') for users arriving via the auto-update flow.
- name: subblog
  type: STRING
  description: The language or regional sub-edition of the blog, derived from URL path segments. For localized press sections (e.g., 'press-de',
    'press-fr') this reflects the regional edition; otherwise defaults to 'Main'.
- name: blog
  type: STRING
  description: The mapped blog section derived from the first URL path segment of the session's entry page on blog.mozilla.org (e.g., 'addons',
    'security', 'Blog Home Page', 'other' for unrecognized sections).
- name: traffic_source_medium
  type: STRING
  description: The GA4 traffic_source.medium field representing the first-ever medium that acquired this user (e.g., 'firefox-desktop', '(none)',
    'referral').
