fields:
- mode: NULLABLE
  name: submission_date_pacific
  type: DATE
  description: The submission date in Pacific time (PDT/PST) for this record. Because FxA logs are UTC-based, the ETL aligns records to this Pacific-time
    date using a two-day UTC window.
- mode: NULLABLE
  name: user_id
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_accounts_derived/firefox_accounts_derived.yaml
    field: jsonPayload_fields_user_id
- mode: NULLABLE
  name: insert_id
  type: STRING
  description: A unique identifier for the Amplitude event record, derived from the BigQuery insertId of the source log row with a '-user' suffix. Used
    by Amplitude for deduplication.
- mode: NULLABLE
  name: region
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_accounts_derived/firefox_accounts_derived.yaml
    field: jsonPayload_fields_region
- mode: NULLABLE
  name: country
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_accounts_derived/firefox_accounts_derived.yaml
    field: jsonPayload_fields_country
- mode: NULLABLE
  name: language
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_accounts_derived/firefox_accounts_derived.yaml
    field: jsonPayload_fields_language
- mode: REPEATED
  name: services
  type: STRING
  description: Array of distinct FxA service identifiers (e.g. 'sync', 'relay') observed in event properties across all auth events for this user on
    this date.
- mode: REPEATED
  name: oauth_client_ids
  type: STRING
  description: Array of distinct OAuth client IDs seen in event properties for this user on this date, representing the OAuth-relying-party applications
    the user authenticated with.
- mode: REPEATED
  name: fxa_services_used
  type: STRING
  description: Array of distinct FxA services appended to the user's Amplitude user properties via the '$append' operation, reflecting the cumulative
    set of services this user has engaged with.
- fields:
  - mode: NULLABLE
    name: key
    type: STRING
  - mode: NULLABLE
    name: value
    type: INTEGER
  mode: REPEATED
  name: os_used_month
  type: RECORD
  description: A repeated key-value structure tracking the operating systems (by OS name) used by the account over a rolling 28-day window. The key is
    the OS name and the value is a bit-packed integer encoding the days on which that OS was seen.
- mode: NULLABLE
  name: sync_device_count
  type: INTEGER
  description: The maximum number of devices the user had connected to Firefox Sync on this date, as reported in the FxA user properties.
- mode: NULLABLE
  name: sync_active_devices_day
  type: INTEGER
  description: The maximum number of Sync-connected devices that were active on the current day, as reported in the FxA user properties.
- mode: NULLABLE
  name: sync_active_devices_week
  type: INTEGER
  description: The maximum number of Sync-connected devices that were active in the past week, as reported in the FxA user properties.
- mode: NULLABLE
  name: sync_active_devices_month
  type: INTEGER
  description: The maximum number of Sync-connected devices that were active in the past month, as reported in the FxA user properties.
- mode: NULLABLE
  name: ua_version
  type: STRING
- mode: NULLABLE
  name: ua_browser
  type: STRING
- mode: NULLABLE
  name: app_version
  type: FLOAT
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_accounts_derived/firefox_accounts_derived.yaml
    field: jsonPayload_fields_app_version
- mode: NULLABLE
  name: days_seen_bits
  type: INTEGER
  description: A 28-bit integer encoding the days within a rolling 28-day window on which the user was seen, with each bit representing one day. Combined
    with the previous day's value via the combine_adjacent_days_28_bits UDF to maintain a rolling history.
- mode: REPEATED
  name: rollup_events
  type: STRING
  description: Array of distinct FxA event types (e.g. 'fxa_activity - cert_signed', 'fxa_activity - access_token_created') observed for this user on
    this date, used to summarize which authentication activity types occurred.
- mode: NULLABLE
  name: timestamp
  type: DATETIME
