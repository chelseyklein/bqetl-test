fields:
- name: timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: ''
- name: event
  type: STRING
  mode: NULLABLE
  description: ''
- name: flow_id
  type: STRING
  mode: NULLABLE
  description: ''
- name: entrypoint
  type: STRING
  mode: NULLABLE
  description: ''
- name: service
  type: STRING
  mode: NULLABLE
  description: ''
- name: useragent
  type: STRING
  mode: NULLABLE
  description: ''
- name: os_version
  type: STRING
  mode: NULLABLE
  description: The operating system version string of the device or client from which the authentication event was generated, as reported in the FxA
    auth server log payload.
- name: utm_source
  type: STRING
  mode: NULLABLE
  description: ''
- name: utm_campaign
  type: STRING
  mode: NULLABLE
  description: ''
- name: utm_content
  type: STRING
  mode: NULLABLE
  description: ''
- name: utm_medium
  type: STRING
  mode: NULLABLE
  description: ''
- name: utm_term
  type: STRING
  mode: NULLABLE
  description: The UTM term marketing parameter associated with the authentication event, used to identify paid search keywords or other campaign targeting
    terms that brought the user to the FxA auth flow.
- name: device_id
  type: STRING
  mode: NULLABLE
  description: A SHA-256 hex-encoded hash of the device identifier associated with the authentication event, derived from either `device_id` or `deviceid`
    fields in the source log payload to anonymize the raw device identifier.
