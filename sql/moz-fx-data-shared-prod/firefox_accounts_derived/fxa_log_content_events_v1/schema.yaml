fields:
- name: timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: ''
- name: event
  type: STRING
  mode: NULLABLE
  description: ''
- name: flow_time
  type: FLOAT64
  mode: NULLABLE
  description: The elapsed time in milliseconds since the start of the authentication or registration flow, as reported in the Firefox Accounts content
    server log payload. Used to measure how long a user has been engaged in the current flow at the point the event was recorded.
- name: locale
  type: STRING
  mode: NULLABLE
  description: The locale of the user's browser or session at the time of the event, as reported by the Firefox Accounts content server log payload.
    Represents the language and regional formatting preference (e.g., "en-US").
- name: useragent
  type: STRING
  mode: NULLABLE
  description: ''
- name: country
  type: STRING
  mode: NULLABLE
  description: The country associated with the user's request, as derived from the Firefox Accounts content server log payload. Typically inferred from
    the user's IP address at the time of the event.
- name: entrypoint
  type: STRING
  mode: NULLABLE
  description: ''
- name: flow_id
  type: STRING
  mode: NULLABLE
  description: ''
- name: region
  type: STRING
  mode: NULLABLE
  description: The geographic region (e.g., state or province) associated with the user's request, as derived from the Firefox Accounts content server
    log payload. Typically corresponds to a sub-national administrative area inferred from the user's IP address.
- name: service
  type: STRING
  mode: NULLABLE
  description: ''
- name: utm_campaign
  type: STRING
  mode: NULLABLE
  description: ''
- name: utm_content
  type: STRING
  mode: NULLABLE
  description: ''
- name: utm_medium
  type: STRING
  mode: NULLABLE
  description: ''
- name: utm_source
  type: STRING
  mode: NULLABLE
  description: ''
