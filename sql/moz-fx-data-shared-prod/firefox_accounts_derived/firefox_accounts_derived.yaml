- name: labels_k8s_pod_app_kubernetes_io_component
  description: The Kubernetes recommended label identifying the component within the application that the pod belongs to (e.g., 'fxa-web'). This follows
    the app.kubernetes.io/component label convention for categorizing workloads within a larger application.
- name: labels_k8s_pod_app_kubernetes_io_instance
  description: The Kubernetes recommended label identifying a unique instance of the application, used to distinguish between multiple deployments
    of the same application. This follows the app.kubernetes.io/instance label convention and may be null when not applicable.
- name: labels_k8s_pod_app_kubernetes_io_managed_by
  description: The Kubernetes recommended label indicating the tool or controller responsible for managing the pod's lifecycle (e.g., Helm, a custom
    operator). This follows the app.kubernetes.io/managed-by label convention.
- name: labels_k8s_pod_app_kubernetes_io_name
  description: The Kubernetes recommended label identifying the name of the application the pod belongs to (e.g., 'fxa'). This follows the app.kubernetes.io/name
    label convention and provides a high-level grouping for related workloads.
- name: labels_k8s_pod_app_kubernetes_io_part_of
  description: The Kubernetes recommended label indicating the higher-level application or suite that the pod is part of. This follows the app.kubernetes.io/part-of
    label convention for expressing application hierarchy.
- name: labels_k8s_pod_app_kubernetes_io_version
  description: The Kubernetes recommended label indicating the current version of the application running in the pod. This follows the app.kubernetes.io/version
    label convention and corresponds to the deployed release version.
- name: labels_k8s_pod_batch_kubernetes_io_controller_uid
  description: The unique identifier of the Kubernetes batch controller (e.g., a Job) that owns the pod, used to associate pods with their controlling
    batch workload. This field is null when the pod is not managed by a batch controller.
- name: labels_k8s_pod_batch_kubernetes_io_job_name
  description: The name of the Kubernetes Job that owns the pod, present only when the pod was created as part of a batch Job workload. This field
    is null for pods managed by non-batch controllers such as Deployments or DaemonSets.
- name: labels_k8s_pod_controller_revision_hash
  description: The hash of the controller revision for the pod, used by Kubernetes to track rolling updates for StatefulSet and DaemonSet workloads.
    This label helps correlate pods with a specific revision of their controlling resource.
- name: labels_k8s_pod_controller_uid
  description: The unique identifier of the Kubernetes controller (e.g., ReplicaSet, StatefulSet) that owns the pod. This field is null when the pod
    is not associated with a tracked controller.
- name: labels_k8s_pod_deployment
  description: The name of the Kubernetes Deployment that manages the pod (e.g., 'admin-backend'). This label links the pod back to its owning Deployment
    resource for identification and routing purposes.
- name: labels_k8s_pod_env_code
  description: A short code identifying the deployment environment in which the pod is running (e.g., 'prod' for production). This label is used to
    differentiate workloads across environments within the Kubernetes cluster.
- name: labels_k8s_pod_fullname
  description: The full descriptive name assigned to the Kubernetes pod, typically combining service name and environment context. This label provides
    a human-readable identifier for the pod beyond its generated name.
- name: labels_k8s_pod_jenkins_build_id
  description: The Jenkins build identifier associated with the CI/CD pipeline run that deployed the pod. This label enables traceability between a
    running pod and the specific build that produced its container image.
- name: labels_k8s_pod_job_name
  description: The name of the Kubernetes Job associated with the pod, present only when the pod is part of a Job workload. This field is null for
    pods managed by long-running controllers such as Deployments.
- name: labels_k8s_pod_k8s_app
  description: A legacy Kubernetes label used to identify the application name associated with the pod. This label predates the standardized app.kubernetes.io
    label set and may be used for selector and grouping purposes.
- name: labels_k8s_pod_pod_template_generation
  description: A Kubernetes label tracking the generation number of the pod template, incremented whenever the pod spec is updated. This is typically
    used by DaemonSet controllers to manage rolling updates.
- name: labels_k8s_pod_pod_template_hash
  description: A hash of the pod template spec appended by Kubernetes ReplicaSets to uniquely identify pods belonging to a specific template version.
    This label is used internally for routing and rollout management.
- name: labels_k8s_pod_redis
  description: A Kubernetes pod label used to associate or identify pods related to a Redis instance or role within the cluster. This field is null
    when the pod has no Redis-related label applied.
- name: labels_k8s_pod_run
  description: A Kubernetes pod label typically set when a pod is created via 'kubectl run', carrying the name provided at creation time. This field
    is null for pods managed by higher-level controllers.
- name: labels_logging_gke_io_top_level_controller_name
  description: The name of the top-level Kubernetes controller (e.g., a Deployment) responsible for the pod, as determined by GKE's logging infrastructure
    (e.g., 'gha-fxa-admin-backend'). This label is injected by GKE to enable log aggregation at the controller level.
- name: labels_logging_gke_io_top_level_controller_type
  description: The type of the top-level Kubernetes controller (e.g., 'Deployment') responsible for the pod, as determined by GKE's logging infrastructure.
    This label is injected by GKE to classify the workload kind for log routing and aggregation.
- name: labels_pro
  description: A resource label field representing a project-level or profile-related attribute attached to the log entry's originating resource. The
    value provides supplementary metadata for resource classification.
- name: labels_stack
  description: A resource label indicating the technology stack or service stack associated with the log entry's originating resource. This helps categorize
    resources by their infrastructure or application stack.
- name: labels_type
  description: A resource label indicating the type or category of the log entry's originating resource. This provides a classification tag used for
    filtering and grouping resources within the infrastructure.
- name: language
  description: The language or locale code representing the user's preferred language at the time of the event (e.g., 'en-US', 'de', 'fr'). This is
    derived from the user's browser or account settings and follows BCP 47 language tag formatting.
- name: locale
  description: The locale setting associated with the user or request, representing a combination of language and regional preferences. This field
    may overlap with the language field and is used to capture localization context for the event.
- name: logName
  description: The fully qualified name of the Google Cloud Logging log stream that the entry was written to (e.g., 'projects/moz-fx-webservices-high-prod/logs/stdout').
    This identifies the source log stream within the GCP project.
- name: operation_first
  description: A boolean flag indicating whether this log entry is the first entry in a multi-part operation sequence. A value of true marks the start
    of the operation; this field is null when the log entry is not part of a tracked operation.
- name: operation_id
  description: A unique identifier for a multi-part operation, used to correlate all log entries that belong to the same logical operation. This field
    is null when the log entry is not associated with a tracked operation.
- name: operation_last
  description: A boolean flag indicating whether this log entry is the final entry in a multi-part operation sequence. A value of true marks the completion
    of the operation; this field is null when the log entry is not part of a tracked operation.
- name: operation_producer
  description: An identifier for the service or component that produced a multi-part operation, used alongside operation_id to scope operation tracking
    to a specific producer. This field is null when the log entry is not part of a tracked operation.
- name: os_name
  description: The name of the operating system on the device used during the event (e.g., 'Windows', 'Android', 'Mac OS X', 'iOS', 'Linux'). This
    is derived from the user-agent or device metadata associated with the request.
- name: os_version
  description: The version string of the operating system on the device used during the event (e.g., '10' for Windows 10, '10.15' for macOS Catalina).
    This field may be null when the OS version cannot be determined from the available metadata.
- name: receiveTimestamp
  description: The timestamp at which the log entry was received by the Cloud Logging pipeline. This reflects ingestion time and may differ slightly
    from the event's own timestamp.
- name: region
  description: The geographic region associated with the event or resource. Used to identify the broad geographic area where the activity originated
    or the resource is located.
- name: registered
  description: Indicates whether the Firefox Accounts user was already registered at the time of the event. A value of true means the account existed
    prior to the event; false means the user was not yet registered.
- name: resource_labels_cluster_name
  description: The name of the Kubernetes cluster on which the service pod was running when the log entry was produced. Used to identify the infrastructure
    context of the log event.
- name: resource_labels_container_name
  description: The name of the container within the Kubernetes pod that generated the log entry. Identifies which application container (e.g., admin-backend)
    produced the event.
- name: resource_labels_instance_id
  description: The unique identifier of the compute instance associated with the log resource. Used to pinpoint the specific VM or node that emitted
    the log entry.
- name: resource_labels_location
  description: The GCP region or zone location label associated with the Kubernetes resource that produced the log entry (e.g., us-west1). Indicates
    where the workload is physically running.
- name: resource_labels_namespace_name
  description: The Kubernetes namespace in which the service is deployed (e.g., fxa-prod). Used to scope resources and log entries within a cluster
    to a specific environment or application group.
- name: resource_labels_pod_name
  description: The name of the specific Kubernetes pod that generated the log entry. Enables tracing of log events back to an individual running pod
    instance within the cluster.
- name: resource_labels_project_id
  description: The GCP project ID associated with the Kubernetes resource that produced the log entry (e.g., moz-fx-webservices-high-prod). Identifies
    the billing and organizational context of the resource.
- name: resource_labels_zone
  description: The GCP availability zone of the resource that produced the log entry. Provides finer-grained geographic placement within a region for
    the underlying infrastructure.
- name: resource_type
  description: The type of GCP monitored resource that produced the log entry (e.g., k8s_container). Used to identify the class of infrastructure resource
    associated with the log.
- name: seen_in_tier1_country
  description: Indicates whether the user has been observed accessing Firefox Accounts from a Tier 1 country. A value of true means at least one activity
    has been recorded from a Tier 1 country; false means no such activity has been detected.
- name: sender
  description: A hashed identifier representing the device or account that initiated a command or action. Used to attribute events to a specific originating
    party without exposing raw user identifiers.
- name: sender_os
  description: The operating system of the device that sent the command or initiated the event (e.g., Android, Windows, iOS). May be null when the
    sender device information is unavailable.
- name: sender_type
  description: The form factor category of the device that sent the command or initiated the event (e.g., mobile, desktop, tablet, vr). May be null
    when sender device information is not available.
- name: service
  description: The name of the Mozilla service or client application that generated the event (e.g., firefox-desktop, sync, fenix, firefox-ios). Used
    to attribute activity to a specific product or integration.
- name: severity
  description: The severity level of the log entry as defined by Cloud Logging (e.g., INFO, WARNING, ERROR). Indicates the importance or urgency of
    the logged event.
- name: sourceLocation_file
  description: The source code file name that produced the log entry, as reported by the application. This field is typically null when source location
    information is not emitted by the service.
- name: sourceLocation_function
  description: The name of the function or method in the source code that produced the log entry. This field is typically null when source location
    information is not emitted by the service.
- name: sourceLocation_line
  description: The line number within the source code file that produced the log entry. This field is typically null when source location information
    is not emitted by the service.
- name: spanId
  description: The span identifier associated with a distributed trace for the log entry. Used to correlate log entries with a specific span in a trace;
    typically null when distributed tracing is not in use.
- name: split_index
  description: The zero-based index of this record within a set of splits, used when a large log payload is broken into multiple parts. Null when the
    entry has not been split.
- name: split_totalSplits
  description: The total number of split parts that together comprise a single original log payload. Null when the entry has not been split.
- name: split_uid
  description: A unique identifier shared across all split parts of a single original log payload, used to reassemble them. Null when the entry has
    not been split.
- name: submission_date
  description: The date on which the event or record was submitted to the data pipeline, in UTC. Used as a partitioning and filtering key for date-based
    queries.
- name: submission_timestamp
  description: The precise UTC timestamp at which the event or record was submitted to the data pipeline. Provides sub-second resolution for ordering
    and deduplication within a submission date.
- name: target
  description: A hashed identifier representing the device or account that is the recipient of a command or action. Used to attribute events to a specific
    destination party without exposing raw user identifiers.
- name: target_os
  description: The operating system of the device that received the command or was the target of the event (e.g., Windows, Android, iOS). May be null
    when target device information is unavailable.
- name: target_type
  description: The form factor category of the device that received the command or was the target of the event (e.g., desktop, mobile, tablet, tv,
    vr). May be null when target device information is not available.
- name: textPayload
  description: The raw text payload of the log entry, used when the log message is an unstructured string rather than a structured JSON object. Typically
    null for structured log entries.
- name: timestamp
  description: The UTC timestamp of the event as recorded by the originating service or application. This reflects when the event actually occurred,
    and may differ from the ingestion receiveTimestamp.
- name: trace
  description: The distributed trace identifier associated with the log entry, formatted as a Cloud Trace resource name. Typically null when distributed
    tracing is not enabled for the service.
- name: traceSampled
  description: Indicates whether the log entry's associated trace was sampled for distributed tracing. A value of true means the trace was sampled;
    null or false means it was not.
- name: type
  description: The event type identifier describing the specific action or occurrence being recorded (e.g., device.command.retrieved, device.command.invoked).
    Used to categorize and filter events by their nature.
- name: ua_browser
  description: The name of the web browser derived from the user-agent string associated with the event (e.g., Firefox, Chrome, Safari). May be null
    when no user-agent information is available.
- name: ua_os
  description: The operating system derived from the user-agent string associated with the event (e.g., Windows, macOS, Android). Used to understand
    the platform context of the user's session.
- name: ua_version
  description: The version string of the browser derived from the user-agent associated with the event (e.g., 151.0). May be null when user-agent information
    is not present or parseable.
- name: uid
  description: The Firefox Accounts unique identifier for the user associated with the event. This is a stable, opaque identifier used to track a user
    across FxA services.
- name: user_id
  description: A hashed unique identifier for the Firefox Accounts user associated with the event. Used to link activity records to a specific user
    without exposing raw account credentials.
- name: useragent
  description: The raw user-agent string submitted with the request, identifying the client application and environment. Used for parsing browser,
    OS, and version information.
- name: utm_campaign
  description: The UTM campaign parameter from the marketing URL that referred the user to Firefox Accounts. Used to attribute account activity to
    a specific marketing campaign; typically null when not set.
- name: utm_content
  description: The UTM content parameter from the marketing URL that referred the user to Firefox Accounts. Used to differentiate ads or links within
    the same campaign; typically null when not set.
- name: utm_medium
  description: The UTM medium parameter from the marketing URL that referred the user to Firefox Accounts (e.g., email, cpc). Identifies the marketing
    channel; typically null when not set.
- name: utm_source
  description: The UTM source parameter from the marketing URL that referred the user to Firefox Accounts (e.g., newsletter, google). Identifies the
    traffic source; typically null when not set.
- name: utm_term
  description: The UTM term parameter from the marketing URL that referred the user to Firefox Accounts. Used to identify paid search keywords associated
    with the referral; typically null when not set.
- name: jsonPayload_config_log_level
  description: The configured logging level for the customs service (e.g., info, debug, warn), controlling the verbosity of log output.
- name: jsonPayload_config_limits_ratelimitintervalseconds
  description: Configuration value specifying the time window in seconds used for general rate limit counting in the customs service.
- name: jsonPayload_config_dataflow_gcppubsub_subscriptionname
  description: The name of the GCP Pub/Sub subscription used by the customs service dataflow integration to consume event messages.
- name: jsonPayload_config_tracing_batchprocessor
  description: Configuration flag indicating whether the tracing exporter uses a batch processor for sending spans. True means spans are batched before
    export.
- name: jsonPayload_fields_bounced
  description: Indicates whether the email associated with the account has a recorded bounce. True means a bounce exists on record.
- name: jsonPayload_fields_bounce
  description: Indicates whether an email sent to the account has bounced. True means a bounce was recorded.
- name: jsonPayload_fields_nvpdata
  description: Name-value pair data string from a PayPal IPN or NVP API response associated with a subscription event.
- name: jsonPayload_config_limits_uidratelimit_limitintervalseconds
  description: Configuration value specifying the time window in seconds over which per-user-ID rate limit checks are counted.
- name: jsonPayload_config_requestchecks_flowidrequiredonlogin
  description: Configuration flag indicating whether a flow ID is required on login requests. True means login requests lacking a flow ID are rejected
    or flagged.
- name: jsonPayload_fields_raw
  description: The raw, unparsed content of a message or payload as received by the FxA customs service.
- name: jsonPayload_config_limits_maxunblockattempts
  description: Configuration value defining the maximum number of unblock code attempts allowed per account before further unblocking is denied.
- name: jsonPayload_config_tracing_samplerate
  description: The fraction of requests (between 0 and 1) for which distributed traces are sampled and exported by the customs service.
- name: jsonPayload_config_limits_smsratelimit_limitintervalseconds
  description: Configuration value specifying the time window in seconds over which SMS rate limit attempts are counted.
- name: jsonPayload_action
  description: The FxA account action being checked or rate-limited by the customs service (e.g., login, sendVerifyCode, passwordChange).
- name: jsonPayload_config_limits_ipratelimitintervalseconds
  description: Configuration value specifying the time window in seconds used for per-IP rate limit counting in the customs service.
- name: jsonPayload_config_reputationservice_timeout
  description: Configuration value specifying the timeout in milliseconds for requests made to the FxA reputation service before the call is abandoned.
- name: jsonPayload_fields_diagnosticcode
  description: The diagnostic code returned by the receiving mail server when an email delivery failure or bounce occurred.
- name: jsonPayload_config_limits_uidratelimit_maxchecks
  description: Configuration value defining the maximum number of customs checks allowed per user ID within the UID rate limit interval.
- name: jsonPayload_blockreason
  description: A detailed reason string explaining why a request was blocked by the customs service, complementing the block flag.
- name: jsonPayload
  description: The structured JSON payload of the log entry when the Firefox Accounts service emits structured stderr output.
- name: jsonPayload_fields_clientname
  description: The human-readable name of the OAuth client (relying party) associated with the logged event.
- name: jsonPayload_fields_browser
  description: The browser name parsed from the user agent string of the client making the request.
- name: jsonPayload_config_userdefinedratelimitrules_totpcoderules_limits_ratelimitintervalms
  description: Configuration value specifying the rate limit interval in milliseconds applied to TOTP code actions under user-defined rate limit rules.
- name: jsonPayload_config_limits_maxaccountstatuscheck
  description: Configuration value defining the maximum number of account status check requests allowed per IP within the rate limit interval.
- name: jsonPayload_regex
  description: The regular expression pattern used during a blocklist or heuristic match that triggered the log event.
- name: jsonPayload_config_listen_port
  description: The port number on which the customs service HTTP server is configured to listen for incoming connections.
- name: jsonPayload_config_reputationservice_blockbelow
  description: Configuration threshold below which a reputation score causes the customs service to fully block the client request.
- name: jsonPayload_config_limits_blockintervalseconds
  description: Configuration value specifying the duration in seconds that a client remains in the blocked state after exceeding the bad login threshold.
- name: jsonPayload_config_userdefinedratelimitrules_tokencoderules_actions
  description: List of FxA account actions to which the user-defined token code rate limit rules apply.
- name: jsonPayload_config_requestchecks_flowidexemptuseragentres
  description: List of user-agent regular expressions that are exempt from the flow ID requirement on login requests.
- name: jsonPayload_fields_requestid
  description: A unique identifier assigned to the HTTP request for tracing and correlation across log entries.
- name: jsonPayload_config_limits_uidratelimit_bandurationseconds
  description: Configuration value specifying the ban duration in seconds applied to a user ID after exceeding the UID rate limit threshold.
- name: jsonPayload_err
  description: Error message string logged when the customs service encounters an exception or unexpected condition during request processing.
- name: jsonPayload_suspect
  description: Indicates whether the request was flagged as suspicious by the customs service. True means the client is considered suspect but not
    fully blocked.
- name: jsonPayload_config_sentry_samplerate
  description: The sampling rate (between 0 and 1) at which errors are sent to Sentry from the customs service, controlling error reporting volume.
- name: jsonPayload_config_limits_disableinterval
  description: Configuration value specifying the time interval (in seconds) for which account disabling is enforced after the disable threshold is
    exceeded.
- name: jsonPayload_fields_grant_type
  description: OAuth grant type string for a token request (e.g., 'authorization_code', 'fxa-credentials'); camelCase variant of granttype.
- name: jsonPayload_email
  description: SHA-256 hash of the user's email address, anonymized from the original value for privacy. The raw email is suppressed and replaced with
    this hash in the sanitized table.
- name: jsonPayload_config_limits_smsratelimit_maxsms
  description: Configuration value defining the maximum number of SMS messages allowed per account or IP within the SMS rate limit interval.
- name: jsonPayload_unblock
  description: Indicates whether an unblock code flow is being invoked. True means the customs service is permitting the request via an unblock override.
- name: jsonPayload_config_tracing_otel_url
  description: The endpoint URL to which the customs service exports OpenTelemetry trace data.
- name: jsonPayload_config_tracing_servicename
  description: The service name identifier used when registering spans with the configured distributed tracing backend.
- name: jsonPayload_fields_complaint
  description: Indicates whether an email complaint (spam report) was received for the account. True means a complaint was recorded.
- name: jsonPayload_config_tracing_otel_enabled
  description: Configuration flag indicating whether OpenTelemetry (OTEL) tracing is enabled for the customs service. True means traces are exported
    via OTEL.
- name: labels
  description: User-defined or system-assigned GCP log entry labels providing additional metadata about the log source or routing.
- name: jsonPayload_config_reputationservice_enablecheck
  description: Configuration flag indicating whether the reputation service check is active. True means reputation scores are evaluated for incoming
    requests.
- name: jsonPayload_config_reputationservice_hawkkey
  description: The HAWK authentication key used by the customs service to sign requests to the FxA reputation service.
- name: jsonPayload_config_memcache_address
  description: The network address of the Memcache instance used by the customs service for caching rate limit and block state; suppressed as PII.
- name: jsonPayload_config_dataflow_reportonly
  description: Configuration flag indicating whether the dataflow integration operates in report-only mode. True means dataflow events are logged but
    do not trigger enforcement.
- name: jsonPayload_filename
  description: The name of the IP blocklist or data file being loaded or processed by the customs service.
- name: jsonPayload_fields_now
  description: Current timestamp string at the time of the log event, used for relative time calculations in the FxA service.
- name: jsonPayload_listhitcount
  description: The number of blocklist entries that matched the current request's IP or email during a lookup.
- name: jsonPayload_config_userdefinedratelimitrules_tokencoderules_limits_periodms
  description: Configuration value specifying the rolling time window in milliseconds for counting token code attempts under user-defined rate limit
    rules.
- name: jsonPayload_config_limits_maxemails
  description: Configuration value defining the maximum number of email sends allowed per account or IP within the rate limit interval.
- name: jsonPayload_fields_bouncesubtype
  description: The subtype of an email bounce event, providing more granular classification (e.g., 'general', 'suppressed').
- name: jsonPayload_fields_rawtype
  description: The type identifier of the raw message payload before parsing or normalization.
- name: jsonPayload_config_reputationservice_baseurl
  description: The base URL of the FxA reputation service that the customs service calls to retrieve reputation scores for clients.
- name: jsonPayload_config_publicurl
  description: The public-facing base URL of the FxA customs service, used for self-reference in responses or documentation.
- name: jsonPayload_config_userdefinedratelimitrules_totpcoderules_actions
  description: List of FxA account actions to which the user-defined TOTP code rate limit rules apply.
- name: jsonPayload_config_userdefinedratelimitrules_tokencoderules_limits_ratelimitintervalms
  description: Configuration value specifying the rate limit interval in milliseconds applied to token code actions under user-defined rate limit rules.
- name: jsonPayload_config_userdefinedratelimitrules_totpcoderules_limits_max
  description: Configuration value defining the maximum number of TOTP code attempts allowed within the rate limit period under user-defined rules.
- name: jsonPayload_config_sentry_env
  description: The environment label (e.g., production, staging) attached to Sentry error reports from the customs service.
- name: jsonPayload_rtime
  description: The request processing time as reported by the customs service, typically representing the duration taken to handle a request.
- name: jsonPayload_fields_isaxioserror
  description: Indicates whether the error was an Axios HTTP client error. True means the failure originated in an outbound HTTP call.
- name: jsonPayload_config_limits_maxbadloginsperemail
  description: Configuration value defining the maximum number of bad login attempts allowed per email address before rate limiting is applied.
- name: jsonPayload_filesize
  description: The size in bytes of the IP blocklist or data file referenced in the log event.
- name: jsonPayload_fields_acceptlanguage
  description: Value of the HTTP Accept-Language header from the client request, used for email and UI localization.
- name: jsonPayload_config_limits_suspectinterval
  description: Configuration value specifying the time interval (in seconds) during which a client remains in the suspect state after being flagged.
- name: jsonPayload_config_reputationservice_suspectbelow
  description: Configuration threshold below which a reputation score causes the customs service to flag a client as suspect.
- name: jsonPayload_config_allowedemaildomains
  description: List of email domains that are explicitly allowed by the customs service, exempting them from certain rate-limiting or blocking rules.
- name: jsonPayload_config_limits_maxverifycodes
  description: Configuration value defining the maximum number of verification code attempts allowed per account or IP within the rate limit interval.
- name: jsonPayload_config_tracing_otel_concurrencylimit
  description: Configuration value specifying the maximum number of concurrent export requests allowed by the OpenTelemetry trace exporter.
- name: jsonPayload_config_ipblocklist_updatepollinterval
  description: Configuration value specifying how frequently (in seconds or milliseconds) the customs service polls for updates to the IP blocklist.
- name: jsonPayload_config_sentry_dsn
  description: The Sentry Data Source Name (DSN) used by the customs service to route error reports to the correct Sentry project.
- name: jsonPayload_config_limits_maxbadloginsperip
  description: Configuration value defining the maximum number of bad login attempts allowed from a single IP address before rate limiting is applied.
- name: jsonPayload_fields_promotioncode
  description: Promotion or coupon code applied to a Mozilla subscription purchase.
- name: jsonPayload_reason
  description: A string describing the reason the customs service took a particular action or flagged the request.
- name: jsonPayload_ip
  description: SHA-256 hash of the client IP address, anonymized from the original value for privacy. The raw IP is suppressed and replaced with this
    hash in the sanitized table.
- name: jsonPayload_listhits
  description: A string representation of the specific blocklist entries that matched the current request, providing detail on which lists were hit.
- name: jsonPayload_config_ipblocklist_enable
  description: Configuration flag indicating whether the IP blocklist feature is active in the customs service. True means blocklist enforcement is
    on.
- name: jsonPayload_err_isoperational
  description: Indicates whether the error is an operational error (expected runtime error) as opposed to a programming bug. True means it is an operational
    error.
- name: jsonPayload_config_limits_maxaccountaccess
  description: Configuration value defining the maximum number of account access attempts allowed per account within the rate limit interval.
- name: jsonPayload_config_reputationservice_enable
  description: Configuration flag indicating whether the FxA reputation service integration is enabled. True means reputation lookups are performed
    for requests.
- name: jsonPayload_fields_processingtimemillis
  description: The time in milliseconds taken to process the request by the FxA customs service.
- name: jsonPayload_loadedin
  description: The time in milliseconds taken to load an IP blocklist or configuration file into the customs service.
- name: jsonPayload_config_tracing_console_enabled
  description: Configuration flag indicating whether the customs service emits trace output to the console. True means console tracing is active.
- name: resource_labels
  description: Key-value labels associated with the GCP monitored resource, such as project ID, cluster name, namespace, and container name.
- name: jsonPayload_config_tracing_filterpii
  description: Configuration flag indicating whether PII fields are globally filtered from trace spans emitted by the customs service. True means PII
    is redacted.
- name: jsonPayload_config_ipblocklist_lists
  description: List of IP blocklist sources (e.g., URLs or identifiers) that the customs service actively enforces for blocking requests.
- name: jsonPayload_config_env
  description: The deployment environment of the customs service instance (e.g., production, staging), used for environment-specific configuration.
- name: jsonPayload_config_reputationservice_hawkid
  description: The HAWK authentication ID used by the customs service to authenticate requests to the FxA reputation service.
- name: jsonPayload_foundin
  description: Numeric identifier indicating which blocklist or data structure the client IP or email was found in during a lookup.
- name: jsonPayload_config_tracing_gcp_enabled
  description: Configuration flag indicating whether GCP Cloud Trace integration is enabled for the customs service. True means traces are exported
    to GCP.
- name: jsonPayload_config_dataflow_enabled
  description: Configuration flag indicating whether the dataflow integration is active in the customs service. True means the service consumes events
    from the configured Pub/Sub subscription.
- name: jsonPayload_config_userdefinedratelimitrules_tokencoderules_limits_max
  description: Configuration value defining the maximum number of token code attempts allowed within the rate limit period under user-defined rules.
- name: jsonPayload_port
  description: The port number on which the customs service is listening or on which the connection was received.
- name: jsonPayload_config_sentry_servername
  description: The server name tag included in Sentry error reports from the customs service, used to identify the originating host in error tracking.
- name: jsonPayload_fields_doc_url
  description: URL of the documentation page associated with an error, providing guidance for resolving the issue.
- name: jsonPayload_config_memcache_recordlifetimeseconds
  description: Configuration value specifying how long (in seconds) records are retained in the Memcache instance used by the customs service.
- name: jsonPayload_host
  description: The host value from the HTTP request or connection context processed by the customs service.
- name: jsonPayload_config_tracing_corsurls
  description: Comma-separated list of allowed CORS URLs configured for the customs service tracing endpoint.
- name: jsonPayload_fields_complaintuseragent
  description: The user agent string reported in the email complaint notification.
- name: jsonPayload_config_requestchecks_treateveryonewithsuspicion
  description: Configuration flag that, when true, causes the customs service to treat all incoming requests as suspect regardless of their history.
- name: resource
  description: The GCP monitored resource descriptor (type and labels) identifying the cloud resource that generated this stderr log entry.
- name: jsonPayload_error
  description: Structured error information logged by the FxA admin-backend when a request or operation fails, containing message, name, and chained
    cause details.
- name: jsonPayload_time
  description: The ISO 8601 timestamp recorded within the JSON payload indicating when the Firefox Accounts service generated this log event.
- name: jsonPayload_block
  description: Indicates whether the request was blocked by the customs service. True means the action was blocked; false means it was allowed to proceed.
- name: jsonPayload_config_tracing_clientname
  description: The client name identifier used when registering the customs service with the configured tracing backend.
- name: jsonPayload_fields_bouncetype
  description: The type of email bounce (e.g., 'Permanent', 'Transient') associated with a delivery failure event.
- name: jsonPayload_config_limits_maxbadlogins
  description: Configuration value defining the maximum number of failed login attempts allowed per account before blocking is triggered.
- name: jsonPayload_config_limits_ipratelimitbandurationseconds
  description: Configuration value specifying the duration in seconds that an IP address remains in the rate-limited band after exceeding the threshold.
- name: jsonPayload_config_listen_host
  description: The hostname or IP address on which the customs service HTTP server is configured to listen for incoming connections.
- name: jsonPayload_config_dataflow_ignoreolderthan
  description: Configuration value (in seconds or milliseconds) specifying the maximum age of dataflow events the customs service will process; older
    events are discarded.
- name: jsonPayload_config_updatepollintervalseconds
  description: Configuration value specifying how frequently (in seconds) the customs service polls for updates to its configuration or blocklist data.
- name: jsonPayload_fields_complaintfeedbacktype
  description: The feedback type reported in an email complaint notification (e.g., 'abuse', 'fraud').
- name: jsonPayload_fields_product
  description: Human-readable product name associated with a Mozilla subscription event.
- name: jsonPayload_config_ipblocklist_logonlylists
  description: List of IP blocklist sources that the customs service monitors in log-only mode, recording hits without enforcing blocks.
- name: jsonPayload_config_allowedips
  description: List of IP addresses explicitly allowed by the customs service, exempting them from rate limiting and blocking rules.
- name: jsonPayload_config_userdefinedratelimitrules_totpcoderules_limits_periodms
  description: Configuration value specifying the rolling time window in milliseconds for counting TOTP code attempts under user-defined rate limit
    rules.
- name: jsonPayload_config_dataflow_gcppubsub_projectid
  description: The GCP project ID of the Pub/Sub subscription used by the customs service dataflow integration to receive event data.
- name: jsonPayload_uid
  description: The Firefox Accounts user ID associated with the event, if the log entry relates to a specific user account action.
- name: jsonPayload_fields_tokenverified
  description: Indicates whether the session or sign-in token for the account has been verified. True means it is verified.
- name: jsonPayload_fields_currenttime
  description: The current server timestamp (in epoch milliseconds or seconds) at the time the log event was generated.
