fields:
- name: days_since_desktop_active
  type: INTEGER
  mode: NULLABLE
- name: days_since_seen
  type: INTEGER
  mode: NULLABLE
- name: days_since_active
  type: INTEGER
  mode: NULLABLE
- name: days_since_created_profile
  type: INTEGER
  mode: NULLABLE
- name: days_since_seen_session_start
  type: INTEGER
  mode: NULLABLE
- name: days_since_seen_session_end
  type: INTEGER
  mode: NULLABLE
- name: days_since_visited_1_uri
  type: INTEGER
  mode: NULLABLE
- name: days_seen_bits
  type: INTEGER
  mode: NULLABLE
- name: days_created_profile_bits
  type: INTEGER
  mode: NULLABLE
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: A number, 0-99, that samples by client_id and allows filtering data for analysis.
    It is a pipeline-generated artifact that should match between pings.
- name: first_run_date
  type: DATE
  mode: NULLABLE
  description: The date of the first run of the application.
- name: durations
  type: INTEGER
  mode: NULLABLE
- name: days_seen_session_start_bits
  type: INTEGER
  mode: NULLABLE
- name: days_seen_session_end_bits
  type: INTEGER
  mode: NULLABLE
- name: android_sdk_version
  type: STRING
  mode: NULLABLE
  description: The optional Android specific SDK version of the software running on this hardware device.
- name: locale
  type: STRING
  mode: NULLABLE
  description: Set of language- and/or country-based preferences for a user interface.
- name: city
  type: STRING
  mode: NULLABLE
  description: Name of the city in which the activity took place, as determined by
    the IP geolocation.
- name: country
  type: STRING
  mode: NULLABLE
  description: Name of the country in which the activity took place, as determined by
    the IP geolocation.
- name: app_build
  type: STRING
  mode: NULLABLE
- name: app_channel
  type: STRING
  mode: NULLABLE
  description: The channel the application is being distributed on.
- name: architecture
  type: STRING
  mode: NULLABLE
  description: The architecture of the device, (e.g. "arm", "x86").
- name: device_manufacturer
  type: STRING
  mode: NULLABLE
  description: The manufacturer of the device the application is running on.
    Not set if the device manufacturer can't be determined (e.g. on Desktop).
- name: device_model
  type: STRING
  mode: NULLABLE
  description: The model of the device the application is running on.
- name: telemetry_sdk_build
  type: STRING
  mode: NULLABLE
  description: The version of the Glean SDK at the time the ping was collected (e.g. 25.0.0).
- name: first_seen_date
  type: DATE
  mode: NULLABLE
  description: Date when the server first received a ping from this client.
- name: is_new_profile
  type: BOOLEAN
  mode: NULLABLE
- name: isp
  type: STRING
  mode: NULLABLE
  description: The name of the internet service provider associated with the client's IP address.
- name: days_active_bits
  type: INTEGER
  mode: NULLABLE
- name: geo_subdivision
  type: STRING
  mode: NULLABLE
  description: First major country subdivision, typically a state, province, or county based on IP address.
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the profile group, not shared with other telemetry data.
- name: install_source
  type: STRING
  mode: NULLABLE
- name: days_desktop_active_bits
  type: INTEGER
  mode: NULLABLE
- name: windows_build_number
  type: INTEGER
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: windows_build_number
- name: browser_engagement_uri_count
  type: INTEGER
  mode: NULLABLE
- name: browser_engagement_active_ticks
  type: INTEGER
  mode: NULLABLE
- name: legacy_telemetry_client_id
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: legacy_telemetry_client_id
- name: is_default_browser
  type: BOOLEAN
  mode: NULLABLE
  description: A flag indicating whether the browser is set as the default browser on the client side.
- name: attribution_dltoken
  type: STRING
  mode: NULLABLE
- name: attribution_dlsource
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_dlsource
- name: attribution_experiment
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_experiment
- name: attribution_variation
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_variation
- name: attribution_ua
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_ua
- name: experiments
  type: RECORD
  mode: REPEATED
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: experiments
  fields:
  - name: key
    type: STRING
    mode: NULLABLE
    description: The experiment or rollout slug identifying the Nimbus experiment the client is enrolled in.
  - name: value
    type: RECORD
    mode: NULLABLE
    fields:
    - name: branch
      type: STRING
      mode: NULLABLE
      description: The branch of the experiment the client is assigned to (e.g. 'control', 'treatment-a', 'rollout-branch').
    - name: extra
      type: RECORD
      mode: NULLABLE
      fields:
      - name: type
        type: STRING
        mode: NULLABLE
        description: The type of Nimbus enrollment for this experiment record (e.g. 'nimbus-rollout', 'nimbus-nimbus').
      - name: enrollment_id
        type: STRING
        mode: NULLABLE
        description: A UUID uniquely identifying the client's enrollment event in the experiment. Null in most
          records; populated when a specific enrollment ID is available.
- name: days_visited_1_uri_bits
  type: INTEGER
  mode: NULLABLE
- name: active_hours_sum
  type: FLOAT
  mode: NULLABLE
  description: Total hours the user was considered active (keyboard or mouse interaction) on the submission
    date, calculated as browser_engagement_active_ticks multiplied by 5 seconds and converted to hours.
- name: days_interacted_bits
  type: INTEGER
  mode: NULLABLE
- name: startup_profile_selection_reason_first
  type: STRING
  mode: NULLABLE
  description: How the Firefox profile was selected during startup on the first recorded ping of the submission
    date. Values include 'default', 'firstrun-created-default', 'argument-profile', 'profile-selector',
    'restart', etc. Null when not available.
- name: app_name
  type: STRING
  mode: NULLABLE
  description: The name of the application.
- name: app_version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
- name: app_version_major
  type: NUMERIC
  mode: NULLABLE
  description: The major version of the user visible app version string for the browser,
    e.g. "142.1.3", has major version 142
- name: app_version_minor
  type: NUMERIC
  mode: NULLABLE
  description: The minor version of the user visible app version string for the browser,
    e.g. "142.1.3" has minor version 1
- name: app_version_patch_revision
  type: NUMERIC
  mode: NULLABLE
  description: The patch revision component of the browser version string (e.g. 6 for '152.0.6'), parsed
    using mozfun.norm.browser_version_info. Null for major releases with no patch component.
- name: app_version_is_major_release
  type: BOOLEAN
  mode: NULLABLE
  description: True if the browser version is a major release (e.g. '153.0' with no patch), false if it
    is a point release (e.g. '152.0.6').
- name: channel
  type: STRING
  mode: NULLABLE
  description: The normalized channel the application is being distributed on.
- name: distribution_id
  type: STRING
  mode: NULLABLE
  description: The distribution id associated with the install of Firefox.
- name: distribution_id_source
  type: STRING
  mode: NULLABLE
  description: Indicates whether the distribution_id was sourced from 'glean' (Glean baseline ping) or 'legacy'
    (legacy telemetry distribution mapping). Null when distribution_id is not set.
- name: os
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: os
- name: os_grouped
  type: STRING
  mode: NULLABLE
  description: A grouping of the operating system name, identical to the `os` field. Included for compatibility
    with legacy reporting surfaces.
- name: os_version
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: os_version
- name: os_version_build
  type: STRING
  mode: NULLABLE
  description: A human-readable OS version build string derived using mozfun.norm.glean_windows_version_info
    (e.g. 'Windows 11', 'Windows 10'). Falls back to normalized_os_version when the Windows version lookup
    is unavailable.
- name: os_version_major
  type: INTEGER
  mode: NULLABLE
  description: The major version component of the operating system version (e.g. 10 for Windows 10.0), extracted
    from normalized_os_version.
- name: os_version_minor
  type: INTEGER
  mode: NULLABLE
  description: The minor version component of the operating system version (e.g. 0 for Windows 10.0), extracted
    from normalized_os_version.
- name: activity_segment
  type: STRING
  mode: NULLABLE
  description: Classification of users based on their browsing activity.
    E.g., infrequent, casual, regular.
- name: first_seen_year
  type: INTEGER
  mode: NULLABLE
  description: Year of the client's first seen date.
- name: is_daily_user
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating if client is considered a daily user on the submission date.
- name: is_weekly_user
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating if client is considered a weekly user on the submission date.
- name: is_monthly_user
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating if client is considered a monthly user on the submission date.
- name: is_dau
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating the client is counted as a daily active user on this submission date.
- name: is_wau
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating the client is counted as a weekly active user on this submission date.
- name: is_mau
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating the client is counted as a weekly active user on this submission date.
- name: attribution_campaign
  type: STRING
  mode: NULLABLE
- name: attribution_content
  type: STRING
  mode: NULLABLE
- name: attribution_medium
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_medium
- name: attribution_source
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_source
- name: attribution_term
  type: STRING
  mode: NULLABLE
- name: distribution_name
  type: STRING
  mode: NULLABLE
  description: The optional distribution name for the current ping (e.g. 'canonical-002', 'mozilla-MSIX').
    Can be a partner name or distribution configuration preset. Null when not set.
- name: first_seen_attribution_campaign
  type: STRING
  mode: NULLABLE
  description: The attribution campaign recorded at the time the client was first seen, analogous to UTM
    campaign. Null when not available.
- name: first_seen_attribution_content
  type: STRING
  mode: NULLABLE
  description: The attribution content parameter recorded at the time the client was first seen, analogous
    to UTM content. Null when not available.
- name: first_seen_attribution_medium
  type: STRING
  mode: NULLABLE
  description: The attribution medium recorded at the time the client was first seen, analogous to UTM medium
    (e.g. 'referral', 'paidsearch'). Null when not available.
- name: first_seen_attribution_source
  type: STRING
  mode: NULLABLE
  description: The attribution source recorded at the time the client was first seen, analogous to UTM source
    (e.g. 'www.google.com'). Null when not available.
- name: first_seen_attribution_term
  type: STRING
  mode: NULLABLE
  description: The attribution search term recorded at the time the client was first seen, analogous to
    UTM term. Always null for this table.
- name: first_seen_distribution_name
  type: STRING
  mode: NULLABLE
  description: The distribution name recorded at the time the client was first seen (e.g. 'canonical-002',
    'mozilla-MSIX'). Null when not available.
- name: is_desktop
  type: BOOLEAN
  mode: NULLABLE
  description: Indicates if the client is included in the desktop KPI.
- name: attribution_msclkid
  type: STRING
  mode: NULLABLE
  description: Unique token created at Firefox download time using the Microsoft Store.
- mode: NULLABLE
  name: policies_is_enterprise
  type: BOOLEAN
  description: |-
    Attempt to determine if the user is an enterprise user based on various signals.
    This metric was generated to correspond to the Legacy Telemetry scalar policies.is_enterprise.
