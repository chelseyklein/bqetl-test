fields:
- name: days_since_desktop_active
  type: INTEGER
  mode: NULLABLE
  description: Number of days since the client was last active on desktop (i.e., sent a ping counted in
    days_desktop_active_bits). Null when the client has no desktop activity in the past 28 days.
- name: days_since_seen
  type: INTEGER
  mode: NULLABLE
  description: Number of days since any ping was received from the client (derived from days_seen_bits).
    A value of 0 means the client was seen on the submission date.
- name: days_since_active
  type: INTEGER
  mode: NULLABLE
  description: Number of days since the client was last considered active (derived from days_active_bits).
    Null when the client has no active days recorded in the past 28-day window.
- name: days_since_created_profile
  type: INTEGER
  mode: NULLABLE
  description: Number of days since the client's profile was created, derived from days_created_profile_bits.
    Null for profiles that were not created within the 28-day window.
- name: days_since_seen_session_start
  type: INTEGER
  mode: NULLABLE
  description: Number of days since a session start event was last observed for this client (derived from
    days_seen_session_start_bits). Null when no session start was recorded in the 28-day window.
- name: days_since_seen_session_end
  type: INTEGER
  mode: NULLABLE
  description: Number of days since a session end event was last observed for this client (derived from
    days_seen_session_end_bits). Null when no session end was recorded in the 28-day window.
- name: days_since_visited_1_uri
  type: INTEGER
  mode: NULLABLE
  description: Number of days since the client last visited at least one URI (derived from days_visited_1_uri_bits).
    Null when no URI visit was recorded in the 28-day window.
- name: days_seen_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each set bit indicates a day in the past 28 days on which any ping
    was received from this client. The most significant bit represents the most recent day.
- name: days_created_profile_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each set bit indicates a day in the past 28 days on which the client's
    profile was created. Typically only one bit will be set.
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: A number, 0-99, that samples by client_id and allows filtering data for analysis.
    It is a pipeline-generated artifact that should match between pings.
- name: first_run_date
  type: DATE
  mode: NULLABLE
  description: The date of the first run of the application.
- name: durations
  type: INTEGER
  mode: NULLABLE
  description: Total session duration in seconds summed over the most recent ping(s) received from the client.
    Aggregated from the baseline ping duration metric.
- name: days_seen_session_start_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each set bit indicates a day in the past 28 days on which a session
    start event was recorded for this client.
- name: days_seen_session_end_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each set bit indicates a day in the past 28 days on which a session
    end event was recorded for this client.
- name: android_sdk_version
  type: STRING
  mode: NULLABLE
  description: The optional Android specific SDK version of the software running on this hardware device.
- name: locale
  type: STRING
  mode: NULLABLE
  description: Set of language- and/or country-based preferences for a user interface.
- name: city
  type: STRING
  mode: NULLABLE
  description: Name of the city in which the activity took place, as determined by
    the IP geolocation.
- name: country
  type: STRING
  mode: NULLABLE
  description: Name of the country in which the activity took place, as determined by
    the IP geolocation.
- name: app_build
  type: STRING
  mode: NULLABLE
  description: The build identifier generated by the CI system (e.g. "20210318103112"). If the value was
    not provided through configuration, this metric gets set to "Unknown".
- name: app_channel
  type: STRING
  mode: NULLABLE
  description: The channel the application is being distributed on.
- name: architecture
  type: STRING
  mode: NULLABLE
  description: The architecture of the device, (e.g. "arm", "x86").
- name: device_manufacturer
  type: STRING
  mode: NULLABLE
  description: The manufacturer of the device the application is running on.
    Not set if the device manufacturer can't be determined (e.g. on Desktop).
- name: device_model
  type: STRING
  mode: NULLABLE
  description: The model of the device the application is running on.
- name: telemetry_sdk_build
  type: STRING
  mode: NULLABLE
  description: The version of the Glean SDK at the time the ping was collected (e.g. 25.0.0).
- name: first_seen_date
  type: DATE
  mode: NULLABLE
  description: Date when the server first received a ping from this client.
- name: is_new_profile
  type: BOOLEAN
  mode: NULLABLE
  description: Indicates whether this client represents a newly created profile as of the submission date.
    True if the profile was first seen on or very close to the submission date.
- name: isp
  type: STRING
  mode: NULLABLE
  description: The name of the internet service provider associated with the client's IP address.
- name: days_active_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each set bit indicates a day in the past 28 days on which the client
    was considered active (i.e., sent a baseline ping with user activity).
- name: geo_subdivision
  type: STRING
  mode: NULLABLE
  description: First major country subdivision, typically a state, province, or county based on IP address.
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the profile group, not shared with other telemetry data.
- name: install_source
  type: STRING
  mode: NULLABLE
  description: The source from which Firefox was installed (e.g., from the Microsoft Store or a direct download).
    Currently not populated for Firefox Desktop Glean-based data.
- name: days_desktop_active_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each set bit indicates a day in the past 28 days on which the client
    was active specifically on the Firefox Desktop application. Used to compute DAU, WAU, and MAU for desktop.
- name: windows_build_number
  type: INTEGER
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: windows_build_number
- name: browser_engagement_uri_count
  type: INTEGER
  mode: NULLABLE
  description: The number of total non-unique http(s) URIs visited, including page reloads, after the session
    has been restored. URIs on minimized or background tabs may also be counted; private browsing URIs are
    included.
- name: browser_engagement_active_ticks
  type: INTEGER
  mode: NULLABLE
  description: The number of five-second intervals ('ticks') the user was considered active, meaning keyboard
    or mouse interaction was detected with the application.
- name: legacy_telemetry_client_id
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: legacy_telemetry_client_id
- name: is_default_browser
  type: BOOLEAN
  mode: NULLABLE
  description: A flag indicating whether the browser is set as the default browser on the client side.
- name: attribution_dltoken
  type: STRING
  mode: NULLABLE
  description: A unique token (UUID) assigned to a Firefox download at the time the installer was fetched.
    Used to link installs back to specific download events.
- name: attribution_dlsource
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_dlsource
- name: attribution_experiment
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_experiment
- name: attribution_variation
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_variation
- name: attribution_ua
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_ua
- name: experiments
  type: RECORD
  mode: REPEATED
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: experiments
  fields:
  - name: key
    type: STRING
    mode: NULLABLE
  description: The experiment slug (identifier) for an active Nimbus experiment or rollout that the client
    is enrolled in.
  - name: value
    type: RECORD
    mode: NULLABLE
    fields:
    - name: branch
      type: STRING
      mode: NULLABLE
  description: The branch of the experiment (e.g., "control", "treatment-a") that this client is assigned
    to within the corresponding experiment slug.
    - name: extra
      type: RECORD
      mode: NULLABLE
      fields:
      - name: type
        type: STRING
        mode: NULLABLE
  description: The type of Nimbus enrollment, indicating whether the experiment entry is a rollout or a
    standard experiment (e.g., "nimbus-rollout", "nimbus-nimbus").
      - name: enrollment_id
        type: STRING
        mode: NULLABLE
  description: A unique UUID identifying this client's specific enrollment event into the experiment. Null
    for most records; set to "__NO_ENROLLMENT_ID__" in rare cases where the ID was unavailable.
- name: days_visited_1_uri_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each set bit indicates a day in the past 28 days on which the client
    visited at least one URI.
- name: active_hours_sum
  type: FLOAT
  mode: NULLABLE
  description: Total hours the client was considered active, derived by converting browser_engagement_active_ticks
    (5-second intervals) to hours. Represents cumulative active time from the most recent baseline ping.
- name: days_interacted_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each set bit indicates a day in the past 28 days on which the client
    had at least one active interaction tick recorded.
- name: startup_profile_selection_reason_first
  type: STRING
  mode: NULLABLE
  description: The reason the Firefox profile was selected during the first startup observed in the 28-day
    window. Possible values include "default", "firstrun-created-default", "restart", "argument-profile",
    and others; see the startup.profile_selection_reason probe for the full list.
- name: app_name
  type: STRING
  mode: NULLABLE
  description: The name of the application.
- name: app_version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
- name: app_version_major
  type: NUMERIC
  mode: NULLABLE
  description: The major version of the user visible app version string for the browser,
    e.g. "142.1.3", has major version 142
- name: app_version_minor
  type: NUMERIC
  mode: NULLABLE
  description: The minor version of the user visible app version string for the browser,
    e.g. "142.1.3" has minor version 1
- name: app_version_patch_revision
  type: NUMERIC
  mode: NULLABLE
  description: The patch/revision component of the user-visible app version string, e.g., "142.1.3" has
    patch revision 3. Null when the version string has no patch component.
- name: app_version_is_major_release
  type: BOOLEAN
  mode: NULLABLE
  description: Indicates whether the running Firefox version is a major release (i.e., the patch revision
    is 0 or absent). True for versions like "152.0" and false for point releases like "152.0.4".
- name: channel
  type: STRING
  mode: NULLABLE
  description: The normalized channel the application is being distributed on.
- name: distribution_id
  type: STRING
  mode: NULLABLE
  description: The distribution id associated with the install of Firefox.
- name: distribution_id_source
  type: STRING
  mode: NULLABLE
  description: Indicates which telemetry system provided the distribution_id value; "glean" when sourced
    from the Glean baseline ping, "legacy" when backfilled from a legacy telemetry mapping table, or null
    when no distribution_id is available.
- name: os
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: os
- name: os_grouped
  type: STRING
  mode: NULLABLE
  description: The operating system name, grouped into high-level categories (Windows, Mac, Linux, Other).
    Derived from the normalized OS and included for compatibility with legacy data sources.
- name: os_version
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: os_version
- name: os_version_build
  type: STRING
  mode: NULLABLE
  description: A human-readable OS version string incorporating the Windows build number where available
    (e.g., "Windows 11", "Windows 10"), or the raw normalized OS version string for non-Windows platforms.
- name: os_version_major
  type: INTEGER
  mode: NULLABLE
  description: The major version component of the normalized OS version string (e.g., 10 for Windows 10,
    6 for older Windows versions).
- name: os_version_minor
  type: INTEGER
  mode: NULLABLE
  description: The minor version component of the normalized OS version string (e.g., 0 for Windows 10.0,
    1 for certain Linux kernel builds).
- name: activity_segment
  type: STRING
  mode: NULLABLE
  description: Classification of users based on their browsing activity.
    E.g., infrequent, casual, regular.
- name: first_seen_year
  type: INTEGER
  mode: NULLABLE
  description: Year of the client's first seen date.
- name: is_daily_user
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating if client is considered a daily user on the submission date.
- name: is_weekly_user
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating if client is considered a weekly user on the submission date.
- name: is_monthly_user
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating if client is considered a monthly user on the submission date.
- name: is_dau
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating the client is counted as a daily active user on this submission date.
- name: is_wau
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating the client is counted as a weekly active user on this submission date.
- name: is_mau
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating the client is counted as a weekly active user on this submission date.
- name: attribution_campaign
  type: STRING
  mode: NULLABLE
  description: The optional attribution campaign associated with the Firefox install, similar to UTM campaign.
    Null when attribution data is not available.
- name: attribution_content
  type: STRING
  mode: NULLABLE
  description: The optional attribution content field associated with the Firefox install, similar to UTM
    content. Null when attribution data is not available.
- name: attribution_medium
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_medium
- name: attribution_source
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_source
- name: attribution_term
  type: STRING
  mode: NULLABLE
  description: The optional attribution term associated with the Firefox install, similar to UTM term. Currently
    always null for Firefox Desktop.
- name: distribution_name
  type: STRING
  mode: NULLABLE
  description: The optional distribution name for the current ping, which can be a partner name or a distribution
    configuration preset (e.g., "canonical-002", "mozilla-MSIX"). Null when no distribution is associated.
- name: first_seen_attribution_campaign
  type: STRING
  mode: NULLABLE
  description: The attribution campaign recorded at the time the client was first seen. Null when attribution
    data was not available at first seen.
- name: first_seen_attribution_content
  type: STRING
  mode: NULLABLE
  description: The attribution content recorded at the time the client was first seen. Null when attribution
    data was not available at first seen.
- name: first_seen_attribution_medium
  type: STRING
  mode: NULLABLE
  description: The attribution medium recorded at the time the client was first seen (e.g., "referral",
    "paidsearch"). Null when attribution data was not available at first seen.
- name: first_seen_attribution_source
  type: STRING
  mode: NULLABLE
  description: The attribution source recorded at the time the client was first seen (e.g., "www.google.com").
    Null when attribution data was not available at first seen.
- name: first_seen_attribution_term
  type: STRING
  mode: NULLABLE
  description: The attribution term recorded at the time the client was first seen. Currently always null
    for Firefox Desktop.
- name: first_seen_distribution_name
  type: STRING
  mode: NULLABLE
  description: The distribution name recorded at the time the client was first seen. Null when no distribution
    was associated at the time of first seen.
- name: is_desktop
  type: BOOLEAN
  mode: NULLABLE
  description: Indicates if the client is included in the desktop KPI.
- name: attribution_msclkid
  type: STRING
  mode: NULLABLE
  description: Unique token created at Firefox download time using the Microsoft Store.
- mode: NULLABLE
  name: policies_is_enterprise
  type: BOOLEAN
  description: |-
    Attempt to determine if the user is an enterprise user based on various signals.
    This metric was generated to correspond to the Legacy Telemetry scalar policies.is_enterprise.
