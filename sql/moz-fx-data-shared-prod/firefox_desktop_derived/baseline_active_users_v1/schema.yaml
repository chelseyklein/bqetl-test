fields:
- name: days_since_desktop_active
  type: INTEGER
  mode: NULLABLE
  description: Number of days since the client was last active on Firefox Desktop, derived from days_desktop_active_bits.
    Null when the client has not been active on Desktop in the past 28 days.
- name: days_since_seen
  type: INTEGER
  mode: NULLABLE
  description: Number of days since the client was last seen (i.e. sent any ping), derived from days_seen_bits.
    A value of 0 means the client was seen on the submission date.
- name: days_since_active
  type: INTEGER
  mode: NULLABLE
  description: Number of days since the client was last active (had any activity via days_active_bits),
    derived from the bits field. Null when the client has not been active in the past 28 days.
- name: days_since_created_profile
  type: INTEGER
  mode: NULLABLE
  description: Number of days since the client first created their profile, derived from days_created_profile_bits.
    Null when no profile creation event is recorded in the past 28 days.
- name: days_since_seen_session_start
  type: INTEGER
  mode: NULLABLE
  description: Number of days since the client last had a session start event, derived from days_seen_session_start_bits.
    Null when no session start has been recorded in the past 28 days.
- name: days_since_seen_session_end
  type: INTEGER
  mode: NULLABLE
  description: Number of days since the client last had a session end event, derived from days_seen_session_end_bits.
    Null when no session end has been recorded in the past 28 days.
- name: days_since_visited_1_uri
  type: INTEGER
  mode: NULLABLE
  description: Number of days since the client last visited at least one URI, derived from days_visited_1_uri_bits.
    Null when no URI visit has been recorded in the past 28 days.
- name: days_seen_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each bit represents whether the client was seen on a given day in
    the past 28 days, with the most-significant bit representing the most recent day.
- name: days_created_profile_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each bit represents whether the client created a new profile on a
    given day in the past 28 days, with the most-significant bit representing the most recent day.
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: A number, 0-99, that samples by client_id and allows filtering data for analysis.
    It is a pipeline-generated artifact that should match between pings.
- name: first_run_date
  type: DATE
  mode: NULLABLE
  description: The date of the first run of the application.
- name: durations
  type: INTEGER
  mode: NULLABLE
  description: Total session duration in seconds aggregated from the Glean baseline ping for the submission
    date.
- name: days_seen_session_start_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each bit represents whether the client had a session start event on
    a given day in the past 28 days, with the most-significant bit representing the most recent day.
- name: days_seen_session_end_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each bit represents whether the client had a session end event on
    a given day in the past 28 days, with the most-significant bit representing the most recent day.
- name: android_sdk_version
  type: STRING
  mode: NULLABLE
  description: The optional Android specific SDK version of the software running on this hardware device.
- name: locale
  type: STRING
  mode: NULLABLE
  description: Set of language- and/or country-based preferences for a user interface.
- name: city
  type: STRING
  mode: NULLABLE
  description: Name of the city in which the activity took place, as determined by
    the IP geolocation.
- name: country
  type: STRING
  mode: NULLABLE
  description: Name of the country in which the activity took place, as determined by
    the IP geolocation.
- name: app_build
  type: STRING
  mode: NULLABLE
  description: The build identifier generated by the CI system (e.g. "20260715202819"). If the value was
    not provided through configuration, this metric gets set to 'Unknown'.
- name: app_channel
  type: STRING
  mode: NULLABLE
  description: The channel the application is being distributed on.
- name: architecture
  type: STRING
  mode: NULLABLE
  description: The architecture of the device, (e.g. "arm", "x86").
- name: device_manufacturer
  type: STRING
  mode: NULLABLE
  description: The manufacturer of the device the application is running on.
    Not set if the device manufacturer can't be determined (e.g. on Desktop).
- name: device_model
  type: STRING
  mode: NULLABLE
  description: The model of the device the application is running on.
- name: telemetry_sdk_build
  type: STRING
  mode: NULLABLE
  description: The version of the Glean SDK at the time the ping was collected (e.g. 25.0.0).
- name: first_seen_date
  type: DATE
  mode: NULLABLE
  description: Date when the server first received a ping from this client.
- name: is_new_profile
  type: BOOLEAN
  mode: NULLABLE
  description: True if the client's first seen date matches the submission date, indicating this is a newly
    created profile first observed today.
- name: isp
  type: STRING
  mode: NULLABLE
  description: The name of the internet service provider associated with the client's IP address.
- name: days_active_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each bit represents whether the client was active (had keyboard or
    mouse interaction) on a given day in the past 28 days, with the most-significant bit representing the
    most recent day.
- name: geo_subdivision
  type: STRING
  mode: NULLABLE
  description: First major country subdivision, typically a state, province, or county based on IP address.
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the profile group, not shared with other telemetry data.
- name: install_source
  type: STRING
  mode: NULLABLE
  description: The source from which Firefox was installed. Always null for this table (not populated from
    the Glean baseline ping).
- name: days_desktop_active_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each bit represents whether the client was active on Firefox Desktop
    on a given day in the past 28 days, used to compute DAU/WAU/MAU and the activity segment.
- name: windows_build_number
  type: INTEGER
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: windows_build_number
- name: browser_engagement_uri_count
  type: INTEGER
  mode: NULLABLE
  description: The total number of non-unique http(s) URIs visited, including page reloads and private browsing
    URIs, after session restore. Migrated from Telemetry's browser.engagement.total_uri_count_normal_and_private_mode.
- name: browser_engagement_active_ticks
  type: INTEGER
  mode: NULLABLE
  description: The number of five-second intervals ('ticks') the user was considered 'active' via keyboard
    or mouse interaction with the application. Migrated from Telemetry's browser.engagement.active_ticks.
- name: legacy_telemetry_client_id
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: legacy_telemetry_client_id
- name: is_default_browser
  type: BOOLEAN
  mode: NULLABLE
  description: A flag indicating whether the browser is set as the default browser on the client side.
- name: attribution_dltoken
  type: STRING
  mode: NULLABLE
  description: A unique token generated at Firefox download time, used to link an install to a specific
    download event. Null when attribution data is not available.
- name: attribution_dlsource
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_dlsource
- name: attribution_experiment
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_experiment
- name: attribution_variation
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_variation
- name: attribution_ua
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_ua
- name: experiments
  type: RECORD
  mode: REPEATED
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: experiments
  fields:
  - name: key
    type: STRING
    mode: NULLABLE
  description: The slug identifier of the Nimbus experiment or rollout the client is enrolled in.
  - name: value
    type: RECORD
    mode: NULLABLE
    fields:
    - name: branch
      type: STRING
      mode: NULLABLE
  description: The branch of the Nimbus experiment or rollout the client is assigned to (e.g. 'control',
    'treatment-a', 'rollout').
    - name: extra
      type: RECORD
      mode: NULLABLE
      fields:
      - name: type
        type: STRING
        mode: NULLABLE
  description: The type of the Nimbus enrollment, indicating whether this is a rollout or an experiment
    (e.g. 'nimbus-rollout', 'nimbus-nimbus').
      - name: enrollment_id
        type: STRING
        mode: NULLABLE
  description: A UUID uniquely identifying the specific enrollment instance of a client into a Nimbus experiment
    or rollout. Null when no enrollment ID is available.
- name: days_visited_1_uri_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each bit represents whether the client visited at least 1 URI on a
    given day in the past 28 days, with the most-significant bit representing the most recent day.
- name: active_hours_sum
  type: FLOAT
  mode: NULLABLE
  description: Total active hours derived from browser_engagement_active_ticks, representing time in hours
    the user was actively interacting with Firefox on the submission date.
- name: days_interacted_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer where each bit represents whether the client had any keyboard or mouse interaction
    with Firefox on a given day in the past 28 days, with the most-significant bit representing the most
    recent day.
- name: startup_profile_selection_reason_first
  type: STRING
  mode: NULLABLE
  description: How the Firefox profile was selected during the first startup of the reporting window. Possible
    values include 'default', 'firstrun-created-default', 'restart', 'argument-profile', 'profile-selector',
    'profile-reset', and others.
- name: app_name
  type: STRING
  mode: NULLABLE
  description: The name of the application.
- name: app_version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
- name: app_version_major
  type: NUMERIC
  mode: NULLABLE
  description: The major version of the user visible app version string for the browser,
    e.g. "142.1.3", has major version 142
- name: app_version_minor
  type: NUMERIC
  mode: NULLABLE
  description: The minor version of the user visible app version string for the browser,
    e.g. "142.1.3" has minor version 1
- name: app_version_patch_revision
  type: NUMERIC
  mode: NULLABLE
  description: The patch revision component of the user-visible app version string (e.g. for "152.0.6",
    the patch revision is 6). Null when no patch revision is present.
- name: app_version_is_major_release
  type: BOOLEAN
  mode: NULLABLE
  description: True when the app version represents a major release (i.e. the minor and patch components
    are both zero), false otherwise.
- name: channel
  type: STRING
  mode: NULLABLE
  description: The normalized channel the application is being distributed on.
- name: distribution_id
  type: STRING
  mode: NULLABLE
  description: The distribution id associated with the install of Firefox.
- name: distribution_id_source
  type: STRING
  mode: NULLABLE
  description: Indicates whether the distribution_id was sourced from 'glean' or 'legacy' telemetry. Null
    when no distribution ID is available from either source.
- name: os
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: os
- name: os_grouped
  type: STRING
  mode: NULLABLE
  description: A grouping of the operating system name, identical to the `os` column. Retained for compatibility
    with legacy data sources.
- name: os_version
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: os_version
- name: os_version_build
  type: STRING
  mode: NULLABLE
  description: A human-readable OS version label combining the OS version and Windows build number when
    available (e.g. 'Windows 11', 'Windows 10'). Falls back to the raw normalized_os_version for non-Windows
    platforms.
- name: os_version_major
  type: INTEGER
  mode: NULLABLE
  description: The major component of the OS version string, extracted as an integer (e.g. 10 for Windows
    10).
- name: os_version_minor
  type: INTEGER
  mode: NULLABLE
  description: The minor component of the OS version string, extracted as an integer (e.g. 0 for Windows
    10.0).
- name: activity_segment
  type: STRING
  mode: NULLABLE
  description: Classification of users based on their browsing activity.
    E.g., infrequent, casual, regular.
- name: first_seen_year
  type: INTEGER
  mode: NULLABLE
  description: Year of the client's first seen date.
- name: is_daily_user
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating if client is considered a daily user on the submission date.
- name: is_weekly_user
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating if client is considered a weekly user on the submission date.
- name: is_monthly_user
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating if client is considered a monthly user on the submission date.
- name: is_dau
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating the client is counted as a daily active user on this submission date.
- name: is_wau
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating the client is counted as a weekly active user on this submission date.
- name: is_mau
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating the client is counted as a weekly active user on this submission date.
- name: attribution_campaign
  type: STRING
  mode: NULLABLE
  description: The optional attribution campaign at the time of the most recent install, similar to UTM
    'campaign'. Null when attribution data is not available.
- name: attribution_content
  type: STRING
  mode: NULLABLE
  description: The optional attribution content at the time of the most recent install, similar to UTM 'content'.
    Null when attribution data is not available.
- name: attribution_medium
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_medium
- name: attribution_source
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_source
- name: attribution_term
  type: STRING
  mode: NULLABLE
  description: The optional attribution term at the time of the most recent install, similar to UTM 'term'.
    Always null in this table.
- name: distribution_name
  type: STRING
  mode: NULLABLE
  description: The optional distribution name associated with the most recent Firefox install (e.g. 'canonical-002',
    'mint-001'). Can be a partner name or a distribution configuration preset.
- name: first_seen_attribution_campaign
  type: STRING
  mode: NULLABLE
  description: The attribution campaign at the time the client was first seen, similar to UTM 'campaign'.
    Null when first-seen attribution data is not available.
- name: first_seen_attribution_content
  type: STRING
  mode: NULLABLE
  description: The attribution content at the time the client was first seen, similar to UTM 'content'.
    Null when first-seen attribution data is not available.
- name: first_seen_attribution_medium
  type: STRING
  mode: NULLABLE
  description: The attribution medium at the time the client was first seen, similar to UTM 'medium' (e.g.
    'referral', 'paidsearch'). Null when first-seen attribution data is not available.
- name: first_seen_attribution_source
  type: STRING
  mode: NULLABLE
  description: The attribution source at the time the client was first seen, similar to UTM 'source' (e.g.
    'www.google.com', 'www.bing.com'). Null when first-seen attribution data is not available.
- name: first_seen_attribution_term
  type: STRING
  mode: NULLABLE
  description: The attribution term at the time the client was first seen, similar to UTM 'term'. Always
    null in this table.
- name: first_seen_distribution_name
  type: STRING
  mode: NULLABLE
  description: The distribution name at the time the client was first seen. Null when first-seen distribution
    data is not available.
- name: is_desktop
  type: BOOLEAN
  mode: NULLABLE
  description: Indicates if the client is included in the desktop KPI.
- name: attribution_msclkid
  type: STRING
  mode: NULLABLE
  description: Unique token created at Firefox download time using the Microsoft Store.
- mode: NULLABLE
  name: policies_is_enterprise
  type: BOOLEAN
  description: |-
    Attempt to determine if the user is an enterprise user based on various signals.
    This metric was generated to correspond to the Legacy Telemetry scalar policies.is_enterprise.
