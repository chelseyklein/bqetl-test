fields:
- name: days_since_desktop_active
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client was last active on Firefox Desktop, derived from the
    days_desktop_active_bits bitmask. Null when the client has no desktop activity in the 28-day window.
- name: days_since_seen
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client was last seen (i.e. sent any ping), derived from the
    days_seen_bits bitmask. Ranges from 0 (seen today) to 27.
- name: days_since_active
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client was last active (had any recorded activity), derived
    from the days_active_bits bitmask. Null when the client has had no activity in the 28-day window.
- name: days_since_created_profile
  type: INTEGER
  mode: NULLABLE
  description: The number of days since a new profile creation was observed for this client, derived from
    days_created_profile_bits. Null when no profile creation event was seen in the 28-day window.
- name: days_since_seen_session_start
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client last had a session-start baseline ping, derived from
    days_seen_session_start_bits. Null when no session-start was seen in the 28-day window.
- name: days_since_seen_session_end
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client last had a session-end baseline ping, derived from days_seen_session_end_bits.
    Null when no session-end was seen in the 28-day window.
- name: days_since_visited_1_uri
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the client last visited at least one URI, derived from days_visited_1_uri_bits.
    Null when no URI was visited in the 28-day window.
- name: days_seen_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask representing the days within the 28-day window (ending on submission_date)
    on which the client was seen; bit 0 is the most recent day.
- name: days_created_profile_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask representing days within the 28-day window on which a new profile
    creation event was observed for this client.
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: A number, 0-99, that samples by client_id and allows filtering data for analysis.
    It is a pipeline-generated artifact that should match between pings.
- name: first_run_date
  type: DATE
  mode: NULLABLE
  description: The date of the first run of the application.
- name: durations
  type: INTEGER
  mode: NULLABLE
  description: Total session duration in seconds accumulated by the client on the submission date, summed
    from baseline ping durations.
- name: days_seen_session_start_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask representing days within the 28-day window on which at least one
    session-start baseline ping was received for this client.
- name: days_seen_session_end_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask representing days within the 28-day window on which at least one
    session-end (active) baseline ping was received for this client.
- name: android_sdk_version
  type: STRING
  mode: NULLABLE
  description: The optional Android specific SDK version of the software running on this hardware device.
- name: locale
  type: STRING
  mode: NULLABLE
  description: Set of language- and/or country-based preferences for a user interface.
- name: city
  type: STRING
  mode: NULLABLE
  description: Name of the city in which the activity took place, as determined by
    the IP geolocation.
- name: country
  type: STRING
  mode: NULLABLE
  description: Name of the country in which the activity took place, as determined by
    the IP geolocation.
- name: app_build
  type: STRING
  mode: NULLABLE
  description: The build identifier generated by the CI system (e.g. '20210318103112'). If the value was
    not provided through configuration, this metric gets set to 'Unknown'.
- name: app_channel
  type: STRING
  mode: NULLABLE
  description: The channel the application is being distributed on.
- name: architecture
  type: STRING
  mode: NULLABLE
  description: The architecture of the device, (e.g. "arm", "x86").
- name: device_manufacturer
  type: STRING
  mode: NULLABLE
  description: The manufacturer of the device the application is running on.
    Not set if the device manufacturer can't be determined (e.g. on Desktop).
- name: device_model
  type: STRING
  mode: NULLABLE
  description: The model of the device the application is running on.
- name: telemetry_sdk_build
  type: STRING
  mode: NULLABLE
  description: The version of the Glean SDK at the time the ping was collected (e.g. 25.0.0).
- name: first_seen_date
  type: DATE
  mode: NULLABLE
  description: Date when the server first received a ping from this client.
- name: is_new_profile
  type: BOOLEAN
  mode: NULLABLE
  description: True if this is the first submission date on which the client was seen, indicating a newly
    created profile; false for returning clients.
- name: isp
  type: STRING
  mode: NULLABLE
  description: The name of the internet service provider associated with the client's IP address.
- name: days_active_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask representing days within the 28-day window on which the client had
    any recorded activity (active_hours > 0 or URI count > 0).
- name: geo_subdivision
  type: STRING
  mode: NULLABLE
  description: First major country subdivision, typically a state, province, or county based on IP address.
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the profile group, not shared with other telemetry data.
- name: install_source
  type: STRING
  mode: NULLABLE
  description: The source from which Firefox was installed. Always null for this table.
- name: days_desktop_active_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask representing days within the 28-day window on which the client was
    active on Firefox Desktop specifically, used to compute DAU/WAU/MAU and activity_segment.
- name: windows_build_number
  type: INTEGER
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: windows_build_number
- name: browser_engagement_uri_count
  type: INTEGER
  mode: NULLABLE
  description: The total number of non-unique http(s) URIs visited on the submission date, including page
    reloads and private browsing URIs, migrated from Telemetry's browser.engagement.total_uri_count_normal_and_private_mode.
- name: browser_engagement_active_ticks
  type: INTEGER
  mode: NULLABLE
  description: The number of five-second intervals ('ticks') the user was considered 'active' via keyboard
    or mouse interaction on the submission date, migrated from Telemetry's browser.engagement.active_ticks.
- name: legacy_telemetry_client_id
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: legacy_telemetry_client_id
- name: is_default_browser
  type: BOOLEAN
  mode: NULLABLE
  description: A flag indicating whether the browser is set as the default browser on the client side.
- name: attribution_dltoken
  type: STRING
  mode: NULLABLE
  description: A unique token (UUID) created at Firefox download time that links the installation to the
    specific download event. Null when not set.
- name: attribution_dlsource
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_dlsource
- name: attribution_experiment
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_experiment
- name: attribution_variation
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_variation
- name: attribution_ua
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_ua
- name: experiments
  type: RECORD
  mode: REPEATED
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: experiments
  fields:
  - name: key
    type: STRING
    mode: NULLABLE
    description: The experiment slug (identifier) of a Nimbus experiment the client is currently enrolled
      in.
  - name: value
    type: RECORD
    mode: NULLABLE
    fields:
    - name: branch
      type: STRING
      mode: NULLABLE
      description: The branch of the Nimbus experiment the client is assigned to (e.g. 'control', 'treatment-a',
        'rollout-branch').
    - name: extra
      type: RECORD
      mode: NULLABLE
      fields:
      - name: type
        type: STRING
        mode: NULLABLE
        description: The type of the Nimbus enrollment, indicating whether the experiment is a rollout or a standard
          experiment (e.g. 'nimbus-rollout', 'nimbus-nimbus').
      - name: enrollment_id
        type: STRING
        mode: NULLABLE
        description: A UUID uniquely identifying this client's specific enrollment event in the Nimbus experiment.
          Null for most enrollments that predate enrollment ID tracking.
- name: days_visited_1_uri_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask representing days within the 28-day window on which the client visited
    at least one URI, based on browser_engagement_uri_count > 0.
- name: active_hours_sum
  type: FLOAT
  mode: NULLABLE
  description: Total hours the user was considered active (keyboard/mouse interaction) on the submission
    date, derived from browser_engagement_active_ticks divided by 720 (ticks per hour).
- name: days_interacted_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask representing days within the 28-day window on which the client had
    any user interaction (active ticks > 0).
- name: startup_profile_selection_reason_first
  type: STRING
  mode: NULLABLE
  description: The reason the profile was selected during startup on the first observed session, e.g. 'default',
    'firstrun-created-default', 'restart', 'argument-profile'. Null when not reported.
- name: app_name
  type: STRING
  mode: NULLABLE
  description: The name of the application.
- name: app_version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
- name: app_version_major
  type: NUMERIC
  mode: NULLABLE
  description: The major version of the user visible app version string for the browser,
    e.g. "142.1.3", has major version 142
- name: app_version_minor
  type: NUMERIC
  mode: NULLABLE
  description: The minor version of the user visible app version string for the browser,
    e.g. "142.1.3" has minor version 1
- name: app_version_patch_revision
  type: NUMERIC
  mode: NULLABLE
  description: The patch revision component of the user-visible app version string (e.g. for '152.0.6',
    this is 6), extracted via mozfun.norm.browser_version_info. Null when there is no patch component.
- name: app_version_is_major_release
  type: BOOLEAN
  mode: NULLABLE
  description: True if the app version represents a major release (i.e. patch and revision components are
    zero or absent), false otherwise.
- name: channel
  type: STRING
  mode: NULLABLE
  description: The normalized channel the application is being distributed on.
- name: distribution_id
  type: STRING
  mode: NULLABLE
  description: The distribution id associated with the install of Firefox.
- name: distribution_id_source
  type: STRING
  mode: NULLABLE
  description: Indicates the source system from which distribution_id was resolved; 'glean' if present in
    the Glean ping, 'legacy' if resolved from the legacy distribution mapping table, or null if unavailable.
- name: os
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: os
- name: os_grouped
  type: STRING
  mode: NULLABLE
  description: The grouped operating system name, identical to the os field; included for backward compatibility
    with legacy data sources.
- name: os_version
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: os_version
- name: os_version_build
  type: STRING
  mode: NULLABLE
  description: A human-readable OS version build label derived from the OS version and Windows build number
    (e.g. 'Windows 11', 'Windows 10'), computed via mozfun.norm.glean_windows_version_info; falls back to
    normalized_os_version when unavailable.
- name: os_version_major
  type: INTEGER
  mode: NULLABLE
  description: The major version component of the operating system version string (e.g. 10 for Windows 10.0),
    extracted via mozfun.norm.extract_version.
- name: os_version_minor
  type: INTEGER
  mode: NULLABLE
  description: The minor version component of the operating system version string (e.g. 0 for Windows 10.0),
    extracted via mozfun.norm.extract_version.
- name: activity_segment
  type: STRING
  mode: NULLABLE
  description: Classification of users based on their browsing activity.
    E.g., infrequent, casual, regular.
- name: first_seen_year
  type: INTEGER
  mode: NULLABLE
  description: Year of the client's first seen date.
- name: is_daily_user
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating if client is considered a daily user on the submission date.
- name: is_weekly_user
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating if client is considered a weekly user on the submission date.
- name: is_monthly_user
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating if client is considered a monthly user on the submission date.
- name: is_dau
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating the client is counted as a daily active user on this submission date.
- name: is_wau
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating the client is counted as a weekly active user on this submission date.
- name: is_mau
  type: BOOLEAN
  mode: NULLABLE
  description: Flag indicating the client is counted as a weekly active user on this submission date.
- name: attribution_campaign
  type: STRING
  mode: NULLABLE
  description: The attribution campaign associated with the current Firefox install, similar to or the same
    as UTM 'campaign'. Null when attribution is not available.
- name: attribution_content
  type: STRING
  mode: NULLABLE
  description: The attribution content value associated with the current Firefox install, similar to or
    the same as UTM 'content'. Null when attribution is not available.
- name: attribution_medium
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_medium
- name: attribution_source
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/firefox_desktop_derived/firefox_desktop_derived.yaml
    field: attribution_source
- name: attribution_term
  type: STRING
  mode: NULLABLE
  description: The attribution term associated with the current Firefox install, similar to or the same
    as UTM 'term'. Always null for this table.
- name: distribution_name
  type: STRING
  mode: NULLABLE
  description: The optional distribution name associated with the current Firefox install (e.g. 'canonical-002',
    'mozilla-MSIX'). Can be a partner name or a distribution configuration preset.
- name: first_seen_attribution_campaign
  type: STRING
  mode: NULLABLE
  description: The attribution campaign recorded at the time of the client's first seen date, i.e. the campaign
    associated with the original Firefox install. Null when not available.
- name: first_seen_attribution_content
  type: STRING
  mode: NULLABLE
  description: The attribution content value recorded at the time of the client's first seen date. Null
    when not available.
- name: first_seen_attribution_medium
  type: STRING
  mode: NULLABLE
  description: The attribution medium recorded at the time of the client's first seen date (e.g. 'referral',
    'paidsearch'). Null when not available.
- name: first_seen_attribution_source
  type: STRING
  mode: NULLABLE
  description: The attribution source recorded at the time of the client's first seen date (e.g. 'www.google.com').
    Null when not available.
- name: first_seen_attribution_term
  type: STRING
  mode: NULLABLE
  description: The attribution term recorded at the time of the client's first seen date. Always null for
    this table.
- name: first_seen_distribution_name
  type: STRING
  mode: NULLABLE
  description: The distribution name recorded at the time of the client's first seen date, capturing the
    original distribution associated with the Firefox install. Null when not available.
- name: is_desktop
  type: BOOLEAN
  mode: NULLABLE
  description: Indicates if the client is included in the desktop KPI.
- name: attribution_msclkid
  type: STRING
  mode: NULLABLE
  description: Unique token created at Firefox download time using the Microsoft Store.
- mode: NULLABLE
  name: policies_is_enterprise
  type: BOOLEAN
  description: |-
    Attempt to determine if the user is an enterprise user based on various signals.
    This metric was generated to correspond to the Legacy Telemetry scalar policies.is_enterprise.
