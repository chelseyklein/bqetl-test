fields:
- mode: NULLABLE
  name: attribution_campaign
  type: STRING
  description: The attribution campaign associated with the Firefox installation;
    similar to UTM campaign parameter.
- mode: NULLABLE
  name: attribution_content
  type: STRING
  description: The attribution content associated with the Firefox installation; similar
    to UTM content parameter.
- mode: NULLABLE
  name: attribution_experiment
  type: STRING
  description: The attribution experiment key associated with the Firefox installation.
- mode: NULLABLE
  name: attribution_medium
  type: STRING
  description: The attribution medium associated with the Firefox installation; similar
    to UTM medium parameter.
- mode: NULLABLE
  name: attribution_source
  type: STRING
  description: The attribution source associated with the Firefox installation; similar
    to UTM source parameter.
- mode: NULLABLE
  name: attribution_variation
  type: STRING
  description: The attribution variation key associated with the Firefox installation.
- description: The type of source of a client installation
  mode: NULLABLE
  name: adjust_network
  type: STRING
- description: The source of a client installation
  mode: NULLABLE
  name: install_source
  type: STRING
- mode: NULLABLE
  name: city
  type: STRING
  description: The city in which the client activity took place, as determined by
    IP geolocation.
- mode: NULLABLE
  name: country
  type: STRING
  description: An ISO 3166-1 alpha-2 country code of the country in which the activity
    took place, as determined by the IP geolocation.
- mode: NULLABLE
  name: first_seen_year
  type: INTEGER
  description: The calendar year in which the client was first seen (i.e., EXTRACT(YEAR
    FROM first_seen_date)), used as a cohort dimension.
- mode: NULLABLE
  name: is_default_browser
  type: BOOLEAN
  description: A flag indicating whether the browser is set as the default browser
    on the client side.
- mode: NULLABLE
  name: app_name
  type: STRING
  description: The name of the browser application, e.g. 'Firefox Desktop', 'Fenix'.
- mode: NULLABLE
  name: submission_date
  type: DATE
  description: The date when the telemetry ping is received on the server side.
- mode: NULLABLE
  name: dau
  type: INTEGER
  description: The number of daily active users, corresponding to the count of distinct
    clients with days_since_seen = 0 on the submission_date.
- mode: NULLABLE
  name: wau
  type: INTEGER
  description: The number of weekly active users, corresponding to the count of distinct
    clients with days_since_seen < 7 on the submission_date.
- mode: NULLABLE
  name: mau
  type: INTEGER
  description: The number of monthly active users, corresponding to the count of all
    distinct clients active within the previous 28 days.
- mode: NULLABLE
  name: new_profiles
  type: INTEGER
  description: Count of distinct clients whose first_seen_date equals the submission_date,
    representing newly created profiles.
- mode: NULLABLE
  name: ad_clicks
  type: INTEGER
  description: Total number of ad clicks recorded across clients in this dimension
    group on the submission_date.
- mode: NULLABLE
  name: organic_search_count
  type: INTEGER
  description: Total count of organic (non-ad) search engine queries performed by
    clients in this dimension group on the submission_date.
- mode: NULLABLE
  name: search_count
  type: INTEGER
  description: Total count of all search engine queries (organic and paid) performed
    by clients in this dimension group on the submission_date.
- mode: NULLABLE
  name: search_with_ads
  type: INTEGER
  description: Total count of search result pages that contained advertisements, across
    clients in this dimension group on the submission_date.
- mode: NULLABLE
  name: uri_count
  type: INTEGER
  description: Total number of URI navigations (page loads) recorded across clients
    in this dimension group on the submission_date.
- mode: NULLABLE
  name: active_hours
  type: FLOAT
  description: Total active browsing hours accumulated across clients in this dimension
    group on the submission_date, derived from active_hours_sum.
- mode: NULLABLE
  name: attributed
  type: BOOLEAN
  description: True if the client has a non-null attribution_medium or attribution_source,
    indicating the installation came from a tracked marketing channel.
- description: Count of distinct, qualified Desktop clients that we received a main
    ping from on a given day. In mobile DAU = QDAU.
  mode: NULLABLE
  name: qdau_desktop
  type: INTEGER
