fields:
- mode: NULLABLE
  name: attribution_campaign
  type: STRING
  description: The marketing attribution campaign associated with the client's installation;
    similar to or the same as UTM campaign.
- mode: NULLABLE
  name: attribution_content
  type: STRING
  description: The marketing attribution content parameter associated with the client's
    installation; similar to or the same as UTM content.
- mode: NULLABLE
  name: attribution_experiment
  type: STRING
  description: The attribution experiment key associated with the client's installation,
    used to identify A/B test or experiment variants.
- mode: NULLABLE
  name: attribution_medium
  type: STRING
  description: The marketing attribution medium associated with the client's installation;
    similar to or the same as UTM medium.
- mode: NULLABLE
  name: attribution_source
  type: STRING
  description: The marketing attribution source associated with the client's installation;
    similar to or the same as UTM source.
- mode: NULLABLE
  name: attribution_variation
  type: STRING
  description: The attribution variation key associated with the client's installation,
    identifying specific creative or variant tested.
- description: The type of source of a client installation
  mode: NULLABLE
  name: adjust_network
  type: STRING
- description: The source of a client installation
  mode: NULLABLE
  name: install_source
  type: STRING
- mode: NULLABLE
  name: city
  type: STRING
  description: The city in which the activity took place, as determined by IP geolocation.
    May be NULL when geolocation resolution does not reach city level.
- mode: NULLABLE
  name: country
  type: STRING
  description: An ISO 3166-1 alpha-2 country code of the country in which the activity
    took place, as determined by the IP geolocation.
- mode: NULLABLE
  name: first_seen_year
  type: INTEGER
  description: The calendar year in which the server first received a ping from the
    client, derived from the client's first_seen_date.
- mode: NULLABLE
  name: is_default_browser
  type: BOOLEAN
  description: A flag indicating whether the browser is set as the default browser
    on the client side.
- mode: NULLABLE
  name: app_name
  type: STRING
  description: The name of the browser application (e.g. 'Firefox Desktop', 'Fenix',
    'Firefox iOS').
- mode: NULLABLE
  name: submission_date
  type: DATE
  description: The date when the telemetry ping is received on the server side.
- mode: NULLABLE
  name: dau
  type: INTEGER
  description: Count of distinct clients active on the submission_date (days_since_seen
    = 0), representing Daily Active Users.
- mode: NULLABLE
  name: wau
  type: INTEGER
  description: Count of distinct clients active within the 7 days prior to the submission_date
    (days_since_seen < 7), representing Weekly Active Users.
- mode: NULLABLE
  name: mau
  type: INTEGER
  description: Count of distinct clients active within the 28-day window of the submission_date,
    representing Monthly Active Users.
- mode: NULLABLE
  name: new_profiles
  type: INTEGER
  description: Count of distinct clients whose first_seen_date matches the submission_date,
    indicating a newly created browser profile.
- mode: NULLABLE
  name: ad_clicks
  type: INTEGER
  description: Total number of ad clicks recorded across all active clients in this
    aggregation group on the submission date.
- mode: NULLABLE
  name: organic_search_count
  type: INTEGER
  description: Total number of organic (non-ad) searches performed by clients in this
    aggregation group on the submission date.
- mode: NULLABLE
  name: search_count
  type: INTEGER
  description: Total number of searches (organic and paid) performed by clients in
    this aggregation group on the submission date.
- mode: NULLABLE
  name: search_with_ads
  type: INTEGER
  description: Total number of searches that returned at least one ad, performed by
    clients in this aggregation group on the submission date.
- mode: NULLABLE
  name: uri_count
  type: INTEGER
  description: Total number of URIs loaded by clients in this aggregation group on
    the submission date, used as a proxy for browsing activity.
- mode: NULLABLE
  name: active_hours
  type: FLOAT
  description: Total active browsing hours summed across all clients in this aggregation
    group on the submission date.
- mode: NULLABLE
  name: attributed
  type: BOOLEAN
  description: True if the client's installation has a non-NULL attribution_medium
    or attribution_source, indicating a tracked marketing source; false otherwise.
- description: Count of distinct, qualified Desktop clients that we received a main
    ping from on a given day. In mobile DAU = QDAU.
  mode: NULLABLE
  name: qdau_desktop
  type: INTEGER
