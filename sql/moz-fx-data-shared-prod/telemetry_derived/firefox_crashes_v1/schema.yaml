- name: ping_info
  type: RECORD
  mode: NULLABLE
  description: ''
  fields:
  - name: end_time
    type: STRING
    mode: NULLABLE
    description: The end of the data collection window in local time with minute precision and timezone offset.
  - name: experiments
    type: RECORD
    mode: REPEATED
    description: Array of active Nimbus experiments and rollouts the client was enrolled in at the time of
      the crash.
    fields:
    - name: key
      type: STRING
      mode: NULLABLE
      description: ''
    - name: value
      type: RECORD
      mode: NULLABLE
      description: ''
      fields:
      - name: branch
        type: STRING
        mode: NULLABLE
        description: ''
      - name: extra
        type: RECORD
        mode: NULLABLE
        description: ''
        fields:
        - name: enrollment_id
          type: STRING
          mode: NULLABLE
          description: ''
        - name: type
          type: STRING
          mode: NULLABLE
          description: ''
  - name: parsed_end_time
    type: TIMESTAMP
    mode: NULLABLE
    description: The parsed UTC timestamp of the end of the data collection window.
  - name: parsed_start_time
    type: TIMESTAMP
    mode: NULLABLE
    description: The parsed UTC timestamp of the start of the data collection window.
  - name: ping_type
    type: STRING
    mode: NULLABLE
    description: The ping type identifier; null in crash pings which predate this field.
  - name: reason
    type: STRING
    mode: NULLABLE
    description: The reason the crash ping was submitted; typically 'crash' for unexpected crashes or 'event_found'
      for detected crash events.
  - name: seq
    type: INT64
    mode: NULLABLE
    description: A running counter of the number of pings of this type that have been sent from this client.
  - name: server_knobs_config
    type: RECORD
    mode: NULLABLE
    description: ''
    fields:
    - name: event_threshold
      type: INT64
      mode: NULLABLE
      description: Server Knobs remote configuration for the event threshold; null if no server knobs config
        was applied.
    - name: metrics_enabled
      type: RECORD
      mode: REPEATED
      description: Map of metric identifiers (category.name) to boolean values indicating whether the metric is enabled
      fields:
      - name: key
        type: STRING
        mode: NULLABLE
        description: ''
      - name: value
        type: BOOLEAN
        mode: NULLABLE
        description: ''
    - name: pings_enabled
      type: RECORD
      mode: REPEATED
      description: Map of ping names to boolean values indicating whether the ping is enabled
      fields:
      - name: key
        type: STRING
        mode: NULLABLE
        description: ''
      - name: value
        type: BOOLEAN
        mode: NULLABLE
        description: ''
    - name: session_sample_rate
      type: FLOAT64
      mode: NULLABLE
      description: ''
  - name: start_time
    type: STRING
    mode: NULLABLE
    description: The start of the data collection window in local time with minute precision and timezone
      offset.
- name: sample_id
  type: INT64
