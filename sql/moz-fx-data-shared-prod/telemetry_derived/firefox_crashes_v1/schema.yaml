- name: ping_info
  type: RECORD
  mode: NULLABLE
  description: ''
  fields:
  - name: end_time
    type: STRING
    mode: NULLABLE
    description: The local time on the client device at the end of the measurement window for this ping, in
      ISO 8601 format with timezone offset.
  - name: experiments
    type: RECORD
    mode: REPEATED
    description: An array of Nimbus experiment enrollments active at the time this crash ping was submitted,
      each containing the experiment slug, branch, and enrollment ID.
    fields:
    - name: key
      type: STRING
      mode: NULLABLE
      description: ''
    - name: value
      type: RECORD
      mode: NULLABLE
      description: ''
      fields:
      - name: branch
        type: STRING
        mode: NULLABLE
        description: ''
      - name: extra
        type: RECORD
        mode: NULLABLE
        description: ''
        fields:
        - name: enrollment_id
          type: STRING
          mode: NULLABLE
          description: ''
        - name: type
          type: STRING
          mode: NULLABLE
          description: ''
  - name: parsed_end_time
    type: TIMESTAMP
    mode: NULLABLE
    description: The ping measurement window end time parsed to UTC and stored as a TIMESTAMP for easier querying.
  - name: parsed_start_time
    type: TIMESTAMP
    mode: NULLABLE
    description: The ping measurement window start time parsed to UTC and stored as a TIMESTAMP for easier
      querying.
  - name: ping_type
    type: STRING
    mode: NULLABLE
    description: The type of Glean ping that was submitted. Always null in this table; the crash ping type
      is inferred from context.
  - name: reason
    type: STRING
    mode: NULLABLE
    description: The reason this crash ping was submitted; 'crash' indicates a browser crash was detected,
      and 'event_found' indicates a crash event was discovered after the fact.
  - name: seq
    type: INT64
    mode: NULLABLE
    description: The sequence number of this ping within the client's session, used to detect missing or out-of-order
      pings.
  - name: server_knobs_config
    type: RECORD
    mode: NULLABLE
    description: ''
    fields:
    - name: event_threshold
      type: INT64
      mode: NULLABLE
      description: The server-configured threshold for the number of events that triggers an event ping submission.
        Null when not set by remote configuration.
    - name: metrics_enabled
      type: RECORD
      mode: REPEATED
      description: Map of metric identifiers (category.name) to boolean values indicating whether the metric is enabled
      fields:
      - name: key
        type: STRING
        mode: NULLABLE
        description: ''
      - name: value
        type: BOOLEAN
        mode: NULLABLE
        description: ''
    - name: pings_enabled
      type: RECORD
      mode: REPEATED
      description: Map of ping names to boolean values indicating whether the ping is enabled
      fields:
      - name: key
        type: STRING
        mode: NULLABLE
        description: ''
      - name: value
        type: BOOLEAN
        mode: NULLABLE
        description: ''
    - name: session_sample_rate
      type: FLOAT64
      mode: NULLABLE
      description: ''
  - name: start_time
    type: STRING
    mode: NULLABLE
    description: The local time on the client device at the start of the measurement window for this ping,
      in ISO 8601 format with timezone offset.
