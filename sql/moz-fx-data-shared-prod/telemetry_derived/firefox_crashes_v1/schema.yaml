      ISO 8601 format with timezone offset.
  - name: experiments
    type: RECORD
    mode: REPEATED
    description: An array of Nimbus experiment enrollments active at the time this crash ping was submitted,
      each containing the experiment slug, branch, and enrollment ID.
    fields:
    - name: key
      type: STRING
      mode: NULLABLE
      description: ''
    - name: value
      type: RECORD
      mode: NULLABLE
      description: ''
      fields:
      - name: branch
        type: STRING
        mode: NULLABLE
        description: ''
      - name: extra
        type: RECORD
        mode: NULLABLE
        description: ''
        fields:
        - name: enrollment_id
          type: STRING
          mode: NULLABLE
          description: ''
        - name: type
          type: STRING
          mode: NULLABLE
          description: ''
  - name: parsed_end_time
    type: TIMESTAMP
    mode: NULLABLE
    description: The ping measurement window end time parsed to UTC and stored as a TIMESTAMP for easier querying.
