fields:
- name: additional_properties
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/telemetry_derived/telemetry_derived.yaml
    field: additional_properties
- name: client_info
  type: RECORD
  mode: NULLABLE
  description: ''
  fields:
  - name: android_sdk_version
    type: STRING
    mode: NULLABLE
    description: The Android SDK version of the device; only populated for Android clients.
  - name: app_build
    type: STRING
    mode: NULLABLE
    description: The build identifier generated by the CI system (e.g., '20260608154138').
  - name: app_channel
    type: STRING
    mode: NULLABLE
    description: The release channel reported by the application (e.g., 'release', 'esr', 'beta').
  - name: app_display_version
    type: STRING
    mode: NULLABLE
    description: The user-visible application version string (e.g., '115.37.0').
  - name: architecture
    type: STRING
    mode: NULLABLE
    description: The CPU architecture of the device running the application (e.g., 'x86_64', 'aarch64', 'arm').
  - name: attribution
    type: RECORD
    mode: NULLABLE
    description: ''
    fields:
    - name: campaign
      type: STRING
      mode: NULLABLE
      description: The optional attribution campaign, similar to UTM 'campaign'.
    - name: content
      type: STRING
      mode: NULLABLE
      description: The optional attribution content identifier, similar to UTM 'content'.
    - name: ext
      type: JSON
      mode: NULLABLE
      description: ''
    - name: medium
      type: STRING
      mode: NULLABLE
      description: The optional attribution medium, similar to UTM 'medium' (e.g., 'referral', 'direct').
    - name: source
      type: STRING
      mode: NULLABLE
      description: The optional attribution source, similar to UTM 'source', indicating the referring website
        or channel.
    - name: term
      type: STRING
      mode: NULLABLE
      description: The optional attribution term, similar to UTM 'term'; null for this ping.
  - name: build_date
    type: STRING
    mode: NULLABLE
    description: The date and time the application binary was built.
  - name: client_id
    type: STRING
    mode: NULLABLE
    description: The Glean client UUID uniquely identifying the client.
  - name: device_manufacturer
    type: STRING
    mode: NULLABLE
    description: The device manufacturer; only populated for Android and iOS clients (e.g., 'samsung').
  - name: device_model
    type: STRING
    mode: NULLABLE
    description: The device model name; only populated for Android and iOS clients (e.g., 'SM-M127F').
  - name: distribution
    type: RECORD
    mode: NULLABLE
    description: ''
    fields:
    - name: ext
      type: JSON
      mode: NULLABLE
      description: Extended distribution information as a JSON object, including distributor, partnerId, and
        distributionVersion.
    - name: name
      type: STRING
      mode: NULLABLE
      description: The distribution name identifying the partner or preset distribution configuration (e.g.,
        'portableapps', 'canonical-002').
  - name: first_run_date
    type: STRING
    mode: NULLABLE
    description: The date of the first run of the application, in local time with timezone offset.
  - name: locale
    type: STRING
    mode: NULLABLE
    description: The application locale at initialization time (e.g., 'en-US', 'de'); null if locale cannot
      be determined.
  - name: os
    type: STRING
    mode: NULLABLE
    description: The operating system name reported by the Glean SDK (e.g., 'Windows', 'Linux', 'Android',
      'Darwin').
  - name: os_version
    type: STRING
    mode: NULLABLE
    description: The user-visible operating system version string reported by the client (e.g., '10.0').
  - name: session_count
    type: INT64
    mode: NULLABLE
    description: Running count of sessions for this client; null in crash pings.
  - name: session_id
    type: STRING
    mode: NULLABLE
    description: A UUID identifying the current session; null in crash pings which use a separate session
      model.
  - name: telemetry_sdk_build
    type: STRING
    mode: NULLABLE
    description: The version of the Glean SDK at the time the ping was collected (e.g., '67.2.0').
  - name: windows_build_number
    type: INT64
    mode: NULLABLE
    description: The Windows build number (e.g., 19045); only populated for Windows clients.
- name: document_id
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/telemetry_derived/telemetry_derived.yaml
    field: document_id
- name: events
  type: RECORD
  mode: REPEATED
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/telemetry_derived/telemetry_derived.yaml
    field: events
  fields:
  - name: category
    type: STRING
    mode: NULLABLE
    description: The event category within the events array, indicating the functional area of the recorded
      crash event.
  - name: extra
    type: RECORD
    mode: REPEATED
    description: ''
    fields:
    - name: key
      type: STRING
      mode: NULLABLE
      description: ''
    - name: value
      type: STRING
      mode: NULLABLE
      description: ''
  - name: name
    type: STRING
    mode: NULLABLE
    description: The event name within the events array, identifying the specific crash event type.
  - name: session
    type: RECORD
    mode: NULLABLE
    description: ''
    fields:
    - name: event_seq
      type: INT64
      mode: NULLABLE
      description: The sequence number of this event within its session, used for ordering events in the events
        array.
    - name: session_id
      type: STRING
      mode: NULLABLE
      description: The UUID identifying the session in which this crash event was recorded, within the events
        array.
    - name: session_sample_rate
      type: FLOAT64
      mode: NULLABLE
      description: The sampling rate applied to events in this session, within the events array.
    - name: session_seq
      type: INT64
      mode: NULLABLE
      description: The sequence number of the session in which this event was recorded, within the events array.
    - name: session_start_time
      type: STRING
      mode: NULLABLE
      description: The start timestamp string of the session in which this event was recorded, within the events
        array.
  - name: timestamp
    type: INT64
    mode: NULLABLE
    description: The millisecond offset from session start at which this crash event was recorded.
- name: metadata
  type: RECORD
  mode: NULLABLE
  description: ''
  fields:
  - name: geo
    type: RECORD
    mode: NULLABLE
    description: ''
    fields:
    - name: city
      type: STRING
      mode: NULLABLE
      description: The city derived from geographic IP lookup; null when city-level data is unavailable.
    - name: country
      type: STRING
      mode: NULLABLE
      description: The ISO 3166-1 alpha-2 country code derived from geographic IP lookup.
    - name: db_version
      type: STRING
      mode: NULLABLE
      description: The version of the geographic lookup database used to resolve this ping's location.
    - name: subdivision1
      type: STRING
      mode: NULLABLE
      description: The first major country subdivision (e.g., state or province) derived from geographic IP
        lookup.
    - name: subdivision2
      type: STRING
      mode: NULLABLE
      description: The second major country subdivision derived from geographic IP lookup; not applicable for
        most countries.
  - name: header
    type: RECORD
    mode: NULLABLE
    description: ''
    fields:
    - name: date
      type: STRING
      mode: NULLABLE
      description: The HTTP Date header sent by the client when submitting the ping.
    - name: dnt
      type: STRING
      mode: NULLABLE
      description: The HTTP Do Not Track header value sent by the client ('1' if DNT is enabled).
    - name: parsed_date
      type: TIMESTAMP
      mode: NULLABLE
      description: The parsed UTC timestamp of the HTTP Date header sent by the client.
    - name: parsed_x_lb_tags
      type: RECORD
      mode: NULLABLE
      description: ''
      fields:
      - name: tls_cipher_hex
        type: STRING
        mode: NULLABLE
        description: The TLS cipher suite used for the client connection in hexadecimal, parsed from the X-LB-Tags
          header (e.g., '1301' for TLS_AES_128_GCM_SHA256).
      - name: tls_version
        type: STRING
        mode: NULLABLE
        description: The TLS version used for the client connection, parsed from the X-LB-Tags header (e.g., 'TLSv1.3').
    - name: parsed_x_source_tags
      type: STRING
      mode: REPEATED
      description: The parsed array of source tags from the X-Source-Tags HTTP header.
    - name: x_debug_id
      type: STRING
      mode: NULLABLE
      description: The X-Debug-Id HTTP header value, used for debug-mode ping routing; null for production pings.
    - name: x_foxsec_ip_reputation
      type: STRING
      mode: NULLABLE
      description: The X-Foxsec-IP-Reputation header (deprecated); null for current pings.
    - name: x_lb_tags
      type: STRING
      mode: NULLABLE
      description: The X-LB-Tags HTTP header from the load balancer, containing TLS version and cipher information.
    - name: x_pingsender_version
      type: STRING
      mode: NULLABLE
      description: The X-PingSender-Version HTTP header, indicating the PingSender version used to submit the
        ping; null for Glean crash pings.
    - name: x_source_tags
      type: STRING
      mode: NULLABLE
      description: The X-Source-Tags HTTP header string.
    - name: x_telemetry_agent
      type: STRING
      mode: NULLABLE
      description: The X-Telemetry-Agent HTTP header indicating the Glean SDK version and platform (e.g., 'Glean/67.2.0
        (Rust on Windows)').
  - name: isp
    type: RECORD
    mode: NULLABLE
    description: ''
    fields:
    - name: db_version
      type: STRING
      mode: NULLABLE
      description: The version of the ISP lookup database used to resolve this ping's ISP information.
    - name: name
      type: STRING
      mode: NULLABLE
      description: The name of the Internet Service Provider associated with the client's IP address.
    - name: organization
      type: STRING
      mode: NULLABLE
      description: The specific business entity associated with the client's IP address; falls back to ISP name
        when unavailable.
  - name: user_agent
    type: RECORD
    mode: NULLABLE
    description: ''
    fields:
    - name: browser
      type: STRING
      mode: NULLABLE
      description: The browser name parsed from the client's HTTP User-Agent string (e.g., 'Firefox').
    - name: os
      type: STRING
      mode: NULLABLE
      description: The operating system parsed from the client's HTTP User-Agent string (e.g., 'Windows 10',
        'Android').
    - name: version
      type: STRING
      mode: NULLABLE
      description: The browser version parsed from the client's HTTP User-Agent string (e.g., '115').
