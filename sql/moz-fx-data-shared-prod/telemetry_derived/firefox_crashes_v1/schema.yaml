- name: app_version_major
  type: NUMERIC
  mode: NULLABLE
  description: The major version component of the Firefox application version (e.g., 144 for version 144.0).
    For mobile builds using a build ID string as version, this may be non-numeric.
- name: app_version_minor
  type: NUMERIC
  mode: NULLABLE
  description: The minor version component of the Firefox application version (e.g., 0 for version 144.0,
    37 for version 115.37.0).
- name: app_version_patch
  type: NUMERIC
  mode: NULLABLE
