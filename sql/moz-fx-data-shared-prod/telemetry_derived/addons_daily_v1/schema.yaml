- name: sap_searches
  type: RECORD
  mode: NULLABLE
  description: Search access point (SAP) search counts broken down by search engine for clients using this
    add-on.
  fields:
  - name: amazon
    type: INT64
    mode: NULLABLE
    description: Number of SAP searches performed via Amazon by clients using this add-on on the submission
      date.
  - name: bing
    type: INT64
    mode: NULLABLE
    description: Number of SAP searches performed via Bing by clients using this add-on on the submission
      date.
  - name: ddg
    type: INT64
    mode: NULLABLE
    description: Number of SAP searches performed via DuckDuckGo by clients using this add-on on the submission
      date.
  - name: google
    type: INT64
    mode: NULLABLE
    description: Number of SAP searches performed via Google by clients using this add-on on the submission
      date.
  - name: other
    type: INT64
    mode: NULLABLE
    description: Number of SAP searches performed via other search engines by clients using this add-on on
      the submission date.
  - name: total
    type: INT64
    mode: NULLABLE
    description: Total number of SAP searches across all search engines by clients using this add-on on the
      submission date.
  - name: yandex
    type: INT64
    mode: NULLABLE
    description: Number of SAP searches performed via Yandex by clients using this add-on on the submission
      date.
