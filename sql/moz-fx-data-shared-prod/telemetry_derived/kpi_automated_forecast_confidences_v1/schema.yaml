fields:
- name: asofdate
  type: STRING
  mode: NULLABLE
  description: The future date through which this set of forecasts extends (the forecast horizon end date).
- name: date
  type: STRING
  mode: NULLABLE
  description: The specific date for which this forecast row applies, ranging from historical dates up to
    the asofdate.
- name: target
  type: STRING
  mode: NULLABLE
  description: The KPI target being forecasted (e.g., 'desktop' for Firefox Desktop DAU, 'mobile' for mobile
    DAU).
- name: unit
  type: STRING
  mode: NULLABLE
  description: The time aggregation unit for this forecast row; 'day' for daily values or 'month' for monthly
    aggregated values.
- name: value
  type: FLOAT64
  mode: NULLABLE
  description: The observed (historical) metric value for this date, or null for future forecast dates.
- name: yhat_p5
  type: FLOAT64
  mode: NULLABLE
  description: The 5th percentile of the forecast distribution for this date (lower confidence bound); null
    for historical dates.
- name: yhat_p10
  type: FLOAT64
  mode: NULLABLE
  description: The 10th percentile of the forecast distribution for this date; null for historical dates.
- name: yhat_p20
  type: FLOAT64
  mode: NULLABLE
  description: The 20th percentile of the forecast distribution for this date; null for historical dates.
- name: yhat_p30
  type: FLOAT64
  mode: NULLABLE
  description: The 30th percentile of the forecast distribution for this date; null for historical dates.
- name: yhat_p40
  type: FLOAT64
  mode: NULLABLE
  description: The 40th percentile of the forecast distribution for this date; null for historical dates.
- name: yhat_p50
  type: FLOAT64
  mode: NULLABLE
  description: The 50th percentile (median) of the forecast distribution for this date; null for historical
    dates.
- name: yhat_p60
  type: FLOAT64
  mode: NULLABLE
  description: The 60th percentile of the forecast distribution for this date; null for historical dates.
- name: yhat_p70
  type: FLOAT64
  mode: NULLABLE
  description: The 70th percentile of the forecast distribution for this date; null for historical dates.
- name: yhat_p80
  type: FLOAT64
  mode: NULLABLE
  description: The 80th percentile of the forecast distribution for this date; null for historical dates.
- name: yhat_p90
  type: FLOAT64
  mode: NULLABLE
  description: The 90th percentile of the forecast distribution for this date; null for historical dates.
- name: yhat_p95
  type: FLOAT64
  mode: NULLABLE
  description: The 95th percentile of the forecast distribution for this date (upper confidence bound);
    null for historical dates.
- name: forecast_parameters
  type: STRING
  mode: NULLABLE
  description: A JSON string describing the model type and hyperparameters used to generate this forecast
    (e.g., Prophet model settings).
- name: forecast_date
  type: STRING
  mode: NULLABLE
  description: The date on which the forecast model was run to produce these predictions.
