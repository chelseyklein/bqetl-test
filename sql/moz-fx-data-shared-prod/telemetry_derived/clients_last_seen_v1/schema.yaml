fields:
- mode: NULLABLE
  name: submission_date
  type: DATE
  description: The date when the telemetry ping is received on the server side.
- mode: NULLABLE
  name: first_seen_date
  type: DATE
  description: The date when the server first received a ping from this client.
- mode: NULLABLE
  name: second_seen_date
  type: DATE
  description: The date when the server received the second ping from this client,
    used to distinguish genuine new users from one-time senders.
- mode: NULLABLE
  name: days_seen_bits
  type: INTEGER
  description: A 28-bit integer encoding the days within the past 28 days on which
    this client submitted at least one ping; the rightmost bit represents the most
    recent day (submission_date).
- mode: NULLABLE
  name: days_visited_1_uri_bits
  type: INTEGER
  description: A 28-bit integer encoding the days within the past 28 days on which
    the client visited at least 1 URI (normal + private mode combined); used for Active
    DAU calculations.
- mode: NULLABLE
  name: days_visited_5_uri_bits
  type: INTEGER
  description: A 28-bit integer encoding the days within the past 28 days on which
    the client visited at least 5 URIs (normal + private mode combined).
- mode: NULLABLE
  name: days_visited_10_uri_bits
  type: INTEGER
  description: A 28-bit integer encoding the days within the past 28 days on which
    the client visited at least 10 URIs (normal + private mode combined).
- mode: NULLABLE
  name: days_had_8_active_ticks_bits
  type: INTEGER
  description: A 28-bit integer encoding the days within the past 28 days on which
    the client had at least 8 active ticks (active_hours_sum >= 0.011 hours), a measure
    of engaged usage.
- mode: NULLABLE
  name: days_opened_dev_tools_bits
  type: INTEGER
  description: A 28-bit integer encoding the days within the past 28 days on which
    the client opened the Firefox Developer Tools toolbox at least once.
- mode: NULLABLE
  name: days_interacted_bits
  type: INTEGER
  description: A 28-bit integer encoding the days within the past 28 days on which
    the client had any active hours (active_hours_sum > 0), indicating at least some
    user interaction.
- mode: NULLABLE
  name: days_visited_1_uri_normal_mode_bits
  type: INTEGER
  description: A 28-bit integer encoding the days within the past 28 days on which
    the client visited at least 1 URI in normal (non-private) browsing mode.
- mode: NULLABLE
  name: days_visited_1_uri_private_mode_bits
  type: INTEGER
  description: A 28-bit integer encoding the days within the past 28 days on which
    the client visited at least 1 URI in private browsing mode; only available for
    Firefox 84+.
- mode: NULLABLE
  name: days_created_profile_bits
  type: INTEGER
  description: A 28-bit integer encoding the days within the past 28 days on which
    the client's profile was created (at most one bit set per client); derived from
    profile_creation_date within a 7-day trust window.
- fields:
  - mode: NULLABLE
    name: experiment
    type: STRING
  - mode: NULLABLE
    name: branch
    type: STRING
  - mode: NULLABLE
    name: bits
    type: INTEGER
  mode: REPEATED
  name: days_seen_in_experiment
  type: RECORD
  description: Array of per-experiment activity records for the past 28 days. Each
    entry holds the experiment slug, the assigned branch, and a 28-bit integer (bits)
    indicating the days the client was seen while enrolled in that experiment.
- mode: NULLABLE
  name: client_id
  type: STRING
  description: A unique identifier (UUID) for the client.
- mode: NULLABLE
  name: aborts_content_sum
  type: INTEGER
  description: Total number of content-process abort events recorded by this client
    over the aggregation period; null when no aborts were observed (96.8% null rate
    sampled 2026-05-29).
- mode: NULLABLE
  name: aborts_gmplugin_sum
  type: INTEGER
  description: Total number of GMP (Gecko Media Plugin) process abort events recorded
    by this client over the aggregation period; null when no aborts were observed
    (100% null rate sampled 2026-05-29).
- mode: NULLABLE
  name: aborts_plugin_sum
  type: INTEGER
  description: Total number of legacy NPAPI plugin process abort events recorded by
    this client; null when no aborts were observed (100% null rate sampled 2026-05-29).
- mode: NULLABLE
  name: active_addons_count_mean
  type: FLOAT
  description: Mean number of active (non-disabled, non-system) add-ons installed
    across pings aggregated into this row.
- fields:
  - mode: NULLABLE
    name: addon_id
    type: STRING
    description: null
  - mode: NULLABLE
    name: blocklisted
    type: BOOLEAN
    description: null
  - mode: NULLABLE
    name: name
    type: STRING
    description: null
  - mode: NULLABLE
    name: user_disabled
    type: BOOLEAN
    description: null
  - mode: NULLABLE
    name: app_disabled
    type: BOOLEAN
    description: null
  - mode: NULLABLE
    name: version
    type: STRING
    description: null
  - mode: NULLABLE
    name: scope
    type: INTEGER
    description: null
  - mode: NULLABLE
    name: type
    type: STRING
    description: null
  - mode: NULLABLE
    name: foreign_install
    type: BOOLEAN
    description: null
  - mode: NULLABLE
    name: has_binary_components
    type: BOOLEAN
    description: null
  - mode: NULLABLE
    name: install_day
    type: INTEGER
    description: null
  - mode: NULLABLE
    name: update_day
    type: INTEGER
    description: null
  - mode: NULLABLE
    name: signed_state
    type: INTEGER
    description: null
  - mode: NULLABLE
    name: is_system
    type: BOOLEAN
    description: null
  - mode: NULLABLE
    name: is_web_extension
    type: BOOLEAN
    description: null
  - mode: NULLABLE
    name: multiprocess_compatible
    type: BOOLEAN
    description: null
  mode: REPEATED
  name: active_addons
  type: RECORD
  description: Array of active Firefox add-ons installed by the client, each entry
    containing add-on metadata such as ID, name, version, type, signing state, and
    whether it is a system or web extension.
- mode: NULLABLE
  name: active_experiment_branch
  type: STRING
  description: The branch of the active legacy Telemetry experiment the client was
    enrolled in; null for almost all clients as this field predates the Nimbus experiment
    system (100% null rate sampled 2026-05-29).
- mode: NULLABLE
  name: active_experiment_id
  type: STRING
  description: Identifier of the active legacy Telemetry experiment the client was
    enrolled in; null for almost all clients as this field predates the Nimbus experiment
    system (100% null rate sampled 2026-05-29).
- mode: NULLABLE
  name: active_hours_sum
  type: FLOAT
  description: Total hours of user-active Firefox usage accumulated across all pings
    aggregated into this row; measured in 5-second active ticks converted to hours.
- mode: NULLABLE
  name: addon_compatibility_check_enabled
  type: BOOLEAN
  description: Whether Firefox add-on compatibility checking is enabled; true for
    virtually all clients (sampled 2026-05-29).
- mode: NULLABLE
  name: app_build_id
  type: STRING
  description: The build identifier of the Firefox application, formatted as a timestamp
    string (e.g. '20260511200624').
- mode: NULLABLE
  name: app_display_version
  type: STRING
  description: The user-visible version string for Firefox as displayed in the UI,
    which may differ from app_version for pre-release builds (e.g. '68.0b13').
- mode: NULLABLE
  name: app_name
  type: STRING
  description: The name of the browser application; always 'Firefox' in this table
    (sampled 2026-05-29).
- mode: NULLABLE
  name: app_version
  type: STRING
  description: User visible version string (e.g. "1.0.3") for the browser.
- fields:
  - mode: NULLABLE
    name: source
    type: STRING
    description: The attribution source (UTM source) recorded at download/install
      time, typically a referring domain such as 'www.google.com'; null when attribution
      is unavailable (66% null rate sampled 2026-05-29).
  - mode: NULLABLE
    name: medium
    type: STRING
    description: The attribution medium (UTM medium) recorded at download/install
      time, indicating the marketing channel (e.g. 'referral', 'paidsearch'); null
      when attribution is unavailable (66% null rate sampled 2026-05-29).
  - mode: NULLABLE
    name: campaign
    type: STRING
    description: The attribution campaign (UTM campaign) recorded at download/install
      time, identifying the marketing campaign (e.g. 'SET_DEFAULT_BROWSER'); null
      when attribution is unavailable (66% null rate sampled 2026-05-29).
  - mode: NULLABLE
    name: content
    type: STRING
    description: The attribution content (UTM content) recorded at download/install
      time, used to differentiate creatives or link placements; null when attribution
      is unavailable (66% null rate sampled 2026-05-29).
  - mode: NULLABLE
    name: experiment
    type: STRING
    description: The attribution experiment identifier recorded at download/install
      time, linking the install to a specific A/B test on the Mozilla website; null
      when attribution is unavailable (67.9% null rate sampled 2026-05-29).
  - mode: NULLABLE
    name: variation
    type: STRING
    description: The attribution variation key recorded at download/install time,
      identifying the variant within an attribution experiment; null when attribution
      is unavailable (67.9% null rate sampled 2026-05-29).
  - mode: NULLABLE
    name: dltoken
    type: STRING
    description: A unique token assigned at download time to track individual Firefox
      installer downloads; null when attribution is unavailable (69.8% null rate sampled
      2026-05-29).
  - mode: NULLABLE
    name: dlsource
    type: STRING
    description: The download source identifier recorded at install time, indicating
      the distribution pipeline (e.g. 'mozorg', 'mozillaci', 'fxdotcom'); null when
      attribution is unavailable (52.5% null rate sampled 2026-05-29).
  - name: ua
    type: STRING
    mode: NULLABLE
    description: The browser user-agent detected at download time, capturing the browser
      the user was using when they downloaded Firefox (e.g. 'edge', 'chrome', 'firefox');
      null when attribution is unavailable (68% null rate sampled 2026-05-29).
  mode: NULLABLE
  name: attribution
  type: RECORD
  description: Struct containing UTM-style attribution parameters recorded at the
    time Firefox was downloaded or installed, linking the client to a marketing source.
- mode: NULLABLE
  name: blocklist_enabled
  type: BOOLEAN
  description: Whether the Firefox blocklist (used to block malicious add-ons and
    plugins) is enabled; true for nearly all clients (sampled 2026-05-29).
- mode: NULLABLE
  name: channel
  type: STRING
  description: The raw update channel string reported by the browser, which may contain
    user-modified or non-standard values; use normalized_channel for analysis.
- mode: NULLABLE
  name: client_clock_skew_mean
  type: FLOAT
  description: Mean difference in hours between the client's local clock and the server
    clock, derived from submission timestamps; negative values indicate the client
    clock is ahead.
- mode: NULLABLE
  name: client_submission_latency_mean
  type: FLOAT
  description: Mean number of hours between when a ping was created on the client
    and when it was received by the server; negative values (-1) indicate the client
    clock is ahead of the server.
- mode: NULLABLE
  name: cpu_cores
  type: INTEGER
  description: Number of logical CPU cores available on the client's device (sampled
    2026-05-29).
- mode: NULLABLE
  name: cpu_count
  type: INTEGER
  description: Total number of CPUs (physical packages) present on the client's device;
    typically equals cpu_cores for single-socket systems (sampled 2026-05-29).
- mode: NULLABLE
  name: cpu_family
  type: INTEGER
  description: The CPU family identifier as reported by CPUID; used together with
    cpu_model and cpu_stepping to identify the specific processor microarchitecture
    (sampled 2026-05-29).
- mode: NULLABLE
  name: cpu_l2_cache_kb
  type: INTEGER
  description: Size of the CPU L2 cache in kilobytes as reported by the operating
    system; 0 when unknown (sampled 2026-05-29).
- mode: NULLABLE
  name: cpu_l3_cache_kb
  type: INTEGER
  description: Size of the CPU L3 cache in kilobytes as reported by the operating
    system; 0 when unknown (sampled 2026-05-29).
- mode: NULLABLE
  name: cpu_model
  type: INTEGER
  description: The CPU model identifier as reported by CPUID; used together with cpu_family
    and cpu_stepping to identify the processor microarchitecture (sampled 2026-05-29).
- mode: NULLABLE
  name: cpu_speed_mhz
  type: INTEGER
  description: The clock speed of the CPU in megahertz as reported by the operating
    system; 0 when the value could not be determined (sampled 2026-05-29).
- mode: NULLABLE
  name: cpu_stepping
  type: INTEGER
  description: The CPU stepping identifier as reported by CPUID; used together with
    cpu_family and cpu_model to pinpoint the silicon revision of the processor (sampled
    2026-05-29).
- mode: NULLABLE
  name: cpu_vendor
  type: STRING
  description: The CPU vendor string as reported by CPUID (e.g. 'GenuineIntel', 'AuthenticAMD',
    'ARM'); empty string when not available (sampled 2026-05-29).
- mode: NULLABLE
  name: crashes_detected_content_sum
  type: INTEGER
  description: Total number of content-process crashes detected for this client over
    the aggregation period; null when no crashes were detected (100% null rate sampled
    2026-05-29).
- mode: NULLABLE
  name: crashes_detected_gmplugin_sum
  type: INTEGER
  description: Total number of GMP (Gecko Media Plugin) process crashes detected for
    this client; null when no crashes were detected (100% null rate sampled 2026-05-29).
- mode: NULLABLE
  name: crashes_detected_plugin_sum
  type: INTEGER
  description: Total number of legacy NPAPI plugin process crashes detected for this
    client; null when no crashes were detected (100% null rate sampled 2026-05-29).
- mode: NULLABLE
  name: crash_submit_attempt_content_sum
  type: INTEGER
  description: Total number of crash report submission attempts for content-process
    crashes; null when no submission attempts occurred (99.9% null rate sampled 2026-05-29).
- mode: NULLABLE
  name: crash_submit_attempt_main_sum
  type: INTEGER
  description: Total number of crash report submission attempts for main-process crashes;
    null when no submission attempts occurred (99.8% null rate sampled 2026-05-29).
- mode: NULLABLE
  name: crash_submit_attempt_plugin_sum
  type: INTEGER
  description: Total number of crash report submission attempts for legacy plugin
    process crashes; null when no submission attempts occurred (100% null rate sampled
    2026-05-29).
- mode: NULLABLE
  name: crash_submit_success_content_sum
  type: INTEGER
  description: Total number of successfully submitted crash reports for content-process
    crashes; null when no successful submissions occurred (99.9% null rate sampled
    2026-05-29).
- mode: NULLABLE
  name: crash_submit_success_main_sum
  type: INTEGER
  description: Total number of successfully submitted crash reports for main-process
    crashes; null when no successful submissions occurred (99.8% null rate sampled
    2026-05-29).
- mode: NULLABLE
  name: crash_submit_success_plugin_sum
  type: INTEGER
  description: Total number of successfully submitted crash reports for legacy plugin
    crashes; null when no successful submissions occurred (100% null rate sampled
    2026-05-29).
- mode: NULLABLE
  name: default_search_engine
  type: STRING
  description: The internal identifier of the client's default search engine (e.g.
    'google-b-d', 'baidu', 'ddg'); null in ~1% of rows where the environment is missing
    (sampled 2026-05-29).
- mode: NULLABLE
  name: default_search_engine_data_load_path
  type: STRING
  description: The load path indicating how the default search engine was installed
    (e.g. '[app]google' for built-in, '[addon]google@search.mozilla.org' for extension-provided);
    null in ~1% of rows.
- mode: NULLABLE
  name: default_search_engine_data_name
  type: STRING
  description: The human-readable display name of the client's default search engine
    (e.g. 'Google', 'DuckDuckGo'); null in ~1% of rows (sampled 2026-05-29).
- mode: NULLABLE
  name: default_search_engine_data_origin
  type: STRING
  description: 'How the default search engine was set: ''default'' (shipped default),
    ''verified'' (verified extension), ''unverified'', or ''invalid''; null in 86.6%
    of rows where the environment is missing (sampled 2026-05-29).'
- mode: NULLABLE
  name: default_search_engine_data_submission_url
  type: STRING
  description: The search submission URL template for the default search engine (e.g.
    'https://www.google.com/search?client=firefox-b-d&q='); null in ~2% of rows (sampled
    2026-05-29).
- mode: NULLABLE
  name: devtools_toolbox_opened_count_sum
  type: INTEGER
  description: Total number of times the Firefox Developer Tools toolbox was opened
    during the aggregation period; null when the toolbox was never opened (98.6% null
    rate sampled 2026-05-29).
- mode: NULLABLE
  name: distribution_id
  type: STRING
  description: The distribution identifier associated with this Firefox install (e.g.
    'canonical', 'MozillaOnline'); null in 81.1% of rows where no distribution is
    set (sampled 2026-05-29).
- mode: NULLABLE
  name: e10s_enabled
  type: BOOLEAN
  description: Whether Electrolysis (multi-process Firefox) was enabled; true for
    99.5% of clients, as e10s is the default since Firefox 48 (sampled 2026-05-29).
- mode: NULLABLE
  name: env_build_arch
  type: STRING
  description: The CPU architecture the Firefox build was compiled for (e.g. 'x86-64',
    'aarch64', 'x86'); sampled 2026-05-29.
- mode: NULLABLE
  name: env_build_id
  type: STRING
  description: The build ID string from the Firefox application environment, formatted
    as a timestamp (e.g. '20260511200624'); equivalent to app_build_id.
- mode: NULLABLE
  name: env_build_version
  type: STRING
  description: The Firefox version string as recorded in the build environment; equivalent
    to app_version (e.g. '150.0.3').
- mode: REPEATED
  name: environment_settings_intl_accept_languages
  type: STRING
  description: Array of preferred languages from the browser's Accept-Language HTTP
    header setting, reflecting the user's language preferences in order.
- mode: REPEATED
  name: environment_settings_intl_app_locales
  type: STRING
  description: Array of locales available in the Firefox application bundle for display
    of the UI.
- mode: REPEATED
  name: environment_settings_intl_available_locales
  type: STRING
  description: Array of all locales available to the Firefox browser for UI localisation.
- mode: REPEATED
  name: environment_settings_intl_requested_locales
  type: STRING
  description: Array of locales the user has explicitly requested for the Firefox
    UI via browser settings.
- mode: REPEATED
  name: environment_settings_intl_system_locales
  type: STRING
  description: Array of locale tags representing the operating system's configured
    locale(s) at the time the ping was submitted.
- mode: REPEATED
  name: environment_settings_intl_regional_prefs_locales
  type: STRING
  description: Array of locale tags representing the operating system's regional preferences
    (e.g. date/time format locale), which may differ from the display locale.
- fields:
  - mode: NULLABLE
    name: key
    type: STRING
    description: null
  - mode: NULLABLE
    name: value
    type: STRING
    description: null
  mode: REPEATED
  name: experiments
  type: RECORD
  description: Array of active Nimbus/Shield experiments the client was enrolled in,
    each entry containing the experiment slug (key) and the assigned branch name (value).
- mode: NULLABLE
  name: first_paint_mean
  type: FLOAT
  description: Mean time in milliseconds from Firefox startup to first paint across
    pings in the aggregation period; null in 10.1% of rows where the metric was not
    recorded (sampled 2026-05-29).
- mode: NULLABLE
  name: flash_version
  type: STRING
  description: Version string of the Adobe Flash plugin installed on the client; null
    for 99.6% of clients, reflecting the near-complete retirement of Flash (sampled
    2026-05-29).
- mode: NULLABLE
  name: country
  type: STRING
  description: Two-letter ISO 3166-1 country code of the country in which the client's
    activity took place, as determined by IP geolocation.
- mode: NULLABLE
  name: city
  type: STRING
  description: City name derived from IP geolocation of the client's most recent ping;
    null in ~20% of rows where the city could not be determined (sampled 2026-05-29).
- mode: NULLABLE
  name: geo_subdivision1
  type: STRING
  description: First-level administrative subdivision code (e.g. US state or European
    region) derived from IP geolocation; null in ~5% of rows (sampled 2026-05-29).
- mode: NULLABLE
  name: geo_subdivision2
  type: STRING
  description: Second-level administrative subdivision code (e.g. county or department)
    derived from IP geolocation; null in ~84% of rows where the precision is unavailable
    (sampled 2026-05-29).
- mode: NULLABLE
  name: isp_name
  type: STRING
  description: The name of the internet service provider associated with the client's
    IP address.
- mode: NULLABLE
  name: isp_organization
  type: STRING
  description: The organisation name associated with the client's IP address as reported
    by the geolocation database; typically the ISP's registered legal name.
- mode: NULLABLE
  name: gfx_features_advanced_layers_status
  type: STRING
  description: Status of the Advanced Layers (Compositor) graphics feature (e.g. 'available',
    'blocked', 'disabled'); null in 99.3% of rows where the feature status was not
    reported (sampled 2026-05-29).
- mode: NULLABLE
  name: gfx_features_d2d_status
  type: STRING
  description: Status of Direct2D hardware acceleration (e.g. 'available', 'disabled:FEATURE_FAILURE_DISABLED',
    various blocklist codes); null in 83.1% of rows, mostly non-Windows clients (sampled
    2026-05-29).
- mode: NULLABLE
  name: gfx_features_d3d11_status
  type: STRING
  description: Status of Direct3D 11 hardware acceleration (e.g. 'available', various
    blocklist/failure codes); null in 15.4% of rows, mostly non-Windows clients (sampled
    2026-05-29).
- mode: NULLABLE
  name: gfx_features_gpu_process_status
  type: STRING
  description: Status of the GPU process feature in Firefox (e.g. 'available', 'unused',
    various unavailability codes); null in 0.7% of rows (sampled 2026-05-29).
