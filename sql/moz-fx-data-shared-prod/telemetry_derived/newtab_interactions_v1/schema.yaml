fields:
- mode: NULLABLE
  name: newtab_visit_id
  type: STRING
  description: A UUID identifying a single newtab visit session, used to join interaction
    events from different pings that belong to the same visit.
- mode: NULLABLE
  name: client_id
  type: STRING
- mode: NULLABLE
  name: submission_date
  type: DATE
- mode: NULLABLE
  name: search_engine
  type: STRING
  description: The normalized name of the search engine used during this newtab visit
    (e.g. 'google-b-d', 'DuckDuckGo'). Null (~97%) for visits without a search.
- mode: NULLABLE
  name: search_access_point
  type: STRING
  description: The access point from which a search was issued (e.g. 'urlbar_handoff',
    'urlbar_persisted'). Null (~97%) for visits without a search.
- fields:
  - mode: NULLABLE
    name: key
    type: STRING
    description: Experiment slug for each active Nimbus experiment or rollout in the
      experiments array for this visit.
  - fields:
    - mode: NULLABLE
      name: branch
      type: STRING
      description: The Nimbus branch name assigned to this client for each experiment
        entry in the experiments array (e.g. 'control', 'treatment-a').
    - fields:
      - mode: NULLABLE
        name: type
        type: STRING
        description: Enrollment type for each experiment entry in the experiments
          array (e.g. 'nimbus-rollout', 'nimbus-nimbus').
      - mode: NULLABLE
        name: enrollment_id
        type: STRING
        description: UUID identifying the specific enrollment event for each experiment
          entry. Null in ~99.9% of rows.
      mode: NULLABLE
      name: extra
      type: RECORD
    mode: NULLABLE
    name: value
    type: RECORD
  mode: REPEATED
  name: experiments
  type: RECORD
- mode: NULLABLE
  name: default_private_search_engine
  type: STRING
  description: Telemetry ID of the client's private-browsing default search engine
    for this visit (e.g. 'google-b-d', 'ddg'). Null (~0.7%) when not available.
- mode: NULLABLE
  name: default_search_engine
  type: STRING
  description: Telemetry ID of the client's default search engine for this visit.
    Blank string is the most common value; 'other-<name>' indicates a user-installed
    engine.
- mode: NULLABLE
  name: os
  type: STRING
  description: The name of the operating system running on the client for this visit
    (e.g. 'Windows', 'Mac', 'Linux').
- mode: NULLABLE
  name: os_version
  type: STRING
  description: The user-visible version of the operating system (e.g. '10.0' for Windows
    10, '25.5.0' for Android). Derived from the Glean os_version metric.
- mode: NULLABLE
  name: country_code
  type: STRING
  description: Code of the country in which the activity took place, as determined
    by the IP geolocation. Unknown or NULL values are normally stored as '??'.
- mode: NULLABLE
  name: channel
  type: STRING
  description: The normalized channel the application is being distributed on.
- mode: NULLABLE
  name: browser_version
  type: STRING
  description: The user-visible Firefox version string for the client during this
    visit (e.g. '151.0.1').
- mode: NULLABLE
  name: browser_name
  type: STRING
  description: The name of the browser generating this data. Always 'Firefox Desktop'
    for this table.
- mode: NULLABLE
  name: newtab_open_source
  type: STRING
  description: The URL from which the newtab was opened (e.g. 'about:newtab', 'about:home',
    'about:welcome', 'other'). Null (~0.8%) when no newtab.opened event was received.
- mode: NULLABLE
  name: newtab_visit_started_at
  type: INTEGER
  description: Timestamp (in milliseconds since ping start) when the newtab was opened/made
    visible. 0 for a large fraction of visits (~91%) indicating preloaded tabs or
    missing opened events; null (~0.8%) when no opened event was recorded.
- mode: NULLABLE
  name: newtab_visit_ended_at
  type: INTEGER
  description: Timestamp (in milliseconds since ping start) when the newtab was closed.
    0 for visits closed instantly; null (~1.3%) when no closed event was recorded.
- mode: NULLABLE
  name: topsite_clicks
  type: INTEGER
  description: Number of top-site tile clicks (sponsored or organic) during this newtab
    visit.
- mode: NULLABLE
  name: sponsored_topsite_clicks
  type: INTEGER
  description: Number of sponsored top-site tile clicks during this newtab visit.
- mode: NULLABLE
  name: topsite_impressions
  type: INTEGER
  description: Number of top-site tile impressions during this newtab visit.
- mode: NULLABLE
  name: sponsored_topsite_impressions
  type: INTEGER
  description: Number of sponsored top-site tile impressions during this newtab visit.
- mode: NULLABLE
  name: searches
  type: INTEGER
  description: Number of searches issued from the newtab during this visit.
- mode: NULLABLE
  name: tagged_search_ad_clicks
  type: INTEGER
  description: Number of ad clicks on tagged-search SERPs originating from this newtab
    visit.
- mode: NULLABLE
  name: tagged_search_ad_impressions
  type: INTEGER
  description: Number of tagged-search SERP pages with visible ad links originating
    from this newtab visit.
- mode: NULLABLE
  name: follow_on_search_ad_clicks
  type: INTEGER
  description: Number of ad clicks on SERPs from follow-on searches originating from
    this newtab visit.
- mode: NULLABLE
  name: follow_on_search_ad_impressions
  type: INTEGER
  description: Number of SERP pages with ad impressions from follow-on searches originating
    from this newtab visit.
- mode: NULLABLE
  name: tagged_follow_on_search_ad_clicks
  type: INTEGER
  description: Number of ad clicks from tagged follow-on searches originating from
    this newtab visit.
- mode: NULLABLE
  name: tagged_follow_on_search_ad_impressions
  type: INTEGER
  description: Number of SERP pages with ad impressions from tagged follow-on searches
    originating from this newtab visit.
- mode: NULLABLE
  name: pocket_story_position
  type: INTEGER
  description: 0-indexed position of the Pocket story tile interacted with during
    this visit. Null (~37%) for visits with no story-position-specific interaction.
- mode: NULLABLE
  name: pocket_enabled
  type: BOOLEAN
  description: Whether the Pocket section was enabled on the newtab during this visit.
- mode: NULLABLE
  name: pocket_impressions
  type: INTEGER
  description: Number of Pocket tile impressions (sponsored or organic) during this
    newtab visit.
- mode: NULLABLE
  name: sponsored_pocket_impressions
  type: INTEGER
  description: Number of sponsored Pocket tile impressions during this newtab visit.
- mode: NULLABLE
  name: organic_pocket_impressions
  type: INTEGER
  description: Number of organic (non-sponsored) Pocket tile impressions during this
    newtab visit.
- mode: NULLABLE
  name: pocket_clicks
  type: INTEGER
  description: Number of Pocket tile clicks during this newtab visit.
- mode: NULLABLE
  name: sponsored_pocket_clicks
  type: INTEGER
  description: Number of sponsored Pocket tile clicks during this newtab visit.
- mode: NULLABLE
  name: organic_pocket_clicks
  type: INTEGER
  description: Number of organic Pocket tile clicks during this newtab visit.
- mode: NULLABLE
  name: pocket_saves
  type: INTEGER
  description: Number of Pocket tile saves (via the 'Save to Pocket' option) during
    this newtab visit.
- mode: NULLABLE
  name: sponsored_pocket_saves
  type: INTEGER
  description: Number of sponsored Pocket tile saves during this newtab visit. Always
    0 in sampled data (2026-06-02).
- mode: NULLABLE
  name: organic_pocket_saves
  type: INTEGER
  description: Number of organic Pocket tile saves during this newtab visit.
- mode: NULLABLE
  name: pocket_is_signed_in
  type: BOOLEAN
  description: Whether the client was signed in to Pocket during this newtab visit.
    Null (~91.8%) when no Pocket sign-in state was observed.
- mode: NULLABLE
  name: pocket_sponsored_stories_enabled
  type: BOOLEAN
  description: Whether Pocket sponsored stories were enabled on the newtab during
    this visit.
- mode: NULLABLE
  name: topsites_enabled
  type: BOOLEAN
  description: Whether the Shortcuts (Top Sites) section was enabled during this newtab
    visit.
- mode: NULLABLE
  name: newtab_homepage_category
  type: STRING
  description: Category of the client's home page setting as of this newtab visit
    (e.g. 'enabled', 'extension', 'social-media', 'known-hijacker-v3').
- mode: NULLABLE
  name: newtab_newtab_category
  type: STRING
  description: Category of the client's new-tab page setting as of this newtab visit
    (e.g. 'enabled', 'extension', 'disabled').
- mode: NULLABLE
  name: newtab_search_enabled
  type: BOOLEAN
  description: Whether the search input box was enabled on the newtab during this
    visit.
- mode: NULLABLE
  name: legacy_telemetry_client_id
  type: STRING
  description: The legacy Telemetry client_id UUID for this client. Null (~5.1%) when
    legacy telemetry was not initialized.
- mode: NULLABLE
  name: is_new_profile
  type: BOOLEAN
  description: True if this client's first-seen date equals the submission date, indicating
    a newly created profile. Null when activity segment data is unavailable.
- mode: NULLABLE
  name: activity_segment
  type: STRING
  description: Classification of users based on their browsing activity. E.g., infrequent,
    casual, regular.
- mode: NULLABLE
  name: topsites_rows
  type: INTEGER
  description: Number of top-site tile rows configured on the client's newtab page
    during this visit.
- mode: NULLABLE
  name: organic_topsite_clicks
  type: INTEGER
  description: Number of organic (non-sponsored) top-site tile clicks during this
    newtab visit.
- mode: NULLABLE
  name: organic_topsite_impressions
  type: INTEGER
  description: Number of organic (non-sponsored) top-site tile impressions during
    this newtab visit.
- mode: NULLABLE
  name: topsite_dismissals
  type: INTEGER
  description: Number of top-site tile dismissals during this newtab visit.
- mode: NULLABLE
  name: sponsored_topsite_dismissals
  type: INTEGER
  description: Number of sponsored top-site tile dismissals during this newtab visit.
- mode: NULLABLE
  name: organic_topsite_dismissals
  type: INTEGER
  description: Number of organic top-site tile dismissals during this newtab visit.
- mode: NULLABLE
  name: profile_group_id
  type: STRING
  description: A UUID identifying the profile's group on a single device and allowing
    user-oriented correlation of data
