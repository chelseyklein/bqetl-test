fields:
- name: crash_date
  type: DATE
  mode: NULLABLE
  description: The calendar date on which the crash occurred, extracted from the crash report submission
    timestamp.
- name: abort_message
  type: STRING
  mode: NULLABLE
  description: The message from an XPCOM abort, containing a developer-readable description of the assertion
    or invariant violation that caused the crash.
- name: accessibility
  type: STRING
  mode: NULLABLE
  description: Indicates whether an accessibility client was connected to Firefox at crash time ('1' = accessibility
    client present, '0' = not present).
- name: adapter_device_id
  type: STRING
  mode: NULLABLE
  description: PCI device ID of the primary graphics adapter identifying the specific GPU model (e.g., '0x191b').
    Null when not available.
- name: adapter_driver_version
  type: STRING
  mode: NULLABLE
  description: Version string of the graphics driver installed on the crashing device.
- name: adapter_subsys_id
  type: STRING
  mode: NULLABLE
  description: Subsystem ID of the graphics adapter, combining vendor and card partner identifiers.
- name: adapter_vendor_id
  type: STRING
  mode: NULLABLE
  description: PCI vendor ID of the primary graphics adapter (e.g., '0x8086' for Intel, '0x10de' for NVIDIA).
    Null for devices without a recognized GPU.
- name: additional_minidumps
  type: RECORD
  mode: NULLABLE
  description: ''
  fields:
  - name: list
    type: RECORD
    mode: REPEATED
    description: ''
    fields:
    - name: element
      type: STRING
      mode: NULLABLE
      description: ''
- name: addons
  type: RECORD
  mode: NULLABLE
  description: ''
  fields:
  - name: list
    type: RECORD
    mode: REPEATED
    description: ''
    fields:
    - name: element
      type: STRING
      mode: NULLABLE
      description: ''
- name: addons_checked
  type: BOOLEAN
  mode: NULLABLE
  description: True if Firefox checked installed add-ons for compatibility at the time of the crash; false
    otherwise.
- name: address
  type: STRING
  mode: NULLABLE
  description: ''
- name: android_board
  type: STRING
  mode: NULLABLE
  description: Hardware board name of the Android device (e.g., 'msmnile', 'aito'). Null for non-Android
    crashes.
- name: android_brand
  type: STRING
  mode: NULLABLE
  description: Brand name of the Android device manufacturer (e.g., 'samsung', 'motorola'). Null for non-Android
    crashes.
- name: android_cpu_abi
  type: STRING
  mode: NULLABLE
  description: Primary ABI of the Android device CPU (e.g., 'arm64-v8a', 'armeabi-v7a', 'x86_64'). Null
    for non-Android crashes.
- name: android_cpu_abi2
  type: STRING
  mode: NULLABLE
  description: Secondary ABI supported by the Android device CPU (e.g., 'armeabi-v7a'). Null when not applicable
    or for non-Android crashes.
- name: android_device
  type: STRING
  mode: NULLABLE
  description: Device codename of the Android device (e.g., 'mh2lm', 'aito'). Null for non-Android crashes.
- name: android_hardware
  type: STRING
  mode: NULLABLE
  description: Hardware platform string of the Android device (e.g., 'qcom', 'mt6878'). Null for non-Android
    crashes.
- name: android_manufacturer
  type: STRING
  mode: NULLABLE
  description: Manufacturer name of the Android device (e.g., 'samsung', 'motorola', 'LGE'). Null for non-Android
    crashes.
- name: android_model
  type: STRING
  mode: NULLABLE
  description: Model name of the Android device (e.g., 'LM-V510N', 'SM-T530'). Null for non-Android crashes.
- name: android_version
  type: STRING
  mode: NULLABLE
  description: Android API level and release type of the crashing device (e.g., '36 (REL)', '31 (REL)').
    Null for non-Android crashes.
- name: app_init_dlls
  type: STRING
  mode: NULLABLE
  description: Semicolon-separated list of DLLs that were loaded into the Firefox process before the DLL
    blocklist was initialised, Windows only.
- name: app_notes
  type: STRING
  mode: NULLABLE
  description: Free-form string with application-specific notes recorded at crash time, including graphics
    feature status flags (e.g., 'DWrite+ WR+ IpcWebGL+').
- name: available_physical_memory
  type: STRING
  mode: NULLABLE
  description: Amount of physical RAM available (not in use) in bytes at the time of the crash, Windows
    only.
- name: available_virtual_memory
  type: STRING
  mode: NULLABLE
  description: Amount of virtual memory available to the process in bytes at the time of the crash, Windows
    only.
- name: bios_manufacturer
  type: STRING
  mode: NULLABLE
  description: BIOS manufacturer string of the crashing device. Always null in current data.
- name: build_id
  type: STRING
  mode: NULLABLE
  description: The build ID string of the crashing application (e.g., '20260608154138'), representing the
    date and time the build was compiled.
- name: classifications
  type: RECORD
  mode: NULLABLE
  description: ''
  fields:
  - name: jit
    type: RECORD
    mode: NULLABLE
    description: ''
    fields:
    - name: category
      type: STRING
      mode: NULLABLE
      description: ''
    - name: category_return_code
      type: STRING
      mode: NULLABLE
      description: ''
  - name: skunk_works
    type: RECORD
    mode: NULLABLE
    description: ''
    fields:
    - name: classification
      type: STRING
      mode: NULLABLE
      description: ''
    - name: classification_data
      type: STRING
      mode: NULLABLE
      description: ''
    - name: classification_version
      type: STRING
      mode: NULLABLE
      description: ''
  - name: support
    type: RECORD
    mode: NULLABLE
    description: ''
    fields:
    - name: classification
      type: STRING
      mode: NULLABLE
      description: ''
    - name: classification_data
      type: STRING
      mode: NULLABLE
      description: ''
    - name: classification_version
      type: STRING
      mode: NULLABLE
      description: ''
- name: contains_memory_report
  type: STRING
  mode: NULLABLE
  description: Indicates whether a memory report was attached to this crash submission. Always null in current
    data.
- name: cpu_arch
  type: STRING
  mode: NULLABLE
  description: The CPU architecture of the crashing device (e.g., 'amd64', 'arm64', 'x86', 'arm').
- name: cpu_info
  type: STRING
  mode: NULLABLE
  description: Detailed CPU identification string including family, model, and stepping (e.g., 'family 6
    model 94 stepping 3'). 'unknown' when not determinable.
- name: cpu_microcode_version
  type: STRING
  mode: NULLABLE
  description: Hexadecimal microcode version string of the CPU (e.g., '0xcc', '0x21'). Null when not available.
- name: crash_id
  type: STRING
  mode: NULLABLE
  description: Unique UUID identifying the crash report in the Socorro crash reporting system.
- name: date
  type: STRING
  mode: NULLABLE
  description: ISO 8601 timestamp string of when the crash was received by the Socorro ingestion pipeline.
- name: dom_ipc_enabled
  type: STRING
  mode: NULLABLE
  description: Indicates whether DOM IPC (e10s process isolation) was enabled at the time of the crash ('1'
    = enabled, '0' = disabled).
- name: e10s_cohort
  type: STRING
  mode: NULLABLE
  description: Electrolysis (multi-process) experiment cohort assignment. Always null in current data as
    e10s is no longer experimental.
- name: flash_version
  type: STRING
  mode: NULLABLE
  description: Version of Adobe Flash Player installed at crash time. Always null as Flash support has been
    removed.
- name: gmp_plugin
  type: STRING
  mode: NULLABLE
  description: Indicates whether a Gecko Media Plugin (GMP) was active at the time of the crash ('1' = GMP
    active). Null when not present.
- name: graphics_critical_error
  type: STRING
  mode: NULLABLE
  description: Log string of critical graphics errors recorded before the crash, typically listing GFX failures
    such as compositor bridge shutdowns or GPU process kills.
- name: graphics_startup_test
  type: STRING
  mode: NULLABLE
  description: Indicates whether a graphics startup test was run at crash time ('1' = test ran). Always
    null or '1' in this table.
- name: hang_type
  type: INT64
  mode: NULLABLE
  description: Type of browser hang that preceded the crash. Always null in current data.
- name: install_age
  type: INT64
  mode: NULLABLE
  description: Number of seconds elapsed since Firefox was installed at the time of the crash, derived from
    the profile creation date.
- name: ipc_channel_error
  type: STRING
  mode: NULLABLE
  description: Error string describing why the IPC channel between processes was terminated, present only
    for IPC-related content or GPU process crashes (e.g., 'GPUProcessKill').
- name: ipc_fatal_error_msg
  type: STRING
  mode: NULLABLE
  description: Message string from a fatal IPC protocol error that caused the crash (e.g., 'Failed to map
    data shmem'). Null when the crash was not due to a fatal IPC error.
- name: ipc_fatal_error_protocol
  type: STRING
  mode: NULLABLE
  description: IPC protocol name involved in the fatal error that caused the crash. Always null in current
    data.
- name: ipc_message_name
  type: STRING
  mode: NULLABLE
  description: Name of the IPC message being processed when the crash occurred (e.g., 'PWebRenderBridge::Msg_SetDisplayList').
    Null in most cases.
- name: ipc_system_error
  type: STRING
  mode: NULLABLE
  description: System error code associated with the IPC channel failure (e.g., '8' for ENOEXEC). Null when
    no IPC system error was recorded.
- name: is_garbage_collecting
  type: STRING
  mode: NULLABLE
  description: Indicates whether JavaScript garbage collection was in progress when the crash occurred ('1'
    = GC running). Null when not recorded.
- name: java_stack_trace
  type: STRING
  mode: NULLABLE
  description: Full Java stack trace for Android crashes where the exception originated in Java code. Null
    for non-Android or non-Java crashes.
- name: jit_category
  type: STRING
  mode: NULLABLE
  description: JIT-related crash category classification. Always null in current data.
