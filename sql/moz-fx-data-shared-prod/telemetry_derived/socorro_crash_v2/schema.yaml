- name: moz_crash_reason
  type: STRING
  mode: NULLABLE
  description: The string passed to MOZ_CRASH() or abort() at the crash site, providing developer-supplied
    context about why the crash was triggered (e.g., 'OOM | small', 'Shutdown hanging...').
- name: oom_allocation_size
  type: STRING
  mode: NULLABLE
  description: Size in bytes of the allocation that triggered an out-of-memory (OOM) condition leading to
    the crash. Null when the crash was not OOM-related.
- name: platform
  type: STRING
  mode: NULLABLE
  description: The operating system platform of the crashing device (e.g., 'Windows NT', 'Android', 'Mac
    OS X', 'Linux').
- name: platform_pretty_version
  type: STRING
  mode: NULLABLE
  description: Human-readable description of the operating system version (e.g., 'Windows 11', 'Windows
    10', 'Android 36').
- name: platform_version
  type: STRING
  mode: NULLABLE
  description: The version string of the operating system (e.g., '10.0.19045' for Windows 10, '21' for Android
    API level 21).
- name: plugin_filename
  type: STRING
  mode: NULLABLE
  description: Filename identifier of the plugin that crashed (e.g., 'widevinecdm', 'gmpopenh264'). Null
    when not plugin-related.
- name: plugin_name
  type: STRING
  mode: NULLABLE
  description: Name of the browser plugin (e.g., 'WidevineCdm', 'clearkey') that crashed. Null when the
    crash was not plugin-related.
- name: plugin_version
  type: STRING
  mode: NULLABLE
  description: Version string of the plugin that crashed. Null when not plugin-related.
- name: process_type
  type: STRING
  mode: NULLABLE
  description: The type of Firefox process that crashed (e.g., 'parent', 'content', 'gpu', 'rdd', 'utility',
    'socket').
- name: processor_notes
  type: STRING
  mode: NULLABLE
  description: Log messages from the Socorro crash processor describing actions taken during minidump processing
    and signature generation.
- name: product
  type: STRING
  mode: NULLABLE
  description: The Mozilla product that crashed (e.g., 'Firefox', 'Fenix', 'Thunderbird', 'Focus').
- name: productid
  type: STRING
  mode: NULLABLE
  description: The application UUID identifying the Mozilla product (e.g., '{ec8030f7-c20a-464f-9b0e-13a3a9e97384}'
    for Firefox).
- name: proto_signature
  type: STRING
  mode: NULLABLE
  description: The prototype signature string with full function names before shortening, used to group
    related crashes.
- name: reason
  type: STRING
  mode: NULLABLE
  description: The crash exception or signal that caused the crash (e.g., 'EXCEPTION_BREAKPOINT', 'SIGSEGV
    / SEGV_MAPERR', 'SIGABRT / SI_QUEUE').
- name: release_channel
  type: STRING
  mode: NULLABLE
  description: The Firefox release channel of the crashing application (e.g., 'release', 'nightly', 'beta',
    'esr').
- name: safe_mode
  type: STRING
  mode: NULLABLE
  description: Indicates whether Firefox was running in safe mode at the time of the crash ('1' = safe mode,
    '0' = normal mode). Null when not recorded.
- name: shutdown_progress
  type: STRING
  mode: NULLABLE
  description: The shutdown phase reached when the crash occurred (e.g., 'xpcom-shutdown-threads', 'profile-before-change').
    Null if the crash did not occur during shutdown.
- name: signature
  type: STRING
  mode: NULLABLE
  description: The crash signature string identifying the location in the code where the crash occurred,
    computed by Socorro's signature generator.
- name: startup_crash
  type: STRING
  mode: NULLABLE
  description: Indicates whether the crash occurred during Firefox startup ('1') or not ('0'). Null when
    startup status was not recorded.
- name: submitted_from_infobar
  type: STRING
  mode: NULLABLE
  description: Indicates whether the crash was submitted via the in-browser infobar prompt. Always null
    in current data.
- name: theme
  type: STRING
  mode: NULLABLE
  description: Active Firefox theme at the time of the crash. Always null in current data.
- name: topmost_filenames
  type: STRING
  mode: NULLABLE
  description: Path to the source file containing the top (crashing) function in the stack trace, used to
    identify which component of Firefox caused the crash.
- name: total_physical_memory
  type: STRING
  mode: NULLABLE
  description: Total installed physical RAM in bytes on the crashing device, Windows only.
- name: total_virtual_memory
  type: STRING
  mode: NULLABLE
  description: Total virtual memory size in bytes available to the process on the crashing device, Windows
    only.
- name: uptime
  type: INT64
  mode: NULLABLE
  description: Number of seconds Firefox was running before the crash occurred. Null when uptime could not
    be determined.
- name: user_comments
  type: STRING
  mode: NULLABLE
  description: Comments submitted by the user along with the crash report. Always null in this table (suppressed
    for privacy).
- name: useragent_locale
  type: STRING
  mode: NULLABLE
  description: The locale string from the crashing browser's user agent (e.g., 'en-US', 'de').
- name: uuid
  type: STRING
  mode: NULLABLE
  description: Unique UUID identifying this crash record, equivalent to crash_id in most cases.
- name: version
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/telemetry_derived/telemetry_derived.yaml
    field: version
- name: winsock_lsp
  type: STRING
  mode: NULLABLE
  description: List of Winsock Layered Service Providers installed on the Windows device. Always null in
    current data.
- name: minidump_sha256_hash
  type: STRING
  mode: NULLABLE
  description: SHA-256 hash of the minidump file associated with this crash, used for deduplication. An
    empty string or zero-length hash indicates no minidump content.
- name: dom_fission_enabled
  type: STRING
  mode: NULLABLE
  description: Indicates whether DOM Fission (cross-origin iframe process isolation) was enabled at crash
    time ('1' = enabled, '0' = disabled).
