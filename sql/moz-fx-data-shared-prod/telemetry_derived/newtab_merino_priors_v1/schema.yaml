fields:
- mode: NULLABLE
  name: region
  type: STRING
  description: ISO 3166-1 alpha-2 country code for the Merino feed region (e.g. 'US',
    'DE', 'GB'). Null for the global aggregate row spanning all regions.
- mode: NULLABLE
  name: average_ctr_top2_items
  type: FLOAT
  description: Average click-through rate of the top 2 corpus items ranked by click
    count for this region over the look-back window. Used as a prior for Merino's
    CTR estimation.
- mode: NULLABLE
  name: average_ctr_top10_items
  type: FLOAT
  description: Average click-through rate of the top 10 corpus items ranked by click
    count for this region over the look-back window. Used as a prior for Merino's
    CTR estimation.
- mode: NULLABLE
  name: impressions_per_item
  type: FLOAT
  description: Average number of impressions per corpus item for this region over
    the look-back window, rounded to the nearest integer.
- mode: NULLABLE
  name: total_impressions_per_day
  type: FLOAT
  description: Average daily total impressions across all corpus items for this region
    over the look-back window, rounded to the nearest integer.
