fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: country
  type: STRING
  mode: NULLABLE
  description: An ISO 3166-1 alpha-2 country code
- name: app_name
  type: STRING
  mode: NULLABLE
  description: The name of the browser application (e.g., 'Firefox Desktop', 'Fenix',
    'Firefox iOS').
- name: adjust_network
  type: STRING
  mode: NULLABLE
  description: The name of the Adjust Network that sourced the installation. Populated
    only for mobile clients (~14% non-null).
- name: attribution_medium
  type: STRING
  mode: NULLABLE
  description: The attribution medium (similar to UTM medium) associated with the
    client's install. Null for ~28% of rows.
- name: attribution_source
  type: STRING
  mode: NULLABLE
  description: The attribution source (similar to UTM source) associated with the
    client's install. Null for ~28% of rows.
- name: first_seen_year
  type: INTEGER
  mode: NULLABLE
  description: The calendar year when the client profile was first seen by Mozilla
    telemetry.
- name: channel
  type: STRING
  mode: NULLABLE
  description: The normalized channel the application is being distributed on.
- name: install_source
  type: STRING
  mode: NULLABLE
  description: The install source identifier for mobile clients (e.g., 'com.android.vending'
    for Google Play). Null for ~88% of rows.
- name: is_default_browser
  type: BOOLEAN
  mode: NULLABLE
  description: A flag indicating whether the browser is set as the default browser
    on the client side.
- name: os_grouped
  type: STRING
  mode: NULLABLE
  description: Grouped operating system name (e.g., 'Windows', 'Mac', 'Android', 'Linux',
    'iOS', 'Other').
- name: segment
  type: STRING
  mode: NULLABLE
  description: Classification of users based on their browsing activity. E.g., infrequent,
    casual, regular.
- name: dau
  type: INTEGER
  mode: NULLABLE
  description: The number of daily active users for the dimension combination on the
    submission_date.
- name: ma_28_dau
  type: FLOAT
  mode: NULLABLE
  description: The 28-day moving average of DAU, computed as the average DAU over
    the 28 days ending on submission_date.
