fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: country_code
  type: STRING
  mode: NULLABLE
  description: Code of the country in which the activity took place, as determined
    by the IP geolocation. Unknown or NULL values are normally stored as '??'.
- name: channel
  type: STRING
  mode: NULLABLE
  description: The normalized channel the application is being distributed on (e.g.
    'release', 'esr', 'beta', 'nightly').
- name: browser_version
  type: STRING
  mode: NULLABLE
  description: The user-visible Firefox version string for clients in this aggregate
    row (e.g. '151.0.1').
- name: browser_name
  type: STRING
  mode: NULLABLE
  description: The name of the browser generating this data. Always 'Firefox Desktop'
    for this table.
- name: search_engine
  type: STRING
  mode: NULLABLE
  description: The normalized search engine name used for a search-initiated from
    the newtab (e.g. 'google-b-d', 'DuckDuckGo'). Null (~91.7%) for non-search rows.
- name: search_access_point
  type: STRING
  mode: NULLABLE
  description: The search access point where the search was initiated (e.g. 'urlbar_handoff',
    'urlbar_persisted'). Null (~91.7%) for non-search rows.
- name: default_search_engine
  type: STRING
  mode: NULLABLE
  description: The telemetry ID of the client's configured default search engine (e.g.
    'google-b-d', 'ddg'). Blank string for most rows when private search engine is
    being tracked; 'other-<name>' for user-installed engines.
- name: default_private_search_engine
  type: STRING
  mode: NULLABLE
  description: The telemetry ID of the client's private-browsing default search engine.
- name: pocket_story_position
  type: INTEGER
  mode: NULLABLE
  description: 0-indexed position of a Pocket story tile on the newtab grid. Null
    (~33.2%) for rows that are not broken out by story position.
- name: newtab_open_source
  type: STRING
  mode: NULLABLE
  description: The URL from which the newtab was opened (e.g. 'about:newtab', 'about:home',
    'about:welcome'). Null (~5.3%) for pings without an opened event.
- name: pocket_is_signed_in
  type: BOOLEAN
  mode: NULLABLE
  description: Whether the clients in this aggregate row were signed in to Pocket.
    Null (~76.8%) when no sign-in state was observed.
- name: pocket_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: Whether the Pocket section was enabled on the newtab for clients in
    this aggregate row.
- name: pocket_sponsored_stories_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: Whether Pocket sponsored stories were enabled for clients in this aggregate
    row.
- name: topsites_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: Whether the Shortcuts (Top Sites) section was enabled for clients in
    this aggregate row.
- name: newtab_homepage_category
  type: STRING
  mode: NULLABLE
  description: Category of the home page (about:home) setting for clients in this
    aggregate row (e.g. 'enabled', 'extension', 'social-media').
- name: newtab_newtab_category
  type: STRING
  mode: NULLABLE
  description: Category of the new-tab page (about:newtab) setting for clients in
    this aggregate row (e.g. 'enabled', 'extension', 'disabled').
- name: topsites_rows
  type: INTEGER
  mode: NULLABLE
  description: The number of top-site tile rows configured for clients in this aggregate
    row.
- name: is_new_profile
  type: BOOLEAN
  mode: NULLABLE
  description: Whether clients in this row were first seen on the submission date
    (new profile). Null when activity segment data is unavailable.
- name: activity_segment
  type: STRING
  mode: NULLABLE
  description: Classification of users based on their browsing activity. E.g., infrequent,
    casual, regular.
- name: client_count
  type: INTEGER
  mode: NULLABLE
  description: Number of distinct Glean client IDs contributing to this aggregate
    row.
- name: legacy_telemetry_client_count
  type: INTEGER
  mode: NULLABLE
  description: Number of distinct legacy Telemetry client IDs contributing to this
    aggregate row.
- name: newtab_interactions_visits
  type: INTEGER
  mode: NULLABLE
  description: Number of distinct newtab visits contributing to this aggregate row.
- name: topsite_clicks
  type: INTEGER
  mode: NULLABLE
  description: Total number of top-site tile clicks (sponsored and organic) across
    all visits in this aggregate row.
- name: sponsored_topsite_clicks
  type: INTEGER
  mode: NULLABLE
  description: Total number of sponsored top-site tile clicks across all visits in
    this aggregate row.
- name: organic_topsite_clicks
  type: INTEGER
  mode: NULLABLE
  description: Total number of organic (non-sponsored) top-site tile clicks across
    all visits in this aggregate row.
- name: topsite_impressions
  type: INTEGER
  mode: NULLABLE
  description: Total number of top-site tile impressions (tiles loaded/visible) across
    all visits in this aggregate row.
- name: sponsored_topsite_impressions
  type: INTEGER
  mode: NULLABLE
  description: Total number of sponsored top-site tile impressions across all visits
    in this aggregate row.
- name: organic_topsite_impressions
  type: INTEGER
  mode: NULLABLE
  description: Total number of organic top-site tile impressions across all visits
    in this aggregate row.
- name: topsite_dismissals
  type: INTEGER
  mode: NULLABLE
  description: Total number of top-site tile dismissals across all visits in this
    aggregate row.
- name: sponsored_topsite_dismissals
  type: INTEGER
  mode: NULLABLE
  description: Total number of sponsored top-site tile dismissals across all visits
    in this aggregate row.
- name: organic_topsite_dismissals
  type: INTEGER
  mode: NULLABLE
  description: Total number of organic top-site tile dismissals across all visits
    in this aggregate row.
- name: searches
  type: INTEGER
  mode: NULLABLE
  description: Total number of searches issued from the newtab search box across all
    visits in this aggregate row.
- name: tagged_search_ad_clicks
  type: INTEGER
  mode: NULLABLE
  description: Total number of ad clicks on tagged-search SERPs originating from newtab
    across all visits in this aggregate row.
- name: tagged_search_ad_impressions
  type: INTEGER
  mode: NULLABLE
  description: Total number of tagged-search SERP pages with ad impressions from newtab
    across all visits in this aggregate row.
- name: follow_on_search_ad_clicks
  type: INTEGER
  mode: NULLABLE
  description: Total number of ad clicks from follow-on searches originating from
    newtab across all visits in this aggregate row.
- name: follow_on_search_ad_impressions
  type: INTEGER
  mode: NULLABLE
  description: Total number of SERP pages with ad impressions from follow-on newtab
    searches across all visits in this aggregate row.
- name: tagged_follow_on_search_ad_clicks
  type: INTEGER
  mode: NULLABLE
  description: Total number of ad clicks from tagged follow-on searches originating
    from newtab across all visits in this aggregate row.
- name: tagged_follow_on_search_ad_impressions
  type: INTEGER
  mode: NULLABLE
  description: Total number of SERP pages with ad impressions from tagged follow-on
    newtab searches across all visits in this aggregate row.
- name: pocket_impressions
  type: INTEGER
  mode: NULLABLE
  description: Total number of Pocket tile impressions across all visits in this aggregate
    row.
- name: sponsored_pocket_impressions
  type: INTEGER
  mode: NULLABLE
  description: Total number of sponsored Pocket tile impressions across all visits
    in this aggregate row.
- name: organic_pocket_impressions
  type: INTEGER
  mode: NULLABLE
  description: Total number of organic Pocket tile impressions across all visits in
    this aggregate row.
- name: pocket_clicks
  type: INTEGER
  mode: NULLABLE
  description: Total number of Pocket tile clicks across all visits in this aggregate
    row.
- name: sponsored_pocket_clicks
  type: INTEGER
  mode: NULLABLE
  description: Total number of sponsored Pocket tile clicks across all visits in this
    aggregate row.
- name: organic_pocket_clicks
  type: INTEGER
  mode: NULLABLE
  description: Total number of organic Pocket tile clicks across all visits in this
    aggregate row.
- name: pocket_saves
  type: INTEGER
  mode: NULLABLE
  description: Total number of Pocket tile saves across all visits in this aggregate
    row.
- name: sponsored_pocket_saves
  type: INTEGER
  mode: NULLABLE
  description: Total number of sponsored Pocket tile saves across all visits in this
    aggregate row. Always 0 in sampled data (2026-06-02).
- name: organic_pocket_saves
  type: INTEGER
  mode: NULLABLE
  description: Total number of organic Pocket tile saves across all visits in this
    aggregate row.
- name: os
  type: STRING
  mode: NULLABLE
  description: The name of the operating system for clients in this aggregate row
    (e.g. 'Windows', 'Mac', 'Linux').
- name: os_version
  type: STRING
  mode: NULLABLE
  description: The user-visible version of the operating system for clients in this
    aggregate row (e.g. '10.0' for Windows 10).
- name: newtab_search_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: Whether the search input box was enabled on the newtab for clients
    in this aggregate row. Null (~0.2%) when pref data was not received.
