fields:
- name: date_from
  type: DATE
  mode: NULLABLE
  description: Start date of the 7-day reporting window over which hardware aggregates
    are computed.
- name: date_to
  type: DATE
  mode: NULLABLE
  description: End date (exclusive) of the 7-day reporting window, i.e. date_from
    + 7 days.
- name: browser_arch
  type: STRING
  mode: NULLABLE
  description: The build architecture of the Firefox browser (e.g. 'x86', 'x86-64').
    Derived from environment.build.architecture in the main ping.
- name: os
  type: STRING
  mode: NULLABLE
  description: Operating system name and version concatenated as '<name>-<version>'
    (e.g. 'Windows_NT-10.0', 'Darwin-24.x'). Derived from the environment.system.os
    fields.
- name: memory_gb
  type: INTEGER
  mode: NULLABLE
  description: System RAM rounded to the nearest gigabyte (e.g. 8, 16). Derived from
    environment.system.memory_mb / 1024.
- name: is_wow64
  type: BOOLEAN
  mode: NULLABLE
  description: True if the Firefox process is running as a 32-bit application under
    64-bit Windows (WOW64 emulation). False for native 64-bit or non-Windows clients.
- name: gfx0_vendor_id
  type: STRING
  mode: NULLABLE
  description: PCI vendor ID of the primary graphics adapter (e.g. '0x8086' for Intel,
    '0x10de' for NVIDIA). Null when no GPU adapter is detected.
- name: gfx0_device_id
  type: STRING
  mode: NULLABLE
  description: PCI device ID of the primary graphics adapter, identifying the specific
    GPU model. Null when no GPU adapter is detected.
- name: resolution
  type: STRING
  mode: NULLABLE
  description: Screen resolution of the primary monitor expressed as '<width>x<height>'
    pixels (e.g. '1920x1080'). Derived from the first GFX monitor entry.
- name: cpu_cores
  type: INTEGER
  mode: NULLABLE
  description: Number of logical CPU cores reported by the client's hardware.
- name: cpu_vendor
  type: STRING
  mode: NULLABLE
  description: The CPU vendor name (e.g. 'GenuineIntel', 'AuthenticAMD', 'Apple').
    Apple Silicon Macs are mapped to 'Apple'.
- name: cpu_speed
  type: STRING
  mode: NULLABLE
  description: The CPU clock speed in GHz, rounded to one decimal place as a string
    (e.g. '3.6'). 'Other' when speed data is unavailable.
- name: has_flash
  type: BOOLEAN
  mode: NULLABLE
  description: True if the 'Shockwave Flash' plugin was active on the client, false
    otherwise.
- name: client_count
  type: INTEGER
  mode: NULLABLE
  description: Number of distinct Firefox clients with this combination of hardware
    attributes in the reporting window.
