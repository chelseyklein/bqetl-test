fields:
- mode: NULLABLE
  name: app_version
  type: STRING
  description: User visible version string (e.g. "1.0.3") for the browser.
- mode: NULLABLE
  name: attributed
  type: BOOLEAN
  description: True if the client's installation has a non-NULL attribution_medium
    or attribution_source, indicating a tracked marketing source; false otherwise.
- mode: NULLABLE
  name: attribution_medium
  type: STRING
  description: The marketing attribution medium associated with the client's installation;
    similar to or the same as UTM medium. NULL for ~81% of rows where attribution
    data is absent.
- mode: NULLABLE
  name: attribution_source
  type: STRING
  description: The marketing attribution source associated with the client's installation;
    similar to or the same as UTM source. NULL for ~81% of rows where attribution
    data is absent.
- mode: NULLABLE
  name: country
  type: STRING
  description: Code of the country in which the activity took place, as determined
    by the IP geolocation.
- mode: NULLABLE
  name: device_model
  type: STRING
  description: The hardware model identifier of the client device (e.g. 'SM-G960F',
    'iPhone14,5'). NULL for ~41% of rows, typically desktop clients where device model
    is not applicable.
- mode: NULLABLE
  name: first_seen_year
  type: INTEGER
  description: The calendar year in which the server first received a ping from the
    client, derived from the client's first_seen_date.
- mode: NULLABLE
  name: is_default_browser
  type: BOOLEAN
  description: A flag indicating whether the browser is set as the default browser
    on the client side.
- mode: NULLABLE
  name: app_name
  type: STRING
  description: The name of the browser application (e.g. 'Firefox Desktop', 'Fenix',
    'Firefox iOS').
- mode: NULLABLE
  name: channel
  type: STRING
  description: The normalized channel the application is being distributed on.
- mode: NULLABLE
  name: os
  type: STRING
  description: The normalized name of the operating system running at the client.
- mode: NULLABLE
  name: os_version
  type: STRING
- mode: NULLABLE
  name: os_version_major
  type: INTEGER
  description: Major or first part of the operating system version running at the
    client. E.g. for version "100.9.11", the major is 100.
- mode: NULLABLE
  name: os_version_minor
  type: INTEGER
  description: Minor part of the operating system version running at the client. E.g.
    for version "100.9.11", the minor is 9.
- mode: NULLABLE
  name: submission_date
  type: DATE
  description: The date when the telemetry ping is received on the server side.
- mode: NULLABLE
  name: dau
  type: INTEGER
  description: Daily Active Users
- mode: NULLABLE
  name: wau
  type: INTEGER
  description: Weekly Active Users
- mode: NULLABLE
  name: mau
  type: INTEGER
  description: Monthly Active Users
- mode: NULLABLE
  name: new_profiles
  type: INTEGER
  description: Count of distinct clients whose first_seen_date matches the submission_date,
    indicating a newly created browser profile.
- mode: NULLABLE
  name: ad_clicks
  type: INTEGER
  description: Total number of ad clicks recorded across all active clients in this
    aggregation group on the submission date. NULL for ~95% of rows where ad click
    data is unavailable.
- mode: NULLABLE
  name: organic_search_count
  type: INTEGER
  description: Total number of organic (non-ad) searches performed by clients in this
    aggregation group on the submission date. NULL for ~60% of rows where search data
    is unavailable.
- mode: NULLABLE
  name: search_count
  type: INTEGER
  description: Total number of searches (organic and paid) performed by clients in
    this aggregation group on the submission date. NULL for ~60% of rows where search
    data is unavailable.
- mode: NULLABLE
  name: search_with_ads
  type: INTEGER
  description: Total number of searches that returned at least one ad, performed by
    clients in this aggregation group on the submission date. NULL for ~92% of rows
    where ad data is unavailable.
- mode: NULLABLE
  name: uri_count
  type: INTEGER
  description: Total number of URIs loaded by clients in this aggregation group on
    the submission date, used as a proxy for browsing activity. NULL for ~69% of rows
    where browsing data is unavailable.
- mode: NULLABLE
  name: active_hours
  type: FLOAT
  description: Total active browsing hours summed across all clients in this aggregation
    group on the submission date. NULL for ~60% of rows where active hours data is
    unavailable.
- description: Count of distinct, qualified Desktop clients that we received a main
    ping from on a given day. In mobile DAU = QDAU.
  mode: NULLABLE
  name: qdau_desktop
  type: INTEGER
