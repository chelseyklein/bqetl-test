fields:
- mode: NULLABLE
  name: submission_date
  type: DATE
  description: The date when the telemetry ping is received on the server side.
- mode: NULLABLE
  name: sample_id
  type: INTEGER
  description: A number, 0-99, that samples by client_id and allows filtering data
    for analysis. It is a pipeline-generated artifact that should match between pings.
- mode: NULLABLE
  name: client_id
  type: STRING
  description: A unique identifier (UUID) for the client.
- mode: NULLABLE
  name: profile_group_id
  type: STRING
  description: A UUID uniquely identifying the profile group, not shared with other
    telemetry data.
- mode: NULLABLE
  name: os
  type: STRING
  description: The normalized name of the operating system running at the client.
- mode: NULLABLE
  name: app_version
  type: STRING
  description: User visible version string (e.g. "1.0.3") for the browser.
- mode: NULLABLE
  name: app_build_id
  type: STRING
  description: The build ID of the Firefox application, used to filter to valid builds
    via the buildhub2 table.
- mode: NULLABLE
  name: channel
  type: STRING
  description: The normalized channel the application is being distributed on.
- fields:
  - mode: NULLABLE
    name: metric
    type: STRING
    description: The name of the scalar metric being aggregated (e.g. 'browser_engagement_active_ticks').
  - mode: NULLABLE
    name: metric_type
    type: STRING
    description: The type of the scalar metric, either 'scalar' for numeric scalars
      or 'boolean' for boolean scalars.
  - mode: NULLABLE
    name: key
    type: STRING
    description: The keyed scalar key; empty string for non-keyed scalars.
  - mode: NULLABLE
    name: process
    type: STRING
    description: The Firefox process in which the scalar was recorded (e.g. 'parent',
      'content', 'gpu').
  - mode: NULLABLE
    name: agg_type
    type: STRING
    description: The aggregation type applied to this scalar value (e.g. 'sum', 'avg',
      'max', 'min', 'count', 'true', 'false' for booleans).
  - mode: NULLABLE
    name: value
    type: FLOAT
    description: The aggregated numeric value for the specified metric, key, process,
      and agg_type combination.
  mode: REPEATED
  name: scalar_aggregates
  type: RECORD
