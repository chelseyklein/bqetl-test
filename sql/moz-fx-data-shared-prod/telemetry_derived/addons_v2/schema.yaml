fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: document_id
  type: STRING
  mode: NULLABLE
  description: The document ID specified in the URI when the client sent this message.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: A number, 0-99, that samples by client_id and allows filtering data
    for analysis. It is a pipeline-generated artifact that should match between pings.
- name: subsession_start_date
  type: STRING
  mode: NULLABLE
  description: The ISO 8601 timestamp representing the start of the Firefox subsession
    during which this ping was collected, including timezone offset (e.g. '2026-05-01T08:00:00.0+02:00').
- name: normalized_channel
  type: STRING
  mode: NULLABLE
  description: The normalized channel the application is being distributed on.
- name: addon_id
  type: STRING
  mode: NULLABLE
  description: The unique identifier for the add-on as reported by Firefox (e.g. 'webcompat@mozilla.org').
- name: blocklisted
  type: BOOLEAN
  mode: NULLABLE
  description: True if the add-on appears on the Firefox blocklist; false otherwise.
    Null (~0.1%) when the add-on entry had no data.
- name: name
  type: STRING
  mode: NULLABLE
  description: The human-readable display name of the add-on as reported by Firefox
    (e.g. 'Web Compatibility Interventions').
- name: user_disabled
  type: BOOLEAN
  mode: NULLABLE
  description: True if the add-on was disabled by the user; false if active. Null
    (~0.1%) when the add-on entry had no data.
- name: app_disabled
  type: BOOLEAN
  mode: NULLABLE
  description: True if the add-on was disabled by the application (e.g. due to compatibility);
    false otherwise. Null (~0.1%) when the add-on entry had no data.
- name: version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
- name: scope
  type: INTEGER
  mode: NULLABLE
  description: Integer representing the installation scope of the add-on (1=profile,
    4=application, 8=user, 16=system). Null for rows with no add-on data.
- name: type
  type: STRING
  mode: NULLABLE
  description: The type of the add-on as a string, e.g. 'extension', 'locale', 'dictionary',
    'service'.
- name: foreign_install
  type: BOOLEAN
  mode: NULLABLE
  description: True if the add-on was installed by an external program rather than
    by the user via Firefox; false otherwise.
- name: has_binary_components
  type: BOOLEAN
  mode: NULLABLE
  description: True if the add-on includes native binary components; false otherwise.
    All observed values are false.
- name: install_day
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the Unix epoch (1970-01-01) when this add-on
    was first installed. A value of 0 indicates the install_day was not recorded.
- name: update_day
  type: INTEGER
  mode: NULLABLE
  description: The number of days since the Unix epoch when this add-on was last updated.
    A value of 0 indicates the update_day was not recorded.
- name: signed_state
  type: INTEGER
  mode: NULLABLE
  description: 'Integer representing the AMO signing state of the add-on: 2=signed,
    3=system-signed, 4=privileged, -1=unknown, 0=unsigned, -2=broken. Null (~59%)
    for system add-ons where signing state is not applicable.'
- name: is_system
  type: BOOLEAN
  mode: NULLABLE
  description: True if this is a built-in system add-on shipped with Firefox; false
    for user-installed add-ons.
- name: is_web_extension
  type: BOOLEAN
  mode: NULLABLE
  description: True if this add-on uses the WebExtensions API; false for legacy or
    other add-on types.
- name: multiprocess_compatible
  type: BOOLEAN
  mode: NULLABLE
  description: True if this add-on is compatible with Firefox's multi-process (e10s)
    architecture; false otherwise.
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the profile group, not shared with other
    telemetry data.
