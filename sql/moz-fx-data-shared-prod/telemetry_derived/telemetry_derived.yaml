  description: Count of how many times the OS process priority of a content process was raised (prioritized) during this session.
- name: scalar_parent_dom_contentprocess_troubled_due_to_memory
  description: Count of content processes that were killed because the system was under memory pressure during the session.
- name: scalar_parent_dom_parentprocess_private_window_used
  description: Boolean indicating whether a private browsing window was used (opened) in the parent process during this session.
- name: scalar_parent_encoding_override_used
  description: Boolean indicating whether the user manually overrode the character encoding for a page in the parent process during this session.
- name: scalar_parent_extensions_updates_rdf
