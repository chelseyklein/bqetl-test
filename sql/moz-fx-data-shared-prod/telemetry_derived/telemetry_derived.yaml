fields:
- name: CLICK_COUNT
  description: The total number of times a user clicked on a content item (e.g., a sponsored tile or recommendation). A value of 0 indicates no
    clicks were recorded for that item in the given period.
- name: DISMISS_COUNT
  description: The total number of times a user dismissed a content item such as a tile or recommendation. A value of 0 indicates the item was
    never dismissed during the given period.
- name: ER
  description: The engagement rate for a content item or surface, expressed as a float between 0 and 1. It represents the ratio of user interactions
    to total impressions.
- name: HAPPENED_AT
  description: The calendar date on which the event or activity being recorded occurred. Used to partition and filter data by day.
- name: IMPRESSION_COUNT
  description: The total number of times a content item was displayed to users. Higher values indicate the item was shown more frequently during
    the reporting period.
- name: POSITION
  description: The zero-based index position at which a content item (such as a tile or recommendation) was displayed within a surface layout.
    Lower values indicate positions closer to the top-left of the display area.
- name: SAVE_COUNT
  description: The total number of times a user saved a content item (e.g., to Pocket or a reading list). A value of 0 indicates the item was
    never saved during the given period.
- name: TILE_ID
  description: A unique numeric identifier for a content tile served to users, such as a sponsored or organic New Tab tile. Used to join tile-level
    engagement metrics across tables.
- name: _GS_FILE_DATE
  description: The date partition extracted from the source Google Cloud Storage file path, formatted as 'date=YYYY-MM-DD'. It indicates which
    day's data the file contains.
- name: _GS_FILE_NAME
  description: The full path of the source Parquet file in Google Cloud Storage from which the row was loaded. Includes directory structure, date
    partition, time partition, and filename.
- name: _GS_FILE_ROW_NUMBER
  description: The sequential row number of this record within its source Google Cloud Storage file. Used for deduplication and lineage tracking
    back to the originating file.
- name: _GS_FILE_TIME
  description: The time partition component extracted from the source Google Cloud Storage file path, typically formatted as 'time=HH-MM-SS-mmm'.
    It indicates when the source file was generated.
- name: _LOADED_AT
  description: The timestamp (in nanoseconds since Unix epoch) at which the row was loaded into BigQuery from the source file. Used for auditing
    and incremental load tracking.
- name: a11y_theme
  description: A map of accessibility theme settings active in the browser, where each key is a theme identifier and the corresponding boolean
    value indicates whether that theme is enabled.
- name: aborts_content_sum
  description: The total number of content process abort events recorded for a client over the aggregation period. A null value indicates no data
    was collected.
- name: aborts_gmplugin_sum
  description: The total number of Gecko Media Plugin (GMP) process abort events recorded for a client over the aggregation period. A null value
    indicates no data was collected, which is expected for most clients.
- name: aborts_plugin_sum
  description: The total number of plugin process abort events recorded for a client over the aggregation period. A null value indicates no data
    was collected, reflecting the rarity of plugin aborts.
- name: account_enabled
  description: Indicates whether the user's account (e.g., a Firefox Account) is currently enabled. True means the account is active; false means
    it has been disabled.
- name: activated
  description: Indicates whether a feature, experiment, or service has been activated for the client. True means activation occurred; false means
    it has not.
- name: active_addon_name
  description: The human-readable display name of an active browser extension or add-on installed by the user. May be localized depending on the
    user's locale.
- name: active_addons
  description: A structured array of all active add-ons installed in the browser, including metadata such as addon ID, version, type, signing
    state, install date, and whether the add-on is system- or user-installed.
- name: active_addons_count_mean
  description: The mean number of active add-ons installed in the browser across the aggregation period. Reflects the average extension load for
    a client over time.
- name: active_clients
  description: The count of distinct active clients contributing to a given aggregation group. Used to measure the size of a user population segment.
- name: active_experiment_branch
  description: The branch of an active experiment the client is enrolled in (e.g., 'control' or 'treatment'). A null value indicates the client
    is not enrolled in any experiment.
- name: active_experiment_id
  description: The identifier of the active experiment the client is enrolled in. A null value indicates no experiment enrollment is present for
    this client.
- name: active_hours
  description: The number of hours a client was actively using the browser during the reporting period, measured in fractional hours. A value
    of 0.0 indicates the browser was open but no user interaction was detected.
- name: active_hours_per_user_ratio
  description: The ratio of total active hours to the number of users in an aggregation group, representing average active usage hours per user.
    Used to compare engagement intensity across cohorts or segments.
- name: active_hours_sum
  description: The sum of active usage hours for a client or cohort over the aggregation period, measured in fractional hours. A value of 0.0
    indicates the browser was open but no user interaction was recorded.
- name: active_metric_date
  description: Indicates whether the record's date qualifies as an active metric date for the client. True means the date meets the activity threshold;
    false means it does not.
- name: activity_date_week
  description: The Monday-aligned start date of the calendar week in which the user activity occurred. Used for weekly aggregations and trend
    analysis.
- name: activity_segment
  description: A categorical label describing the user's engagement level based on their activity patterns. Possible values include 'core_user',
    'regular_user', 'casual_user', 'infrequent_user', and 'other'.
- name: ad_clicks
  description: The total number of times a user clicked on an advertisement during the reporting period. A null value indicates no ad click data
    was recorded for that client or session.
- name: ad_clicks_count_all
  description: The aggregated count of all ad click events across all ad surfaces for a client during the reporting period. A null value indicates
    no ad clicks were observed.
- name: additive_terms
  description: The sum of all additive component terms from a time-series forecasting model (e.g., Prophet), representing the combined contribution
    of trend, seasonality, and other components to the forecast.
- name: additive_terms_lower
  description: The lower bound of the uncertainty interval for the sum of additive forecasting model terms. Used alongside additive_terms and
    additive_terms_upper to express forecast confidence intervals.
- name: additive_terms_upper
  description: The upper bound of the uncertainty interval for the sum of additive forecasting model terms. Used alongside additive_terms and
    additive_terms_lower to express forecast confidence intervals.
- name: addon_compatibility_check_enabled
  description: Indicates whether the browser's add-on compatibility check feature is enabled. True means compatibility checking is active; false
    means it has been disabled by the user or policy.
- name: addon_id
  description: The unique identifier string for a browser add-on or extension, typically in the format of an email address or UUID (e.g., 'formautofill@mozilla.org'
    or '{guid}'). Used to uniquely reference a specific add-on across datasets.
- name: adjust_ad_group
  description: The name of the ad group within an Adjust-tracked marketing campaign that attributed the client's install or event. A null value
    indicates no ad group attribution is available (e.g., organic installs).
- name: adjust_campaign
  description: The name of the Adjust-tracked marketing campaign attributed to the client's install or event. Common values include 'Organic'
    for unattributed installs and named campaign strings for paid channels.
- name: adjust_creative
  description: The name of the specific creative asset within an Adjust-tracked marketing campaign that was attributed to the client's install
    or event. A null value indicates no creative-level attribution is available.
- name: adjust_network
  description: The name of the advertising network or acquisition channel attributed to the client's install via Adjust. Common values include
    'Organic', 'Google Ads ACI', and other paid network names.
- name: agg_type
  description: The type of aggregation used to produce the metric values in this record. The only currently observed value is 'histogram', indicating
    histogram-based aggregation.
- name: aggregates
  description: A key-value array representing aggregated metric data, where each key is a bucket or category identifier and each value is the
    corresponding aggregated numeric measurement (e.g., histogram bucket counts).
- name: aggregates.key
  description: The bucket or category key within an aggregated metric structure, such as a histogram bucket index. Used to identify which segment
    of the aggregation a value belongs to.
- name: aggregates.value
  description: The numeric aggregated value associated with a specific key in the aggregates array, such as a histogram bucket count or normalized
    weight. A value of 0.0 is the most common, indicating empty buckets.
- name: app
  description: The name or identifier of the Mozilla application associated with the telemetry record (e.g., Firefox, Fenix). Used to distinguish
    data originating from different Mozilla products.
- name: app_build_id
  description: The unique build identifier for the application version, formatted as a timestamp string (e.g., '20151029151421'). Used to pinpoint
    the exact build from which telemetry was submitted.
- name: app_channel
  description: The release channel of the application from which telemetry was submitted. Possible values include 'release', 'beta', and 'nightly',
    reflecting the product's update and stability tier.
- name: app_display_version
  description: The human-readable version string of the application as displayed to users (e.g., '151.0.1' or '115.36.0esr'). Includes extended
    support release (ESR) suffixes where applicable.
- name: app_name
  description: The internal identifier for the Mozilla application that generated the telemetry record (e.g., 'firefox_desktop', 'fenix', 'firefox_ios').
    Each value corresponds to a distinct Mozilla product or platform variant.
- name: app_version
  description: The full version string of the application at the time of data collection (e.g., '151.0.2'). This includes major, minor, and patch components
    as a dot-separated string.
- name: app_version_is_major_release
  description: Indicates whether the application version corresponds to a major release (e.g., 151.0). True means the version is a major release; false
    means it is a minor or patch update.
- name: app_version_major
  description: The major version number component of the application version (e.g., 151 for version 151.0.2). This is used to group records by major
    release cycle.
- name: app_version_minor
  description: The minor version number component of the application version (e.g., 0 for version 151.0.2). A value of 0 is by far the most common,
    representing the initial release within a major version.
- name: app_version_patch
  description: The patch version number component of the application version (e.g., 2 for version 151.0.2). This field may be null when no patch component
    is present in the version string.
- name: app_version_patch_revision
  description: The patch revision sub-component of the application version, representing incremental updates within a patch release. This field is
    null when no patch revision is applicable.
- name: apple_model_id
  description: The Apple hardware model identifier for macOS or iOS devices (e.g., 'MacBookAir10,1', 'Mac16,12'). This field is null for non-Apple
    hardware and is sparsely populated.
- name: application
  description: The human-readable name of the Mozilla application (e.g., 'Firefox', 'Focus', 'FirefoxForFireTV'). This distinguishes between different
    Mozilla browser products within the same dataset.
- name: arch
  description: The CPU architecture of the device on which the application is running (e.g., 'arm64-v8a', 'armeabi-v7a', 'x86_64'). This is typically
    populated for mobile platforms using Android ABI identifiers.
- name: architecture
  description: The processor architecture of the client device (e.g., 'x86-64', 'aarch64', 'arm'). This field reflects the architecture of the host
    system as reported by the application.
- name: asofdate
  description: The date for which the record's metrics or state are calculated, formatted as a YYYY-MM-DD string. This field represents the reference
    date of the snapshot rather than the ingestion or submission date.
- name: attributed
  description: Indicates whether the client installation has attribution data associated with it. True means attribution information is present; false
    means the installation has no known attribution source.
- name: attribution.campaign
  description: The marketing campaign name or identifier from the installation attribution parameters, URL-encoded. This field is null when attribution
    data is not available.
- name: attribution.content
  description: The content parameter from the installation attribution data, typically identifying the specific creative or link element that led to
    the download, URL-encoded. This field is null when attribution data is not available.
- name: attribution.dlsource
  description: The download source identifier from attribution data, indicating the platform or channel through which the installer was obtained (e.g.,
    'mozorg', 'mozillaci', 'fxdotcom'). This field is null when attribution data is not available.
- name: attribution.dltoken
  description: A unique token (UUID) associated with the specific download event, used to link an installation back to a particular download attribution
    record. This field is null when attribution data is not available.
- name: attribution.experiment
  description: The experiment identifier from the installation attribution data, indicating which A/B test or download experiment the user was part
    of when they downloaded the application. This field is null when no experiment attribution is present.
- name: attribution.medium
  description: The marketing medium from the installation attribution data, describing the channel type that drove the download (e.g., 'referral',
    'paidsearch', 'email'), URL-encoded. This field is null when attribution data is not available.
- name: attribution.source
  description: The traffic source from the installation attribution data, typically identifying the referring website or platform (e.g., 'www.google.com',
    'www.bing.com'), URL-encoded. This field is null when attribution data is not available.
- name: attribution.ua
  description: The user agent type of the browser used to download the application, as captured in attribution data (e.g., 'chrome', 'edge', 'firefox',
    'ie'). This field is null when attribution data is not available.
- name: attribution.variation
  description: The experiment variation or branch from the installation attribution data, identifying which variant of a download experiment the user
    encountered (e.g., 'control', 'treatment'). This field is null when no variation attribution is present.
- name: attribution_campaign
  description: The marketing campaign name or identifier from the client's installation attribution, URL-encoded. This is a scalar counterpart to the
    nested attribution.campaign field and is null when attribution data is absent.
- name: attribution_content
  description: The content parameter from the client's installation attribution data, identifying the specific creative or download link element, URL-encoded.
    This field is null when attribution data is absent.
- name: attribution_dlsource
  description: The download source from the client's installation attribution, indicating the platform or channel through which the installer was obtained
    (e.g., 'mozorg', 'mozillaci', 'fxdotcom'). This field is null when attribution data is absent.
- name: attribution_dltoken
  description: A unique UUID token associated with the specific download event for this client, used to link an installation to a download attribution
    record. This field is null when attribution data is absent.
- name: attribution_experiment
  description: The experiment identifier from the client's installation attribution data, indicating which download experiment the user was part of
    at the time of installation. This field is null when no experiment attribution is present.
- name: attribution_medium
  description: The marketing channel medium from the client's installation attribution (e.g., 'referral', 'paidsearch', 'firefox-desktop'), URL-encoded.
    This field is null when attribution data is absent.
- name: attribution_msstoresignedin
  description: Indicates whether the user was signed into the Microsoft Store at the time of installation, relevant for installs originating from the
    Microsoft Store. This field is currently always null and is reserved for future population.
- name: attribution_source
  description: The traffic source from the client's installation attribution, identifying the referring website or platform that led to the download
    (e.g., 'www.google.com', 'www.bing.com'), URL-encoded. This field is null when attribution data is absent.
- name: attribution_ua
  description: The user agent type of the browser used to download the application, as captured in the client's scalar attribution data (e.g., 'chrome',
    'edge', 'firefox'). This field is null when attribution data is absent.
- name: attribution_variation
  description: The experiment variation or branch from the client's installation attribution data, identifying which variant of a download experiment
    was encountered (e.g., 'control', 'treatment'). This field is null when no variation attribution is present.
- name: average_profile_age
  description: The average age of the Firefox profile in days, computed across a cohort or aggregated unit. Higher values indicate longer-lived profiles.
- name: avg_hours_usage_daily
  description: The average number of hours per day the application was actively used. This metric is used to characterize typical daily engagement
    with the browser.
- name: blocklist_enabled
  description: Indicates whether the browser's blocklist feature is enabled on the client. True means the blocklist is active; false means it has been
    disabled.
- name: bookmark_migrations_quantity_all
  description: The total number of bookmarks migrated from all source browsers combined during a browser migration event. This field is null when no
    migration has taken place.
- name: bookmark_migrations_quantity_chrome
  description: The number of bookmarks migrated specifically from Google Chrome during a browser migration event. This field is null when no Chrome
    migration has occurred.
- name: bookmark_migrations_quantity_edge
  description: The number of bookmarks migrated specifically from Microsoft Edge during a browser migration event. This field is null when no Edge
    migration has occurred.
- name: bookmark_migrations_quantity_safari
  description: The number of bookmarks migrated specifically from Apple Safari during a browser migration event. This field is null when no Safari
    migration has occurred.
- name: bookmarks_added_per_dau
  description: The ratio of bookmarks added to the number of daily active users (DAU) for a given aggregation period. This metric measures the rate
    of bookmark creation activity normalized by active user count.
- name: bookmarks_opened_per_dau
  description: The ratio of bookmark open events to the number of daily active users (DAU) for a given aggregation period. This metric measures how
    frequently users engage with existing bookmarks, normalized by active user count.
- name: branch
  description: The experiment branch or rollout variant the client is enrolled in (e.g., 'control', 'treatment-a', 'rollout'). This field identifies
    which experimental condition the client was assigned to.
- name: browser_arch
  description: The CPU architecture of the browser process (e.g., x86-64, aarch64). This field describes the compiled architecture of the browser binary
    being run on the client device.
- name: browser_backup_archive_enabled
  description: Indicates whether the browser backup archive feature is enabled for the client. True means backup archiving is active; false means it
    is explicitly disabled; null means the feature state was not reported.
- name: browser_backup_scheduler_enabled
  description: Indicates whether the browser's automatic backup scheduler is enabled for the client. True means the scheduler is active; false means
    it is disabled; null means the feature state was not reported.
- name: browser_name
  description: The human-readable name of the browser as reported by the client (e.g., 'Firefox Desktop'). This field identifies the browser product
    in a display-friendly format.
- name: browser_version
  description: The full version string of the browser (e.g., '151.0.2'), including major, minor, and patch components. This field represents the precise
    browser release installed on the client.
- name: browser_version_info.is_major_release
  description: Indicates whether the browser version is a major release. True means the version represents a major release (e.g., 151.0); false means
    it is a minor or patch update.
- name: browser_version_info.major_version
  description: The major version number component extracted from the browser version string (e.g., 151 for version 151.0.2). This is used to group
    clients by major browser release.
- name: browser_version_info.minor_version
  description: The minor version number component extracted from the browser version string (e.g., 0 for version 151.0). A value of 0 is the most common,
    representing the base release within a major version.
- name: browser_version_info.patch_revision
  description: The patch revision number component of the browser version (e.g., the '2' in a version like 115.0.2). A null value indicates the patch
    revision is not applicable or not recorded for that release.
- name: browser_version_info.version
  description: The full version string of the Firefox browser (e.g., '115.0a1' or '151.0.2'), including major, minor, patch, and pre-release identifiers
    where applicable.
- name: bug_1501329_affected
  description: Indicates whether the client was affected by the regression tracked in Mozilla bug 1501329. True means the client was affected; false
    means it was not; null indicates the check was not applicable or not performed.
- name: build_architecture
  description: The CPU architecture for which the Firefox build was compiled, such as 'x86-64', 'aarch64', 'x86', or 'arm'. This reflects the binary
    target architecture rather than the host machine's architecture.
- name: build_channel
  description: The release channel on which the Firefox build was distributed, such as 'release', 'beta', 'nightly', or 'aurora'. Unofficial or third-party
    channel names may also appear for non-standard builds.
- name: build_id
  description: A timestamp-based string identifier for the specific Firefox build, formatted as YYYYMMDDHHmmSS (e.g., '20260514164700'). This uniquely
    identifies when a particular build was compiled.
- name: build_version
  description: The version string associated with a specific Firefox build. This corresponds to the product version at the time the build was produced.
- name: campaign
  description: The marketing campaign name or identifier associated with a user acquisition or engagement event, typically derived from UTM campaign
    parameters. A null value indicates no campaign attribution was recorded.
- name: campaign_id
  description: A unique identifier for the specific advertising or marketing campaign that drove a user acquisition event, often including the ad platform's
    internal campaign ID. A null value indicates no campaign ID was attributed.
- name: category
  description: A categorical label used to classify an event or record into a functional area or feature group (e.g., 'devtools.main', 'pwmgr', 'doh').
    A null value indicates the category was not specified or is not applicable.
- name: cdou
  description: The cumulative days of use metric, representing the total number of days a client has actively used the browser up to the point of measurement.
    Higher values indicate longer-tenured or more active users.
- name: channel
  description: The Firefox release channel associated with the client or event, such as 'release', 'beta', 'nightly', 'esr', or 'aurora'. This field
    may contain raw or normalized channel values depending on the pipeline.
- name: channel_raw
  description: The raw, unnormalized marketing or traffic channel through which a user arrived, such as 'Organic Search', 'Paid Search', 'Referral',
    or 'Direct'. A null value indicates the channel could not be determined.
- name: city
  description: The city associated with the client's IP address or reported location at the time of the event. A null value indicates the city could
    not be determined through geolocation.
- name: click_count
  description: The total number of click interactions recorded for a given session, surface, or feature within the specified aggregation period. A
    value of zero indicates no clicks were recorded.
- name: client_agg_type
  description: Describes the aggregation method applied to client-level metric values, such as 'summed_histogram', 'count', 'avg', 'sum', 'min', or
    'max'. An empty string indicates the aggregation type was not specified.
- name: client_clock_skew_mean
  description: The mean clock skew (in hours) observed for a client, representing the average difference between the client's local clock and the server's
    reference time. Negative values indicate the client clock is behind the server.
- name: client_count
  description: The number of distinct clients contributing to an aggregated row or metric. A value of 1 indicates data for a single client, while higher
    values represent grouped or rolled-up aggregations.
- name: client_id
  description: A UUID that uniquely identifies a Firefox client installation. This identifier persists across sessions and is used to track longitudinal
    behavior for a given browser profile.
- name: client_submission_latency_mean
  description: The mean latency (in seconds) between when telemetry data was generated on the client and when it was received by the ingestion pipeline.
    A value of zero indicates near-instantaneous submission.
- name: clients
  description: The total count of distinct clients included in a given aggregation or summary row. This is typically used in rollup or reporting tables
    to indicate population size.
- name: cohort_date
  description: The specific calendar date on which a cohort of clients is defined, typically corresponding to the date of first activity, installation,
    or enrollment. Used to group clients by their entry point for retention and engagement analysis.
- name: cohort_date_week
  description: The Monday-aligned start date of the week in which a client's cohort date falls. Used for weekly cohort-based analysis of retention
    and engagement trends.
- name: content
  description: The UTM content parameter or creative identifier associated with a marketing touchpoint, used to distinguish between different ad creatives
    or link placements within the same campaign. A null value indicates no content attribution was recorded.
- name: contextual_services_quicksuggest_block_dynamic_wikipedia_sum
  description: An array of key-value pairs aggregating the total number of times a user blocked a dynamic Wikipedia suggestion in Firefox's Quick Suggest
    feature, keyed by a relevant dimension such as match type or source. Each value represents the summed block count.
- name: contextual_services_quicksuggest_block_nonsponsored_bestmatch_sum
  description: An array of key-value pairs aggregating the total number of times a user blocked a non-sponsored best-match suggestion in Firefox's
    Quick Suggest feature. Each value represents the summed block count for the corresponding dimension key.
- name: contextual_services_quicksuggest_block_nonsponsored_sum
  description: An array of key-value pairs aggregating the total number of times a user blocked a non-sponsored Quick Suggest result in Firefox's address
    bar. Each value represents the summed block count for the corresponding dimension key.
- name: contextual_services_quicksuggest_block_sponsored_bestmatch_sum
  description: An array of key-value pairs aggregating the total number of times a user blocked a sponsored best-match suggestion in Firefox's Quick
    Suggest feature. Each value represents the summed block count for the corresponding dimension key.
- name: contextual_services_quicksuggest_block_sponsored_sum
  description: An array of key-value pairs aggregating the total number of times a user blocked a sponsored Quick Suggest result in Firefox's address
    bar. Each value represents the summed block count for the corresponding dimension key.
- name: contextual_services_quicksuggest_block_weather_sum
  description: An array of key-value pairs aggregating the total number of times a user blocked a weather-related Quick Suggest result in Firefox's
    address bar. Each value represents the summed block count for the corresponding dimension key.
- name: contextual_services_quicksuggest_click_dynamic_wikipedia_sum
  description: An array of key-value pairs aggregating the total number of clicks on dynamic Wikipedia suggestions surfaced by Firefox's Quick Suggest
    feature. Each value represents the summed click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_click_nonsponsored_bestmatch_sum
  description: An array of key-value pairs aggregating the total number of clicks on non-sponsored best-match suggestions in Firefox's Quick Suggest
    feature. Each value represents the summed click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_click_nonsponsored_sum
  description: An array of key-value pairs aggregating the total number of clicks on non-sponsored Quick Suggest results in Firefox's address bar.
    Each value represents the summed click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_click_sponsored_bestmatch_sum
  description: An array of key-value pairs aggregating the total number of clicks on sponsored best-match suggestions in Firefox's Quick Suggest feature.
    Each value represents the summed click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_click_sponsored_sum
  description: An array of key-value pairs aggregating the total number of clicks on sponsored Quick Suggest results in Firefox's address bar. Each
    value represents the summed click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_click_sum
  description: An array of key-value pairs aggregating the total number of clicks across all Quick Suggest result types in Firefox's address bar. Each
    value represents the summed click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_click_weather_sum
  description: An array of key-value pairs aggregating the total number of clicks on weather-related Quick Suggest results in Firefox's address bar.
    Each value represents the summed click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_help_dynamic_wikipedia_sum
  description: An array of key-value pairs aggregating the total number of times a user clicked the help link associated with a dynamic Wikipedia Quick
    Suggest result. Each value represents the summed help-click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_help_nonsponsored_bestmatch_sum
  description: An array of key-value pairs aggregating the total number of times a user clicked the help link on a non-sponsored best-match Quick Suggest
    result. Each value represents the summed help-click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_help_nonsponsored_sum
  description: An array of key-value pairs aggregating the total number of times a user clicked the help link associated with a non-sponsored Quick
    Suggest result. Each value represents the summed help-click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_help_sponsored_bestmatch_sum
  description: An array of key-value pairs aggregating the total number of times a user clicked the help link on a sponsored best-match Quick Suggest
    result. Each value represents the summed help-click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_help_sponsored_sum
  description: An array of key-value pairs aggregating the total number of times a user clicked the help link associated with a sponsored Quick Suggest
    result. Each value represents the summed help-click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_help_sum
  description: An array of key-value pairs aggregating the total number of times a user clicked a help link across all Quick Suggest result types in
    Firefox's address bar. Each value represents the summed help-click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_help_weather_sum
  description: An array of key-value pairs aggregating the total number of times a user clicked the help link associated with a weather-related Quick
    Suggest result. Each value represents the summed help-click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_impression_dynamic_wikipedia_sum
  description: An array of key-value pairs aggregating the total number of times a dynamic Wikipedia suggestion was shown to a user via Firefox's Quick
    Suggest feature. Each value represents the summed impression count for the corresponding dimension key.
- name: contextual_services_quicksuggest_impression_nonsponsored_bestmatch_sum
  description: An array of key-value pairs aggregating the total number of times a non-sponsored best-match Quick Suggest result was displayed to a
    user. Each value represents the summed impression count for the corresponding dimension key.
- name: contextual_services_quicksuggest_impression_nonsponsored_sum
  description: An array of key-value pairs aggregating the total number of impressions for non-sponsored Quick Suggest results shown in Firefox's address
    bar. Each value represents the summed impression count for the corresponding dimension key.
- name: contextual_services_quicksuggest_impression_sponsored_bestmatch_sum
  description: An array of key-value pairs aggregating the total number of times a sponsored best-match Quick Suggest result was displayed to a user.
    Each value represents the summed impression count for the corresponding dimension key.
- name: contextual_services_quicksuggest_impression_sponsored_sum
  description: An array of key-value pairs aggregating the total number of impressions for sponsored Quick Suggest results shown in Firefox's address
    bar. Each value represents the summed impression count for the corresponding dimension key.
- name: contextual_services_quicksuggest_impression_sum
  description: An array of key-value pairs aggregating the total number of impressions across all Quick Suggest result types shown in Firefox's address
    bar. Each value represents the summed impression count for the corresponding dimension key.
- name: contextual_services_quicksuggest_impression_weather_sum
  description: An array of key-value pairs aggregating the total number of weather-related Quick Suggest impressions served via Contextual Services,
    broken down by a string key dimension. Each entry records the impression count for that key over the aggregation period.
- name: contextual_services_topsites_click_sum
  description: An array of key-value pairs aggregating the total number of clicks on Top Sites tiles served via Contextual Services, broken down by
    a string key dimension. Each entry records the click count for that key over the aggregation period.
- name: contextual_services_topsites_impression_sum
  description: An array of key-value pairs aggregating the total number of impressions for Top Sites tiles served via Contextual Services, broken down
    by a string key dimension. Each entry records the impression count for that key over the aggregation period.
- name: corpus_item_id
  description: A unique UUID identifying a specific content item within the recommendation corpus (e.g., a Pocket article or sponsored tile). This
    ID can be used to join or look up metadata about the individual content piece.
- name: count
  description: A general-purpose integer count representing the number of occurrences or records associated with the row's dimensions. The specific
    event or entity being counted depends on the context of the table.
- name: country
  description: The ISO 3166-1 alpha-2 country code representing the country associated with the client or record (e.g., 'US' for United States, 'DE'
    for Germany).
- name: country_code
  description: The ISO 3166-1 alpha-2 country code identifying the country of the client or record. Similar to the country field, this value is derived
    from client metadata or geo-IP lookup.
- name: country_name
  description: The full human-readable name of the country associated with the client or record (e.g., 'United States', 'India'). This complements
    country code fields with a display-friendly label.
- name: cpu_cores
  description: The number of logical CPU cores available on the client device. This reflects hardware parallelism capability and is used for device
    characterization.
- name: cpu_count
  description: The total number of logical processors (CPUs) reported by the client device. This may include hyperthreaded cores and is used alongside
    cpu_cores to characterize device hardware.
- name: cpu_family
  description: The numeric CPU family identifier as reported by the processor's CPUID instruction. This value categorizes the processor into a broad
    architectural family (e.g., 6 for Intel Core).
- name: cpu_l2_cache_kb
  description: The size of the CPU's L2 cache in kilobytes as reported by the client device. A value of 0 may indicate the cache size could not be
    determined.
- name: cpu_l3_cache_kb
  description: The size of the CPU's L3 cache in kilobytes as reported by the client device. A null or 0 value may indicate the processor has no L3
    cache or the size could not be determined.
- name: cpu_model
  description: The numeric CPU model identifier as reported by the processor's CPUID instruction. Together with cpu_family and cpu_stepping, this uniquely
    identifies the processor microarchitecture.
- name: cpu_speed
  description: The CPU clock speed as a string value reported by the client device. This field captures the processor's rated or reported speed in
    a free-form text format.
- name: cpu_speed_mhz
  description: The CPU clock speed in megahertz (MHz) as reported by the client device. A value of 0 may indicate the speed could not be determined.
- name: cpu_stepping
  description: The numeric CPU stepping identifier as reported by the processor's CPUID instruction. Stepping identifies a specific revision within
    a CPU model and is used together with family and model for precise processor identification.
- name: cpu_vendor
  description: The CPU vendor identifier string as reported by the processor's CPUID instruction (e.g., 'GenuineIntel', 'AuthenticAMD'). An empty or
    null value indicates the vendor could not be determined.
- name: crash_submit_attempt_content_sum
  description: The total number of crash report submission attempts for content process crashes during the aggregation period. A null value indicates
    no content process crash submissions were attempted.
- name: crash_submit_attempt_main_sum
  description: The total number of crash report submission attempts for main process crashes during the aggregation period. A null value indicates
    no main process crash submissions were attempted.
- name: crash_submit_attempt_plugin_sum
  description: The total number of crash report submission attempts for plugin process crashes during the aggregation period. This field is typically
    null, indicating plugin crash submissions are no longer tracked or observed.
- name: crash_submit_success_content_sum
  description: The total number of successfully submitted crash reports for content process crashes during the aggregation period. A value of 0 means
    submissions were attempted but none succeeded; null means no attempts occurred.
- name: crash_submit_success_main_sum
  description: The total number of successfully submitted crash reports for main process crashes during the aggregation period. A value of 0 means
    submissions were attempted but none succeeded; null means no attempts occurred.
- name: crash_submit_success_plugin_sum
  description: The total number of successfully submitted crash reports for plugin process crashes during the aggregation period. This field is typically
    null, indicating plugin crash submissions are no longer tracked or observed.
- name: crash_time
  description: A string representation of the timestamp at which a crash occurred. The format may vary and captures the wall-clock time of the crash
    event as reported by the client.
- name: crashes_detected_content_sum
  description: The total number of content process crashes detected on the client during the aggregation period. A null value indicates no content
    process crashes were detected.
- name: crashes_detected_gmplugin_sum
  description: The total number of Gecko Media Plugin (GMP) process crashes detected on the client during the aggregation period. A null value indicates
    no GMP crashes were detected.
- name: crashes_detected_plugin_sum
  description: The total number of plugin process crashes detected on the client during the aggregation period. A null value indicates no plugin crashes
    were detected.
- name: crashing_users
  description: The number of unique users who experienced at least one crash during the aggregation period. This is a floating-point value to support
    weighted or fractional user counting methodologies.
- name: cumulative_new_profiles
  description: The running cumulative total of new Firefox profiles created up to and including the current period. A value of 0 indicates no new profiles
    were created in the relevant segment; null indicates the metric is unavailable.
- name: daily_users
  description: The count of unique users active on a given day, used to measure daily engagement. A value of 0 indicates no users were active for that
    dimension combination on that day.
- name: date
  description: A string representation of the calendar date associated with the record, typically in YYYY-MM-DD format. This field is used for time-series
    partitioning and filtering.
- name: date_from
  description: The inclusive start date of the time window covered by the record. Used together with date_to to define a date range for the aggregation
    or analysis.
- name: date_to
  description: The inclusive end date of the time window covered by the record. Used together with date_from to define a date range for the aggregation
    or analysis.
- name: dau
  description: Daily Active Users (DAU); the count of unique users considered active on a specific day according to the applicable activity definition.
    A value of 0 indicates no active users for that dimension combination.
- name: days_active_bits
  description: A 28-bit integer bitmask where each bit represents one day in a rolling 28-day window, with a set bit indicating the client was active
    on that day. The most significant bit represents the most recent day.
- name: days_created_profile_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating a new Firefox profile was created on that day.
    Used to track the recency and frequency of new profile creation events.
- name: days_had_8_active_ticks_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating the client had at least 8 active ticks (approximately
    40 minutes of activity) on that day. Used to measure days of substantive usage.
- name: days_interacted_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating the client had at least one recorded user interaction
    (e.g., URI visit or active tick) on that day.
- name: days_logged_event_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating that at least one telemetry event was logged
    for the client on that day.
- name: days_opened_dev_tools_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating the client opened Firefox Developer Tools on
    that day. Used to identify developer-oriented usage patterns.
- name: days_seen_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating a telemetry ping was received from the client
    on that day. This is the broadest activity signal, indicating the client was 'seen' regardless of usage intensity.
- name: days_seen_in_experiment
  description: An array of structs recording, for each experiment the client is enrolled in, the experiment ID, branch assignment, and a bitmask of
    days the client was observed while enrolled. Used to track experiment exposure over time.
- name: days_since_first_seen
  description: The number of days elapsed between the date the client's profile was first seen (i.e., the profile creation or first-ping date) and
    the current record's date. A value of 0 indicates the client was first seen on the same day.
- name: days_since_seen
  description: The number of days since the client was last seen in telemetry data prior to the current record's date. A value of 0 indicates the client
    was seen on the current day.
- name: days_used_pictureinpicture_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating the client used the Picture-in-Picture video
    feature on that day. Used to measure adoption and frequency of this feature.
- name: days_viewed_protection_report_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating the client viewed the Firefox Privacy Protections
    report on that day. Used to track engagement with privacy-related UI.
- name: days_visited_10_uri_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating the client visited at least 10 URIs on that
    day. Used as a proxy for high-intensity browsing activity.
- name: days_visited_1_uri_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating the client visited at least 1 URI on that day.
    This is a broad indicator of any browsing activity occurring on a given day.
- name: days_visited_1_uri_normal_mode_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating the client visited at least 1 URI in a normal
    (non-private) browsing window on that day. This excludes private browsing activity from the usage signal.
- name: days_visited_1_uri_private_mode_bits
  description: A bitfield representing which days in a rolling 28-day window the client visited at least 1 URI in private browsing mode. Each bit corresponds
    to one day, with 0 indicating no qualifying private-mode activity on that day.
- name: days_visited_5_uri_bits
  description: A bitfield representing which days in a rolling 28-day window the client visited at least 5 URIs in normal browsing mode. Each bit corresponds
    to one day, allowing reconstruction of the client's multi-URI active days over the window.
- name: db_version
  description: The timestamp-based version string identifying the release of the underlying database or data source in use. Values follow an ISO 8601
    UTC datetime format and indicate when the database snapshot was published.
- name: default_browser
  description: Indicates whether Firefox is set as the system default browser on the client device. True means Firefox is the default browser; false
    means it is not; null indicates the status could not be determined.
- name: default_percent
  description: The percentage of clients or sessions for which Firefox is set as the default browser within a given segment or cohort. Values range
    from 0.0 to 100.0.
- name: default_private_search_engine
  description: The identifier of the search engine configured as the default for private browsing mode on the client. Common values include partner-coded
    Google variants (e.g., 'google-b-d') and DuckDuckGo ('ddg').
- name: default_private_search_engine_data_load_path
  description: The load path indicating how the default private browsing search engine was installed or sourced (e.g., '[app]ddg' for a built-in app
    engine). This field is almost always null and only rarely populated.
- name: default_private_search_engine_data_name
  description: The human-readable display name of the search engine configured as the default for private browsing mode (e.g., 'DuckDuckGo', 'Google').
    This field is almost always null and only populated in rare cases.
- name: default_private_search_engine_data_origin
  description: The origin or provenance of the default private browsing search engine configuration, indicating how it was set or verified. This field
    is currently always null and reserved for future use.
- name: default_private_search_engine_data_submission_url
  description: The URL template used to submit search queries to the default private browsing search engine. This field is almost always null and only
    populated in rare cases where engine metadata is available.
- name: default_search
  description: The identifier of the default search engine in use on the client, often including partner or channel-specific codes (e.g., 'google-b-m').
    The value 'unknown' indicates the engine could not be identified.
- name: default_search_engine
  description: The identifier string for the client's configured default search engine, including partner and distribution-specific variants (e.g.,
    'google-b-d', 'baidu'). This is the engine used for searches initiated from the browser's address bar or search box.
- name: default_search_engine_data_load_path
  description: The load path describing how the default search engine was sourced or installed, distinguishing between built-in app engines (e.g.,
    '[app]google'), add-on-provided engines (e.g., '[addon]google@search.mozilla.org'), and other origins.
- name: default_search_engine_data_name
  description: The human-readable display name of the client's default search engine as reported by the browser (e.g., 'Google', 'DuckDuckGo', '百度').
    The name may be localized based on the user's language settings.
- name: default_search_engine_data_origin
  description: Indicates how the default search engine's configuration was established or verified, with values such as 'default' (browser default),
    'verified', 'unverified', or 'invalid'. A null value means the origin was not recorded.
- name: default_search_engine_data_submission_url
  description: The URL template used to submit search queries to the client's default search engine, typically including client and partner identification
    parameters in the query string.
- name: device
  description: A combined identifier representing the device manufacturer and model name (e.g., 'iPhone16,2', 'MediaTek-SMART TV'). This field captures
    the hardware platform on which the browser or application is running.
- name: device_model
  description: The model identifier of the client's device (e.g., 'iPhone14,5'), providing a more granular hardware identifier than the general device
    field. Null values indicate the device model could not be determined or is not applicable.
- name: devtools_toolbox_opened_count_sum
  description: The total number of times the browser developer tools toolbox was opened by the client across the aggregation period. A null value indicates
    no developer tools activity was recorded.
- name: dismiss_count
  description: The number of times a user dismissed a prompt, notification, or UI element during the observed period. A value of 0 indicates the element
    was never dismissed.
- name: display_version
  description: The human-readable version string of the Firefox application as shown to end users (e.g., '151.0.2', '115.31.0esr'). This may include
    ESR (Extended Support Release) suffixes where applicable.
- name: disqualification_count
  description: The number of times a client or record was disqualified from an experiment, study, or eligibility check during the observed period.
    A value of 0 indicates no disqualifications occurred.
- name: distribution_id
  description: An identifier for the Firefox distribution or build variant the client is using (e.g., 'default', 'mozilla-MSIX', 'canonical-002').
    This distinguishes Mozilla's standard builds from partner or OS-specific distributions.
- name: distribution_model
  description: A categorical label describing the channel through which the Firefox distribution was delivered to the user (e.g., 'OS pre-installed',
    'secondary store', 'partner website', 'non-distribution').
- name: distribution_version
  description: The version string of the specific Firefox distribution package (e.g., '1.0', '2023.6'), which may differ from the Firefox application
    version. Null indicates no distribution version was recorded.
- name: distributor
  description: The name of the organization or party responsible for distributing this Firefox build to the end user (e.g., 'canonical', 'mozillaonline',
    'mint'). Null indicates the browser was obtained directly from Mozilla or via an untracked channel.
- name: distributor_channel
  description: The specific channel used by the distributor to deliver the Firefox build (e.g., 'ubuntu', 'mainWinStub'). Null or empty values indicate
    the channel was not recorded or is not applicable.
- name: doc_type
  description: The type of telemetry document or ping submitted by the client (e.g., 'main', 'crash', 'event'). This field identifies the schema and
    category of the telemetry payload.
- name: document_id
  description: A globally unique UUID assigned to each telemetry document or ping submission. This identifier is used to deduplicate records and trace
    individual submissions through the data pipeline.
- name: dom_parentprocess_private_window_used
  description: Indicates whether a private browsing window was used in the browser's parent process during the session. True means at least one private
    window was opened; false means no private window activity was detected.
- name: domains_per_user
  description: The average number of distinct domains visited per user within the aggregation period. A null value indicates no browsing activity was
    recorded or the metric could not be computed.
- name: downloads
  description: The total number of file downloads initiated by the client during the observed period. A value of 0 indicates no downloads were recorded.
- name: ds
  description: The UTC timestamp representing the date partition or reporting date for the record, truncated to midnight. This field is used to identify
    the time window to which the aggregated or snapshot data belongs.
- name: durations
  description: The total active session duration recorded for the client during the observed period, typically measured in seconds or minutes. A value
    of 0 indicates no measurable active time was recorded.
- name: e10s_cohort
  description: The cohort identifier assigned to the client as part of the Electrolysis (e10s) multi-process Firefox experiment. This field is no longer
    populated and is always null in current data.
- name: e10s_enabled
  description: Indicates whether the Electrolysis (e10s) multi-process architecture was enabled in the browser. True means e10s was active; false means
    the browser was running in single-process mode.
- name: endpoint
  description: The telemetry submission endpoint to which the ping was sent, identifying the ingestion target for the data. This field categorizes
    records by their intended data pipeline destination.
- name: engine_data_load_path
  description: The load path indicating the source from which a search engine definition was loaded, such as a built-in app bundle ('[app]google')
    or a browser extension ('[addon]google@search.mozilla.org').
- name: engine_data_name
  description: The human-readable display name of a search engine as reported in telemetry (e.g., 'Google', 'DuckDuckGo', '百度'). The name may be localized
    and can vary across clients.
- name: engine_data_origin
  description: Indicates how the search engine's configuration was established or verified, with values such as 'default', 'verified', 'unverified',
    or 'invalid'. A null value means the origin was not recorded for that engine.
- name: engine_data_submission_url
  description: The URL template used to submit search queries to a specific search engine, often containing client identification or partner parameters.
    This is used to associate search events with the correct engine endpoint.
- name: enroll_count
  description: The total number of times a client was enrolled in a Nimbus experiment or feature rollout during the observed period. A value of 0 indicates
    the client was not enrolled in any experiments.
- name: enroll_failed_count
  description: The total number of times an experiment or feature rollout enrollment attempt failed for the client during the observed period. A value
    of 0 indicates no enrollment failures occurred.
- name: env_build_arch
  description: The CPU architecture of the Firefox build running on the client (e.g., 'x86-64', 'aarch64', 'x86'). This reflects the compiled target
    architecture of the browser binary.
- name: env_build_id
  description: The unique build identifier for the Firefox application, formatted as a timestamp string (e.g., '20260520211922'). This pinpoints the
    exact build of Firefox the client is running.
- name: env_build_platform_version
  description: The version of the Gecko platform (XULRunner/Firefox platform) on which the browser is built (e.g., '151.0.1'). This may differ from
    the application-level display version for ESR or specialized builds.
- name: env_build_version
  description: The Firefox application build version string as recorded in the environment (e.g., '151.0.1', '115.36.0'). This identifies the specific
    Firefox release the client was running at the time of the ping.
- name: env_build_xpcom_abi
  description: The XPCOM Application Binary Interface (ABI) identifier for the Firefox build, combining the CPU architecture and compiler toolchain
    (e.g., 'x86_64-msvc', 'aarch64-gcc3'). This is used to identify binary compatibility for add-ons and components.
- name: environment
  description: The deployment or runtime environment context associated with the record (e.g., production, staging). This field is used to distinguish
    data collected from different operating environments.
- name: environment_settings_intl_accept_languages
  description: An ordered list of language tags reflecting the client's preferred languages as configured in the browser's internationalization settings
    (e.g., ['en-US', 'fr']). These correspond to the Accept-Language HTTP header values sent by the browser.
- name: environment_settings_intl_app_locales
  description: The list of locales currently active in the Firefox application, as reported by the internationalization (intl) settings environment.
    Reflects the ordered set of locales the app is using for UI display.
- name: environment_settings_intl_available_locales
  description: The list of all locales that are available for use in the Firefox application, as reported by the intl settings environment. These are
    the locales installed and selectable by the user.
- name: environment_settings_intl_regional_prefs_locales
  description: The list of locales derived from the user's regional preferences, as reported by the intl settings environment. These may influence
    formatting of dates, numbers, and other region-specific content.
- name: environment_settings_intl_requested_locales
  description: The list of locales explicitly requested by the user or application configuration, as reported by the intl settings environment. This
    reflects preference order before locale resolution is applied.
- name: environment_settings_intl_system_locales
  description: The list of locales configured at the operating system level, as reported by the intl settings environment. These represent the host
    OS language/region settings at the time of the ping.
- name: event
  description: A dot-separated string identifying the specific telemetry event that was recorded, combining the event object and method or other context.
    May be null when no discrete event is associated with the record.
- name: event_category
  description: The top-level category that groups related telemetry events, such as 'address', 'creditcard', or 'form_autocomplete'. Used to classify
    events by feature area or product domain.
- name: event_map_values
  description: A list of key-value pairs providing additional metadata or attributes associated with a telemetry event. Each entry contains a string
    key and a string value describing contextual details of the event.
- name: event_map_values.key
  description: The name of an additional event attribute within the event_map_values array, such as 'source', 'trigger', or 'networkID'. Identifies
    what aspect of the event the paired value describes.
- name: event_map_values.value
  description: The value associated with a specific event attribute key in the event_map_values array. Contains free-form string data describing the
    state or context of the attribute at the time the event was recorded.
- name: event_method
  description: The action or method that triggered the telemetry event, such as 'detected', 'submitted', or 'show'. Together with event_category and
    event_object, it fully characterizes what occurred.
- name: event_object
  description: The UI element, feature component, or data entity that was acted upon when the event was recorded, such as 'address_form' or 'cc_form_v2'.
    Provides the target context for the event method.
- name: event_process
  description: The Firefox process in which the telemetry event was generated, such as 'parent', 'content', or 'extension'. Identifies the process
    boundary where the event originated.
- name: event_properties
  description: A structured array of key-value property groups associated with a telemetry event, where each entry may itself contain an array of sub-values
    and an index. Provides rich, nested contextual attributes for complex event types.
- name: event_properties.index
  description: The positional index of an entry within the event_properties array, used to preserve ordering of property groups. Starts at 1 and increments
    for each property entry.
- name: event_properties.key
  description: The name of a property group within the event_properties array, such as 'event_value', 'session_id', or 'source'. Identifies which aspect
    of the event the associated values describe.
- name: event_string_value
  description: An optional free-form string value attached to a telemetry event, providing additional context such as an error code, numeric label,
    or descriptive identifier. High cardinality; may be null or the string 'null' when no value applies.
- name: event_timestamp
  description: The time offset in milliseconds from the start of the telemetry session or ping at which the event occurred. Used to establish the relative
    ordering and timing of events within a session.
- name: events
  description: A field representing serialized or aggregated event data associated with a telemetry ping. Typically used as a placeholder or summary
    container for event information.
- name: experiment
  description: The slug or identifier of a Nimbus or Normandy experiment the client was enrolled in at the time of the ping. Null when the client was
    not enrolled in any experiment.
- name: experiment_branch
  description: The branch of an experiment that the client was assigned to, such as 'control' or 'treatment'. Identifies which variant of the experiment
    the client experienced.
- name: experiment_id
  description: A unique string identifier for a specific experiment or study, such as a Normandy or Nimbus experiment slug. Used to join experiment
    metadata and filter data to a particular study.
- name: experiments
  description: An array of key-value pairs representing all experiments the client was enrolled in at the time of the ping, where each key is the experiment
    slug and the value contains branch and enrollment details.
- name: experiments.key
  description: The slug identifier of an experiment within the experiments array, corresponding to the Nimbus or Normandy experiment name. Used to
    identify which experiment a given enrollment record refers to.
- name: experiments.key_value
  description: A nested array of key-value pairs containing additional structured attributes for an experiment enrollment entry. Provides supplementary
    metadata associated with a specific experiment key.
- name: experiments.value
  description: The branch assignment string for a client's enrollment in an experiment within the experiments array, such as 'control', 'treatment-a',
    or 'rollout-branch'. Indicates which variant of the experiment the client received.
- name: experiments.value.branch
  description: The branch name assigned to the client within a specific experiment enrollment, such as 'control', 'treatment-a', or 'rollout-branch'.
    Identifies the experimental variant experienced by the client.
- name: experiments.value.enrollment_id
  description: A UUID that uniquely identifies a client's enrollment instance in a specific experiment. Null in the vast majority of cases; when present,
    can be used to track enrollment lifecycle events.
- name: experiments.value.extra.enrollment_id
  description: An additional enrollment UUID stored in the extra metadata of an experiment enrollment record, used to cross-reference enrollment events.
    Nearly always null; populated only for specific experiment types.
- name: experiments.value.extra.type
  description: The experiment framework type stored in the extra metadata of an enrollment record, indicating whether the experiment is a Nimbus rollout
    ('nimbus-rollout') or a standard Nimbus experiment ('nimbus-nimbus').
- name: experiments.value.type
  description: The framework and experiment type for a client's enrollment, such as 'nimbus-rollout', 'nimbus-nimbus', or 'normandy-prefrollout'. Distinguishes
    between different experiment delivery systems and study types.
- name: exposure_count
  description: The number of times a client was exposed to an experiment's treatment during a given period. A value of 0 indicates the client was enrolled
    but not yet exposed.
- name: extra_regressors_additive
  description: The additive contribution of additional external regressors to a forecasting model's predicted value. A value of 0.0 indicates no extra
    regressor contribution for that observation.
- name: extra_regressors_additive_lower
  description: The lower bound of the confidence interval for the additive extra regressors component in a forecasting model. A value of 0.0 indicates
    no lower-bound contribution from external regressors.
- name: extra_regressors_additive_upper
  description: The upper bound of the confidence interval for the additive extra regressors component in a forecasting model. A value of 0.0 indicates
    no upper-bound contribution from external regressors.
- name: fill_counts
  description: The count of form field fill events recorded within a given aggregation period. Represents the total number of times a form field was
    automatically populated.
- name: first_bucket
  description: The lower boundary value of the first bucket in a histogram distribution. Defines the minimum range of the histogram's initial bin.
- name: first_document_id
  description: A UUID identifying the first telemetry document submitted by a client within a given aggregation or session context. Can be used to
    deduplicate or anchor a sequence of related ping documents.
- name: first_paint_mean
  description: The mean time in milliseconds from browser start to first paint across observations in a given aggregation. Null when no first paint
    data was reported.
- name: first_seen_date
  description: The calendar date on which the client profile was first observed submitting telemetry. Used to determine client tenure and cohort membership.
- name: first_seen_year
  description: The calendar year in which the client profile was first observed submitting telemetry, derived from first_seen_date. Used for coarse
    cohort segmentation by year of acquisition.
- name: first_timestamp
  description: The UTC timestamp of the earliest event or ping recorded for a client or session within a given aggregation. Null when no timestamp
    could be determined.
- name: flash_usage
  description: The count of Flash plugin usage events recorded for a client during a given period. A value of 0 indicates the Flash plugin was not
    used.
- name: flash_version
  description: The version string of the Adobe Flash plugin installed on the client, such as '32.0.0.465'. Null when Flash is not installed or was
    not detected.
- name: follow_on_search_ad_clicks
  description: The number of times a user clicked on a search advertisement on a follow-on search results page during a given period. A value of 0
    indicates no follow-on ad clicks occurred.
- name: follow_on_search_ad_impressions
  description: The number of search advertisement impressions seen by a user on follow-on search results pages during a given period. A value of 0
    indicates no follow-on ad impressions occurred.
- name: forecast_date
  description: The date string (YYYY-MM-DD) for which a forecast value was generated or to which it applies. Used to align forecast rows with their
    corresponding calendar date.
- name: forecast_parameters
  description: A JSON-encoded string describing the configuration and hyperparameters used to generate a forecast, including model type, seasonality
    settings, and changepoint scales. Allows forecasts to be traced back to their specific model configuration.
- name: form_factor
  description: The device form factor of the client, such as 'desktop', 'phone', or 'tablet'. Null when the form factor could not be determined.
- name: funnel_date
  description: The date representing the point in the acquisition or activation funnel to which a record belongs. Used to align funnel metrics with
    a specific calendar date for cohort and conversion analysis.
- name: funnel_derived
  description: Indicates the acquisition or distribution funnel through which the Firefox installation originated. Values include 'mozorg windows funnel',
    'mozorg mac funnel', 'partner', and 'other'.
- name: fxa_configured
  description: Indicates whether the user has configured a Firefox Account (FxA) on this profile. True means an FxA account is linked; false means
    it is not; null indicates the field was not recorded.
- name: geo_country_code
  description: The ISO 3166-1 alpha-2 two-letter country code derived from the client's IP address at the time of the ping submission.
- name: geo_db_version
  description: The version timestamp of the GeoIP database used to resolve the client's geographic location, expressed as an ISO 8601 datetime string.
- name: geo_subdivision1
  description: The first-level administrative subdivision code (e.g., state, province, or region) of the client's inferred geographic location, derived
    from the IP address.
- name: geo_subdivision2
  description: The second-level administrative subdivision code (e.g., department, county, or district) of the client's inferred geographic location,
    derived from the IP address. Null when a second-level subdivision is not available or applicable.
- name: gfx_compositor
  description: The graphics compositor backend in use by the Firefox rendering pipeline (e.g., WebRender, OpenGL, Direct3D).
- name: gfx_features_advanced_layers_status
  description: The status of the Advanced Layers graphics feature on the client. Values such as 'available', 'disabled', 'unavailable', 'blocked',
    or 'broken' indicate whether the feature is active and the reason if it is not.
- name: gfx_features_d2d_status
  description: The status of the Direct2D (D2D) graphics feature on the client. Values indicate whether the feature is available, disabled, blocked,
    or unavailable, often including a reason code such as a bug reference or driver blocklist entry.
- name: gfx_features_d3d11_status
  description: The status of the Direct3D 11 (D3D11) graphics feature on the client. Values indicate whether the feature is available or explain why
    it is unavailable, blocked, or unsupported on the hardware or driver configuration.
- name: gfx_features_gpu_process_status
  description: The status of the GPU process feature in Firefox. Values such as 'available', 'unused', or 'unavailable' (with a reason code) indicate
    whether a separate GPU process is running and why it may be disabled or unsupported.
- name: graduate_count
  description: The number of experiments or rollouts from which the client has graduated (i.e., completed or aged out of) during the reporting period.
    A value of 0 indicates no graduations occurred.
- name: has_addon_ratio
  description: The ratio of active browsing sessions or profiles in which at least one add-on is installed, expressed as a floating-point value between
    0 and 1.
- name: has_flash
  description: Indicates whether the Adobe Flash plugin is installed and available in the browser. True means Flash is present; false means it is not.
- name: histogram
  description: A JSON-encoded representation of a normalized histogram, where keys are bucket indices and values are the proportional weights or counts
    for that bucket.
- name: histogram_aggregates
  description: An array of aggregated histogram records, each describing a specific metric collected across clients, including bucket boundaries, metric
    metadata, and the aggregated bucket counts.
- name: histogram_aggregates.agg_type
  description: The type of aggregation applied to the histogram data within the record. The value 'summed_histogram' indicates that bucket counts have
    been summed across all contributing clients.
- name: histogram_aggregates.first_bucket
  description: The lower bound value of the first bucket in the histogram's range, defining the start of the histogram's measurement scale.
- name: histogram_aggregates.key
  description: An optional sub-key used to further categorize keyed histograms (e.g., a DNS resolver hostname or network label). An empty string indicates
    the histogram is not keyed.
- name: histogram_aggregates.last_bucket
  description: The upper bound value of the last bucket in the histogram's range, defining the end of the histogram's measurement scale.
- name: histogram_aggregates.latest_version
  description: The most recent Firefox major version number observed among clients contributing to this histogram aggregate record.
- name: histogram_aggregates.metric
  description: The name of the Telemetry histogram metric being aggregated, corresponding to a specific measured behavior or performance characteristic
    in Firefox.
- name: histogram_aggregates.metric_type
  description: The type of histogram used to collect the metric, such as 'histogram-exponential', 'histogram-linear', 'histogram-boolean', 'histogram-enumerated',
    'histogram-categorical', or 'histogram-count', which determines how bucket boundaries are distributed.
- name: histogram_aggregates.num_buckets
  description: The total number of buckets in the histogram, defining the resolution or granularity of the measurement distribution.
- name: histogram_aggregates.process
  description: The Firefox process type from which the histogram data was collected, such as 'parent' (main process), 'content' (tab/renderer process),
    or 'gpu' (GPU process).
- name: histogram_parent_devtools_aboutdebugging_opened_count_sum
  description: The total number of times the About Debugging DevTools panel was opened in the parent process during the reporting period. Null indicates
    the panel was never opened.
- name: histogram_parent_devtools_animationinspector_opened_count_sum
  description: The total number of times the Animation Inspector DevTools panel was opened in the parent process during the reporting period. Null
    indicates the panel was never opened.
- name: histogram_parent_devtools_browserconsole_opened_count_sum
  description: The total number of times the Browser Console DevTools panel was opened in the parent process during the reporting period. Null indicates
    the panel was never opened.
- name: histogram_parent_devtools_canvasdebugger_opened_count_sum
  description: The total number of times the Canvas Debugger DevTools panel was opened in the parent process during the reporting period. Null indicates
    the panel was never opened.
- name: histogram_parent_devtools_computedview_opened_count_sum
  description: The total number of times the Computed View (CSS computed styles) DevTools panel was opened in the parent process during the reporting
    period. Null indicates the panel was never opened.
- name: histogram_parent_devtools_custom_opened_count_sum
  description: The total number of times a custom DevTools panel was opened in the parent process during the reporting period. Null indicates no custom
    panels were opened.
- name: histogram_parent_devtools_developertoolbar_opened_count_sum
  description: The total number of times the Developer Toolbar was opened in the parent process during the reporting period. Null indicates it was
    never opened.
- name: histogram_parent_devtools_dom_opened_count_sum
  description: The total number of times the DOM DevTools panel was opened in the parent process during the reporting period. Null indicates the panel
    was never opened.
- name: histogram_parent_devtools_eyedropper_opened_count_sum
  description: The total number of times the Eyedropper color-picking tool was opened via DevTools in the parent process during the reporting period.
    Null indicates the tool was never opened.
- name: histogram_parent_devtools_fontinspector_opened_count_sum
  description: The total number of times the Font Inspector DevTools panel was opened in the parent process during the reporting period. Null indicates
    the panel was never opened.
- name: histogram_parent_devtools_inspector_opened_count_sum
  description: The total number of times the HTML/CSS Inspector DevTools panel was opened in the parent process during the reporting period. Null indicates
    the panel was never opened.
- name: histogram_parent_devtools_jsbrowserdebugger_opened_count_sum
  description: The total number of times the JavaScript Browser Debugger DevTools panel was opened in the parent process during the reporting period.
    Null indicates the panel was never opened.
- name: histogram_parent_devtools_jsdebugger_opened_count_sum
  description: The total number of times the JavaScript Debugger DevTools panel was opened in the parent process during the reporting period. Null
    indicates the panel was never opened.
- name: histogram_parent_devtools_jsprofiler_opened_count_sum
  description: The total number of times the JavaScript Profiler DevTools panel was opened in the parent process during the reporting period. Null
    indicates the panel was never opened.
- name: histogram_parent_devtools_layoutview_opened_count_sum
  description: The total number of times the Layout View (box model/grid/flexbox) DevTools panel was opened in the parent process during the reporting
    period. Null indicates the panel was never opened.
- name: histogram_parent_devtools_memory_opened_count_sum
  description: The total number of times the Memory DevTools panel was opened in the parent process during the reporting period. Null indicates the
    panel was never opened.
- name: histogram_parent_devtools_menu_eyedropper_opened_count_sum
  description: The total number of times the Eyedropper tool was opened via the DevTools menu in the parent process during the reporting period. Null
    indicates it was never opened through this entry point.
- name: histogram_parent_devtools_netmonitor_opened_count_sum
  description: The total number of times the Network Monitor DevTools panel was opened in the parent process during the reporting period. Null indicates
    the panel was never opened.
- name: histogram_parent_devtools_options_opened_count_sum
  description: The total number of times the DevTools Options/Settings panel was opened in the parent process during the reporting period. Null indicates
    the panel was never opened.
- name: histogram_parent_devtools_paintflashing_opened_count_sum
  description: The total number of times the Paint Flashing DevTools tool was opened in the parent process during the reporting period. Null indicates
    the tool was never opened.
- name: histogram_parent_devtools_picker_eyedropper_opened_count_sum
  description: The total number of times the Eyedropper tool was opened via the color picker in DevTools in the parent process during the reporting
    period. Null indicates it was never opened through this entry point.
- name: histogram_parent_devtools_responsive_opened_count_sum
  description: The total number of times the Responsive Design Mode DevTools panel was opened in the parent process during the reporting period. Null
    indicates the panel was never opened.
- name: histogram_parent_devtools_ruleview_opened_count_sum
  description: The total number of times the CSS Rule View DevTools panel was opened in the parent process during the reporting period. Null indicates
    the panel was never opened.
- name: histogram_parent_devtools_scratchpad_opened_count_sum
  description: The total number of times the Scratchpad DevTools panel was opened in the parent process during the reporting period. Null indicates
    the panel was never opened.
- name: histogram_parent_devtools_scratchpad_window_opened_count_sum
  description: The total number of times the Scratchpad window was opened via DevTools in the parent process during the reporting period. Null indicates
    the window was never opened.
- name: histogram_parent_devtools_shadereditor_opened_count_sum
  description: The total number of times the DevTools Shader Editor panel was opened in the parent process, aggregated as a sum of histogram values.
    A null value indicates no recorded opens for the reporting period.
- name: histogram_parent_devtools_storage_opened_count_sum
  description: The total number of times the DevTools Storage Inspector panel was opened in the parent process, aggregated as a sum of histogram values.
    Higher values indicate more frequent use of the Storage Inspector tool.
- name: histogram_parent_devtools_styleeditor_opened_count_sum
  description: The total number of times the DevTools Style Editor panel was opened in the parent process, aggregated as a sum of histogram values.
    A null value indicates no recorded opens for the reporting period.
- name: histogram_parent_devtools_webaudioeditor_opened_count_sum
  description: The total number of times the DevTools Web Audio Editor panel was opened in the parent process, aggregated as a sum of histogram values.
    A null value indicates no recorded opens for the reporting period.
- name: histogram_parent_devtools_webconsole_opened_count_sum
  description: The total number of times the DevTools Web Console panel was opened in the parent process, aggregated as a sum of histogram values.
    Higher values reflect more frequent developer console usage within a session.
- name: histogram_parent_devtools_webide_opened_count_sum
  description: The total number of times the DevTools WebIDE panel was opened in the parent process, aggregated as a sum of histogram values. A null
    value indicates no recorded opens for the reporting period.
- name: history_migrations_quantity_all
  description: The total number of history entries migrated from all source browsers combined. A value of 0 indicates a migration was attempted but
    no history items were transferred.
- name: history_migrations_quantity_chrome
  description: The number of history entries migrated from Google Chrome. A value of 0 indicates a migration was attempted but no Chrome history items
    were transferred.
- name: history_migrations_quantity_edge
  description: The number of history entries migrated from Microsoft Edge. A value of 0 indicates a migration was attempted but no Edge history items
    were transferred.
- name: history_migrations_quantity_safari
  description: The number of history entries migrated from Apple Safari. A value of 0 indicates a migration was attempted but no Safari history items
    were transferred.
- name: holidays
  description: The estimated additive effect of holidays on a forecasted metric, as produced by a time-series forecasting model (e.g., Prophet). A
    value of 0.0 indicates no holiday effect was detected for that data point.
- name: holidays_lower
  description: The lower bound of the uncertainty interval for the holiday component of a time-series forecast. A value of 0.0 indicates no lower-bound
    holiday adjustment for that data point.
- name: holidays_upper
  description: The upper bound of the uncertainty interval for the holiday component of a time-series forecast. A value of 0.0 indicates no upper-bound
    holiday adjustment for that data point.
- name: id_bucket
  description: A numeric bucket assignment (0–19) used to partition client or profile IDs into evenly sized groups for sampling or experimentation
    purposes. Buckets are uniformly distributed to enable percentage-based rollouts.
- name: impression_count
  description: The total number of times a UI element, recommendation, or advertisement was displayed to users. Higher values indicate more frequent
    exposure events within the reporting period.
- name: index
  description: A string identifier used to uniquely label or order rows within a dataset or result set. It may represent a sequential position or a
    named key depending on the context.
- name: install_source
  description: The source or distribution channel through which the application was installed, such as 'com.android.vending' for the Google Play Store
    or 'Unknown' when the source cannot be determined.
- name: install_year
  description: The calendar year in which the application was installed. A null value indicates the install year could not be determined.
- name: installation_first_seen_admin_user
  description: Indicates whether the user had administrative privileges at the time of the first observed installation. True means admin rights were
    present; false means they were not.
- name: installation_first_seen_default_path
  description: Indicates whether the application was installed to its default file system path when first observed. True means the default path was
    used; false means a custom path was chosen.
- name: installation_first_seen_failure_reason
  description: The reason recorded for a failure during the first observed installation attempt. A value of 'NoError' indicates the installation completed
    successfully without errors.
- name: installation_first_seen_from_msi
  description: Indicates whether the application was installed using an MSI package at the time it was first observed. True means an MSI installer
    was used; false means another installer type was used.
- name: installation_first_seen_install_existed
  description: Indicates whether a prior installation of the application already existed when the first installation event was observed. True means
    a previous install was detected; false means this was a fresh installation.
- name: installation_first_seen_installer_type
  description: The type of installer used during the first observed installation, such as 'stub' (a small downloader), 'full' (a complete offline installer),
    or 'msix' (a Windows app package format).
- name: installation_first_seen_other_inst
  description: Indicates whether another non-MSIX installation of the application was detected at the time of the first observed install event. True
    means another installation existed; false means none was found.
- name: installation_first_seen_other_msix_inst
  description: Indicates whether another MSIX-packaged installation of the application was detected at the time of the first observed install event.
    True means another MSIX install existed; false means none was found.
- name: installation_first_seen_profdir_existed
  description: Indicates whether a Firefox profile directory already existed on the system when the first installation was observed. True means a profile
    directory was present; false means none was found.
- name: installation_first_seen_silent
  description: Indicates whether the first observed installation was performed silently, without user-facing UI prompts. True means a silent install
    occurred; false means an interactive installation was used.
- name: installation_first_seen_version
  description: The version string of the application recorded at the time of the first observed installation event. This reflects the version that
    was initially installed, not necessarily the current running version.
- name: installer_type
  description: The type of installer package used to install the application, either 'full' (a complete offline installer) or 'stub' (a lightweight
    downloader that fetches the full package).
- name: installs
  description: The count of installation events recorded within the reporting period. A value of 0 indicates no successful installs occurred despite
    the record being present.
- name: intensity
  description: A floating-point measure of the intensity or magnitude of a signal, event, or usage pattern. The precise meaning depends on the context
    in which it is applied.
- name: ipc_channel_error
  description: The error message or reason associated with a failure in an inter-process communication (IPC) channel, such as 'ShutDownKill' or 'GPUProcessKill'.
    A null value indicates no IPC channel error was recorded.
- name: is_dau
  description: Indicates whether the client is counted as a Daily Active User (DAU) for the given date. True means the client meets the DAU criteria;
    false means it does not.
- name: is_default_browser
  description: Indicates whether Firefox was set as the user's default browser at the time of the record. True means Firefox was the default; false
    means another browser was set as default.
- name: is_desktop
  description: Indicates whether the client is running on a desktop platform. True means the client is a desktop device; false means it is a non-desktop
    device such as a mobile phone or tablet.
- name: is_new_profile
  description: Indicates whether the Firefox profile associated with this record was newly created. True means the profile was created for the first
    time; false means the profile existed previously.
- name: is_system
  description: Indicates whether an add-on or component is a system-level item rather than a user-installed one. True means it is a system item; false
    means it was installed by the user.
- name: is_wow64
  description: Indicates whether the Firefox process is running as a 32-bit application under the 64-bit Windows-on-Windows (WoW64) compatibility layer.
    True means WoW64 is active; false means the process is running natively.
- name: isp
  description: The full name of the Internet Service Provider associated with the client's IP address. This field provides granular ISP identification
    and may include regional carrier names.
- name: isp_name
  description: A normalized or simplified name of the Internet Service Provider associated with the client's IP address. This field typically contains
    the primary brand or company name of the ISP.
- name: isp_organization
  description: The name of the organization registered to the IP address block, which may differ from the ISP brand name. This often represents the
    autonomous system or network operator.
- name: key
  description: A string key that identifies a specific metric, event, search entry, or configuration item within a record. An empty string may represent
    a default or unkeyed entry.
- name: last_bucket
  description: The upper boundary value of the last bucket in a histogram. It defines the maximum range of the histogram and is used to interpret the
    distribution of recorded values.
- name: latest_version
  description: The most recent major version number of the application available or tracked at the time of the record. This is used to assess version
    adoption or currency.
- name: latest_version_ratio
  description: The proportion of clients or records running the latest version of the application, expressed as a floating-point ratio between 0 and
    1. A value of 1.0 indicates all clients are on the latest version.
- name: legacy_telemetry_client_count
  description: The number of distinct legacy telemetry client IDs associated with a given entity or profile. Values greater than 1 may indicate multiple
    devices or profile resets linked to the same entity.
- name: legacy_telemetry_client_id
  description: The UUID that uniquely identifies a Firefox client in the legacy telemetry system. This identifier persists across sessions and is used
    to track longitudinal client behavior.
- name: linkage_first_seen_date
  description: The earliest date on which a linkage between two identifiers or entities was first observed. This is used to establish the start of
    a relationship or identity mapping.
- name: linkage_last_seen_date
  description: The most recent date on which a linkage between two identifiers or entities was observed. This is used to determine the recency or expiration
    of an identity mapping.
- name: linked_client_id
  description: A UUID that links a client across different data sources or ping types, enabling cross-table joins on the same Firefox client. This
    is a high-cardinality identifier and is never null.
- name: locale
  description: The language locale code of the Firefox client (e.g., 'en', 'fr', 'ru'), reflecting the browser's configured display language. May be
    null when locale information is not reported.
- name: logins_migrations_quantity_all
  description: The total number of login credentials migrated from any supported source browser during an import operation. Null when no migration
    event was recorded; zero indicates a migration was attempted but no logins were transferred.
- name: logins_migrations_quantity_chrome
  description: The number of login credentials migrated specifically from Google Chrome during a login import operation. Null when no Chrome migration
    was recorded; zero indicates a migration attempt with no logins transferred.
- name: logins_migrations_quantity_edge
  description: The number of login credentials migrated specifically from Microsoft Edge during a login import operation. Null when no Edge migration
    was recorded; zero indicates a migration attempt with no logins transferred.
- name: logins_migrations_quantity_safari
  description: The number of login credentials migrated specifically from Apple Safari during a login import operation. Null when no Safari migration
    was recorded; zero indicates a migration attempt with no logins transferred.
- name: major_version
  description: The major version number of the Firefox browser (e.g., 122, 128, 150), representing the primary release train the client is running.
    Used to segment users and metrics by browser generation.
- name: mau
  description: The count of distinct active days within the past 28-day window for the client, representing their Monthly Active User engagement level.
    Higher values indicate more frequent usage within the month.
- name: max_subsession_counter
  description: The highest subsession counter value observed within an aggregation period, where each Firefox session is divided into subsessions upon
    restarts or profile changes. Reflects the upper bound of subsession activity for a client.
- name: media_play_time_ms_audio_sum
  description: The cumulative amount of time in milliseconds that audio media was played by the client. Null when no audio playback was detected during
    the reporting period.
- name: media_play_time_ms_video_sum
  description: The cumulative amount of time in milliseconds that video media was played by the client. Null when no video playback was detected during
    the reporting period.
- name: medium
  description: The marketing attribution medium describing how the user arrived at a product or page (e.g., 'referral', 'cpc', 'firefox-desktop').
    May be null when attribution data is unavailable.
- name: memory_gb
  description: The total amount of physical memory installed on the client device, expressed in gigabytes. Used for hardware segmentation and performance
    analysis.
- name: memory_mb
  description: The total amount of physical memory installed on the client device, expressed in megabytes. Provides finer-grained hardware segmentation
    than the gigabyte equivalent.
- name: metadata.first_seen_date_source_ping
  description: The type of telemetry ping from which the client's first-seen date was derived (e.g., 'new_profile', 'main', 'shutdown'). Indicates
    which ping established the client's earliest known presence in the data.
- name: metadata.geo.city
  description: The city-level geographic location of the client as determined by IP address geolocation. May be null when city-level resolution is
    unavailable or suppressed for privacy.
- name: metadata.geo.country
  description: The ISO 3166-1 alpha-2 country code representing the client's geographic location as determined by IP address geolocation (e.g., 'US',
    'DE', 'IN'). Used for geographic segmentation of telemetry data.
- name: metadata.geo.db_version
  description: The version timestamp of the geolocation database used to resolve the client's IP address to a geographic location. Helps identify which
    version of the geo-lookup data was applied during ingestion.
- name: metadata.geo.subdivision1
  description: The first administrative subdivision (e.g., state or province) of the client's geographic location as determined by IP address geolocation.
    May be null when subdivision-level resolution is unavailable or suppressed.
- name: metadata.geo.subdivision2
  description: The second administrative subdivision (e.g., county or district) of the client's geographic location as determined by IP address geolocation.
    May be null when this level of resolution is unavailable or suppressed.
- name: metadata.header.date
  description: The raw HTTP Date header value submitted with the ping request, formatted as an RFC 7231 timestamp string (e.g., 'Wed, 03 Jun 2026 21:57:52
    GMT'). May be null when the header was not present in the request.
- name: metadata.header.dnt
  description: The value of the HTTP Do Not Track (DNT) header sent with the ping request, where '1' indicates the user has requested tracking opt-out.
    Null when the DNT header was not included in the request.
- name: metadata.header.parsed_date
  description: The parsed and structured timestamp representation of the HTTP Date header submitted with the ping request. May be null when the Date
    header was absent or could not be parsed.
- name: metadata.header.parsed_x_lb_tags.tls_cipher_hex
  description: The hexadecimal code identifying the TLS cipher suite used to secure the connection between the client and the ingestion load balancer
    (e.g., '1301' for TLS_AES_128_GCM_SHA256). Derived from the parsed X-LB-Tags header.
- name: metadata.header.parsed_x_lb_tags.tls_version
  description: The TLS protocol version used to secure the connection between the client and the ingestion load balancer (e.g., 'TLSv1.3', 'TLSv1.2').
    Derived from the parsed X-LB-Tags header.
- name: metadata.header.parsed_x_source_tags
  description: An array of source tag strings parsed from the X-Source-Tags HTTP header, used to label the origin or routing path of a ping submission.
    May be an empty array when no source tags were provided.
- name: metadata.header.x_debug_id
  description: The value of the X-Debug-Id HTTP header submitted with the ping, used to identify and route debug pings to a separate pipeline for testing
    purposes. Null when the header is absent, indicating a standard (non-debug) submission.
- name: metadata.header.x_foxsec_ip_reputation
  description: The IP reputation score or classification assigned by Mozilla's FoxSec security system, derived from the X-Foxsec-IP-Reputation HTTP
    header. Null when no reputation data was available for the submitting IP address.
- name: metadata.header.x_lb_tags
  description: The raw value of the X-LB-Tags HTTP header set by the ingestion load balancer, containing TLS connection metadata such as the protocol
    version and cipher suite (e.g., 'TLSv1.3, 1301'). Used to audit the security properties of the submission connection.
- name: metadata.header.x_pingsender_version
  description: The version of the PingSender component used to submit the telemetry ping, derived from the X-PingSender-Version HTTP header. Null when
    the ping was not submitted via PingSender (e.g., sent directly by the browser).
- name: metadata.header.x_source_tags
  description: The raw string value of the X-Source-Tags HTTP header attached to the ping submission, used to identify the source or routing context
    of the request. Null when the header was not present.
- name: metadata.header.x_telemetry_agent
  description: The User-Agent string of the telemetry submission library, identifying the Glean SDK version and platform used to send the ping (e.g.,
    'Glean/67.2.0 (Rust on Windows)'). Used to track SDK adoption and diagnose submission-layer issues.
- name: metadata.isp.db_version
  description: The version timestamp of the ISP database used to resolve the client's IP address to an internet service provider. Helps identify which
    version of the ISP lookup data was applied during ingestion.
- name: metadata.isp.name
  description: The name of the internet service provider associated with the client's IP address at the time of ping submission (e.g., 'Deutsche Telekom
    AG', 'Orange'). Used for network-level segmentation of telemetry data.
- name: metadata.isp.organization
  description: The organization name associated with the client's IP address as determined by ISP geolocation lookup. May differ slightly from the
    ISP name when the registered organization and the service provider differ.
- name: metadata.reported_main_ping
  description: Indicates whether the client reported a main ping for the relevant period. True means a main ping was received; false means it was not.
- name: metadata.reported_new_profile_ping
  description: Indicates whether the client reported a new_profile ping, which is sent when a new Firefox profile is created. True means the ping was
    received; false means it was not.
- name: metadata.reported_shutdown_ping
  description: Indicates whether the client reported a shutdown ping, which is sent when the Firefox browser is closed. True means the ping was received;
    false means it was not.
- name: metadata.user_agent.browser
  description: The browser name parsed from the User-Agent string of the ping submission request (e.g., 'Firefox', 'Chrome'). Null when the User-Agent
    header was absent or could not be parsed to identify a browser.
- name: metadata.user_agent.os
  description: The operating system name parsed from the User-Agent string of the ping submission request (e.g., 'Windows 10', 'Android', 'Linux').
    Null when the User-Agent header was absent or the OS could not be determined.
- name: metadata.user_agent.version
  description: The browser version number parsed from the User-Agent string of the ping submission request (e.g., '128', '115'). Null when the User-Agent
    header was absent or the version could not be parsed.
- name: metadata_app_version
  description: The version string of the application that submitted the telemetry ping, as reported in the ping metadata (e.g., '4.5', '4.7.1'). Used
    to segment telemetry by application release version.
- name: metric
  description: The name of the telemetry metric being recorded (e.g., 'gc_ms', 'thread_wakeup'), identifying the specific measurement within a histogram
    or scalar probe. Used to distinguish individual metric records within aggregated telemetry tables.
- name: metric_date
  description: The date for which the metric value was computed or aggregated, used to anchor time-series telemetry records to a specific calendar
    day.
- name: metric_name
  description: A human-readable label identifying the type of usage or behavioral metric being measured (e.g., 'uri_count', 'active_ticks', 'client_submission_latency').
    Used to distinguish different metric dimensions within an aggregation.
- name: metric_type
  description: The telemetry probe type that classifies how a metric's values are collected and structured (e.g., 'histogram-exponential', 'scalar',
    'keyed-scalar', 'boolean'). Determines the appropriate interpretation and aggregation method for the metric's data.
- name: metrics
  description: A nested struct containing all Glean metric values reported in the ping, organized by metric type (e.g., boolean, string, quantity,
    timespan, labeled_counter). Each sub-field corresponds to a named Glean metric collected by the application.
- name: min_subsession_counter
  description: The lowest subsession counter value observed within an aggregation period, where each Firefox session is divided into subsessions upon
    restarts or profile changes. Reflects the starting subsession index for a client within the period.
- name: monthly_users
  description: The number of distinct active days recorded for the client within the current calendar month, used as a measure of monthly engagement
    depth. Higher values indicate a client who uses Firefox more frequently throughout the month.
- name: moz_crash_reason
  description: A string describing the reason for a Firefox crash as recorded by the MOZ_CRASH macro or equivalent crash reporting mechanism (e.g.,
    'MOZ_CRASH(OOM)', 'Shutdown hanging at step XPCOMShutdownThreads'). Null when no specific crash reason was captured.
- name: multiplicative_terms
  description: The multiplicative component of a time-series decomposition model applied to telemetry data. A value of 0.0 indicates no multiplicative
    adjustment is present.
- name: multiplicative_terms_lower
  description: The lower bound of the confidence interval for the multiplicative component of a time-series decomposition model. A value of 0.0 indicates
    no lower-bound adjustment is present.
- name: multiplicative_terms_upper
  description: The upper bound of the confidence interval for the multiplicative component of a time-series decomposition model. A value of 0.0 indicates
    no upper-bound adjustment is present.
- name: n_created_pictureinpicture
  description: The number of Picture-in-Picture windows created during a session or observation period. A null value indicates the metric was not recorded
    for that row.
- name: n_logged_event
  description: The total number of events logged during a session or observation period. Higher values indicate more event activity within the period.
- name: n_viewed_protection_report
  description: The number of times the Firefox protection report page was viewed during a session or observation period. Zero indicates the report
    was not viewed.
- name: name
  description: The display name associated with an entity such as a browser extension or add-on. This value is user-facing and may be null or contain
    localization placeholder strings.
- name: nbr_clients_uninstalling
  description: The number of client instances recorded as uninstalling Firefox or a related component during the observation period.
- name: nbr_cpu_cores
  description: The number of logical CPU cores available on the client device. A null value indicates the hardware information could not be determined.
- name: nbr_events
  description: The total count of telemetry events recorded for a given row or aggregation group. A value of 1 is the most common, indicating single-event
    records.
- name: nbr_unique_clients_uninstalling
  description: The count of distinct client identifiers recorded as uninstalling Firefox or a related component during the observation period.
- name: nbr_unique_users
  description: The count of distinct user identifiers observed within the aggregation group or time period represented by the row.
- name: new_profile_metric_date
  description: A boolean flag indicating whether the date associated with the row is the metric date on which a new Firefox profile was first observed.
    True means the date is a new-profile metric date; false means it is not.
- name: new_profile_rate
  description: The rate at which new Firefox profiles were created relative to a reference population or time period.
- name: new_profile_ratio
  description: The proportion of new Firefox profiles relative to the total number of profiles in the aggregation group. A value of 0.0 indicates no
    new profiles were observed.
- name: new_profiles
  description: The count of newly created Firefox profiles observed during the aggregation period. A value of 0 indicates no new profiles were created.
- name: new_profiles_metric_date
  description: A numeric representation of the metric date on which new Firefox profiles are counted, used for time-based aggregations and reporting.
- name: newtab_homepage_category
  description: A categorical classification of the browser homepage setting at the time of a new-tab event, such as 'enabled' (default Firefox homepage),
    'disabled', 'search-engine', 'extension', or 'other'. Null values indicate the setting could not be determined.
- name: newtab_newtab_category
  description: A categorical classification of the new-tab page setting, such as 'enabled' (default Firefox new-tab), 'disabled', 'extension', or 'other'.
    Null values indicate the setting could not be determined.
- name: newtab_open_source
  description: The URL source from which the new-tab page was opened, such as 'about:newtab', 'about:home', or 'about:welcome'. Null or 'other' values
    indicate the source was unrecognized or unavailable.
- name: newtab_search_enabled
  description: A boolean flag indicating whether the search bar is enabled on the Firefox new-tab page. True means search is enabled; false means it
    is disabled.
- name: newtab_visit_count
  description: The number of new-tab page visits recorded for a client within the aggregation period.
- name: newtab_visit_ended_at
  description: The timestamp (in milliseconds or a relative unit) at which a new-tab page visit ended. A value of 0 indicates the visit end was not
    recorded or the tab was not closed normally.
- name: newtab_visit_id
  description: A unique identifier (UUID) for a single new-tab page visit session. This ID links events and interactions that occur within the same
    new-tab visit.
- name: newtab_visit_started_at
  description: The timestamp (in milliseconds or a relative unit) at which a new-tab page visit began. A value of 0 is the most common and may indicate
    the start time was not captured or the tab opened at session start.
- name: newtab_weather_widget_enabled
  description: A boolean flag indicating whether the weather widget is enabled on the Firefox new-tab page. True means the widget is enabled; false
    means it is disabled. Null indicates the feature state could not be determined.
- name: non_norm_aggregates
  description: An array of key-value pairs representing non-normalized aggregated histogram or metric data for a client or cohort. Each entry holds
    a bucket key and its corresponding aggregate value.
- name: non_norm_aggregates.key
  description: The bucket identifier or dimension key within the non-normalized aggregates array, representing a histogram bucket index or categorical
    dimension label.
- name: non_norm_aggregates.value
  description: The numeric aggregate value associated with a specific bucket or dimension key in the non-normalized aggregates array. A value of 0.0
    is the most common, indicating no observations in that bucket.
- name: non_norm_histogram
  description: A JSON-encoded string representing a non-normalized histogram of metric observations, where keys are bucket labels and values are counts.
    This preserves the raw bucket distribution before normalization.
- name: normalized_app_name
  description: A standardized human-readable name for the Mozilla application that submitted telemetry, such as 'Firefox Desktop', 'Fenix', or 'Firefox
    iOS'. This normalizes across variant builds and platforms.
- name: normalized_channel
  description: The standardized release channel of the Firefox application, such as 'release', 'beta', 'nightly', 'esr', or 'aurora'. 'Other' indicates
    an unrecognized or custom channel.
- name: normalized_country_code
  description: The ISO 3166-1 alpha-2 country code representing the client's inferred geographic location, derived from IP address or other signals.
- name: normalized_os
  description: The standardized operating system name for the client device, such as 'Windows', 'Mac', or 'Linux'.
- name: normalized_os_version
  description: The standardized version string of the client's operating system, formatted for consistency across platforms (e.g., '10.0' for Windows
    10 or '6.8.0' for a Linux kernel version).
- name: num_buckets
  description: The total number of buckets defined in the histogram used to aggregate a telemetry metric. Common values such as 50, 100, or 1000 correspond
    to standard Firefox histogram configurations.
- name: num_clients_active_on_day
  description: The count of distinct clients that were active on a given day within the aggregation group. A value of 0 indicates no clients were active
    on that day.
- name: num_clients_in_cohort
  description: The count of distinct clients belonging to a particular cohort or segmentation group during the observation period.
- name: numeric_index
  description: A sequential integer index assigned to a row or record within its aggregation context, used to establish ordering or uniquely identify
    a position in a series.
- name: oom_allocation_size
  description: The size in bytes of the memory allocation that triggered an out-of-memory (OOM) crash or event. Null values, which are prevalent, indicate
    OOM size information was not available or the crash was not OOM-related.
- name: organic_pocket_clicks
  description: The number of clicks on organic (non-sponsored) Pocket content recommendations displayed on the Firefox new-tab page during the observation
    period.
- name: organic_pocket_dismissals
  description: The number of times a user dismissed organic (non-sponsored) Pocket content recommendations on the Firefox new-tab page during the observation
    period.
- name: organic_pocket_impressions
  description: The number of times organic (non-sponsored) Pocket content recommendations were displayed (impressed) on the Firefox new-tab page during
    the observation period.
- name: organic_pocket_saves
  description: The number of times a user saved an organic (non-sponsored) Pocket content recommendation to their Pocket account from the Firefox new-tab
    page during the observation period.
- name: organic_search_count
  description: The number of organic (non-paid, non-tagged) searches performed by the client during the observation period. Null values indicate search
    data was not available or the client had no recorded search activity.
- name: organic_topsite_clicks
  description: The number of clicks on organic (non-sponsored) top site tiles displayed on the Firefox new-tab page during the observation period.
- name: organic_topsite_dismissals
  description: The number of times a user dismissed organic (non-sponsored) top site tiles on the Firefox new-tab page during the observation period.
- name: organic_topsite_impressions
  description: The number of times organic (non-sponsored) top site tiles were displayed (impressed) on the Firefox new-tab page during the observation
    period.
- name: organic_topsite_tile_clicks
  description: The number of clicks specifically on organic (non-sponsored) top site tile elements on the Firefox new-tab page, potentially distinguished
    from broader topsite click metrics by tile-level granularity.
- name: organic_topsite_tile_dismissals
  description: The number of times a user dismissed organic (non-sponsored) top site tile elements on the Firefox new-tab page, tracked at tile-level
    granularity during the observation period.
- name: organic_topsite_tile_impressions
  description: The total number of impressions recorded for organic top site tiles on the new tab page. A value of 0 indicates no impressions were
    recorded for that period.
- name: os
  description: The raw operating system name as reported by the client, such as 'Windows_NT', 'Darwin', 'Android', 'iOS', or 'Linux'. This is the unprocessed
    OS string and may include uncommon or malformed values.
- name: os_environment_is_taskbar_pinned_any
  description: Indicates whether Firefox is pinned to the Windows taskbar in any browser mode (regular or private). True means Firefox is pinned in
    at least one mode; false means it is not pinned in any mode.
- name: os_environment_is_taskbar_pinned_private
  description: Indicates whether the Firefox private browsing shortcut is specifically pinned to the Windows taskbar. True means the private browsing
    shortcut is pinned; false means it is not.
- name: os_environment_is_taskbar_pinned_private_any
  description: Indicates whether a Firefox private browsing shortcut is pinned to the Windows taskbar in any configuration. True means at least one
    private browsing shortcut is pinned; false means none are pinned.
- name: os_grouped
  description: A high-level grouping of the client's operating system into one of four categories; 'Windows', 'Mac', 'Linux', or 'Other'. This provides
    a simplified OS classification for aggregation and reporting.
- name: os_name
  description: The normalized operating system name of the client, with values such as 'Windows', 'Mac', 'Linux', 'Android', or 'Other'. Unlike the
    raw 'os' field, this reflects a standardized classification.
- name: os_service_pack_major
  description: The major version number of the Windows Service Pack installed on the client's operating system. This field is null for non-Windows
    operating systems or when service pack information is unavailable.
- name: os_service_pack_minor
  description: The minor version number of the Windows Service Pack installed on the client's operating system. This field is null for non-Windows
    operating systems or when service pack information is unavailable.
- name: os_version
  description: The full version string of the client's operating system, such as '10.0' for Windows 10 or '13.5.1' for macOS. The format varies by
    platform and may include major, minor, and patch components.
- name: os_version_major
  description: The major version number component of the client's operating system version. For example, this would be 10 for Windows 10 or 14 for
    macOS Sonoma.
- name: os_version_minor
  description: The minor version number component of the client's operating system version. This is 0 for many OS releases where no minor version distinction
    exists, and non-zero for specific point releases.
- name: osversion
  description: The operating system version string as reported in a specific telemetry context, often representing Android API levels or similar platform-specific
    version identifiers. Values are typically numeric strings.
- name: partner_distribution_version
  description: The version identifier of the partner distribution package used to install Firefox, such as '1.0' or '2023.6'. This field is null when
    Firefox was not installed through a partner distribution.
- name: partner_distributor
  description: The name of the partner or Linux distribution that bundled or distributed Firefox, such as 'canonical', 'mint', or 'archlinux'. This
    field is null for standard Mozilla-direct installs.
- name: partner_distributor_channel
  description: The specific distribution channel used by the partner to deliver Firefox, such as 'ubuntu' or 'esrWinFull'. This field is null when
    no partner distributor channel is associated with the install.
- name: partner_id
  description: A short identifier for the partner organization that distributed Firefox, such as 'ubuntu', 'mint', or 'mozillaonline'. This field is
    null for installs not associated with a recognized partner.
- name: partner_org
  description: A human-readable categorization of the partner or distribution organization associated with a Firefox install, such as 'Linux - Canonical',
    'Mozilla - China', or 'non-distribution'. This field classifies installs into named partner groups for reporting.
- name: payload.crashDate
  description: The date on which the crash occurred, as reported in the crash ping payload. This is a string field formatted as a date value.
- name: payload.crashTime
  description: The time at which the crash occurred, as reported in the crash ping payload. This is a string field representing a timestamp or epoch
    value.
- name: payload.hasCrashEnvironment
  description: Indicates whether the crash ping payload includes an environment block with additional client context. True means environment data was
    captured alongside the crash report; false means it was not.
- name: payload.metadata.key_value
  description: An array of key-value string pairs containing supplementary metadata fields included in the crash ping payload. Each entry represents
    an individual metadata attribute and its associated value.
- name: payload.processType
  description: The type of Firefox process that generated the crash, such as 'main', 'content', or 'gpu'. This identifies which part of the browser's
    multi-process architecture experienced the crash.
- name: payload.version
  description: The schema version number of the crash ping payload format. This integer is used to identify which version of the payload structure
    was used when the ping was submitted.
- name: pct_users_profile_age_8_to_365_days
  description: The proportion of users in a cohort whose Firefox profile age is between 8 and 365 days at the time of measurement. Values range from
    0.0 (none) to 1.0 (all users in the group).
- name: pct_users_profile_age_less_than_7_days
  description: The proportion of users in a cohort whose Firefox profile age is less than 7 days at the time of measurement, representing relatively
    new users. Values range from 0.0 (none) to 1.0 (all users in the group).
- name: pct_users_profile_age_over_365_days
  description: The proportion of users in a cohort whose Firefox profile age exceeds 365 days at the time of measurement, representing established
    long-term users. Values range from 0.0 (none) to 1.0 (all users in the group).
- name: ping_sent_metric_date
  description: Indicates whether a telemetry ping was sent on the relevant metric date. True means a ping was received for that date; null indicates
    the metric date is not applicable or the ping was absent.
- name: ping_sent_week_4
  description: Indicates whether a telemetry ping was sent during the fourth week of a user's lifecycle or observation window. True means a ping was
    received in week 4; false means no ping was received; null means the week is not yet applicable.
- name: pings_aggregated_by_this_row
  description: The number of individual telemetry pings that have been combined into this aggregated row. Higher values indicate more pings were collapsed
    into a single record.
- name: placement
  description: The named placement or slot on the new tab page where a sponsored or recommended content item was shown, such as 'newtab_spocs' or 'newtab_stories_1'.
    This field is null when no placement is associated with the record.
- name: places_bookmarks_count_mean
  description: The mean number of bookmarks stored in the user's Firefox Places database over the aggregation period. This field is null when bookmark
    count data is unavailable for the client.
- name: places_bookmarks_searchbar_cumulative_searches_sum
  description: The cumulative total number of searches performed using the bookmarks search bar within Firefox's Places library over the aggregation
    period. This field is null when no relevant activity was recorded.
- name: places_library_cumulative_bookmark_searches_sum
  description: The cumulative total number of bookmark searches performed through the Firefox Places library panel over the aggregation period. This
    field is null when no bookmark search activity was recorded.
- name: places_library_cumulative_history_searches_sum
  description: The cumulative total number of history searches performed through the Firefox Places library panel over the aggregation period. This
    field is null when no history search activity was recorded.
- name: places_pages_count_mean
  description: The mean number of pages stored in the user's Firefox browsing history (Places database) over the aggregation period. This field is
    null when history count data is unavailable for the client.
- name: places_previousday_visits_mean
  description: The mean number of page visits recorded in the Firefox Places database for the previous day, averaged over the aggregation period. A
    value of 0.0 indicates the user had no history visits on the prior day.
- name: places_searchbar_cumulative_filter_count_sum
  description: The cumulative total number of times the user applied a filter in the Firefox Places searchbar over the aggregation period. This field
    is null when no filter activity was recorded.
- name: places_searchbar_cumulative_searches_sum
  description: The cumulative total number of searches performed using the Firefox Places searchbar over the aggregation period. This field is null
    when no Places searchbar search activity was recorded.
- name: platform_version
  description: The version string of the Firefox platform (Gecko) as reported by the client, such as '151.0.3'. This may differ from the application
    version in cases involving extended support or specialized builds.
- name: play_store_attribution_campaign
  description: The UTM campaign name associated with the Google Play Store install attribution, such as 'firefox-desktop' or 'mozilla-org'. This field
    is null when no campaign attribution is available.
- name: play_store_attribution_content
  description: The UTM content parameter associated with the Google Play Store install attribution, identifying the specific creative or surface that
    drove the install, such as 'onboarding-modal' or 'firefoxview'. This field is null when no content attribution is available.
- name: play_store_attribution_install_referrer_response
  description: The raw referrer string returned by the Google Play Store install referrer API, containing UTM and other attribution parameters encoded
    as a query string. This field is null when no referrer data was captured.
- name: play_store_attribution_medium
  description: The UTM medium parameter associated with the Google Play Store install attribution, describing the marketing channel (e.g., 'organic',
    'paid'). This field is predominantly null, indicating medium data is generally not captured.
- name: play_store_attribution_source
  description: The UTM source parameter associated with the Google Play Store install attribution, identifying the origin of the install such as 'google-play',
    'google', or 'eea-browser-choice'. This field is null when source attribution is unavailable.
- name: play_store_attribution_term
  description: The UTM term parameter associated with the Google Play Store install attribution, typically representing the search keyword that led
    to the install, such as 'firefox' or 'mozilla firefox'. This field is null when no term attribution is available.
- name: play_time_ratio
  description: The ratio of active play or usage time relative to a reference time window for the client. Higher values indicate a greater proportion
    of active engagement relative to the measured period.
- name: plugin_hangs_sum
  description: The total number of plugin hang events recorded for the client over the aggregation period. This field is null when no plugin hang data
    was reported, which is the case for the vast majority of clients.
- name: plugins_infobar_allow_sum
  description: The total number of times a user clicked 'Allow' on a plugin activation infobar over the aggregation period. This field is null for
    all records, indicating this metric is no longer actively collected.
- name: plugins_infobar_block_sum
  description: The total number of times a user clicked 'Block' on a plugin activation infobar over the aggregation period. This field is null for
    all records, indicating this metric is no longer actively collected.
- name: plugins_infobar_shown_sum
  description: The aggregated count of times the plugin notification infobar was shown to the user. A null value indicates the metric was not recorded
    for that client.
- name: plugins_notification_shown_sum
  description: The aggregated count of times a plugin notification was shown to the user. A null value indicates the metric was not recorded for that
    client.
- name: pocket_clicks
  description: The total number of clicks on Pocket content (e.g., stories or recommendations) during the reporting period. A value of 0 indicates
    no clicks occurred.
- name: pocket_enabled
  description: Indicates whether the Pocket feature is enabled for the user. True means Pocket is enabled; false means it is disabled.
- name: pocket_impressions
  description: The total number of times Pocket content was displayed (impressed) to the user during the reporting period. A value of 0 indicates no
    impressions were recorded.
- name: pocket_is_signed_in
  description: Indicates whether the user is signed in to a Pocket account. True means the user is signed in; false means they are not. Null indicates
    the sign-in state was not recorded.
- name: pocket_saves
  description: The total number of items the user saved to Pocket during the reporting period. A value of 0 indicates no saves occurred.
- name: pocket_sponsored_stories_enabled
  description: Indicates whether sponsored Pocket stories are enabled for the user. True means sponsored stories are shown; false means they are not.
- name: pocket_story_position
  description: The zero-based position index of a Pocket story within the content feed or grid. Null indicates the position was not recorded or the
    event did not involve a positional placement.
- name: pocket_thumb_voting_events
  description: The total number of thumb-voting (thumbs up/down) interactions the user performed on Pocket stories during the reporting period. A value
    of 0 indicates no voting events occurred.
- name: position
  description: The ordinal position of an item (e.g., a search suggestion, recommendation, or UI element) within its containing list or grid. Values
    are zero- or one-based depending on context.
- name: previous_build_id
  description: The build ID of the Firefox version that was installed prior to the most recent update, formatted as a timestamp string (e.g., YYYYMMDDHHMMSS).
    Null indicates no previous build was recorded, typically for new installations.
- name: process
  description: The name of the Firefox process from which a measurement or event originated, such as 'parent' (the main browser process), 'content'
    (a content rendering process), or 'gpu' (the GPU process).
- name: process_type
  description: The type of Firefox process associated with a measurement or crash, such as 'parent', 'content', 'gpu', 'rdd', 'plugin', 'socket', or
    'utility'. Null indicates the process type was not recorded.
- name: product
  description: The name of the Mozilla product from which the data originates, such as 'Fenix', 'Firefox iOS', 'Focus Android', or 'Fennec'. Used to
    distinguish metrics across different Mozilla browser products.
- name: profile_age_in_days
  description: The age of the Firefox profile in days at the time of the observation, calculated as the difference between the reporting date and the
    profile creation date. A value of 0 indicates a newly created profile.
- name: profile_created
  description: An integer representation of the date or timestamp when the Firefox profile was created. Used to determine profile age and cohort membership.
- name: profile_creation_date
  description: The date on which the Firefox profile was first created, formatted as a YYYYMMDD string. Used to derive profile age and segment users
    into new-profile cohorts.
- name: profile_date
  description: The date on which the Firefox profile was created, stored as a DATE type. Used to compute profile age and identify new-profile cohorts.
- name: profile_group_id
  description: A UUID that identifies a group of related Firefox profiles, typically corresponding to a single installation or user account across
    multiple profiles. Null indicates the group identifier was not available.
- name: push_api_notify_sum
  description: The aggregated count of push API notifications delivered to the browser during the reporting period. Null indicates no push notifications
    were recorded for that client.
- name: qdau_desktop
  description: The count of qualifying daily active usage sessions on desktop Firefox for the reporting period. A value of 0 indicates no qualifying
    activity was observed.
- name: qualified_second_day
  description: Indicates whether the user met the qualification criteria for activity on the second day after profile creation. True means the user
    qualified; false means they did not.
- name: qualified_week4
  description: Indicates whether the user met the qualification criteria for activity during the fourth week after profile creation. True means the
    user qualified; false means they did not.
- name: realm
  description: The deployment realm or environment context in which the data was collected, used to distinguish between different operational environments
    such as production or staging.
- name: reason
  description: The technical reason or signal associated with a crash or process termination, such as a signal name (e.g., 'SIGSEGV / SEGV_MAPERR')
    or Windows exception code (e.g., 'EXCEPTION_BREAKPOINT'). Null indicates the reason was not captured.
- name: recommendation_id
  description: A UUID that uniquely identifies a specific recommendation or suggested content item shown to the user. Null indicates no recommendation
    was associated with the record.
- name: record.key
  description: The key component of a key-value record pair, typically representing a histogram bucket index, category label, or other categorical
    identifier within a structured data record.
- name: record.value
  description: The numeric value associated with a key in a key-value record pair, representing a measured quantity such as a proportion, count, or
    normalized metric. A value of 0.0 is the most common, indicating no contribution from that key.
- name: region
  description: The two-letter ISO 3166-1 alpha-2 country code representing the geographic region of the user or data source (e.g., 'US', 'DE', 'GB').
    Null indicates the region could not be determined.
- name: regressor_00
  description: The point estimate value of the first external regressor used in a forecasting or modeling pipeline. A value of 0.0 typically indicates
    no regressor contribution for that observation.
- name: regressor_00_lower
  description: The lower bound of the confidence interval for the first external regressor value used in a forecasting or modeling pipeline. A value
    of 0.0 indicates no lower-bound adjustment for that observation.
- name: regressor_00_upper
  description: The upper bound of the confidence interval for the first external regressor value used in a forecasting or modeling pipeline. A value
    of 0.0 indicates no upper-bound adjustment for that observation.
- name: repeat_profile
  description: Indicates whether the profile has been seen in a previous reporting period, identifying it as a returning rather than new profile. True
    means the profile is a repeat; false means it is newly observed.
- name: repeat_profiles
  description: The count of profiles that have been observed in a previous reporting period within the aggregated data. Used to distinguish returning
    profiles from new ones in cohort analyses.
- name: resolution
  description: The resolution or outcome associated with a record, such as the disposition of a crash report or the result of an action. Used to categorize
    the final state of an event or workflow item.
- name: retained_week4
  description: An integer flag (0) indicating whether a new profile was retained through the fourth week after creation. A value of 0 indicates the
    user was not retained; null indicates the retention window has not yet elapsed.
- name: retained_week_4
  description: Indicates whether the user was retained (i.e., returned and was active) during the fourth week after their profile creation date. True
    means retained; false means not retained. Null indicates retention could not be determined.
- name: retained_week_4_new_profile
  description: Indicates whether a newly created profile was retained through the fourth week after creation. True means the new profile was retained;
    false means it was not.
- name: retained_week_4_new_profiles
  description: The count of newly created profiles that were retained through the fourth week after their creation date. Used to measure early retention
    for new user cohorts.
- name: return_user
  description: An integer flag (0) indicating whether the user returned to Firefox after an initial session. A value of 0 indicates the user did not
    return; null indicates the return status could not be determined.
- name: returned_second_day
  description: Indicates whether the user returned to use the browser on the second day after their profile was created. True means the user returned;
    false means they did not.
- name: row_count
  description: The number of rows associated with a given record or aggregation group. Used to understand the volume of underlying data contributing
    to a summarized result.
- name: row_source
  description: The platform or device category from which the row of data originates, such as 'Desktop' or 'Mobile'. Used to distinguish between data
    collected from different form factors.
- name: sample_id
  description: A numeric identifier (0–99) derived from the client ID, used to partition clients into consistent 1% samples for efficient querying
    and analysis without processing the full population.
- name: sandbox_effective_content_process_level
  description: The effective sandboxing level applied to Firefox content processes, where higher values indicate more restrictive sandbox policies.
    A value of 0 indicates no sandboxing; null indicates the level was not recorded.
- name: save_count
  description: The number of times a user saved an item (e.g., a Pocket story or bookmark) during the reporting period. A value of 0 indicates no saves
    occurred.
- name: scalar_a11y_hcm_background
  description: The background color value used in High Contrast Mode (HCM) accessibility settings, stored as a 32-bit ARGB integer. Null indicates
    the metric was not recorded, meaning HCM was not active or not detected.
- name: scalar_a11y_hcm_foreground
  description: The foreground (text) color value used in High Contrast Mode (HCM) accessibility settings, stored as a 32-bit ARGB integer. Null indicates
    the metric was not recorded, meaning HCM was not active or not detected.
- name: scalar_combined_webrtc_nicer_stun_retransmits_sum
  description: The aggregated count of STUN packet retransmits recorded by the WebRTC ICE/STUN stack (nICEr) during the reporting period. A null value
    indicates no WebRTC STUN activity was recorded for that client.
- name: scalar_combined_webrtc_nicer_turn_401s_sum
  description: Aggregated sum of WebRTC TURN server 401 Unauthorized response errors encountered across processes. A non-null value indicates authentication
    failures during TURN negotiation.
- name: scalar_combined_webrtc_nicer_turn_403s_sum
  description: Aggregated sum of WebRTC TURN server 403 Forbidden response errors encountered across processes. A non-null value indicates authorization
    failures during TURN negotiation.
- name: scalar_combined_webrtc_nicer_turn_438s_sum
  description: Aggregated sum of WebRTC TURN server 438 Stale Nonce response errors encountered across processes. A non-null value indicates nonce
    expiry issues during TURN authentication.
- name: scalar_content_navigator_storage_estimate_count_sum
  description: Total number of times the Navigator StorageManager.estimate() API was called from content processes. This reflects how often web content
    queries available storage quota information.
- name: scalar_content_navigator_storage_persist_count_sum
  description: Total number of times the Navigator StorageManager.persist() API was called from content processes. This reflects how often web content
    requests persistent (eviction-resistant) storage.
- name: scalar_content_telemetry_event_counts_sum
  description: A keyed map of Telemetry event category/method/object keys to their summed occurrence counts, as recorded in content processes. Each
    key identifies a distinct telemetry event type.
- name: scalar_parent_aushelper_websense_reg_version
  description: The version string of the Websense security software detected in the Windows registry by the AUS (Application Update Service) helper
    component. A null value indicates Websense was not detected.
- name: scalar_parent_browser_engagement_max_concurrent_tab_count_max
  description: The maximum number of tabs that were open simultaneously across all browser windows during the reporting period. Higher values indicate
    more intensive multitasking behaviour.
- name: scalar_parent_browser_engagement_max_concurrent_window_count_max
  description: The maximum number of browser windows that were open simultaneously during the reporting period. A value of 1 indicates only a single
    window was ever open at one time.
- name: scalar_parent_browser_engagement_tab_open_event_count_sum
  description: The total number of new tab open events recorded during the reporting period. This counts discrete user actions that opened a new tab,
    not the peak number of tabs open.
- name: scalar_parent_browser_engagement_total_uri_count_normal_and_private_mode_sum
  description: The total number of URIs navigated to across both normal and private browsing windows during the reporting period. This is a combined
    engagement signal spanning all browsing modes.
- name: scalar_parent_browser_engagement_total_uri_count_sum
  description: The total number of URIs navigated to in normal (non-private) browsing windows during the reporting period. This serves as a measure
    of overall browsing activity.
- name: scalar_parent_browser_engagement_unfiltered_uri_count_sum
  description: The total number of URI navigations recorded before any engagement filtering is applied during the reporting period. This includes all
    navigations, including internal and non-user-initiated ones.
- name: scalar_parent_browser_engagement_unique_domains_count_max
  description: The maximum number of unique domains visited in a single session during the reporting period. This reflects the breadth of browsing
    activity within the most diverse session.
- name: scalar_parent_browser_engagement_unique_domains_count_mean
  description: The mean number of unique domains visited per session during the reporting period. This reflects the average breadth of browsing activity
    across all sessions.
- name: scalar_parent_browser_engagement_window_open_event_count_sum
  description: The total number of new browser window open events recorded during the reporting period. This counts discrete actions that opened a
    new browser window, not the peak window count.
- name: scalar_parent_browser_ui_interaction_content_context_sum
  description: A keyed map of content context menu item identifiers to their summed interaction counts. Each key represents a specific context menu
    element that the user interacted with.
- name: scalar_parent_browser_ui_interaction_preferences_pane_home_sum
  description: A keyed map of UI element identifiers within the Preferences Home pane to their summed interaction counts. Each key represents a specific
    control or link the user clicked.
- name: scalar_parent_browser_ui_interaction_textrecognition_error_sum
  description: The total number of errors encountered during text recognition (e.g., live text or OCR) UI interactions. A null value indicates no errors
    were recorded during the reporting period.
- name: scalar_parent_devtools_accessibility_node_inspected_count_sum
  description: The total number of times an accessibility node was inspected using the DevTools Accessibility panel. Higher values reflect more intensive
    use of accessibility inspection features.
- name: scalar_parent_devtools_accessibility_opened_count_sum
  description: The total number of times the DevTools Accessibility panel was opened during the reporting period. Higher values indicate more frequent
    use of the accessibility inspection tooling.
- name: scalar_parent_devtools_accessibility_picker_used_count_sum
  description: The total number of times the accessibility picker tool was activated within the DevTools Accessibility panel. This reflects how often
    users selected page elements via the picker.
- name: scalar_parent_devtools_accessibility_select_accessible_for_node_sum
  description: A keyed map of node types or identifiers to the number of times the 'Select Accessible for Node' action was triggered in the DevTools
    Accessibility panel.
- name: scalar_parent_devtools_accessibility_service_enabled_count_sum
  description: The total number of times the accessibility service was explicitly enabled via DevTools during the reporting period. A null value indicates
    the service was never toggled on.
- name: scalar_parent_devtools_copy_full_css_selector_opened_sum
  description: The total number of times the 'Copy Full CSS Selector' action was triggered from the DevTools Inspector context menu. A null value indicates
    this action was never used.
- name: scalar_parent_devtools_copy_unique_css_selector_opened_sum
  description: The total number of times the 'Copy Unique CSS Selector' action was triggered from the DevTools Inspector context menu. A null value
    indicates this action was never used.
- name: scalar_parent_devtools_toolbar_eyedropper_opened_sum
  description: The total number of times the eyedropper color-picker tool was opened from the DevTools toolbar during the reporting period. A null
    value indicates the tool was never used.
- name: scalar_parent_dom_contentprocess_troubled_due_to_memory_sum
  description: The total number of content processes that entered a troubled state due to memory pressure during the reporting period. A null value
    indicates no such events occurred.
- name: scalar_parent_library_link_sum
  description: A keyed map of link type identifiers to the number of times links were followed from the Library panel. Each key represents a distinct
    link destination or category.
- name: scalar_parent_library_opened_sum
  description: A keyed map of entry-point identifiers to the number of times the Library panel was opened via each entry point. Each key represents
    a distinct way the panel was accessed.
- name: scalar_parent_library_search_sum
  description: A keyed map of search context identifiers to the number of times a search was performed within the Library panel. Each key represents
    a distinct search scope or category.
- name: scalar_parent_navigator_storage_estimate_count_sum
  description: Total number of times the Navigator StorageManager.estimate() API was called from the parent process. This reflects how often storage
    quota information was queried outside of content processes.
- name: scalar_parent_navigator_storage_persist_count_sum
  description: Total number of times the Navigator StorageManager.persist() API was called from the parent process. This reflects how often persistent
    storage was requested outside of content processes.
- name: scalar_parent_os_environment_is_taskbar_pinned
  description: Indicates whether Firefox is pinned to the operating system taskbar. True means Firefox has a taskbar pin, false means it does not,
    and null means the status could not be determined.
- name: scalar_parent_os_environment_launched_via_desktop
  description: Indicates whether Firefox was launched from a desktop shortcut in the current session. True means the desktop shortcut was the launch
    method; false means it was not.
- name: scalar_parent_os_environment_launched_via_other
  description: Indicates whether Firefox was launched via a method not covered by the other launch-source scalars (e.g., command line, file association).
    True means an uncategorised launch method was used.
- name: scalar_parent_os_environment_launched_via_other_shortcut
  description: Indicates whether Firefox was launched from a shortcut located somewhere other than the desktop, Start menu, or taskbar. True means
    such an alternative shortcut was used to start Firefox.
- name: scalar_parent_os_environment_launched_via_start_menu
  description: Indicates whether Firefox was launched from a Start menu entry in the current session. True means the Start menu was used as the launch
    method; false means it was not.
- name: scalar_parent_os_environment_launched_via_taskbar
  description: Indicates whether Firefox was launched by clicking its taskbar icon or pin in the current session. True means the taskbar was the launch
    method; false means it was not.
- name: scalar_parent_os_environment_launched_via_taskbar_private
  description: Indicates whether Firefox was launched into a Private Browsing window via a dedicated taskbar shortcut. True means a taskbar private-browsing
    shortcut was used; false means it was not.
- name: scalar_parent_sidebar_link_sum
  description: A keyed map of link type identifiers to the number of times links were followed from the browser sidebar. Each key represents a distinct
    link destination or category within the sidebar.
- name: scalar_parent_sidebar_opened_sum
  description: A keyed map of sidebar panel identifiers to the number of times each panel was opened. Each key represents a distinct sidebar panel
    (e.g., bookmarks, history, synced tabs).
- name: scalar_parent_sidebar_search_sum
  description: A keyed map of search context identifiers to the number of times a search was performed within the browser sidebar. Each key represents
    a distinct sidebar search scope.
- name: scalar_parent_storage_sync_api_usage_extensions_using_sum
  description: The total number of extensions that used the storage.sync API during the reporting period. A null value indicates no extensions made
    use of this API.
- name: scalar_parent_telemetry_event_counts_sum
  description: A keyed map of Telemetry event category/method/object keys to their summed occurrence counts, as recorded in the parent process. Each
    key identifies a distinct telemetry event type.
- name: scalar_parent_urlbar_impression_autofill_about_sum
  description: The total number of times the URL bar autofill feature showed a suggestion for an about; page (e.g., about:preferences) during the reporting
    period.
- name: scalar_parent_urlbar_impression_autofill_adaptive_sum
  description: The total number of times the URL bar autofill feature showed an adaptive history-based suggestion during the reporting period. Adaptive
    autofill learns from the user's navigation patterns.
- name: scalar_parent_urlbar_impression_autofill_origin_sum
  description: The total number of times the URL bar autofill feature completed the origin (scheme + host) portion of a URL based on browsing history
    during the reporting period.
- name: scalar_parent_urlbar_impression_autofill_other_sum
  description: The total number of times the URL bar autofill feature showed a suggestion that did not fall into any other categorised autofill type
    during the reporting period.
- name: scalar_parent_urlbar_impression_autofill_preloaded_sum
  description: The total number of times the URL bar autofill feature showed a suggestion sourced from Firefox's preloaded (built-in) list of top sites
    during the reporting period.
- name: scalar_parent_urlbar_impression_autofill_url_sum
  description: The total number of times the Firefox address bar (urlbar) displayed an autofill suggestion based on a full URL match during a given
    period. A non-null value indicates at least one autofill URL impression occurred.
- name: scalar_parent_urlbar_picked_autofill_about_sum
  description: A keyed sum recording how many times a user selected an autofill suggestion for an about; page (e.g., about:preferences) from the urlbar,
    broken down by key (e.g., search engine or entry point). Each array entry contains a key-value pair where the value is the pick count.
- name: scalar_parent_urlbar_picked_autofill_adaptive_sum
  description: A keyed sum recording how many times a user selected an adaptive-history autofill suggestion from the urlbar, broken down by key. Adaptive
    autofill learns from past URL selections to predict and complete the current input.
- name: scalar_parent_urlbar_picked_autofill_origin_sum
  description: A keyed sum recording how many times a user selected an origin-based autofill suggestion (e.g., a domain or host) from the urlbar, broken
    down by key. Each array entry contains a key-value pair where the value is the pick count.
- name: scalar_parent_urlbar_picked_autofill_other_sum
  description: A keyed sum recording how many times a user selected an autofill suggestion that does not fall into any other specific autofill category
    from the urlbar, broken down by key. Each array entry contains a key-value pair where the value is the pick count.
- name: scalar_parent_urlbar_picked_autofill_preloaded_sum
  description: A keyed sum recording how many times a user selected a preloaded autofill suggestion from the urlbar, broken down by key. Preloaded
    autofill suggestions are built into Firefox for popular domains.
- name: scalar_parent_urlbar_picked_autofill_sum
  description: A keyed sum recording the total number of times a user selected any autofill suggestion from the urlbar, broken down by key. This aggregates
    all autofill result types picked by the user.
- name: scalar_parent_urlbar_picked_autofill_url_sum
  description: A keyed sum recording how many times a user selected a full-URL autofill suggestion from the urlbar, broken down by key. Each array
    entry contains a key-value pair where the value is the pick count.
- name: scalar_parent_urlbar_picked_bookmark_sum
  description: A keyed sum recording how many times a user selected a bookmark result from the urlbar dropdown, broken down by key. Each array entry
    contains a key-value pair where the value is the pick count.
- name: scalar_parent_urlbar_picked_dynamic_sum
  description: A keyed sum recording how many times a user selected a dynamic result from the urlbar dropdown, broken down by key. Dynamic results
    are generated on-the-fly by urlbar providers such as Firefox Suggest.
- name: scalar_parent_urlbar_picked_extension_sum
  description: A keyed sum recording how many times a user selected a result contributed by a browser extension from the urlbar dropdown, broken down
    by key. Each array entry contains a key-value pair where the value is the pick count.
- name: scalar_parent_urlbar_picked_formhistory_sum
  description: A keyed sum recording how many times a user selected a form history suggestion from the urlbar dropdown, broken down by key. Form history
    results are previously entered search terms or form values.
- name: scalar_parent_urlbar_picked_history_sum
  description: A keyed sum recording how many times a user selected a browsing history result from the urlbar dropdown, broken down by key. Each array
    entry contains a key-value pair where the value is the pick count.
- name: scalar_parent_urlbar_picked_keyword_sum
  description: A keyed sum recording how many times a user selected a keyword search result from the urlbar dropdown, broken down by key. Keyword results
    are typically associated with bookmark keywords or search shortcuts.
- name: scalar_parent_urlbar_picked_remotetab_sum
  description: A keyed sum recording how many times a user selected a remote tab result (a tab open on another synced device) from the urlbar dropdown,
    broken down by key. Each array entry contains a key-value pair where the value is the pick count.
- name: scalar_parent_urlbar_picked_searchengine_sum
  description: A keyed sum recording how many times a user selected a search engine one-click shortcut result from the urlbar dropdown, broken down
    by key. Each array entry contains a key-value pair where the value is the pick count.
- name: scalar_parent_urlbar_picked_searchsuggestion_sum
  description: A keyed sum recording how many times a user selected a search suggestion result from the urlbar dropdown, broken down by key. Search
    suggestions are provided by the user's active search engine.
- name: scalar_parent_urlbar_picked_switchtab_sum
  description: A keyed sum recording how many times a user selected a switch-to-tab result from the urlbar dropdown, broken down by key. Switch-to-tab
    results allow users to navigate to an already-open tab.
- name: scalar_parent_urlbar_picked_tabtosearch_sum
  description: A keyed sum recording how many times a user selected a tab-to-search result from the urlbar dropdown, broken down by key. Tab-to-search
    results offer a quick way to search a site directly from the urlbar.
- name: scalar_parent_urlbar_picked_tip_sum
  description: A keyed sum recording how many times a user selected a tip result from the urlbar dropdown, broken down by key. Tip results are informational
    or action-oriented suggestions surfaced by Firefox.
- name: scalar_parent_urlbar_picked_topsite_sum
  description: A keyed sum recording how many times a user selected a top site result from the urlbar dropdown, broken down by key. Top site results
    are frequently or recently visited sites surfaced in the urlbar.
- name: scalar_parent_urlbar_picked_unknown_sum
  description: A keyed sum recording how many times a user selected a result of an unknown or unclassified type from the urlbar dropdown, broken down
    by key. Each array entry contains a key-value pair where the value is the pick count.
- name: scalar_parent_urlbar_picked_visiturl_sum
  description: A keyed sum recording how many times a user selected the heuristic 'visit URL' result from the urlbar dropdown, broken down by key.
    This result type is shown when the input looks like a navigable URL the user typed directly.
- name: scalar_parent_urlbar_searchmode_bookmarkmenu_sum
  description: A keyed sum recording how many times search mode was entered in the urlbar via the bookmark menu entry point, broken down by key (e.g.,
    search engine). Search mode restricts urlbar results to a specific search engine or local data source.
- name: scalar_parent_urlbar_searchmode_handoff_sum
  description: A keyed sum recording how many times search mode was entered in the urlbar via the new tab page handoff entry point, broken down by
    key. Handoff occurs when a user begins typing on the new tab page and focus is transferred to the urlbar.
- name: scalar_parent_urlbar_searchmode_keywordoffer_sum
  description: A keyed sum recording how many times search mode was entered in the urlbar via a keyword offer, broken down by key. A keyword offer
    is presented when the user types a search engine's domain, prompting them to enter search mode.
- name: scalar_parent_urlbar_searchmode_oneoff_sum
  description: A keyed sum recording how many times search mode was entered in the urlbar by clicking a one-off search engine button, broken down by
    key. One-off buttons appear at the bottom of the urlbar dropdown panel.
- name: scalar_parent_urlbar_searchmode_other_sum
  description: A keyed sum recording how many times search mode was entered in the urlbar via an entry point that does not fall into any other defined
    category, broken down by key. Each array entry contains a key-value pair where the value is the activation count.
- name: scalar_parent_urlbar_searchmode_shortcut_sum
  description: A keyed sum recording how many times search mode was entered in the urlbar via a keyboard shortcut, broken down by key. Each array entry
    contains a key-value pair where the value is the activation count.
- name: scalar_parent_urlbar_searchmode_tabmenu_sum
  description: A keyed sum recording how many times search mode was entered in the urlbar via the tab menu entry point, broken down by key. Each array
    entry contains a key-value pair where the value is the activation count.
- name: scalar_parent_urlbar_searchmode_tabtosearch_onboard_sum
  description: A keyed sum recording how many times search mode was entered via the tab-to-search onboarding experience in the urlbar, broken down
    by key. This entry point is shown to users being introduced to the tab-to-search feature for the first time.
- name: scalar_parent_urlbar_searchmode_tabtosearch_sum
  description: A keyed sum recording how many times search mode was entered in the urlbar via the tab-to-search result, broken down by key. Each array
    entry contains a key-value pair where the value is the activation count.
- name: scalar_parent_urlbar_searchmode_topsites_newtab_sum
  description: A keyed sum recording how many times search mode was entered in the urlbar by interacting with a top site on the new tab page, broken
    down by key. Each array entry contains a key-value pair where the value is the activation count.
- name: scalar_parent_urlbar_searchmode_topsites_urlbar_sum
  description: A keyed sum recording how many times search mode was entered in the urlbar by selecting a top site result within the urlbar dropdown,
    broken down by key. Each array entry contains a key-value pair where the value is the activation count.
- name: scalar_parent_urlbar_searchmode_touchbar_sum
  description: A keyed sum recording how many times search mode was entered in the urlbar via the macOS Touch Bar, broken down by key. Each array entry
    contains a key-value pair where the value is the activation count.
- name: scalar_parent_urlbar_searchmode_typed_sum
  description: A keyed sum recording how many times search mode was entered in the urlbar by the user manually typing a search mode token (e.g., '@engine'),
    broken down by key. Each array entry contains a key-value pair where the value is the activation count.
- name: scheduled_corpus_item_id
  description: A unique identifier (UUID) for a scheduled corpus item, representing a specific piece of content (e.g., an article or recommendation)
    that was scheduled for display in Firefox. This ID can be used to join with corpus scheduling data.
- name: search_access_point
  description: The UI entry point through which a search was initiated, such as 'urlbar', 'searchbar', 'contextmenu', 'urlbar_handoff', or 'tabhistory'.
    This field identifies where in the browser the user triggered the search action.
- name: search_adclicks_about_home_sum
  description: A keyed sum recording the number of ad clicks on search result pages that were initiated from the Firefox about:home page, broken down
    by search engine key. Each array entry contains a key-value pair where the value is the ad click count.
- name: search_adclicks_about_newtab_sum
  description: A keyed sum recording the number of ad clicks on search result pages that were initiated from the Firefox about:newtab page, broken
    down by search engine key. Each array entry contains a key-value pair where the value is the ad click count.
- name: search_adclicks_contextmenu_sum
  description: A keyed sum recording the number of ad clicks on search result pages that were initiated via the browser context menu (right-click search),
    broken down by search engine key. Each array entry contains a key-value pair where the value is the ad click count.
- name: search_adclicks_reload_sum
  description: A keyed sum recording the number of ad clicks on search result pages where the search originated from a page reload, broken down by
    search engine key. Each array entry contains a key-value pair where the value is the ad click count.
- name: search_adclicks_searchbar_sum
  description: A keyed sum recording the number of ad clicks on search result pages that were initiated from the Firefox search bar, broken down by
    search engine key. Each array entry contains a key-value pair where the value is the ad click count.
- name: search_adclicks_system_sum
  description: A keyed sum recording the number of ad clicks on search result pages that were initiated via a system-level search (e.g., OS search
    integration), broken down by search engine key. Each array entry contains a key-value pair where the value is the ad click count.
- name: search_adclicks_tabhistory_sum
  description: A keyed sum recording the number of ad clicks on search result pages that were initiated via tab history navigation, broken down by
    search engine key. Each array entry contains a key-value pair where the value is the ad click count.
- name: search_adclicks_unknown_sum
  description: A keyed sum recording the number of ad clicks on search result pages where the originating access point could not be determined or is
    unclassified, broken down by search engine key. Each array entry contains a key-value pair where the value is the ad click count.
- name: search_adclicks_urlbar_handoff_sum
  description: A keyed sum recording the number of ad clicks on search result pages that were initiated via the new tab page urlbar handoff mechanism,
    broken down by search engine key. Each array entry contains a key-value pair where the value is the ad click count.
- name: search_adclicks_urlbar_persisted_sum
  description: A keyed sum recording the number of ad clicks on search result pages where the search was initiated from the urlbar in a persisted search
    mode session, broken down by search engine key. Each array entry contains a key-value pair where the value is the ad click count.
- name: search_adclicks_urlbar_searchmode_sum
  description: A keyed sum recording the number of ad clicks on search result pages that were initiated from the urlbar while in search mode, broken
    down by search engine key. Each array entry contains a key-value pair where the value is the ad click count.
- name: search_adclicks_urlbar_sum
  description: A keyed sum recording the number of ad clicks on search result pages that were initiated from the Firefox urlbar (address bar), broken
    down by search engine key. Each array entry contains a key-value pair where the value is the ad click count.
- name: search_adclicks_webextension_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of ad clicks that originated from a WebExtension search
    entry point. Each entry represents a distinct search engine and its aggregated ad click count.
- name: search_cohort
  description: An identifier for the search experiment or cohort group the client was assigned to, used to track search-related A/B test participation.
    Values follow a date-based naming convention (e.g., 'nov17-2', 'apr18-1'); null indicates the client was not part of any search cohort.
- name: search_content_about_home_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches initiated from the Firefox about:home
    page. Each entry represents a distinct search engine and its aggregated search count for this entry point.
- name: search_content_about_newtab_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches initiated from the Firefox about:newtab
    page. Each entry represents a distinct search engine and its aggregated search count for this entry point.
- name: search_content_contextmenu_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches initiated via the browser context menu.
    Each entry represents a distinct search engine and its aggregated search count for this entry point.
- name: search_content_reload_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches that were triggered by reloading a search
    results page. Each entry represents a distinct search engine and its aggregated search count for this entry point.
- name: search_content_searchbar_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches initiated from the Firefox search bar.
    Each entry represents a distinct search engine and its aggregated search count for this entry point.
- name: search_content_system_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches initiated via a system-level entry point
    (e.g., OS search integration). Each entry represents a distinct search engine and its aggregated search count for this entry point.
- name: search_content_tabhistory_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches triggered via browser tab history navigation.
    Each entry represents a distinct search engine and its aggregated search count for this entry point.
- name: search_content_unknown_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches whose entry point could not be determined
    or classified. Each entry represents a distinct search engine and its aggregated search count for this entry point.
- name: search_content_urlbar_handoff_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches initiated via a URL bar handoff interaction,
    where input is passed from the new tab page search box to the URL bar. Each entry represents a distinct search engine and its aggregated search
    count for this entry point.
- name: search_content_urlbar_persisted_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches made from the URL bar where the search
    mode was persisted from a prior session. Each entry represents a distinct search engine and its aggregated search count for this entry point.
- name: search_content_urlbar_searchmode_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches performed from the URL bar while in search
    mode, where the user has explicitly selected a specific search engine. Each entry represents a distinct search engine and its aggregated search
    count for this entry point.
- name: search_content_urlbar_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches initiated from the Firefox URL bar (address
    bar). Each entry represents a distinct search engine and its aggregated search count for this entry point.
- name: search_content_webextension_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches initiated through a WebExtension search
    entry point. Each entry represents a distinct search engine and its aggregated search count for this entry point.
- name: search_count
  description: The total number of searches performed by the client during the reporting period, across all search engines and entry points. A null
    value indicates that search count data was not recorded or submitted.
- name: search_count_abouthome
  description: The total number of searches performed by the client using the about:home page as the entry point during the reporting period. A value
    of zero indicates no searches were made from this entry point.
- name: search_count_alias
  description: The total number of searches performed using a search engine alias (a shorthand keyword that triggers a specific search engine) as the
    entry point. A value of zero indicates no alias-triggered searches were made during the reporting period.
- name: search_count_all
  description: The total number of searches performed by the client across all search engines and all entry points during the reporting period. A value
    of zero indicates no searches were recorded.
- name: search_count_contextmenu
  description: The total number of searches initiated via the browser's right-click context menu during the reporting period. A value of zero indicates
    no searches were triggered from this entry point.
- name: search_count_newtab
  description: The total number of searches performed by the client using the new tab page as the entry point during the reporting period. A value
    of zero indicates no searches were made from this entry point.
- name: search_count_organic
  description: The total number of organic searches performed by the client, meaning searches that were not attributed to a search access point (SAP)
    partnership or tagged follow-on query. A value of zero indicates no organic searches were recorded during the reporting period.
- name: search_count_searchbar
  description: The total number of searches initiated from the dedicated Firefox search bar during the reporting period. A value of zero indicates
    no searches were made from this entry point.
- name: search_count_system
  description: The total number of searches triggered via a system-level integration (e.g., OS-level search) during the reporting period. A value of
    zero indicates no system-level searches were recorded.
- name: search_count_tagged_follow_on
  description: The total number of follow-on searches that were tagged with a search access point (SAP) partner code, meaning searches that occurred
    after an initial SAP search and retained the attribution tag. A value of zero indicates no tagged follow-on searches were recorded.
- name: search_count_tagged_sap
  description: The total number of searches attributed to a search access point (SAP) partnership, where the search query carries a partner attribution
    tag. A value of zero indicates no tagged SAP searches were recorded during the reporting period.
- name: search_count_urlbar
  description: The total number of searches initiated from the Firefox URL bar (address bar) during the reporting period. A value of zero indicates
    no URL bar searches were performed.
- name: search_count_urlbar_handoff
  description: The total number of searches performed via a URL bar handoff, where a query typed in the new tab page search box is handed off to and
    executed in the URL bar. A value of zero indicates no handoff searches were recorded.
- name: search_count_urlbar_persisted
  description: The total number of searches made from the URL bar while in a persisted search mode, where the search engine selection carried over
    from a previous interaction. A value of zero indicates no persisted URL bar searches were recorded.
- name: search_count_urlbar_searchmode
  description: The total number of searches performed from the URL bar while the user had explicitly activated search mode to target a specific search
    engine. A value of zero indicates no searches were made via this entry point during the reporting period.
- name: search_count_webextension
  description: The total number of searches initiated through a WebExtension-powered search entry point during the reporting period. A value of zero
    indicates no WebExtension-sourced searches were recorded.
- name: search_counts
  description: An array of structs capturing per-engine, per-source search counts, where each element contains the search engine name, the search entry
    point source, and the count of searches performed for that combination during the reporting period.
- name: search_engine
  description: The identifier of the default or most-used search engine for the client during the reporting period (e.g., 'google', 'google-b-d', 'duckduckgo').
    A null value indicates that no search engine preference was recorded or the client did not perform searches.
- name: search_with_ads
  description: The total number of search result pages containing ads that were viewed by the client during the reporting period. A null value indicates
    that no ad-containing search pages were detected or the data was not available.
- name: search_with_ads_count_all
  description: The total count of search result pages with ads viewed across all search engines and entry points during the reporting period. A null
    value indicates no such pages were detected or data was unavailable.
- name: search_withads_about_home_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of search result pages containing ads that were viewed
    from the about:home entry point. Each entry represents a distinct search engine and its aggregated ad-impression count for this entry point.
- name: search_withads_about_newtab_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of search result pages containing ads that were viewed
    from the about:newtab entry point. Each entry represents a distinct search engine and its aggregated ad-impression count for this entry point.
- name: search_withads_contextmenu_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of search result pages containing ads that were viewed
    after a context menu search. Each entry represents a distinct search engine and its aggregated ad-impression count for this entry point.
- name: search_withads_reload_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of search result pages containing ads that were viewed
    after a page reload search. Each entry represents a distinct search engine and its aggregated ad-impression count for this entry point.
- name: search_withads_searchbar_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of search result pages containing ads that were viewed
    after a search from the Firefox search bar. Each entry represents a distinct search engine and its aggregated ad-impression count for this entry
    point.
- name: search_withads_system_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of search result pages containing ads that were viewed
    after a system-level search. Each entry represents a distinct search engine and its aggregated ad-impression count for this entry point.
- name: search_withads_tabhistory_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of search result pages containing ads that were viewed
    after a tab history navigation search. Each entry represents a distinct search engine and its aggregated ad-impression count for this entry point.
- name: search_withads_unknown_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of search result pages containing ads that were viewed
    where the entry point source was unknown or unclassified. Each entry represents a distinct search engine and its aggregated ad-impression count
    for this entry point.
- name: search_withads_urlbar_handoff_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of search result pages containing ads that were viewed
    after a URL bar handoff search. Each entry represents a distinct search engine and its aggregated ad-impression count for this entry point.
- name: search_withads_urlbar_persisted_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of search result pages containing ads that were viewed
    after a persisted URL bar search mode search. Each entry represents a distinct search engine and its aggregated ad-impression count for this entry
    point.
- name: search_withads_urlbar_searchmode_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of search result pages containing ads that were viewed
    after a URL bar search mode search. Each entry represents a distinct search engine and its aggregated ad-impression count for this entry point.
- name: search_withads_urlbar_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of search result pages containing ads that were viewed
    after a URL bar search. Each entry represents a distinct search engine and its aggregated ad-impression count for this entry point.
- name: search_withads_webextension_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of search result pages containing ads that were viewed
    after a WebExtension-initiated search. Each entry represents a distinct search engine and its aggregated ad-impression count for this entry point.
- name: searches
  description: The total number of searches performed by the client during the reporting period, typically aggregated at the client or session level.
    A value of zero indicates that no searches were recorded.
- name: searches_per_user_ratio
  description: The average number of searches performed per active user within a given cohort or aggregation group during the reporting period. A value
    of 0.0 indicates no searches were performed on average across the group.
