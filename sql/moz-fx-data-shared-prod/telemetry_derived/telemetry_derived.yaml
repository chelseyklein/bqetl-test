- name: scalar_parent_datasanitization_privacy_clearOnShutdown_sessions
  description: Boolean indicating whether active logins (sessions) were configured to be cleared on shutdown (privacy.clearOnShutdown.sessions preference).
- name: scalar_parent_datasanitization_privacy_clearOnShutdown_siteSettings
  description: Boolean indicating whether site-specific settings (permissions, zoom levels) were configured to be cleared on shutdown (privacy.clearOnShutdown.siteSettings
    preference).
- name: scalar_parent_datasanitization_privacy_sanitize_sanitizeOnShutdown
  description: Boolean indicating whether the 'Clear history when Firefox closes' option was enabled (privacy.sanitize.sanitizeOnShutdown preference)
    in the parent process.
- name: scalar_parent_datasanitization_session_permission_exceptions
  description: Count of site permissions that were granted as session-only exceptions (not persisted across restarts) during this session.
- name: scalar_parent_devtools_aboutdevtools_installed
  description: Count of times the 'Install Firefox Developer Tools' action was triggered from the about:devtools page during the session.
- name: scalar_parent_devtools_aboutdevtools_noinstall_exits
  description: Count of times the user closed the about:devtools page without installing Developer Tools during the session.
