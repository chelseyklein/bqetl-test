  description: Count of credit card form fields autofilled using saved credit cards during the session.
- name: scalar_parent_formautofill_creditCards_fill_type_autofill_modified
  description: Count of credit card form fields autofilled and then modified by the user during the session.
- name: scalar_parent_formautofill_creditCards_fill_type_manual
  description: Count of credit card form fields filled manually by the user (not using autofill) during the session.
- name: scalar_parent_gfx_advanced_layers_failure_id
  description: Keyed count mapping failure ID codes to occurrence counts for Advanced Layers initialization failures during the session.
- name: scalar_parent_gfx_hdr_windows_display_colorspace_bitfield
  description: A bitfield representing the color space capabilities of connected displays on Windows, used for HDR (High Dynamic Range) feature detection.
- name: scalar_parent_idb_failure_fileinfo_error
  description: Count of IndexedDB file info errors encountered in the parent process during this session, indicating failures when reading file metadata
    for stored objects.
- name: scalar_parent_idb_type_persistent_count
  description: Count of persistent-type IndexedDB databases opened in the parent process during the session.
- name: scalar_parent_idb_type_temporary_count
  description: Count of temporary-type IndexedDB databases opened in the parent process during the session.
- name: scalar_parent_identity_fxaccounts_missed_commands_fetched
  description: Count of missed push commands that were later fetched by polling for Firefox Accounts in the parent process during this session.
- name: scalar_parent_images_webp_content_frequency
  description: Keyed scalar recording how frequently WebP images appeared in page content in the parent process, keyed by frequency bucket or context
    label.
- name: scalar_parent_images_webp_content_observed
  description: Boolean indicating whether any WebP image content was observed in the parent process during this session.
- name: scalar_parent_images_webp_probe_observed
  description: Boolean indicating whether the WebP image probe was triggered in the parent process during this session, meaning at least one WebP image
    was processed.
- name: scalar_parent_media_allowed_autoplay_no_audio_track_count
  description: Count of media elements in the parent process that were allowed to autoplay despite having no audio track.
- name: scalar_parent_media_autoplay_default_blocked
  description: Boolean indicating whether autoplay was blocked by the default autoplay policy as tracked by the parent process during this session.
- name: scalar_parent_media_autoplay_would_be_allowed_count
  description: Count of media elements in the parent process that would be allowed to autoplay under the current autoplay policy during this session.
- name: scalar_parent_media_autoplay_would_not_be_allowed_count
  description: Count of media elements in the parent process that would not be allowed to autoplay under the current autoplay policy during this session.
- name: scalar_parent_media_blocked_autoplay_no_audio_track_count
  description: Count of media elements in the parent process that were blocked from autoplaying because they had no audio track.
- name: scalar_parent_media_blocked_no_metadata
  description: Count of media elements in the parent process that were blocked from autoplaying because no metadata was available to determine their
    audio/video characteristics.
- name: scalar_parent_media_blocked_no_metadata_endup_no_audio_track
  description: Count of media elements in the parent process that were initially blocked due to missing metadata and subsequently determined to have
    no audio track.
