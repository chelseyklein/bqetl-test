    which is an unusual and potentially risky configuration.
- name: scalar_parent_pdf_viewer_fallback_shown
  description: Count of how many times the fallback option was shown in the parent process when the built-in PDF viewer could not render a PDF.
- name: scalar_parent_pdf_viewer_print
  description: Count of how many times the built-in PDF viewer's print function was used in the parent process during this session.
- name: scalar_parent_pdf_viewer_used
  description: Count of how many times the built-in PDF viewer was used to open a PDF document in the parent process during this session.
- name: scalar_parent_pictureinpicture_closed_method
  description: Keyed scalar counting how many times Picture-in-Picture windows were closed, keyed by the method used to close them (e.g., close button,
    keyboard shortcut).
- name: scalar_parent_preferences_browser_home_page_change
  description: Keyed count tracking changes to the browser home page setting, broken down by the new home page value or type.
- name: scalar_parent_preferences_browser_home_page_count
  description: Keyed count of how many home pages are configured, broken down by type.
- name: scalar_parent_preferences_created_new_user_prefs_file
  description: True if a new user preferences file (prefs.js) was created during this session; false otherwise.
- name: scalar_parent_preferences_prefs_file_was_invalid
  description: True if the user's prefs.js file was found to be invalid or unreadable at startup; false otherwise.
- name: scalar_parent_preferences_prevent_accessibility_services
  description: True if the user has set the preference to prevent external accessibility services from accessing Firefox; false otherwise.
- name: scalar_parent_preferences_read_user_js
  description: True if Firefox read and applied a user.js preferences override file at startup; false if no user.js was present.
- name: scalar_parent_preferences_search_query
  description: Keyed count of searches performed in the about:preferences search box, broken down by the search term used.
- name: scalar_parent_preferences_use_bookmark
  description: Keyed count of times the user set a bookmark as their home page in about:preferences, broken down by context.
- name: scalar_parent_preferences_use_current_page
  description: Keyed count of times the user set the current page as their home page in about:preferences.
- name: scalar_parent_pwmgr_potentially_breached_passwords
