  description: Count of pages that contained media elements as tracked by the parent process during this session.
- name: scalar_parent_media_page_had_media_count
  description: Count of pages that had active media (playing or paused) tracked by the parent process during this session.
- name: scalar_parent_media_page_had_play_revoked_count
  description: Count of pages tracked by the parent process where a media play was revoked due to autoplay policy during this session.
- name: scalar_parent_mediarecorder_recording_count
  description: Count of MediaRecorder recording sessions started in the parent process during the session.
- name: scalar_parent_navigator_storage_estimate_count
  description: Count of navigator.storage.estimate() calls made in the parent process during the session.
- name: scalar_parent_navigator_storage_persist_count
  description: Count of navigator.storage.persist() calls made in the parent process during the session.
- name: scalar_parent_network_tcp_overlapped_io_canceled_before_finished
  description: Count of TCP overlapped I/O operations that were canceled before completing, indicating potential network performance issues.
- name: scalar_parent_network_tcp_overlapped_result_delayed
  description: Count of TCP overlapped I/O operations that completed with a delayed result, indicating deferred network I/O completion.
- name: scalar_parent_networking_data_transferred
  description: Keyed scalar recording the amount of data transferred over the network in bytes during this session, keyed by transfer type or context.
- name: scalar_parent_networking_data_transferred_captive_portal
  description: Total bytes transferred to/from the captive portal detection endpoint during this session.
- name: scalar_parent_networking_data_transferred_kb
  description: Keyed scalar recording kilobytes of data transferred over the network during this session, keyed by transfer category or protocol type.
- name: scalar_parent_networking_data_transferred_v3_kb
  description: Keyed scalar recording kilobytes of data transferred over the network during this session (version 3 of the probe), keyed by transfer
