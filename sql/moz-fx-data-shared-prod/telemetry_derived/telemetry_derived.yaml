  description: Count of FTP channels opened for directory listing operations in the parent process during this session.
- name: scalar_parent_networking_http_connections_captive_portal
  description: Count of HTTP connections made to the captive portal detection endpoint during this session.
- name: scalar_parent_networking_http_transactions_captive_portal
  description: Count of HTTP transactions made to the captive portal detection endpoint during this session.
- name: scalar_parent_normandy_recipe_freshness
