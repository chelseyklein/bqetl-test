- name: scalar_parent_webrtc_hostnameobfuscation_disabled_succeeded
  description: Count of successful disabling of WebRTC hostname obfuscation in the parent process during this session.
- name: scalar_parent_webrtc_hostnameobfuscation_enabled_failed
  description: Count of failed attempts to enable WebRTC hostname obfuscation in the parent process during this session.
- name: scalar_parent_webrtc_hostnameobfuscation_enabled_succeeded
  description: Count of successful enabling of WebRTC hostname obfuscation (mDNS ICE candidates) in the parent process during this session.
- name: scalar_parent_webrtc_nicer_stun_retransmits
  description: Count of STUN packet retransmissions in the parent process during the session.
- name: scalar_parent_webrtc_nicer_turn_401s
  description: Count of 401 Unauthorized responses from TURN servers recorded in the parent process during the session.
- name: scalar_parent_webrtc_nicer_turn_403s
  description: Count of 403 Forbidden responses from TURN servers recorded in the parent process during the session.
- name: scalar_parent_webrtc_nicer_turn_438s
  description: Count of 438 Stale Nonce responses from TURN servers recorded in the parent process during the session.
- name: scalar_parent_webrtc_peerconnection_connected
  description: Count of WebRTC PeerConnections that successfully reached the connected state in the parent process during this session.
- name: scalar_parent_webrtc_peerconnection_datachannel_created
  description: Count of WebRTC data channels created in the parent process during this session.
- name: scalar_parent_webrtc_peerconnection_datachannel_max_life_used
  description: Count of WebRTC data channel connections in the parent process that used the maxPacketLifeTime parameter to limit how long packets can
    be retransmitted.
- name: scalar_parent_webrtc_peerconnection_datachannel_max_retx_and_life_used
  description: Count of WebRTC data channel connections in the parent process that used both the maxRetransmits and maxPacketLifeTime parameters simultaneously.
- name: scalar_parent_webrtc_peerconnection_datachannel_max_retx_used
  description: Count of WebRTC data channel connections in the parent process that used the maxRetransmits parameter to limit retransmissions.
- name: scalar_parent_webrtc_peerconnection_legacy_callback_stats_used
  description: Count of WebRTC PeerConnection sessions in the parent process that used the legacy callback-based stats API during the session.
- name: scalar_parent_webrtc_peerconnection_promise_and_callback_stats_used
  description: Count of WebRTC PeerConnection sessions in the parent process that used both the promise-based and legacy callback-based stats APIs
    during the session.
- name: scalar_parent_webrtc_peerconnection_promise_stats_used
  description: Count of WebRTC PeerConnection sessions in the parent process that used the promise-based stats API during the session.
- name: scalar_parent_widget_ime_name_on_linux
  description: Keyed boolean scalar recording which Input Method Editor (IME) names were in use on Linux, keyed by IME name. True indicates the IME
    was active at some point during the session.
- name: scalar_parent_widget_ime_name_on_mac
  description: Keyed boolean scalar recording which Input Method Editor (IME) names were in use on macOS, keyed by IME name. True indicates the IME
    was active at some point during the session.
- name: scalar_parent_widget_ime_name_on_windows
  description: Keyed boolean scalar recording which Input Method Editor (IME) names were in use on Windows, keyed by IME name. True indicates the IME
    was active at some point during the session.
- name: session_length
  description: The total length of the Firefox session in seconds, as reported at shutdown.
- name: session_restored
  description: The time in milliseconds from session restore start until the session restore is visually complete for the user.
- name: session_start_date
  description: The date and time (truncated to the hour) when the current Firefox session began, as reported by the client.
- name: shutdown_kill
  description: The number of times a hung process was forcibly killed during Firefox shutdown.
- name: ssl_handshake_result
  description: Keyed array of SSL/TLS handshake result code counts, mapping each NSS error code to the number of times it was observed during the session.
- name: ssl_handshake_result_failure
  description: The total count of failed SSL/TLS handshakes during the session.
- name: ssl_handshake_result_success
  description: The total count of successful SSL/TLS handshakes completed during the session.
- name: string_addon_scalars
  description: String scalars contributed by installed add-ons, structured as a map of add-on ID to string scalar value.
- name: subsession_counter
  description: The sequential count of subsessions within the current session, starting at 1.
- name: total_time
  description: The total wall-clock time in seconds that Firefox was running during the session, including time spent in the background.
- name: uint_addon_scalars
  description: Unsigned integer scalars contributed by installed add-ons, structured as a map of add-on ID to integer scalar value.
- name: user_pref_browser_launcherprocess_enabled
  description: Boolean value of the 'browser.launcherProcess.enabled' preference, indicating whether the Firefox launcher process (a sandboxed parent
    process) was enabled.
- name: user_pref_browser_search_widget_innavbar
  description: True if the browser search widget is placed in the navigation bar; false if it is not present in the navbar.
- name: user_pref_dom_ipc_plugins_sandbox_level_flash
  description: The value of the 'dom.ipc.plugins.sandbox-level.flash' user preference, which controls the sandbox security level applied to the Flash
    plugin process.
- name: user_pref_dom_ipc_processcount
  description: The value of the dom.ipc.processCount preference, controlling the maximum number of content processes Firefox will spawn.
- name: user_pref_extensions_allow_non_mpc_extensions
  description: True if the user's preference allows non-multiprocess-compatible extensions to run; false if such extensions are blocked.
- name: user_pref_extensions_legacy_enabled
  description: True if the legacy (non-WebExtension) add-on support preference is enabled; false if legacy add-ons are blocked.
- name: user_pref_general_config_filename
  description: The filename of a general configuration file (general.config.filename preference) if set by an enterprise policy or admin; empty string
    otherwise.
- name: user_pref_gfx_webrender_all_qualified
  description: Boolean value of the 'gfx.webrender.all.qualified' preference, controlling whether WebRender is enabled for all qualified hardware.
- name: user_pref_marionette_enabled
  description: Boolean value of the 'marionette.enabled' user preference, indicating whether the Marionette remote protocol (used for automated testing)
    was enabled.
- name: user_pref_network_trr_mode
  description: Integer value of the 'network.trr.mode' preference, controlling the Trusted Recursive Resolver (DNS-over-HTTPS) mode (0=off, 2=first,
    3=only, etc.).
- name: user_pref_privacy_fuzzyfox_enabled
  description: Boolean value of the 'privacy.fuzzyfox.enabled' preference, indicating whether FuzzyFox (timer fuzzing to reduce fingerprinting via
    timing side-channels) was enabled.
- name: user_pref_security_enterprise_roots_auto_enabled
  description: Boolean value of the 'security.enterprise_roots.auto_enabled' preference, indicating whether enterprise root trust was automatically
    enabled (e.g., due to MITM detection).
- name: user_pref_security_enterprise_roots_enabled
  description: Boolean value of the 'security.enterprise_roots.enabled' preference, indicating whether Firefox trusts certificate authorities from
    the OS enterprise trust store.
- name: user_pref_security_pki_mitm_detected
  description: Boolean value of the 'security.pki.mitm_detected' preference, indicating whether a TLS man-in-the-middle interception was detected via
    certificate analysis.
- name: user_prefs
