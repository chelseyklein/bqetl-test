- name: scalar_content_dom_event_confluence_load_count
  description: Keyed scalar counting how many times the Microsoft Confluence web application was loaded in content processes, keyed by event context.
- name: scalar_content_dom_event_office_online_load_count
  description: Keyed scalar counting how many times Microsoft Office Online was loaded in content processes, keyed by event context.
- name: scalar_content_encoding_override_used
  description: Boolean indicating whether a character encoding override was applied in content processes during this session.
- name: scalar_content_gfx_omtp_paint_wait_ratio
  description: Ratio measuring how much time the main thread spent waiting for Off-Main-Thread Painting (OMTP) to complete in content processes, as
    an indicator of paint scheduling overhead.
- name: scalar_content_gfx_small_paint_phase_weight
  description: Keyed scalar recording the relative weight of small paint phases within the rendering pipeline in content processes.
- name: scalar_content_idb_type_persistent_count
  description: Count of persistent-type IndexedDB databases opened in content processes during the session.
- name: scalar_content_idb_type_temporary_count
  description: Count of temporary-type IndexedDB databases opened in content processes during the session.
- name: scalar_content_images_webp_content_frequency
  description: Keyed scalar recording how frequently WebP images appeared in page content in content processes, keyed by frequency bucket or context
    label.
- name: scalar_content_images_webp_content_observed
  description: Boolean indicating whether any WebP image content was observed (i.e., loaded or referenced) in content processes during this session.
- name: scalar_content_images_webp_probe_observed
  description: Boolean indicating whether the WebP image probe was triggered in content processes during this session, meaning at least one WebP image
    was processed.
- name: scalar_content_mathml_doc_count
  description: Count of documents containing MathML that were loaded in content processes during the session.
- name: scalar_content_media_allowed_autoplay_no_audio_track_count
  description: Count of media elements in content processes that were allowed to autoplay despite having no audio track, typically because the autoplay
    policy permits muted or silent media.
- name: scalar_content_media_autoplay_default_blocked
  description: Boolean indicating whether autoplay was blocked by the default autoplay policy in content processes during this session.
- name: scalar_content_media_autoplay_would_be_allowed_count
  description: Count of media elements in content processes that would be allowed to autoplay under the current autoplay policy during this session.
- name: scalar_content_media_autoplay_would_not_be_allowed_count
  description: Count of media elements in content processes that would not be allowed to autoplay under the current autoplay policy during this session.
- name: scalar_content_media_blocked_autoplay_no_audio_track_count
  description: Count of media elements in content processes that were blocked from autoplaying because they had no audio track (and thus could not
    qualify for unmuted autoplay exemptions).
- name: scalar_content_media_blocked_no_metadata
  description: Count of media elements in content processes that were blocked from autoplaying because no metadata was available to determine their
    audio/video characteristics.
- name: scalar_content_media_blocked_no_metadata_endup_no_audio_track
  description: Count of media elements in content processes that were initially blocked due to missing metadata and subsequently determined to have
    no audio track.
- name: scalar_content_media_page_count
  description: Count of pages that contained media elements in content processes during this session.
- name: scalar_content_media_page_had_media_count
  description: Count of pages in content processes that had active media (playing or paused) during this session.
- name: scalar_content_media_page_had_play_revoked_count
  description: Count of pages in content processes where a media play was revoked (e.g., due to autoplay blocking) during this session.
- name: scalar_content_mediarecorder_recording_count
  description: Count of MediaRecorder recording sessions started in content processes during the session.
- name: scalar_content_memoryreporter_max_ghost_windows
  description: The maximum number of ghost windows (unresponsive windows) observed by the memory reporter in content processes during the session.
- name: scalar_content_navigator_storage_estimate_count
  description: Count of navigator.storage.estimate() calls made in content processes during the session.
- name: scalar_content_navigator_storage_persist_count
  description: Count of navigator.storage.persist() calls made in content processes during the session.
- name: scalar_content_pdf_viewer_fallback_shown
  description: Count of how many times the fallback (download/external viewer) option was shown in content processes when the built-in PDF viewer encountered
    an unsupported PDF.
- name: scalar_content_pdf_viewer_print
  description: Count of how many times the built-in PDF viewer's print function was used in content processes during this session.
- name: scalar_content_pdf_viewer_used
  description: Count of how many times the built-in PDF viewer was used in content processes to render a PDF document during this session.
- name: scalar_content_pictureinpicture_opened_method
  description: Keyed scalar counting how many times Picture-in-Picture was activated in content processes, keyed by the method used to open it (e.g.,
    button hover, keyboard shortcut).
- name: scalar_content_script_preloader_mainthread_recompile
  description: Count of how many times the script preloader forced a main-thread recompilation in content processes during this session, indicating
    a preloaded script was not usable.
- name: scalar_content_sw_alternative_body_used_count
  description: Count of Service Worker responses using an alternative body (opaque redirect) in content processes during the session.
- name: scalar_content_sw_cors_res_for_so_req_count
  description: Count of CORS responses served by Service Workers for same-origin requests in content processes during the session.
- name: scalar_content_sw_synthesized_res_count
  description: Count of synthesized (non-network) responses provided by Service Workers in content processes during the session.
- name: scalar_content_telemetry_accumulate_unknown_histogram_keys
  description: Keyed count of accumulations into unknown histogram keys in content processes, indicating potential telemetry probe mismatches.
- name: scalar_content_telemetry_discarded_accumulations
  description: Count of telemetry histogram accumulations discarded in content processes because the histogram was not found or was invalid.
- name: scalar_content_telemetry_discarded_child_events
  description: Count of telemetry events from child processes that were discarded due to event buffer overflow in content processes.
- name: scalar_content_telemetry_discarded_keyed_accumulations
  description: Count of keyed histogram accumulations discarded in content processes due to unknown histogram keys or capacity limits.
- name: scalar_content_telemetry_discarded_keyed_scalar_actions
  description: Count of keyed scalar actions discarded in content processes because the scalar was unknown or the buffer was full.
- name: scalar_content_telemetry_discarded_scalar_actions
  description: Count of scalar actions discarded in content processes because the scalar was unknown or capacity was exceeded.
- name: scalar_content_telemetry_event_counts
  description: Keyed count of telemetry events recorded in content processes, broken down by event category and method key.
- name: scalar_content_telemetry_process_creation_timestamp_inconsistent
  description: Count of how many times the process creation timestamp was found to be inconsistent in content processes, potentially indicating clock
    skew or process recycling issues.
- name: scalar_content_telemetry_profile_directory_scans
  description: Count of how many times the telemetry subsystem scanned the profile directory in content processes during the session.
- name: scalar_content_webrtc_hostnameobfuscation_disabled_failed
  description: Count of failed attempts to disable WebRTC hostname obfuscation in content processes during this session.
- name: scalar_content_webrtc_hostnameobfuscation_disabled_succeeded
  description: Count of successful disabling of WebRTC hostname obfuscation in content processes during this session.
- name: scalar_content_webrtc_hostnameobfuscation_enabled_failed
  description: Count of failed attempts to enable WebRTC hostname obfuscation (mDNS ICE candidates) in content processes during this session.
- name: scalar_content_webrtc_hostnameobfuscation_enabled_succeeded
  description: Count of successful enabling of WebRTC hostname obfuscation in content processes during this session.
- name: scalar_content_webrtc_nicer_stun_retransmits
  description: Count of STUN packet retransmissions in content processes during the session, as measured by the ICE library (nICEr).
- name: scalar_content_webrtc_nicer_turn_401s
  description: Count of 401 Unauthorized responses received from TURN servers in content processes during the session.
- name: scalar_content_webrtc_nicer_turn_403s
  description: Count of 403 Forbidden responses received from TURN servers in content processes during the session.
- name: scalar_content_webrtc_nicer_turn_438s
  description: Count of 438 Stale Nonce responses received from TURN servers in content processes during the session.
- name: scalar_content_webrtc_peerconnection_connected
  description: Count of WebRTC PeerConnections that successfully reached the connected state in content processes during this session.
- name: scalar_content_webrtc_peerconnection_datachannel_created
  description: Count of WebRTC data channels created in content processes during this session.
- name: scalar_content_webrtc_peerconnection_datachannel_max_life_used
  description: Count of WebRTC data channel connections in content processes that used the maxPacketLifeTime parameter.
- name: scalar_content_webrtc_peerconnection_datachannel_max_retx_and_life_used
  description: Count of WebRTC data channel connections in content processes that used both the maxRetransmits and maxPacketLifeTime parameters simultaneously.
- name: scalar_content_webrtc_peerconnection_datachannel_max_retx_used
  description: Count of WebRTC data channel connections in content processes that used the maxRetransmits parameter to limit retransmissions.
- name: scalar_content_webrtc_peerconnection_legacy_callback_stats_used
  description: Count of WebRTC PeerConnection sessions in content processes that used the legacy callback-based stats API during the session.
- name: scalar_content_webrtc_peerconnection_promise_and_callback_stats_used
  description: Count of WebRTC PeerConnection sessions in content processes that used both the promise-based and legacy callback-based stats APIs during
    the session.
- name: scalar_content_webrtc_peerconnection_promise_stats_used
  description: Count of WebRTC PeerConnection sessions in content processes that used the promise-based stats API during the session.
- name: scalar_content_webrtc_sdp_parser_diff
  description: Keyed scalar counting differences found between two SDP (Session Description Protocol) parser implementations in content processes,
    keyed by the type of difference observed.
- name: scalar_content_webrtc_video_recv_codec_used
  description: Keyed scalar counting how many times each video codec was used for receiving video in WebRTC sessions in content processes, keyed by
    codec name.
- name: scalar_content_webrtc_video_send_codec_used
  description: Keyed scalar counting how many times each video codec was used for sending video in WebRTC sessions in content processes, keyed by codec
    name.
- name: scalar_gpu_browser_usage_graphite
  description: Count of Graphite font rendering usages observed in the GPU process during the session.
- name: scalar_gpu_telemetry_accumulate_unknown_histogram_keys
  description: Keyed count of accumulations into unknown histogram keys in the GPU process, indicating potential telemetry probe mismatches.
- name: scalar_gpu_telemetry_discarded_accumulations
  description: Count of telemetry histogram accumulations discarded in the GPU process.
- name: scalar_gpu_telemetry_discarded_child_events
  description: Count of telemetry events from the GPU process that were discarded due to event buffer overflow.
- name: scalar_gpu_telemetry_discarded_keyed_accumulations
  description: Count of keyed histogram accumulations discarded in the GPU process.
- name: scalar_gpu_telemetry_discarded_keyed_scalar_actions
  description: Count of keyed scalar actions discarded in the GPU process due to unknown scalars or capacity limits.
- name: scalar_gpu_telemetry_discarded_scalar_actions
  description: Count of scalar actions discarded in the GPU process.
- name: scalar_gpu_telemetry_event_counts
  description: Keyed count of telemetry events recorded in the GPU process, broken down by event category and method key.
- name: scalar_gpu_telemetry_profile_directory_scans
  description: Count of how many times the telemetry subsystem scanned the profile directory in the GPU process during the session.
- name: scalar_parent_a11y_backplate
  description: Boolean indicating whether the accessibility backplate feature (which adds a background behind text for readability with high-contrast
    themes) was active during this session.
- name: scalar_parent_a11y_indicator_acted_on
  description: True if the user took an action on the accessibility indicator (e.g. clicked it in the toolbar) during the session; false otherwise.
- name: scalar_parent_a11y_instantiators
  description: String identifying the application or process that instantiated accessibility support in Firefox during the session.
- name: scalar_parent_a11y_theme
  description: Keyed boolean scalar recording which Windows high-contrast or accessibility themes were active during the session, keyed by theme name.
- name: scalar_parent_blocklist_lastModified_rs_addons
  description: Timestamp string of when the Remote Settings-based add-ons blocklist was last modified, as recorded by the parent process.
- name: scalar_parent_blocklist_lastModified_rs_plugins
  description: Timestamp string of when the Remote Settings-based plugins blocklist was last modified, as recorded by the parent process.
- name: scalar_parent_blocklist_lastModified_xml
  description: Timestamp string of when the XML-based addon/plugin blocklist was last modified, as recorded by the parent process.
- name: scalar_parent_blocklist_useXML
  description: Boolean indicating whether the legacy XML-based blocklist (rather than the Remote Settings-based blocklist) was in use in the parent
    process during this session.
- name: scalar_parent_browser_engagement_active_ticks
  description: Count of 5-second ticks during which the user was active in the browser, as recorded by the engagement scalar in the parent process.
- name: scalar_parent_browser_engagement_max_concurrent_tab_count
  description: The maximum number of tabs open simultaneously across all windows during the session.
- name: scalar_parent_browser_engagement_max_concurrent_tab_pinned_count
  description: The maximum number of pinned tabs open simultaneously across all windows during this session.
- name: scalar_parent_browser_engagement_max_concurrent_window_count
  description: The maximum number of browser windows open simultaneously during the session.
- name: scalar_parent_browser_engagement_navigation_about_home
  description: Keyed count of navigations originating from the about:home new-tab page, broken down by search engine or action.
- name: scalar_parent_browser_engagement_navigation_about_newtab
  description: Keyed count of navigations originating from the about:newtab page, broken down by search engine or action.
- name: scalar_parent_browser_engagement_navigation_contextmenu
  description: Keyed count of navigations initiated via the browser context menu (e.g. 'Search for …'), broken down by search engine.
- name: scalar_parent_browser_engagement_navigation_searchbar
  description: Keyed count of navigations initiated from the dedicated search bar, broken down by search engine.
- name: scalar_parent_browser_engagement_navigation_urlbar
  description: Keyed count of navigations initiated from the URL bar (address bar), broken down by search engine or direct navigation type.
- name: scalar_parent_browser_engagement_navigation_webextension
  description: Keyed scalar counting navigations initiated by WebExtensions, keyed by extension ID or navigation context. Increments when a WebExtension
    triggers a navigation.
- name: scalar_parent_browser_engagement_restored_pinned_tabs_count
  description: Count of pinned tabs restored from a previous session during session restore.
- name: scalar_parent_browser_engagement_tab_open_event_count
  description: Count of new tabs opened by the user during the session.
- name: scalar_parent_browser_engagement_tab_pinned_event_count
  description: Count of tab pin events (tabs pinned by the user) that occurred during this session.
- name: scalar_parent_browser_engagement_total_uri_count
  description: Total count of URIs visited (filtered to exclude about; pages and similar internal URLs) during the session.
- name: scalar_parent_browser_engagement_unfiltered_uri_count
  description: Total count of URIs visited including internal pages (about:, chrome:, etc.) during the session.
- name: scalar_parent_browser_engagement_unique_domains_count
  description: Count of unique eTLD+1 domains visited by the user during the session.
- name: scalar_parent_browser_engagement_window_open_event_count
  description: Count of new browser windows opened by the user during the session.
- name: scalar_parent_browser_errors_collected_count
  description: Count of browser errors collected by the error reporting system in the parent process during the session.
- name: scalar_parent_browser_errors_collected_count_by_filename
  description: Keyed count of browser errors collected in the parent process, broken down by the source filename where the error occurred.
- name: scalar_parent_browser_errors_collected_with_stack_count
  description: Count of browser errors collected in the parent process that included a stack trace.
- name: scalar_parent_browser_errors_reported_failure_count
  description: Count of browser error reports that failed to be submitted to the error reporting service during the session.
- name: scalar_parent_browser_errors_reported_success_count
  description: Count of browser error reports that were successfully submitted to the error reporting service during the session.
- name: scalar_parent_browser_errors_sample_rate
  description: The sampling rate string applied to browser error collection, controlling what fraction of errors are reported.
- name: scalar_parent_browser_feeds_feed_subscribed
  description: Count of feed subscriptions initiated by the user during the session.
- name: scalar_parent_browser_feeds_livebookmark_count
  description: The current count of live bookmarks stored in the user's profile at session end.
- name: scalar_parent_browser_feeds_livebookmark_item_opened
  description: Count of individual live bookmark items opened by the user during the session.
- name: scalar_parent_browser_feeds_livebookmark_opened
  description: Count of live bookmark folders opened by the user during the session.
- name: scalar_parent_browser_feeds_preview_loaded
  description: Count of feed preview pages loaded in the parent process during the session.
- name: scalar_parent_browser_search_ad_clicks
  description: Keyed scalar counting how many times users clicked on search advertisements, keyed by search engine and ad placement context.
- name: scalar_parent_browser_search_with_ads
  description: Keyed scalar counting how many search result pages included advertisements, keyed by search engine and placement context.
- name: scalar_parent_browser_searchinit_engines_cache_corrupted
  description: Boolean indicating whether the search engines cache file was found to be corrupted during search service initialization in the parent
    process.
- name: scalar_parent_browser_session_restore_browser_startup_page
  description: The configured startup page behavior for session restore (maps to the browser.startup.page preference value).
- name: scalar_parent_browser_session_restore_browser_tabs_restorebutton
  description: Count of times the 'Restore Tabs' button was shown in the session restore UI during startup.
- name: scalar_parent_browser_session_restore_number_of_tabs
  description: The number of tabs restored from the previous session during session restore at startup.
- name: scalar_parent_browser_session_restore_number_of_win
  description: The number of windows restored from the previous session during session restore at startup.
- name: scalar_parent_browser_session_restore_tabbar_restore_available
  description: True if a tab bar restore option was available at session startup; false otherwise.
- name: scalar_parent_browser_session_restore_tabbar_restore_clicked
  description: True if the user clicked the tab bar restore button during session restore at startup; false otherwise.
- name: scalar_parent_browser_session_restore_worker_restart_count
  description: Count of times the session restore worker was restarted during the session, which may indicate session store write failures.
- name: scalar_parent_browser_timings_last_shutdown
  description: The duration in milliseconds of the last Firefox shutdown, measuring how long the shutdown process took.
- name: scalar_parent_browser_usage_graphite
  description: Count of Graphite font rendering usages observed in the parent process during the session.
- name: scalar_parent_browser_usage_plugin_instantiated
  description: Count of plugin instantiations observed in the parent process during the session.
- name: scalar_parent_contentblocking_category
  description: Integer indicating the Enhanced Tracking Protection category level selected by the user (e.g., 0=standard, 1=strict, 2=custom).
- name: scalar_parent_contentblocking_cryptomining_blocking_enabled
  description: Boolean indicating whether cryptomining blocking was enabled as part of Enhanced Tracking Protection in the parent process during this
    session.
- name: scalar_parent_contentblocking_enabled
  description: Boolean indicating whether content blocking (Enhanced Tracking Protection) was enabled in the parent process during this session.
- name: scalar_parent_contentblocking_exceptions
  description: Count of sites added to the content blocking exceptions list (sites where Enhanced Tracking Protection is disabled) in the parent process
    during this session.
- name: scalar_parent_contentblocking_fastblock_enabled
  description: Boolean indicating whether the FastBlock feature of content blocking was enabled in the parent process during this session.
- name: scalar_parent_contentblocking_fingerprinting_blocking_enabled
  description: Boolean indicating whether fingerprinting blocking was enabled as part of Enhanced Tracking Protection in the parent process during
    this session.
- name: scalar_parent_contentblocking_trackers_blocked_count
  description: Count of trackers that were blocked by Enhanced Tracking Protection in the parent process during this session.
- name: scalar_parent_corroborate_omnijar_corrupted
  description: Boolean indicating whether the omnijar file (Firefox's main resource archive) was detected as corrupted during the corroboration check
    in this session.
- name: scalar_parent_corroborate_system_addons_corrupted
  description: Boolean indicating whether system add-ons were detected as corrupted during the corroboration check in this session.
- name: scalar_parent_datasanitization_network_cookie_lifetimePolicy
  description: Integer indicating the cookie lifetime policy in use (network.cookie.lifetimePolicy preference); 0=accept normally, 1=ask for each,
    2=accept for session only, 3=accept for N days.
- name: scalar_parent_datasanitization_privacy_clearOnShutdown_cache
  description: Boolean indicating whether the browser cache was configured to be cleared on shutdown (privacy.clearOnShutdown.cache preference).
- name: scalar_parent_datasanitization_privacy_clearOnShutdown_cookies
  description: Boolean indicating whether cookies were configured to be cleared on shutdown (privacy.clearOnShutdown.cookies preference).
- name: scalar_parent_datasanitization_privacy_clearOnShutdown_downloads
  description: Boolean indicating whether download history was configured to be cleared on shutdown (privacy.clearOnShutdown.downloads preference).
- name: scalar_parent_datasanitization_privacy_clearOnShutdown_formdata
  description: Boolean indicating whether form and search history was configured to be cleared on shutdown (privacy.clearOnShutdown.formdata preference).
- name: scalar_parent_datasanitization_privacy_clearOnShutdown_history
  description: Boolean indicating whether browsing and download history was configured to be cleared on shutdown (privacy.clearOnShutdown.history preference).
- name: scalar_parent_datasanitization_privacy_clearOnShutdown_offlineApps
  description: Boolean indicating whether offline application data was configured to be cleared on shutdown (privacy.clearOnShutdown.offlineApps preference).
- name: scalar_parent_datasanitization_privacy_clearOnShutdown_openWindows
  description: Boolean indicating whether open windows and tabs were configured to be closed on shutdown for data sanitization (privacy.clearOnShutdown.openWindows
