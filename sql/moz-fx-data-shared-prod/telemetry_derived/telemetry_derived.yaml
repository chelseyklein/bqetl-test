fields:
- name: CLICK_COUNT
  description: The total number of clicks recorded for a given tile or content item. A value of 0 indicates the item was displayed but never clicked.
- name: DISMISS_COUNT
  description: The total number of times a tile or content item was dismissed by the user. A value of 0 indicates the item was never dismissed.
- name: ER
  description: Engagement rate expressed as a float, representing the ratio of user interactions to total impressions for a given item or campaign.
    Higher values indicate greater user engagement.
- name: HAPPENED_AT
  description: The calendar date on which the event or aggregation occurred. Used to partition and filter records by the date of activity.
- name: IMPRESSION_COUNT
  description: The total number of times a tile or content item was displayed to users. Represents raw exposure volume prior to any user interaction.
- name: POSITION
  description: The zero-based index position of a tile or content item within its display grid or list. Lower values indicate placement closer
    to the top-left of the layout.
- name: SAVE_COUNT
  description: The total number of times a tile or content item was saved by the user, such as via a Pocket save action. A value of 0 indicates
    the item was never saved.
- name: TILE_ID
  description: A unique numeric identifier for a sponsored or organic tile served on the Firefox New Tab page. Used to join tile-level engagement
    metrics across tables.
- name: _GS_FILE_DATE
  description: The date partition label extracted from the source Google Cloud Storage file path, formatted as 'date=YYYY-MM-DD'. Indicates which
    day's data the source file corresponds to.
- name: _GS_FILE_NAME
  description: The full path of the source file in Google Cloud Storage from which the record was loaded. Used for lineage tracking and deduplication
    of ingested data.
- name: _GS_FILE_ROW_NUMBER
  description: The 1-based row number of the record within its source Google Cloud Storage file. Used together with the file name to uniquely
    identify the origin of each row.
- name: _GS_FILE_TIME
  description: The time partition label extracted from the source Google Cloud Storage file path, typically formatted as 'time=HH-MM-SS-mmm'.
    Identifies which intra-day export batch the file belongs to.
- name: _LOADED_AT
  description: The Unix epoch timestamp in nanoseconds at which the record was loaded into BigQuery from its source file. Used for auditing and
    incremental load tracking.
- name: a11y_theme
  description: An array of key-value pairs indicating which accessibility themes are enabled in the browser. Each entry maps an accessibility
    theme name to a boolean indicating whether it is active.
- name: aborts_content_sum
  description: The total number of content-process abort events recorded for a client during the aggregation period. A null value indicates no
    content-process abort data was collected.
- name: aborts_gmplugin_sum
  description: The total number of Gecko Media Plugin (GMP) process abort events recorded for a client during the aggregation period. A null value
    indicates no GMP abort data was collected.
- name: aborts_plugin_sum
  description: The total number of legacy plugin process abort events recorded for a client during the aggregation period. A null value indicates
    no plugin abort data was collected.
- name: account_enabled
  description: Indicates whether the associated user account is currently enabled. True means the account is active; false means it has been disabled;
    null indicates the status is unknown.
- name: activated
  description: Indicates whether the client or feature has been activated. True means activation has occurred; false means it has not.
- name: active_addon_name
  description: The human-readable display name of an active browser add-on or extension installed by the user. A null value indicates the add-on
    name could not be determined.
- name: active_addons
  description: A structured array containing details about each add-on currently active in the browser, including identifiers, version, type,
    installation source, and compatibility flags.
- name: active_addons_count_mean
  description: The mean number of active add-ons across the sessions or days within the aggregation period for a client. Reflects typical add-on
    load rather than a point-in-time snapshot.
- name: active_clients
  description: The number of distinct clients that were active during the aggregation period. Used to measure reach or participation across a
    population segment.
- name: active_experiment_branch
  description: The branch of a legacy active experiment the client was enrolled in, such as 'control' or 'treatment'. A null value indicates no
    legacy experiment enrollment was recorded.
- name: active_experiment_id
  description: The identifier of a legacy active experiment the client was enrolled in. A null value indicates no legacy experiment enrollment
    was recorded.
- name: active_hours
  description: The total number of hours during which the browser was actively used (i.e., the user was interacting with it) during the aggregation
    period. A null value indicates no activity data was available.
- name: active_hours_per_user_ratio
  description: The average number of active hours per user within the aggregation period, computed as total active hours divided by the number
    of active users. Useful for comparing engagement intensity across segments.
- name: active_hours_sum
  description: The total sum of active browsing hours accumulated across all sessions or days within the aggregation period. A value of 0 indicates
    the client was present but had no recorded active time.
- name: active_metric_date
  description: Indicates whether the record's date qualifies as an active metric date for the client. True means the date counts toward activity-based
    metrics; false means it does not; null indicates the classification could not be determined.
- name: activity_date_week
  description: The Monday-aligned start date of the ISO week in which client activity occurred. Used to aggregate and compare activity at weekly
    granularity.
- name: activity_segment
  description: A categorical label classifying the client's usage frequency into a segment such as 'core_user', 'regular_user', 'casual_user',
    'infrequent_user', or 'other'. Derived from active hours or days of use within a period.
- name: ad_clicks
  description: The total number of clicks on advertisements recorded for a client during the aggregation period. A null value indicates no ad
    click data was available for that period.
- name: ad_clicks_count_all
  description: The total count of all ad click events across all ad types for a client during the aggregation period. A null value indicates no
    ad click data was collected.
- name: additive_terms
  description: The combined sum of all additive component contributions in a time-series forecast model (e.g., trend, seasonality, holidays).
    Represents the total modeled signal before uncertainty bounds are applied.
- name: additive_terms_lower
  description: The lower bound of the combined additive forecast components, reflecting the uncertainty interval around the additive terms estimate.
    Used to construct prediction interval lower bounds.
- name: additive_terms_upper
  description: The upper bound of the combined additive forecast components, reflecting the uncertainty interval around the additive terms estimate.
    Used to construct prediction interval upper bounds.
- name: addon_compatibility_check_enabled
  description: Indicates whether the browser's add-on compatibility checking feature is enabled. True means compatibility checks are active; false
    means they have been disabled.
- name: addon_id
  description: The unique identifier string for a browser add-on or extension, typically in reverse-DNS or GUID format (e.g., 'formautofill@mozilla.org').
    Used to join add-on records across datasets.
- name: adjust_ad_group
  description: The ad group name and identifier from the Adjust mobile measurement platform associated with a client's install or attribution
    event. A null value indicates no Adjust ad group attribution was recorded.
- name: adjust_campaign
  description: The campaign name from the Adjust mobile measurement platform associated with a client's install or attribution event, such as
    'Organic' for unattributed installs. A null value indicates no Adjust campaign attribution was recorded.
- name: adjust_creative
  description: The creative name or identifier from the Adjust mobile measurement platform associated with a client's install attribution, describing
    the specific ad creative shown. A null value indicates no Adjust creative attribution was recorded.
- name: adjust_network
  description: The advertising network name from the Adjust mobile measurement platform through which a client was acquired, such as 'Organic'
    or 'Google Ads ACI'. A null value indicates no Adjust network attribution was recorded.
- name: agg_type
  description: The type of aggregation applied to the metric data in this record, such as 'histogram'. Indicates how the underlying probe values
    were summarized.
- name: aggregates
  description: An array of key-value pairs representing aggregated metric values, where the key is a histogram bucket or category label and the
    value is the corresponding aggregated count or proportion.
- name: aggregates_key
  description: The bucket label or category key within the aggregates array, typically representing a histogram bucket index or an enumerated
    metric value. Used to identify which portion of the distribution a given aggregate value corresponds to.
- name: aggregates_value
  description: The numeric aggregated value associated with a particular aggregates key, representing the count, proportion, or weight for that
    bucket or category within the aggregated metric distribution.
- name: app
  description: The name or identifier of the Mozilla application from which the telemetry data was submitted (e.g., Firefox, Firefox for Android).
    Used to distinguish data across different Mozilla products.
- name: app_build_id
  description: The unique build identifier for the version of the application that submitted the telemetry, typically formatted as a timestamp
    string (e.g., '20151029151421'). Used to correlate data with specific release builds.
- name: app_channel
  description: The release channel of the application (e.g., 'release', 'beta', 'nightly'). Indicates the update track the client is enrolled
    in and the stability tier of the build.
- name: app_display_version
  description: The human-readable version string of the application as displayed to users (e.g., '151.0.1', '115.36.0esr'). Used to segment telemetry
    data by application version.
- name: app_name
  description: The internal identifier for the Mozilla application that generated the telemetry record (e.g., 'firefox_desktop', 'fenix', 'firefox_ios').
    Each value corresponds to a distinct Mozilla product or platform variant.
- name: app_version
  description: The full version string of the application at the time the record was generated (e.g., '151.0.2'). This includes major, minor, and patch
    components as a dot-separated string.
- name: app_version_is_major_release
  description: Indicates whether the application version corresponds to a major release (e.g., 151.0). True means the version is a major release; false
    means it is a minor or patch update.
- name: app_version_major
  description: The major version number component of the application version (e.g., 151 for version 151.0.2). This is the primary release cycle identifier.
- name: app_version_minor
  description: The minor version number component of the application version (e.g., 0 for version 151.0.2). A value of 0 typically indicates a base
    major release, while non-zero values indicate point releases within a major cycle.
- name: app_version_patch
  description: The patch-level version number component of the application version (e.g., 2 for version 151.0.2). Null values indicate the version
    does not include an explicit patch component.
- name: app_version_patch_revision
  description: The patch revision component of the application version, representing incremental update revisions within a patch release. Null values
    indicate no patch revision is applicable for the given version.
- name: apple_model_id
  description: The Apple hardware model identifier for macOS or iOS devices (e.g., 'MacBookAir10,1', 'Mac16,12'). This field is null for non-Apple
    hardware.
- name: application
  description: The name of the Mozilla application as reported in the telemetry payload (e.g., 'Firefox', 'FirefoxForFireTV', 'Focus'). This identifies
    the end-user product at a high level.
- name: arch
  description: The CPU architecture of the device as reported by the Android ABI or platform (e.g., 'arm64-v8a', 'armeabi-v7a', 'x86_64'). This reflects
    the instruction set the application binary is running on.
- name: architecture
  description: The CPU architecture of the device or build environment (e.g., 'x86-64', 'aarch64', 'arm'). This indicates the hardware instruction
    set supported by the running application.
- name: asofdate
  description: The reference date for which a given record or aggregation applies, stored as a date string in YYYY-MM-DD format. This is used to represent
    the effective snapshot or reporting date of the data.
- name: attributed
  description: Indicates whether the client or install event has been attributed to a known acquisition source or campaign. True means attribution
    data is present; false means no attribution was recorded.
- name: attribution_campaign
  description: The marketing campaign identifier associated with the client's acquisition, sourced from attribution metadata (e.g., 'SET_DEFAULT_BROWSER',
    'about-dialog'). Null when no campaign attribution is available.
- name: attribution_content
  description: The content parameter from the acquisition attribution metadata, typically identifying the specific ad creative or page element that
    led to the install (e.g., 'body-download-button'). Null when no content attribution is available.
- name: attribution_dlsource
  description: The download source identifier from acquisition attribution metadata, indicating which Mozilla-operated or partner property served the
    installer (e.g., 'mozorg', 'fxdotcom'). Null when no download source is recorded.
- name: attribution_dltoken
  description: A unique token (UUID) associated with a specific attributed download event, used to link an install back to a particular download session.
    Null when no download token is present.
- name: attribution_experiment
  description: The experiment identifier from acquisition attribution metadata, indicating whether the install was part of a download-side experiment.
    Null when no experiment attribution is present.
- name: attribution_medium
  description: The marketing medium from acquisition attribution metadata, describing the broad channel through which the user arrived (e.g., 'referral',
    'firefox-desktop'). Null when no medium attribution is available.
- name: attribution_msstoresignedin
  description: Indicates whether the user was signed in to the Microsoft Store at the time of the attributed install. This field is currently fully
    null, meaning no data has been collected for this attribute.
- name: attribution_source
  description: The referring source from acquisition attribution metadata, typically the domain or service that referred the user to download the application
    (e.g., 'www.google.com', 'www.bing.com'). Null when no source attribution is available.
- name: attribution_ua
  description: The user agent type of the browser the user was using at the time of the attributed download (e.g., 'chrome', 'edge', 'firefox'). Null
    when no user agent attribution is available.
- name: attribution_variation
  description: The variation or variant identifier from acquisition attribution metadata, typically used to identify which test variant was seen during
    a download-side experiment. Null when no variation attribution is available.
- name: average_profile_age
  description: The average age of a Firefox profile in days, calculated across a population of clients. Higher values indicate older, more established
    profiles.
- name: avg_hours_usage_daily
  description: The average number of hours per day the application was actively used by a client or cohort. This metric reflects active engagement
    time rather than total time the application was open.
- name: blocklist_enabled
  description: Indicates whether the Firefox blocklist (used to block known malicious add-ons and plugins) is enabled for the client. True means the
    blocklist is active; false means it has been disabled.
- name: bookmark_migrations_quantity_all
  description: The total number of bookmarks migrated from all supported source browsers during a migration event. Null when no migration was performed
    or data is unavailable.
- name: bookmark_migrations_quantity_chrome
  description: The number of bookmarks migrated specifically from Google Chrome during a browser migration event. Null when no Chrome migration was
    performed or data is unavailable.
- name: bookmark_migrations_quantity_edge
  description: The number of bookmarks migrated specifically from Microsoft Edge during a browser migration event. Null when no Edge migration was
    performed or data is unavailable.
- name: bookmark_migrations_quantity_safari
  description: The number of bookmarks migrated specifically from Apple Safari during a browser migration event. Null when no Safari migration was
    performed or data is unavailable.
- name: bookmarks_added_per_dau
  description: The ratio of bookmark add events to daily active users (DAU) for a given segment or time period. Null when there are insufficient active
    users to compute the metric.
- name: bookmarks_opened_per_dau
  description: The ratio of bookmark open events to daily active users (DAU) for a given segment or time period. Null when there are insufficient active
    users to compute the metric.
- name: branch
  description: The experiment branch to which a client was assigned (e.g., 'control', 'treatment-a', 'rollout'). This identifies the specific variant
    of an experiment or rollout a client is part of.
- name: browser_arch
  description: The CPU architecture of the browser process (e.g., 'x86-64', 'aarch64'). This reflects the instruction set the browser binary was compiled
    for and is running on.
- name: browser_backup_archive_enabled
  description: Indicates whether the Firefox browser backup archive feature is enabled for the client. True means backup archiving is active; false
    means it has been disabled; null means the feature state is unknown or not applicable.
- name: browser_backup_scheduler_enabled
  description: Indicates whether the Firefox browser backup scheduler is enabled for the client. True means the scheduler is active and backups are
    being triggered automatically; false means the scheduler is disabled; null means the state is unknown or not applicable.
- name: browser_name
  description: The human-readable name of the browser product (e.g., 'Firefox Desktop'). This provides a display-friendly label for the browser as
    opposed to internal product identifiers.
- name: browser_version
  description: The full version string of the browser at the time the record was generated (e.g., '151.0.2'). This includes all version components
    as a dot-separated string.
- name: browser_version_info_is_major_release
  description: Indicates whether the browser version represents a major release (e.g., 151.0 with no patch). True means the version is a major release;
    false means it is a patch or point update.
- name: browser_version_info_major_version
  description: The major version number component extracted from the browser version string (e.g., 151 for version 151.0.2). This corresponds to the
    primary release train identifier.
- name: browser_version_info_minor_version
  description: The minor version number component extracted from the browser version string (e.g., 0 for version 151.0.2). A value of 0 typically indicates
    a base major release build.
- name: browser_version_info_patch_revision
  description: The patch revision component extracted from the browser version string, representing incremental updates within a patch release. Null
    values indicate no patch revision is applicable for the given version.
- name: browser_version_info_version
  description: The full, unparsed browser version string as extracted from version metadata (e.g., '151.0.2', '115.0a1'). This is the canonical version
    string from which other browser_version_info components are derived.
- name: bug_1501329_affected
  description: Indicates whether the client was affected by the issue tracked in Firefox bug 1501329. True means the client was confirmed affected;
    false means it was not; null means the affected status could not be determined.
- name: build_architecture
  description: The CPU architecture for which the application binary was compiled (e.g., 'x86-64', 'aarch64', 'x86'). This reflects the build target
    and may differ from the runtime device architecture in emulation scenarios.
- name: build_channel
  description: The release channel for which the application was built (e.g., 'release', 'beta', 'nightly', 'aurora'). This identifies the intended
    update and distribution track for the build.
- name: build_id
  description: A timestamp-based identifier for the specific application build, formatted as YYYYMMDDHHmmSS (e.g., '20260514164700'). This uniquely
    identifies a particular nightly or release build.
- name: build_version
  description: The version string of the application build as reported in build metadata. This provides a label for the build distinct from the user-facing
    application version.
- name: campaign
  description: The marketing campaign name or identifier associated with the client's acquisition or activity (e.g., 'SET_DEFAULT_BROWSER', 'non-fx-button').
    Null when no campaign is associated with the record.
- name: campaign_id
  description: A unique identifier for the specific paid or organic marketing campaign associated with the client's acquisition. Null when no campaign
    identifier is present or the acquisition was unattributed.
- name: category
  description: A high-cardinality string label classifying the telemetry event or record into a functional area or feature group (e.g., 'devtools.main',
    'pwmgr', 'doh'). May be null when no category applies to the record.
- name: cdou
  description: An integer representing the cumulative days of use metric for a client, counting the number of days the browser has been actively used.
    Higher values indicate longer or more frequent usage history.
- name: channel
  description: The Firefox release channel through which the client is receiving browser updates (e.g., 'release', 'beta', 'esr', 'aurora'). Identifies
    the update track and stability tier of the Firefox installation.
- name: channel_raw
  description: The raw, unprocessed marketing or traffic acquisition channel through which a user arrived (e.g., 'Organic Search', 'Referral', 'Paid
    Search', 'Direct'). May be null when channel attribution is unavailable.
- name: city
  description: The city-level geographic location of the client or user, derived from IP address or other geolocation signals. May be null when city-level
    resolution is not available.
- name: click_count
  description: The total number of click interactions recorded for a given record or session. A value of zero indicates that no clicks were observed.
- name: client_agg_type
  description: The aggregation method applied to client-level metric values, such as 'summed_histogram', 'count', 'avg', 'sum', 'min', or 'max'. Describes
    how individual client observations were combined to produce the stored value.
- name: client_clock_skew_mean
  description: The mean clock skew (in hours or similar time units) observed for a client, measuring the difference between the client's local clock
    and server time. Values near zero indicate well-synchronized clocks, while positive or negative values indicate the client clock is ahead or behind.
- name: client_count
  description: The number of distinct clients contributing to an aggregated row or metric. A value of 1 indicates data from a single client, while
    higher values represent aggregations across multiple clients.
- name: client_id
  description: A UUID that uniquely identifies a Firefox client installation. This identifier persists across sessions and is used to associate telemetry
    records with a single browser profile.
- name: client_submission_latency_mean
  description: The mean latency (in seconds or similar units) between when a telemetry ping was generated by the client and when it was received by
    the server. Values near zero indicate near-real-time submission, while larger values indicate delayed uploads.
- name: clients
  description: The total count of distinct clients represented in an aggregated summary record. Used to express the size of the client population for
    a given grouping.
- name: cohort_date
  description: The specific date on which a client or user was first observed or acquired, used to define their cohort for retention and longitudinal
    analyses. Records are grouped by this date to compare behavior across cohorts.
- name: cohort_date_week
  description: The ISO week start date (Sunday or Monday) of the week in which a client or user was first observed, used to group clients into weekly
    cohorts for retention and trend analyses.
- name: content
  description: A string capturing the UTM content parameter or equivalent creative/placement identifier associated with a marketing interaction. May
    be null or URL-encoded when the value is absent or not parsed.
- name: contextual_services_quicksuggest_block_dynamic_wikipedia_sum
  description: An array of key-value pairs summing the number of times a user blocked a dynamic Wikipedia quick suggest result in the address bar,
    keyed by a relevant dimension such as match type or position.
- name: contextual_services_quicksuggest_block_nonsponsored_bestmatch_sum
  description: An array of key-value pairs summing the number of times a user blocked a non-sponsored best-match quick suggest result in the address
    bar, keyed by a relevant dimension.
- name: contextual_services_quicksuggest_block_nonsponsored_sum
  description: An array of key-value pairs summing the number of times a user blocked a non-sponsored quick suggest result in the address bar, keyed
    by a relevant dimension such as result type or source.
- name: contextual_services_quicksuggest_block_sponsored_bestmatch_sum
  description: An array of key-value pairs summing the number of times a user blocked a sponsored best-match quick suggest result in the address bar,
    keyed by a relevant dimension.
- name: contextual_services_quicksuggest_block_sponsored_sum
  description: An array of key-value pairs summing the number of times a user blocked a sponsored quick suggest result in the address bar, keyed by
    a relevant dimension such as result type or provider.
- name: contextual_services_quicksuggest_block_weather_sum
  description: An array of key-value pairs summing the number of times a user blocked a weather quick suggest result in the address bar, keyed by a
    relevant dimension.
- name: contextual_services_quicksuggest_click_dynamic_wikipedia_sum
  description: An array of key-value pairs summing the number of times a user clicked on a dynamic Wikipedia quick suggest result in the address bar,
    keyed by a relevant dimension.
- name: contextual_services_quicksuggest_click_nonsponsored_bestmatch_sum
  description: An array of key-value pairs summing the number of times a user clicked on a non-sponsored best-match quick suggest result in the address
    bar, keyed by a relevant dimension.
- name: contextual_services_quicksuggest_click_nonsponsored_sum
  description: An array of key-value pairs summing the number of times a user clicked on a non-sponsored quick suggest result in the address bar, keyed
    by a relevant dimension such as result type or source.
- name: contextual_services_quicksuggest_click_sponsored_bestmatch_sum
  description: An array of key-value pairs summing the number of times a user clicked on a sponsored best-match quick suggest result in the address
    bar, keyed by a relevant dimension.
- name: contextual_services_quicksuggest_click_sponsored_sum
  description: An array of key-value pairs summing the number of times a user clicked on a sponsored quick suggest result in the address bar, keyed
    by a relevant dimension such as provider or result type.
- name: contextual_services_quicksuggest_click_sum
  description: An array of key-value pairs summing the total number of times a user clicked on any quick suggest result in the address bar, keyed by
    a relevant dimension.
- name: contextual_services_quicksuggest_click_weather_sum
  description: An array of key-value pairs summing the number of times a user clicked on a weather quick suggest result in the address bar, keyed by
    a relevant dimension.
- name: contextual_services_quicksuggest_help_dynamic_wikipedia_sum
  description: An array of key-value pairs summing the number of times a user clicked the help link on a dynamic Wikipedia quick suggest result in
    the address bar, keyed by a relevant dimension.
- name: contextual_services_quicksuggest_help_nonsponsored_bestmatch_sum
  description: An array of key-value pairs summing the number of times a user clicked the help link on a non-sponsored best-match quick suggest result
    in the address bar, keyed by a relevant dimension.
- name: contextual_services_quicksuggest_help_nonsponsored_sum
  description: An array of key-value pairs summing the number of times a user clicked the help link on a non-sponsored quick suggest result in the
    address bar, keyed by a relevant dimension.
- name: contextual_services_quicksuggest_help_sponsored_bestmatch_sum
  description: An array of key-value pairs summing the number of times a user clicked the help link on a sponsored best-match quick suggest result
    in the address bar, keyed by a relevant dimension.
- name: contextual_services_quicksuggest_help_sponsored_sum
  description: An array of key-value pairs summing the number of times a user clicked the help link on a sponsored quick suggest result in the address
    bar, keyed by a relevant dimension.
- name: contextual_services_quicksuggest_help_sum
  description: An array of key-value pairs summing the total number of times a user clicked the help link on any quick suggest result in the address
    bar, keyed by a relevant dimension.
- name: contextual_services_quicksuggest_help_weather_sum
  description: An array of key-value pairs summing the number of times a user clicked the help link on a weather quick suggest result in the address
    bar, keyed by a relevant dimension.
- name: contextual_services_quicksuggest_impression_dynamic_wikipedia_sum
  description: An array of key-value pairs summing the number of times a dynamic Wikipedia quick suggest result was displayed to a user in the address
    bar, keyed by a relevant dimension.
- name: contextual_services_quicksuggest_impression_nonsponsored_bestmatch_sum
  description: An array of key-value pairs summing the number of times a non-sponsored best-match quick suggest result was displayed to a user in the
    address bar, keyed by a relevant dimension.
- name: contextual_services_quicksuggest_impression_nonsponsored_sum
  description: An array of key-value pairs summing the number of times a non-sponsored quick suggest result was displayed to a user in the address
    bar, keyed by a relevant dimension such as result type or source.
- name: contextual_services_quicksuggest_impression_sponsored_bestmatch_sum
  description: An array of key-value pairs summing the number of times a sponsored best-match quick suggest result was displayed to a user in the address
    bar, keyed by a relevant dimension.
- name: contextual_services_quicksuggest_impression_sponsored_sum
  description: An array of key-value pairs summing the number of times a sponsored quick suggest result was displayed to a user in the address bar,
    keyed by a relevant dimension such as provider or result type.
- name: contextual_services_quicksuggest_impression_sum
  description: An array of key-value pairs summing the total number of times any quick suggest result was displayed to a user in the address bar, keyed
    by a relevant dimension.
- name: contextual_services_quicksuggest_impression_weather_sum
  description: An array of key-value pairs summing the number of times a weather quick suggest result was displayed to a user in the address bar, keyed
    by a relevant dimension.
- name: contextual_services_topsites_click_sum
  description: An array of key-value pairs summing the number of times a user clicked on a Top Sites tile in the New Tab page, keyed by a relevant
    dimension such as position or tile type.
- name: contextual_services_topsites_impression_sum
  description: An array of key-value pairs summing the number of times a Top Sites tile was displayed to a user on the New Tab page, keyed by a relevant
    dimension such as position or tile type.
- name: corpus_item_id
  description: A UUID that uniquely identifies a specific item in the content corpus, such as an article or recommendation surfaced to the user. Used
    to join or deduplicate records across content delivery and engagement tables.
- name: count
  description: A general-purpose integer count of observations, events, or records aggregated into a row. The exact entity being counted depends on
    the context of the enclosing table.
- name: country
  description: The ISO 3166-1 alpha-2 two-letter country code representing the geographic country of the client or user (e.g., 'US', 'DE', 'FR'). Derived
    from geolocation data.
- name: country_code
  description: The ISO 3166-1 alpha-2 two-letter country code identifying the country associated with a record (e.g., 'IN', 'US', 'RU'). Used for geographic
    segmentation and filtering.
- name: country_name
  description: The full human-readable name of the country associated with a record (e.g., 'United States', 'India', 'Brazil'). Complements the country
    code fields with a display-friendly label.
- name: cpu_cores
  description: The number of logical CPU cores available on the client's device. Used to segment clients by hardware capability, with common values
    including 2, 4, 6, and 8 cores.
- name: cpu_count
  description: The number of logical CPU cores available on the client device. Higher values indicate multi-core or hyper-threaded processors.
- name: cpu_family
  description: The processor family identifier as reported by the CPU's CPUID instruction. This is a numeric code used to classify the CPU microarchitecture
    generation.
- name: cpu_l2_cache_kb
  description: The size of the CPU's L2 cache in kilobytes as reported by the client device. A value of 0 may indicate the cache size could not be
    determined.
- name: cpu_l3_cache_kb
  description: The size of the CPU's L3 cache in kilobytes as reported by the client device. Null or zero values may indicate no L3 cache is present
    or the size could not be determined.
- name: cpu_model
  description: The processor model identifier as reported by the CPU's CPUID instruction. This numeric code distinguishes specific CPU models within
    a processor family.
- name: cpu_speed
  description: The CPU speed as a string value reported by the client device. This field captures the clock speed in a human-readable format.
- name: cpu_speed_mhz
  description: The CPU clock speed in megahertz as reported by the client device. A value of 0 may indicate the speed could not be determined.
- name: cpu_stepping
  description: The processor stepping identifier as reported by the CPU's CPUID instruction. This numeric code represents a specific revision or manufacturing
    iteration of a CPU model.
- name: cpu_vendor
  description: The CPU manufacturer's vendor string as reported by the CPUID instruction, such as 'GenuineIntel' or 'AuthenticAMD'. An empty or null
    value indicates the vendor could not be determined.
- name: crash_submit_attempt_content_sum
  description: The total number of crash report submission attempts for content process crashes during the reporting period. Null indicates no content
    process crash submission attempts were recorded.
- name: crash_submit_attempt_main_sum
  description: The total number of crash report submission attempts for main process crashes during the reporting period. Null indicates no main process
    crash submission attempts were recorded.
- name: crash_submit_attempt_plugin_sum
  description: The total number of crash report submission attempts for plugin process crashes during the reporting period. Null indicates no plugin
    process crash submission attempts were recorded.
- name: crash_submit_success_content_sum
  description: The total number of successfully submitted crash reports for content process crashes during the reporting period. A value of 0 means
    submissions were attempted but none succeeded; null means no submissions were attempted.
- name: crash_submit_success_main_sum
  description: The total number of successfully submitted crash reports for main process crashes during the reporting period. A value of 0 means submissions
    were attempted but none succeeded; null means no submissions were attempted.
- name: crash_submit_success_plugin_sum
  description: The total number of successfully submitted crash reports for plugin process crashes during the reporting period. Null indicates no plugin
    process crash submissions were recorded.
- name: crash_time
  description: The timestamp at which a crash occurred, represented as a string. This field captures the date and time of the crash event as reported
    by the client.
- name: crashes_detected_content_sum
  description: The total number of content process crashes detected during the reporting period. Null indicates no content process crashes were detected
    or the value was not reported.
- name: crashes_detected_gmplugin_sum
  description: The total number of Gecko Media Plugin (GMP) process crashes detected during the reporting period. Null indicates no GMP crashes were
    detected or the value was not reported.
- name: crashes_detected_plugin_sum
  description: The total number of plugin process crashes detected during the reporting period. Null indicates no plugin crashes were detected or the
    value was not reported.
- name: crashing_users
  description: The number or proportion of users who experienced at least one crash during the reporting period. Higher values indicate more users
    were affected by crashes.
- name: cumulative_new_profiles
  description: The running total count of newly created browser profiles up to and including the reporting date. A value of 0 indicates no new profiles
    had been created cumulatively to that point.
- name: daily_users
  description: The count of unique users active on a given day within the reporting period. A value of 0 indicates no active users were recorded for
    that day.
- name: date
  description: The calendar date associated with the record, formatted as a YYYY-MM-DD string. This field identifies the specific day or reporting
    period the row represents.
- name: date_from
  description: The inclusive start date of the reporting or aggregation window. This field defines the earliest date boundary for the data represented
    in the record.
- name: date_to
  description: The inclusive end date of the reporting or aggregation window. This field defines the latest date boundary for the data represented
    in the record.
- name: dau
  description: The Daily Active Users count representing the number of unique users who were active on a given day. A value of 0 indicates no active
    users were recorded for that day.
- name: days_active_bits
  description: A bitmask representing the days within a 28-day lookback window on which the client was active. Each bit corresponds to one day, with
    the most significant bit representing the most recent day.
- name: days_created_profile_bits
  description: A bitmask representing the days within a 28-day lookback window on which a new browser profile was created. Each bit corresponds to
    one day, with the most significant bit representing the most recent day.
- name: days_had_8_active_ticks_bits
  description: A bitmask representing the days within a 28-day lookback window on which the client recorded at least 8 active ticks, indicating meaningful
    engagement. Each bit corresponds to one day, with the most significant bit representing the most recent day.
- name: days_interacted_bits
  description: A bitmask representing the days within a 28-day lookback window on which the user had at least one recorded interaction with the browser.
    Each bit corresponds to one day, with the most significant bit representing the most recent day.
- name: days_logged_event_bits
  description: A bitmask representing the days within a 28-day lookback window on which the client logged at least one telemetry event. Each bit corresponds
    to one day, with the most significant bit representing the most recent day.
- name: days_opened_dev_tools_bits
  description: A bitmask representing the days within a 28-day lookback window on which the user opened browser developer tools. Each bit corresponds
    to one day, with the most significant bit representing the most recent day.
- name: days_seen_bits
  description: A bitmask representing the days within a 28-day lookback window on which the client submitted any telemetry and was therefore 'seen'.
    Each bit corresponds to one day, with the most significant bit representing the most recent day.
- name: days_seen_in_experiment
  description: An array of structs recording the days a client was observed participating in each experiment and branch, encoded as a bitmask. Each
    entry contains the experiment identifier, branch name, and a bitmask of days seen within the lookback window.
- name: days_since_first_seen
  description: The number of days elapsed between the date the client was first seen submitting telemetry and the current reporting date. A value of
    0 indicates the client was first seen on the reporting date itself.
- name: days_since_seen
  description: The number of days elapsed since the client was last seen submitting telemetry, relative to the reporting date. A value of 0 indicates
    the client was seen on the reporting date itself.
- name: days_used_pictureinpicture_bits
  description: A bitmask representing the days within a 28-day lookback window on which the user used the Picture-in-Picture video feature. Each bit
    corresponds to one day, with the most significant bit representing the most recent day.
- name: days_viewed_protection_report_bits
  description: A bitmask representing the days within a 28-day lookback window on which the user viewed the Privacy Protections report. Each bit corresponds
    to one day, with the most significant bit representing the most recent day.
- name: days_visited_10_uri_bits
  description: A bitmask representing the days within a 28-day lookback window on which the client visited at least 10 distinct URIs, indicating high
    browsing activity. Each bit corresponds to one day, with the most significant bit representing the most recent day.
- name: days_visited_1_uri_bits
  description: A bitmask representing the days within a 28-day lookback window on which the client visited at least 1 URI in any browsing mode. Each
    bit corresponds to one day, with the most significant bit representing the most recent day.
- name: days_visited_1_uri_normal_mode_bits
  description: A bitmask representing the days within a 28-day lookback window on which the client visited at least 1 URI in normal (non-private) browsing
    mode. Each bit corresponds to one day, with the most significant bit representing the most recent day.
- name: days_visited_1_uri_private_mode_bits
  description: A bitmask representing the days within a 28-day lookback window on which the client visited at least 1 URI in private browsing mode.
    Each bit corresponds to one day, with the most significant bit representing the most recent day.
- name: days_visited_5_uri_bits
  description: A bitmask representing the days within a 28-day lookback window on which the client visited at least 5 distinct URIs, indicating moderate
    browsing activity. Each bit corresponds to one day, with the most significant bit representing the most recent day.
- name: db_version
  description: The version identifier of the database or data source used to generate the record, expressed as an ISO 8601 timestamp string. This field
    tracks which version of the underlying data was in use at the time of processing.
- name: default_browser
  description: Indicates whether Firefox was set as the system default browser at the time of the record. True means Firefox was the default browser;
    false means it was not; null means the status could not be determined.
- name: default_percent
  description: The percentage of users or sessions for which Firefox was set as the default browser within the reporting group. Values range from 0.0
    to 100.0.
- name: default_private_search_engine
  description: The identifier of the search engine configured as the default for private browsing mode, such as 'google-b-d' or 'ddg'. This corresponds
    to the engine's internal identifier rather than its display name.
- name: default_private_search_engine_data_load_path
  description: The load path indicating how the default private browsing search engine was installed or sourced, such as from the application bundle.
    Null indicates this metadata was not available.
- name: default_private_search_engine_data_name
  description: The human-readable display name of the search engine configured as the default for private browsing mode, such as 'DuckDuckGo' or 'Google'.
    Null indicates the name metadata was not available.
- name: default_private_search_engine_data_origin
  description: The origin or provenance of the default private browsing search engine configuration, indicating how or where the engine was added.
    Null indicates this metadata was not available or reported.
- name: default_private_search_engine_data_submission_url
  description: The base submission URL for the default private browsing search engine, used to construct search queries. This field is predominantly
    null, indicating most clients do not have a distinct private search engine configured.
- name: default_search
  description: The identifier for the client's default search engine, typically expressed as a short engine code (e.g., 'google-b-m'). A value of 'unknown'
    indicates the engine could not be identified.
- name: default_search_engine
  description: The identifier string for the user's default search engine, combining the engine name with optional distribution or channel codes (e.g.,
    'google-b-d', 'baidu'). This identifies which search engine is active as the browser default.
- name: default_search_engine_data_load_path
  description: The path describing how the default search engine was loaded, indicating its origin source such as a built-in app bundle ('[app]') or
    an add-on ('[addon]'). This helps distinguish between pre-bundled and user-installed search engines.
- name: default_search_engine_data_name
  description: The human-readable display name of the default search engine (e.g., 'Google', 'DuckDuckGo', '百度'). This is the localized name as presented
    to the user in the browser.
- name: default_search_engine_data_origin
  description: Indicates how the default search engine was set, with values such as 'default', 'verified', 'unverified', or 'invalid'. This field is
    mostly null and is only populated when the engine origin can be determined.
- name: default_search_engine_data_submission_url
  description: The base URL used to submit search queries to the default search engine, including any partner or distribution-specific query parameters.
    This URL uniquely identifies the search engine partner agreement in effect.
- name: device
  description: A string identifying the device hardware, typically in the format 'Manufacturer-Model' (e.g., 'iPhone14,5', 'MediaTek-SMART TV'). This
    represents the specific hardware platform on which the browser is running.
- name: device_model
  description: The hardware model identifier of the device (e.g., 'iPhone14,5'), representing the specific device variant. This field may be null for
    desktop or unrecognized platforms.
- name: devtools_toolbox_opened_count_sum
  description: The total number of times the browser developer tools toolbox was opened during the reporting period. A null value indicates the metric
    was not recorded, typically for sessions where developer tools were never used.
- name: dismiss_count
  description: The number of times a user dismissed a UI element (such as a notification, prompt, or recommendation) during the reporting period. A
    value of zero indicates the element was never dismissed.
- name: display_version
  description: The human-readable version string of the browser as displayed to the user, including point releases and ESR designations (e.g., '151.0.2',
    '115.31.0esr'). This may differ slightly from the internal build version.
- name: disqualification_count
  description: The number of times a client or session was disqualified from a study, experiment, or targeting criteria during the reporting period.
    A value of zero indicates no disqualifications occurred.
- name: distribution_id
  description: An identifier for the Firefox distribution or partner build the client is using (e.g., 'default', 'mozilla-MSIX', 'canonical-002').
    A value of 'default' indicates a standard Mozilla release with no partner customization.
- name: distribution_model
  description: A categorical label describing the channel through which the Firefox distribution was delivered (e.g., 'non-distribution', 'OS pre-installed',
    'OEM pre-installed', 'secondary store'). This classifies the business relationship behind the distribution.
- name: distribution_version
  description: The version string of the partner distribution configuration or customization applied to the Firefox build. This is null for standard
    Mozilla builds that carry no partner-specific versioning.
- name: distributor
  description: The name of the organization or project that distributed this Firefox build (e.g., 'canonical', 'mozillaonline', 'mint'). This field
    is null for builds distributed directly by Mozilla.
- name: distributor_channel
  description: The specific channel or method used by the distributor to deliver Firefox (e.g., 'ubuntu', 'mainWinStub', 'firefox'). This field is
    null for builds not associated with a particular distributor channel.
- name: doc_type
  description: The type of telemetry document or ping submitted (e.g., 'main', 'crash', 'event'). This identifies the schema and intended purpose of
    the telemetry payload.
- name: document_id
  description: A UUID uniquely identifying a single telemetry document submission. This is used to deduplicate ingested pings across the pipeline.
- name: dom_parentprocess_private_window_used
  description: A boolean indicating whether a private browsing window was used in the parent DOM process during the session. True means at least one
    private window was opened; false means no private window was used.
- name: domains_per_user
  description: The average number of distinct domains visited per user during the reporting period. This metric is used to characterize browsing breadth
    across a population.
- name: downloads
  description: The number of file downloads initiated by the user during the reporting period. A value of zero indicates no downloads were started.
- name: ds
  description: The UTC timestamp representing the date partition or logical date associated with the record, typically truncated to midnight. This
    field is used for time-based partitioning and filtering of the dataset.
- name: durations
  description: The total active duration, measured in seconds, associated with the session or activity being recorded. A value of zero indicates negligible
    or unmeasured activity.
- name: e10s_cohort
  description: The experiment cohort assigned to the client for the Electrolysis (e10s) multi-process Firefox rollout. This field is fully null in
    current data, indicating the e10s cohort experiment has concluded.
- name: e10s_enabled
  description: A boolean indicating whether the Electrolysis (e10s) multi-process architecture was enabled for the browser session. True means multi-process
    mode was active; false means it was disabled.
- name: endpoint
  description: The telemetry or data pipeline endpoint to which the ping or event was submitted. This identifies the ingestion target for the document.
- name: engine_data_load_path
  description: The path describing how a search engine was loaded, indicating whether it originated from the built-in app bundle ('[app]'), an add-on
    ('[addon]'), or another source ('[other]'). This is used to determine the provenance of a search engine configuration.
- name: engine_data_name
  description: The human-readable display name of the search engine referenced in the event or record (e.g., 'Google', 'DuckDuckGo', '百度'). This is
    the localized name as presented to the user.
- name: engine_data_origin
  description: Indicates how the referenced search engine was set, with values such as 'default', 'verified', 'unverified', or 'invalid'. A null value
    means the origin could not be determined for this engine.
- name: engine_data_submission_url
  description: The base URL used to submit queries to the referenced search engine, including any partner or distribution-specific parameters. This
    identifies the specific search engine partner agreement associated with the engine in context.
- name: enroll_count
  description: The number of times the client was enrolled in a Nimbus experiment or Normandy study during the reporting period. A value of zero indicates
    no new enrollments occurred.
- name: enroll_failed_count
  description: The number of times an attempt to enroll the client in a Nimbus experiment or Normandy study failed during the reporting period. A value
    of zero indicates all enrollment attempts succeeded or none were made.
- name: env_build_arch
  description: The CPU architecture of the Firefox build environment (e.g., 'x86-64', 'aarch64', 'x86'). This reflects the architecture the binary
    was compiled for, not necessarily the underlying hardware.
- name: env_build_id
  description: The build identifier for the Firefox binary, expressed as a timestamp string in YYYYMMDDHHmmss format (e.g., '20260520211922'). This
    uniquely identifies a specific compiled build of Firefox.
- name: env_build_platform_version
  description: The version string of the underlying Gecko platform used by the Firefox build (e.g., '151.0.1', '115.36.0'). This may differ from the
    product version for ESR or specialized builds.
- name: env_build_version
  description: The version string of the Firefox build as reported by the environment (e.g., '151.0.1', '115.36.0'). This reflects the version of the
    browser that generated the telemetry record.
- name: env_build_xpcom_abi
  description: The XPCOM ABI string identifying the compiler toolchain and target architecture of the Firefox build (e.g., 'x86_64-msvc', 'aarch64-gcc3').
    This is used to uniquely identify binary compatibility characteristics of the build.
- name: environment
  description: The deployment or runtime environment context associated with the telemetry record (e.g., production, staging). This field classifies
    where the data originated from within the pipeline infrastructure.
- name: environment_settings_intl_accept_languages
  description: An ordered list of BCP 47 language tags representing the browser's configured 'Accept-Language' header preferences. These reflect the
    user's language preferences for web content negotiation.
- name: environment_settings_intl_app_locales
  description: The list of locale codes representing the active application locales used by the Firefox browser UI. These determine the language and
    regional formatting applied to the browser interface.
- name: environment_settings_intl_available_locales
  description: The list of locale codes for all language packs available in the Firefox installation. This reflects the full set of languages the browser
    could display, regardless of which is currently active.
- name: environment_settings_intl_regional_prefs_locales
  description: The list of locale codes used for regional preferences such as date, time, and number formatting in the Firefox browser. These settings
    may differ from the UI display language.
- name: environment_settings_intl_requested_locales
  description: The list of locale codes explicitly requested by the user or system for the Firefox browser. This reflects the preferred languages as
    configured before the browser resolved them to available locales.
- name: environment_settings_intl_system_locales
  description: The list of locale codes reported by the underlying operating system. These represent the OS-level language and regional settings at
    the time the telemetry was collected.
- name: event
  description: A dot-separated string identifying the specific telemetry event that occurred, combining the event object and method (e.g., 'cancel.modal',
    'trigger.reason'). A null value indicates no specific event was associated with the record.
- name: event_category
  description: The category grouping for a telemetry event, used to classify the browser component or feature area that generated it (e.g., 'address',
    'creditcard', 'memory_watcher'). This is the top-level namespace for event classification.
- name: event_map_values
  description: A repeated key-value struct containing additional metadata associated with a telemetry event. Each entry provides supplementary context
    about the event, such as branch assignments, trigger reasons, or result codes.
- name: event_map_values_key
  description: The key component of an event map values entry, identifying the type of supplementary metadata attached to a telemetry event (e.g.,
    'source', 'trigger', 'networkID'). This field is the lookup key for the corresponding value in the event map.
- name: event_map_values_value
  description: The string value associated with a key in an event's map-style extra properties. Values are highly variable and may represent booleans
    (e.g. 'false'), numeric strings, empty strings, or descriptive labels such as 'unavailable' depending on the event context.
- name: event_method
  description: The method or action that triggered the event, describing what occurred (e.g. 'detected', 'submitted', 'show'). This field narrows the
    event semantics alongside the event object and category.
- name: event_object
  description: The UI element or component that was the target of the event (e.g. 'address_form', 'cc_form_v2', 'capture_doorhanger'). Together with
    the event method, it identifies the precise interaction being recorded.
- name: event_process
  description: The Firefox process in which the event was generated, such as 'parent', 'content', 'extension', or 'dynamic'. This indicates the process
    boundary where the instrumented code was running.
- name: event_properties
  description: An array of structured key-value properties associated with the event, where each value may itself be an array of key-value pairs. This
    field captures arbitrary metadata attached to the event at the time it was recorded.
- name: event_properties_index
  description: The positional index of an entry within the event_properties array, used to preserve ordering of repeated structured properties. Index
    values start at 1 and increment for each additional property entry.
- name: event_properties_key
  description: The key name of a property within the event_properties array (e.g. 'session_id', 'source', 'reason'). Each key identifies a specific
    piece of metadata attached to the event.
- name: event_string_value
  description: An optional free-form string value associated with the event, used to capture additional context such as an error code or identifier.
    This field is nullable and may also contain the literal string 'null' when no meaningful value was available.
- name: event_timestamp
  description: The time offset in milliseconds at which the event occurred, measured relative to the start of the browser session or ping. This value
    is used to order events within a session.
- name: events
  description: A serialized or aggregated representation of browser events recorded during a session. This field serves as a container for event data
    and may be empty when no events were captured.
- name: experiment
  description: The slug identifier of a Nimbus or Normandy experiment the client was enrolled in at the time of the ping. This field is null when the
    client was not enrolled in any experiment.
- name: experiment_branch
  description: The branch of an experiment to which the client was assigned (e.g. 'control', 'treatment-a'). This field distinguishes the experimental
    variant experienced by the client.
- name: experiment_id
  description: A unique identifier for a specific experiment or study the client was enrolled in. This corresponds to legacy Normandy or Nimbus experiment
    slugs used to track experiment participation.
- name: experiments
  description: An array of key-value pairs representing all experiments the client was actively enrolled in, where the key is the experiment slug and
    the value is the assigned branch. This field captures the full set of concurrent experiment enrollments.
- name: experiments_key
  description: The slug identifier (key) of an experiment entry within the experiments array, uniquely naming the experiment the client was enrolled
    in. This corresponds to the experiment slug used in Nimbus or Normandy.
- name: experiments_key_value
  description: An array of key-value pairs providing additional structured metadata for an experiments entry. Each element associates a named attribute
    with its corresponding string value for the experiment record.
- name: experiments_value
  description: The branch name assigned to the client for a given experiment entry in the experiments array (e.g. 'control', 'treatment-a', 'rollout-branch').
    This identifies which variant of the experiment the client experienced.
- name: experiments_value_branch
  description: The branch of a nested experiment enrollment record to which the client was assigned (e.g. 'control', 'treatment-a', 'rollout-branch').
    This field is used in structured experiment enrollment arrays that carry per-experiment branch details.
- name: experiments_value_enrollment_id
  description: A unique UUID identifying the client's specific enrollment instance in an experiment, allowing individual enrollment events to be tracked.
    This field is nearly always null; the sentinel value '__NO_ENROLLMENT_ID__' indicates enrollment without a tracked ID.
- name: experiments_value_extra_enrollment_id
  description: An additional enrollment UUID for an experiment entry, used in extended experiment metadata structs to uniquely identify the enrollment
    instance. This field is sparsely populated and is null when no extra enrollment identifier was recorded.
- name: experiments_value_extra_type
  description: The experiment system type recorded in extended experiment metadata, indicating whether the enrollment originated from a Nimbus rollout
    ('nimbus-rollout') or a Nimbus experiment ('nimbus-nimbus'). This field classifies the delivery mechanism of the experiment.
- name: experiments_value_type
  description: The delivery system and experiment type for an enrollment entry, such as 'nimbus-rollout', 'nimbus-nimbus', or 'normandy-prefrollout'.
    This distinguishes whether the enrollment came from the Nimbus or Normandy experimentation platform and what kind of study it represents.
- name: exposure_count
  description: The number of times a client was exposed to an experiment's treatment during the measurement period. A value of zero indicates the client
    was enrolled but not yet exposed.
- name: extra_regressors_additive
  description: The additive contribution of extra regressors to a forecasting model's predicted value. A value of 0.0 indicates no regressor contribution
    was applied for that row.
- name: extra_regressors_additive_lower
  description: The lower bound of the additive contribution of extra regressors in a forecasting model's uncertainty interval. This represents the
    pessimistic end of the regressor's estimated effect.
- name: extra_regressors_additive_upper
  description: The upper bound of the additive contribution of extra regressors in a forecasting model's uncertainty interval. This represents the
    optimistic end of the regressor's estimated effect.
- name: fill_counts
  description: The total count of form fill events recorded in a given aggregation period. This metric reflects how frequently forms were automatically
    or manually filled.
- name: first_bucket
  description: The lower boundary value of the first bucket in a histogram definition. This determines the minimum range of values captured by the
    histogram's initial bucket.
- name: first_document_id
  description: The UUID of the first telemetry document (ping) submitted by a client in a given context, such as the earliest ping in an aggregated
    sequence. Each value is unique and corresponds to a specific submitted ping.
- name: first_paint_mean
  description: The mean time in milliseconds until the browser's first paint event, averaged across sessions or observations in the aggregation. A
    null value indicates the metric was not available or recorded for that row.
- name: first_seen_date
  description: The calendar date on which a client profile was first observed in telemetry data. This is used to determine profile age and new-user
    cohort membership.
- name: first_seen_year
  description: The calendar year in which a client profile was first observed in telemetry, derived from the first_seen_date. This is used to group
    profiles into yearly new-user cohorts.
- name: first_timestamp
  description: The UTC timestamp of the earliest event or record associated with a client or session in the aggregation. This field is nullable when
    no valid timestamp could be determined.
- name: flash_usage
  description: An indicator of whether the Adobe Flash plugin was used during the session, represented as an integer count. A value of 0 indicates
    Flash was not used.
- name: flash_version
  description: The version string of the Adobe Flash plugin installed on the client at the time of the ping (e.g. '32.0.0.465'). This field is null
    when Flash is not installed or its version could not be determined.
- name: follow_on_search_ad_clicks
  description: The number of times a user clicked on an advertisement that appeared on a follow-on search results page during the measurement period.
    A value of zero indicates no ad clicks occurred.
- name: follow_on_search_ad_impressions
  description: The number of advertisements shown to a user on follow-on search results pages during the measurement period. A value of zero indicates
    no ad impressions were recorded.
- name: forecast_date
  description: The calendar date string for which a forecast value was generated, in YYYY-MM-DD format. This field identifies the point-in-time the
    model's prediction corresponds to.
- name: forecast_parameters
  description: A JSON-encoded string containing the configuration parameters used to generate a forecast, including the model type, model hyperparameters,
    and seasonality settings. This field allows forecast outputs to be traced back to their specific modeling configuration.
- name: form_factor
  description: The physical form factor of the device running Firefox, such as 'desktop', 'phone', or 'tablet'. A null value indicates the form factor
    could not be determined.
- name: funnel_date
  description: The date on which the funnel analysis snapshot was taken or the funnel stage was recorded. This is used to anchor funnel metrics to
    a specific point in time.
- name: funnel_derived
  description: A derived categorical label indicating the acquisition funnel through which a user was obtained, such as 'mozorg windows funnel', 'mozorg
    mac funnel', 'partner', or 'other'. This field classifies the user's originating acquisition channel.
- name: fxa_configured
  description: Indicates whether the client has a Firefox Accounts (FxA) account configured. True means an FxA account is set up; false means it is
    not; null means the status could not be determined.
- name: geo_country_code
  description: The ISO 3166-1 alpha-2 country code derived from the client's IP address at the time of ping submission. This field is used for geographic
    segmentation of telemetry data.
- name: geo_db_version
  description: The version timestamp of the GeoIP database used to resolve the client's geographic location. This is expressed as an ISO 8601 datetime
    string and is used to track which version of the database was active during processing.
- name: geo_subdivision1
  description: The first-level administrative subdivision code (e.g. state, province, or region) derived from the client's IP address, using ISO 3166-2
    subdivision codes. A null value indicates the subdivision could not be determined.
- name: geo_subdivision2
  description: The second-level administrative subdivision (e.g. county, department, or district) derived from the client's IP address. This field
    is null when a second-level subdivision is not available or could not be resolved.
- name: gfx_compositor
  description: The graphics compositor backend used by Firefox to render content (e.g. WebRender, OpenGL, or Direct3D). This field identifies the rendering
    pipeline active during the session.
- name: gfx_features_advanced_layers_status
  description: The availability status of the Advanced Layers (D3D11) compositor feature in Firefox, indicating whether it is 'available', 'disabled',
    'unavailable', 'blocked', or 'blocklisted' along with an optional failure reason code. A null value indicates the feature status was not reported.
- name: gfx_features_d2d_status
  description: The availability status of the Direct2D (D2D) graphics acceleration feature in Firefox, indicating whether it is 'available', 'disabled',
    'unavailable', 'blocked', or 'blocklisted', often accompanied by a specific failure reason code. A null value indicates the status was not reported,
    typically on non-Windows platforms.
- name: gfx_features_d3d11_status
  description: The availability status of the Direct3D 11 graphics feature on the client device. Values indicate whether the feature is available,
    unavailable (with a specific failure reason code), or blocklisted (with a reason such as an empty or unknown driver version).
- name: gfx_features_gpu_process_status
  description: The availability status of the GPU process graphics feature on the client device. Values indicate whether the GPU process is available,
    unused, or unavailable due to platform or OS version constraints, along with a specific failure reason code where applicable.
- name: graduate_count
  description: The number of experiments or studies from which the client has graduated during the reporting period. A value of 0 indicates the client
    did not graduate from any experiments.
- name: has_addon_ratio
  description: The proportion of sessions or clients in an aggregation that have at least one add-on installed. Values range from 0.0 (no sessions
    with add-ons) to 1.0 (all sessions with add-ons).
- name: has_flash
  description: Indicates whether the Adobe Flash plugin is installed and available on the client. True means Flash is present; false means it is not.
- name: histogram
  description: A JSON-serialized histogram representing the normalized distribution of values for a given metric, where keys are bucket labels and
    values are the proportional frequency of observations in each bucket.
- name: histogram_aggregates
  description: An array of aggregated histogram records for various metrics, each containing bucket range metadata, metric identity fields (name, type,
    key, process), the aggregation type, and the per-bucket aggregate counts.
- name: histogram_aggregates_agg_type
  description: The type of aggregation applied to the histogram data within the histogram_aggregates array. The value 'summed_histogram' indicates
    that bucket values have been summed across clients or sessions.
- name: histogram_aggregates_first_bucket
  description: The lower boundary value of the first bucket in an aggregated histogram. This defines the minimum range of values captured by the histogram's
    bucketing scheme.
- name: histogram_aggregates_key
  description: A sub-key used to further distinguish histogram measurements within a metric, such as a DNS provider name or feature flag label. An
    empty string indicates the metric has no sub-key breakdown.
- name: histogram_aggregates_last_bucket
  description: The upper boundary value of the last bucket in an aggregated histogram. This defines the maximum range of values captured by the histogram's
    bucketing scheme.
- name: histogram_aggregates_latest_version
  description: The most recent Firefox major version number observed among the clients contributing to this aggregated histogram record. This reflects
    the highest version seen across all sessions in the aggregation.
- name: histogram_aggregates_metric
  description: The name of the Telemetry histogram metric being aggregated, such as a network timing or memory measurement probe name. This identifies
    what is being measured in the histogram record.
- name: histogram_aggregates_metric_type
  description: The type of histogram used to collect the metric, such as 'histogram-exponential', 'histogram-enumerated', 'histogram-boolean', or 'histogram-linear'.
    This determines how bucket boundaries are defined and how values are interpreted.
- name: histogram_aggregates_num_buckets
  description: The total number of buckets in the aggregated histogram. This controls the resolution of the distribution and varies by metric type
    and configuration.
- name: histogram_aggregates_process
  description: The Firefox process type from which the histogram metric was collected, such as 'parent', 'content', or 'gpu'. This distinguishes measurements
    originating from different browser process contexts.
- name: histogram_parent_devtools_aboutdebugging_opened_count_sum
  description: The total number of times the About Debugging DevTools panel was opened in the parent process during the reporting period. A null value
    indicates the panel was not opened.
- name: histogram_parent_devtools_animationinspector_opened_count_sum
  description: The total number of times the Animation Inspector DevTools panel was opened in the parent process during the reporting period. A null
    value indicates the panel was not opened.
- name: histogram_parent_devtools_browserconsole_opened_count_sum
  description: The total number of times the Browser Console DevTools panel was opened in the parent process during the reporting period. A null value
    indicates the panel was not opened.
- name: histogram_parent_devtools_canvasdebugger_opened_count_sum
  description: The total number of times the Canvas Debugger DevTools panel was opened in the parent process during the reporting period. A null value
    indicates the panel was not opened.
- name: histogram_parent_devtools_computedview_opened_count_sum
  description: The total number of times the Computed View CSS panel was opened in the DevTools inspector during the reporting period. A null value
    indicates the panel was not opened.
- name: histogram_parent_devtools_custom_opened_count_sum
  description: The total number of times a custom DevTools panel was opened in the parent process during the reporting period. A null value indicates
    no custom panel was opened.
- name: histogram_parent_devtools_developertoolbar_opened_count_sum
  description: The total number of times the Developer Toolbar was opened in the parent process during the reporting period. A null value indicates
    the toolbar was not opened.
- name: histogram_parent_devtools_dom_opened_count_sum
  description: The total number of times the DOM DevTools panel was opened in the parent process during the reporting period. A null value indicates
    the panel was not opened.
- name: histogram_parent_devtools_eyedropper_opened_count_sum
  description: The total number of times the Eyedropper color picker tool was opened via DevTools during the reporting period. A null value indicates
    the tool was not opened.
- name: histogram_parent_devtools_fontinspector_opened_count_sum
  description: The total number of times the Font Inspector DevTools panel was opened in the parent process during the reporting period. A null value
    indicates the panel was not opened.
- name: histogram_parent_devtools_inspector_opened_count_sum
  description: The total number of times the DOM/CSS Inspector DevTools panel was opened in the parent process during the reporting period. A null
    value indicates the panel was not opened.
- name: histogram_parent_devtools_jsbrowserdebugger_opened_count_sum
  description: The total number of times the JavaScript Browser Debugger DevTools panel was opened in the parent process during the reporting period.
    A null value indicates the panel was not opened.
- name: histogram_parent_devtools_jsdebugger_opened_count_sum
  description: The total number of times the JavaScript Debugger DevTools panel was opened in the parent process during the reporting period. A null
    value indicates the panel was not opened.
- name: histogram_parent_devtools_jsprofiler_opened_count_sum
  description: The total number of times the JavaScript Profiler DevTools panel was opened in the parent process during the reporting period. A null
    value indicates the panel was not opened.
- name: histogram_parent_devtools_layoutview_opened_count_sum
  description: The total number of times the Layout View (box model) DevTools panel was opened in the parent process during the reporting period. A
    null value indicates the panel was not opened.
- name: histogram_parent_devtools_memory_opened_count_sum
  description: The total number of times the Memory DevTools panel was opened in the parent process during the reporting period. A null value indicates
    the panel was not opened.
- name: histogram_parent_devtools_menu_eyedropper_opened_count_sum
  description: The total number of times the Eyedropper tool was opened via the DevTools menu during the reporting period. A null value indicates the
    tool was not opened through this entry point.
- name: histogram_parent_devtools_netmonitor_opened_count_sum
  description: The total number of times the Network Monitor DevTools panel was opened in the parent process during the reporting period. A null value
    indicates the panel was not opened.
- name: histogram_parent_devtools_options_opened_count_sum
  description: The total number of times the DevTools Options/Settings panel was opened in the parent process during the reporting period. A null value
    indicates the panel was not opened.
- name: histogram_parent_devtools_paintflashing_opened_count_sum
  description: The total number of times the Paint Flashing DevTools toggle was opened in the parent process during the reporting period. A null value
    indicates the feature was not activated.
- name: histogram_parent_devtools_picker_eyedropper_opened_count_sum
  description: The total number of times the Eyedropper color picker tool was opened via the color picker widget in DevTools during the reporting period.
    A null value indicates the tool was not opened through this entry point.
- name: histogram_parent_devtools_responsive_opened_count_sum
  description: The total number of times the Responsive Design Mode DevTools panel was opened in the parent process during the reporting period. A
    null value indicates the panel was not opened.
- name: histogram_parent_devtools_ruleview_opened_count_sum
  description: The total number of times the CSS Rule View DevTools panel was opened in the parent process during the reporting period. A null value
    indicates the panel was not opened.
- name: histogram_parent_devtools_scratchpad_opened_count_sum
  description: The total number of times the Scratchpad JavaScript editor DevTools panel was opened in the parent process during the reporting period.
    A null value indicates the panel was not opened.
- name: histogram_parent_devtools_scratchpad_window_opened_count_sum
  description: The total number of times the Scratchpad window was opened via DevTools during the reporting period. A null value indicates the window
    was not opened.
- name: histogram_parent_devtools_shadereditor_opened_count_sum
  description: The total number of times the Shader Editor DevTools panel was opened in the parent process during the reporting period. A null value
    indicates the panel was not opened.
- name: histogram_parent_devtools_storage_opened_count_sum
  description: The total number of times the Storage Inspector DevTools panel was opened in the parent process during the reporting period. A null
    value indicates the panel was not opened.
- name: histogram_parent_devtools_styleeditor_opened_count_sum
  description: The total number of times the Style Editor DevTools panel was opened in the parent process during the reporting period. A null value
    indicates the panel was not opened.
- name: histogram_parent_devtools_webaudioeditor_opened_count_sum
  description: The total number of times the Web Audio Editor DevTools panel was opened in the parent process during the reporting period. A null value
    indicates the panel was not opened.
- name: histogram_parent_devtools_webconsole_opened_count_sum
  description: The total number of times the Web Console DevTools panel was opened in the parent process during the reporting period. A null value
    indicates the panel was not opened.
- name: histogram_parent_devtools_webide_opened_count_sum
  description: The total number of times the WebIDE DevTools panel was opened in the parent process during the reporting period. A null value indicates
    the panel was not opened.
- name: history_migrations_quantity_all
  description: The total number of history entries migrated from all supported browsers during a browser migration event. A value of 0 indicates a
    migration was attempted but no history entries were transferred.
- name: history_migrations_quantity_chrome
  description: The number of history entries migrated specifically from Google Chrome during a browser migration event. A value of 0 indicates a Chrome
    migration was attempted but no history entries were transferred.
- name: history_migrations_quantity_edge
  description: The number of history entries migrated specifically from Microsoft Edge during a browser migration event. A value of 0 indicates an
    Edge migration was attempted but no history entries were transferred.
- name: history_migrations_quantity_safari
  description: The number of browsing history entries migrated from Safari into Firefox. A null value indicates that no Safari history migration was
    attempted or recorded.
- name: holidays
  description: The estimated holiday effect component from a time-series forecasting model, representing the additive contribution of holiday periods
    to the predicted metric. A value of 0.0 indicates no holiday effect.
- name: holidays_lower
  description: The lower bound of the uncertainty interval for the holiday effect component in a time-series forecasting model. A value of 0.0 indicates
    no estimated holiday contribution at the lower bound.
- name: holidays_upper
  description: The upper bound of the uncertainty interval for the holiday effect component in a time-series forecasting model. A value of 0.0 indicates
    no estimated holiday contribution at the upper bound.
- name: id_bucket
  description: A bucketing identifier (0–19) used to partition clients or records into evenly distributed groups, typically for sampling or incremental
    processing purposes.
- name: impression_count
  description: The total number of times a UI element, recommendation, or message was shown to a user. Higher values indicate repeated exposures.
- name: index
  description: A positional or ordering identifier for a record within its context, such as a ranked result or sequence position.
- name: install_source
  description: The source through which the application was installed, such as the Google Play Store ('com.android.vending') or an unknown/other channel.
    A null value indicates the install source was not recorded.
- name: install_year
  description: The calendar year in which the application or browser was installed. A null value indicates the installation year could not be determined.
- name: installation_first_seen_admin_user
  description: Indicates whether the user had administrator privileges at the time of the first observed installation. True means admin rights were
    present; false means they were not.
- name: installation_first_seen_default_path
  description: Indicates whether Firefox was installed to the default installation path when first observed. True means the default path was used;
    false means a custom path was chosen.
- name: installation_first_seen_failure_reason
  description: The reason the installation metadata lookup failed when the installation was first seen. 'NoError' indicates success; values like 'NotFoundError'
    or 'SyntaxError' describe specific failure conditions.
- name: installation_first_seen_from_msi
  description: Indicates whether Firefox was installed via an MSI package when first observed. True means an MSI installer was used; false means another
    installer type was used.
- name: installation_first_seen_install_existed
  description: Indicates whether a prior Firefox installation already existed on the system when the current installation was first observed. True
    means a previous install was detected; false means it was a fresh installation.
- name: installation_first_seen_installer_type
  description: The type of installer used for the first observed Firefox installation, such as 'stub' (a small downloader), 'full' (a complete offline
    installer), or 'msix' (a Windows app package).
- name: installation_first_seen_other_inst
  description: Indicates whether another non-MSIX Firefox installation was present on the system when the installation was first observed. True means
    another installation existed; false means it did not.
- name: installation_first_seen_other_msix_inst
  description: Indicates whether another MSIX-packaged Firefox installation was present on the system when the installation was first observed. True
    means another MSIX install was detected; false means it was not.
- name: installation_first_seen_profdir_existed
  description: Indicates whether a Firefox profile directory already existed on the system when the installation was first observed. True means a profile
    directory was found; false means none was present.
- name: installation_first_seen_silent
  description: Indicates whether the first observed Firefox installation was performed silently (without user-facing UI). True means a silent install
    occurred; false means the installer UI was shown.
- name: installation_first_seen_version
  description: The version of Firefox that was recorded at the time of the first observed installation, such as '128.0'. A null value indicates the
    version could not be determined.
- name: installer_type
  description: The type of Firefox installer used, either 'full' (a complete offline installer package) or 'stub' (a small installer that downloads
    Firefox during installation).
- name: installs
  description: The count of Firefox installations recorded for a given client or cohort within the relevant time period. A null value indicates no
    installation data was available.
- name: intensity
  description: A measure of user engagement intensity, reflecting the frequency or depth of usage activity within a given period.
- name: ipc_channel_error
  description: The error message or code associated with an IPC (Inter-Process Communication) channel failure, such as a GPU process kill or shutdown
    event. A null value indicates no IPC channel error was recorded.
- name: is_dau
  description: Indicates whether the client qualifies as a Daily Active User (DAU) for the given day. True means the client meets the DAU criteria;
    false means it does not.
- name: is_default_browser
  description: Indicates whether Firefox is set as the system default browser. True means Firefox is the default; false means another browser is set
    as default.
- name: is_desktop
  description: Indicates whether the client is running on a desktop platform. True means the client is a desktop device; false means it is a non-desktop
    device such as mobile.
- name: is_new_profile
  description: Indicates whether the Firefox profile is newly created. True means the profile was created recently; false means it is an existing profile.
- name: is_system
  description: Indicates whether the add-on or component is a system-level extension rather than a user-installed one. True means it is a system extension;
    false means it is user-installed.
- name: is_wow64
  description: Indicates whether the Firefox process is running as a 32-bit application under 64-bit Windows (WOW64 emulation). True means WOW64 is
    active; false means it is not.
- name: isp
  description: The name of the Internet Service Provider associated with the client's IP address, as determined by GeoIP lookup. Reflects the full
    provider name including regional variants.
- name: isp_name
  description: The canonical or normalized name of the client's Internet Service Provider, as derived from GeoIP data. May differ from the full isp
    field by omitting regional suffixes.
- name: isp_organization
  description: The organization or company name registered to the client's IP address, as determined by GeoIP lookup. This may represent a business,
    institution, or ISP operating the network.
- name: key
  description: A string identifier representing the specific event, action, or data point being recorded, such as a search entry point or engine key.
    An empty string indicates no specific key was associated with the record.
- name: last_bucket
  description: The upper boundary value of the last bucket in a histogram, defining the maximum range of the final bin used to aggregate metric values.
- name: latest_version
  description: The most recent major version number of Firefox available or observed at the time of the record, used for tracking update adoption.
- name: latest_version_ratio
  description: The proportion of clients or records associated with the latest Firefox version relative to all versions observed. A value of 1.0 would
    indicate all clients are on the latest version.
- name: legacy_telemetry_client_count
  description: The number of distinct legacy telemetry client IDs associated with a given record or entity. Values greater than 1 indicate multiple
    client IDs have been linked to the same entity.
- name: legacy_telemetry_client_id
  description: The UUID that uniquely identifies a Firefox client within the legacy telemetry system. This corresponds to the client_id field used
    in older Telemetry pings.
- name: linkage_first_seen_date
  description: The earliest date on which a client or identity linkage was first observed in the dataset. Used to determine when a relationship between
    identifiers was established.
- name: linkage_last_seen_date
  description: The most recent date on which a client or identity linkage was observed in the dataset. Used to determine the most recent activity associated
    with a linked identifier relationship.
- name: linked_client_id
  description: A UUID identifying a Firefox client that has been linked to the current record through identity resolution or cross-identifier matching.
- name: locale
  description: The language and regional locale setting of the Firefox browser, represented as a BCP 47 language tag (e.g., 'en', 'fr', 'es'). A null
    value indicates the locale was not reported.
- name: logins_migrations_quantity_all
  description: The total number of saved login entries migrated from all supported browsers into Firefox. A null value indicates no migration data
    was recorded.
- name: logins_migrations_quantity_chrome
  description: The number of saved login entries migrated specifically from Google Chrome into Firefox. A null value indicates no Chrome login migration
    was attempted or recorded.
- name: logins_migrations_quantity_edge
  description: The number of saved login entries migrated specifically from Microsoft Edge into Firefox. A null value indicates no Edge login migration
    was attempted or recorded.
- name: logins_migrations_quantity_safari
  description: The number of saved login entries migrated specifically from Safari into Firefox. A null value indicates no Safari login migration was
    attempted or recorded.
- name: major_version
  description: The major version number of the Firefox browser (e.g., 122, 128, 151), representing the primary release version without minor or patch
    components.
- name: mau
  description: The count of days within the past 28-day window that a client was active, used to compute Monthly Active User (MAU) metrics. A value
    of 1 indicates the client was active on exactly one day in the window.
- name: max_subsession_counter
  description: The highest subsession counter value recorded for a client within the relevant time period, indicating the maximum number of browser
    subsessions observed in a single session.
- name: media_play_time_ms_audio_sum
  description: Total cumulative time in milliseconds that audio media was actively playing during a session. A null value indicates no audio playback
    was recorded.
- name: media_play_time_ms_video_sum
  description: Total cumulative time in milliseconds that video media was actively playing during a session. A null value indicates no video playback
    was recorded.
- name: medium
  description: The marketing or traffic medium through which a user arrived, such as 'referral', 'cpc', or 'firefox-desktop'. Corresponds to the UTM
    medium parameter or equivalent attribution source.
- name: memory_gb
  description: The total amount of physical memory installed on the client device, expressed in gigabytes. Used to characterize device hardware capabilities.
- name: memory_mb
  description: The total amount of physical memory installed on the client device, expressed in megabytes. Used to characterize device hardware capabilities
    at finer granularity than memory_gb.
- name: metadata_app_version
  description: The version string of the application that submitted the ping, as reported in the ping metadata. This may differ from the build version
    and can include build numbers or release suffixes.
- name: metadata_first_seen_date_source_ping
  description: The type of ping that was used to determine the client's first-seen date. Possible values include 'new_profile', 'main', and 'shutdown',
    indicating which ping established the earliest known activity.
- name: metadata_geo_city
  description: The city associated with the client's IP address at the time of ping submission, resolved via a GeoIP database. May be null if city-level
    resolution is unavailable or suppressed.
- name: metadata_geo_country
  description: The two-letter ISO 3166-1 alpha-2 country code associated with the client's IP address at the time of ping submission. Used for geographic
    segmentation of telemetry data.
- name: metadata_geo_db_version
  description: The version timestamp of the GeoIP database used to resolve the client's geographic location. Reflects the currency of the geographic
    lookup data applied during ingestion.
- name: metadata_geo_subdivision1
  description: The first-level administrative subdivision (e.g., state or province) associated with the client's IP address, resolved via a GeoIP database.
    May be null if subdivision-level resolution is unavailable or suppressed.
- name: metadata_geo_subdivision2
  description: The second-level administrative subdivision (e.g., county or district) associated with the client's IP address, resolved via a GeoIP
    database. May be null if this level of resolution is unavailable or suppressed.
- name: metadata_header_date
  description: The raw HTTP Date header value from the ping submission request, formatted as an RFC 7231 HTTP-date string. Reflects the date and time
    reported by the submitting client or intermediary.
- name: metadata_header_dnt
  description: The value of the HTTP Do Not Track (DNT) header sent with the ping submission request. A value of '1' indicates the client requested
    tracking opt-out; null means the header was absent.
- name: metadata_header_parsed_date
  description: The parsed timestamp equivalent of the HTTP Date header from the ping submission request, stored as a UTC TIMESTAMP. Null if the Date
    header was absent or could not be parsed.
- name: metadata_header_parsed_x_lb_tags_tls_cipher_hex
  description: The hexadecimal identifier of the TLS cipher suite used for the connection through which the ping was submitted, extracted from load
    balancer tags. Common values include '1301' (TLS_AES_128_GCM_SHA256) and 'c02f' (ECDHE-RSA-AES128-GCM-SHA256).
- name: metadata_header_parsed_x_lb_tags_tls_version
  description: The TLS protocol version used for the connection through which the ping was submitted, extracted from load balancer tags. Values include
    'TLSv1.3' and 'TLSv1.2'.
- name: metadata_header_parsed_x_source_tags
  description: An array of source tags extracted from the X-Source-Tags HTTP header of the ping submission request. Tags identify the origin or routing
    path of the ping through Mozilla's ingestion pipeline.
- name: metadata_header_x_debug_id
  description: The value of the X-Debug-Id HTTP header attached to the ping submission request, used to identify debug or test pings. Null when the
    header is absent, indicating a standard production submission.
- name: metadata_header_x_foxsec_ip_reputation
  description: The IP reputation score or classification provided by the FoxSec security system for the submitting client's IP address, attached as
    an HTTP header. Null when the header is absent or no reputation data is available.
- name: metadata_header_x_lb_tags
  description: The raw value of the X-LB-Tags HTTP header set by the load balancer, containing TLS version and cipher suite information for the submission
    connection. Example format; 'TLSv1.3, 1301'.
- name: metadata_header_x_pingsender_version
  description: The version of the PingSender component that submitted the ping, as reported in the X-PingSender-Version HTTP header. Null when pings
    are submitted directly by the browser rather than PingSender.
- name: metadata_header_x_source_tags
  description: The raw string value of the X-Source-Tags HTTP header from the ping submission request, identifying the origin or routing context of
    the ping. Null when the header was not present in the request.
- name: metadata_header_x_telemetry_agent
  description: The User-Agent-style string identifying the telemetry SDK and runtime environment used to submit the ping, from the X-Telemetry-Agent
    HTTP header. Includes the Glean SDK version and the language runtime and operating system, e.g., 'Glean/67.2.0 (Rust on Windows)'.
- name: metadata_isp_db_version
  description: The version timestamp of the ISP database used to resolve the client's internet service provider information. Reflects the currency
    of the ISP lookup data applied during ingestion.
- name: metadata_isp_name
  description: The name of the internet service provider (ISP) associated with the client's IP address at the time of ping submission. Derived from
    an ISP lookup database during ingestion.
- name: metadata_isp_organization
  description: The organization name associated with the client's IP address at the time of ping submission, as resolved by the ISP database. May differ
    slightly from metadata_isp_name when the ISP operates under a separate organizational entity.
- name: metadata_reported_main_ping
  description: Indicates whether a main ping was reported for this client profile record. True means a main ping was received; false means it was not.
- name: metadata_reported_new_profile_ping
  description: Indicates whether a new_profile ping was reported for this client profile record. True means a new_profile ping was received; false
    means it was not.
- name: metadata_reported_shutdown_ping
  description: Indicates whether a shutdown ping was reported for this client profile record. True means a shutdown ping was received; false means
    it was not.
- name: metadata_user_agent_browser
  description: The browser name parsed from the User-Agent string of the ping submission request. Common values include 'Firefox' and 'Chrome'; null
    when the User-Agent was absent or could not be parsed.
- name: metadata_user_agent_os
  description: The operating system name and version parsed from the User-Agent string of the ping submission request. Examples include 'Windows 10',
    'Android', and 'Linux'; null when the User-Agent was absent or unparseable.
- name: metadata_user_agent_version
  description: The browser version number parsed from the User-Agent string of the ping submission request. Represents the major version of the browser
    (e.g., '128', '115'); null when the User-Agent was absent or could not be parsed.
- name: metric
  description: The name of the telemetry metric being recorded, such as a histogram or scalar probe name (e.g., 'gc_ms', 'thread_wakeup'). Used to
    identify which specific measurement a row corresponds to.
- name: metric_date
  description: The calendar date associated with the metric measurement or aggregation. Used to partition and filter metric data by the date on which
    it was collected or computed.
- name: metric_name
  description: A human-readable label identifying the type or category of the metric being tracked, such as 'uri_count' or 'active_ticks'. Used to
    differentiate among distinct metric definitions within a dataset.
- name: metric_type
  description: The telemetry probe or Glean metric type that describes how the metric value was collected, such as 'histogram-exponential', 'scalar',
    or 'keyed-scalar'. Determines the structure and interpretation of the associated metric data.
- name: metrics
  description: A deeply nested struct containing all Glean metric values reported in the ping, organized by metric type (e.g., boolean, string, quantity,
    labeled_counter). Each subfield corresponds to a specific named metric collected by the application.
- name: min_subsession_counter
  description: The minimum subsession counter value observed for a client within an aggregation period, indicating the earliest subsession index recorded.
    A value of 1 typically corresponds to the first subsession of a browser session.
- name: monthly_users
  description: The count of distinct active users observed within a rolling or calendar month window. Used to measure Monthly Active Users (MAU) across
    product or cohort segments.
- name: moz_crash_reason
  description: A string describing the reason for a crash as reported by the MOZ_CRASH macro or equivalent crash annotation. Null when no specific
    crash reason was recorded by the application at the time of the crash.
- name: multiplicative_terms
  description: A multiplicative adjustment factor applied in a forecasting or modeling context, representing the product of seasonal or trend components.
    A value of 0.0 indicates no multiplicative adjustment is applied.
- name: multiplicative_terms_lower
  description: The lower bound of the confidence interval for the multiplicative forecast term. A value of 0.0 indicates no lower-bound adjustment
    is estimated.
- name: multiplicative_terms_upper
  description: The upper bound of the confidence interval for the multiplicative forecast term. A value of 0.0 indicates no upper-bound adjustment
    is estimated.
- name: n_created_pictureinpicture
  description: The number of Picture-in-Picture windows created by a client during the measurement period. A value of 0 indicates the feature was not
    used; null indicates the metric was not recorded.
- name: n_logged_event
  description: The count of events logged by a client or session during the measurement period. Reflects the total number of discrete telemetry event
    records captured.
- name: n_viewed_protection_report
  description: The number of times a client viewed the Firefox Privacy Protections report during the measurement period. A value of 0 indicates the
    report was not opened.
- name: name
  description: A human-readable name associated with the entity in the record, such as an add-on or extension name. Null values indicate that no name
    was available or reported.
- name: nbr_clients_uninstalling
  description: The number of distinct clients that uninstalled the product or a component (such as an add-on) during the measurement period. Used to
    track uninstall rates across cohorts or add-on populations.
- name: nbr_cpu_cores
  description: The number of logical CPU cores available on the client device. Used to characterize the processing capabilities of the hardware environment
    on which the product is running.
- name: nbr_events
  description: The total number of events recorded in the row's context. A value of 1 indicates a single event occurred, while higher values reflect
    multiple events aggregated together.
- name: nbr_unique_clients_uninstalling
  description: The count of distinct clients that performed an uninstall action within the aggregation period. Each client is counted only once regardless
    of how many uninstall events it generated.
- name: nbr_unique_users
  description: The count of distinct users observed within the aggregation period. Each user is counted only once, regardless of the number of sessions
    or events they generated.
- name: new_profile_metric_date
  description: Indicates whether the record corresponds to the date on which a new profile was created. True means the metric date coincides with the
    profile creation date; False means it does not.
- name: new_profile_rate
  description: The rate at which new profiles are being created, expressed as a floating-point ratio. This is typically computed relative to a baseline
    population or time window.
- name: new_profile_ratio
  description: The proportion of records or clients that represent newly created profiles within the aggregation window. A value of 0.0 indicates no
    new profiles, while higher values reflect a greater share of new profiles.
- name: new_profiles
  description: The count of newly created Firefox profiles within the aggregation period. A value of 0 indicates no new profiles were observed for
    that row's dimensions.
- name: new_profiles_metric_date
  description: The numeric representation of the metric date associated with new profile counts. This is used to align new-profile measurements to
    a specific reporting date.
- name: newtab_homepage_category
  description: The category classification of the browser's homepage setting as observed on a new-tab event. Values include states such as 'enabled',
    'disabled', 'search-engine', 'extension', 'social-media', and others indicating the type of homepage configured.
- name: newtab_newtab_category
  description: The category classification of the new-tab page setting at the time of a new-tab event. Common values are 'enabled' (default Firefox
    new tab), 'disabled', 'extension' (a third-party extension controls the page), and 'other'.
- name: newtab_open_source
  description: The URL or source from which the new-tab page was opened, such as 'about:newtab', 'about:home', or 'about:welcome'. A null or 'other'
    value indicates the page was opened from an unrecognized or untracked source.
- name: newtab_search_enabled
  description: Indicates whether the search box is enabled on the new-tab page. True means the search feature is active; False means it has been disabled
    by the user or policy.
- name: newtab_visit_count
  description: The total number of new-tab page visits recorded for the given client or session within the aggregation period. Higher values indicate
    more frequent new-tab page openings.
- name: newtab_visit_ended_at
  description: The timestamp (in milliseconds relative to session start or another epoch) at which the new-tab page visit ended. A value of 0 typically
    indicates the end time was not captured or the visit was still in progress.
- name: newtab_visit_id
  description: A unique identifier (UUID) assigned to a single new-tab page visit. It is used to join or deduplicate events belonging to the same new-tab
    visit across tables.
- name: newtab_visit_started_at
  description: The timestamp (in milliseconds relative to session start or another epoch) at which the new-tab page visit began. A value of 0 often
    indicates the start time was not available; the sentinel value 9223372036854775807 (INT64 max) may indicate an unset state.
- name: newtab_weather_widget_enabled
  description: Indicates whether the weather widget is enabled on the new-tab page. True means the widget is active and visible; False means it has
    been turned off.
- name: non_norm_aggregates
  description: An array of key-value pairs representing non-normalized aggregate metric values. Each entry maps a bucket key or dimension label to
    its corresponding floating-point aggregated measurement.
- name: non_norm_aggregates_key
  description: The key component of a non-normalized aggregate entry, typically representing a histogram bucket index or a named dimension. It is used
    alongside non_norm_aggregates_value to identify the specific metric slot being measured.
- name: non_norm_aggregates_value
  description: The floating-point value component of a non-normalized aggregate entry, representing the raw (non-normalized) measurement for the corresponding
    key. A value of 0.0 is the most common, indicating no activity in that bucket.
- name: non_norm_histogram
  description: A JSON-encoded string representing a non-normalized histogram, where each key is a bucket label or index and the corresponding value
    is the raw count for that bucket. This captures the full distribution of a metric without normalization.
- name: normalized_app_name
  description: The standardized, human-readable name of the Firefox application that submitted the telemetry data, such as 'Firefox Desktop', 'Fenix',
    'Firefox iOS', or 'Focus Android'. This normalizes raw app identifiers into consistent product names.
- name: normalized_channel
  description: The standardized Firefox release channel from which the telemetry was submitted. Possible values include 'release', 'beta', 'nightly',
    'esr', 'aurora', and 'Other' for unrecognized channels.
- name: normalized_country_code
  description: The ISO 3166-1 alpha-2 country code representing the country associated with the client's telemetry submission, such as 'US', 'DE',
    or 'IN'. This is derived from geo-IP resolution of the client's network address.
- name: normalized_os
  description: The standardized operating system name on which Firefox is running, normalized to one of 'Windows', 'Mac', or 'Linux'. This collapses
    raw OS strings into consistent, comparable values.
- name: normalized_os_version
  description: The standardized version string of the operating system on which Firefox is running, such as '10.0' for Windows 10 or '6.8.0' for a
    Linux kernel version. This normalizes raw OS version strings for consistent cross-platform comparison.
- name: num_buckets
  description: The number of buckets defined in the histogram used to record a metric. Common values such as 50, 100, or 1000 reflect different histogram
    resolutions used across Firefox telemetry probes.
- name: num_clients_active_on_day
  description: The count of distinct clients that were active on a specific day within the cohort or aggregation window. A value of 0 indicates no
    clients in that segment were active on that day.
- name: num_clients_in_cohort
  description: The total number of distinct clients belonging to the cohort defined by the row's dimensions. This represents the cohort size used as
    the denominator for retention and engagement calculations.
- name: numeric_index
  description: A sequential numeric index assigned to a record, typically used to order rows or uniquely identify a position within a series or partition.
    Values are generally monotonically increasing and unique within their context.
- name: oom_allocation_size
  description: The size in bytes of the memory allocation that triggered an out-of-memory (OOM) condition. This field is frequently null when no OOM
    allocation size was recorded; common non-null values correspond to typical allocation sizes such as 4096 or 65536 bytes.
- name: organic_pocket_clicks
  description: The count of user clicks on organic (non-sponsored) Pocket content recommendations displayed on the new-tab page. A value of 0 indicates
    no clicks occurred for that session or aggregation period.
- name: organic_pocket_dismissals
  description: The count of times a user dismissed an organic (non-sponsored) Pocket content recommendation on the new-tab page. A value of 0 indicates
    no dismissals occurred for that session or aggregation period.
- name: organic_pocket_impressions
  description: The count of times organic (non-sponsored) Pocket content recommendations were displayed (impressed) to the user on the new-tab page.
    A value of 0 indicates the Pocket section was not shown or no impressions were recorded.
- name: organic_pocket_saves
  description: The count of times a user saved an organic (non-sponsored) Pocket content recommendation to their Pocket list from the new-tab page.
    A value of 0 indicates no saves occurred for that session or aggregation period.
- name: organic_search_count
  description: The count of organic (non-paid, non-tagged) search queries performed by the client within the aggregation period. Null values indicate
    the search count was not available or not applicable for the given row's dimensions.
- name: organic_topsite_clicks
  description: The count of user clicks on organic (non-sponsored) top site tiles displayed on the new-tab page. A value of 0 indicates no clicks occurred
    for that session or aggregation period.
- name: organic_topsite_dismissals
  description: The count of times a user dismissed an organic (non-sponsored) top site tile from the new-tab page. A value of 0 indicates no dismissals
    occurred for that session or aggregation period.
- name: organic_topsite_impressions
  description: The count of times organic (non-sponsored) top site tiles were displayed (impressed) to the user on the new-tab page. A value of 0 indicates
    no impressions were recorded, typically because top sites were not shown.
- name: organic_topsite_tile_clicks
  description: The count of user clicks specifically on organic (non-sponsored) top site tile entries on the new-tab page. This metric may differ from
    organic_topsite_clicks when tile-level granularity is tracked separately.
- name: organic_topsite_tile_dismissals
  description: The count of times a user dismissed a specific organic (non-sponsored) top site tile entry on the new-tab page. A value of 0 indicates
    no tile-level dismissals occurred for that session or aggregation period.
- name: organic_topsite_tile_impressions
  description: The count of times specific organic (non-sponsored) top site tile entries were displayed to the user on the new-tab page. This tracks
    tile-level impression counts, which may differ from aggregate topsite impression counts.
- name: os
  description: The raw operating system name as reported by the client, such as 'Windows_NT', 'Darwin', 'Linux', 'Android', or 'iOS'. This is the unprocessed
    value before any normalization is applied.
- name: os_environment_is_taskbar_pinned_any
  description: Indicates whether Firefox is pinned to the Windows taskbar in any configuration (standard or private browsing). True means at least
    one Firefox shortcut is pinned to the taskbar; False means it is not pinned in any form.
- name: os_environment_is_taskbar_pinned_private
  description: Indicates whether the Firefox Private Browsing shortcut is specifically pinned to the Windows taskbar. True means the private browsing
    shortcut is pinned; False means it is not.
- name: os_environment_is_taskbar_pinned_private_any
  description: Indicates whether Firefox Private Browsing is pinned to the Windows taskbar in any configuration. True means a private browsing shortcut
    exists on the taskbar in some form; False means it does not.
- name: os_grouped
  description: A coarser grouping of the operating system into broad categories; 'Windows', 'Mac', 'Linux', or 'Other'. This simplifies OS-level analysis
    by collapsing detailed OS variants into major platform groups.
- name: os_name
  description: The standardized name of the operating system, such as 'Windows', 'Mac', 'Linux', or 'Android'. This is a normalized representation
    of the OS, distinct from the raw os field and used for consistent cross-platform reporting.
- name: os_service_pack_major
  description: The major version number of the Windows Service Pack installed on the client's operating system. A value of 0 indicates no service pack
    is installed; null indicates the field is not applicable (e.g., for non-Windows platforms).
- name: os_service_pack_minor
  description: The minor version number of the Windows Service Pack installed on the client's operating system. A value of 0 is the most common, indicating
    the minor service pack version is zero; null indicates the field is not applicable for non-Windows platforms.
- name: os_version
  description: The full version string of the operating system on which the browser is running (e.g., '10.0', '13.5.1'). Combines major, minor, and
    patch components into a single human-readable string.
- name: os_version_major
  description: The major version number component of the operating system. Used for coarse-grained OS version segmentation across platforms such as
    Windows, macOS, and Android.
- name: os_version_minor
  description: The minor version number component of the operating system. Used alongside the major version to more precisely identify the OS release.
- name: osversion
  description: A string representation of the operating system version, potentially including decimal components (e.g., '26.5'). May differ in format
    from os_version depending on the data source or platform.
- name: partner_distribution_version
  description: The version identifier of the partner distribution package used to install the browser. Null when the browser was not installed through
    a partner distribution.
- name: partner_distributor
  description: The name of the third-party organization or Linux distribution that packaged and distributed the browser (e.g., 'canonical', 'mint',
    'fedora'). Null when the browser was not distributed through a partner.
- name: partner_distributor_channel
  description: The specific distribution channel or variant used by the partner distributor (e.g., 'ubuntu', 'esrWinFull'). Null or empty when no partner
    distributor channel applies.
- name: partner_id
  description: A short identifier for the partner organization responsible for distributing the browser (e.g., 'ubuntu', 'mozillaonline', 'yandex').
    Null when the browser was not distributed via a recognized partner.
- name: partner_org
  description: A human-readable categorization of the partner organization that distributed the browser (e.g., 'Linux - Canonical', 'Mozilla - China').
    Set to 'non-distribution' when the browser was not distributed through a partner.
- name: payload_crashDate
  description: The date on which the crash event occurred, as reported in the crash ping payload. Encoded as a string in the raw payload format.
- name: payload_crashTime
  description: The time at which the crash event occurred, as reported in the crash ping payload. Encoded as a string in the raw payload format.
- name: payload_hasCrashEnvironment
  description: Indicates whether the crash ping payload includes environment data collected at the time of the crash. True when environment data is
    present, false otherwise.
- name: payload_metadata_key_value
  description: A list of key-value pairs containing metadata fields from the crash ping payload. Each entry is a struct with a string key and string
    value representing a metadata attribute.
- name: payload_processType
  description: The type of browser process that was running when the crash occurred (e.g., 'main', 'content', 'gpu'), as reported in the crash ping
    payload.
- name: payload_version
  description: The schema or protocol version of the crash ping payload. Used to identify the payload format for parsing and compatibility purposes.
- name: pct_users_profile_age_8_to_365_days
  description: The proportion of users whose Firefox profile age falls between 8 and 365 days (i.e., relatively new but not brand-new users). Expressed
    as a decimal fraction between 0.0 and 1.0.
- name: pct_users_profile_age_less_than_7_days
  description: The proportion of users whose Firefox profile age is less than 7 days, representing very new or recently created profiles. Expressed
    as a decimal fraction between 0.0 and 1.0.
- name: pct_users_profile_age_over_365_days
  description: The proportion of users whose Firefox profile age exceeds 365 days, representing established long-term users. Expressed as a decimal
    fraction between 0.0 and 1.0.
- name: ping_sent_metric_date
  description: Indicates whether a ping was sent on the relevant metric date. True when a ping was confirmed sent; null when the information is unavailable.
- name: ping_sent_week_4
  description: Indicates whether the user sent a ping during their fourth week of activity. True if a ping was sent, false if the user was active but
    did not send a ping, and null if the information is unavailable.
- name: pings_aggregated_by_this_row
  description: The number of individual pings that were collapsed into this aggregated row. A value of 1 indicates no aggregation occurred for this
    row.
- name: placement
  description: The named location or slot within a surface (such as the New Tab page) where a content item was displayed or interacted with (e.g.,
    'newtab_spocs', 'newtab_stories_1'). Null when no placement is applicable.
- name: places_bookmarks_count_mean
  description: The mean number of bookmarks stored in the user's Firefox Places database over the reporting period. Null when bookmark count data was
    not available.
- name: places_bookmarks_searchbar_cumulative_searches_sum
  description: The cumulative total number of searches performed via the bookmarks search bar in the Firefox Library or sidebar. Null when this metric
    was not recorded.
- name: places_library_cumulative_bookmark_searches_sum
  description: The cumulative total number of bookmark searches performed through the Firefox Library interface. Null when this metric was not recorded.
- name: places_library_cumulative_history_searches_sum
  description: The cumulative total number of history searches performed through the Firefox Library interface. Null when this metric was not recorded.
- name: places_pages_count_mean
  description: The mean number of pages (history entries) stored in the user's Firefox Places database over the reporting period. Null when page count
    data was not available.
- name: places_previousday_visits_mean
  description: The mean number of page visits recorded in the browser's history for the previous day. Null when visit data was not available; zero
    indicates the browser was active but no visits were recorded.
- name: places_searchbar_cumulative_filter_count_sum
  description: The cumulative total number of times the filter was applied in the Places search bar. Null when this metric was not recorded.
- name: places_searchbar_cumulative_searches_sum
  description: The cumulative total number of searches performed via the Places search bar. Null when this metric was not recorded.
- name: platform_version
  description: The version string of the Firefox platform (Gecko engine) as reported by the browser. May align with or differ slightly from the application
    version depending on the build type.
- name: play_store_attribution_campaign
  description: The UTM campaign name associated with the Play Store attribution for an Android Firefox install (e.g., 'firefox-desktop', 'mozilla-org').
    Null when no campaign attribution is available.
- name: play_store_attribution_content
  description: The UTM content parameter associated with the Play Store attribution, identifying the specific creative or entry point that drove the
    install (e.g., 'onboarding-modal', 'firefoxview'). Null when not available.
- name: play_store_attribution_install_referrer_response
  description: The raw install referrer string returned by the Google Play Store at install time, containing UTM and other attribution parameters.
    Null when the referrer response was not captured.
- name: play_store_attribution_medium
  description: The UTM medium parameter associated with the Play Store attribution, describing the marketing channel that drove the install. Null when
    no medium attribution is available.
- name: play_store_attribution_source
  description: The UTM source parameter associated with the Play Store attribution, identifying the origin of the install traffic (e.g., 'google-play',
    'google', 'eea-browser-choice'). Null when not available.
- name: play_store_attribution_term
  description: The UTM term parameter associated with the Play Store attribution, typically capturing the search keyword that led to the install (e.g.,
    'firefox', 'mozilla firefox'). Null when not available.
- name: play_time_ratio
  description: The ratio of active play or media time to total elapsed time during a session or reporting period. Null when the ratio could not be
    computed.
- name: plugin_hangs_sum
  description: The total number of plugin hang events recorded during the reporting period. Null when no plugin hang data was reported, which is common
    as plugin usage has declined.
- name: plugins_infobar_allow_sum
  description: The total number of times the user clicked 'Allow' on the plugins infobar notification. Null when this metric was not reported.
- name: plugins_infobar_block_sum
  description: The total number of times the user clicked 'Block' on the plugins infobar notification. Null when this metric was not reported.
- name: plugins_infobar_shown_sum
  description: The total number of times the plugins infobar notification was displayed to the user. Null when this metric was not reported.
- name: plugins_notification_shown_sum
  description: The total number of times a plugin-related notification (distinct from the infobar) was shown to the user. Null when this metric was
    not reported.
- name: pocket_clicks
  description: The total number of times the user clicked on a Pocket-recommended story or content item. A value of zero indicates the feature was
    present but no clicks occurred.
- name: pocket_enabled
  description: Indicates whether the Pocket integration is enabled in the browser. True when Pocket is enabled, false when it has been disabled by
    the user.
- name: pocket_impressions
  description: The total number of times Pocket-recommended stories were displayed (impressed) to the user. A value of zero indicates the feature was
    visible but no impressions were recorded.
- name: pocket_is_signed_in
  description: Indicates whether the user is signed in to their Pocket account within Firefox. True when signed in, false when not signed in, and null
    when sign-in status was not available.
- name: pocket_saves
  description: The total number of articles or pages the user saved to Pocket during the reporting period. A value of zero indicates Pocket was active
    but no saves were made.
- name: pocket_sponsored_stories_enabled
  description: Indicates whether sponsored stories are enabled within the Pocket section of the New Tab page. True when sponsored stories are turned
    on, false when the user has disabled them.
- name: pocket_story_position
  description: The zero-based index position of a Pocket story within its display grid or list on the New Tab page. Null when no story position is
    applicable for the row.
- name: pocket_thumb_voting_events
  description: The number of Pocket thumb-voting interaction events recorded for a client. A value of 0 indicates no voting activity occurred; higher
    values reflect increasing levels of thumb-up or thumb-down engagement.
- name: position
  description: The zero- or one-based ordinal position of an item (e.g., a recommendation, search result, or UI element) within its containing list
    or surface. Lower values indicate items appearing earlier or higher in the display order.
- name: previous_build_id
  description: The build ID of the Firefox installation that was active before the most recent update, formatted as a timestamp string (e.g., '20251028124850').
    Null when no prior build is known, such as on a fresh installation.
- name: process
  description: The name of the Firefox process from which a measurement or event originates, such as 'parent', 'content', or 'gpu'. Allows distinguishing
    telemetry contributions across the multi-process browser architecture.
- name: process_type
  description: The type of Firefox process associated with a telemetry record, such as 'parent', 'content', 'gpu', 'rdd', 'plugin', 'socket', or 'utility'.
    Null values indicate records where the process type could not be determined.
- name: product
  description: The Mozilla product name from which the telemetry record originates, such as 'Fenix', 'Firefox iOS', 'Focus Android', or 'Fennec'. Used
    to segment data across the family of Mozilla mobile and browser products.
- name: profile_age_in_days
  description: The age of the Firefox profile in whole days at the time of the telemetry submission, calculated from the profile creation date. A value
    of 0 indicates the profile was created on the same day as the submission.
- name: profile_created
  description: A numeric representation of the date on which the Firefox profile was created, typically as days since the Unix epoch. Used to derive
    profile age and cohort membership.
- name: profile_creation_date
  description: The date on which the Firefox profile was created, stored as a string in YYYYMMDD format. Used to determine profile age and to assign
    clients to new-profile cohorts.
- name: profile_date
  description: The date on which the Firefox profile was created, stored as a DATE value. Used to calculate profile age and to segment clients into
    new-profile cohorts.
- name: profile_group_id
  description: A UUID that identifies the profile group to which a Firefox profile belongs, enabling grouping of related profiles on the same installation.
    Null when the profile group identifier has not been set or is unavailable.
- name: push_api_notify_sum
  description: The total number of Web Push API notification events delivered to a client within the aggregation period. Null indicates the client
    did not receive any push notifications during that period.
- name: qdau_desktop
  description: The qualified daily active user count for desktop Firefox, reflecting the number of days a client met the qualification criteria for
    active use. A value of 0 indicates the client did not qualify as active on any day in the period.
- name: qualified_second_day
  description: A boolean flag indicating whether a new profile met the qualification criteria for activity on the second day after profile creation.
    True means the profile was active and qualified on day two; false means it was not.
- name: qualified_week4
  description: A boolean flag indicating whether a profile met the qualification criteria for activity during the fourth week after profile creation.
    True means the profile qualified as active in week four; false means it did not.
- name: realm
  description: The deployment realm or environment associated with the telemetry record, used to separate data collected from different infrastructure
    environments. Typically a fixed value for a given data pipeline configuration.
- name: reason
  description: A string describing the cause or signal type associated with a crash or process termination event, such as 'SIGSEGV / SEGV_MAPERR' or
    'EXCEPTION_BREAKPOINT'. Null when no specific reason was captured.
- name: recommendation_id
  description: A UUID that uniquely identifies a specific content recommendation served to a user, enabling impression and engagement events to be
    linked back to a single recommendation instance. Null when no recommendation is associated with the record.
- name: record_key
  description: The key component of a key-value pair within a keyed scalar or histogram metric, identifying a specific sub-dimension of the measurement.
    Numeric string keys are common in bucketed or indexed metrics.
- name: record_value
  description: The numeric value associated with a record_key in a key-value telemetry metric, representing a measurement such as a proportion, count,
    or histogram bucket weight. Values range from 0.0 upward depending on the metric type.
- name: region
  description: The two-letter ISO 3166-1 alpha-2 country or region code indicating the geographic market associated with the record, such as 'US',
    'DE', or 'GB'. Null when the region could not be determined.
- name: regressor_00
  description: The point estimate value for the first external regressor variable used in a forecasting or modeling pipeline. A value of 0.0 typically
    indicates the regressor had no contribution for that period.
- name: regressor_00_lower
  description: The lower-bound confidence interval value for the first external regressor variable in a forecasting model. A value of 0.0 typically
    indicates no lower-bound adjustment was applied.
- name: regressor_00_upper
  description: The upper-bound confidence interval value for the first external regressor variable in a forecasting model. A value of 0.0 typically
    indicates no upper-bound adjustment was applied.
- name: repeat_profile
  description: A boolean flag indicating whether a profile has been seen in previous reporting periods and is therefore not considered a new profile.
    True means the profile is a repeat; false means it is a new profile.
- name: repeat_profiles
  description: The count of profiles that have been seen in previous reporting periods and are classified as repeat (non-new) profiles within the aggregation
    group. Used alongside new profile counts for cohort-level reporting.
- name: resolution
  description: A string describing the outcome or resolution of a process, event, or experiment record. The specific values depend on the context of
    the table in which this field appears.
- name: retained_week4
  description: A numeric flag indicating whether a profile was retained through the fourth week after profile creation, where 0 means not retained.
    Null indicates the retention status could not be determined for that period.
- name: retained_week_4
  description: A boolean flag indicating whether a profile was still active during the fourth week after profile creation. True means the profile was
    retained; false means it was not; null indicates the status could not be determined.
- name: retained_week_4_new_profile
  description: A boolean flag indicating whether a new profile was retained through the fourth week after its creation. True means the new profile
    returned in week four; false means it did not.
- name: retained_week_4_new_profiles
  description: The count of new profiles that were retained through the fourth week after their creation date within the aggregation group. Used to
    measure early-lifecycle retention for newly created profiles.
- name: return_user
  description: A numeric flag indicating whether a client is classified as a returning user, where 0 means the client did not return within the measurement
    window. Null indicates the return status could not be determined.
- name: returned_second_day
  description: A boolean flag indicating whether a new profile returned and was active on the second day after profile creation. True means the profile
    returned on day two; false means it did not.
- name: row_count
  description: The number of rows associated with a grouping key or aggregation unit within the dataset. Used for weighting, validation, or understanding
    the volume of underlying records behind a summary row.
- name: row_source
  description: Indicates whether the telemetry record originated from a 'Desktop' or 'Mobile' Firefox client. Used to segment or filter data by platform
    type.
- name: sample_id
  description: A stable integer between 0 and 99 derived from the client_id, used to select a consistent random sample of the client population for
    analysis. Queries can filter on this field to work with a predictable fraction of users.
- name: sandbox_effective_content_process_level
  description: The effective sandbox security level applied to content processes on a client, where higher integer values indicate stricter sandboxing.
    A value of 0 or null may indicate sandboxing is disabled or the level was not reported.
- name: save_count
  description: The number of Pocket save actions performed by a client within the reporting period. A value of 0 indicates no saves occurred.
- name: scalar_a11y_hcm_background
  description: The background color value used in High Contrast Mode for accessibility, represented as a 32-bit ARGB integer. Null indicates the client
    did not have High Contrast Mode active or did not report this scalar.
- name: scalar_a11y_hcm_foreground
  description: The foreground (text) color value used in High Contrast Mode for accessibility, represented as a 32-bit ARGB integer. Null indicates
    the client did not have High Contrast Mode active or did not report this scalar.
- name: scalar_combined_webrtc_nicer_stun_retransmits_sum
  description: The total number of STUN packet retransmissions recorded by the WebRTC nICEr library during the reporting period. Currently always null,
    indicating this metric is not yet populated in the pipeline.
- name: scalar_combined_webrtc_nicer_turn_401s_sum
  description: The total count of HTTP 401 Unauthorized responses received from TURN servers by the WebRTC nICEr library. Currently always null, indicating
    this metric is not yet populated in the pipeline.
- name: scalar_combined_webrtc_nicer_turn_403s_sum
  description: The total count of HTTP 403 Forbidden responses received from TURN servers by the WebRTC nICEr library. Currently always null, indicating
    this metric is not yet populated in the pipeline.
- name: scalar_combined_webrtc_nicer_turn_438s_sum
  description: The total count of HTTP 438 Stale Nonce responses received from TURN servers by the WebRTC nICEr library. Currently always null, indicating
    this metric is not yet populated in the pipeline.
- name: scalar_content_navigator_storage_estimate_count_sum
  description: The total number of times the navigator.storage.estimate() API was called from content processes during the reporting period. Currently
    always null, indicating this metric is not yet populated in the pipeline.
- name: scalar_content_navigator_storage_persist_count_sum
  description: The total number of times the navigator.storage.persist() API was called from content processes during the reporting period. Currently
    always null, indicating this metric is not yet populated in the pipeline.
- name: scalar_content_telemetry_event_counts_sum
  description: A keyed array of event-category strings to their total occurrence counts, aggregated across content processes. Each struct entry maps
    an event key to its cumulative sum for the reporting period.
- name: scalar_parent_aushelper_websense_reg_version
  description: The version string of the Websense endpoint security software detected in the Windows registry by the AUS helper component. Null indicates
    the software was not detected or the scalar was not reported.
- name: scalar_parent_browser_engagement_max_concurrent_tab_count_max
  description: The maximum number of tabs that were open simultaneously in any single session during the reporting period, as recorded by the browser
    engagement scalar in the parent process. Higher values indicate heavier multi-tab usage.
- name: scalar_parent_browser_engagement_max_concurrent_window_count_max
  description: The maximum number of browser windows that were open simultaneously during the reporting period, as recorded by the browser engagement
    scalar in the parent process. A value of 1 indicates the user never opened more than one window.
- name: scalar_parent_browser_engagement_tab_open_event_count_sum
  description: The aggregated sum of tab open events fired in the browser during a reporting period. A higher value indicates more frequent tab-opening
    behavior by the user.
- name: scalar_parent_browser_engagement_total_uri_count_normal_and_private_mode_sum
  description: The aggregated sum of total URIs visited across both normal and private browsing modes during a reporting period. This provides a comprehensive
    measure of overall browsing activity regardless of privacy mode.
- name: scalar_parent_browser_engagement_total_uri_count_sum
  description: The aggregated sum of total URIs visited in normal browsing mode during a reporting period. This serves as a measure of a user's browsing
    engagement, excluding private browsing sessions.
- name: scalar_parent_browser_engagement_unfiltered_uri_count_sum
  description: The aggregated sum of total URIs visited without filtering (e.g., excluding chrome or about pages) during a reporting period. This gives
    a broader count of all navigation events including internal browser URIs.
- name: scalar_parent_browser_engagement_unique_domains_count_max
  description: The maximum number of unique domains visited in any single browsing session during a reporting period. This reflects the breadth of
    a user's browsing across distinct web destinations.
- name: scalar_parent_browser_engagement_unique_domains_count_mean
  description: The mean number of unique domains visited per session during a reporting period. This represents the average breadth of a user's browsing
    activity across distinct web destinations.
- name: scalar_parent_browser_engagement_window_open_event_count_sum
  description: The aggregated sum of browser window open events fired during a reporting period. A higher value indicates more frequent multi-window
    browsing behavior by the user.
- name: scalar_parent_browser_ui_interaction_content_context_sum
  description: A keyed scalar recording the aggregated sum of user interactions with content context menu items in the browser UI. Each key identifies
    a specific context menu action and its associated interaction count.
- name: scalar_parent_browser_ui_interaction_preferences_pane_home_sum
  description: A keyed scalar recording the aggregated sum of user interactions within the Home preferences pane in the browser UI. Each key identifies
    a specific UI element or action and its associated interaction count.
- name: scalar_parent_browser_ui_interaction_textrecognition_error_sum
  description: The aggregated sum of errors encountered during text recognition operations in the browser. A null or zero value indicates no text recognition
    errors were recorded during the reporting period.
- name: scalar_parent_devtools_accessibility_node_inspected_count_sum
  description: The aggregated sum of the number of accessibility nodes inspected via the DevTools Accessibility panel. A null or zero value indicates
    the feature was not used during the reporting period.
- name: scalar_parent_devtools_accessibility_opened_count_sum
  description: The aggregated sum of the number of times the DevTools Accessibility panel was opened during a reporting period. Higher values indicate
    more frequent use of the accessibility inspection tool.
- name: scalar_parent_devtools_accessibility_picker_used_count_sum
  description: The aggregated sum of the number of times the accessibility picker tool was used within the DevTools Accessibility panel. A null or
    zero value indicates the picker was not used during the reporting period.
- name: scalar_parent_devtools_accessibility_select_accessible_for_node_sum
  description: A keyed scalar recording the aggregated sum of times an accessible object was selected for a specific DOM node in the DevTools Accessibility
    panel. Each key identifies the context or trigger for the selection.
- name: scalar_parent_devtools_accessibility_service_enabled_count_sum
  description: The aggregated sum of the number of times the accessibility service was enabled via DevTools during a reporting period. A null or zero
    value indicates the accessibility service was not enabled through DevTools.
- name: scalar_parent_devtools_copy_full_css_selector_opened_sum
  description: The aggregated sum of the number of times the 'Copy Full CSS Selector' feature was used in DevTools during a reporting period. A null
    or zero value indicates the feature was not used.
- name: scalar_parent_devtools_copy_unique_css_selector_opened_sum
  description: The aggregated sum of the number of times the 'Copy Unique CSS Selector' feature was used in DevTools during a reporting period. A null
    or zero value indicates the feature was not used.
- name: scalar_parent_devtools_toolbar_eyedropper_opened_sum
  description: The aggregated sum of the number of times the eyedropper color-picker tool in the DevTools toolbar was opened during a reporting period.
    A null or zero value indicates the tool was not used.
- name: scalar_parent_dom_contentprocess_troubled_due_to_memory_sum
  description: The aggregated sum of the number of content processes that entered a troubled state due to memory pressure during a reporting period.
    A null or zero value indicates no such events were recorded.
- name: scalar_parent_library_link_sum
  description: A keyed scalar recording the aggregated sum of link-related interactions within the browser's Library panel. Each key identifies a specific
    link type or destination and its associated click count.
- name: scalar_parent_library_opened_sum
  description: A keyed scalar recording the aggregated sum of the number of times the browser's Library panel was opened, broken down by entry point
    or panel section. Each key identifies the specific trigger or section accessed.
- name: scalar_parent_library_search_sum
  description: A keyed scalar recording the aggregated sum of search interactions performed within the browser's Library panel. Each key identifies
    a specific search context or section within the Library.
- name: scalar_parent_navigator_storage_estimate_count_sum
  description: The aggregated sum of the number of times the Navigator Storage Estimate API was called during a reporting period. A null or zero value
    indicates the API was not invoked.
- name: scalar_parent_navigator_storage_persist_count_sum
  description: The aggregated sum of the number of times the Navigator Storage Persist API was called during a reporting period. A null or zero value
    indicates the API was not invoked.
- name: scalar_parent_os_environment_is_taskbar_pinned
  description: Indicates whether the Firefox browser is pinned to the operating system taskbar. True means Firefox is pinned to the taskbar; false
    means it is not.
- name: scalar_parent_os_environment_launched_via_desktop
  description: Indicates whether the Firefox browser session was launched via a desktop shortcut. True means the browser was started from a desktop
    icon; false means it was not.
- name: scalar_parent_os_environment_launched_via_other
  description: Indicates whether the Firefox browser session was launched via an unclassified or miscellaneous launch method. True means the browser
    was started through some other means not captured by more specific launch scalars; false means it was not.
- name: scalar_parent_os_environment_launched_via_other_shortcut
  description: Indicates whether the Firefox browser session was launched via a shortcut other than a desktop or taskbar shortcut. True means the browser
    was started from a non-standard shortcut location; false means it was not.
- name: scalar_parent_os_environment_launched_via_start_menu
  description: Indicates whether the Firefox browser session was launched from the operating system Start Menu. True means the browser was started
    via the Start Menu; false means it was not.
- name: scalar_parent_os_environment_launched_via_taskbar
  description: Indicates whether the Firefox browser session was launched by clicking the taskbar icon. True means the browser was started from the
    taskbar; false means it was not.
- name: scalar_parent_os_environment_launched_via_taskbar_private
  description: Indicates whether a Firefox Private Browsing window was launched directly from the taskbar (e.g., via a taskbar jump list option). True
    means a private session was initiated from the taskbar; false means it was not.
- name: scalar_parent_sidebar_link_sum
  description: A keyed scalar recording the aggregated sum of link-related interactions within the browser's Sidebar panel. Each key identifies a specific
    link type or destination and its associated click count.
- name: scalar_parent_sidebar_opened_sum
  description: A keyed scalar recording the aggregated sum of the number of times the browser's Sidebar panel was opened, broken down by panel or entry
    point. Each key identifies the specific sidebar panel or trigger accessed.
- name: scalar_parent_sidebar_search_sum
  description: A keyed scalar recording the aggregated sum of search interactions performed within the browser's Sidebar panel. Each key identifies
    a specific search context or section within the Sidebar.
- name: scalar_parent_storage_sync_api_usage_extensions_using_sum
  description: The aggregated sum of the number of extensions actively using the Storage Sync API during a reporting period. A null or zero value indicates
    no extensions used this API.
- name: scalar_parent_telemetry_event_counts_sum
  description: A keyed scalar recording the aggregated sum of telemetry event counts, broken down by event category and method. Each key identifies
    a specific telemetry event and its associated total occurrence count.
- name: scalar_parent_urlbar_impression_autofill_about_sum
  description: The aggregated sum of the number of times an 'about:' page URL was shown as an autofill suggestion in the URL bar during a reporting
    period. Reflects user exposure to autofill results for internal browser pages.
- name: scalar_parent_urlbar_impression_autofill_adaptive_sum
  description: The aggregated sum of the number of times an adaptive history-based autofill suggestion was shown in the URL bar during a reporting
    period. A null or zero value indicates no adaptive autofill impressions were recorded.
- name: scalar_parent_urlbar_impression_autofill_origin_sum
  description: The aggregated sum of the number of times an origin-based (domain) autofill suggestion was shown in the URL bar during a reporting period.
    Reflects how frequently the browser autofills based on previously visited site origins.
- name: scalar_parent_urlbar_impression_autofill_other_sum
  description: The aggregated sum of the number of times an autofill suggestion of an unclassified or miscellaneous type was shown in the URL bar during
    a reporting period. A null or zero value indicates no such impressions were recorded.
- name: scalar_parent_urlbar_impression_autofill_preloaded_sum
  description: The aggregated sum of the number of times a preloaded (built-in) site autofill suggestion was shown in the URL bar during a reporting
    period. A null or zero value indicates no preloaded autofill impressions were recorded.
- name: scalar_parent_urlbar_impression_autofill_url_sum
  description: The aggregated sum of the number of times a full URL autofill suggestion was shown in the URL bar during a reporting period. Reflects
    how frequently the browser autofills complete URLs based on browsing history.
- name: scalar_parent_urlbar_picked_autofill_about_sum
  description: A keyed scalar recording the aggregated sum of times a user selected an 'about:' page autofill suggestion from the URL bar. Each key
    identifies the specific autofill result position or type that was chosen.
- name: scalar_parent_urlbar_picked_autofill_adaptive_sum
  description: A keyed scalar recording the aggregated sum of times a user selected an adaptive history-based autofill suggestion from the URL bar.
    Each key identifies the specific autofill result position or type that was chosen.
- name: scalar_parent_urlbar_picked_autofill_origin_sum
  description: A keyed scalar recording the aggregated sum of times a user selected an origin-based autofill suggestion from the URL bar. Each key
    identifies the specific result position or origin type that was chosen.
- name: scalar_parent_urlbar_picked_autofill_other_sum
  description: A keyed scalar recording the aggregated sum of times a user selected a miscellaneous or unclassified autofill suggestion from the URL
    bar. Each key identifies the specific result position or type that was chosen.
- name: scalar_parent_urlbar_picked_autofill_preloaded_sum
  description: A keyed scalar recording the aggregated sum of times a user selected a preloaded (built-in) site autofill suggestion from the URL bar.
    Each key identifies the specific result position or site that was chosen.
- name: scalar_parent_urlbar_picked_autofill_sum
  description: A keyed scalar recording the aggregated sum of times a user selected any autofill suggestion from the URL bar, across all autofill types.
    Each key identifies the specific result position or autofill category that was chosen.
- name: scalar_parent_urlbar_picked_autofill_url_sum
  description: A keyed scalar recording the aggregated sum of times a user selected a full URL autofill suggestion from the URL bar. Each key identifies
    the specific result position or URL type that was chosen.
- name: scalar_parent_urlbar_picked_bookmark_sum
  description: A keyed scalar recording the aggregated sum of times a user selected a bookmarked URL suggestion from the URL bar. Each key identifies
    the specific result position or bookmark type that was chosen.
- name: scalar_parent_urlbar_picked_dynamic_sum
  description: Keyed scalar aggregating the number of times a user selected a dynamic result type from the URL bar dropdown. Each key identifies a
    search engine or context, and the value is the summed count of picks across the aggregation period.
- name: scalar_parent_urlbar_picked_extension_sum
  description: Keyed scalar aggregating the number of times a user selected an extension-provided result from the URL bar dropdown. Each key identifies
    a search engine or context, and the value is the summed count of picks across the aggregation period.
- name: scalar_parent_urlbar_picked_formhistory_sum
  description: Keyed scalar aggregating the number of times a user selected a form history result from the URL bar dropdown. Each key identifies a
    search engine or context, and the value is the summed count of picks across the aggregation period.
- name: scalar_parent_urlbar_picked_history_sum
  description: Keyed scalar aggregating the number of times a user selected a browsing history result from the URL bar dropdown. Each key identifies
    a search engine or context, and the value is the summed count of picks across the aggregation period.
- name: scalar_parent_urlbar_picked_keyword_sum
  description: Keyed scalar aggregating the number of times a user selected a keyword bookmark result from the URL bar dropdown. Each key identifies
    a search engine or context, and the value is the summed count of picks across the aggregation period.
- name: scalar_parent_urlbar_picked_remotetab_sum
  description: Keyed scalar aggregating the number of times a user selected a remote tab (synced from another device) result from the URL bar dropdown.
    Each key identifies a search engine or context, and the value is the summed count of picks across the aggregation period.
- name: scalar_parent_urlbar_picked_searchengine_sum
  description: Keyed scalar aggregating the number of times a user selected a search engine suggestion result from the URL bar dropdown. Each key identifies
    a search engine or context, and the value is the summed count of picks across the aggregation period.
- name: scalar_parent_urlbar_picked_searchsuggestion_sum
  description: Keyed scalar aggregating the number of times a user selected a search suggestion (e.g. from a remote suggestions provider) from the
    URL bar dropdown. Each key identifies a search engine or context, and the value is the summed count of picks across the aggregation period.
- name: scalar_parent_urlbar_picked_switchtab_sum
  description: Keyed scalar aggregating the number of times a user selected a switch-to-tab result from the URL bar dropdown. Each key identifies a
    search engine or context, and the value is the summed count of picks across the aggregation period.
- name: scalar_parent_urlbar_picked_tabtosearch_sum
  description: Keyed scalar aggregating the number of times a user selected a tab-to-search result from the URL bar dropdown, which initiates a search
    directly within a specific engine. Each key identifies a search engine or context, and the value is the summed count of picks across the aggregation
    period.
- name: scalar_parent_urlbar_picked_tip_sum
  description: Keyed scalar aggregating the number of times a user selected a tip result (an informational or action card) from the URL bar dropdown.
    Each key identifies a search engine or context, and the value is the summed count of picks across the aggregation period.
- name: scalar_parent_urlbar_picked_topsite_sum
  description: Keyed scalar aggregating the number of times a user selected a top site result from the URL bar dropdown. Each key identifies a search
    engine or context, and the value is the summed count of picks across the aggregation period.
- name: scalar_parent_urlbar_picked_unknown_sum
  description: Keyed scalar aggregating the number of times a user selected a result of an unrecognized or uncategorized type from the URL bar dropdown.
    Each key identifies a search engine or context, and the value is the summed count of picks across the aggregation period.
- name: scalar_parent_urlbar_picked_visiturl_sum
  description: Keyed scalar aggregating the number of times a user selected the 'visit URL' result (directly navigating to a typed URL) from the URL
    bar dropdown. Each key identifies a search engine or context, and the value is the summed count of picks across the aggregation period.
- name: scalar_parent_urlbar_searchmode_bookmarkmenu_sum
  description: Keyed scalar aggregating the number of times URL bar search mode was entered via the bookmark menu entry point. Each key identifies
    a search engine or context, and the value is the summed activation count across the aggregation period.
- name: scalar_parent_urlbar_searchmode_handoff_sum
  description: Keyed scalar aggregating the number of times URL bar search mode was entered via the new tab page handoff entry point. Each key identifies
    a search engine or context, and the value is the summed activation count across the aggregation period.
- name: scalar_parent_urlbar_searchmode_keywordoffer_sum
  description: Keyed scalar aggregating the number of times URL bar search mode was entered via the keyword offer entry point, where Firefox suggests
    activating a specific search engine. Each key identifies a search engine or context, and the value is the summed activation count across the aggregation
    period.
- name: scalar_parent_urlbar_searchmode_oneoff_sum
  description: Keyed scalar aggregating the number of times URL bar search mode was entered by clicking a one-off search engine button in the URL bar
    panel. Each key identifies a search engine or context, and the value is the summed activation count across the aggregation period.
- name: scalar_parent_urlbar_searchmode_other_sum
  description: Keyed scalar aggregating the number of times URL bar search mode was entered via an entry point not covered by other specific categories.
    Each key identifies a search engine or context, and the value is the summed activation count across the aggregation period.
- name: scalar_parent_urlbar_searchmode_shortcut_sum
  description: Keyed scalar aggregating the number of times URL bar search mode was entered via a keyboard shortcut. Each key identifies a search engine
    or context, and the value is the summed activation count across the aggregation period.
- name: scalar_parent_urlbar_searchmode_tabmenu_sum
  description: Keyed scalar aggregating the number of times URL bar search mode was entered via the tab menu entry point. Each key identifies a search
    engine or context, and the value is the summed activation count across the aggregation period.
- name: scalar_parent_urlbar_searchmode_tabtosearch_onboard_sum
  description: Keyed scalar aggregating the number of times URL bar search mode was entered via the tab-to-search onboarding flow, where users are
    introduced to the feature for the first time. Each key identifies a search engine or context, and the value is the summed activation count across
    the aggregation period.
- name: scalar_parent_urlbar_searchmode_tabtosearch_sum
  description: Keyed scalar aggregating the number of times URL bar search mode was entered via the tab-to-search feature. Each key identifies a search
    engine or context, and the value is the summed activation count across the aggregation period.
- name: scalar_parent_urlbar_searchmode_topsites_newtab_sum
  description: Keyed scalar aggregating the number of times URL bar search mode was entered by interacting with a top site on the new tab page. Each
    key identifies a search engine or context, and the value is the summed activation count across the aggregation period.
- name: scalar_parent_urlbar_searchmode_topsites_urlbar_sum
  description: Keyed scalar aggregating the number of times URL bar search mode was entered by interacting with a top site result directly within the
    URL bar. Each key identifies a search engine or context, and the value is the summed activation count across the aggregation period.
- name: scalar_parent_urlbar_searchmode_touchbar_sum
  description: Keyed scalar aggregating the number of times URL bar search mode was entered via the macOS Touch Bar. Each key identifies a search engine
    or context, and the value is the summed activation count across the aggregation period.
- name: scalar_parent_urlbar_searchmode_typed_sum
  description: Keyed scalar aggregating the number of times URL bar search mode was entered by the user manually typing a search mode keyword or engine
    alias. Each key identifies a search engine or context, and the value is the summed activation count across the aggregation period.
- name: scheduled_corpus_item_id
  description: A unique identifier (UUID) for a scheduled corpus item, representing a specific piece of content that has been queued for recommendation
    or delivery to users. This ID links engagement events back to the particular content item scheduled in the corpus.
- name: search_access_point
  description: The UI surface or mechanism through which a search was initiated, such as the URL bar, search bar, context menu, tab history, or a handoff
    from the new tab page. This field helps attribute search activity to the specific entry point used by the user.
- name: search_adclicks_about_home_sum
  description: Keyed scalar aggregating the number of times a user clicked on a search advertisement that originated from a search performed on the
    Firefox Home (about:home) page. Each key identifies the search engine, and the value is the summed ad click count across the aggregation period.
- name: search_adclicks_about_newtab_sum
  description: Keyed scalar aggregating the number of times a user clicked on a search advertisement that originated from a search performed on the
    new tab page (about:newtab). Each key identifies the search engine, and the value is the summed ad click count across the aggregation period.
- name: search_adclicks_contextmenu_sum
  description: Keyed scalar aggregating the number of times a user clicked on a search advertisement that originated from a search initiated via the
    browser context menu. Each key identifies the search engine, and the value is the summed ad click count across the aggregation period.
- name: search_adclicks_reload_sum
  description: Keyed scalar aggregating the number of times a user clicked on a search advertisement on a search results page that was reached via
    a page reload. Each key identifies the search engine, and the value is the summed ad click count across the aggregation period.
- name: search_adclicks_searchbar_sum
  description: Keyed scalar aggregating the number of times a user clicked on a search advertisement that originated from a search performed using
    the browser's dedicated search bar. Each key identifies the search engine, and the value is the summed ad click count across the aggregation period.
- name: search_adclicks_system_sum
  description: Keyed scalar aggregating the number of times a user clicked on a search advertisement that originated from a system-level search (e.g.
    initiated by the OS or an external application). Each key identifies the search engine, and the value is the summed ad click count across the aggregation
    period.
- name: search_adclicks_tabhistory_sum
  description: Keyed scalar aggregating the number of times a user clicked on a search advertisement on a search results page reached via tab history
    navigation (back/forward). Each key identifies the search engine, and the value is the summed ad click count across the aggregation period.
- name: search_adclicks_unknown_sum
  description: Keyed scalar aggregating the number of times a user clicked on a search advertisement where the originating search access point could
    not be determined. Each key identifies the search engine, and the value is the summed ad click count across the aggregation period.
- name: search_adclicks_urlbar_handoff_sum
  description: Keyed scalar aggregating the number of times a user clicked on a search advertisement originating from a search handed off from the
    new tab page to the URL bar. Each key identifies the search engine, and the value is the summed ad click count across the aggregation period.
- name: search_adclicks_urlbar_persisted_sum
  description: Keyed scalar aggregating the number of times a user clicked on a search advertisement originating from a persisted URL bar search (where
    the search terms remain visible in the URL bar). Each key identifies the search engine, and the value is the summed ad click count across the aggregation
    period.
- name: search_adclicks_urlbar_searchmode_sum
  description: Keyed scalar aggregating the number of times a user clicked on a search advertisement originating from a search performed while the
    URL bar was in search mode. Each key identifies the search engine, and the value is the summed ad click count across the aggregation period.
- name: search_adclicks_urlbar_sum
  description: Keyed scalar aggregating the number of times a user clicked on a search advertisement that originated from a search performed via the
    URL bar. Each key identifies the search engine, and the value is the summed ad click count across the aggregation period.
- name: search_adclicks_webextension_sum
  description: Keyed scalar aggregating the number of times a user clicked on a search advertisement that originated from a search initiated by a web
    extension. Each key identifies the search engine, and the value is the summed ad click count across the aggregation period.
- name: search_cohort
  description: A label identifying the search experimentation cohort a user was assigned to, used to group users for analysis of specific search-related
    experiments or studies. A null value indicates the user was not part of any tracked search cohort.
- name: search_content_about_home_sum
  description: Keyed scalar aggregating the number of searches performed from the Firefox Home (about:home) page. Each key identifies the search engine
    used, and the value is the summed search count across the aggregation period.
- name: search_content_about_newtab_sum
  description: Keyed scalar aggregating the number of searches performed from the new tab page (about:newtab). Each key identifies the search engine
    used, and the value is the summed search count across the aggregation period.
- name: search_content_contextmenu_sum
  description: Keyed scalar aggregating the number of searches initiated via the browser's context menu. Each key identifies the search engine used,
    and the value is the summed search count across the aggregation period.
- name: search_content_reload_sum
  description: Keyed scalar aggregating the number of search results pages reached via a page reload. Each key identifies the search engine, and the
    value is the summed reload count across the aggregation period.
- name: search_content_searchbar_sum
  description: Keyed scalar aggregating the number of searches performed using the browser's dedicated search bar. Each key identifies the search engine
    used, and the value is the summed search count across the aggregation period.
- name: search_content_system_sum
  description: Keyed scalar aggregating the number of searches initiated at the system level, such as those triggered by the operating system or an
    external application. Each key identifies the search engine used, and the value is the summed search count across the aggregation period.
- name: search_content_tabhistory_sum
  description: Keyed scalar aggregating the number of times a search results page was reached via tab history navigation (back/forward). Each key identifies
    the search engine, and the value is the summed count across the aggregation period.
- name: search_content_unknown_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches initiated from an unknown content source.
    Each entry aggregates search counts for a given engine over the reporting period.
- name: search_content_urlbar_handoff_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches initiated via a urlbar handoff content
    source. Each entry aggregates search counts for a given engine over the reporting period.
- name: search_content_urlbar_persisted_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches initiated from the urlbar with a persisted
    search mode. Each entry aggregates search counts for a given engine over the reporting period.
- name: search_content_urlbar_searchmode_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches initiated from the urlbar while in search
    mode. Each entry aggregates search counts for a given engine over the reporting period.
- name: search_content_urlbar_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches initiated from the urlbar. Each entry
    aggregates search counts for a given engine over the reporting period.
- name: search_content_webextension_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of searches initiated via a web extension content
    source. Each entry aggregates search counts for a given engine over the reporting period.
- name: search_count
  description: The total number of searches performed during the period. A null value indicates the metric was not recorded for that record.
- name: search_count_abouthome
  description: The total number of searches initiated from the Firefox about:home page during the period. A value of zero indicates no searches were
    made from this entry point.
- name: search_count_alias
  description: The total number of searches triggered via a search engine alias (e.g., typing an engine's keyword shortcut in the urlbar) during the
    period. A value of zero indicates no alias-based searches were performed.
- name: search_count_all
  description: The total number of searches performed across all entry points and sources during the period. A value of zero indicates no searches
    were recorded.
- name: search_count_contextmenu
  description: The total number of searches initiated via the browser context menu (right-click search) during the period. A value of zero indicates
    no context menu searches were performed.
- name: search_count_newtab
  description: The total number of searches initiated from the Firefox new tab page during the period. A value of zero indicates no searches were made
    from this entry point.
- name: search_count_organic
  description: The total number of organic (non-SAP, non-tagged) searches performed during the period. A value of zero indicates no organic searches
    were recorded.
- name: search_count_searchbar
  description: The total number of searches initiated from the dedicated search bar during the period. A value of zero indicates no searches were made
    from the search bar.
- name: search_count_system
  description: The total number of searches initiated by system-level actions (e.g., OS search integration) during the period. A value of zero indicates
    no system-initiated searches were recorded.
- name: search_count_tagged_follow_on
  description: The total number of tagged follow-on searches — subsequent searches that carry a partner tag originating from a prior tagged search
    — performed during the period. A value of zero indicates no tagged follow-on searches were recorded.
- name: search_count_tagged_sap
  description: The total number of tagged Search Access Point (SAP) searches, where the query was initiated from a Mozilla-partnered access point and
    carries a partner attribution tag. A value of zero indicates no tagged SAP searches were recorded.
- name: search_count_urlbar
  description: The total number of searches initiated from the browser urlbar (address bar) during the period. A value of zero indicates no urlbar
    searches were performed.
- name: search_count_urlbar_handoff
  description: The total number of searches initiated via the urlbar handoff mechanism — where a search begins in a new tab search box and is handed
    off to the urlbar — during the period. A value of zero indicates no handoff searches were recorded.
- name: search_count_urlbar_persisted
  description: The total number of searches initiated from the urlbar while in a persisted search mode during the period. A value of zero indicates
    no persisted urlbar searches were recorded.
- name: search_count_urlbar_searchmode
  description: The total number of searches initiated from the urlbar while explicitly in search mode (i.e., the user has activated a specific engine
    in the urlbar) during the period. A value of zero indicates no search mode urlbar searches were recorded.
- name: search_count_webextension
  description: The total number of searches initiated by a web extension during the period. A value of zero indicates no web extension-initiated searches
    were recorded.
- name: search_counts
  description: An array of structs capturing per-engine, per-source search counts, where each entry contains the search engine name, the search access
    point source, and the number of searches performed for that combination.
- name: search_engine
  description: The identifier of the default or most-used search engine (e.g., 'google', 'google-b-d', 'duckduckgo'). A null value indicates the search
    engine was not recorded or not applicable for the record.
- name: search_with_ads
  description: The total number of search result pages that contained advertisements during the period. A null value indicates the metric was not recorded
    for that record.
- name: search_with_ads_count_all
  description: The total count of search result pages that included ads, aggregated across all search sources and engines for the period. A null value
    indicates the metric was not recorded for that record.
- name: search_withads_about_home_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of ad-containing search result pages reached from
    the about:home entry point. Each entry aggregates counts for a given engine over the reporting period.
- name: search_withads_about_newtab_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of ad-containing search result pages reached from
    the new tab page entry point. Each entry aggregates counts for a given engine over the reporting period.
- name: search_withads_contextmenu_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of ad-containing search result pages reached via a
    context menu search. Each entry aggregates counts for a given engine over the reporting period.
- name: search_withads_reload_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of ad-containing search result pages reached via a
    page reload action. Each entry aggregates counts for a given engine over the reporting period.
- name: search_withads_searchbar_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of ad-containing search result pages reached from
    the dedicated search bar. Each entry aggregates counts for a given engine over the reporting period.
- name: search_withads_system_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of ad-containing search result pages reached via system-initiated
    searches. Each entry aggregates counts for a given engine over the reporting period.
- name: search_withads_tabhistory_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of ad-containing search result pages reached via tab
    history navigation. Each entry aggregates counts for a given engine over the reporting period.
- name: search_withads_unknown_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of ad-containing search result pages reached from
    an unknown source. Each entry aggregates counts for a given engine over the reporting period.
- name: search_withads_urlbar_handoff_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of ad-containing search result pages reached via the
    urlbar handoff mechanism. Each entry aggregates counts for a given engine over the reporting period.
- name: search_withads_urlbar_persisted_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of ad-containing search result pages reached from
    the urlbar in persisted search mode. Each entry aggregates counts for a given engine over the reporting period.
- name: search_withads_urlbar_searchmode_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of ad-containing search result pages reached from
    the urlbar while in search mode. Each entry aggregates counts for a given engine over the reporting period.
- name: search_withads_urlbar_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of ad-containing search result pages reached from
    the urlbar. Each entry aggregates counts for a given engine over the reporting period.
- name: search_withads_webextension_sum
  description: An array of key-value pairs mapping search engine identifiers to the total number of ad-containing search result pages reached via a
    web extension. Each entry aggregates counts for a given engine over the reporting period.
- name: searches
  description: The total number of searches performed during the reporting period. A value of zero indicates no searches were conducted.
- name: searches_per_user_ratio
  description: The average number of searches performed per user over the reporting period, calculated as total searches divided by the number of active
    users. A value of zero indicates no searches were recorded on average.
- name: second_seen_date
  description: The calendar date on which the client was observed for the second time. A null value indicates the client has not yet been seen a second
    time.
- name: segment
  description: A categorical label classifying users by their engagement level based on usage frequency, such as 'core_user', 'regular_user', 'casual_user',
    'infrequent_user', or 'other'.
- name: session_id
  description: A unique identifier (UUID) for a browser session. Each session_id corresponds to a single continuous browsing session for a client.
- name: session_restored_mean
  description: The mean time in milliseconds for a browser session to be restored after startup. A null value indicates session restoration time was
    not recorded for that record.
- name: session_start_time
  description: The UTC timestamp at which the browser session began. This marks the precise start of user activity within a given session.
- name: sessions
  description: The total number of browser sessions recorded for the reporting period. Each session represents a distinct period of browser activity.
- name: sessions_per_user
  description: The average number of browser sessions per user over the reporting period, calculated as total sessions divided by the number of active
    users.
- name: sessions_started_on_this_day
  description: The number of new browser sessions that were started on the given day. A value of zero indicates no new sessions were initiated on that
    day.
- name: show_tracker_stats_share
  description: A boolean flag indicating whether the user has enabled sharing of tracker statistics. A value of true indicates sharing is enabled;
    false indicates it is disabled. This field is almost always null, indicating the setting was not recorded.
- name: shutdown_kill_sum
  description: The total number of times a browser process was forcibly killed during shutdown rather than exiting cleanly. A null value indicates
    no forced shutdowns were recorded in the period.
- name: signature
  description: A string identifying the most representative stack frame or error type associated with a crash or hang, used to group similar incidents
    together. Values may indicate OOM conditions, specific library frames, or that no frame data was available.
- name: silent
  description: Indicates whether an update or notification was delivered silently without user interaction. True means the action was silent; false
    means the user was prompted or notified.
- name: smoothed_dau
  description: The 7-day rolling average of Daily Active Users (DAU) for a given segment or product. This smoothed metric reduces day-to-day noise
    in activity counts.
- name: source
  description: The referring domain or origin from which a user navigated to a Mozilla property, such as addons.mozilla.org or support.mozilla.org.
    A null value indicates the source was not captured or was unavailable.
- name: sponsored_pocket_clicks
  description: The total number of clicks on sponsored Pocket content tiles shown to the user. A value of zero indicates the user had no clicks on
    sponsored Pocket items during the period.
- name: sponsored_pocket_dismissals
  description: The total number of times the user dismissed sponsored Pocket content tiles. A value of zero indicates no sponsored Pocket tiles were
    dismissed during the period.
- name: sponsored_pocket_impressions
  description: The total number of times sponsored Pocket content tiles were displayed to the user. A value of zero indicates no sponsored Pocket tiles
    were shown during the period.
- name: sponsored_pocket_saves
  description: The total number of times the user saved sponsored Pocket content items. A value of zero indicates no sponsored Pocket items were saved
    during the period.
- name: sponsored_topsite_clicks
  description: The total number of clicks on sponsored top site tiles shown on the new tab page. A value of zero indicates no sponsored top site tiles
    were clicked during the period.
- name: sponsored_topsite_dismissals
  description: The total number of times the user dismissed sponsored top site tiles from the new tab page. A value of zero indicates no sponsored
    top site tiles were dismissed during the period.
- name: sponsored_topsite_impressions
  description: The total number of times sponsored top site tiles were displayed on the new tab page. A value of zero indicates no sponsored top site
    tiles were shown during the period.
- name: sponsored_topsite_tile_clicks
  description: The total number of clicks on individual sponsored top site tile positions on the new tab page. This is a more granular tile-level complement
    to sponsored_topsite_clicks.
- name: sponsored_topsite_tile_dismissals
  description: The total number of times a user dismissed individual sponsored top site tile positions on the new tab page. A value of zero indicates
    no such tile dismissals occurred during the period.
- name: sponsored_topsite_tile_impressions
  description: The total number of times individual sponsored top site tile positions were rendered on the new tab page. This captures tile-level impression
    counts rather than session-level totals.
- name: ssl_handshake_result_failure_sum
  description: The total number of failed SSL/TLS handshake attempts recorded during the period. A value of zero indicates all handshake attempts succeeded
    or none were attempted.
- name: ssl_handshake_result_success_sum
  description: The total number of successful SSL/TLS handshake completions recorded during the period. A null value indicates no successful handshake
    data was available for the record.
- name: startup_profile_selection_first_ping_only
  description: The method by which the Firefox profile was selected at startup, captured only from the first ping of a session. Common values include
    'default', 'restart', 'profile-selector', and 'argument-profile', indicating how the active profile was determined.
- name: startup_profile_selection_reason
  description: The reason or mechanism by which the Firefox profile was selected at startup for the current session. Values such as 'firstrun-created-default',
    'default', 'restart', and 'argument-profile' describe how the active profile was determined.
- name: startup_profile_selection_reason_first
  description: The profile selection reason recorded from the first observed startup event for a client. This field captures the initial method used
    to choose the active profile, with values such as 'default', 'profile-selector', and 'firstrun-created-default'.
- name: subchannel
  description: The marketing or advertising subchannel through which a user acquisition or campaign interaction was attributed. Values include categories
    such as 'Brand', 'Non-Brand', 'Competitor', 'PMax', and 'Other', with 'All' representing aggregated totals.
- name: subdivision1
  description: The first-level administrative subdivision (e.g., state, province, or region) of the user's inferred geographic location. This is typically
    derived from IP geolocation and may be null when the subdivision cannot be determined.
- name: submission_date
  description: The calendar date on which a ping or record was received by Mozilla's ingestion pipeline. This field is commonly used as a partition
    key for time-based queries.
- name: submission_timestamp
  description: The exact UTC timestamp at which a ping or record was received by Mozilla's ingestion pipeline. This provides sub-second precision for
    ordering and deduplicating submissions.
- name: submission_timestamp_min
  description: The earliest UTC timestamp at which a ping or event was received within an aggregated group or window. This is used to anchor the time
    of the first observed submission for a given set of records.
- name: submission_year
  description: The calendar year in which a ping or record was submitted to Mozilla's ingestion pipeline, extracted from the submission timestamp.
    This field is useful for coarse time partitioning and year-level filtering.
- name: subsession_hours_per_user_ratio
  description: The ratio of total subsession hours to the number of users in an aggregated group, representing average browser usage time per user.
    This metric normalizes engagement intensity across cohorts of different sizes.
- name: subsession_hours_sum
  description: The total number of hours spent in active Firefox subsessions, summed across all sessions in the aggregation period. Values close to
    24 hours typically represent a full day's usage for a single client.
- name: subsession_id
  description: A unique UUID identifying a single Firefox subsession, which is the period of browser activity between a start event and a pause or
    shutdown. Each new subsession receives a new identifier.
- name: subsession_length
  description: The duration of a Firefox subsession in seconds, measured from the subsession start to its end. This represents the length of a single
    continuous period of browser activity.
- name: subsession_start_date
  description: The local date and time at which a Firefox subsession began, encoded as an ISO 8601 string including the client's UTC offset. This reflects
    the user's local clock at the time the subsession started.
- name: succeeded
  description: Indicates whether an operation, update, or process completed successfully. True means the operation succeeded; false means it encountered
    a failure.
- name: success
  description: A count or numeric indicator of successful outcomes for a given operation or event during the aggregation period. A null value indicates
    the success count was not recorded or not applicable.
- name: sync_configured
  description: Indicates whether Firefox Sync was configured and enabled on the client. True means Sync was active; false means it was available but
    not configured; null indicates the configuration state was not reported.
- name: sync_count_desktop
  description: The number of desktop devices connected to the user's Firefox Sync account. This reflects the count of non-mobile devices linked to
    the account at the time of measurement.
- name: sync_count_desktop_mean
  description: The average number of desktop devices connected to the Firefox Sync account, computed across the aggregation period. A null value indicates
    Sync was not configured or data was unavailable.
- name: sync_count_desktop_sum
  description: The total number of desktop device-sync events or connected desktop devices recorded across the aggregation period. A null value indicates
    Sync was not configured or data was unavailable.
- name: sync_count_mobile
  description: The number of mobile devices connected to the user's Firefox Sync account. This reflects the count of mobile devices linked to the account
    at the time of measurement.
- name: sync_count_mobile_mean
  description: The average number of mobile devices connected to the Firefox Sync account, computed across the aggregation period. A null value indicates
    Sync was not configured or data was unavailable.
- name: sync_count_mobile_sum
  description: The total number of mobile device-sync events or connected mobile devices recorded across the aggregation period. A null value indicates
    Sync was not configured or data was unavailable.
- name: system_is_wow64
  description: Indicates whether the Firefox process was running as a 32-bit application under the WOW64 compatibility layer on a 64-bit Windows operating
    system. True means WOW64 was active; false means the process was running natively.
- name: system_memory_mb
  description: The total amount of physical RAM installed on the client's system, measured in megabytes. Common values correspond to standard memory
    configurations such as 8192 MB (8 GB) or 16384 MB (16 GB).
- name: tagged_follow_on_search_ad_clicks
  description: The total number of ad clicks on search result pages that were reached via a follow-on search from a tagged (partner-attributed) initial
    search. A value of zero indicates no such ad clicks occurred during the period.
- name: tagged_follow_on_search_ad_impressions
  description: The total number of ad impressions on search result pages reached via a follow-on search from a tagged initial search. A value of zero
    indicates no follow-on search ads were displayed during the period.
- name: tagged_search_ad_clicks
  description: The total number of ad clicks on search result pages originating from a tagged (partner-attributed) search query. A value of zero indicates
    no tagged search ad clicks occurred during the period.
- name: tagged_search_ad_impressions
  description: The total number of ad impressions on search result pages originating from a tagged (partner-attributed) search query. A value of zero
    indicates no tagged search ads were displayed during the period.
- name: target
  description: The product platform or audience segment that a record, experiment, or metric is associated with. Values such as 'desktop' and 'mobile'
    identify the Firefox product surface, while suffixed variants like 'desktop_QDAU' denote specific engagement metric targets.
- name: telemetry_enabled
  description: Indicates whether the client had Firefox telemetry data collection enabled at the time of the ping. True means telemetry was enabled;
    false means the user had disabled telemetry; null indicates the setting was not reported.
- name: text_recognition_api_performance_count_sum
  description: The total number of text recognition API calls made during the aggregation period. This field is almost always null, reflecting that
    text recognition activity is rare among the general user population.
- name: text_recognition_api_performance_sum
  description: The sum of performance timings (in milliseconds) for text recognition API calls made during the aggregation period. A null value indicates
    no text recognition API activity was recorded for the record.
- name: text_recognition_interaction_timing_count_sum
  description: The total count of timing samples recorded for text recognition interaction events. This is the sum of histogram bucket counts across
    all text recognition interaction timing measurements.
- name: text_recognition_interaction_timing_sum
  description: The sum of elapsed time (in milliseconds) for text recognition interaction events. Reflects the cumulative duration of user interactions
    with the text recognition feature.
- name: text_recognition_text_length_count_sum
  description: The total count of text length samples recorded during text recognition events. This is the sum of histogram bucket counts across all
    text recognition text length measurements.
- name: text_recognition_text_length_sum
  description: The cumulative sum of character lengths of text recognized during text recognition events. Reflects the total volume of text processed
    by the text recognition feature.
- name: tile_id
  description: A numeric identifier for a sponsored or organic top-site tile. Values of -1 indicate tiles without an assigned identifier.
- name: time
  description: The UTC timestamp representing the time associated with the record, typically truncated to a day or other reporting granularity. Used
    for time-series aggregation and reporting.
- name: timestamp
  description: The precise UTC timestamp at which the event or record was ingested or generated. Used to order and identify records at sub-second granularity.
- name: timezone_offset
  description: The client's local timezone offset from UTC, expressed in minutes. Positive values indicate timezones east of UTC and negative values
    indicate timezones west of UTC.
- name: top_addons
  description: An array of the most prevalent add-ons observed within a cohort or segment, each entry containing the add-on name and its relative share
    as a ratio.
- name: top_addons_addon_name
  description: The name of a top add-on within a cohort or segment. This is a nested field extracted from the top_addons array.
- name: top_addons_ratio
  description: The proportional share of a given add-on among the top add-ons for a cohort or segment, expressed as a decimal between 0 and 1. This
    is a nested field extracted from the top_addons array.
- name: top_locales
  description: An array of the most prevalent application locales observed within a cohort or segment, each entry containing the locale code and its
    relative share as a ratio.
- name: top_locales_locale
  description: The locale code (e.g., 'en-US') of a top locale within a cohort or segment. This is a nested field extracted from the top_locales array.
- name: top_locales_ratio
  description: The proportional share of a given locale among the top locales for a cohort or segment, expressed as a decimal between 0 and 1. This
    is a nested field extracted from the top_locales array.
- name: topic_preferences_set
  description: Indicates whether the user has explicitly configured topic preferences for content recommendations. True means preferences have been
    set; false means they have not; null indicates the value was not recorded.
- name: topic_selection_dismissals
  description: The number of times the user dismissed the topic selection UI without saving changes. A value of 0 indicates no dismissals occurred.
- name: topic_selection_opened
  description: The number of times the user opened the topic selection UI. A value of 0 indicates the UI was never opened.
- name: topic_selection_updates
  description: The number of times the user saved updates to their topic selections. A value of 0 indicates no updates were made.
- name: topsite_clicks
  description: The total number of times the user clicked on any top-site entry. Includes both organic and sponsored top-site clicks.
- name: topsite_dismissals
  description: The total number of times the user dismissed a top-site entry. A value of 0 indicates no top sites were dismissed.
- name: topsite_impressions
  description: The total number of times top-site tiles were displayed to the user. Values are typically multiples of the number of tiles shown per
    row.
- name: topsite_tile_clicks
  description: The total number of clicks on individual top-site tiles. This may be scoped to a specific tile type or sponsor compared to the broader
    topsite_clicks metric.
- name: topsite_tile_dismissals
  description: The total number of times the user dismissed an individual top-site tile. A value of 0 indicates no tile dismissals occurred.
- name: topsite_tile_impressions
  description: The total number of impressions recorded for individual top-site tiles. Values are typically multiples of the number of tiles shown
    per row.
- name: topsites_enabled
  description: Indicates whether the top-sites feature is enabled in the user's New Tab Page settings. True means top sites are shown; false means
    they are hidden.
- name: topsites_rows
  description: The number of rows of top-site tiles configured to be displayed on the New Tab Page. Higher values indicate more top-site tiles visible
    at once.
- name: topsites_sponsored_enabled
  description: Indicates whether sponsored top-site tiles are enabled for the user. True means sponsored tiles can be shown; false means they are disabled.
- name: topsites_sponsored_tiles_configured
  description: The number of sponsored top-site tile slots configured for display on the New Tab Page. Typical values are 2, 3, or 4 slots.
- name: total_hours_sum
  description: The total number of hours aggregated across records in a reporting period. This field is currently unpopulated and reserved for future
    use.
- name: total_sample
  description: The total size of the sample or population used for a given aggregation or calculation. A value of 0 indicates no sample was available.
- name: total_users
  description: The total count of distinct users associated with a given aggregation group or dimension. Used to measure population size across segments.
- name: tou_daily_active_users
  description: The number of Terms of Use (ToU) daily active users within a given aggregation period. A value of 0 indicates no active users on that
    day.
- name: tou_monthly_active_users
  description: The number of Terms of Use (ToU) monthly active users within a given aggregation period. A value of 0 indicates no active users in that
    month.
- name: tou_weekly_active_users
  description: The number of Terms of Use (ToU) weekly active users within a given aggregation period. A value of 0 indicates no active users in that
    week.
- name: trackers_blocked_sum
  description: The total number of trackers blocked by the browser's Enhanced Tracking Protection feature over a reporting period. Null values indicate
    the feature was not active or data was not collected.
- name: trend
  description: The modeled trend value for a metric at a given point in time, derived from a time-series forecasting model. Represents the underlying
    directional movement of the metric, excluding seasonal effects.
- name: trend_lower
  description: The lower bound of the confidence interval for the modeled trend value at a given point in time. Used alongside trend_upper to express
    uncertainty in the trend estimate.
- name: trend_upper
  description: The upper bound of the confidence interval for the modeled trend value at a given point in time. Used alongside trend_lower to express
    uncertainty in the trend estimate.
- name: type
  description: The category or type of an add-on or browser component, such as 'extension', 'locale', 'dictionary', or 'service'. Describes the functional
    role of the item.
- name: ua_form_factor
  description: The form factor of the device as derived from the user-agent string, such as 'desktop', 'phone', or 'tablet'. Used to classify client
    device categories.
- name: ua_os_family
  description: The operating system family as derived from the user-agent string, such as 'Windows', 'Mac OS X', or 'Linux'. Used to classify the client
    operating environment.
- name: unenroll_count
  description: The total number of times clients successfully unenrolled from an experiment or feature rollout during a reporting period. A value of
    0 indicates no unenrollments occurred.
- name: unenroll_failed_count
  description: The total number of times an attempt to unenroll a client from an experiment or feature rollout failed during a reporting period. A
    value of 0 indicates no failed unenrollments.
- name: uninstall_same_day_as_install
  description: Indicates whether an add-on or application was uninstalled on the same calendar day it was installed. True means the uninstall occurred
    on the install date; false means it did not.
- name: uninstall_to_install_ratio
  description: The ratio of uninstalls to installs for a given add-on or product over a reporting period. A value of 0.0 indicates no uninstalls relative
    to installs; a value of 1.0 indicates equal counts.
- name: uninstalls_count
  description: The total number of uninstall events recorded for an add-on or product during a reporting period. Counts each uninstall action as one
    unit.
- name: unit
  description: The time unit used to define the reporting or retention period, such as 'day' or 'month'. Determines the granularity of the associated
    metric.
- name: update_auto_download
  description: Indicates whether the browser is configured to automatically download updates. True means automatic download is enabled; false means
    it is disabled.
- name: update_background
  description: Indicates whether browser updates are applied in the background without requiring user interaction. True means background updates are
    enabled; false means they require user action.
- name: update_channel
  description: The Firefox update channel the client is subscribed to, such as 'release', 'beta', 'nightly', or 'esr'. Determines which build and update
    stream the client receives.
