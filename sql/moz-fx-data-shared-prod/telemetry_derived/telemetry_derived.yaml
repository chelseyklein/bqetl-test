  description: Count of times the 'Copy Full CSS Selector' action was used in the DevTools Inspector during the session.
- name: scalar_parent_devtools_copy_unique_css_selector_opened
  description: Count of times the 'Copy Unique CSS Selector' action was used in the DevTools Inspector during the session.
