fields:
- name: CLICK_COUNT
  description: The total number of times a user clicked on a content item (e.g., a sponsored tile or recommendation). A value of 0 indicates no
    clicks were recorded for that item in the given period.
- name: DISMISS_COUNT
  description: The total number of times a user dismissed a content item such as a tile or recommendation. A value of 0 indicates the item was
    never dismissed during the given period.
- name: ER
  description: The engagement rate for a content item or surface, expressed as a float between 0 and 1. It represents the ratio of user interactions
    to total impressions.
- name: HAPPENED_AT
  description: The calendar date on which the event or activity being recorded occurred. Used to partition and filter data by day.
- name: IMPRESSION_COUNT
  description: The total number of times a content item was displayed to users. Higher values indicate the item was shown more frequently during
    the reporting period.
- name: POSITION
  description: The zero-based index position at which a content item (such as a tile or recommendation) was displayed within a surface layout.
    Lower values indicate positions closer to the top-left of the display area.
- name: SAVE_COUNT
  description: The total number of times a user saved a content item (e.g., to Pocket or a reading list). A value of 0 indicates the item was
    never saved during the given period.
- name: TILE_ID
  description: A unique numeric identifier for a content tile served to users, such as a sponsored or organic New Tab tile. Used to join tile-level
    engagement metrics across tables.
- name: _GS_FILE_DATE
  description: The date partition extracted from the source Google Cloud Storage file path, formatted as 'date=YYYY-MM-DD'. It indicates which
    day's data the file contains.
- name: _GS_FILE_NAME
  description: The full path of the source Parquet file in Google Cloud Storage from which the row was loaded. Includes directory structure, date
    partition, time partition, and filename.
- name: _GS_FILE_ROW_NUMBER
  description: The sequential row number of this record within its source Google Cloud Storage file. Used for deduplication and lineage tracking
    back to the originating file.
- name: _GS_FILE_TIME
  description: The time partition component extracted from the source Google Cloud Storage file path, typically formatted as 'time=HH-MM-SS-mmm'.
    It indicates when the source file was generated.
- name: _LOADED_AT
  description: The timestamp (in nanoseconds since Unix epoch) at which the row was loaded into BigQuery from the source file. Used for auditing
    and incremental load tracking.
- name: a11y_theme
  description: A map of accessibility theme settings active in the browser, where each key is a theme identifier and the corresponding boolean
    value indicates whether that theme is enabled.
- name: aborts_content_sum
  description: The total number of content process abort events recorded for a client over the aggregation period. A null value indicates no data
    was collected.
- name: aborts_gmplugin_sum
  description: The total number of Gecko Media Plugin (GMP) process abort events recorded for a client over the aggregation period. A null value
    indicates no data was collected, which is expected for most clients.
- name: aborts_plugin_sum
  description: The total number of plugin process abort events recorded for a client over the aggregation period. A null value indicates no data
    was collected, reflecting the rarity of plugin aborts.
- name: account_enabled
  description: Indicates whether the user's account (e.g., a Firefox Account) is currently enabled. True means the account is active; false means
    it has been disabled.
- name: activated
  description: Indicates whether a feature, experiment, or service has been activated for the client. True means activation occurred; false means
    it has not.
- name: active_addon_name
  description: The human-readable display name of an active browser extension or add-on installed by the user. May be localized depending on the
    user's locale.
- name: active_addons
  description: A structured array of all active add-ons installed in the browser, including metadata such as addon ID, version, type, signing
    state, install date, and whether the add-on is system- or user-installed.
- name: active_addons_count_mean
  description: The mean number of active add-ons installed in the browser across the aggregation period. Reflects the average extension load for
    a client over time.
- name: active_clients
  description: The count of distinct active clients contributing to a given aggregation group. Used to measure the size of a user population segment.
- name: active_experiment_branch
  description: The branch of an active experiment the client is enrolled in (e.g., 'control' or 'treatment'). A null value indicates the client
    is not enrolled in any experiment.
- name: active_experiment_id
  description: The identifier of the active experiment the client is enrolled in. A null value indicates no experiment enrollment is present for
    this client.
- name: active_hours
  description: The number of hours a client was actively using the browser during the reporting period, measured in fractional hours. A value
    of 0.0 indicates the browser was open but no user interaction was detected.
- name: active_hours_per_user_ratio
  description: The ratio of total active hours to the number of users in an aggregation group, representing average active usage hours per user.
    Used to compare engagement intensity across cohorts or segments.
- name: active_hours_sum
  description: The sum of active usage hours for a client or cohort over the aggregation period, measured in fractional hours. A value of 0.0
    indicates the browser was open but no user interaction was recorded.
- name: active_metric_date
  description: Indicates whether the record's date qualifies as an active metric date for the client. True means the date meets the activity threshold;
    false means it does not.
- name: activity_date_week
  description: The Monday-aligned start date of the calendar week in which the user activity occurred. Used for weekly aggregations and trend
    analysis.
- name: activity_segment
  description: A categorical label describing the user's engagement level based on their activity patterns. Possible values include 'core_user',
    'regular_user', 'casual_user', 'infrequent_user', and 'other'.
- name: ad_clicks
  description: The total number of times a user clicked on an advertisement during the reporting period. A null value indicates no ad click data
    was recorded for that client or session.
- name: ad_clicks_count_all
  description: The aggregated count of all ad click events across all ad surfaces for a client during the reporting period. A null value indicates
    no ad clicks were observed.
- name: additive_terms
  description: The sum of all additive component terms from a time-series forecasting model (e.g., Prophet), representing the combined contribution
    of trend, seasonality, and other components to the forecast.
- name: additive_terms_lower
  description: The lower bound of the uncertainty interval for the sum of additive forecasting model terms. Used alongside additive_terms and
    additive_terms_upper to express forecast confidence intervals.
- name: additive_terms_upper
  description: The upper bound of the uncertainty interval for the sum of additive forecasting model terms. Used alongside additive_terms and
    additive_terms_lower to express forecast confidence intervals.
- name: addon_compatibility_check_enabled
  description: Indicates whether the browser's add-on compatibility check feature is enabled. True means compatibility checking is active; false
    means it has been disabled by the user or policy.
- name: addon_id
  description: The unique identifier string for a browser add-on or extension, typically in the format of an email address or UUID (e.g., 'formautofill@mozilla.org'
    or '{guid}'). Used to uniquely reference a specific add-on across datasets.
- name: adjust_ad_group
  description: The name of the ad group within an Adjust-tracked marketing campaign that attributed the client's install or event. A null value
    indicates no ad group attribution is available (e.g., organic installs).
- name: adjust_campaign
  description: The name of the Adjust-tracked marketing campaign attributed to the client's install or event. Common values include 'Organic'
    for unattributed installs and named campaign strings for paid channels.
- name: adjust_creative
  description: The name of the specific creative asset within an Adjust-tracked marketing campaign that was attributed to the client's install
    or event. A null value indicates no creative-level attribution is available.
- name: adjust_network
  description: The name of the advertising network or acquisition channel attributed to the client's install via Adjust. Common values include
    'Organic', 'Google Ads ACI', and other paid network names.
- name: agg_type
  description: The type of aggregation used to produce the metric values in this record. The only currently observed value is 'histogram', indicating
    histogram-based aggregation.
- name: aggregates
  description: A key-value array representing aggregated metric data, where each key is a bucket or category identifier and each value is the
    corresponding aggregated numeric measurement (e.g., histogram bucket counts).
- name: aggregates.key
  description: The bucket or category key within an aggregated metric structure, such as a histogram bucket index. Used to identify which segment
    of the aggregation a value belongs to.
- name: aggregates.value
  description: The numeric aggregated value associated with a specific key in the aggregates array, such as a histogram bucket count or normalized
    weight. A value of 0.0 is the most common, indicating empty buckets.
- name: app
  description: The name or identifier of the Mozilla application associated with the telemetry record (e.g., Firefox, Fenix). Used to distinguish
    data originating from different Mozilla products.
- name: app_build_id
  description: The unique build identifier for the application version, formatted as a timestamp string (e.g., '20151029151421'). Used to pinpoint
    the exact build from which telemetry was submitted.
- name: app_channel
  description: The release channel of the application from which telemetry was submitted. Possible values include 'release', 'beta', and 'nightly',
    reflecting the product's update and stability tier.
- name: app_display_version
  description: The human-readable version string of the application as displayed to users (e.g., '151.0.1' or '115.36.0esr'). Includes extended
    support release (ESR) suffixes where applicable.
- name: app_name
  description: The internal identifier for the Mozilla application that generated the telemetry record (e.g., 'firefox_desktop', 'fenix', 'firefox_ios').
    Each value corresponds to a distinct Mozilla product or platform variant.
- name: app_version
  description: The full version string of the application at the time of data collection (e.g., '151.0.2'). This includes major, minor, and patch components
    as a dot-separated string.
- name: app_version_is_major_release
  description: Indicates whether the application version corresponds to a major release (e.g., 151.0). True means the version is a major release; false
    means it is a minor or patch update.
- name: app_version_major
  description: The major version number component of the application version (e.g., 151 for version 151.0.2). This is used to group records by major
    release cycle.
- name: app_version_minor
  description: The minor version number component of the application version (e.g., 0 for version 151.0.2). A value of 0 is by far the most common,
    representing the initial release within a major version.
- name: app_version_patch
  description: The patch version number component of the application version (e.g., 2 for version 151.0.2). This field may be null when no patch component
    is present in the version string.
- name: app_version_patch_revision
  description: The patch revision sub-component of the application version, representing incremental updates within a patch release. This field is
    null when no patch revision is applicable.
- name: apple_model_id
  description: The Apple hardware model identifier for macOS or iOS devices (e.g., 'MacBookAir10,1', 'Mac16,12'). This field is null for non-Apple
    hardware and is sparsely populated.
- name: application
  description: The human-readable name of the Mozilla application (e.g., 'Firefox', 'Focus', 'FirefoxForFireTV'). This distinguishes between different
    Mozilla browser products within the same dataset.
- name: arch
  description: The CPU architecture of the device on which the application is running (e.g., 'arm64-v8a', 'armeabi-v7a', 'x86_64'). This is typically
    populated for mobile platforms using Android ABI identifiers.
- name: architecture
  description: The processor architecture of the client device (e.g., 'x86-64', 'aarch64', 'arm'). This field reflects the architecture of the host
    system as reported by the application.
- name: asofdate
  description: The date for which the record's metrics or state are calculated, formatted as a YYYY-MM-DD string. This field represents the reference
    date of the snapshot rather than the ingestion or submission date.
- name: attributed
  description: Indicates whether the client installation has attribution data associated with it. True means attribution information is present; false
    means the installation has no known attribution source.
- name: attribution.campaign
  description: The marketing campaign name or identifier from the installation attribution parameters, URL-encoded. This field is null when attribution
    data is not available.
- name: attribution.content
  description: The content parameter from the installation attribution data, typically identifying the specific creative or link element that led to
    the download, URL-encoded. This field is null when attribution data is not available.
- name: attribution.dlsource
  description: The download source identifier from attribution data, indicating the platform or channel through which the installer was obtained (e.g.,
    'mozorg', 'mozillaci', 'fxdotcom'). This field is null when attribution data is not available.
- name: attribution.dltoken
  description: A unique token (UUID) associated with the specific download event, used to link an installation back to a particular download attribution
    record. This field is null when attribution data is not available.
- name: attribution.experiment
  description: The experiment identifier from the installation attribution data, indicating which A/B test or download experiment the user was part
    of when they downloaded the application. This field is null when no experiment attribution is present.
- name: attribution.medium
  description: The marketing medium from the installation attribution data, describing the channel type that drove the download (e.g., 'referral',
    'paidsearch', 'email'), URL-encoded. This field is null when attribution data is not available.
- name: attribution.source
  description: The traffic source from the installation attribution data, typically identifying the referring website or platform (e.g., 'www.google.com',
    'www.bing.com'), URL-encoded. This field is null when attribution data is not available.
- name: attribution.ua
  description: The user agent type of the browser used to download the application, as captured in attribution data (e.g., 'chrome', 'edge', 'firefox',
    'ie'). This field is null when attribution data is not available.
- name: attribution.variation
  description: The experiment variation or branch from the installation attribution data, identifying which variant of a download experiment the user
    encountered (e.g., 'control', 'treatment'). This field is null when no variation attribution is present.
- name: attribution_campaign
  description: The marketing campaign name or identifier from the client's installation attribution, URL-encoded. This is a scalar counterpart to the
    nested attribution.campaign field and is null when attribution data is absent.
- name: attribution_content
  description: The content parameter from the client's installation attribution data, identifying the specific creative or download link element, URL-encoded.
    This field is null when attribution data is absent.
- name: attribution_dlsource
  description: The download source from the client's installation attribution, indicating the platform or channel through which the installer was obtained
    (e.g., 'mozorg', 'mozillaci', 'fxdotcom'). This field is null when attribution data is absent.
- name: attribution_dltoken
  description: A unique UUID token associated with the specific download event for this client, used to link an installation to a download attribution
    record. This field is null when attribution data is absent.
- name: attribution_experiment
  description: The experiment identifier from the client's installation attribution data, indicating which download experiment the user was part of
    at the time of installation. This field is null when no experiment attribution is present.
- name: attribution_medium
  description: The marketing channel medium from the client's installation attribution (e.g., 'referral', 'paidsearch', 'firefox-desktop'), URL-encoded.
    This field is null when attribution data is absent.
- name: attribution_msstoresignedin
  description: Indicates whether the user was signed into the Microsoft Store at the time of installation, relevant for installs originating from the
    Microsoft Store. This field is currently always null and is reserved for future population.
- name: attribution_source
  description: The traffic source from the client's installation attribution, identifying the referring website or platform that led to the download
    (e.g., 'www.google.com', 'www.bing.com'), URL-encoded. This field is null when attribution data is absent.
- name: attribution_ua
  description: The user agent type of the browser used to download the application, as captured in the client's scalar attribution data (e.g., 'chrome',
    'edge', 'firefox'). This field is null when attribution data is absent.
- name: attribution_variation
  description: The experiment variation or branch from the client's installation attribution data, identifying which variant of a download experiment
    was encountered (e.g., 'control', 'treatment'). This field is null when no variation attribution is present.
- name: average_profile_age
  description: The average age of the Firefox profile in days, computed across a cohort or aggregated unit. Higher values indicate longer-lived profiles.
- name: avg_hours_usage_daily
  description: The average number of hours per day the application was actively used. This metric is used to characterize typical daily engagement
    with the browser.
- name: blocklist_enabled
  description: Indicates whether the browser's blocklist feature is enabled on the client. True means the blocklist is active; false means it has been
    disabled.
- name: bookmark_migrations_quantity_all
  description: The total number of bookmarks migrated from all source browsers combined during a browser migration event. This field is null when no
    migration has taken place.
- name: bookmark_migrations_quantity_chrome
  description: The number of bookmarks migrated specifically from Google Chrome during a browser migration event. This field is null when no Chrome
    migration has occurred.
- name: bookmark_migrations_quantity_edge
  description: The number of bookmarks migrated specifically from Microsoft Edge during a browser migration event. This field is null when no Edge
    migration has occurred.
- name: bookmark_migrations_quantity_safari
  description: The number of bookmarks migrated specifically from Apple Safari during a browser migration event. This field is null when no Safari
    migration has occurred.
- name: bookmarks_added_per_dau
  description: The ratio of bookmarks added to the number of daily active users (DAU) for a given aggregation period. This metric measures the rate
    of bookmark creation activity normalized by active user count.
- name: bookmarks_opened_per_dau
  description: The ratio of bookmark open events to the number of daily active users (DAU) for a given aggregation period. This metric measures how
    frequently users engage with existing bookmarks, normalized by active user count.
- name: branch
  description: The experiment branch or rollout variant the client is enrolled in (e.g., 'control', 'treatment-a', 'rollout'). This field identifies
    which experimental condition the client was assigned to.
- name: browser_arch
  description: The CPU architecture of the browser process (e.g., x86-64, aarch64). This field describes the compiled architecture of the browser binary
    being run on the client device.
- name: browser_backup_archive_enabled
  description: Indicates whether the browser backup archive feature is enabled for the client. True means backup archiving is active; false means it
    is explicitly disabled; null means the feature state was not reported.
- name: browser_backup_scheduler_enabled
  description: Indicates whether the browser's automatic backup scheduler is enabled for the client. True means the scheduler is active; false means
    it is disabled; null means the feature state was not reported.
- name: browser_name
  description: The human-readable name of the browser as reported by the client (e.g., 'Firefox Desktop'). This field identifies the browser product
    in a display-friendly format.
- name: browser_version
  description: The full version string of the browser (e.g., '151.0.2'), including major, minor, and patch components. This field represents the precise
    browser release installed on the client.
- name: browser_version_info.is_major_release
  description: Indicates whether the browser version is a major release. True means the version represents a major release (e.g., 151.0); false means
    it is a minor or patch update.
- name: browser_version_info.major_version
  description: The major version number component extracted from the browser version string (e.g., 151 for version 151.0.2). This is used to group
    clients by major browser release.
- name: browser_version_info.minor_version
  description: The minor version number component extracted from the browser version string (e.g., 0 for version 151.0). A value of 0 is the most common,
    representing the base release within a major version.
- name: browser_version_info.patch_revision
  description: The patch revision number component of the browser version (e.g., the '2' in a version like 115.0.2). A null value indicates the patch
    revision is not applicable or not recorded for that release.
- name: browser_version_info.version
  description: The full version string of the Firefox browser (e.g., '115.0a1' or '151.0.2'), including major, minor, patch, and pre-release identifiers
    where applicable.
- name: bug_1501329_affected
  description: Indicates whether the client was affected by the regression tracked in Mozilla bug 1501329. True means the client was affected; false
    means it was not; null indicates the check was not applicable or not performed.
- name: build_architecture
  description: The CPU architecture for which the Firefox build was compiled, such as 'x86-64', 'aarch64', 'x86', or 'arm'. This reflects the binary
    target architecture rather than the host machine's architecture.
- name: build_channel
  description: The release channel on which the Firefox build was distributed, such as 'release', 'beta', 'nightly', or 'aurora'. Unofficial or third-party
    channel names may also appear for non-standard builds.
- name: build_id
  description: A timestamp-based string identifier for the specific Firefox build, formatted as YYYYMMDDHHmmSS (e.g., '20260514164700'). This uniquely
    identifies when a particular build was compiled.
- name: build_version
  description: The version string associated with a specific Firefox build. This corresponds to the product version at the time the build was produced.
- name: campaign
  description: The marketing campaign name or identifier associated with a user acquisition or engagement event, typically derived from UTM campaign
    parameters. A null value indicates no campaign attribution was recorded.
- name: campaign_id
  description: A unique identifier for the specific advertising or marketing campaign that drove a user acquisition event, often including the ad platform's
    internal campaign ID. A null value indicates no campaign ID was attributed.
- name: category
  description: A categorical label used to classify an event or record into a functional area or feature group (e.g., 'devtools.main', 'pwmgr', 'doh').
    A null value indicates the category was not specified or is not applicable.
- name: cdou
  description: The cumulative days of use metric, representing the total number of days a client has actively used the browser up to the point of measurement.
    Higher values indicate longer-tenured or more active users.
- name: channel
  description: The Firefox release channel associated with the client or event, such as 'release', 'beta', 'nightly', 'esr', or 'aurora'. This field
    may contain raw or normalized channel values depending on the pipeline.
- name: channel_raw
  description: The raw, unnormalized marketing or traffic channel through which a user arrived, such as 'Organic Search', 'Paid Search', 'Referral',
    or 'Direct'. A null value indicates the channel could not be determined.
- name: city
  description: The city associated with the client's IP address or reported location at the time of the event. A null value indicates the city could
    not be determined through geolocation.
- name: click_count
  description: The total number of click interactions recorded for a given session, surface, or feature within the specified aggregation period. A
    value of zero indicates no clicks were recorded.
- name: client_agg_type
  description: Describes the aggregation method applied to client-level metric values, such as 'summed_histogram', 'count', 'avg', 'sum', 'min', or
    'max'. An empty string indicates the aggregation type was not specified.
- name: client_clock_skew_mean
  description: The mean clock skew (in hours) observed for a client, representing the average difference between the client's local clock and the server's
    reference time. Negative values indicate the client clock is behind the server.
- name: client_count
  description: The number of distinct clients contributing to an aggregated row or metric. A value of 1 indicates data for a single client, while higher
    values represent grouped or rolled-up aggregations.
- name: client_id
  description: A UUID that uniquely identifies a Firefox client installation. This identifier persists across sessions and is used to track longitudinal
    behavior for a given browser profile.
- name: client_submission_latency_mean
  description: The mean latency (in seconds) between when telemetry data was generated on the client and when it was received by the ingestion pipeline.
    A value of zero indicates near-instantaneous submission.
- name: clients
  description: The total count of distinct clients included in a given aggregation or summary row. This is typically used in rollup or reporting tables
    to indicate population size.
- name: cohort_date
  description: The specific calendar date on which a cohort of clients is defined, typically corresponding to the date of first activity, installation,
    or enrollment. Used to group clients by their entry point for retention and engagement analysis.
- name: cohort_date_week
  description: The Monday-aligned start date of the week in which a client's cohort date falls. Used for weekly cohort-based analysis of retention
    and engagement trends.
- name: content
  description: The UTM content parameter or creative identifier associated with a marketing touchpoint, used to distinguish between different ad creatives
    or link placements within the same campaign. A null value indicates no content attribution was recorded.
- name: contextual_services_quicksuggest_block_dynamic_wikipedia_sum
  description: An array of key-value pairs aggregating the total number of times a user blocked a dynamic Wikipedia suggestion in Firefox's Quick Suggest
    feature, keyed by a relevant dimension such as match type or source. Each value represents the summed block count.
- name: contextual_services_quicksuggest_block_nonsponsored_bestmatch_sum
  description: An array of key-value pairs aggregating the total number of times a user blocked a non-sponsored best-match suggestion in Firefox's
    Quick Suggest feature. Each value represents the summed block count for the corresponding dimension key.
- name: contextual_services_quicksuggest_block_nonsponsored_sum
  description: An array of key-value pairs aggregating the total number of times a user blocked a non-sponsored Quick Suggest result in Firefox's address
    bar. Each value represents the summed block count for the corresponding dimension key.
- name: contextual_services_quicksuggest_block_sponsored_bestmatch_sum
  description: An array of key-value pairs aggregating the total number of times a user blocked a sponsored best-match suggestion in Firefox's Quick
    Suggest feature. Each value represents the summed block count for the corresponding dimension key.
- name: contextual_services_quicksuggest_block_sponsored_sum
  description: An array of key-value pairs aggregating the total number of times a user blocked a sponsored Quick Suggest result in Firefox's address
    bar. Each value represents the summed block count for the corresponding dimension key.
- name: contextual_services_quicksuggest_block_weather_sum
  description: An array of key-value pairs aggregating the total number of times a user blocked a weather-related Quick Suggest result in Firefox's
    address bar. Each value represents the summed block count for the corresponding dimension key.
- name: contextual_services_quicksuggest_click_dynamic_wikipedia_sum
  description: An array of key-value pairs aggregating the total number of clicks on dynamic Wikipedia suggestions surfaced by Firefox's Quick Suggest
    feature. Each value represents the summed click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_click_nonsponsored_bestmatch_sum
  description: An array of key-value pairs aggregating the total number of clicks on non-sponsored best-match suggestions in Firefox's Quick Suggest
    feature. Each value represents the summed click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_click_nonsponsored_sum
  description: An array of key-value pairs aggregating the total number of clicks on non-sponsored Quick Suggest results in Firefox's address bar.
    Each value represents the summed click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_click_sponsored_bestmatch_sum
  description: An array of key-value pairs aggregating the total number of clicks on sponsored best-match suggestions in Firefox's Quick Suggest feature.
    Each value represents the summed click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_click_sponsored_sum
  description: An array of key-value pairs aggregating the total number of clicks on sponsored Quick Suggest results in Firefox's address bar. Each
    value represents the summed click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_click_sum
  description: An array of key-value pairs aggregating the total number of clicks across all Quick Suggest result types in Firefox's address bar. Each
    value represents the summed click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_click_weather_sum
  description: An array of key-value pairs aggregating the total number of clicks on weather-related Quick Suggest results in Firefox's address bar.
    Each value represents the summed click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_help_dynamic_wikipedia_sum
  description: An array of key-value pairs aggregating the total number of times a user clicked the help link associated with a dynamic Wikipedia Quick
    Suggest result. Each value represents the summed help-click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_help_nonsponsored_bestmatch_sum
  description: An array of key-value pairs aggregating the total number of times a user clicked the help link on a non-sponsored best-match Quick Suggest
    result. Each value represents the summed help-click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_help_nonsponsored_sum
  description: An array of key-value pairs aggregating the total number of times a user clicked the help link associated with a non-sponsored Quick
    Suggest result. Each value represents the summed help-click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_help_sponsored_bestmatch_sum
  description: An array of key-value pairs aggregating the total number of times a user clicked the help link on a sponsored best-match Quick Suggest
    result. Each value represents the summed help-click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_help_sponsored_sum
  description: An array of key-value pairs aggregating the total number of times a user clicked the help link associated with a sponsored Quick Suggest
    result. Each value represents the summed help-click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_help_sum
  description: An array of key-value pairs aggregating the total number of times a user clicked a help link across all Quick Suggest result types in
    Firefox's address bar. Each value represents the summed help-click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_help_weather_sum
  description: An array of key-value pairs aggregating the total number of times a user clicked the help link associated with a weather-related Quick
    Suggest result. Each value represents the summed help-click count for the corresponding dimension key.
- name: contextual_services_quicksuggest_impression_dynamic_wikipedia_sum
  description: An array of key-value pairs aggregating the total number of times a dynamic Wikipedia suggestion was shown to a user via Firefox's Quick
    Suggest feature. Each value represents the summed impression count for the corresponding dimension key.
- name: contextual_services_quicksuggest_impression_nonsponsored_bestmatch_sum
  description: An array of key-value pairs aggregating the total number of times a non-sponsored best-match Quick Suggest result was displayed to a
    user. Each value represents the summed impression count for the corresponding dimension key.
- name: contextual_services_quicksuggest_impression_nonsponsored_sum
  description: An array of key-value pairs aggregating the total number of impressions for non-sponsored Quick Suggest results shown in Firefox's address
    bar. Each value represents the summed impression count for the corresponding dimension key.
- name: contextual_services_quicksuggest_impression_sponsored_bestmatch_sum
  description: An array of key-value pairs aggregating the total number of times a sponsored best-match Quick Suggest result was displayed to a user.
    Each value represents the summed impression count for the corresponding dimension key.
- name: contextual_services_quicksuggest_impression_sponsored_sum
  description: An array of key-value pairs aggregating the total number of impressions for sponsored Quick Suggest results shown in Firefox's address
    bar. Each value represents the summed impression count for the corresponding dimension key.
- name: contextual_services_quicksuggest_impression_sum
  description: An array of key-value pairs aggregating the total number of impressions across all Quick Suggest result types shown in Firefox's address
    bar. Each value represents the summed impression count for the corresponding dimension key.
- name: contextual_services_quicksuggest_impression_weather_sum
  description: An array of key-value pairs aggregating the total number of weather-related Quick Suggest impressions served via Contextual Services,
    broken down by a string key dimension. Each entry records the impression count for that key over the aggregation period.
- name: contextual_services_topsites_click_sum
  description: An array of key-value pairs aggregating the total number of clicks on Top Sites tiles served via Contextual Services, broken down by
    a string key dimension. Each entry records the click count for that key over the aggregation period.
- name: contextual_services_topsites_impression_sum
  description: An array of key-value pairs aggregating the total number of impressions for Top Sites tiles served via Contextual Services, broken down
    by a string key dimension. Each entry records the impression count for that key over the aggregation period.
- name: corpus_item_id
  description: A unique UUID identifying a specific content item within the recommendation corpus (e.g., a Pocket article or sponsored tile). This
    ID can be used to join or look up metadata about the individual content piece.
- name: count
  description: A general-purpose integer count representing the number of occurrences or records associated with the row's dimensions. The specific
    event or entity being counted depends on the context of the table.
- name: country
  description: The ISO 3166-1 alpha-2 country code representing the country associated with the client or record (e.g., 'US' for United States, 'DE'
    for Germany).
- name: country_code
  description: The ISO 3166-1 alpha-2 country code identifying the country of the client or record. Similar to the country field, this value is derived
    from client metadata or geo-IP lookup.
- name: country_name
  description: The full human-readable name of the country associated with the client or record (e.g., 'United States', 'India'). This complements
    country code fields with a display-friendly label.
- name: cpu_cores
  description: The number of logical CPU cores available on the client device. This reflects hardware parallelism capability and is used for device
    characterization.
- name: cpu_count
  description: The total number of logical processors (CPUs) reported by the client device. This may include hyperthreaded cores and is used alongside
    cpu_cores to characterize device hardware.
- name: cpu_family
  description: The numeric CPU family identifier as reported by the processor's CPUID instruction. This value categorizes the processor into a broad
    architectural family (e.g., 6 for Intel Core).
- name: cpu_l2_cache_kb
  description: The size of the CPU's L2 cache in kilobytes as reported by the client device. A value of 0 may indicate the cache size could not be
    determined.
- name: cpu_l3_cache_kb
  description: The size of the CPU's L3 cache in kilobytes as reported by the client device. A null or 0 value may indicate the processor has no L3
    cache or the size could not be determined.
- name: cpu_model
  description: The numeric CPU model identifier as reported by the processor's CPUID instruction. Together with cpu_family and cpu_stepping, this uniquely
    identifies the processor microarchitecture.
- name: cpu_speed
  description: The CPU clock speed as a string value reported by the client device. This field captures the processor's rated or reported speed in
    a free-form text format.
- name: cpu_speed_mhz
  description: The CPU clock speed in megahertz (MHz) as reported by the client device. A value of 0 may indicate the speed could not be determined.
- name: cpu_stepping
  description: The numeric CPU stepping identifier as reported by the processor's CPUID instruction. Stepping identifies a specific revision within
    a CPU model and is used together with family and model for precise processor identification.
- name: cpu_vendor
  description: The CPU vendor identifier string as reported by the processor's CPUID instruction (e.g., 'GenuineIntel', 'AuthenticAMD'). An empty or
    null value indicates the vendor could not be determined.
- name: crash_submit_attempt_content_sum
  description: The total number of crash report submission attempts for content process crashes during the aggregation period. A null value indicates
    no content process crash submissions were attempted.
- name: crash_submit_attempt_main_sum
  description: The total number of crash report submission attempts for main process crashes during the aggregation period. A null value indicates
    no main process crash submissions were attempted.
- name: crash_submit_attempt_plugin_sum
  description: The total number of crash report submission attempts for plugin process crashes during the aggregation period. This field is typically
    null, indicating plugin crash submissions are no longer tracked or observed.
- name: crash_submit_success_content_sum
  description: The total number of successfully submitted crash reports for content process crashes during the aggregation period. A value of 0 means
    submissions were attempted but none succeeded; null means no attempts occurred.
- name: crash_submit_success_main_sum
  description: The total number of successfully submitted crash reports for main process crashes during the aggregation period. A value of 0 means
    submissions were attempted but none succeeded; null means no attempts occurred.
- name: crash_submit_success_plugin_sum
  description: The total number of successfully submitted crash reports for plugin process crashes during the aggregation period. This field is typically
    null, indicating plugin crash submissions are no longer tracked or observed.
- name: crash_time
  description: A string representation of the timestamp at which a crash occurred. The format may vary and captures the wall-clock time of the crash
    event as reported by the client.
- name: crashes_detected_content_sum
  description: The total number of content process crashes detected on the client during the aggregation period. A null value indicates no content
    process crashes were detected.
- name: crashes_detected_gmplugin_sum
  description: The total number of Gecko Media Plugin (GMP) process crashes detected on the client during the aggregation period. A null value indicates
    no GMP crashes were detected.
- name: crashes_detected_plugin_sum
  description: The total number of plugin process crashes detected on the client during the aggregation period. A null value indicates no plugin crashes
    were detected.
- name: crashing_users
  description: The number of unique users who experienced at least one crash during the aggregation period. This is a floating-point value to support
    weighted or fractional user counting methodologies.
- name: cumulative_new_profiles
  description: The running cumulative total of new Firefox profiles created up to and including the current period. A value of 0 indicates no new profiles
    were created in the relevant segment; null indicates the metric is unavailable.
- name: daily_users
  description: The count of unique users active on a given day, used to measure daily engagement. A value of 0 indicates no users were active for that
    dimension combination on that day.
- name: date
  description: A string representation of the calendar date associated with the record, typically in YYYY-MM-DD format. This field is used for time-series
    partitioning and filtering.
- name: date_from
  description: The inclusive start date of the time window covered by the record. Used together with date_to to define a date range for the aggregation
    or analysis.
- name: date_to
  description: The inclusive end date of the time window covered by the record. Used together with date_from to define a date range for the aggregation
    or analysis.
- name: dau
  description: Daily Active Users (DAU); the count of unique users considered active on a specific day according to the applicable activity definition.
    A value of 0 indicates no active users for that dimension combination.
- name: days_active_bits
  description: A 28-bit integer bitmask where each bit represents one day in a rolling 28-day window, with a set bit indicating the client was active
    on that day. The most significant bit represents the most recent day.
- name: days_created_profile_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating a new Firefox profile was created on that day.
    Used to track the recency and frequency of new profile creation events.
- name: days_had_8_active_ticks_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating the client had at least 8 active ticks (approximately
    40 minutes of activity) on that day. Used to measure days of substantive usage.
- name: days_interacted_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating the client had at least one recorded user interaction
    (e.g., URI visit or active tick) on that day.
- name: days_logged_event_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating that at least one telemetry event was logged
    for the client on that day.
- name: days_opened_dev_tools_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating the client opened Firefox Developer Tools on
    that day. Used to identify developer-oriented usage patterns.
- name: days_seen_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating a telemetry ping was received from the client
    on that day. This is the broadest activity signal, indicating the client was 'seen' regardless of usage intensity.
- name: days_seen_in_experiment
  description: An array of structs recording, for each experiment the client is enrolled in, the experiment ID, branch assignment, and a bitmask of
    days the client was observed while enrolled. Used to track experiment exposure over time.
- name: days_since_first_seen
  description: The number of days elapsed between the date the client's profile was first seen (i.e., the profile creation or first-ping date) and
    the current record's date. A value of 0 indicates the client was first seen on the same day.
- name: days_since_seen
  description: The number of days since the client was last seen in telemetry data prior to the current record's date. A value of 0 indicates the client
    was seen on the current day.
- name: days_used_pictureinpicture_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating the client used the Picture-in-Picture video
    feature on that day. Used to measure adoption and frequency of this feature.
- name: days_viewed_protection_report_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating the client viewed the Firefox Privacy Protections
    report on that day. Used to track engagement with privacy-related UI.
- name: days_visited_10_uri_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating the client visited at least 10 URIs on that
    day. Used as a proxy for high-intensity browsing activity.
- name: days_visited_1_uri_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating the client visited at least 1 URI on that day.
    This is a broad indicator of any browsing activity occurring on a given day.
- name: days_visited_1_uri_normal_mode_bits
  description: A bitmask where each bit represents a day in a rolling window, with a set bit indicating the client visited at least 1 URI in a normal
    (non-private) browsing window on that day. This excludes private browsing activity from the usage signal.
