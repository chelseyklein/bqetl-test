- name: payload
  type: RECORD
  mode: NULLABLE
  description: ''
  fields:
  - name: crashDate
    type: STRING
    mode: NULLABLE
    description: The date on which the crash occurred, as reported in the crash ping payload.
  - name: crashTime
    type: STRING
    mode: NULLABLE
    description: The time of the crash expressed as seconds since the Unix epoch, as reported in the crash
      ping payload.
  - name: hasCrashEnvironment
    type: BOOLEAN
    mode: NULLABLE
    description: Whether the crash ping payload includes a full environment object. True when environment
      information was captured at crash time.
  - name: metadata
    type: RECORD
    mode: NULLABLE
    description: ''
    fields:
    - name: key_value
      type: RECORD
      mode: REPEATED
      description: An array of key-value pairs from the crash ping metadata struct, containing additional crash
        annotations such as memory info, crash flags, and environment details.
      fields:
      - name: key
        type: STRING
        mode: NULLABLE
        description: ''
      - name: value
        type: STRING
        mode: NULLABLE
        description: ''
  - name: processType
    type: STRING
    mode: NULLABLE
    description: The type of Firefox process that crashed, such as 'main', 'content', 'gpu', or 'utility'.
  - name: version
    type: INT64
    mode: NULLABLE
    description: The schema version of the crash ping payload.
