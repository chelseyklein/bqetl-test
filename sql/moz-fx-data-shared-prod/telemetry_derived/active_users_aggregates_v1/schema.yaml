fields:
- mode: NULLABLE
  name: segment
  type: STRING
  description: Classification of users based on their browsing activity. E.g., infrequent,
    casual, regular.
- mode: NULLABLE
  name: app_version
  type: STRING
  description: User visible version string (e.g. "1.0.3") for the browser.
- mode: NULLABLE
  name: attribution_medium
  type: STRING
  description: The attribution medium for this install, corresponding to the UTM medium
    parameter; e.g. 'organic' for search engine installs. Null when no attribution
    data is present.
- mode: NULLABLE
  name: attribution_source
  type: STRING
  description: The attribution source for this install, corresponding to the UTM source
    parameter and indicating the referring partner domain. Null when no attribution
    data is present.
- mode: NULLABLE
  name: city
  type: STRING
  description: The name of the city in which the activity took place, as determined
    by IP geolocation.
- mode: NULLABLE
  name: country
  type: STRING
  description: Name of the country in which the activity took place, as determined
    by the IP geolocation.
- mode: NULLABLE
  name: distribution_id
  type: STRING
  description: The distribution id associated with the install of Firefox.
- mode: NULLABLE
  name: is_default_browser
  type: BOOLEAN
  description: A flag indicating whether the browser is set as the default browser
    on the client side.
- mode: NULLABLE
  name: app_name
  type: STRING
  description: The name of the browser application, e.g. 'Firefox Desktop' or 'Fenix'.
- mode: NULLABLE
  name: channel
  type: STRING
  description: The normalized channel the application is being distributed on.
- mode: NULLABLE
  name: os
  type: STRING
  description: The normalized name of the operating system running at the client.
- mode: NULLABLE
  name: os_version
  type: STRING
  description: The full version string of the operating system running at the client,
    e.g. '10.0.19041'.
- mode: NULLABLE
  name: os_version_major
  type: INTEGER
  description: Major or first part of the operating system version running at the
    client. E.g. for version "100.9.11", the major is 100.
- mode: NULLABLE
  name: os_version_minor
  type: INTEGER
  description: Minor part of the operating system version running at the client. E.g.
    for version "100.9.11", the minor is 9.
- mode: NULLABLE
  name: submission_date
  type: DATE
  description: The date when the telemetry ping is received on the server side.
- mode: NULLABLE
  name: dau
  type: INTEGER
  description: Daily Active Users
- mode: NULLABLE
  name: wau
  type: INTEGER
  description: Weekly Active Users
- mode: NULLABLE
  name: mau
  type: INTEGER
  description: Monthly Active Users
- mode: NULLABLE
  name: new_profiles
  type: INTEGER
  description: The count of distinct clients whose first seen date matches the submission
    date, indicating a newly created profile on that day.
- mode: NULLABLE
  name: ad_clicks
  type: INTEGER
  description: The total number of ad clicks recorded across all clients in this segment
    on the submission date.
- mode: NULLABLE
  name: organic_search_count
  type: INTEGER
  description: The total number of organic (non-tagged) searches performed across
    all clients in this segment on the submission date.
- mode: NULLABLE
  name: search_count
  type: INTEGER
  description: The total number of searches performed across all clients in this segment
    on the submission date.
- mode: NULLABLE
  name: search_with_ads
  type: INTEGER
  description: The total number of search result pages containing ads that were seen
    by clients in this segment on the submission date.
- mode: NULLABLE
  name: uri_count
  type: INTEGER
  description: The total number of URIs visited by clients in this segment on the
    submission date.
- mode: NULLABLE
  name: active_hours
  type: FLOAT
  description: The total number of active hours (browser window in focus) accumulated
    by clients in this segment on the submission date.
- mode: NULLABLE
  name: first_seen_year
  type: INTEGER
  description: The calendar year in which the client was first seen, extracted from
    the first_seen_date. Used to segment users by cohort age.
- mode: NULLABLE
  name: attributed
  type: BOOLEAN
  description: True if either attribution_medium or attribution_source is non-null,
    indicating the install was attributed to a known source. False otherwise.
- mode: NULLABLE
  name: language_name
  type: STRING
  description: The human-readable name of the browser locale language derived from
    the client locale code, e.g. 'English'. Set to 'Other' if the locale is unrecognized.
- description: Count of distinct, qualified Desktop clients that we received a main
    ping from on a given day. In mobile DAU = QDAU.
  mode: NULLABLE
  name: qdau_desktop
  type: INTEGER
