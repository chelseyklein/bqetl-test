fields:
- description: The date when the telemetry ping is received on the server side.
  mode: NULLABLE
  name: submission_date
  type: DATE
- description: A unique identifier (UUID) for the client.
  mode: NULLABLE
  name: client_id
  type: STRING
- description: Total number of content process aborts across all subsessions on this
    day. Null when no content process activity was recorded (~97% null rate).
  mode: NULLABLE
  name: aborts_content_sum
  type: INTEGER
- description: Total number of Gecko Media Plugin (GMP) process aborts on this day.
    Nearly always null as GMP crashes are rare.
  mode: NULLABLE
  name: aborts_gmplugin_sum
  type: INTEGER
- description: Total number of plugin process aborts on this day. Nearly always null
    as plugin usage is rare in modern Firefox.
  mode: NULLABLE
  name: aborts_plugin_sum
  type: INTEGER
- description: Mean number of active add-ons across all subsessions on this day. Typical
    values range from 4 to 11.
  mode: NULLABLE
  name: active_addons_count_mean
  type: FLOAT
- description: null
  fields:
  - description: null
    mode: NULLABLE
    name: addon_id
    type: STRING
  - description: null
    mode: NULLABLE
    name: blocklisted
    type: BOOLEAN
  - description: null
    mode: NULLABLE
    name: name
    type: STRING
  - description: null
    mode: NULLABLE
    name: user_disabled
    type: BOOLEAN
  - description: null
    mode: NULLABLE
    name: app_disabled
    type: BOOLEAN
  - description: null
    mode: NULLABLE
    name: version
    type: STRING
  - description: null
    mode: NULLABLE
    name: scope
    type: INTEGER
  - description: null
    mode: NULLABLE
    name: type
    type: STRING
  - description: null
    mode: NULLABLE
    name: foreign_install
    type: BOOLEAN
  - description: null
    mode: NULLABLE
    name: has_binary_components
    type: BOOLEAN
  - description: null
    mode: NULLABLE
    name: install_day
    type: INTEGER
  - description: null
    mode: NULLABLE
    name: update_day
    type: INTEGER
  - description: null
    mode: NULLABLE
    name: signed_state
    type: INTEGER
  - description: null
    mode: NULLABLE
    name: is_system
    type: BOOLEAN
  - description: null
    mode: NULLABLE
    name: is_web_extension
    type: BOOLEAN
  - description: null
    mode: NULLABLE
    name: multiprocess_compatible
    type: BOOLEAN
  mode: REPEATED
  name: active_addons
  type: RECORD
- description: The branch of the active experiment the client is enrolled in, sourced
    from the legacy telemetry environment. Currently always null in this table.
  mode: NULLABLE
  name: active_experiment_branch
  type: STRING
- description: The identifier of the active experiment the client is enrolled in,
    sourced from the legacy telemetry environment. Currently always null in this table.
  mode: NULLABLE
  name: active_experiment_id
  type: STRING
- description: Total number of hours Firefox was actively used (user interaction detected)
    across all subsessions on this day.
  mode: NULLABLE
  name: active_hours_sum
  type: FLOAT
- description: Whether application compatibility is respected for add-ons. True for
    nearly all clients; false indicates the user has disabled compatibility checking.
  mode: NULLABLE
  name: addon_compatibility_check_enabled
  type: BOOLEAN
- description: The build ID of the Firefox application as reported in the URI metadata,
    e.g. '20260427013024'. Matches env_build_id in this table.
  mode: NULLABLE
  name: app_build_id
  type: STRING
- description: User visible version string (e.g. "1.0.3") for the browser.
  mode: NULLABLE
  name: app_display_version
  type: STRING
- description: The name of the browser application. Always 'Firefox' in this table.
  mode: NULLABLE
  name: app_name
  type: STRING
- description: User visible version string (e.g. "1.0.3") for the browser.
  mode: NULLABLE
  name: app_version
  type: STRING
- description: Struct containing install attribution data parsed from the Firefox
    installer stub, identifying the campaign, source, and medium that led to the download.
  fields:
  - description: Referring partner domain or search engine when the install happened
      via a known partner, e.g. 'www.google.com' or 'www.bing.com'.
    mode: NULLABLE
    name: source
    type: STRING
  - description: Category of the traffic source that led to the Firefox install, e.g.
      'referral', 'paidsearch', or 'cpc'.
    mode: NULLABLE
    name: medium
    type: STRING
  - description: Identifier of the particular campaign that led to the download of
      Firefox, URL-encoded.
    mode: NULLABLE
    name: campaign
    type: STRING
  - description: Identifier for the particular link within a campaign that led to
      the Firefox download, URL-encoded.
    mode: NULLABLE
    name: content
    type: STRING
  - mode: NULLABLE
    name: experiment
    type: STRING
    description: Funnel experiment parameter captured at Firefox download time, e.g.
      'download-privacy'. See bug 1567339.
  - mode: NULLABLE
    name: variation
    type: STRING
    description: Funnel experiment variation parameter captured at Firefox download
      time. See bug 1567339.
  - mode: NULLABLE
    name: dltoken
    type: STRING
    description: Unique token generated at Firefox download time that ties the installer
      to a specific download event. See bug 1677497.
  - name: dlsource
    type: STRING
    mode: NULLABLE
    description: Identifier indicating where the Firefox installation originated,
      e.g. 'mozorg', 'mozillaci', or 'fxdotcom'. See bug 1827233.
  - name: ua
    type: STRING
    mode: NULLABLE
    description: Derived user agent of the browser used to download Firefox, e.g.
      'edge', 'chrome', 'firefox'. See bug 1595063.
  mode: NULLABLE
  name: attribution
  type: RECORD
- description: Whether the Firefox add-on and plugin blocklist is enabled on this
    client. True for the vast majority of clients.
  mode: NULLABLE
  name: blocklist_enabled
  type: BOOLEAN
- description: The normalized channel the application is being distributed on.
  mode: NULLABLE
  name: channel
  type: STRING
- description: Mean difference in seconds between the client clock and server clock
    across subsessions, used to detect clock drift. Positive values indicate the client
    clock is ahead.
  mode: NULLABLE
  name: client_clock_skew_mean
  type: FLOAT
- description: Mean latency in seconds between when a ping was created on the client
    and when it was received by the ingestion server. Zero indicates immediate submission.
  mode: NULLABLE
  name: client_submission_latency_mean
  type: FLOAT
- description: Number of physical CPU cores available on the client's machine.
  mode: NULLABLE
  name: cpu_cores
  type: INTEGER
- description: Number of logical CPUs (including hyperthreading) available on the
    client's machine.
  mode: NULLABLE
  name: cpu_count
  type: INTEGER
- description: CPU family identifier as reported by CPUID. Family 6 corresponds to
    most modern Intel processors; family 25 corresponds to AMD Zen 3+.
  mode: NULLABLE
  name: cpu_family
  type: INTEGER
- description: Size of the CPU L2 cache in kilobytes. Common values include 256 KB
    and 512 KB for consumer processors.
  mode: NULLABLE
  name: cpu_l2_cache_kb
  type: INTEGER
- description: Size of the CPU L3 cache in kilobytes. Zero indicates no L3 cache or
    detection failure.
  mode: NULLABLE
  name: cpu_l3_cache_kb
  type: INTEGER
- description: CPU model number as reported by CPUID. Used together with cpu_family
    and cpu_stepping to identify specific processor models.
  mode: NULLABLE
  name: cpu_model
  type: INTEGER
- description: CPU clock speed in MHz as reported by the operating system. Zero indicates
    detection failure.
  mode: NULLABLE
  name: cpu_speed_mhz
  type: INTEGER
- description: CPU stepping identifier as reported by CPUID, used together with cpu_family
    and cpu_model to distinguish processor revisions.
  mode: NULLABLE
  name: cpu_stepping
  type: INTEGER
- description: CPU vendor string as reported by CPUID, e.g. 'GenuineIntel', 'AuthenticAMD',
    or 'Qualcomm Technologies Inc'.
  mode: NULLABLE
  name: cpu_vendor
  type: STRING
- description: Total number of content process crashes detected on this day. Null
    when no crashes were detected (~100% null rate in recent data).
  mode: NULLABLE
  name: crashes_detected_content_sum
  type: INTEGER
- description: Total number of Gecko Media Plugin process crashes detected on this
    day. Nearly always null.
  mode: NULLABLE
  name: crashes_detected_gmplugin_sum
  type: INTEGER
- description: Total number of plugin process crashes detected on this day. Nearly
    always null as NPAPI plugins are no longer supported.
  mode: NULLABLE
  name: crashes_detected_plugin_sum
  type: INTEGER
- description: Total number of crash report submission attempts for content process
    crashes on this day. Null when no crash reports were attempted.
  mode: NULLABLE
  name: crash_submit_attempt_content_sum
  type: INTEGER
- description: Total number of crash report submission attempts for main process crashes
    on this day. Null when no crash reports were attempted.
  mode: NULLABLE
  name: crash_submit_attempt_main_sum
  type: INTEGER
- description: Total number of crash report submission attempts for plugin process
    crashes on this day. Nearly always null.
  mode: NULLABLE
  name: crash_submit_attempt_plugin_sum
  type: INTEGER
- description: Total number of successfully submitted crash reports for content process
    crashes on this day. Null when no submission attempts occurred.
  mode: NULLABLE
  name: crash_submit_success_content_sum
  type: INTEGER
- description: Total number of successfully submitted crash reports for main process
    crashes on this day. Zero indicates attempts were made but all failed.
  mode: NULLABLE
  name: crash_submit_success_main_sum
  type: INTEGER
- description: Total number of successfully submitted crash reports for plugin process
    crashes on this day. Nearly always null.
  mode: NULLABLE
  name: crash_submit_success_plugin_sum
  type: INTEGER
- description: String identifier of the client's default search engine as set in Firefox
    preferences, e.g. 'google-b-d' or 'ddg'. Deprecated in favour of default_search_engine_data
    fields.
  mode: NULLABLE
  name: default_search_engine
  type: STRING
- description: The anonymized load path of the default search engine XML file, e.g.
    '[app]google' or '[addon]google@search.mozilla.org', indicating the engine's installation
    source.
  mode: NULLABLE
  name: default_search_engine_data_load_path
  type: STRING
- description: Human-readable name of the client's default search engine, e.g. 'Google',
    'DuckDuckGo', or 'Baidu'.
  mode: NULLABLE
  name: default_search_engine_data_name
  type: STRING
- description: 'The origin of the default search engine: ''default'' for built-in
    or partner engines, ''verified'' for user-installed engines with valid hashes,
    ''unverified'' for engines without hashes, or ''invalid'' for broken hashes. Null
    for ~91% of clients.'
  mode: NULLABLE
  name: default_search_engine_data_origin
  type: STRING
- description: The search submission URL template for the client's default search
    engine, e.g. 'https://www.google.com/search?client=firefox-b-d&q='. Not recorded
    for user-installed engines for privacy.
  mode: NULLABLE
  name: default_search_engine_data_submission_url
  type: STRING
- description: Total number of times the DevTools toolbox was opened on this day.
    Null for ~98% of clients who did not open DevTools.
  mode: NULLABLE
  name: devtools_toolbox_opened_count_sum
  type: INTEGER
- description: The distribution id associated with the install of Firefox.
  mode: NULLABLE
  name: distribution_id
  type: STRING
- description: Whether Electrolysis (multi-process Firefox) is enabled. True for nearly
    all clients since e10s became the default; false indicates legacy single-process
    mode.
  mode: NULLABLE
  name: e10s_enabled
  type: BOOLEAN
- description: The build architecture of the Firefox binary, e.g. 'x86-64', 'aarch64',
    or 'x86'.
  mode: NULLABLE
  name: env_build_arch
  type: STRING
- description: The build ID of the Firefox binary as reported in the telemetry environment,
    e.g. '20260427013024'. This is the timestamp-based build identifier.
  mode: NULLABLE
  name: env_build_id
  type: STRING
- description: The Firefox version string as reported in the telemetry environment,
    e.g. '150.0.1'. Matches app_version in this table.
  mode: NULLABLE
  name: env_build_version
  type: STRING
- description: Array of language tags from the browser's Accept-Languages setting,
    reflecting the user's preferred languages for web content.
  mode: REPEATED
  name: environment_settings_intl_accept_languages
  type: STRING
- description: Array of locale tags for which the Firefox application has localisation
    support installed.
  mode: REPEATED
  name: environment_settings_intl_app_locales
  type: STRING
- description: Array of locale tags available in the Firefox build for the client's
    localisation.
  mode: REPEATED
  name: environment_settings_intl_available_locales
  type: STRING
- description: Array of locale tags explicitly requested by the user for the Firefox
    UI.
  mode: REPEATED
  name: environment_settings_intl_requested_locales
  type: STRING
- description: Array of locale tags configured at the operating system level on the
    client's machine.
  mode: REPEATED
  name: environment_settings_intl_system_locales
  type: STRING
- description: Array of locale tags reflecting the client's regional preference settings,
    e.g. for date and number formatting.
  mode: REPEATED
  name: environment_settings_intl_regional_prefs_locales
  type: STRING
- description: Array of Normandy/Nimbus experiments the client was enrolled in during
    this day, with each entry containing an experiment key and branch value.
  fields:
  - description: null
    mode: NULLABLE
    name: key
    type: STRING
  - description: null
    mode: NULLABLE
    name: value
    type: STRING
  mode: REPEATED
  name: experiments
  type: RECORD
- description: Mean time in milliseconds from Firefox startup to first paint across
    subsessions on this day. Null for ~10% of clients where first paint was not recorded.
  mode: NULLABLE
  name: first_paint_mean
  type: FLOAT
- description: Version string of the Adobe Flash plugin installed on the client, e.g.
    '32.0.0.465'. Null for ~100% of modern clients as Flash is no longer supported.
  mode: NULLABLE
  name: flash_version
  type: STRING
- description: Name of the country in which the activity took place, as determined
    by the IP geolocation.
  mode: NULLABLE
  name: country
  type: STRING
- description: City in which the client's activity took place as determined by IP
    geolocation. Null for ~20% of clients where city-level resolution is unavailable.
  mode: NULLABLE
  name: city
  type: STRING
- description: First-level administrative subdivision of the client's location as
    determined by IP geolocation, e.g. US state code ('CA') or UK country code ('ENG').
    Null for ~4% of clients.
  mode: NULLABLE
  name: geo_subdivision1
  type: STRING
- description: Second-level administrative subdivision of the client's location as
    determined by IP geolocation, e.g. a county or district code. Null for ~85% of
    clients.
  mode: NULLABLE
  name: geo_subdivision2
  type: STRING
- description: null
  mode: NULLABLE
  name: isp_name
  type: STRING
- description: The organisation name associated with the client's IP address as determined
    by ISP lookup, typically matching isp_name.
  mode: NULLABLE
  name: isp_organization
  type: STRING
- description: Status of the Advanced Layers compositor feature on this client, e.g.
    'available', 'disabled', or a blocklist reason string. Null for ~100% of modern
    clients as this feature was replaced by WebRender.
  mode: NULLABLE
  name: gfx_features_advanced_layers_status
  type: STRING
- description: Status of the Direct2D (D2D) graphics feature on this client, e.g.
    'available', 'disabled:FEATURE_FAILURE_DISABLED', or a blocklist reason. Null
    for ~90% of non-Windows clients.
  mode: NULLABLE
  name: gfx_features_d2d_status
  type: STRING
- description: Status of the Direct3D 11 graphics feature on this client, e.g. 'available'
    or an unavailability reason string. Null for ~20% of non-Windows clients.
  mode: NULLABLE
  name: gfx_features_d3d11_status
  type: STRING
- description: Status of the GPU process feature on this client, e.g. 'available',
    'unused', 'failed', or a blocklist reason. Indicates whether Firefox renders graphics
    in a dedicated GPU process.
  mode: NULLABLE
  name: gfx_features_gpu_process_status
  type: STRING
- description: Total number of times the DevTools about:debugging panel was opened
    in the parent process on this day. Null for clients who did not open this panel.
  mode: NULLABLE
  name: histogram_parent_devtools_aboutdebugging_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Animation Inspector was opened in
    the parent process on this day. Null for clients who did not open this panel.
  mode: NULLABLE
  name: histogram_parent_devtools_animationinspector_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Browser Console was opened in the
    parent process on this day. Null for clients who did not open it.
  mode: NULLABLE
  name: histogram_parent_devtools_browserconsole_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Canvas Debugger was opened in the
    parent process on this day. Nearly always null as this tool was removed.
  mode: NULLABLE
  name: histogram_parent_devtools_canvasdebugger_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Computed View CSS panel was opened
    in the parent process on this day. Null for clients who did not open it.
  mode: NULLABLE
  name: histogram_parent_devtools_computedview_opened_count_sum
  type: INTEGER
- description: Total number of times a custom DevTools panel was opened in the parent
    process on this day. Null for clients who did not open custom panels.
  mode: NULLABLE
  name: histogram_parent_devtools_custom_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Developer Toolbar was opened in
    the parent process on this day. Always null as this toolbar was removed.
  mode: NULLABLE
  name: histogram_parent_devtools_developertoolbar_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools DOM panel was opened in the parent
    process on this day. Null for nearly all clients.
  mode: NULLABLE
  name: histogram_parent_devtools_dom_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools eyedropper color picker was opened
    via the inspector toolbar in the parent process on this day.
  mode: NULLABLE
  name: histogram_parent_devtools_eyedropper_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Font Inspector was opened in the
    parent process on this day. Null for clients who did not use it.
  mode: NULLABLE
  name: histogram_parent_devtools_fontinspector_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Inspector (HTML/CSS panel) was opened
    in the parent process on this day. Null for ~99% of non-developer clients.
  mode: NULLABLE
  name: histogram_parent_devtools_inspector_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools JavaScript Browser Debugger was
    opened in the parent process on this day. Always null in current data.
  mode: NULLABLE
  name: histogram_parent_devtools_jsbrowserdebugger_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools JavaScript Debugger was opened in
    the parent process on this day. Null for clients who did not use the debugger.
  mode: NULLABLE
  name: histogram_parent_devtools_jsdebugger_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools JavaScript Profiler was opened in
    the parent process on this day. Null for clients who did not profile.
  mode: NULLABLE
  name: histogram_parent_devtools_jsprofiler_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Layout View (box model/grid panel)
    was opened in the parent process on this day. Null for ~99% of non-developer clients.
  mode: NULLABLE
  name: histogram_parent_devtools_layoutview_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Memory panel was opened in the parent
    process on this day. Null for clients who did not use it.
  mode: NULLABLE
  name: histogram_parent_devtools_memory_opened_count_sum
  type: INTEGER
- description: Total number of times the eyedropper was opened via the DevTools menu
    in the parent process on this day.
  mode: NULLABLE
  name: histogram_parent_devtools_menu_eyedropper_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Network Monitor was opened in the
    parent process on this day. Null for clients who did not use network monitoring.
  mode: NULLABLE
  name: histogram_parent_devtools_netmonitor_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Options/Settings panel was opened
    in the parent process on this day.
  mode: NULLABLE
  name: histogram_parent_devtools_options_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools paint flashing feature was enabled
    in the parent process on this day. Always null in current data.
  mode: NULLABLE
  name: histogram_parent_devtools_paintflashing_opened_count_sum
  type: INTEGER
- description: Total number of times the eyedropper was opened via the color picker
    in DevTools in the parent process on this day.
  mode: NULLABLE
  name: histogram_parent_devtools_picker_eyedropper_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Responsive Design Mode was opened
    in the parent process on this day.
  mode: NULLABLE
  name: histogram_parent_devtools_responsive_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools CSS Rule View was opened in the
    parent process on this day. Null for ~99% of non-developer clients.
  mode: NULLABLE
  name: histogram_parent_devtools_ruleview_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Scratchpad was opened in the parent
    process on this day. Always null as the Scratchpad was removed.
  mode: NULLABLE
  name: histogram_parent_devtools_scratchpad_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Scratchpad window was opened in
    the parent process on this day. Always null as the Scratchpad was removed.
  mode: NULLABLE
  name: histogram_parent_devtools_scratchpad_window_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Shader Editor was opened in the
    parent process on this day. Always null as the Shader Editor was removed.
  mode: NULLABLE
  name: histogram_parent_devtools_shadereditor_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Storage Inspector was opened in
    the parent process on this day. Null for clients who did not use it.
  mode: NULLABLE
  name: histogram_parent_devtools_storage_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Style Editor was opened in the parent
    process on this day. Null for clients who did not use it.
  mode: NULLABLE
  name: histogram_parent_devtools_styleeditor_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Web Audio Editor was opened in the
    parent process on this day. Always null as this tool was removed.
  mode: NULLABLE
  name: histogram_parent_devtools_webaudioeditor_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools Web Console was opened in the parent
    process on this day. Null for clients who did not open the console.
  mode: NULLABLE
  name: histogram_parent_devtools_webconsole_opened_count_sum
  type: INTEGER
- description: Total number of times the DevTools WebIDE was opened in the parent
    process on this day. Always null as WebIDE was removed.
  mode: NULLABLE
  name: histogram_parent_devtools_webide_opened_count_sum
  type: INTEGER
- description: The calendar year in which Firefox was installed on this client, as
    reported by the Windows registry. Null for non-Windows clients (~20% of rows).
  mode: NULLABLE
  name: install_year
  type: INTEGER
- description: A flag indicating whether the browser is set as the default browser
    on the client side.
  mode: NULLABLE
  name: is_default_browser
  type: BOOLEAN
- description: Whether the 32-bit Firefox process is running under the WoW64 (Windows
    32-bit on Windows 64-bit) compatibility subsystem. Null for non-Windows clients.
  mode: NULLABLE
  name: is_wow64
  type: BOOLEAN
- description: Set of language- and/or country-based preferences for a user interface.
  mode: NULLABLE
  name: locale
  type: STRING
- description: Total RAM available on the client's machine in megabytes, e.g. 8192
    for 8 GB.
  mode: NULLABLE
  name: memory_mb
  type: INTEGER
- description: The normalized channel the application is being distributed on.
  mode: NULLABLE
  name: normalized_channel
  type: STRING
- description: The normalized version of the operating system, e.g. '10.0' for Windows
    10, '6.1' for Windows 7, or a macOS/Linux kernel version string.
  mode: NULLABLE
  name: normalized_os_version
  type: STRING
- description: The normalized name of the operating system running at the client.
  mode: NULLABLE
  name: os
  type: STRING
- description: The major version of the Windows service pack installed on the client.
    Zero for most modern Windows systems; null for non-Windows clients.
  mode: NULLABLE
  name: os_service_pack_major
  type: INTEGER
- description: The minor version of the Windows service pack installed on the client.
    Null for non-Windows clients; almost always 0 on Windows.
  mode: NULLABLE
  name: os_service_pack_minor
  type: INTEGER
- description: The raw operating system version string, e.g. '10.0' for Windows 10
    or '25.3.0' for macOS. May include distribution suffixes on Linux.
  mode: NULLABLE
  name: os_version
  type: STRING
- description: The number of telemetry subsession pings that were aggregated to produce
    this row. Values greater than 1 indicate multiple subsessions on the same day.
  mode: NULLABLE
  name: pings_aggregated_by_this_row
  type: INTEGER
- description: Mean number of bookmarks in the client's Firefox Places database across
    subsessions on this day. Null for ~36% of clients where Places data was not reported.
  mode: NULLABLE
  name: places_bookmarks_count_mean
  type: FLOAT
- description: Mean number of pages in the client's Firefox browsing history (Places
    database) across subsessions on this day. Null for ~36% of clients.
  mode: NULLABLE
  name: places_pages_count_mean
  type: FLOAT
- description: Total number of plugin process hangs detected on this day. Nearly always
    null as NPAPI plugins are no longer supported.
  mode: NULLABLE
