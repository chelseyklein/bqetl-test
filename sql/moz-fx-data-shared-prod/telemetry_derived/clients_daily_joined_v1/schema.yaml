- name: startup_profile_selection_reason_first
  type: STRING
  mode: NULLABLE
  description: The reason a profile was selected at startup, taken from the first
    ping received on the submission date. Common values include 'default' (the default
    profile was used automatically), 'profile-selector' (user chose via the profile
    manager), 'firstrun-created-default' (first run created a new default profile),
    and 'restart' (profile was reused from a previous session).
- name: first_document_id
  type: STRING
  mode: NULLABLE
  description: The UUID document ID of the first telemetry ping received from this
    client on the submission date, used to identify the earliest ping for deduplication
    and ordering purposes.
- name: partner_id
  type: STRING
  mode: NULLABLE
  description: The partner ID associated with the Firefox distribution, read from
    the mozilla.partner.id preference. Null for standard Mozilla builds; populated
    for partner distributions such as 'ubuntu', 'mozillaonline', or 'mint'.
- name: distribution_version
  type: STRING
  mode: NULLABLE
  description: The version of the Firefox distribution package, read from the distribution.version
    preference. Null for ~84% of clients on standard Mozilla builds; populated for
    partner or OEM distributions.
- name: distributor
  type: STRING
  mode: NULLABLE
  description: The name of the Firefox distributor, read from the app.distributor
    preference. Null for ~93% of clients on standard Mozilla builds; populated for
    partner distributions such as 'canonical', 'mozillaonline', or 'mint'.
- name: distributor_channel
  type: STRING
  mode: NULLABLE
  description: The distribution channel name, read from the app.distributor.channel
    preference. Null for ~93% of clients on standard Mozilla builds; populated for
    partner distributions with values such as 'ubuntu' or 'mainWinStub'.
- name: env_build_platform_version
  type: STRING
  mode: NULLABLE
  description: The platform (Gecko) version string of the Firefox build, such as '150.0.1'.
    Present for all clients and reflects the exact release version running at the
    time of submission.
- name: env_build_xpcom_abi
  type: STRING
  mode: NULLABLE
  description: The XPCOM ABI identifier for the Firefox build, encoding CPU architecture
    and compiler toolkit, such as 'x86_64-msvc' (64-bit Windows) or 'aarch64-gcc3'
    (ARM64 Linux/Mac). Present for all clients.
- name: geo_db_version
  type: STRING
  mode: NULLABLE
  description: The version timestamp of the GeoIP database used to resolve the client's
    country and region at time of submission. Present for all clients; typically changes
    at most a few times per week.
- name: apple_model_id
  type: STRING
  mode: NULLABLE
  description: The Apple hardware model identifier for macOS clients, such as 'MacBookAir10,1'
    or 'Mac14,2'. Null for ~87% of clients running on non-Apple hardware.
- name: max_subsession_counter
  type: INTEGER
  mode: NULLABLE
  description: The highest subsession counter value seen across all pings received
    from this client on the submission date, reflecting how many subsessions the browser
    accumulated in total up to the last reported ping.
- name: min_subsession_counter
  type: INTEGER
  mode: NULLABLE
  description: The lowest subsession counter value seen across all pings received
    from this client on the submission date, typically 1 for clients whose first ping
    of the day starts a new subsession sequence.
- name: startup_profile_selection_first_ping_only
  type: STRING
  mode: NULLABLE
  description: The reason a profile was selected at startup, restricted to pings sent
    from the very first session of the day. Common values mirror startup_profile_selection_reason_first
    and include 'default', 'profile-selector', 'restart', and 'firstrun-created-default'.
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the profile group, not shared with other
    telemetry data.
- name: browser_backup_scheduler_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: 'The value of payload.processes.parent.scalars.browser_backup_scheduler_enabled
    most frequently seen on the submission date.

    If there is a tie, the value seen last according to submission_timestamp.

    True if the BackupService is configured to automatically create backups in the
    background.'
- name: browser_backup_archive_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: True if the user can create backups, i.e. it has not been disabled
    by a pref or otherwise deemed incompatible.
