  description: Sum of error events recorded by the text recognition feature in the
    browser UI during the day. This field is null for nearly all clients, indicating
    text recognition errors are rare.
- mode: NULLABLE
  name: text_recognition_interaction_timing_sum
  type: INTEGER
  description: Sum of interaction timing durations (in milliseconds) for text recognition
    UI interactions across all sessions on the submission date. Null for nearly all
    clients as text recognition usage is rare.
- mode: NULLABLE
  name: text_recognition_interaction_timing_count_sum
  type: INTEGER
  description: Sum of the count of individual text recognition interaction timing
    observations recorded on the submission date, used as the denominator when computing
    average interaction timing. Null for nearly all clients.
