    feature across all sessions on the submission date. Null for nearly all clients
    as text recognition usage is rare.
- mode: NULLABLE
  name: text_recognition_text_length_count_sum
  type: INTEGER
  description: Sum of the count of individual text recognition text-length observations
    on the submission date, used as the denominator when computing average recognized
    text length. Null for nearly all clients.
- mode: NULLABLE
  name: places_searchbar_cumulative_searches_sum
  type: INTEGER
  description: Cumulative number of searches performed via the Places search bar (Library
    window search) on the submission date. Null in ~99.9% of rows for clients who
    did not use the Places search bar.
- mode: NULLABLE
  name: places_searchbar_cumulative_filter_count_sum
  type: INTEGER
  description: Cumulative number of filter operations applied in the Places search
    bar (Library window search) on the submission date. Null in ~99.9% of rows for
    clients who did not use the Places search bar.
- mode: NULLABLE
  name: scalar_parent_os_environment_launched_via_taskbar_private
  type: BOOLEAN
  description: True if Firefox was launched at least once via a private-browsing taskbar
    shortcut on the submission date; false otherwise. Present for all clients (no
    nulls).
- mode: NULLABLE
  name: dom_parentprocess_private_window_used
  type: BOOLEAN
  description: True if a private browsing window was opened in the parent process
    at least once on the submission date; false otherwise. Approximately 6% of clients
    have this set to true.
- mode: NULLABLE
  name: os_environment_is_taskbar_pinned_any
  type: BOOLEAN
  description: True if Firefox is pinned to the Windows taskbar in any configuration
    (normal or private) on the submission date; false otherwise. Present for all clients
    with roughly equal split between true and false.
- mode: NULLABLE
  name: os_environment_is_taskbar_pinned_private_any
  type: BOOLEAN
  description: True if a Firefox private-browsing shortcut is pinned to the Windows
    taskbar in any form on the submission date; false otherwise. Present for all clients;
    approximately 1.5% of clients have this as true.
- mode: NULLABLE
  name: os_environment_is_taskbar_pinned_private
  type: BOOLEAN
  description: True if a dedicated Firefox private-browsing shortcut is pinned to
    the Windows taskbar on the submission date; false otherwise. Present for all clients;
    approximately 1.3% of clients have this as true.
