- name: startup_profile_selection_reason_first
  type: STRING
  mode: NULLABLE
  description: The profile selection reason from the first ping of the session (e.g.
    'default', 'firstrun-created-default', 'profile-selector'). Null if not reported.
- name: first_document_id
  type: STRING
  mode: NULLABLE
  description: The document ID of the first ping received from this client on the
    submission date.
- name: partner_id
  type: STRING
  mode: NULLABLE
  description: The Firefox distribution partner ID (e.g. 'ubuntu', 'mint', 'mozillaonline').
    Null for non-distribution installs (sampled 2026-05-29).
- name: distribution_version
  type: STRING
  mode: NULLABLE
  description: Version string of the partner distribution package (e.g. '1.0', '2023.6').
    Null for non-distribution installs (sampled 2026-05-29).
- name: distributor
  type: STRING
  mode: NULLABLE
  description: Name of the Firefox distribution partner or channel (e.g. 'canonical',
    'mozillaonline', 'mint'). Null for direct installs (sampled 2026-05-29).
- name: distributor_channel
  type: STRING
  mode: NULLABLE
  description: The specific distribution channel within the distributor's system (e.g.
    'ubuntu', 'firefox', 'mainWinStub'). Null for direct installs (sampled 2026-05-29).
- name: env_build_platform_version
  type: STRING
  mode: NULLABLE
  description: The XULRunner platform version bundled with Firefox (typically matches
    app_version).
- name: env_build_xpcom_abi
  type: STRING
  mode: NULLABLE
  description: Binary ABI identifier for the Firefox build (e.g. 'x86_64-msvc', 'x86_64-gcc3',
    'aarch64-gcc3').
- name: geo_db_version
  type: STRING
  mode: NULLABLE
  description: Version timestamp of the GeoIP database used for geolocation lookup
    (e.g. '2026-05-21T07:51:11Z').
- name: apple_model_id
  type: STRING
  mode: NULLABLE
  description: Apple hardware model identifier for macOS clients (e.g. 'MacBookAir10,1',
    'Mac14,2'). Null for non-Apple devices (sampled 2026-05-29).
- name: max_subsession_counter
  type: INTEGER
  mode: NULLABLE
  description: Maximum subsession counter value across all pings aggregated for this
    client on the submission date.
- name: min_subsession_counter
  type: INTEGER
  mode: NULLABLE
  description: Minimum subsession counter value across all pings aggregated for this
    client on the submission date, typically 1 for the first subsession.
- name: startup_profile_selection_first_ping_only
  type: STRING
  mode: NULLABLE
  description: Profile selection reason from the first ping only, similar to startup_profile_selection_reason_first
    but may differ if multiple pings are aggregated.
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the profile group, not shared with other
    telemetry data.
- name: browser_backup_scheduler_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: 'The value of payload.processes.parent.scalars.browser_backup_scheduler_enabled
    most frequently seen on the submission date.

    If there is a tie, the value seen last according to submission_timestamp.

    True if the BackupService is configured to automatically create backups in the
    background.'
- name: browser_backup_archive_enabled
  type: BOOLEAN
  mode: NULLABLE
  description: True if the user can create backups, i.e. it has not been disabled
    by a pref or otherwise deemed incompatible.
