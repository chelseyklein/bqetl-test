fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: A number, 0-99, that samples by client_id and allows filtering data
    for analysis. It is a pipeline-generated artifact that should match between pings.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: normalized_channel
  type: STRING
  mode: NULLABLE
  description: The normalized channel the application is being distributed on.
- name: app_version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
- name: locale
  type: STRING
  mode: NULLABLE
  description: Set of language- and/or country-based preferences for a user interface.
- name: n_self_installed_addons
  type: INTEGER
  mode: NULLABLE
  description: Number of add-ons that the user manually installed (not system, shield,
    or foreign-installed) as of the submission date.
- name: n_shield_addons
  type: INTEGER
  mode: NULLABLE
  description: Number of Shield study add-ons active in the client's profile on the
    submission date.
- name: n_foreign_installed_addons
  type: INTEGER
  mode: NULLABLE
  description: Number of add-ons installed by an external process or third-party software
    (foreign-installed), not by the user directly.
- name: n_system_addons
  type: INTEGER
  mode: NULLABLE
  description: Number of system (built-in) add-ons active in the client's profile
    on the submission date.
- name: n_web_extensions
  type: INTEGER
  mode: NULLABLE
  description: Number of WebExtension add-ons (as opposed to legacy XUL/XPCOM extensions)
    active in the client's profile.
- name: first_addon_install_date
  type: STRING
  mode: NULLABLE
  description: Date string (YYYYMMDD) of the earliest add-on installation in the client's
    profile. Null if no add-ons have been installed (sampled 2026-06-02).
- name: profile_creation_date
  type: STRING
  mode: NULLABLE
  description: Date string (YYYYMMDD) when the Firefox profile was created.
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the profile group, not shared with other
    telemetry data.
