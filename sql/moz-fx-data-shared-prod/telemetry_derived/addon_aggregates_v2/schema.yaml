fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: A number, 0-99, that samples by client_id and allows filtering data
    for analysis. It is a pipeline-generated artifact that should match between pings.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: normalized_channel
  type: STRING
  mode: NULLABLE
  description: The normalized channel the application is being distributed on.
- name: app_version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
- name: locale
  type: STRING
  mode: NULLABLE
  description: Set of language- and/or country-based preferences for a user interface.
- name: n_self_installed_addons
  type: INTEGER
  mode: NULLABLE
  description: The count of add-ons that the user explicitly installed themselves,
    excluding system add-ons, foreign-installed add-ons, and Mozilla-internal add-ons.
- name: n_shield_addons
  type: INTEGER
  mode: NULLABLE
  description: The count of active Shield study add-ons installed on the client, identified
    by add-on IDs containing '@shield.mozilla'.
- name: n_foreign_installed_addons
  type: INTEGER
  mode: NULLABLE
  description: The count of add-ons that were installed by an external program rather
    than by the user directly, as indicated by the foreign_install flag.
- name: n_system_addons
  type: INTEGER
  mode: NULLABLE
  description: The count of system add-ons installed on the client, which are bundled
    or automatically distributed by Firefox rather than user-installed.
- name: n_web_extensions
  type: INTEGER
  mode: NULLABLE
  description: The count of active WebExtension-type add-ons installed on the client.
- name: first_addon_install_date
  type: STRING
  mode: NULLABLE
  description: The date when the client's first self-installed add-on was installed,
    formatted as YYYYMMDD. Null (~57% of rows) when the client has no self-installed
    add-ons.
- name: profile_creation_date
  type: STRING
  mode: NULLABLE
  description: The date when the Firefox profile was created, formatted as YYYYMMDD,
    derived from the environment profile creation date (days since epoch).
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the profile group, not shared with other
    telemetry data.
