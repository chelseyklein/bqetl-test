fields:
- mode: NULLABLE
  name: submission_date
  type: DATE
  description: The date when the telemetry ping is received on the server side.
- mode: NULLABLE
  name: usage
  type: STRING
  description: Type of new-profile event tracked in this row (e.g., 'New Firefox Desktop
    Profile Created', 'New Fenix Profile Created', 'New Firefox Account Registered').
- mode: NULLABLE
  name: new_profiles
  type: INTEGER
  description: Count of new profiles created matching the usage type and dimension
    combination on this submission_date.
- mode: NULLABLE
  name: id_bucket
  type: INTEGER
  description: Client ID bucket (0–19) used for partitioned computation.
- mode: NULLABLE
  name: app_name
  type: STRING
  description: The name of the browser application (e.g., 'Firefox', 'Fenix', 'Firefox
    iOS').
- mode: NULLABLE
  name: app_version
  type: STRING
  description: User visible version string (e.g. "1.0.3") for the browser.
- mode: NULLABLE
  name: country
  type: STRING
  description: An ISO 3166-1 alpha-2 country code
- mode: NULLABLE
  name: locale
  type: STRING
  description: Set of language- and/or country-based preferences for a user interface.
- mode: NULLABLE
  name: os
  type: STRING
  description: The normalized name of the operating system running at the client.
- mode: NULLABLE
  name: os_version
  type: STRING
  description: The version string of the operating system (e.g., '10.0' for Windows
    10).
- mode: NULLABLE
  name: channel
  type: STRING
  description: The normalized channel the application is being distributed on.
- mode: NULLABLE
  name: attributed
  type: BOOLEAN
  description: True if the new profile has attribution data; false otherwise. Null
    for Firefox Account registrations.
