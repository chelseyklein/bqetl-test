fields:
- mode: NULLABLE
  name: submission_date
  type: DATE
  description: The date when the telemetry ping is received on the server side.
- mode: NULLABLE
  name: app_version
  type: INTEGER
  description: The major version number of Firefox used by clients in this cohort,
    e.g. 151 for Firefox 151.x.
- mode: NULLABLE
  name: country
  type: STRING
  description: Two-letter ISO 3166-1 alpha-2 country code for the country in which
    the activity took place, as determined by IP geolocation.
- mode: NULLABLE
  name: normalized_os
  type: STRING
  description: The normalized name of the operating system running at the client,
    e.g. 'Windows', 'Mac', 'Linux'.
- mode: NULLABLE
  name: channel
  type: STRING
  description: The Firefox release channel the client is on, e.g. 'release', 'esr',
    'beta', 'nightly'.
- mode: NULLABLE
  name: locale
  type: STRING
  description: The locale of the Firefox application during initialization (e.g. 'en-US',
    'de', 'fr').
- mode: NULLABLE
  name: profile_creation_month
  type: DATE
  description: The calendar month (truncated to the first day) when the Firefox profile
    was created, derived from the profile creation date.
- mode: NULLABLE
  name: default_search_engine
  type: STRING
  description: The normalized default search engine name for clients in this cohort,
    e.g. 'Google', 'DuckDuckGo', 'Bing', 'Other'.
- mode: NULLABLE
  name: is_default_browser
  type: BOOLEAN
- mode: NULLABLE
  name: is_sap_monetizable
  type: BOOLEAN
- mode: NULLABLE
  name: has_adblocker_addon
  type: BOOLEAN
- mode: NULLABLE
  name: policies_is_enterprise
  type: BOOLEAN
- mode: NULLABLE
  name: stories_enabled
  type: BOOLEAN
- mode: NULLABLE
  name: sponsored_stories_enabled
  type: BOOLEAN
- mode: NULLABLE
  name: topsites_enabled
  type: BOOLEAN
- mode: NULLABLE
  name: sponsored_topsites_enabled
  type: BOOLEAN
- mode: NULLABLE
  name: topic_preferences_set
  type: BOOLEAN
- mode: NULLABLE
  name: client_count
  type: INTEGER
- mode: NULLABLE
  name: clients_with_newtab_and_search_activity
  type: INTEGER
- mode: NULLABLE
  name: clients_with_ad_engagement
  type: INTEGER
- mode: NULLABLE
  name: clients_with_search_ad_engagement
  type: INTEGER
- mode: NULLABLE
  name: clients_with_newtab_ad_engagement
  type: INTEGER
- mode: NULLABLE
  name: subsession_hours_sum_total
  type: FLOAT
- mode: REPEATED
  name: subsession_hours_sum_histogram
  type: FLOAT
  description: Histogram of total browser subsession hours per client across cohort
    members on this date, with one bucket per predefined percentile threshold (99
    buckets using APPROX_QUANTILES).
- mode: NULLABLE
  name: sessions_started_on_this_day_total
  type: INTEGER
- mode: REPEATED
  name: sessions_started_on_this_day_histogram
  type: INTEGER
  description: Histogram of the count of browser sessions started per client on this
    submission_date across cohort members, with one bucket per predefined percentile
    threshold.
- mode: REPEATED
  name: active_addons_count_mean_histogram
  type: FLOAT
  description: Histogram of the mean active add-on count per client across cohort
    members on this date, with one bucket per predefined percentile threshold.
- mode: REPEATED
  name: max_concurrent_tab_count_max_histogram
  type: INTEGER
  description: Histogram of the maximum concurrent tab count per client across cohort
    members on this date, with one bucket per predefined percentile threshold.
- mode: REPEATED
  name: active_hours_sum_histogram
  type: FLOAT
  description: Histogram of total active browsing hours per client across cohort members
    on this date, with one bucket per predefined percentile threshold.
- mode: REPEATED
  name: total_uri_count_histogram
  type: INTEGER
  description: Histogram of total URI count per client across cohort members on this
    date, with one bucket per predefined percentile threshold.
- mode: NULLABLE
  name: organic_sum
  type: INTEGER
- mode: REPEATED
  name: organic_histogram
  type: INTEGER
  description: Histogram of organic search counts per client across cohort members
    on this date, with one bucket per predefined percentile threshold.
- mode: NULLABLE
  name: tagged_sap_sum
  type: INTEGER
- mode: REPEATED
  name: tagged_sap_histogram
  type: INTEGER
  description: Histogram of tagged search access point (SAP) search counts per client
