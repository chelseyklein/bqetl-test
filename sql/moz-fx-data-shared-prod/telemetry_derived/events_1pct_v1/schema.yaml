- name: browser_version_info
  type: RECORD
  mode: NULLABLE
  description: Parsed components of the Firefox browser version string, providing structured access to major,
    minor, and patch version numbers.
  fields:
  - name: is_major_release
    type: BOOLEAN
    mode: NULLABLE
    description: True if this Firefox version is a major release (i.e., the patch revision is 0), false if
      it is a dot release.
  - name: major_version
    type: NUMERIC
    mode: NULLABLE
    description: The major version number of the Firefox browser (e.g., 151 for version '151.0.4').
  - name: minor_version
    type: NUMERIC
    mode: NULLABLE
    description: The minor version number of the Firefox browser (e.g., 0 for version '151.0.4').
  - name: patch_revision
    type: NUMERIC
    mode: NULLABLE
    description: The patch or revision number of the Firefox browser version (e.g., 4 for version '151.0.4').
  - name: version
    type: STRING
    mode: NULLABLE
    description: The full version string of the Firefox browser (e.g., '151.0.4'), as extracted from the app_version
      field.
