fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: A number, 0-99, that samples by client_id and allows filtering data
    for analysis. It is a pipeline-generated artifact that should match between pings.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: n_logged_event
  type: INTEGER
  mode: NULLABLE
  description: The total number of telemetry events logged by the client on the submission
    date, sourced from the legacy telemetry events table. Clients logging more than
    10 million events per day are excluded as overactive.
- name: n_created_pictureinpicture
  type: INTEGER
  mode: NULLABLE
  description: The count of Picture-in-Picture windows created by the client on the
    submission date, derived from events where event_category is 'pictureinpicture'
    and event_method is 'create'.
- name: n_viewed_protection_report
  type: INTEGER
  mode: NULLABLE
  description: The count of times the client viewed the Firefox Privacy Protections
    report on the submission date, derived from events where event_category is 'security.ui.protections'
    and event_object is 'protection_report'. Most clients show 0 on any given day.
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the profile group, not shared with other
    telemetry data.
