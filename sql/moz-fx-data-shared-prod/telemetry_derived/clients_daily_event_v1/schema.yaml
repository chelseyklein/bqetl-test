fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: A number, 0-99, that samples by client_id and allows filtering data
    for analysis. It is a pipeline-generated artifact that should match between pings.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: n_logged_event
  type: INTEGER
  mode: NULLABLE
  description: Total count of all telemetry events logged by this client on the submission_date,
    excluding overactive clients (>10 million events).
- name: n_created_pictureinpicture
  type: INTEGER
  mode: NULLABLE
  description: Count of Picture-in-Picture windows created by this client on the submission_date
    (event_category='pictureinpicture', event_method='create').
- name: n_viewed_protection_report
  type: INTEGER
  mode: NULLABLE
  description: Count of times this client viewed the Privacy Protections report on
    the submission_date (event_category='security.ui.protections', event_object='protection_report').
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: A UUID uniquely identifying the profile group, not shared with other
    telemetry data.
