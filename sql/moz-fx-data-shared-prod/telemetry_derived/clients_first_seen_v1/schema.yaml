- mode: NULLABLE
  name: first_paint_mean
  type: FLOAT
  description: Mean time in milliseconds from session start to first paint across
    sessions on the first seen date, measuring initial rendering performance (sampled
    2026-05-29).
- mode: NULLABLE
  name: flash_version
  type: STRING
  description: The version of Adobe Flash Player installed, if any; null for nearly
    all clients as Flash has been discontinued (sampled 2026-05-29).
- mode: NULLABLE
  name: country
  type: STRING
  description: The ISO 3166-1 alpha-2 country code of the client, determined by IP
    geolocation at the time of first seen ping (sampled 2026-05-29).
- mode: NULLABLE
  name: city
  type: STRING
  description: The city retrieved by geographic lookup based on the client's IP address
    at the time of the first seen ping (sampled 2026-05-29).
- mode: NULLABLE
  name: geo_subdivision1
  type: STRING
  description: The first major country subdivision (e.g. state, province) from IP
    geolocation at first seen; null for ~7% of clients (sampled 2026-05-29).
- mode: NULLABLE
  name: geo_subdivision2
  type: STRING
  description: The second-level geographic subdivision (e.g. county or district) from
    IP geolocation at first seen; null for ~82% of clients (sampled 2026-05-29).
- mode: NULLABLE
  name: isp_name
  type: STRING
  description: The name of the internet service provider associated with the client's
    IP address at first seen (sampled 2026-05-29).
- mode: NULLABLE
  name: isp_organization
  type: STRING
  description: The organization name associated with the client's IP address at first
    seen, which may differ from isp_name for corporate networks (sampled 2026-05-29).
- mode: NULLABLE
  name: gfx_features_advanced_layers_status
  type: STRING
  description: The status of the Advanced Layers graphics feature (e.g. 'available',
    'disabled', 'blocked'); null for ~98% of clients where this feature was not evaluated
    (sampled 2026-05-29).
- mode: NULLABLE
  name: gfx_features_d2d_status
  type: STRING
  description: The status of the Direct2D hardware acceleration feature on Windows
    (e.g. 'available', 'disabled', 'blocked'); null for non-Windows clients (sampled
    2026-05-29).
- mode: NULLABLE
  name: gfx_features_d3d11_status
  type: STRING
  description: The status of the Direct3D 11 hardware acceleration feature on Windows
    (e.g. 'available', 'blocked', 'failed'); null for non-Windows clients (sampled
    2026-05-29).
- mode: NULLABLE
  name: gfx_features_gpu_process_status
  type: STRING
  description: The status of the GPU process feature (e.g. 'available', 'unused',
    'unavailable') on the first seen date; indicates whether Firefox uses a separate
    GPU process for rendering (sampled 2026-05-29).
