fields:
- mode: NULLABLE
  name: first_seen_date
  type: DATE
  description: Date when the server first received a ping from this client.
- mode: NULLABLE
  name: second_seen_date
  type: DATE
  description: The second date on which the server received a ping from this client;
    null if the client has only been seen once (sampled 2026-05-29).
- mode: NULLABLE
  name: client_id
  type: STRING
  description: A unique identifier (UUID) for the client installation.
- mode: NULLABLE
  name: aborts_content_sum
  type: INTEGER
  description: Total number of content-process abort events in the first session;
    null for the vast majority of clients (97.6% null rate) where no content aborts
    occurred (sampled 2026-05-29).
- mode: NULLABLE
  name: aborts_gmplugin_sum
  type: INTEGER
  description: Total number of Gecko Media Plugin (GMP) process abort events in the
    first session; nearly always null as GMP plugin aborts are very rare.
- mode: NULLABLE
  name: aborts_plugin_sum
  type: INTEGER
  description: Total number of NPAPI plugin process abort events in the first session;
    always null in current data as NPAPI plugin support has been removed.
- mode: NULLABLE
  name: active_addons_count_mean
  type: FLOAT
  description: Mean number of active add-ons across sessions on the first seen date
    (sampled 2026-05-29).
