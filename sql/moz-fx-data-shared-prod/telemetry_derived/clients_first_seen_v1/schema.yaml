  name: active_addons
  type: RECORD
  description: null
- mode: NULLABLE
  name: active_experiment_branch
  type: STRING
  description: The branch of a Normandy experiment the client was enrolled in on first
    seen date; null when no experiment was active.
- mode: NULLABLE
  name: active_experiment_id
  type: STRING
  description: The ID of the Normandy experiment the client was enrolled in on first
    seen date; null when no experiment was active.
- mode: NULLABLE
  name: active_hours_sum
  type: FLOAT
  description: Total number of hours the browser was actively used on the first seen
    date, as measured by user interaction events (sampled 2026-05-29).
- mode: NULLABLE
  name: addon_compatibility_check_enabled
  type: BOOLEAN
  description: Whether add-on compatibility checking was enabled in the browser on
    the first seen date; true for all sampled clients (sampled 2026-05-29).
- mode: NULLABLE
  name: app_build_id
  type: STRING
  description: The build ID of the Firefox application reported on first seen date,
    in YYYYMMDDHHMMSS format (sampled 2026-05-29).
- mode: NULLABLE
  name: app_display_version
  type: STRING
  description: The user-visible version string of the Firefox application, which may
    include a suffix such as 'esr' (e.g. '140.11.0esr') (sampled 2026-05-29).
- mode: NULLABLE
  name: app_name
  type: STRING
  description: The name of the browser application; always 'Firefox' in this table
    (sampled 2026-05-29).
- mode: NULLABLE
  name: app_version
  type: STRING
  description: The version string of the Firefox application on the first seen date
    (e.g. '151.0.1') (sampled 2026-05-29).
- fields:
  - mode: NULLABLE
    name: source
    type: STRING
    description: The referring domain or partner from which Firefox was downloaded
      (e.g. 'www.google.com', 'www.bing.com'); null when attribution is not available
      (sampled 2026-05-29).
  - mode: NULLABLE
    name: medium
    type: STRING
    description: The traffic medium through which the Firefox installer was delivered
      (e.g. 'referral', 'paidsearch'); null when attribution is not available (sampled
      2026-05-29).
  - mode: NULLABLE
    name: campaign
    type: STRING
    description: The name of the marketing campaign associated with the Firefox download;
      null when attribution is not available (sampled 2026-05-29).
  - mode: NULLABLE
    name: content
    type: STRING
    description: The specific content element within a campaign that led to the Firefox
      download (e.g. a specific banner or link); null when attribution is not available
      (sampled 2026-05-29).
  - mode: NULLABLE
    name: experiment
    type: STRING
    description: The funnel experiment parameter associated with the Firefox download
      attribution; null when attribution is unavailable (sampled 2026-05-29).
  - mode: NULLABLE
    name: variation
    type: STRING
    description: The variation parameter of the funnel experiment associated with
      the Firefox download attribution; null when attribution is unavailable (sampled
      2026-05-29).
  - mode: NULLABLE
    name: dltoken
    type: STRING
    description: A unique token assigned at Firefox download time, used to correlate
      the install with a specific download event; null when attribution is unavailable
      (sampled 2026-05-29).
  - name: dlsource
    type: STRING
    mode: NULLABLE
    description: The download source identifier indicating which Mozilla property
      or partner served the installer (e.g. 'mozillaci', 'fxdotcom', 'mozorg') (sampled
      2026-05-29).
  - name: ua
    type: STRING
    mode: NULLABLE
    description: The web browser (user-agent) that was used to download the Firefox
      installer (e.g. 'chrome', 'edge', 'firefox'); null when attribution is unavailable
      (sampled 2026-05-29).
  mode: NULLABLE
  name: attribution
  type: RECORD
  description: null
- mode: NULLABLE
  name: blocklist_enabled
  type: BOOLEAN
  description: Whether Firefox's blocklist (used to block malicious add-ons and plugins)
    was enabled on the first seen date (sampled 2026-05-29).
- mode: NULLABLE
  name: channel
  type: STRING
  description: The Firefox update channel as reported by the client (e.g. 'release',
    'beta', 'nightly', 'esr'); may differ from normalized_channel for unrecognized
    values (sampled 2026-05-29).
- mode: NULLABLE
  name: client_clock_skew_mean
  type: FLOAT
  description: Mean difference in seconds between the client's clock and server time
    on the first seen date; values near 0 indicate accurate client clocks (sampled
    2026-05-29).
- mode: NULLABLE
  name: client_submission_latency_mean
  type: FLOAT
  description: Mean latency in seconds between when the client generated the ping
    and when the server received it on the first seen date; 0 indicates near-instant
    submission (sampled 2026-05-29).
- mode: NULLABLE
  name: cpu_cores
  type: INTEGER
  description: Number of physical CPU cores reported by the client on the first seen
    date (sampled 2026-05-29).
- mode: NULLABLE
  name: cpu_count
  type: INTEGER
  description: Total number of logical CPU processors (including hyperthreads) reported
    by the client on the first seen date (sampled 2026-05-29).
- mode: NULLABLE
  name: cpu_family
  type: INTEGER
  description: The CPU family identifier as reported by the CPUID instruction (e.g.
    6 = Intel Core, 25 = AMD Zen) on the first seen date (sampled 2026-05-29).
- mode: NULLABLE
  name: cpu_l2_cache_kb
  type: INTEGER
  description: Size of the CPU L2 cache in kilobytes on the first seen date (sampled
    2026-05-29).
- mode: NULLABLE
  name: cpu_l3_cache_kb
  type: INTEGER
  description: Size of the CPU L3 cache in kilobytes on the first seen date; 0 indicates
    no L3 cache or unavailable data (sampled 2026-05-29).
- mode: NULLABLE
  name: cpu_model
  type: INTEGER
  description: The CPU model identifier from the CPUID instruction on the first seen
    date (sampled 2026-05-29).
- mode: NULLABLE
  name: cpu_speed_mhz
  type: INTEGER
  description: The CPU clock speed in MHz on the first seen date; 0 may indicate the
    value was unavailable (sampled 2026-05-29).
- mode: NULLABLE
  name: cpu_stepping
  type: INTEGER
  description: The CPU stepping (revision) identifier from the CPUID instruction on
    the first seen date (sampled 2026-05-29).
- mode: NULLABLE
  name: cpu_vendor
  type: STRING
  description: The CPU vendor string as reported by the CPUID instruction (e.g. 'GenuineIntel',
    'AuthenticAMD', 'ARM') on the first seen date (sampled 2026-05-29).
- mode: NULLABLE
  name: crashes_detected_content_sum
  type: INTEGER
  description: Total number of content-process crashes detected during the first session;
    null for nearly all clients as content crashes are very rare (sampled 2026-05-29).
- mode: NULLABLE
  name: crashes_detected_gmplugin_sum
  type: INTEGER
  description: Total number of Gecko Media Plugin crashes detected during the first
    session; almost always null (sampled 2026-05-29).
- mode: NULLABLE
  name: crashes_detected_plugin_sum
  type: INTEGER
  description: Total number of NPAPI plugin crashes detected during the first session;
    always null as NPAPI plugins are no longer supported.
- mode: NULLABLE
  name: crash_submit_attempt_content_sum
  type: INTEGER
  description: Total number of crash report submission attempts for content-process
    crashes during the first session (sampled 2026-05-29).
- mode: NULLABLE
  name: crash_submit_attempt_main_sum
  type: INTEGER
  description: Total number of crash report submission attempts for main-process crashes
    during the first session (sampled 2026-05-29).
- mode: NULLABLE
  name: crash_submit_attempt_plugin_sum
  type: INTEGER
  description: Total number of crash report submission attempts for NPAPI plugin crashes
    during the first session; always null as NPAPI plugins are no longer supported.
- mode: NULLABLE
  name: crash_submit_success_content_sum
  type: INTEGER
  description: Total number of successfully submitted crash reports for content-process
    crashes during the first session (sampled 2026-05-29).
- mode: NULLABLE
  name: crash_submit_success_main_sum
  type: INTEGER
  description: Total number of successfully submitted crash reports for main-process
    crashes during the first session (sampled 2026-05-29).
- mode: NULLABLE
  name: crash_submit_success_plugin_sum
  type: INTEGER
  description: Total number of successfully submitted crash reports for NPAPI plugin
    crashes; always null as NPAPI plugins are no longer supported.
- mode: NULLABLE
  name: default_search_engine
  type: STRING
  description: The internal identifier of the client's default search engine on the
    first seen date (e.g. 'google-b-d', 'baidu') (sampled 2026-05-29).
- mode: NULLABLE
  name: default_search_engine_data_load_path
  type: STRING
  description: The load path of the default search engine configuration, indicating
    whether it was bundled with the app, an add-on, or installed via another method
    (sampled 2026-05-29).
- mode: NULLABLE
  name: default_search_engine_data_name
  type: STRING
  description: The human-readable name of the client's default search engine on the
    first seen date (e.g. 'Google', 'DuckDuckGo') (sampled 2026-05-29).
- mode: NULLABLE
  name: default_search_engine_data_origin
  type: STRING
  description: 'The origin of the default search engine configuration: ''default''
    for built-in engines, ''verified'' for user-installed with valid hash, ''unverified''
    otherwise; null if not reported (sampled 2026-05-29).'
- mode: NULLABLE
  name: default_search_engine_data_submission_url
  type: STRING
  description: The search submission URL of the default search engine, used to construct
    search queries; not recorded for user-installed engines to protect privacy (sampled
    2026-05-29).
- mode: NULLABLE
  name: devtools_toolbox_opened_count_sum
  type: INTEGER
  description: Total number of times the Firefox DevTools toolbox was opened during
    the first session (sampled 2026-05-29).
- mode: NULLABLE
  name: distribution_id
  type: STRING
  description: The identifier of the Firefox distribution (e.g. 'canonical-002', 'mozilla-MSIX',
    'mint-001') that supplied this install (sampled 2026-05-29).
- mode: NULLABLE
  name: e10s_enabled
  type: BOOLEAN
  description: Whether Electrolysis (multi-process Firefox, e10s) was enabled on the
    first seen date; true for almost all modern clients (sampled 2026-05-29).
- mode: NULLABLE
  name: env_build_arch
  type: STRING
  description: The build architecture of the Firefox binary (e.g. 'x86-64', 'x86',
    'aarch64') (sampled 2026-05-29).
- mode: NULLABLE
  name: env_build_id
  type: STRING
  description: The build ID of the Firefox binary in YYYYMMDDHHMMSS format, identifying
    when it was compiled (sampled 2026-05-29).
- mode: NULLABLE
  name: env_build_version
  type: STRING
  description: The version string of the Firefox binary as reported by the build environment
    (sampled 2026-05-29).
- mode: REPEATED
  name: environment_settings_intl_accept_languages
