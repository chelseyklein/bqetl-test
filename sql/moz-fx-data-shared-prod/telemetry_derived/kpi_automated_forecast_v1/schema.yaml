fields:
- name: ds
  type: TIMESTAMP
  mode: NULLABLE
  description: The date-time for which this forecast row was generated by the Prophet model.
- name: trend
  type: FLOAT64
  mode: NULLABLE
  description: The estimated long-term trend component of the metric on this date.
- name: yhat_lower
  type: FLOAT64
  mode: NULLABLE
  description: The lower bound of the Prophet uncertainty interval for the forecast on this date.
- name: yhat_upper
  type: FLOAT64
  mode: NULLABLE
  description: The upper bound of the Prophet uncertainty interval for the forecast on this date.
- name: trend_lower
  type: FLOAT64
  mode: NULLABLE
  description: The lower bound of the uncertainty interval for the trend component on this date.
- name: trend_upper
  type: FLOAT64
  mode: NULLABLE
  description: The upper bound of the uncertainty interval for the trend component on this date.
- name: additive_terms
  type: FLOAT64
  mode: NULLABLE
  description: The total additive terms combined (weekly seasonality + yearly seasonality + holidays + extra
    regressors).
- name: additive_terms_lower
  type: FLOAT64
  mode: NULLABLE
  description: The lower bound of the uncertainty interval for total additive terms.
- name: additive_terms_upper
  type: FLOAT64
  mode: NULLABLE
  description: The upper bound of the uncertainty interval for total additive terms.
- name: extra_regressors_additive
  type: FLOAT64
  mode: NULLABLE
  description: The combined contribution of additive external regressors (e.g., macroeconomic or marketing
    signals) to the forecast.
- name: extra_regressors_additive_lower
  type: FLOAT64
  mode: NULLABLE
  description: The lower bound of the uncertainty interval for the extra additive regressors component.
- name: extra_regressors_additive_upper
  type: FLOAT64
  mode: NULLABLE
  description: The upper bound of the uncertainty interval for the extra additive regressors component.
- name: holidays
  type: FLOAT64
  mode: NULLABLE
  description: The estimated holiday effect component of the metric on this date; zero for non-holiday dates.
- name: holidays_lower
  type: FLOAT64
  mode: NULLABLE
  description: The lower bound of the uncertainty interval for the holiday effect component.
- name: holidays_upper
  type: FLOAT64
  mode: NULLABLE
  description: The upper bound of the uncertainty interval for the holiday effect component.
- name: regressor_00
  type: FLOAT64
  mode: NULLABLE
  description: The first additional external regressor's contribution to the forecast on this date.
- name: regressor_00_lower
  type: FLOAT64
  mode: NULLABLE
  description: The lower bound of the uncertainty interval for the first external regressor's contribution.
- name: regressor_00_upper
  type: FLOAT64
  mode: NULLABLE
  description: The upper bound of the uncertainty interval for the first external regressor's contribution.
- name: weekly
  type: FLOAT64
  mode: NULLABLE
  description: The estimated weekly seasonality component of the metric on this date.
- name: weekly_lower
  type: FLOAT64
  mode: NULLABLE
  description: The lower bound of the uncertainty interval for the weekly seasonality component.
- name: weekly_upper
  type: FLOAT64
  mode: NULLABLE
  description: The upper bound of the uncertainty interval for the weekly seasonality component.
- name: yearly
  type: FLOAT64
  mode: NULLABLE
  description: The estimated yearly seasonality component of the metric on this date.
- name: yearly_lower
  type: FLOAT64
  mode: NULLABLE
  description: The lower bound of the uncertainty interval for the yearly seasonality component.
- name: yearly_upper
  type: FLOAT64
  mode: NULLABLE
  description: The upper bound of the uncertainty interval for the yearly seasonality component.
- name: multiplicative_terms
  type: FLOAT64
  mode: NULLABLE
  description: The multiplicative terms component of the Prophet forecast; zero when only additive decomposition
    is used.
- name: multiplicative_terms_lower
  type: FLOAT64
  mode: NULLABLE
  description: The lower bound of the uncertainty interval for multiplicative terms; zero when only additive
    decomposition is used.
- name: multiplicative_terms_upper
  type: FLOAT64
  mode: NULLABLE
  description: The upper bound of the uncertainty interval for multiplicative terms; zero when only additive
    decomposition is used.
- name: yhat
  type: FLOAT64
  mode: NULLABLE
  description: The point forecast (expected value) of the KPI metric for this date.
- name: target
  type: STRING
  mode: NULLABLE
  description: The KPI target being forecasted (e.g., 'desktop' for Firefox Desktop DAU, 'mobile' for mobile
    DAU).
- name: forecast_date
  type: STRING
  mode: NULLABLE
  description: The date on which the KPI forecast model was run.
- name: forecast_parameters
  type: STRING
  mode: NULLABLE
  description: A JSON string describing the Prophet model hyperparameters used to generate this forecast.
- name: metric
  type: STRING
  mode: NULLABLE
  description: The specific metric being forecasted (e.g., 'DAU', 'QDAU', 'QCDOU', 'CDOU').
