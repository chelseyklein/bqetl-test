fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/telemetry_derived/telemetry_derived.yaml
    field: submission_date
- name: product
  type: STRING
  mode: NULLABLE
  description: The non-desktop Firefox product name (e.g., 'Fenix', 'Firefox iOS', 'Focus Android') that
    identifies the specific application being counted.
- name: app_version
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/telemetry_derived/telemetry_derived.yaml
    field: app_version
- name: os
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/telemetry_derived/telemetry_derived.yaml
    field: os
- name: normalized_channel
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/telemetry_derived/telemetry_derived.yaml
    field: normalized_channel
- name: country
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/telemetry_derived/telemetry_derived.yaml
    field: country
- name: new_profiles
  type: INT64
  mode: NULLABLE
  description: The number of client profiles that were created on the day exactly 6 days before the submission
    date, representing new profile installs attributed to that creation day.
- name: day_2_7_activated
  type: INT64
  mode: NULLABLE
  description: The number of profiles from the new_profiles cohort that were seen active on at least one
    day during days 2 through 7 after profile creation, measuring early retention.
