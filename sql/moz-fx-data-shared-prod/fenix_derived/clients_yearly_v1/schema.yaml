fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date when the telemetry ping is received on the server side.
- name: days_seen_bytes
  type: BYTES
  mode: NULLABLE
  description: A 365-bit (46-byte) binary representation of the days this client was
    active over the past year, where the rightmost bit represents the current day.
    Used to compute rolling activity windows without requiring a full history scan
    (sampled 2026-05-28).
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: A number, 0-99, that samples by client_id and allows filtering data
    for analysis. It is a pipeline-generated artifact that should match between pings.
- name: first_run_date
  type: DATE
  mode: NULLABLE
  description: The date of the first run of the application.
- name: durations
  type: INTEGER
  mode: NULLABLE
  description: The total foreground duration (in seconds) of all browser sessions
    for this client on this submission_date, as reported in the baseline ping (sampled
    2026-05-28).
- name: days_seen_session_start_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask recording the days within the last 28 days
    on which this client started a session; bit 0 (rightmost) represents the current
    day. Null for ~18% of clients where no session start was recorded (sampled 2026-05-28).
- name: days_seen_session_end_bits
  type: INTEGER
  mode: NULLABLE
  description: A 28-bit integer bitmask recording the days within the last 28 days
    on which this client ended a session; bit 0 (rightmost) represents the current
    day. Null for ~0.5% of clients (sampled 2026-05-28).
- name: normalized_channel
  type: STRING
  mode: NULLABLE
  description: The normalized channel the application is being distributed on.
- name: normalized_os
  type: STRING
  mode: NULLABLE
  description: The normalized name of the operating system running at the client.
- name: normalized_os_version
  type: STRING
  mode: NULLABLE
  description: The user-visible version of the operating system (e.g. '15', '14',
    '13' for Android versions). If version detection fails, set to 'Unknown' (sampled
    2026-05-28).
- name: android_sdk_version
  type: STRING
  mode: NULLABLE
  description: The optional Android specific SDK version of the software running on
    this hardware device.
- name: locale
  type: STRING
  mode: NULLABLE
  description: Set of language- and/or country-based preferences for a user interface.
- name: city
  type: STRING
  mode: NULLABLE
  description: Name of the city in which the activity took place, as determined by
    the IP geolocation.
- name: country
  type: STRING
  mode: NULLABLE
  description: Code of the country in which the activity took place, as determined
    by the IP geolocation.
- name: app_build
  type: STRING
  mode: NULLABLE
  description: The build identifier generated by the CI system (e.g. '2016160439').
    If not provided through configuration, set to 'Unknown' (sampled 2026-05-28).
- name: app_channel
  type: STRING
  mode: NULLABLE
  description: The raw channel the application is distributed on, as reported by the
    client (e.g. 'release', 'nightly', 'beta', 'benchmark', 'fenixProduction'). Differs
    from normalized_channel in that it preserves the original reported value (sampled
    2026-05-28).
- name: app_display_version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
- name: architecture
  type: STRING
  mode: NULLABLE
  description: The architecture of the device, (e.g. "arm", "x86").
- name: device_manufacturer
  type: STRING
  mode: NULLABLE
  description: The manufacturer of the device the application is running on.
- name: device_model
  type: STRING
  mode: NULLABLE
  description: The model of the device the application is running on. On Android,
    this is Build.MODEL, the user-visible marketing name, like "Pixel 2 XL".
- name: telemetry_sdk_build
  type: STRING
  mode: NULLABLE
  description: The version of the Glean SDK at the time the ping was collected (e.g.
    25.0.0).
- name: first_seen_date
  type: DATE
  mode: NULLABLE
  description: Date when the server first received a ping from this client.
- name: is_new_profile
  type: BOOLEAN
  mode: NULLABLE
  description: True if this client's profile was created for the first time on this
    submission_date; false if it is a returning profile. Approximately 51% of rows
    in the sample are new profiles (sampled 2026-05-28).
- name: isp
  type: STRING
  mode: NULLABLE
  description: The name of the internet service provider associated with the client's
    IP address.
- name: distribution_id
  type: STRING
  mode: NULLABLE
  description: The distribution id associated with the install of Firefox.
- name: geo_subdivision
  type: STRING
  mode: NULLABLE
  description: The first-level administrative subdivision code (e.g. US state or Canadian
    province) for the client's IP-geolocated location. Null for ~61% of clients where
    subdivision cannot be determined (sampled 2026-05-28).
