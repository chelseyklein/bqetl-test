fields:
- name: first_submission_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: 'Timestamp of the first submission

    '
- name: client_id
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: /bigquery_etl/schema/org_mozilla_firefox_beta_derived.yaml
    field: client_id

    '
- name: event
  type: STRING
  mode: NULLABLE
  description: The fully qualified event name in 'category.name' dot notation (e.g., 'onboarding.terms_of_service_accepted'). Identifies the specific
    Glean event that was first observed for the client under the given criteria.
- name: event_category
  type: STRING
  mode: NULLABLE
  description: The Glean event category component of the event name, corresponding to the category defined in the Fenix metrics.yaml (e.g., 'onboarding'
    or 'terms_of_use').
- name: event_name
  type: STRING
  mode: NULLABLE
  description: The Glean event name component (the part after the category dot), identifying the specific action within the category (e.g., 'terms_of_service_card',
    'terms_of_service_accepted', 'accepted').
- name: criteria
  type: STRING
  mode: NULLABLE
  description: 'Event-specific filtering conditions (implemented in templated config file)

    '
- name: profile_group_id
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: /bigquery_etl/schema/org_mozilla_firefox_beta_derived.yaml
    field: profile_group_id

    telemetry data.

    '
- name: sample_id
  type: INT64
  mode: NULLABLE
  description: !include-field-description
    file: /bigquery_etl/schema/org_mozilla_firefox_beta_derived.yaml
    field: sample_id

    for analysis. It is a pipeline-generated artifact that should match between pings.

    '
- name: first_event_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: 'Timestamp of the first event

    '
- name: event_extra
  type: JSON
  mode: NULLABLE
  description: A JSON object containing additional key-value metadata attached to the event at the time it was recorded. Fields vary by event type; for
    Terms of Use events this may include keys such as 'surface', 'tou_version', and 'glean_timestamp'.
- name: app_version_major
  type: NUMERIC
  mode: NULLABLE
  description: !include-field-description
