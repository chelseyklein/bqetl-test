fields:
- mode: NULLABLE
  name: submission_date
  type: DATE
  description: The date when the telemetry ping is received on the server side.
- name: client_id
  type: STRING
  mode: NULLABLE
  description: A unique identifier (UUID) for the client.
- name: sample_id
  type: INTEGER
  mode: NULLABLE
  description: A number, 0-99, that samples by client_id and allows filtering data
    for analysis. It is a pipeline-generated artifact that should match between pings.
- name: app_version
  type: STRING
  mode: NULLABLE
  description: User visible version string (e.g. "1.0.3") for the browser.
- name: country
  type: STRING
  mode: NULLABLE
  description: Name of the country in which the activity took place, as determined
    by the IP geolocation.
- name: locale
  type: STRING
  mode: NULLABLE
  description: Set of language- and/or country-based preferences for a user interface.
- name: app_os
  type: STRING
  mode: NULLABLE
  description: The operating system of the client (e.g. "Windows", "Mac", "Linux"), derived from the normalized
    OS field. The most frequently observed value across all pings submitted on the given day is used.
- name: addons
  type: RECORD
  mode: REPEATED
  fields:
  description: A repeated record of add-ons installed on the client, parsed from the legacy `payload.info.addons`
    string in the telemetry main ping. Each entry represents a distinct add-on seen across all pings for
    the client on the submission date.
  - name: id
    type: STRING
    mode: NULLABLE
  description: The identifier of the installed add-on (e.g. "webcompat@mozilla.org"), URI-decoded and extracted
    from the legacy addons payload string.
  - name: version
    type: STRING
    mode: NULLABLE
  description: The most recent version of the add-on observed for the client on the submission date, selected
    by descending minor-truncated version ordering across all pings.
