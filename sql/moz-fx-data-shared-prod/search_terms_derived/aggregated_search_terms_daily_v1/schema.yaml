fields:
- name: search_terms
  type: STRING
  mode: NULLABLE
  description: The sanitized search query string typed by the user that triggered a Firefox Suggest impression.
    This field is null when no sanitized query is available or when the aggregated row does not match a
    known suggestion keyword.
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: submission_date
- name: impressions
  type: INT64
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: impressions
- name: clicks
  type: INT64
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: clicks
- name: client_days
  type: INT64
  mode: NULLABLE
  description: The number of distinct client-days (unique `context_id` values) that contributed impressions
    for this search term on the given submission date. Each `context_id` represents a single browsing session
    or client instance, so this approximates the reach across unique clients.
- name: advertiser
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: advertiser
- name: iab_category
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: iab_category
- name: title
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: title
