fields:
- name: search_terms
  type: STRING
  mode: NULLABLE
  description: The sanitized search query string entered by the user, derived from the sanitized_query field
    in the suggest impressions table. Used to join against advertiser keyword lists; null when no sanitized
    query is available or the query was suppressed for privacy reasons.
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: submission_date
- name: impressions
  type: INT64
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: impressions
- name: clicks
  type: INT64
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: clicks
- name: client_days
  type: INT64
  mode: NULLABLE
  description: The number of distinct clients (identified by context_id) that were shown suggestions matching
    this search term on the given submission date. Computed as COUNT(DISTINCT context_id) from the sanitized
    suggest impressions table.
- name: advertiser
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: advertiser
- name: iab_category
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: iab_category
- name: title
  type: STRING
  mode: NULLABLE
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: title
