fields:
  - mode: NULLABLE
    name: submission_date
    type: DATE
  - mode: NULLABLE
    name: query
    type: STRING
  - mode: NULLABLE
    name: search_sessions
    type: INTEGER
  description: The number of distinct search sessions that ended with this query on the given submission
    date. Only queries whose rolling 7-day session count exceeds 1 are included, to satisfy a minimum-frequency
    privacy threshold.
