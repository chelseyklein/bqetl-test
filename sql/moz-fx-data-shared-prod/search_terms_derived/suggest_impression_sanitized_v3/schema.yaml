fields:
- mode: NULLABLE
  name: request_id
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: request_id
- mode: NULLABLE
  name: submission_timestamp
  type: TIMESTAMP
  description: The UTC timestamp at which the impression ping was received by the ingestion pipeline, truncated
    to second precision.
- mode: NULLABLE
  name: telemetry_query
  type: STRING
  description: The lowercased, left-trimmed search query string as reported by the legacy Firefox telemetry
    pipeline. Null for Glean-sourced impressions; the sanitized query from Merino logs is available in the
    `query` field instead.
- mode: NULLABLE
  name: advertiser
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: advertiser
- mode: NULLABLE
  name: block_id
  type: INTEGER
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: block_id
- mode: NULLABLE
  name: context_id
  type: STRING
  description: A UUID that identifies a user for Contextual Services interaction pings. Used to correlate
    impression and click events for the same user across requests.
- mode: NULLABLE
  name: sample_id
  type: INTEGER
  description: A sampling bucket identifier (0–99) derived from the client ID, used for efficient sampling
    of the dataset. Currently unpopulated for this table.
- mode: NULLABLE
  name: is_clicked
  type: BOOLEAN
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: is_clicked
- mode: NULLABLE
  name: locale
  type: STRING
  description: The locale of the Firefox application at initialization time (e.g. "en-US", "en-GB"). If
    the locale cannot be determined, the value is "und" (undetermined).
- mode: NULLABLE
  name: country
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: country
- mode: NULLABLE
  name: region
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: region
- mode: NULLABLE
  name: normalized_os
  type: STRING
  description: The normalized name of the client's operating system (e.g. "Windows", "Mac", "Linux"). Possible
    values include Android, iOS, Linux, Darwin, Windows, FreeBSD, NetBSD, OpenBSD, Solaris, and Unknown.
- mode: NULLABLE
  name: normalized_os_version
  type: STRING
  description: The user-visible version string of the client's operating system (e.g. "10.0" for Windows
    10). Set to "Unknown" if version detection fails.
- mode: NULLABLE
  name: normalized_channel
  type: STRING
  description: The normalized Firefox release channel from which the impression was sent (e.g. "release",
    "beta", "nightly", "esr", "aurora"). Values outside known channels are recorded as "Other".
- mode: NULLABLE
  name: position
  type: INTEGER
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: position
- mode: NULLABLE
  name: reporting_url
  type: STRING
  description: The URL to which this impression interaction should be reported, as provided by the Quick
    Suggest backend. Encodes campaign and placement information for attribution tracking.
- mode: NULLABLE
  name: scenario
  type: STRING
  description: The Quick Suggest scenario associated with the impression, sourced from the legacy telemetry
    pipeline. This field is always null for Glean-sourced impressions and is currently unpopulated.
- mode: NULLABLE
  name: version
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: version
- mode: NULLABLE
  name: timestamp
  type: TIMESTAMP
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: timestamp
- mode: NULLABLE
  name: query
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: query
- mode: NULLABLE
  name: dma
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: dma
- mode: NULLABLE
  name: form_factor
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: form_factor
- mode: NULLABLE
  name: browser
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: browser
- mode: NULLABLE
  name: os_family
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: os_family
- mode: NULLABLE
  name: session_id
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: session_id
- mode: NULLABLE
  name: sequence_no
  type: INTEGER
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: sequence_no
- mode: NULLABLE
  name: match_type
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: match_type
- fields:
  - mode: NULLABLE
    name: slug
    type: STRING
  - mode: NULLABLE
    name: branch
    type: STRING
  mode: REPEATED
  name: experiments
  type: RECORD
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: experiments
