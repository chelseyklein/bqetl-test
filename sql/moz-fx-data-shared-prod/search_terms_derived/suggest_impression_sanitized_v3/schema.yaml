fields:
- mode: NULLABLE
  name: request_id
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: request_id
- mode: NULLABLE
  name: submission_timestamp
  type: TIMESTAMP
  description: The UTC timestamp at which the impression ping was received by the ingestion pipeline, truncated
    to second precision. Used to join impression records with sanitized query logs from the Merino backend.
- mode: NULLABLE
  name: telemetry_query
  type: STRING
  description: The search query string as recorded in the legacy quicksuggest impression ping, lowercased
    and left-trimmed. Populated only for legacy (non-Glean) impressions; NULL for Glean-sourced impressions.
- mode: NULLABLE
  name: advertiser
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: advertiser
- mode: NULLABLE
  name: block_id
  type: INTEGER
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: block_id
- mode: NULLABLE
  name: context_id
  type: STRING
  description: A UUID that identifies the user for Contextual Services interaction pings. Used to associate
    impression and click events with a specific user context without exposing personally identifiable information.
- mode: NULLABLE
  name: sample_id
  type: INTEGER
  description: A sampling identifier inherited from the source ping schema. Currently unpopulated (always
    NULL) in this table because neither the legacy nor Glean impression sources provide a usable sample_id
    in this context.
- mode: NULLABLE
  name: is_clicked
  type: BOOLEAN
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: is_clicked
- mode: NULLABLE
  name: locale
  type: STRING
  description: The locale of the Firefox application at initialization time, e.g. "en-US" or "es-ES". Sourced
    from client_info for Glean pings and from the locale field for legacy pings.
- mode: NULLABLE
  name: country
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: country
- mode: NULLABLE
  name: region
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: region
- mode: NULLABLE
  name: normalized_os
  type: STRING
  description: The normalized name of the operating system on which the Firefox client is running, e.g.
    "Windows", "Mac", or "Linux".
- mode: NULLABLE
  name: normalized_os_version
  type: STRING
  description: The user-visible version string of the operating system, e.g. "10.0" for Windows 10. Set
    to "Unknown" when version detection fails.
- mode: NULLABLE
  name: normalized_channel
  type: STRING
  description: The Firefox release channel from which the impression was submitted, e.g. "release", "beta",
    "nightly", "esr", or "aurora". Sourced from release_channel in legacy pings and normalized_channel in
    Glean pings.
- mode: NULLABLE
  name: position
  type: INTEGER
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: position
- mode: NULLABLE
  name: reporting_url
  type: STRING
  description: The URL used to report this Quick Suggest impression interaction to the Contextual Services
    ad-reporting backend. Constructed per-impression and contains encoded identifiers for the served suggestion.
- mode: NULLABLE
  name: scenario
  type: STRING
  description: The Quick Suggest scenario associated with the legacy impression ping. Currently always NULL
    as this field is not populated by the active data sources feeding this table.
- mode: NULLABLE
  name: version
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: version
- mode: NULLABLE
  name: timestamp
  type: TIMESTAMP
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: timestamp
- mode: NULLABLE
  name: query
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: query
- mode: NULLABLE
  name: dma
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: dma
- mode: NULLABLE
  name: form_factor
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: form_factor
- mode: NULLABLE
  name: browser
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: browser
- mode: NULLABLE
  name: os_family
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: os_family
- mode: NULLABLE
  name: session_id
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: session_id
- mode: NULLABLE
  name: sequence_no
  type: INTEGER
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: sequence_no
- mode: NULLABLE
  name: match_type
  type: STRING
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: match_type
- fields:
  - mode: NULLABLE
    name: slug
    type: STRING
  - mode: NULLABLE
    name: branch
    type: STRING
  mode: REPEATED
  name: experiments
  type: RECORD
  description: !include-field-description
    file: sql/moz-fx-data-shared-prod/search_terms_derived/dataset_schema.yaml
    field: experiments
