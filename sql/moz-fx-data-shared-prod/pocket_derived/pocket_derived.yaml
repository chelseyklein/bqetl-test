fields:
- name: submission_date
  description: The date on which the data was submitted or recorded. Used as the primary date partition key for time-series analysis across the
    dataset.
- name: tile_id
  description: A unique integer identifier for a Pocket content tile (e.g. a sponsored or editorial content card). Each value corresponds to a
    distinct piece of content surfaced to users.
- name: type
  description: The category or format of the Pocket content tile, indicating how it was sourced or served. A value of 'spoc' denotes a sponsored
    content tile.
