fields:
- name: submission_date
  description: The date on which the data was submitted or recorded. Used to partition and filter data by day.
- name: tile_id
  description: A unique numeric identifier for a Pocket content tile (e.g., a sponsored or recommended article). Each value corresponds to a distinct
    tile served to users.
- name: type
  description: The category or classification of the Pocket tile or content item. A value of 'spoc' indicates a sponsored content tile.
