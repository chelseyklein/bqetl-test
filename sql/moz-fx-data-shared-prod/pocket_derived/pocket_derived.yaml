fields:
- name: submission_date
  description: The date on which the record was submitted or processed. Used as the primary date dimension for partitioning and daily reporting.
  type: DATE
- name: tile_id
  description: A unique numeric identifier for a Pocket content tile, such as a sponsored or recommended content card. Each distinct tile served
    to users is represented by a different ID.
  type: INT64
- name: type
  description: The classification or category of the content tile. For example, a value of 'spoc' indicates the tile is a sponsored piece of content.
  type: STRING
