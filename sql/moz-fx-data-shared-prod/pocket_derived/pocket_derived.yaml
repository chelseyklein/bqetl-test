fields:
- name: submission_date
  description: The date on which the data was submitted or recorded. Used as the primary date partition key for time-series analysis.
- name: tile_id
  description: A unique numeric identifier representing a specific Pocket content tile (e.g., a sponsored or editorial content card). Each value
    corresponds to a distinct tile served to users.
- name: type
  description: The category or classification of the content tile, indicating how it was sourced or funded. For example, 'spoc' denotes a Sponsored
    Pocket Open Content tile (i.e., a paid/sponsored placement).
