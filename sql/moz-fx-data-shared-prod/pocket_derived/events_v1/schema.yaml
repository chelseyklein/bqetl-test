fields:
- mode: NULLABLE
  name: submission_timestamp
  type: TIMESTAMP
  description: The timestamp at which the event payload was submitted and received by the ingestion pipeline. Used to partition the table by date.
- mode: NULLABLE
  name: normalized_app_id
  type: STRING
  description: The normalized application identifier for the Pocket client that generated the event, derived from the source APP_ID field.
- mode: NULLABLE
  name: metadata
  type: RECORD
  fields:
  - mode: NULLABLE
    name: geo
    type: RECORD
    fields:
    - mode: NULLABLE
      name: city
      type: STRING
    - mode: NULLABLE
      name: country
      type: STRING
  - mode: NULLABLE
    name: user_agent
    type: RECORD
    fields:
    - mode: NULLABLE
      name: browser
      type: STRING
    - mode: NULLABLE
      name: os
      type: STRING
    - mode: NULLABLE
      name: version
      type: STRING
- mode: NULLABLE
  name: client_info
  type: RECORD
  fields:
  - mode: NULLABLE
    name: client_id
    type: STRING
  - mode: NULLABLE
    name: user_id
    type: STRING
  - mode: NULLABLE
    name: app_build
    type: STRING
  - mode: NULLABLE
    name: locale
    type: STRING
  - mode: NULLABLE
    name: os
    type: STRING
  - mode: NULLABLE
    name: os_version
    type: STRING
- mode: NULLABLE
  name: event
  type: STRING
  description: The name of the Pocket frontend event that was recorded, sourced from the EVENT_NAME field in the raw data.
- mode: NULLABLE
  name: event_timestamp
  type: TIMESTAMP
  description: The timestamp at which the event occurred on the client, as reported by the Pocket frontend, sourced from the EVENT_TIMESTAMP field in
    the raw data.
- mode: NULLABLE
  name: event_extra
  type: JSON
  description: A JSON object containing additional key-value metadata associated with the event, sourced from the EVENT_EXTRAS field in the raw Parquet
    data. Contents vary by event type.
