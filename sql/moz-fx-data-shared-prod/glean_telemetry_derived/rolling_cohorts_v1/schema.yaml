fields:
- mode: NULLABLE
  name: client_id
  type: STRING
  description: A unique identifier (UUID) for the client.
- mode: NULLABLE
  name: cohort_date
  type: DATE
  description: The date the client was first seen (first_seen_date), used to define the acquisition cohort
    for retention and engagement analyses.
- mode: NULLABLE
  name: activity_segment
  type: STRING
  description: Classification of users based on their browsing activity. E.g., infrequent,
    casual, regular.
- mode: NULLABLE
  name: app_version
  type: STRING
  description: User-visible version string (e.g. "1.0.3") for the browser, sourced from app_display_version
    for mobile clients and app_version for desktop clients.
- mode: NULLABLE
  name: attribution_campaign
  type: STRING
  description: The optional attribution campaign associated with the Firefox download or install, analogous
    to the UTM campaign parameter. Null for mobile rows, which use play_store_attribution_campaign instead.
- mode: NULLABLE
  name: attribution_content
  type: STRING
  description: The optional attribution content associated with the Firefox download, analogous to the UTM
    content parameter. Null for mobile rows, which use play_store_attribution_content instead.
- mode: NULLABLE
  name: attribution_experiment
  type: STRING
  description: Attribution Experiment
- mode: NULLABLE
  name: attribution_medium
  type: STRING
  description: Attribution Medium
- mode: NULLABLE
  name: attribution_source
  type: STRING
  description: Attribution Source
- mode: NULLABLE
  name: attribution_variation
  type: STRING
  description: Attribution Variation
- mode: NULLABLE
  name: city
  type: STRING
  description: City
- mode: NULLABLE
  name: country
  type: STRING
  description: Code of the country in which the activity took place, as determined
    by the IP geolocation.
- mode: NULLABLE
  name: device_model
  type: STRING
  description: Device Model
- mode: NULLABLE
  name: distribution_id
  type: STRING
  description: The distribution id associated with the install of Firefox.
- mode: NULLABLE
  name: is_default_browser
  type: BOOLEAN
  description: A flag indicating whether the browser is set as the default browser
    on the client side.
- mode: NULLABLE
  name: locale
  type: STRING
  description: Set of language- and/or country-based preferences for a user interface.
- mode: NULLABLE
  name: normalized_app_name
  type: STRING
  description: The normalized name of the Firefox application (e.g. "Firefox Desktop", "Fenix", "Firefox
    iOS"), derived from the app_name field of the source ping.
- mode: NULLABLE
  name: normalized_channel
  type: STRING
  description: The normalized release channel the application is distributed on (e.g. "release", "beta",
    "nightly", "esr"). Null in rare cases where the channel cannot be determined.
- mode: NULLABLE
  name: normalized_os
  type: STRING
  description: The normalized name of the operating system running on the client (e.g. "Windows", "Linux",
    "Android", "iOS", "Mac"), derived from the Glean `os` metric.
- mode: NULLABLE
  name: normalized_os_version
  type: STRING
  description: The user-visible version string of the operating system (e.g. "10.0", "15"), as reported
    by the Glean `os_version` metric. Set to "Unknown" if version detection fails.
- mode: NULLABLE
  name: os_version_major
  type: INTEGER
  description: The major (first) component of the normalized OS version string (e.g. for "10.0.1", the major
    is 10). Defaults to 0 when the major component cannot be parsed.
    client. E.g. for version "100.9.11", the major is 100.
- mode: NULLABLE
  name: os_version_minor
  type: INTEGER
  description: The minor (second) component of the normalized OS version string (e.g. for "10.0.1", the
    minor is 0). Defaults to 0 when the minor component cannot be parsed.
    for version "100.9.11", the minor is 9.
- name: adjust_ad_group
  type: STRING
  mode: NULLABLE
  description: The Adjust ad group associated with the mobile install attribution. Populated only for mobile
    rows (row_source = 'Mobile'); always null for desktop rows.
- name: adjust_campaign
  type: STRING
  mode: NULLABLE
  description: The Adjust campaign name associated with the mobile install attribution. Populated only for
    mobile rows (row_source = 'Mobile'); always null for desktop rows.
- name: adjust_creative
  type: STRING
  mode: NULLABLE
  description: The Adjust creative identifier associated with the mobile install attribution. Populated
    only for mobile rows (row_source = 'Mobile'); always null for desktop rows.
- name: adjust_network
  type: STRING
  mode: NULLABLE
  description: The Adjust network (advertising partner) through which the mobile install was attributed
    (e.g. "Google Ads ACI", "Organic"). Populated only for mobile rows (row_source = 'Mobile'); always null
    for desktop rows.
- name: play_store_attribution_campaign
  type: STRING
  mode: NULLABLE
  description: The Play Store install referrer campaign parameter, typically a URL-encoded campaign string
    from the Google Play install referrer API. Populated only for mobile rows; always null for desktop rows.
- name: play_store_attribution_medium
  type: STRING
  mode: NULLABLE
  description: The Play Store install referrer medium parameter (e.g. "organic", "preload", "referral"),
    indicating how the user arrived at the Play Store listing. Populated only for mobile rows; always null
    for desktop rows.
- name: play_store_attribution_source
  type: STRING
  mode: NULLABLE
  description: The Play Store install referrer source parameter (e.g. "google-play", "eea-browser-choice"),
    identifying the originating traffic source. Populated only for mobile rows; always null for desktop
    rows.
- name: play_store_attribution_content
  type: STRING
  mode: NULLABLE
  description: The Play Store install referrer content parameter, used to differentiate ads or links that
    point to the same URL. Populated only for mobile rows; always null for desktop rows.
- name: play_store_attribution_term
  type: STRING
  mode: NULLABLE
  description: The Play Store install referrer term parameter, typically containing the paid search keyword
    that led to the install. Populated only for mobile rows; always null for desktop rows.
- name: row_source
  type: STRING
  mode: NULLABLE
  description: Indicates whether the row originates from a desktop ("Desktop") or mobile ("Mobile") client,
    reflecting the UNION ALL of the desktop and mobile branches of the ETL query.
- name: play_store_attribution_install_referrer_response
  type: STRING
  mode: NULLABLE
  description: The raw install referrer response string returned by the Google Play Store referrer API (e.g.
    "utm_source=google-play&utm_medium=organic"), from which the individual play_store_attribution_* fields
    are parsed. Populated only for mobile rows; always null for desktop rows.
- name: install_source
  type: STRING
  mode: NULLABLE
  description: The package name of the app store or installer through which the application was installed
    (e.g. "com.android.vending" for the Google Play Store, "com.sec.android.app.samsungapps" for Samsung
    Galaxy Store). Null when the install source cannot be determined or for desktop rows.
    the install source could not be determined.
