fields:
- mode: NULLABLE
  name: client_id
  type: STRING
  description: A unique identifier (UUID) for the client.
- mode: NULLABLE
  name: cohort_date
  type: DATE
  description: The date of the client's first seen ping, used to define the cohort. Each row belongs to
    the cohort of clients who were first observed on this date.
- mode: NULLABLE
  name: activity_segment
  type: STRING
  description: Classification of users based on their browsing activity. E.g., infrequent,
    casual, regular.
- mode: NULLABLE
  name: app_version
  type: STRING
  description: User visible version string (e.g. "1.0.3") for the browser.
- mode: NULLABLE
  name: attribution_campaign
  type: STRING
  description: The optional attribution campaign associated with the Firefox installation, similar to or
    the same as UTM 'campaign'. Null for Mobile rows, which use Adjust or Play Store attribution instead.
- mode: NULLABLE
  name: attribution_content
  type: STRING
  description: The optional attribution content associated with the Firefox installation, similar to or
    the same as UTM 'content'. Null for Mobile rows, which use Adjust or Play Store attribution instead.
- mode: NULLABLE
  name: attribution_experiment
  type: STRING
  description: Attribution Experiment
- mode: NULLABLE
  name: attribution_medium
  type: STRING
  description: Attribution Medium
- mode: NULLABLE
  name: attribution_source
  type: STRING
  description: Attribution Source
- mode: NULLABLE
  name: attribution_variation
  type: STRING
  description: Attribution Variation
- mode: NULLABLE
  name: city
  type: STRING
  description: City
- mode: NULLABLE
  name: country
  type: STRING
  description: Code of the country in which the activity took place, as determined
    by the IP geolocation.
- mode: NULLABLE
  name: device_model
  type: STRING
  description: Device Model
- mode: NULLABLE
  name: distribution_id
  type: STRING
  description: The distribution id associated with the install of Firefox.
- mode: NULLABLE
  name: is_default_browser
  type: BOOLEAN
  description: A flag indicating whether the browser is set as the default browser
    on the client side.
- mode: NULLABLE
  name: locale
  type: STRING
  description: Set of language- and/or country-based preferences for a user interface.
- mode: NULLABLE
  name: normalized_app_name
  type: STRING
  description: The normalized name of the Firefox application (e.g. 'Firefox Desktop', 'Fenix', 'Firefox
    iOS'). Derived from the app_name field in the active users source tables.
- mode: NULLABLE
  name: normalized_channel
  type: STRING
  description: The normalized release channel the application is distributed on (e.g. 'release', 'beta',
    'nightly', 'esr'). Sourced from the baseline clients last seen table for Desktop rows.
- mode: NULLABLE
  name: normalized_os
  type: STRING
  description: The normalized name of the operating system on which the client is running, such as 'Windows',
    'Mac', 'Linux', 'Android', or 'iOS'.
- mode: NULLABLE
  name: normalized_os_version
  type: STRING
  description: The normalized, user-visible version string of the operating system (e.g. '10.0', '15').
    Derived from the raw OS version reported in telemetry; set to 'Unknown' if version detection fails.
- mode: NULLABLE
  name: os_version_major
  type: INTEGER
  description: The major (first) component of the normalized OS version string, parsed as an integer (e.g.
    for '10.0.1', the major is 10). Defaults to 0 if the version cannot be parsed.
    client. E.g. for version "100.9.11", the major is 100.
- mode: NULLABLE
  name: os_version_minor
  type: INTEGER
  description: The minor (second) component of the normalized OS version string, parsed as an integer (e.g.
    for '10.0.1', the minor is 0). Defaults to 0 if the version cannot be parsed.
    for version "100.9.11", the minor is 9.
- name: adjust_ad_group
  type: STRING
  mode: NULLABLE
  description: The Adjust-attributed ad group associated with the mobile client's install campaign. Populated
    for Mobile rows only; null for Desktop.
- name: adjust_campaign
  type: STRING
  mode: NULLABLE
  description: The Adjust-attributed campaign name associated with the mobile client's install. Populated
    for Mobile rows only; null for Desktop.
- name: adjust_creative
  type: STRING
  mode: NULLABLE
  description: The Adjust-attributed creative (ad unit) associated with the mobile client's install campaign.
    Populated for Mobile rows only; null for Desktop.
- name: adjust_network
  type: STRING
  mode: NULLABLE
  description: The Adjust-attributed advertising network through which the mobile client was acquired (e.g.
    'Google Ads ACI', 'Organic'). Populated for Mobile rows only; null for Desktop.
- name: play_store_attribution_campaign
  type: STRING
  mode: NULLABLE
  description: The UTM campaign value from the Google Play Store install referrer for the mobile client.
    Populated for Mobile rows only; null for Desktop.
- name: play_store_attribution_medium
  type: STRING
  mode: NULLABLE
  description: The UTM medium value from the Google Play Store install referrer for the mobile client (e.g.
    'organic', 'preload', 'referral'). Populated for Mobile rows only; null for Desktop.
- name: play_store_attribution_source
  type: STRING
  mode: NULLABLE
  description: The UTM source value from the Google Play Store install referrer for the mobile client (e.g.
    'google-play', 'eea-browser-choice'). Populated for Mobile rows only; null for Desktop.
- name: play_store_attribution_content
  type: STRING
  mode: NULLABLE
  description: The UTM content value from the Google Play Store install referrer for the mobile client.
    Populated for Mobile rows only; null for Desktop.
- name: play_store_attribution_term
  type: STRING
  mode: NULLABLE
  description: The UTM term (keyword) value from the Google Play Store install referrer for the mobile client
    (e.g. 'firefox', 'mozilla firefox'). Populated for Mobile rows only; null for Desktop.
- name: row_source
  type: STRING
  mode: NULLABLE
  description: Indicates whether the row originates from a Desktop or Mobile client. Values are 'Desktop'
    or 'Mobile', and determine which mobile-only fields (e.g. Adjust, Play Store) are populated.
- name: play_store_attribution_install_referrer_response
  type: STRING
  mode: NULLABLE
  description: The full raw install referrer string returned by the Google Play Store for the mobile client
    (e.g. 'utm_source=google-play&utm_medium=organic'). Populated for Mobile rows only; null for Desktop.
- name: install_source
  type: STRING
  mode: NULLABLE
  description: The source through which the application was installed on a mobile device, typically the
    package name of the installing app (e.g. 'com.android.vending' for the Google Play Store). Null when
    the install source cannot be determined or for Desktop rows.
    the install source could not be determined.
