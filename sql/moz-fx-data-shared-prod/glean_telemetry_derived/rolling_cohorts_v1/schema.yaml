fields:
- mode: NULLABLE
  name: client_id
  type: STRING
  description: A unique identifier (UUID) for the client.
- mode: NULLABLE
  name: cohort_date
  type: DATE
  description: The date the client was first seen by Mozilla's data pipeline, used as the cohort assignment
    date for retention and growth analyses. Each row in this table corresponds to clients whose first-seen
    date matches the partition date.
- mode: NULLABLE
  name: activity_segment
  type: STRING
  description: Classification of users based on their browsing activity. E.g., infrequent,
    casual, regular.
- mode: NULLABLE
  name: app_version
  type: STRING
  description: User visible version string (e.g. "1.0.3") for the browser.
- mode: NULLABLE
  name: attribution_campaign
  type: STRING
  description: The optional attribution campaign associated with the Firefox installation, analogous to
    UTM campaign. Sourced from the clients_last_seen_joined table for Desktop; always null for Mobile rows.
- mode: NULLABLE
  name: attribution_content
  type: STRING
  description: The optional attribution content parameter associated with the Firefox installation, analogous
    to UTM content. Sourced from the clients_last_seen_joined table for Desktop; always null for Mobile
    rows.
- mode: NULLABLE
  name: attribution_experiment
  type: STRING
  description: Attribution Experiment
- mode: NULLABLE
  name: attribution_medium
  type: STRING
  description: Attribution Medium
- mode: NULLABLE
  name: attribution_source
  type: STRING
  description: Attribution Source
- mode: NULLABLE
  name: attribution_variation
  type: STRING
  description: Attribution Variation
- mode: NULLABLE
  name: city
  type: STRING
  description: City
- mode: NULLABLE
  name: country
  type: STRING
  description: Code of the country in which the activity took place, as determined
    by the IP geolocation.
- mode: NULLABLE
  name: device_model
  type: STRING
  description: Device Model
- mode: NULLABLE
  name: distribution_id
  type: STRING
  description: The distribution id associated with the install of Firefox.
- mode: NULLABLE
  name: is_default_browser
  type: BOOLEAN
  description: A flag indicating whether the browser is set as the default browser
    on the client side.
- mode: NULLABLE
  name: locale
  type: STRING
  description: Set of language- and/or country-based preferences for a user interface.
- mode: NULLABLE
  name: normalized_app_name
  type: STRING
  description: The normalized name of the Firefox application (e.g., 'Firefox Desktop', 'Fenix', 'Firefox
    iOS'). Derived from the app_name field in the source active users tables.
- mode: NULLABLE
  name: normalized_channel
  type: STRING
  description: The normalized release channel on which the application is distributed (e.g., 'release',
    'beta', 'nightly', 'esr'). Sourced from the baseline_clients_last_seen table for Desktop and from mobile_active_users
    for Mobile.
- mode: NULLABLE
  name: normalized_os
  type: STRING
  description: The normalized name of the operating system running on the client (e.g., 'Windows', 'Mac',
    'Linux', 'Android', 'iOS'). Derived from the Glean 'os' metric reported in the baseline ping.
- mode: NULLABLE
  name: normalized_os_version
  type: STRING
  description: The user-visible version string of the operating system (e.g., '10.0', '16'). Sourced from
    baseline_clients_last_seen for Desktop and normalized_os_version from mobile_active_users for Mobile;
    set to 'Unknown' if version detection fails.
- mode: NULLABLE
  name: os_version_major
  type: INTEGER
  description: The major (first) component of the normalized OS version string, extracted by splitting on
    '.' and casting to integer. For example, OS version '10.15.7' yields major version 10; defaults to 0
    if the component cannot be parsed.
    client. E.g. for version "100.9.11", the major is 100.
- mode: NULLABLE
  name: os_version_minor
  type: INTEGER
  description: The minor (second) component of the normalized OS version string, extracted by splitting
    on '.' and casting to integer. For example, OS version '10.15.7' yields minor version 15; defaults to
    0 if the component cannot be parsed.
    for version "100.9.11", the minor is 9.
- name: adjust_ad_group
  type: STRING
  mode: NULLABLE
  description: The Adjust-attributed ad group within an advertising campaign that drove the mobile client's
    acquisition. Only populated for Mobile rows sourced from mobile_new_profile_clients; null for Desktop
    rows.
- name: adjust_campaign
  type: STRING
  mode: NULLABLE
  description: The Adjust-attributed campaign name associated with the mobile client's acquisition. Only
    populated for Mobile rows sourced from mobile_new_profile_clients; null for Desktop rows.
- name: adjust_creative
  type: STRING
  mode: NULLABLE
  description: The Adjust-attributed creative (ad creative name or identifier) associated with the mobile
    client's acquisition. Only populated for Mobile rows sourced from mobile_new_profile_clients; null for
    Desktop rows.
- name: adjust_network
  type: STRING
  mode: NULLABLE
  description: The Adjust-attributed advertising network through which the mobile client was acquired (e.g.,
    'Google Ads ACI', 'Organic'). Only populated for Mobile rows; null for Desktop rows.
- name: play_store_attribution_campaign
  type: STRING
  mode: NULLABLE
  description: The campaign parameter from the Google Play Store referrer string at the time of the mobile
    client's install. Only populated for Mobile rows sourced from mobile_new_profile_clients; null for Desktop
    rows.
- name: play_store_attribution_medium
  type: STRING
  mode: NULLABLE
  description: The medium parameter from the Google Play Store referrer string at the time of the mobile
    client's install (e.g., 'organic', 'preload', 'referral'). Only populated for Mobile rows; null for
    Desktop rows.
- name: play_store_attribution_source
  type: STRING
  mode: NULLABLE
  description: The source parameter from the Google Play Store referrer string at the time of the mobile
    client's install (e.g., 'google-play', 'apps.facebook.com'). Only populated for Mobile rows; null for
    Desktop rows.
- name: play_store_attribution_content
  type: STRING
  mode: NULLABLE
  description: The content parameter from the Google Play Store referrer string at the time of the mobile
    client's install, often used to identify a specific ad or creative. Only populated for Mobile rows;
    null for Desktop rows.
- name: play_store_attribution_term
  type: STRING
  mode: NULLABLE
  description: The search term (keyword) parameter from the Google Play Store referrer string at the time
    of the mobile client's install. Only populated for Mobile rows; null for Desktop rows.
- name: row_source
  type: STRING
  mode: NULLABLE
  description: Indicates whether the row originates from a Desktop or Mobile client pipeline. Values are
    'Desktop' (sourced from firefox_desktop.baseline_active_users) or 'Mobile' (sourced from telemetry.mobile_active_users).
- name: play_store_attribution_install_referrer_response
  type: STRING
  mode: NULLABLE
  description: The full raw install referrer response string returned by the Google Play Store at install
    time, containing encoded UTM parameters (e.g., 'utm_source=google-play&utm_medium=organic'). Only populated
    for Mobile rows; null for Desktop rows.
- name: install_source
  type: STRING
  mode: NULLABLE
  description: The package name of the app store or installer that delivered the Firefox application on
    mobile (e.g., 'com.android.vending' for Google Play Store, 'com.sec.android.app.samsungapps' for Samsung
    Galaxy Store). Only populated for Mobile rows; null for Desktop rows.
    the install source could not be determined.
