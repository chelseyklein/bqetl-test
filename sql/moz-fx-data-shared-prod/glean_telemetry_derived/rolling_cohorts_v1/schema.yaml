fields:
- mode: NULLABLE
  name: client_id
  type: STRING
  description: A unique identifier (UUID) for the client.
- mode: NULLABLE
  name: cohort_date
  type: DATE
  description: The date on which the client was first seen (first_seen_date), used to define the cohort.
    Each row belongs to a rolling daily cohort identified by this date.
- mode: NULLABLE
  name: activity_segment
  type: STRING
  description: Classification of users based on their browsing activity. E.g., infrequent,
    casual, regular.
- mode: NULLABLE
  name: app_version
  type: STRING
  description: User visible version string (e.g. "1.0.3") for the browser.
- mode: NULLABLE
  name: attribution_campaign
  type: STRING
  description: The optional attribution campaign associated with the Firefox install, equivalent to the
    UTM campaign parameter. Null for Mobile rows, which use adjust_campaign or play_store_attribution_campaign
    instead.
- mode: NULLABLE
  name: attribution_content
  type: STRING
  description: The optional attribution content associated with the Firefox install, equivalent to the UTM
    content parameter. Null for Mobile rows, which use play_store_attribution_content instead.
- mode: NULLABLE
  name: attribution_experiment
  type: STRING
  description: Attribution Experiment
- mode: NULLABLE
  name: attribution_medium
  type: STRING
  description: Attribution Medium
- mode: NULLABLE
  name: attribution_source
  type: STRING
  description: Attribution Source
- mode: NULLABLE
  name: attribution_variation
  type: STRING
  description: Attribution Variation
- mode: NULLABLE
  name: city
  type: STRING
  description: City
- mode: NULLABLE
  name: country
  type: STRING
  description: Code of the country in which the activity took place, as determined
    by the IP geolocation.
- mode: NULLABLE
  name: device_model
  type: STRING
  description: Device Model
- mode: NULLABLE
  name: distribution_id
  type: STRING
  description: The distribution id associated with the install of Firefox.
- mode: NULLABLE
  name: is_default_browser
  type: BOOLEAN
  description: A flag indicating whether the browser is set as the default browser
    on the client side.
- mode: NULLABLE
  name: locale
  type: STRING
  description: Set of language- and/or country-based preferences for a user interface.
- mode: NULLABLE
  name: normalized_app_name
  type: STRING
  description: The normalized name of the Firefox application, derived from app_name in the source tables.
    Examples include 'Firefox Desktop', 'Fenix', and 'Firefox iOS'.
- mode: NULLABLE
  name: normalized_channel
  type: STRING
  description: The normalized release channel the application is being distributed on, such as 'release',
    'beta', 'nightly', 'esr', or 'aurora'. Sourced from baseline_clients_last_seen for Desktop and from
    mobile_active_users for Mobile.
- mode: NULLABLE
  name: normalized_os
  type: STRING
  description: The normalized name of the operating system running on the client. Possible values include
    Android, iOS, Linux, Windows, Mac, and Other.
- mode: NULLABLE
  name: normalized_os_version
  type: STRING
  description: The normalized, user-visible version string of the operating system (e.g. '10.0', '16').
    If version detection fails, this may be set to 'Unknown'.
- mode: NULLABLE
  name: os_version_major
  type: INTEGER
  description: The major component of the normalized OS version string, extracted as an integer from the
    first segment (e.g. for version '10.0.1', the major is 10). Defaults to 0 if the value cannot be parsed.
    client. E.g. for version "100.9.11", the major is 100.
- mode: NULLABLE
  name: os_version_minor
  type: INTEGER
  description: The minor component of the normalized OS version string, extracted as an integer from the
    second segment (e.g. for version '10.0.1', the minor is 0). Defaults to 0 if the value cannot be parsed.
    for version "100.9.11", the minor is 9.
- name: adjust_ad_group
  type: STRING
  mode: NULLABLE
  description: The Adjust ad group associated with the mobile client's install attribution. Only populated
    for Mobile rows; null for Desktop rows.
- name: adjust_campaign
  type: STRING
  mode: NULLABLE
  description: The Adjust campaign name associated with the mobile client's install attribution. Only populated
    for Mobile rows; null for Desktop rows.
- name: adjust_creative
  type: STRING
  mode: NULLABLE
  description: The Adjust creative identifier associated with the mobile client's install attribution, representing
    the specific ad creative that drove the install. Only populated for Mobile rows; null for Desktop rows.
- name: adjust_network
  type: STRING
  mode: NULLABLE
  description: The Adjust network (e.g. 'Google Ads ACI', 'Organic', 'Facebook Installs') that attributed
    the mobile install. Only populated for Mobile rows; null for Desktop rows.
- name: play_store_attribution_campaign
  type: STRING
  mode: NULLABLE
  description: The UTM campaign value from the Google Play Store install referrer, identifying the marketing
    campaign that drove the Android install. Only populated for Mobile rows; null for Desktop rows.
- name: play_store_attribution_medium
  type: STRING
  mode: NULLABLE
  description: The UTM medium value from the Google Play Store install referrer (e.g. 'organic', 'preload',
    'referral'), indicating the marketing channel that drove the Android install. Only populated for Mobile
    rows; null for Desktop rows.
- name: play_store_attribution_source
  type: STRING
  mode: NULLABLE
  description: The UTM source value from the Google Play Store install referrer (e.g. 'google-play', 'eea-browser-choice'),
    identifying the referring source that drove the Android install. Only populated for Mobile rows; null
    for Desktop rows.
- name: play_store_attribution_content
  type: STRING
  mode: NULLABLE
  description: The UTM content value from the Google Play Store install referrer, used to differentiate
    specific links or ad creatives that drove the Android install. Only populated for Mobile rows; null
    for Desktop rows.
- name: play_store_attribution_term
  type: STRING
  mode: NULLABLE
  description: The UTM term value from the Google Play Store install referrer, typically representing the
    search keyword that led to the Android install. Only populated for Mobile rows; null for Desktop rows.
- name: row_source
  type: STRING
  mode: NULLABLE
  description: Indicates whether the row originates from a Desktop or Mobile data source. Values are 'Desktop'
    or 'Mobile', allowing cohort data from both platforms to be unified in this table.
- name: play_store_attribution_install_referrer_response
  type: STRING
  mode: NULLABLE
  description: The full raw install referrer string returned by the Google Play Store (e.g. 'utm_source=google-play&utm_medium=organic'),
    containing all UTM parameters for the Android install. Only populated for Mobile rows; null for Desktop
    rows.
- name: install_source
  type: STRING
  mode: NULLABLE
  description: The package name of the app store or installer through which the application was installed
    (e.g. 'com.android.vending' for the Google Play Store, 'com.sec.android.app.samsungapps' for Samsung
    Galaxy Store). Null when the install source cannot be determined or for Desktop rows.
    the install source could not be determined.
