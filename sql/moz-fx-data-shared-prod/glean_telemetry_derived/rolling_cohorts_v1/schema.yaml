fields:
- mode: NULLABLE
  name: client_id
  type: STRING
  description: A unique identifier (UUID) for the client.
- mode: NULLABLE
  name: cohort_date
  type: DATE
  description: The date on which this client's cohort is defined, corresponding to the client's first seen
    date (i.e. the date the server first received a ping from this client).
- mode: NULLABLE
  name: activity_segment
  type: STRING
  description: Classification of users based on their browsing activity. E.g., infrequent,
    casual, regular.
- mode: NULLABLE
  name: app_version
  type: STRING
  description: User visible version string (e.g. "1.0.3") for the browser.
- mode: NULLABLE
  name: attribution_campaign
  type: STRING
  description: The optional attribution campaign associated with the Firefox installation, analogous to
    the UTM campaign parameter. Null for Mobile rows, which use adjust_campaign or play_store_attribution_campaign
    instead.
- mode: NULLABLE
  name: attribution_content
  type: STRING
  description: The optional attribution content parameter associated with the Firefox installation, analogous
    to the UTM content parameter. Null for Mobile rows.
- mode: NULLABLE
  name: attribution_experiment
  type: STRING
  description: Attribution Experiment
- mode: NULLABLE
  name: attribution_medium
  type: STRING
  description: Attribution Medium
- mode: NULLABLE
  name: attribution_source
  type: STRING
  description: Attribution Source
- mode: NULLABLE
  name: attribution_variation
  type: STRING
  description: Attribution Variation
- mode: NULLABLE
  name: city
  type: STRING
  description: City
- mode: NULLABLE
  name: country
  type: STRING
  description: Code of the country in which the activity took place, as determined
    by the IP geolocation.
- mode: NULLABLE
  name: device_model
  type: STRING
  description: Device Model
- mode: NULLABLE
  name: distribution_id
  type: STRING
  description: The distribution id associated with the install of Firefox.
- mode: NULLABLE
  name: is_default_browser
  type: BOOLEAN
  description: A flag indicating whether the browser is set as the default browser
    on the client side.
- mode: NULLABLE
  name: locale
  type: STRING
  description: Set of language- and/or country-based preferences for a user interface.
- mode: NULLABLE
  name: normalized_app_name
  type: STRING
  description: The normalized name of the Firefox application (e.g. 'Firefox Desktop', 'Fenix', 'Firefox
    iOS'), derived from the app_name field of the source telemetry tables.
- mode: NULLABLE
  name: normalized_channel
  type: STRING
  description: The normalized release channel on which the application is distributed (e.g. 'release', 'beta',
    'nightly', 'esr').
- mode: NULLABLE
  name: normalized_os
  type: STRING
  description: The normalized name of the operating system running on the client (e.g. 'Windows', 'Mac',
    'Linux', 'Android', 'iOS').
- mode: NULLABLE
  name: normalized_os_version
  type: STRING
  description: The user-visible version string of the operating system (e.g. '10.0', '15', '24.6.0'), sourced
    from baseline_clients_last_seen for Desktop and directly from mobile_active_users for Mobile.
- mode: NULLABLE
  name: os_version_major
  type: INTEGER
  description: The major (first) component of the operating system version, parsed from normalized_os_version
    (e.g. for '10.0.1' the major is 10). Defaults to 0 when the version cannot be parsed.
    client. E.g. for version "100.9.11", the major is 100.
- mode: NULLABLE
  name: os_version_minor
  type: INTEGER
  description: The minor (second) component of the operating system version, parsed from normalized_os_version
    (e.g. for '10.0.1' the minor is 0). Defaults to 0 when the version cannot be parsed.
    for version "100.9.11", the minor is 9.
- name: adjust_ad_group
  type: STRING
  mode: NULLABLE
  description: The Adjust ad group associated with the mobile install campaign. Populated only for Mobile
    rows; null for Desktop rows.
- name: adjust_campaign
  type: STRING
  mode: NULLABLE
  description: The Adjust campaign name associated with the mobile install (e.g. 'Organic' or a structured
    Google Ads campaign identifier). Populated only for Mobile rows; null for Desktop rows.
- name: adjust_creative
  type: STRING
  mode: NULLABLE
  description: The Adjust creative asset name associated with the mobile install campaign (e.g. 'Display
    ', 'Search GoogleSearch'). Populated only for Mobile rows; null for Desktop rows.
- name: adjust_network
  type: STRING
  mode: NULLABLE
  description: The advertising network attributed to the mobile install via Adjust (e.g. 'Google Ads ACI',
    'Organic', 'Facebook Installs'). Populated only for Mobile rows; null for Desktop rows.
- name: play_store_attribution_campaign
  type: STRING
  mode: NULLABLE
  description: The UTM campaign value captured via the Google Play Store install referrer (e.g. 'fb4a',
    'fxcomdefault'). Populated only for Mobile rows; null for Desktop rows.
- name: play_store_attribution_medium
  type: STRING
  mode: NULLABLE
  description: The UTM medium value captured via the Google Play Store install referrer (e.g. 'organic',
    'preload', 'referral'). Populated only for Mobile rows; null for Desktop rows.
- name: play_store_attribution_source
  type: STRING
  mode: NULLABLE
  description: The UTM source value captured via the Google Play Store install referrer (e.g. 'google-play',
    'eea-browser-choice'). Populated only for Mobile rows; null for Desktop rows.
- name: play_store_attribution_content
  type: STRING
  mode: NULLABLE
  description: The UTM content value captured via the Google Play Store install referrer, often encoding
    an extension or referral identifier. Populated only for Mobile rows; null for Desktop rows.
- name: play_store_attribution_term
  type: STRING
  mode: NULLABLE
  description: The UTM term (keyword) value captured via the Google Play Store install referrer (e.g. 'firefox',
    'mozilla firefox'). Populated only for Mobile rows; null for Desktop rows.
- name: row_source
  type: STRING
  mode: NULLABLE
  description: Indicates whether the row originates from Desktop or Mobile telemetry pipelines; values are
    'Desktop' or 'Mobile'.
- name: play_store_attribution_install_referrer_response
  type: STRING
  mode: NULLABLE
  description: The raw install referrer query string returned by the Google Play Store at install time,
    containing UTM parameters (e.g. 'utm_source=google-play&utm_medium=organic'). Populated only for Mobile
    rows; null for Desktop rows.
- name: install_source
  type: STRING
  mode: NULLABLE
  description: The package name of the application that initiated the install (e.g. 'com.android.vending'
    for the Google Play Store, 'com.sec.android.app.samsungapps' for Samsung Galaxy Store). Null when the
    install source cannot be determined or for Desktop rows.
    the install source could not be determined.
