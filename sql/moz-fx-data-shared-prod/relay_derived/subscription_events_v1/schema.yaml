fields:
- name: event_date
  type: DATE
  mode: NULLABLE
  description: The date on which the subscription lifecycle event occurred, used as
    the partition date for this table.
- name: event_type
  type: STRING
  mode: NULLABLE
  description: The high-level category of subscription lifecycle event (e.g. 'New',
    'Cancelled', 'Reactivated'). Used for aggregated funnel and churn reporting.
- name: granular_event_type
  type: STRING
  mode: NULLABLE
  description: A more specific classification of the subscription lifecycle event,
    providing additional detail beyond the high-level event_type (e.g. distinguishing
    voluntary vs. involuntary churn).
- name: plan_id
  type: STRING
  mode: NULLABLE
  description: The Stripe plan (price) ID identifying the specific billing plan associated
    with the event.
- name: country
  type: STRING
  mode: NULLABLE
  description: Two-letter ISO country code of the subscriber's billing country, as
    determined from Stripe.
- name: country_name
  type: STRING
  mode: NULLABLE
  description: The standardized full country name corresponding to the country code,
    sourced from the Mozilla static standardized country names reference table.
- name: provider
  type: STRING
  mode: NULLABLE
  description: The payment provider used to process the subscription (e.g. 'stripe',
    'iap_apple', 'iap_google').
- name: plan_amount
  type: INTEGER
  mode: NULLABLE
  description: The price of the subscription plan in the smallest currency unit (e.g.
    cents for USD), as set in Stripe.
- name: plan_currency
  type: STRING
  mode: NULLABLE
  description: The three-letter ISO 4217 currency code for the subscription plan (e.g.
    'usd', 'eur').
- name: plan_interval
  type: STRING
  mode: NULLABLE
  description: The billing interval unit for the subscription plan (e.g. 'month',
    'year').
- name: plan_interval_count
  type: INTEGER
  mode: NULLABLE
  description: The number of billing interval units between charges (e.g. 1 for monthly,
    12 for annual).
- name: product_id
  type: STRING
  mode: NULLABLE
  description: The Stripe product ID identifying the Relay product associated with
    the event.
- name: product_name
  type: STRING
  mode: NULLABLE
  description: The human-readable name of the Relay product (e.g. 'Firefox Relay',
    'Firefox Relay + VPN').
- name: pricing_plan
  type: STRING
  mode: NULLABLE
  description: A derived string combining plan interval, currency, and price to categorize
    the billing plan (e.g. '1-month-usd-1.99').
- name: promotion_codes
  type: STRING
  mode: REPEATED
  description: Array of promotion or coupon codes applied to the subscription associated
    with the event.
- name: count
  type: INTEGER
  mode: NULLABLE
  description: The number of subscription events matching the combination of event
    type, plan, country, provider, and promotion attributes on the event_date.
