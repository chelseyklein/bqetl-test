fields:
- name: partition_date
  type: DATE
  mode: NULLABLE
  description: The date of the BigQuery table partition being shredded, extracted from the task ID (e.g.
    the `20240102` portion of `project.dataset.table_v1$20240102`). Null when the task ID does not reference
    a specific dated partition.
- name: task_id
  type: STRING
  mode: NULLABLE
- name: job_id
  type: STRING
  mode: NULLABLE
- name: shredder_run_date
  type: DATE
  mode: NULLABLE
  description: The date on which the shredder run that produced this job was executed, sourced from the
    `end_date` field of the shredder state table.
- name: start_time
  type: TIMESTAMP
  mode: NULLABLE
- name: end_time
  type: TIMESTAMP
  mode: NULLABLE
- name: run_time_minutes
  type: FLOAT
  mode: NULLABLE
  description: The elapsed wall-clock time of the BigQuery job in minutes, computed as the difference between
    the job's end time and start time.
- name: avg_slots
  type: FLOAT
  mode: NULLABLE
  description: The average number of BigQuery slots consumed by the job over its duration, computed as total
    slot milliseconds divided by the job's elapsed time in milliseconds. Null when the job duration is zero
    or unavailable.
- name: total_bytes_processed
  type: INTEGER
  mode: NULLABLE
- name: tib_processed
  type: FLOAT
  mode: NULLABLE
  description: The total bytes processed by the BigQuery job converted to tebibytes (TiB). Useful for estimating
    on-demand query costs.
- name: total_slot_ms
  type: INTEGER
  mode: NULLABLE
- name: slot_hours
  type: FLOAT
  mode: NULLABLE
  description: The total slot time consumed by the BigQuery job expressed in slot-hours, computed from total
    slot milliseconds. Null when slot usage data is unavailable.
- name: deleted_row_count
  type: INTEGER
  mode: NULLABLE
- name: partition_id
  type: STRING
  mode: NULLABLE
- name: parent_task_id
  type: STRING
  mode: NULLABLE
  description: The task ID with any sampling suffix (e.g. `__sample_10_4`) stripped away, identifying the
    base table-partition target of the shredding job. For non-sampling jobs this equals the task ID itself.
- name: shredded_sample_id
  type: INTEGER
  mode: NULLABLE
  description: The sample ID extracted from a sampling task ID (e.g. the `10` in `__sample_10_4`), indicating
    which sample bucket of the table was targeted for deletion. Null for non-sampling shredder tasks.
- name: error_reason
  type: STRING
  mode: NULLABLE
- name: error_message
  type: STRING
  mode: NULLABLE
- name: job_type
  type: STRING
  mode: NULLABLE
  description: BigQuery job type, should be one of 'QUERY' or 'COPY'
