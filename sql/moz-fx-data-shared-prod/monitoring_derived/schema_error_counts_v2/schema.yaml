fields:
- mode: NULLABLE
  name: submission_date
  type: DATE
- mode: NULLABLE
  name: document_namespace
  type: STRING
- mode: NULLABLE
  name: document_type
  type: STRING
- mode: NULLABLE
  name: document_version
  type: STRING
- mode: NULLABLE
  name: hour
  type: TIMESTAMP
  description: The UTC hour in which the schema validation errors were recorded, truncated from the submission
    timestamp. Used to break down error counts at hourly granularity within a submission date.
- mode: NULLABLE
  name: job_name
  type: STRING
  description: The name of the Dataflow decoder job that processed the payload and produced the schema validation
    error (e.g., the telemetry or structured raw decoder job).
- mode: NULLABLE
  name: path
  type: STRING
- mode: NULLABLE
  name: error_count
  type: INTEGER
- mode: NULLABLE
  name: sample_error_messages
  type: STRING
  description: concatenated error messages, limited to 300 characters
- name: channel
  type: STRING
  mode: NULLABLE
- name: valid_ping_count
  type: INTEGER
  mode: NULLABLE
  description: Number of rows in the associated stable table
