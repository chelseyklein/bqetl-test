fields:

- mode: NULLABLE
  name: cache_hit
  type: BOOLEAN
  description: Whether the query results of this job were from a cache. If you have a multi-query statement job, cache_hit for your parent query is NULL.

- mode: NULLABLE
  name: creation_time
  type: TIMESTAMP
  description: (Partitioning column) Creation time of this job. Partitioning is based on the UTC time of this timestamp.

- mode: NULLABLE
  name: destination_table
  type: RECORD
  fields:
  - mode: NULLABLE
    name: project_id
    type: STRING
  description: The GCP project ID of the destination table where job results are written. Null when the
    job has no destination table.
  - mode: NULLABLE
    name: dataset_id
    type: STRING
  description: The BigQuery dataset ID of the destination table where job results are written. Null when
    the job has no destination table.
  - mode: NULLABLE
    name: table_id
    type: STRING
  description: Destination table for results, if any.

- mode: NULLABLE
  name: end_time
  type: TIMESTAMP
  description: The end time of this job, in milliseconds since the epoch. This field represents the time when the job enters the DONE state

- mode: NULLABLE
  name: error_result
  type: RECORD
  fields:
  - mode: NULLABLE
    name: reason
    type: STRING
  description: A short machine-readable error code categorizing the failure, such as 'invalidQuery', 'rateLimitExceeded',
    or 'timeout'. Null when the job completed successfully.
  - mode: NULLABLE
    name: location
    type: STRING
  description: The location within the job (e.g., 'query', 'table.write') where the error occurred. Null
    when the job completed successfully or the error location is unspecified.
  - mode: NULLABLE
    name: debug_info
    type: STRING
  description: Internal debug information associated with the job error, intended for troubleshooting. Currently
    always null in this table.
  - mode: NULLABLE
    name: message
    type: STRING
  description: Details of any errors as ErrorProto objects.

- mode: NULLABLE
  name: job_id
  type: STRING
  description: The ID of the job. For example, bquxjob_1234.

- mode: NULLABLE
  name: job_type
  type: STRING
  description: The type of the job. Can be QUERY, LOAD, EXTRACT, COPY, or NULL.

- mode: NULLABLE
  name: parent_job_id
  type: STRING
  description: ID of the parent job, if any.

- mode: NULLABLE
  name: priority
  type: STRING
  description: The priority of this job. Valid values include INTERACTIVE and BATCH.

- mode: NULLABLE
  name: project_id
  type: STRING
  description: (Clustering column) The ID of the project.

- mode: NULLABLE
  name: project_number
  type: INTEGER
  description: The number of the project.

- mode: REPEATED
  name: referenced_tables
  type: RECORD
  fields:
  - mode: NULLABLE
    name: project_id
    type: STRING
  description: The GCP project ID of a table referenced by this query job.
  - mode: NULLABLE
    name: dataset_id
    type: STRING
  description: The BigQuery dataset ID of a table referenced by this query job.
  - mode: NULLABLE
    name: table_id
    type: STRING
  description: Array of tables referenced by the job. Only populated for query jobs.

- mode: NULLABLE
  name: reservation_id
  type: STRING
  description: Name of the primary reservation assigned to this job

- mode: NULLABLE
  name: start_time
  type: TIMESTAMP
  description: The start time of this job. This field represents the time when the job transitions from the PENDING state to either RUNNING or DONE.

- mode: NULLABLE
  name: state
  type: STRING
  description: Running state of the job. Valid states include PENDING, RUNNING, and DONE.

- mode: NULLABLE
  name: statement_type
  type: STRING
  description: The type of query statement. For example, DELETE, INSERT, SCRIPT, SELECT, or UPDATE. See QueryStatementType for list of valid values.

- mode: REPEATED
  name: timeline
  type: RECORD
  fields:
  - mode: NULLABLE
    name: elapsed_ms
    type: INTEGER
  description: Milliseconds elapsed since the start of query execution at the time of this timeline snapshot.
  - mode: NULLABLE
    name: total_slot_ms
    type: INTEGER
  description: Cumulative slot-milliseconds consumed by the query up to the time of this timeline snapshot.
  - mode: NULLABLE
    name: pending_units
    type: INTEGER
  description: Number of work units that were scheduled but not yet started at the time of this timeline
    snapshot.
  - mode: NULLABLE
    name: completed_units
    type: INTEGER
  description: Number of work units that had finished execution at the time of this timeline snapshot.
  - mode: NULLABLE
    name: active_units
    type: INTEGER
  description: Number of work units actively being executed at the time of this timeline snapshot.
  - mode: NULLABLE
    name: estimated_runnable_units
    type: INTEGER
  description: Query timeline of the job. Contains snapshots of query execution.

- mode: NULLABLE
  name: total_bytes_billed
  type: INTEGER
  description: If the project is configured to use on-demand pricing, then this field contains the total bytes billed for the job.

- mode: NULLABLE
  name: total_bytes_processed
  type: INTEGER
  description: Total bytes processed by the job.

- mode: NULLABLE
  name: total_modified_partitions
  type: INTEGER

  description: The total number of partitions modified by the job. Populated for LOAD and QUERY jobs that
    write to partitioned tables; null for jobs that do not modify partitions.
- mode: NULLABLE
  name: total_slot_ms
  type: INTEGER
  description: The total number of partitions the job modified. This field is populated for LOAD and QUERY jobs.

- mode: NULLABLE
  name: user_email
  type: STRING
  description: (Clustering column) Email address or service account of the user who ran the job.

- mode: NULLABLE
  name: query_info_resource_warning
  type: STRING
  description: The warning message that appears if the resource usage during query processing is above the internal threshold of the system.

- mode: NULLABLE
  name: query_info_query_hashes_normalized_literals
  type: STRING
  description: Contains the hashes of the query. normalized_literals is a hexadecimal STRING hash that ignores comments, parameter values, UDFs, and literals.

- mode: NULLABLE
  name: transferred_bytes
  type: INTEGER
  description: Total bytes transferred for cross-cloud queries, such as BigQuery Omni cross-cloud transfer jobs.

- mode: NULLABLE
  name: creation_date
  type: DATE
  description: Date of the creation_time

- mode: NULLABLE
  name: materialized_view_statistics
  type: RECORD
  description: Statistics of materialized views considered in a query job.
  fields:
  - mode: REPEATED
    name: materialized_view
    type: RECORD
    description: A materialized view considered for a query job.
    fields:
    - mode: NULLABLE
      name: table_reference
      type: RECORD
      description: The candidate materialized view.
      fields:
      - mode: NULLABLE
        name: project_id
        type: STRING
  description: The GCP project ID of the candidate materialized view table considered for query optimization.
      - mode: NULLABLE
        name: dataset_id
        type: STRING
  description: The BigQuery dataset ID of the candidate materialized view table considered for query optimization.
      - mode: NULLABLE
        name: table_id
        type: STRING
  description: The table ID of the candidate materialized view table considered for query optimization.
    - mode: NULLABLE
      name: chosen
      type: BOOLEAN
      description: Whether the materialized view is chosen for the query.
    - mode: NULLABLE
      name: estimated_bytes_saved
      type: INTEGER
      description: If present, specifies a best-effort estimation of the bytes saved by using the materialized view rather than its base tables.
    - mode: NULLABLE
      name: rejected_reason
      type: STRING
      description: If present, specifies the reason why the materialized view was not chosen for the query.

- mode: NULLABLE
  name: query_dialect
  type: STRING
  description: The query dialect used for the job.

- mode: NULLABLE
  name: bi_engine_mode
  type: STRING
  description: High-level BI Engine status for the job (e.g., ENABLED, DISABLED, PARTIAL).

- mode: NULLABLE
  name: acceleration_mode
  type: STRING
  description: How BI Engine was used when acceleration occurred (e.g., FULL_QUERY, FULL_INPUT, PARTIAL_INPUT).

- mode: REPEATED
  name: bi_engine_reasons
  type: RECORD
  description: Reasons explaining why BI Engine was PARTIAL or DISABLED for this job.
  fields:
  - mode: NULLABLE
    name: code
    type: STRING
    description: Machine-readable reason code.
  - mode: NULLABLE
    name: message
    type: STRING
    description: Human-readable explanation of the reason.
