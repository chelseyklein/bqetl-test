fields:
- mode: NULLABLE
  name: external_id
  type: STRING
  description: The unique identifier for the user in Braze, corresponding to the CTMS
    email_id UUID. Used to join Braze email subscription group records to the user
    profile in users_v1.
- fields:
  - mode: NULLABLE
    name: subscription_name
    type: STRING
    description: The Braze subscription group slug (e.g., 'mozilla-and-you', 'guardian-vpn-waitlist'),
      matching the braze_subscription_name in subscriptions_map_v1.
  - mode: NULLABLE
    name: firefox_subscription_id
    type: STRING
    description: The UUID identifying this subscription group in the Firefox-branded
      Braze workspace, sourced from subscriptions_map_v1.
  - mode: NULLABLE
    name: mozilla_subscription_id
    type: STRING
    description: The UUID identifying this subscription group in the Mozilla production
      Braze workspace, sourced from subscriptions_map_v1.
  - mode: NULLABLE
    name: mozilla_dev_subscription_id
    type: STRING
    description: The UUID identifying this subscription group in the Mozilla development/staging
      Braze workspace, sourced from subscriptions_map_v1. Used for testing and QA.
  - mode: NULLABLE
    name: subscription_state
    type: STRING
    description: The current state of the user's subscription group membership. Values
      are 'subscribed' (user is actively subscribed) or 'unsubscribed' (user has opted
      out).
  - mode: NULLABLE
    name: update_timestamp
    type: TIMESTAMP
    description: Timestamp of the most recent update to this subscription group record,
      derived from the latest update_timestamp across the corresponding newsletter
      or waitlist entries.
  mode: REPEATED
  name: subscriptions
  type: RECORD
  description: Array of Braze email subscription group records for the user, derived
    from user_profiles_v1 newsletters and waitlists, mapped to Braze subscription
    group IDs via subscriptions_map_v1.
