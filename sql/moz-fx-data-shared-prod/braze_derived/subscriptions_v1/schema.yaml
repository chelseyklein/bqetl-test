fields:
- mode: NULLABLE
  name: external_id
  type: STRING
  description: Unique identifier for the user in Braze, corresponding to the CTMS
    email_id. Links subscription records to the Braze user profile.
- fields:
  - mode: NULLABLE
    name: subscription_name
    type: STRING
    description: The Braze slug for the subscription group, e.g. 'mozilla-and-you'
      or 'guardian-vpn-waitlist'. Derived from newsletter and waitlist names.
  - mode: NULLABLE
    name: firefox_subscription_id
    type: STRING
    description: UUID identifying this subscription group in the Firefox-branded Braze
      workspace, joined from subscriptions_map_v1.
  - mode: NULLABLE
    name: mozilla_subscription_id
    type: STRING
    description: UUID identifying this subscription group in the Mozilla production
      Braze workspace, joined from subscriptions_map_v1.
  - mode: NULLABLE
    name: mozilla_dev_subscription_id
    type: STRING
    description: UUID identifying this subscription group in the Mozilla development
      Braze workspace, used for testing.
  - mode: NULLABLE
    name: subscription_state
    type: STRING
    description: The subscription state for this group, either 'subscribed' or 'unsubscribed',
      reflecting the user's latest opt-in status.
  - mode: NULLABLE
    name: update_timestamp
    type: TIMESTAMP
    description: Timestamp of the most recent update to this subscription group record
      in CTMS.
  mode: REPEATED
  name: subscriptions
  type: RECORD
