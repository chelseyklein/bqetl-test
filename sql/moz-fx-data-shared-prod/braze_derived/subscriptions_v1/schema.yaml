fields:
- mode: NULLABLE
  name: external_id
  type: STRING
  description: The unique identifier for the user in Braze, corresponding to the CTMS
    email_id (a UUID). Used to link subscription group memberships back to the user's
    Braze profile.
- fields:
  - mode: NULLABLE
    name: subscription_name
    type: STRING
  - mode: NULLABLE
    name: firefox_subscription_id
    type: STRING
  - mode: NULLABLE
    name: mozilla_subscription_id
    type: STRING
  - mode: NULLABLE
    name: mozilla_dev_subscription_id
    type: STRING
  - mode: NULLABLE
    name: subscription_state
    type: STRING
  - mode: NULLABLE
    name: update_timestamp
    type: TIMESTAMP
  mode: REPEATED
  name: subscriptions
  type: RECORD
  description: An array of Braze subscription group membership records for the user,
    combining both newsletter and waitlist subscriptions. Each element includes the
    subscription name, Braze subscription group IDs for each workspace, the current
    state ('subscribed' or 'unsubscribed'), and the last update timestamp.
