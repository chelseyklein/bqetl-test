fields:
- mode: NULLABLE
  name: external_id
  type: STRING
  description: The unique identifier for the user in Braze, matching the CTMS email_id
    UUID. Used to join subscription data back to the main user record.
- fields:
  - mode: NULLABLE
    name: subscription_name
    type: STRING
    description: The Braze subscription group slug identifying the newsletter or waitlist
      (e.g. 'mozilla-and-you', 'guardian-vpn-waitlist').
  - mode: NULLABLE
    name: firefox_subscription_id
    type: STRING
    description: The UUID identifying this subscription group in the Firefox-branded
      Braze workspace. Used when syncing subscription state to Firefox Braze.
  - mode: NULLABLE
    name: mozilla_subscription_id
    type: STRING
    description: The UUID identifying this subscription group in the Mozilla production
      Braze workspace. Used when syncing subscription state to Mozilla Braze.
  - mode: NULLABLE
    name: mozilla_dev_subscription_id
    type: STRING
    description: The UUID identifying this subscription group in the Mozilla development
      Braze workspace. Used for testing and QA subscription syncs.
  - mode: NULLABLE
    name: subscription_state
    type: STRING
    description: The current subscription state for the user and group, either 'subscribed'
      or 'unsubscribed'. Derived from newsletter and waitlist records.
  - mode: NULLABLE
    name: update_timestamp
    type: TIMESTAMP
    description: Timestamp of the most recent update to the user's subscription state
      for this group, from the underlying newsletter or waitlist record.
  mode: REPEATED
  name: subscriptions
  type: RECORD
  description: Array of Braze subscription group memberships for the user, each describing
    the user's current state for one subscription group.
