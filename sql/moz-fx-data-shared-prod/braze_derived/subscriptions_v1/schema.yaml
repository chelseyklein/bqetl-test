fields:
- mode: NULLABLE
  name: external_id
  type: STRING
  description: The unique identifier for the user in Braze, matching the CTMS email_id
    (UUID). Used to join across braze_derived tables.
- fields:
  - mode: NULLABLE
    name: subscription_name
    type: STRING
    description: The Braze subscription group slug (e.g. 'mozilla-and-you', 'guardian-vpn-waitlist').
      Matches braze_subscription_name in subscriptions_map_v1.
  - mode: NULLABLE
    name: firefox_subscription_id
    type: STRING
    description: UUID identifying this subscription group in the Firefox-branded Braze
      workspace.
  - mode: NULLABLE
    name: mozilla_subscription_id
    type: STRING
    description: UUID identifying this subscription group in the Mozilla production
      Braze workspace.
  - mode: NULLABLE
    name: mozilla_dev_subscription_id
    type: STRING
    description: UUID identifying this subscription group in the Mozilla development/staging
      Braze workspace, used for testing and QA.
  - mode: NULLABLE
    name: subscription_state
    type: STRING
    description: The current subscription state for the user. Either 'subscribed'
      (opted in) or 'unsubscribed' (opted out).
  - mode: NULLABLE
    name: update_timestamp
    type: TIMESTAMP
    description: Timestamp when this subscription group record was most recently updated
      in CTMS.
  mode: REPEATED
  name: subscriptions
  type: RECORD
  description: Array of Braze subscription group records for this user, mapping newsletters
    and waitlists to their Braze subscription group IDs.
