fields:
- mode: NULLABLE
  name: external_id
  type: STRING
  description: The unique identifier for the user in Braze, corresponding to the CTMS
    email_id (a UUID). Used to join newsletter subscription records back to the user's
    Braze profile.
- fields:
  - mode: NULLABLE
    name: newsletter_name
    type: STRING
  - mode: NULLABLE
    name: subscribed
    type: BOOLEAN
  - mode: NULLABLE
    name: newsletter_lang
    type: STRING
  - mode: NULLABLE
    name: newsletter_source
    type: STRING
  - mode: NULLABLE
    name: create_timestamp
    type: TIMESTAMP
  - mode: NULLABLE
    name: update_timestamp
    type: TIMESTAMP
  mode: REPEATED
  name: newsletters
  type: RECORD
  description: An array of newsletter subscription records for the user, each describing
    one newsletter the user is or was subscribed to. Only users with at least one
    active subscription are included. Each element contains the newsletter name, subscription
    status, language, source, and creation/update timestamps.
