fields:
- mode: NULLABLE
  name: external_id
  type: STRING
  description: The unique identifier for the user in Braze, corresponding to the CTMS
    email_id (a UUID). Used to join newsletter subscription records to Braze user
    profiles.
- fields:
  - mode: NULLABLE
    name: newsletter_name
    type: STRING
    description: The slug identifying the newsletter in CTMS and Basket (e.g., 'mozilla-and-you',
      'security-privacy-news').
  - mode: NULLABLE
    name: subscribed
    type: BOOLEAN
    description: True if the user is currently subscribed to this newsletter; false
      if they have unsubscribed.
  - mode: NULLABLE
    name: newsletter_lang
    type: STRING
    description: The lowercased language code for the newsletter subscription (e.g.,
      'en', 'fr'), indicating the user's preferred language for this newsletter.
  - mode: NULLABLE
    name: newsletter_source
    type: STRING
    description: The source or channel through which the user subscribed to the newsletter
      (e.g., a URL or referral identifier), as recorded in CTMS.
  - mode: NULLABLE
    name: create_timestamp
    type: TIMESTAMP
    description: Timestamp when the newsletter subscription record was first created
      in CTMS.
  - mode: NULLABLE
    name: update_timestamp
    type: TIMESTAMP
    description: Timestamp when the newsletter subscription record was most recently
      updated in CTMS.
  mode: REPEATED
  name: newsletters
  type: RECORD
  description: A repeated record of all newsletter subscriptions for this user sourced
    from the CTMS newsletters table. Only users with at least one active subscription
    are included.
