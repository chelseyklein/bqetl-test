fields:
- mode: NULLABLE
  name: external_id
  type: STRING
  description: The unique identifier for the user in Braze, corresponding to the CTMS
    email_id UUID. Used to join product subscription records back to the Braze user
    profile in users_v1.
- fields:
  - mode: NULLABLE
    name: provider
    type: STRING
    description: The billing provider for this subscription (e.g., 'stripe', 'apple',
      'google'), sourced from subscription_platform.logical_subscriptions.
  - mode: NULLABLE
    name: payment_provider
    type: STRING
    description: The payment processor used for this subscription (e.g., 'stripe',
      'braintree'), which may differ from the provider for some app store subscriptions.
  - mode: NULLABLE
    name: product_name
    type: STRING
    description: The human-readable name of the subscribed Mozilla product (e.g.,
      'Mozilla VPN', 'Firefox Relay').
  - mode: NULLABLE
    name: service_name
    type: STRING
    description: The internal service name associated with this subscription, sourced
      from the services array in logical_subscriptions (e.g., 'vpn', 'relay').
  - mode: NULLABLE
    name: subscription_plan_id
    type: STRING
    description: The provider-specific plan identifier for the subscription (e.g.,
      a Stripe price ID), sourced from subscription_platform as provider_plan_id.
  - mode: NULLABLE
    name: subscription_product_id
    type: STRING
    description: The provider-specific product identifier for the subscription (e.g.,
      a Stripe product ID), sourced from subscription_platform as provider_product_id.
  - mode: NULLABLE
    name: subscription_started_at
    type: TIMESTAMP
    description: Timestamp when the subscription became active, sourced from the started_at
      field in subscription_platform.logical_subscriptions.
  - mode: NULLABLE
    name: subscription_ended_at
    type: TIMESTAMP
    description: Timestamp when the subscription ended or was cancelled. NULL if the
      subscription is still active.
  - mode: NULLABLE
    name: subscription_summary
    type: STRING
    description: A human-readable summary of the subscription plan (e.g., 'Mozilla
      VPN Monthly'), sourced from plan_summary in subscription_platform.
  - mode: NULLABLE
    name: subscription_billing_interval
    type: STRING
    description: The billing interval type for the subscription plan (e.g., 'month',
      'year'), sourced from plan_interval_type in subscription_platform.
  - mode: NULLABLE
    name: subscription_interval_count
    type: INTEGER
    description: The number of billing interval units per billing cycle (e.g., 1 for
      monthly, 12 for annual), sourced from plan_interval_count in subscription_platform.
  - mode: NULLABLE
    name: subscription_currency
    type: STRING
    description: The three-letter ISO currency code for the subscription plan (e.g.,
      'usd', 'eur'), sourced from plan_currency in subscription_platform.
  - mode: NULLABLE
    name: subscription_amount
    type: NUMERIC
    description: The subscription price per billing cycle as a numeric value in the
      plan's currency (e.g., 4.99 for $4.99/month), sourced from plan_amount in subscription_platform.
  - mode: NULLABLE
    name: is_bundle
    type: BOOLEAN
    description: True if this subscription is part of a bundled product offering (e.g.,
      Mozilla VPN + Firefox Relay bundle); false otherwise.
  - mode: NULLABLE
    name: is_trial
    type: BOOLEAN
    description: True if the subscription is in a free trial period; false if the
      user is on a paid subscription.
  - mode: NULLABLE
    name: is_active
    type: BOOLEAN
    description: True if the subscription is currently active; false if it has ended,
      been cancelled, or is otherwise inactive.
  - mode: NULLABLE
    name: subscription_status
    type: STRING
    description: The provider-reported status string for this subscription (e.g.,
      'active', 'cancelled', 'past_due'), sourced from provider_status in subscription_platform.
  - mode: NULLABLE
    name: subscription_country_code
    type: STRING
    description: The lowercased two-letter ISO country code associated with the subscription's
      billing address or location (e.g., 'us', 'de').
  - mode: NULLABLE
    name: subscription_country_name
    type: STRING
    description: The human-readable country name associated with the subscription's
      billing address or location (e.g., 'United States', 'Germany').
  - mode: NULLABLE
    name: current_period_started_at
    type: TIMESTAMP
    description: Timestamp when the current billing period began for this subscription.
  - mode: NULLABLE
    name: current_period_ends_at
    type: TIMESTAMP
    description: Timestamp when the current billing period ends for this subscription.
      After this date the subscription will renew or expire.
  - mode: NULLABLE
    name: is_auto_renew
    type: BOOLEAN
    description: True if the subscription is set to automatically renew at the end
      of the current billing period; false if the user has disabled auto-renewal.
  - mode: NULLABLE
    name: auto_renew_disabled_at
    type: TIMESTAMP
    description: Timestamp when the user disabled auto-renewal for this subscription.
      NULL if auto-renewal has never been disabled.
  - mode: NULLABLE
    name: has_refunds
    type: BOOLEAN
    description: True if any refund has been issued for this subscription; false otherwise.
  - mode: NULLABLE
    name: has_fraudulent_charges
    type: BOOLEAN
    description: True if any fraudulent charges have been recorded for this subscription;
      false otherwise.
  - mode: NULLABLE
    name: first_touch_impression_at
    type: TIMESTAMP
    description: Timestamp of the user's first marketing touchpoint impression before
      subscribing. Always NULL in the current ETL — first-touch attribution is not
      yet populated.
  - mode: NULLABLE
    name: first_touch_entrypoint
    type: STRING
    description: The FxA entrypoint URL parameter recorded at the user's first marketing
      touchpoint. Always NULL in the current ETL.
  - mode: NULLABLE
    name: first_touch_entrypoint_experiment
    type: STRING
    description: The experiment identifier recorded at the user's first marketing
      touchpoint. Always NULL in the current ETL.
  - mode: NULLABLE
    name: first_touch_entrypoint_variation
    type: STRING
    description: The experiment variation recorded at the user's first marketing touchpoint.
      Always NULL in the current ETL.
  - mode: NULLABLE
    name: first_touch_utm_campaign
    type: STRING
    description: The UTM campaign parameter recorded at the user's first marketing
      touchpoint. Always NULL in the current ETL.
  - mode: NULLABLE
    name: first_touch_utm_content
    type: STRING
    description: The UTM content parameter recorded at the user's first marketing
      touchpoint. Always NULL in the current ETL.
  - mode: NULLABLE
    name: first_touch_utm_medium
    type: STRING
    description: The UTM medium parameter recorded at the user's first marketing touchpoint.
      Always NULL in the current ETL.
  - mode: NULLABLE
    name: first_touch_utm_source
    type: STRING
    description: The UTM source parameter recorded at the user's first marketing touchpoint.
      Always NULL in the current ETL.
  - mode: NULLABLE
    name: first_touch_utm_term
    type: STRING
    description: The UTM term parameter recorded at the user's first marketing touchpoint.
      Always NULL in the current ETL.
  - mode: NULLABLE
    name: last_touch_impression_at
    type: TIMESTAMP
    description: Timestamp of the user's most recent marketing touchpoint impression
      before subscribing, sourced from last_touch_attribution in subscription_platform.
  - mode: NULLABLE
    name: last_touch_entrypoint
    type: STRING
    description: The FxA entrypoint URL parameter recorded at the user's most recent
      marketing touchpoint before subscribing.
  - mode: NULLABLE
    name: last_touch_entrypoint_experiment
    type: STRING
    description: The experiment identifier recorded at the user's most recent marketing
      touchpoint before subscribing.
  - mode: NULLABLE
    name: last_touch_entrypoint_variation
    type: STRING
    description: The experiment variation recorded at the user's most recent marketing
      touchpoint before subscribing.
  - mode: NULLABLE
    name: last_touch_utm_campaign
    type: STRING
    description: The UTM campaign parameter recorded at the user's most recent marketing
      touchpoint before subscribing.
  - mode: NULLABLE
    name: last_touch_utm_content
    type: STRING
    description: The UTM content parameter recorded at the user's most recent marketing
      touchpoint before subscribing.
  - mode: NULLABLE
    name: last_touch_utm_medium
    type: STRING
    description: The UTM medium parameter recorded at the user's most recent marketing
      touchpoint before subscribing.
  - mode: NULLABLE
    name: last_touch_utm_source
    type: STRING
    description: The UTM source parameter recorded at the user's most recent marketing
      touchpoint before subscribing.
  - mode: NULLABLE
    name: last_touch_utm_term
    type: STRING
    description: The UTM term parameter recorded at the user's most recent marketing
      touchpoint before subscribing.
  - mode: NULLABLE
    name: subscription_created_at
    type: TIMESTAMP
    description: Timestamp when the subscription record was first created at the provider,
      sourced from provider_subscription_created_at in subscription_platform.
  - mode: NULLABLE
    name: subscription_updated_at
    type: TIMESTAMP
    description: Timestamp when the subscription record was most recently updated
      at the provider, sourced from provider_subscription_updated_at in subscription_platform.
  mode: REPEATED
  name: products
  type: RECORD
  description: Array of Mozilla product subscription records for the user, sourced
    from subscription_platform.logical_subscriptions joined to ctms_braze.ctms_fxa.
    Each element represents one subscription across all Mozilla services.
