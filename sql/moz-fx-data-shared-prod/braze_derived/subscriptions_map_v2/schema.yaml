fields:
- mode: NULLABLE
  name: braze_subscription_name
  type: STRING
  description: The slug identifying the subscription group in Braze (e.g., 'mozilla-and-you',
    'guardian-vpn-waitlist'). Used to map CTMS newsletter and waitlist names to their
    Braze equivalents.
- mode: NULLABLE
  name: description
  type: STRING
  description: A human-readable name for the subscription group (e.g., 'Mozilla VPN
    Waitlist', 'Firefox News'). Used for display and reporting purposes.
- mode: NULLABLE
  name: mozilla_subscription_id
  type: STRING
  description: The UUID identifying this subscription group in the Mozilla production
    Braze workspace.
- mode: NULLABLE
  name: firefox_subscription_id
  type: STRING
  description: The UUID identifying this subscription group in the Firefox-branded
    Braze workspace.
- mode: NULLABLE
  name: mozilla_dev_subscription_id
  type: STRING
  description: The UUID identifying this subscription group in the Mozilla development/staging
    Braze workspace, used for testing and QA.
- mode: NULLABLE
  name: basket_slug
  type: STRING
  description: The slug identifying the corresponding newsletter or waitlist in Mozilla's
    Basket email subscription service. Matches the name used in CTMS newsletter and
    waitlist records.
