fields:
- mode: NULLABLE
  name: braze_subscription_name
  type: STRING
  description: Slug identifying the subscription group in Braze, e.g. 'mozilla-and-you'.
    Maps CTMS newsletter and waitlist names to their Braze equivalents.
- mode: NULLABLE
  name: description
  type: STRING
  description: Human-readable name for the subscription group, e.g. 'Mozilla VPN Waitlist'.
    Used for display and reporting.
- mode: NULLABLE
  name: mozilla_subscription_id
  type: STRING
  description: UUID identifying this subscription group in the Mozilla production
    Braze workspace.
- mode: NULLABLE
  name: firefox_subscription_id
  type: STRING
  description: UUID identifying this subscription group in the Firefox-branded Braze
    workspace.
- mode: NULLABLE
  name: mozilla_dev_subscription_id
  type: STRING
  description: UUID identifying this subscription group in the Mozilla development
    Braze workspace, used for testing.
- mode: NULLABLE
  name: basket_slug
  type: STRING
  description: Slug identifying the corresponding newsletter or waitlist in Mozilla's
    Basket service. Matches the name used in CTMS records.
