fields:
- mode: NULLABLE
  name: external_id
  type: STRING
  description: The unique identifier for the user in Braze, corresponding to the CTMS
    email_id UUID. Used to join waitlist records back to the Braze user profile in
    users_v1.
- fields:
  - mode: NULLABLE
    name: waitlist_name
    type: STRING
    description: The slug identifying the waitlist in CTMS (e.g., 'vpn', 'relay-phone-masking'),
      representing a Mozilla product the user has joined a waitlist for.
  - mode: NULLABLE
    name: waitlist_geo
    type: STRING
    description: The lowercased geographic region or country code the user specified
      when joining the waitlist (e.g., 'us', 'ca'), extracted from the fields JSON
      in ctms_waitlists. NULL when no geo preference was captured.
  - mode: NULLABLE
    name: waitlist_platform
    type: STRING
    description: The lowercased platform the user specified when joining the waitlist
      (e.g., 'ios', 'android'), extracted from the fields JSON in ctms_waitlists.
      NULL when no platform preference was captured.
  - mode: NULLABLE
    name: waitlist_source
    type: STRING
    description: The lowercased source or channel through which the user joined the
      waitlist, as recorded in ctms_waitlists.
  - mode: NULLABLE
    name: create_timestamp
    type: TIMESTAMP
    description: Timestamp when this waitlist record was first created in CTMS.
  - mode: NULLABLE
    name: subscribed
    type: BOOLEAN
    description: True if the user is currently on the waitlist; false if they have
      been removed or unsubscribed.
  - mode: NULLABLE
    name: unsub_reason
    type: STRING
    description: The reason provided for the user's removal from the waitlist. NULL
      when the user is still subscribed or no reason was recorded.
  - mode: NULLABLE
    name: update_timestamp
    type: TIMESTAMP
    description: Timestamp when this waitlist record was most recently updated in
      CTMS.
  mode: REPEATED
  name: waitlists
  type: RECORD
  description: Array of product waitlist records for the user, sourced from ctms_braze.ctms_waitlists.
    Only users with at least one active waitlist subscription are included.
