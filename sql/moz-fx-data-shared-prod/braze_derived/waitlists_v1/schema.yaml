fields:
- mode: NULLABLE
  name: external_id
  type: STRING
  description: The unique identifier for the user in Braze, corresponding to the CTMS
    email_id (a UUID). Used to join waitlist records back to the user's Braze profile.
- fields:
  - mode: NULLABLE
    name: waitlist_name
    type: STRING
  - mode: NULLABLE
    name: waitlist_geo
    type: STRING
  - mode: NULLABLE
    name: waitlist_platform
    type: STRING
  - mode: NULLABLE
    name: waitlist_source
    type: STRING
  - mode: NULLABLE
    name: create_timestamp
    type: TIMESTAMP
  - mode: NULLABLE
    name: subscribed
    type: BOOLEAN
  - mode: NULLABLE
    name: unsub_reason
    type: STRING
  - mode: NULLABLE
    name: update_timestamp
    type: TIMESTAMP
  mode: REPEATED
  name: waitlists
  type: RECORD
  description: An array of product waitlist registration records for the user, sourced
    from ctms_braze.ctms_waitlists. Each element describes one waitlist entry including
    name, geographic region, platform, sign-up source, subscription status, unsubscribe
    reason, and creation/update timestamps. Only users with at least one active waitlist
    subscription are included.
