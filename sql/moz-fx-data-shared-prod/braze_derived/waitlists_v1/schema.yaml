fields:
- mode: NULLABLE
  name: external_id
  type: STRING
  description: The unique identifier for the user in Braze, corresponding to the CTMS
    email_id (a UUID). Joins to braze_derived.users_v1 to ensure only known Braze
    users are included. Always populated; ~2.9M distinct users (sampled 2026-05-28).
- fields:
  - mode: NULLABLE
    name: waitlist_name
    type: STRING
  - mode: NULLABLE
    name: waitlist_geo
    type: STRING
  - mode: NULLABLE
    name: waitlist_platform
    type: STRING
  - mode: NULLABLE
    name: waitlist_source
    type: STRING
  - mode: NULLABLE
    name: create_timestamp
    type: TIMESTAMP
  - mode: NULLABLE
    name: subscribed
    type: BOOLEAN
  - mode: NULLABLE
    name: unsub_reason
    type: STRING
  - mode: NULLABLE
    name: update_timestamp
    type: TIMESTAMP
  mode: REPEATED
  name: waitlists
  type: RECORD
  description: Array of waitlist membership records for this user sourced from ctms_braze.ctms_waitlists,
    ordered by update time, create time, and waitlist name. Only users with at least
    one active subscription (subscribed = TRUE) are included. Each element contains
    the waitlist name, geographic region, platform, source, subscription status, unsubscribe
    reason, and creation/update timestamps.
