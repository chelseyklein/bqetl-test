fields:
- mode: NULLABLE
  name: external_id
  type: STRING
  description: The unique identifier for the user in Braze, matching the CTMS email_id
    UUID. Used to join waitlist data back to the main user record.
- fields:
  - mode: NULLABLE
    name: waitlist_name
    type: STRING
    description: The internal slug identifying the product waitlist (e.g. 'vpn', 'relay-phone-masking').
      Sourced from CTMS.
  - mode: NULLABLE
    name: waitlist_geo
    type: STRING
    description: Lowercased geographic region or country where the user signed up
      for the waitlist (e.g. 'us', 'gb'). From the CTMS waitlist fields JSON.
  - mode: NULLABLE
    name: waitlist_platform
    type: STRING
    description: Lowercased platform the user indicated when joining the waitlist
      (e.g. 'windows', 'mac'). From the CTMS waitlist fields JSON.
  - mode: NULLABLE
    name: waitlist_source
    type: STRING
    description: The lowercased source or channel through which the user joined the
      waitlist (e.g. 'firefox', 'product page'). Sourced from CTMS.
  - mode: NULLABLE
    name: create_timestamp
    type: TIMESTAMP
    description: Timestamp when this waitlist record was first created in CTMS.
  - mode: NULLABLE
    name: subscribed
    type: BOOLEAN
    description: True if the user is currently on this waitlist; false if they have
      unsubscribed or been removed.
  - mode: NULLABLE
    name: unsub_reason
    type: STRING
    description: The reason provided when the user unsubscribed from the waitlist.
      NULL if the user is still subscribed or no reason was given.
  - mode: NULLABLE
    name: update_timestamp
    type: TIMESTAMP
    description: Timestamp when this waitlist record was most recently updated in
      CTMS.
  mode: REPEATED
  name: waitlists
  type: RECORD
  description: Array of product waitlist records for the user, each describing a single
    waitlist and the user's current membership state.
