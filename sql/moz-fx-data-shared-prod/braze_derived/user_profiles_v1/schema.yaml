fields:
- name: external_id
  type: STRING
  mode: NULLABLE
  description: The unique identifier for the user in Braze, corresponding to the CTMS
    email_id UUID. Sourced from braze_derived.users_v1 and used to join newsletter,
    waitlist, and product subscription data.
- name: email
  type: STRING
  mode: NULLABLE
  description: The lowercased primary email address of the user, sourced from braze_derived.users_v1.
    Users on the marketing suppression list or who have opted out of all newsletters
    are excluded.
- name: mailing_country
  type: STRING
  mode: NULLABLE
  description: The two-letter ISO country code representing the user's mailing country
    as stored in CTMS. NULL for approximately 36% of users where country information
    is unavailable.
- name: email_subscribe
  type: STRING
  mode: NULLABLE
  description: The user's email subscription status in Braze. Values are 'opted_in'
    (double opt-in confirmed, ~99%) or 'subscribed' (single opt-in, no opt-out, ~1%).
    Sourced from braze_derived.users_v1.
- name: basket_token
  type: STRING
  mode: NULLABLE
  description: A UUID token that uniquely identifies the user in Mozilla's Basket
    email subscription service. Nearly always populated; NULL for fewer than 0.01%
    of rows.
- name: email_lang
  type: STRING
  mode: NULLABLE
  description: The user's preferred language for email communications, stored as a
    lowercased BCP 47 language code (e.g., 'en', 'fr', 'de'). Sourced from CTMS via
    braze_derived.users_v1.
- name: create_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user record was first created in the Contact Management
    System (CTMS). Always populated.
- name: update_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user record was most recently updated in the Contact
    Management System (CTMS). Always populated.
- name: fxa_id_sha256
  type: STRING
  mode: NULLABLE
  description: SHA-256 hash of the user's Firefox Accounts (FxA) user ID. Used to
    link to FxA records without exposing raw account identifiers. NULL (~7.5%) when
    the user has no associated FxA account.
- name: has_fxa
  type: BOOLEAN
  mode: NULLABLE
  description: True if the user has an active, non-deleted Firefox Accounts (FxA)
    account linked to their email; false otherwise. Approximately 92.5% of users in
    this table have an FxA account.
- name: fxa_primary_email
  type: STRING
  mode: NULLABLE
  description: The primary email address registered in Firefox Accounts (FxA), lowercased.
    Populated only when it differs from the CTMS email address; NULL for ~99.5% of
    users.
- name: fxa_lang
  type: STRING
  mode: NULLABLE
  description: The browser-reported Accept-Language string from the user's Firefox
    Accounts session (e.g., 'en-US,en;q=0.5'). NULL for ~47% of users where FxA language
    data is unavailable.
- name: fxa_first_service
  type: STRING
  mode: NULLABLE
  description: The first Mozilla service the user used to create or authenticate their
    Firefox Accounts (FxA) account (e.g., 'sync', 'fenix', 'pocket-web', 'firefox-ios').
    NULL for ~49% of users.
- name: fxa_created_at
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user's Firefox Accounts (FxA) account was created.
    NULL for ~7.6% of users who have no associated FxA account.
