fields:
- name: external_id
  type: STRING
  mode: NULLABLE
  description: The unique identifier for the user in Braze, sourced from the CTMS
    email_id (a UUID). Used to link Braze user records back to the Contact Management
    System.
- name: email
  type: STRING
  mode: NULLABLE
  description: The lowercased primary email address of the user, sourced from CTMS
    via users_v1. Users on the marketing suppression list or who have opted out of
    all newsletters are excluded.
- name: mailing_country
  type: STRING
  mode: NULLABLE
  description: The two-letter ISO country code representing the user's mailing country
    as stored in CTMS. NULL for approximately 36% of users where country information
    is unavailable.
- name: email_subscribe
  type: STRING
  mode: NULLABLE
  description: The user's email subscription status in Braze. Values are 'opted_in'
    (~99%, double opt-in confirmed) or 'subscribed' (~1%, single opt-in without opt-out).
- name: basket_token
  type: STRING
  mode: NULLABLE
  description: A UUID token that uniquely identifies the user in Mozilla's Basket
    email subscription service. Nearly always populated; NULL for fewer than 0.01%
    of rows.
- name: email_lang
  type: STRING
  mode: NULLABLE
  description: The user's preferred language for email communications as a lowercased
    BCP 47 language code (e.g., 'en', 'fr', 'de'). Sourced from CTMS.
- name: create_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user record was first created in the Contact Management
    System (CTMS). Always populated.
- name: update_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user record was most recently updated in the Contact
    Management System (CTMS). Always populated.
- name: fxa_id_sha256
  type: STRING
  mode: NULLABLE
  description: SHA-256 hash of the user's Firefox Accounts (FxA) user ID. Used to
    link to FxA records without exposing raw account identifiers. NULL (~7.5%) when
    the user has no associated FxA account.
- name: has_fxa
  type: BOOLEAN
  mode: NULLABLE
  description: True if the user has an active, non-deleted Firefox Accounts (FxA)
    account linked to their email; false otherwise. Approximately 92.5% of users have
    an FxA account.
- name: fxa_primary_email
  type: STRING
  mode: NULLABLE
  description: The primary email address registered in Firefox Accounts (FxA), lowercased.
    Populated only when it differs from the CTMS email address; NULL for ~99.5% of
    users.
- name: fxa_lang
  type: STRING
  mode: NULLABLE
  description: The browser-reported Accept-Language string from the user's Firefox
    Accounts session (e.g., 'en-us,en;q=0.5'). NULL for ~47% of users where FxA language
    data is unavailable.
- name: fxa_first_service
  type: STRING
  mode: NULLABLE
  description: The first Mozilla service the user used to create or authenticate their
    Firefox Accounts account (e.g., 'sync', 'fenix', 'pocket-web', 'firefox-ios').
    NULL for ~49% of users.
- name: fxa_created_at
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user's Firefox Accounts (FxA) account was created.
    NULL for ~7.6% of users who have no associated FxA account.
- name: newsletters
  type: RECORD
  mode: REPEATED
  fields:
  - name: newsletter_name
    type: STRING
    mode: NULLABLE
    description: The slug identifying the newsletter in CTMS and Basket (e.g., 'mozilla-and-you',
      'firefox-tips').
  - name: subscribed
    type: BOOLEAN
    mode: NULLABLE
    description: True if the user is currently subscribed to this newsletter; false
      if they have unsubscribed.
  - name: newsletter_lang
    type: STRING
    mode: NULLABLE
    description: The lowercased language code for this newsletter subscription (e.g.,
      'en', 'fr'), representing the user's preferred language for this newsletter.
  - name: newsletter_source
    type: STRING
    mode: NULLABLE
    description: The source or channel through which the user subscribed to this newsletter,
      as recorded in CTMS (e.g., a website URL or campaign identifier).
  - name: create_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when this newsletter subscription record was first created
      in CTMS.
  - name: update_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when this newsletter subscription record was most recently
      updated in CTMS.
  description: Array of newsletter subscription records for the user, joined from
    newsletters_v1. NULL when the user has no active newsletter subscriptions.
- name: waitlists
  type: RECORD
  mode: REPEATED
  fields:
  - name: waitlist_name
    type: STRING
    mode: NULLABLE
    description: The slug identifying the waitlist in CTMS (e.g., 'vpn', 'relay-phone-masking'),
      representing a Mozilla product the user has joined a waitlist for.
  - name: waitlist_geo
    type: STRING
    mode: NULLABLE
    description: The lowercased geographic region or country code the user specified
      when joining the waitlist (e.g., 'us', 'ca'). NULL when no geo preference was
      captured.
  - name: waitlist_platform
    type: STRING
    mode: NULLABLE
    description: The lowercased platform the user specified when joining the waitlist
      (e.g., 'ios', 'android'). NULL when no platform preference was captured.
  - name: waitlist_source
    type: STRING
    mode: NULLABLE
    description: The lowercased source or channel through which the user joined the
      waitlist, as recorded in CTMS.
  - name: create_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when this waitlist record was first created in CTMS.
  - name: subscribed
    type: BOOLEAN
    mode: NULLABLE
    description: True if the user is currently on the waitlist; false if they have
      been removed or unsubscribed from the waitlist.
  - name: unsub_reason
    type: STRING
    mode: NULLABLE
    description: The reason provided for the user's removal from the waitlist, if
      applicable. NULL when the user is still subscribed or no reason was recorded.
  - name: update_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when this waitlist record was most recently updated in
      CTMS.
  description: Array of product waitlist records for the user, joined from waitlists_v1.
    NULL when the user has no active waitlist subscriptions.
- name: products
  type: RECORD
  mode: REPEATED
  fields:
  - name: provider
    type: STRING
    mode: NULLABLE
    description: The billing provider for this subscription (e.g., 'stripe', 'apple',
      'google'), sourced from subscription_platform.logical_subscriptions.
  - name: payment_provider
    type: STRING
    mode: NULLABLE
    description: The payment processor used for this subscription (e.g., 'stripe',
      'braintree'), which may differ from the provider for app store subscriptions.
  - name: product_name
    type: STRING
    mode: NULLABLE
    description: The human-readable name of the subscribed Mozilla product (e.g.,
      'Mozilla VPN', 'Firefox Relay').
  - name: service_name
    type: STRING
    mode: NULLABLE
    description: The internal service name for this subscription (e.g., 'vpn', 'relay'),
      sourced from the services array in logical_subscriptions.
  - name: subscription_plan_id
    type: STRING
    mode: NULLABLE
    description: The provider-specific plan identifier for the subscription (e.g.,
      a Stripe price ID).
  - name: subscription_product_id
    type: STRING
    mode: NULLABLE
    description: The provider-specific product identifier for the subscription (e.g.,
      a Stripe product ID).
  - name: subscription_started_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the subscription became active.
  - name: subscription_ended_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the subscription ended or was cancelled. NULL if the
      subscription is still active.
  - name: subscription_summary
    type: STRING
    mode: NULLABLE
    description: A human-readable summary of the subscription plan (e.g., 'Mozilla
      VPN Monthly').
  - name: subscription_billing_interval
    type: STRING
    mode: NULLABLE
    description: The billing interval type for this subscription plan (e.g., 'month',
      'year').
  - name: subscription_interval_count
    type: INTEGER
    mode: NULLABLE
    description: The number of billing interval units per billing cycle (e.g., 1 for
      monthly, 12 for annual).
  - name: subscription_currency
    type: STRING
    mode: NULLABLE
    description: The three-letter ISO currency code for the subscription plan (e.g.,
      'usd', 'eur').
  - name: subscription_amount
    type: NUMERIC
    mode: NULLABLE
    description: The subscription price per billing cycle as a numeric value in the
      plan's currency (e.g., 4.99 for $4.99/month).
  - name: is_bundle
    type: BOOLEAN
    mode: NULLABLE
    description: True if this subscription is part of a bundled product offering (e.g.,
      Mozilla VPN + Firefox Relay bundle); false otherwise.
  - name: is_trial
    type: BOOLEAN
    mode: NULLABLE
    description: True if the subscription is in a free trial period; false if the
      user is on a paid subscription.
  - name: is_active
    type: BOOLEAN
    mode: NULLABLE
    description: True if the subscription is currently active; false if it has ended,
      been cancelled, or is otherwise inactive.
  - name: subscription_status
    type: STRING
    mode: NULLABLE
    description: The provider-reported status string for this subscription (e.g.,
      'active', 'cancelled', 'past_due').
  - name: subscription_country_code
    type: STRING
    mode: NULLABLE
    description: The lowercased two-letter ISO country code for the subscription's
      billing address or location (e.g., 'us', 'de').
  - name: subscription_country_name
    type: STRING
    mode: NULLABLE
    description: The human-readable country name for the subscription's billing address
      or location (e.g., 'United States', 'Germany').
  - name: current_period_started_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the current billing period began for this subscription.
  - name: current_period_ends_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the current billing period ends; after this date the
      subscription will renew or expire.
  - name: is_auto_renew
    type: BOOLEAN
    mode: NULLABLE
    description: True if the subscription is set to automatically renew at the end
      of the current billing period; false if auto-renewal has been disabled.
  - name: auto_renew_disabled_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the user disabled auto-renewal for this subscription.
      NULL if auto-renewal has never been disabled.
  - name: has_refunds
    type: BOOLEAN
    mode: NULLABLE
    description: True if any refund has been issued for this subscription; false otherwise.
  - name: has_fraudulent_charges
    type: BOOLEAN
    mode: NULLABLE
    description: True if any fraudulent charges have been recorded for this subscription;
      false otherwise.
  - name: first_touch_impression_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp of the user's first marketing touchpoint impression before
      subscribing. Always NULL in the current ETL — first-touch attribution is not
      yet populated.
  - name: first_touch_entrypoint
    type: STRING
    mode: NULLABLE
    description: The FxA entrypoint URL parameter at the user's first marketing touchpoint.
      Always NULL in the current ETL.
  - name: first_touch_entrypoint_experiment
    type: STRING
    mode: NULLABLE
    description: The experiment identifier at the user's first marketing touchpoint.
      Always NULL in the current ETL.
  - name: first_touch_entrypoint_variation
    type: STRING
    mode: NULLABLE
    description: The experiment variation at the user's first marketing touchpoint.
      Always NULL in the current ETL.
  - name: first_touch_utm_campaign
    type: STRING
    mode: NULLABLE
    description: The UTM campaign parameter at the user's first marketing touchpoint.
      Always NULL in the current ETL.
  - name: first_touch_utm_content
    type: STRING
    mode: NULLABLE
    description: The UTM content parameter at the user's first marketing touchpoint.
      Always NULL in the current ETL.
  - name: first_touch_utm_medium
    type: STRING
    mode: NULLABLE
    description: The UTM medium parameter at the user's first marketing touchpoint.
      Always NULL in the current ETL.
  - name: first_touch_utm_source
    type: STRING
    mode: NULLABLE
    description: The UTM source parameter at the user's first marketing touchpoint.
      Always NULL in the current ETL.
  - name: first_touch_utm_term
    type: STRING
    mode: NULLABLE
    description: The UTM term parameter at the user's first marketing touchpoint.
      Always NULL in the current ETL.
  - name: last_touch_impression_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp of the user's most recent marketing touchpoint impression
      before subscribing.
  - name: last_touch_entrypoint
    type: STRING
    mode: NULLABLE
    description: The FxA entrypoint URL parameter at the user's most recent marketing
      touchpoint before subscribing.
  - name: last_touch_entrypoint_experiment
    type: STRING
    mode: NULLABLE
    description: The experiment identifier at the user's most recent marketing touchpoint
      before subscribing.
  - name: last_touch_entrypoint_variation
    type: STRING
    mode: NULLABLE
    description: The experiment variation at the user's most recent marketing touchpoint
      before subscribing.
  - name: last_touch_utm_campaign
    type: STRING
    mode: NULLABLE
    description: The UTM campaign parameter at the user's most recent marketing touchpoint
      before subscribing.
  - name: last_touch_utm_content
    type: STRING
    mode: NULLABLE
    description: The UTM content parameter at the user's most recent marketing touchpoint
      before subscribing.
  - name: last_touch_utm_medium
    type: STRING
    mode: NULLABLE
    description: The UTM medium parameter at the user's most recent marketing touchpoint
      before subscribing.
  - name: last_touch_utm_source
    type: STRING
    mode: NULLABLE
    description: The UTM source parameter at the user's most recent marketing touchpoint
      before subscribing.
  - name: last_touch_utm_term
    type: STRING
    mode: NULLABLE
    description: The UTM term parameter at the user's most recent marketing touchpoint
      before subscribing.
  - name: subscription_created_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the subscription record was first created at the provider.
  - name: subscription_updated_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the subscription record was most recently updated
      at the provider.
  description: Array of Mozilla product subscription records for the user, joined
    from products_v1. NULL when the user has no product subscriptions.
