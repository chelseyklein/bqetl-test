fields:
- name: external_id
  type: STRING
  mode: NULLABLE
  description: The unique identifier for the user in Braze, corresponding to the CTMS
    email_id (a UUID). Links this profile to other braze_derived tables.
- name: email
  type: STRING
  mode: NULLABLE
  description: The lowercased primary email address of the user, sourced from CTMS
    via users_v1.
- name: mailing_country
  type: STRING
  mode: NULLABLE
  description: The two-letter ISO country code representing the user's mailing country,
    as stored in CTMS.
- name: email_subscribe
  type: STRING
  mode: NULLABLE
  description: The user's email subscription status in Braze. Values are 'opted_in'
    (double opt-in confirmed), 'subscribed' (single opt-in), or 'unsubscribed' (has
    opted out).
- name: basket_token
  type: STRING
  mode: NULLABLE
  description: A UUID token that uniquely identifies the user in Mozilla's Basket
    email subscription service.
- name: email_lang
  type: STRING
  mode: NULLABLE
  description: The user's preferred language for email communications, stored as a
    lowercased BCP 47 language code (e.g., 'en', 'fr', 'de'). Sourced from CTMS.
- name: create_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user record was first created in the Contact Management
    System (CTMS).
- name: update_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user record was most recently updated in the Contact
    Management System (CTMS).
- name: fxa_id_sha256
  type: STRING
  mode: NULLABLE
  description: SHA-256 hash of the user's Firefox Accounts (FxA) user ID. Used to
    link to FxA records without exposing the raw account identifier. NULL when the
    user has no associated FxA account.
- name: has_fxa
  type: BOOLEAN
  mode: NULLABLE
  description: True if the user has an active, non-deleted Firefox Accounts (FxA)
    account linked to their email; false otherwise.
- name: fxa_primary_email
  type: STRING
  mode: NULLABLE
  description: The primary email address registered in Firefox Accounts (FxA), lowercased.
    Populated only when it differs from the CTMS email address; NULL for most users.
- name: fxa_lang
  type: STRING
  mode: NULLABLE
  description: The browser-reported Accept-Language string from the user's Firefox
    Accounts session (e.g., 'en-US,en;q=0.5'). NULL when FxA language data is unavailable.
- name: fxa_first_service
  type: STRING
  mode: NULLABLE
  description: The first Mozilla service the user used to create or authenticate their
    FxA account (e.g., 'sync', 'fenix', 'pocket-web'). NULL when FxA service data
    is unavailable.
- name: fxa_created_at
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user's Firefox Accounts (FxA) account was created.
    NULL when the user has no associated FxA account.
- name: newsletters
  type: RECORD
  mode: REPEATED
  fields:
  - name: newsletter_name
    type: STRING
    mode: NULLABLE
    description: The internal slug identifying the newsletter (e.g., 'mozilla-foundation',
      'firefox-accounts-journey').
  - name: subscribed
    type: BOOLEAN
    mode: NULLABLE
    description: True if the user is currently subscribed to this newsletter; false
      if they have unsubscribed.
  - name: newsletter_lang
    type: STRING
    mode: NULLABLE
    description: The lowercased BCP 47 language code for the user's preferred language
      for this newsletter (e.g., 'en', 'fr').
  - name: newsletter_source
    type: STRING
    mode: NULLABLE
    description: The source or channel through which the user subscribed to this newsletter,
      as stored in CTMS.
  - name: create_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when this newsletter subscription was first created in
      CTMS.
  - name: update_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when this newsletter subscription record was most recently
      updated in CTMS.
  description: Repeated record of newsletter subscriptions for this user, joined from
    newsletters_v1. NULL for users with no active newsletter subscriptions.
- name: waitlists
  type: RECORD
  mode: REPEATED
  fields:
  - name: waitlist_name
    type: STRING
    mode: NULLABLE
    description: The internal slug identifying the Mozilla product waitlist (e.g.,
      'vpn', 'relay-phone-masking').
  - name: waitlist_geo
    type: STRING
    mode: NULLABLE
    description: The lowercased geographic region the user selected when joining the
      waitlist (e.g., 'us', 'ca'). NULL if no geo was specified.
  - name: waitlist_platform
    type: STRING
    mode: NULLABLE
    description: The lowercased platform the user selected when joining the waitlist
      (e.g., 'ios', 'android'). NULL if no platform was specified.
  - name: waitlist_source
    type: STRING
    mode: NULLABLE
    description: The lowercased source or referral channel through which the user
      joined the waitlist, as stored in CTMS.
  - name: create_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the user's waitlist entry was first created in CTMS.
  - name: subscribed
    type: BOOLEAN
    mode: NULLABLE
    description: True if the user is currently on the waitlist; false if they have
      been removed or unsubscribed.
  - name: unsub_reason
    type: STRING
    mode: NULLABLE
    description: The reason the user unsubscribed from the waitlist, as provided by
      the user or system. NULL if still subscribed or no reason was given.
  - name: update_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the user's waitlist record was most recently updated
      in CTMS.
  description: Repeated record of product waitlist memberships for this user, joined
    from waitlists_v1. NULL for users not on any waitlist.
- name: products
  type: RECORD
  mode: REPEATED
  fields:
  - name: provider
    type: STRING
    mode: NULLABLE
    description: The subscription provider platform (e.g., 'stripe', 'apple', 'google').
  - name: payment_provider
    type: STRING
    mode: NULLABLE
    description: The payment processor used for the subscription (e.g., 'stripe',
      'paypal').
  - name: product_name
    type: STRING
    mode: NULLABLE
    description: The human-readable name of the Mozilla product being subscribed to
      (e.g., 'Mozilla VPN', 'Firefox Relay').
  - name: service_name
    type: STRING
    mode: NULLABLE
    description: The internal service name associated with this subscription.
  - name: subscription_plan_id
    type: STRING
    mode: NULLABLE
    description: The provider-assigned plan identifier for the subscription.
  - name: subscription_product_id
    type: STRING
    mode: NULLABLE
    description: The provider-assigned product identifier for the subscription.
  - name: subscription_started_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when this subscription period began at the provider.
  - name: subscription_ended_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when this subscription ended at the provider. NULL if still
      active.
  - name: subscription_summary
    type: STRING
    mode: NULLABLE
    description: A human-readable summary of the subscription plan (e.g., billing
      interval and price).
  - name: subscription_billing_interval
    type: STRING
    mode: NULLABLE
    description: The billing interval type for the subscription plan (e.g., 'month',
      'year').
  - name: subscription_interval_count
    type: INTEGER
    mode: NULLABLE
    description: The number of billing interval units between charges. Used together
      with subscription_billing_interval.
  - name: subscription_currency
    type: STRING
    mode: NULLABLE
    description: The ISO 4217 currency code for the subscription price (e.g., 'usd',
      'eur').
  - name: subscription_amount
    type: NUMERIC
    mode: NULLABLE
    description: The subscription price in the minor currency unit (e.g., cents for
      USD).
  - name: is_bundle
    type: BOOLEAN
    mode: NULLABLE
    description: True if this subscription is part of a product bundle; false otherwise.
  - name: is_trial
    type: BOOLEAN
    mode: NULLABLE
    description: True if the subscription is currently in a free trial period; false
      otherwise.
  - name: is_active
    type: BOOLEAN
    mode: NULLABLE
    description: True if the subscription is currently active; false if ended or cancelled.
  - name: subscription_status
    type: STRING
    mode: NULLABLE
    description: The raw subscription status string as reported by the provider (e.g.,
      'active', 'cancelled', 'past_due').
  - name: subscription_country_code
    type: STRING
    mode: NULLABLE
    description: The lowercased two-letter ISO country code associated with the subscription.
  - name: subscription_country_name
    type: STRING
    mode: NULLABLE
    description: The human-readable country name associated with the subscription
      (e.g., 'United States').
  - name: current_period_started_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the current billing period began for this subscription.
  - name: current_period_ends_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the current billing period ends for this subscription.
  - name: is_auto_renew
    type: BOOLEAN
    mode: NULLABLE
    description: True if the subscription is set to automatically renew at period
      end; false if the user has cancelled auto-renewal.
  - name: auto_renew_disabled_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when auto-renewal was disabled for this subscription. NULL
      if auto-renewal has not been disabled.
  - name: has_refunds
    type: BOOLEAN
    mode: NULLABLE
    description: True if one or more refunds have been issued for this subscription;
      false otherwise.
  - name: has_fraudulent_charges
    type: BOOLEAN
    mode: NULLABLE
    description: True if any fraudulent charges have been detected for this subscription;
      false otherwise.
  - name: first_touch_impression_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp of the first marketing impression for this subscription.
      Always NULL in current ETL.
  - name: first_touch_entrypoint
    type: STRING
    mode: NULLABLE
    description: The FxA entrypoint at the first marketing touch for this subscription.
      Always NULL in current ETL.
  - name: first_touch_entrypoint_experiment
    type: STRING
    mode: NULLABLE
    description: Experiment key at the first-touch entrypoint for this subscription.
      Always NULL in current ETL.
  - name: first_touch_entrypoint_variation
    type: STRING
    mode: NULLABLE
    description: Experiment variation at the first-touch entrypoint for this subscription.
      Always NULL in current ETL.
  - name: first_touch_utm_campaign
    type: STRING
    mode: NULLABLE
    description: UTM campaign from the first marketing touch for this subscription.
      Always NULL in current ETL.
  - name: first_touch_utm_content
    type: STRING
    mode: NULLABLE
    description: UTM content from the first marketing touch for this subscription.
      Always NULL in current ETL.
  - name: first_touch_utm_medium
    type: STRING
    mode: NULLABLE
    description: UTM medium from the first marketing touch for this subscription.
      Always NULL in current ETL.
  - name: first_touch_utm_source
    type: STRING
    mode: NULLABLE
    description: UTM source from the first marketing touch for this subscription.
      Always NULL in current ETL.
  - name: first_touch_utm_term
    type: STRING
    mode: NULLABLE
    description: UTM term from the first marketing touch for this subscription. Always
      NULL in current ETL.
  - name: last_touch_impression_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp of the most recent marketing impression before subscribing.
  - name: last_touch_entrypoint
    type: STRING
    mode: NULLABLE
    description: The FxA entrypoint at the last marketing touch before subscribing.
  - name: last_touch_entrypoint_experiment
    type: STRING
    mode: NULLABLE
    description: Experiment key at the last-touch entrypoint for this subscription.
  - name: last_touch_entrypoint_variation
    type: STRING
    mode: NULLABLE
    description: Experiment variation at the last-touch entrypoint for this subscription.
  - name: last_touch_utm_campaign
    type: STRING
    mode: NULLABLE
    description: UTM campaign from the last marketing touch before subscribing.
  - name: last_touch_utm_content
    type: STRING
    mode: NULLABLE
    description: UTM content from the last marketing touch before subscribing.
  - name: last_touch_utm_medium
    type: STRING
    mode: NULLABLE
    description: UTM medium from the last marketing touch before subscribing.
  - name: last_touch_utm_source
    type: STRING
    mode: NULLABLE
    description: UTM source from the last marketing touch before subscribing.
  - name: last_touch_utm_term
    type: STRING
    mode: NULLABLE
    description: UTM term from the last marketing touch before subscribing.
  - name: subscription_created_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the subscription was first created at the provider.
  - name: subscription_updated_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the subscription record was most recently updated
      at the provider.
  description: Repeated record of Mozilla product subscriptions for this user, joined
    from products_v1. NULL for users with no product subscriptions.
