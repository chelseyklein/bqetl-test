fields:
- name: external_id
  type: STRING
  mode: NULLABLE
  description: The unique identifier for the user in Braze, corresponding to the CTMS
    email_id (a UUID). Used to link Braze user records back to the Contact Management
    System.
- name: email
  type: STRING
  mode: NULLABLE
  description: The lowercased primary email address of the user, sourced from CTMS
    via users_v1.
- name: mailing_country
  type: STRING
  mode: NULLABLE
  description: The two-letter ISO country code representing the user's mailing country.
    NULL for approximately 36% of users where country information is unavailable.
- name: email_subscribe
  type: STRING
  mode: NULLABLE
  description: The user's email subscription status in Braze. Values are 'opted_in'
    (double opt-in confirmed) or 'subscribed' (single opt-in, no opt-out). Approximately
    99% of users are 'opted_in'.
- name: basket_token
  type: STRING
  mode: NULLABLE
  description: A UUID token that uniquely identifies the user in Mozilla's Basket
    email subscription service. Nearly always populated; NULL for fewer than 0.01%
    of rows.
- name: email_lang
  type: STRING
  mode: NULLABLE
  description: The user's preferred language for email communications, stored as a
    lowercased BCP 47 language code (e.g., 'en', 'fr', 'de'). Sourced from CTMS.
- name: create_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user record was first created in the Contact Management
    System (CTMS). Always populated.
- name: update_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user record was most recently updated in the Contact
    Management System (CTMS). Always populated.
- name: fxa_id_sha256
  type: STRING
  mode: NULLABLE
  description: SHA-256 hash of the user's Firefox Accounts (FxA) user ID. Used to
    link to FxA records without exposing raw account identifiers. NULL (~7.5%) when
    the user has no associated FxA account.
- name: has_fxa
  type: BOOLEAN
  mode: NULLABLE
  description: True if the user has an active, non-deleted Firefox Accounts (FxA)
    account linked to their email; false otherwise. Approximately 92.5% of users in
    this table have an FxA account.
- name: fxa_primary_email
  type: STRING
  mode: NULLABLE
  description: The primary email address registered in Firefox Accounts (FxA), lowercased.
    Populated only when it differs from the CTMS email address; NULL for ~99.5% of
    users.
- name: fxa_lang
  type: STRING
  mode: NULLABLE
  description: The browser-reported Accept-Language string from the user's Firefox
    Accounts session (e.g., 'en-US,en;q=0.5'). NULL for ~47% of users where FxA language
    data is unavailable.
- name: fxa_first_service
  type: STRING
  mode: NULLABLE
  description: The first Mozilla service the user used to create or authenticate their
    FxA account (e.g., 'sync', 'fenix', 'pocket-web', 'firefox-ios'). NULL for ~49%
    of users.
- name: fxa_created_at
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user's Firefox Accounts (FxA) account was created.
    NULL for ~7.6% of users who have no associated FxA account.
- name: newsletters
  type: RECORD
  mode: REPEATED
  fields:
  - name: newsletter_name
    type: STRING
    mode: NULLABLE
    description: The slug identifying the newsletter in CTMS and Basket (e.g., 'mozilla-and-you',
      'firefox-accounts-journey').
  - name: subscribed
    type: BOOLEAN
    mode: NULLABLE
    description: True if the user is currently subscribed to this newsletter; false
      if they have unsubscribed.
  - name: newsletter_lang
    type: STRING
    mode: NULLABLE
    description: The lowercased language code (e.g., 'en', 'fr') for this newsletter
      subscription, as stored in CTMS.
  - name: newsletter_source
    type: STRING
    mode: NULLABLE
    description: The acquisition source or referrer for this newsletter subscription,
      as recorded in CTMS (e.g., a URL or campaign identifier).
  - name: create_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when this newsletter subscription record was first created
      in CTMS.
  - name: update_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when this newsletter subscription record was most recently
      updated in CTMS.
  description: An array of newsletter subscription records for the user, joined from
    newsletters_v1. NULL when the user has no active newsletter subscriptions.
- name: waitlists
  type: RECORD
  mode: REPEATED
  fields:
  - name: waitlist_name
    type: STRING
    mode: NULLABLE
    description: The slug identifying the product waitlist in CTMS (e.g., 'vpn', 'relay-phone-masking').
      Corresponds to the basket_slug in subscriptions_map_v1.
  - name: waitlist_geo
    type: STRING
    mode: NULLABLE
    description: The lowercased geographic region or country the user selected when
      joining this waitlist, extracted from the CTMS waitlist fields JSON.
  - name: waitlist_platform
    type: STRING
    mode: NULLABLE
    description: The lowercased platform the user selected when joining this waitlist
      (e.g., 'ios', 'android', 'windows'), extracted from the CTMS waitlist fields
      JSON.
  - name: waitlist_source
    type: STRING
    mode: NULLABLE
    description: The lowercased acquisition source or referrer for this waitlist signup,
      as recorded in CTMS (e.g., a URL or campaign identifier).
  - name: create_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when this waitlist record was first created in CTMS.
  - name: subscribed
    type: BOOLEAN
    mode: NULLABLE
    description: True if the user is currently on this product waitlist; false if
      they have removed themselves.
  - name: unsub_reason
    type: STRING
    mode: NULLABLE
    description: The reason the user provided when unsubscribing from the waitlist,
      as recorded in CTMS. NULL if the user is still subscribed or provided no reason.
  - name: update_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when this waitlist record was most recently updated in
      CTMS.
  description: An array of product waitlist records for the user, joined from waitlists_v1.
    NULL when the user has no active waitlist subscriptions.
- name: products
  type: RECORD
  mode: REPEATED
  fields:
  - name: provider
    type: STRING
    mode: NULLABLE
    description: The subscription provider platform (e.g., 'stripe', 'apple', 'google').
      Indicates which billing system manages the subscription.
  - name: payment_provider
    type: STRING
    mode: NULLABLE
    description: The payment processor used for the subscription (e.g., 'stripe',
      'paypal'). May differ from provider for some subscription types.
  - name: product_name
    type: STRING
    mode: NULLABLE
    description: The human-readable name of the subscribed product (e.g., 'Mozilla
      VPN', 'Firefox Relay Premium').
  - name: service_name
    type: STRING
    mode: NULLABLE
    description: The internal service name associated with the subscription, sourced
      from the subscription platform services table.
  - name: subscription_plan_id
    type: STRING
    mode: NULLABLE
    description: The provider-specific plan identifier for this subscription (e.g.,
      a Stripe plan ID or Apple product ID).
  - name: subscription_product_id
    type: STRING
    mode: NULLABLE
    description: The provider-specific product identifier for this subscription (e.g.,
      a Stripe product ID).
  - name: subscription_started_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the subscription started.
  - name: subscription_ended_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the subscription ended. NULL for currently active
      subscriptions.
  - name: subscription_summary
    type: STRING
    mode: NULLABLE
    description: A human-readable summary string describing the subscription plan
      (e.g., billing interval and price).
  - name: subscription_billing_interval
    type: STRING
    mode: NULLABLE
    description: The billing interval type for the subscription plan (e.g., 'month',
      'year').
  - name: subscription_interval_count
    type: INTEGER
    mode: NULLABLE
    description: The number of billing interval units between charges (e.g., 1 for
      monthly, 12 for annual billed monthly).
  - name: subscription_currency
    type: STRING
    mode: NULLABLE
    description: The ISO 4217 currency code for the subscription plan (e.g., 'usd',
      'eur').
  - name: subscription_amount
    type: NUMERIC
    mode: NULLABLE
    description: The plan price amount in the subscription currency as a decimal (e.g.,
      4.99).
  - name: is_bundle
    type: BOOLEAN
    mode: NULLABLE
    description: True if this subscription is part of a bundled product offering;
      false otherwise.
  - name: is_trial
    type: BOOLEAN
    mode: NULLABLE
    description: True if the subscription is currently in a free trial period; false
      otherwise.
  - name: is_active
    type: BOOLEAN
    mode: NULLABLE
    description: True if the subscription is currently active; false if it has ended
      or been cancelled.
  - name: subscription_status
    type: STRING
    mode: NULLABLE
    description: The provider-reported status of the subscription (e.g., 'active',
      'cancelled', 'past_due').
  - name: subscription_country_code
    type: STRING
    mode: NULLABLE
    description: The lowercased two-letter ISO country code associated with the subscription,
      as reported by the subscription provider.
  - name: subscription_country_name
    type: STRING
    mode: NULLABLE
    description: The full country name associated with the subscription, as reported
      by the subscription provider.
  - name: current_period_started_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the current billing period started for this subscription.
  - name: current_period_ends_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the current billing period ends for this subscription.
  - name: is_auto_renew
    type: BOOLEAN
    mode: NULLABLE
    description: True if the subscription is set to automatically renew at the end
      of the current period; false if the user has disabled auto-renewal.
  - name: auto_renew_disabled_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the user disabled auto-renewal for this subscription.
      NULL if auto-renewal has not been disabled.
  - name: has_refunds
    type: BOOLEAN
    mode: NULLABLE
    description: True if any refunds have been issued for this subscription; false
      otherwise.
  - name: has_fraudulent_charges
    type: BOOLEAN
    mode: NULLABLE
    description: True if any fraudulent charges have been recorded against this subscription;
      false otherwise.
  - name: first_touch_impression_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp of the first marketing impression attributed to this subscription.
      Always NULL in the current ETL (reserved for future attribution data).
  - name: first_touch_entrypoint
    type: STRING
    mode: NULLABLE
    description: The FxA entrypoint associated with the first marketing touch for
      this subscription. Always NULL in the current ETL (reserved for future attribution
      data).
  - name: first_touch_entrypoint_experiment
    type: STRING
    mode: NULLABLE
    description: The experiment slug associated with the first-touch entrypoint. Always
      NULL in the current ETL (reserved for future attribution data).
  - name: first_touch_entrypoint_variation
    type: STRING
    mode: NULLABLE
    description: The experiment variation associated with the first-touch entrypoint.
      Always NULL in the current ETL (reserved for future attribution data).
  - name: first_touch_utm_campaign
    type: STRING
    mode: NULLABLE
    description: The UTM campaign parameter from the first marketing touch. Always
      NULL in the current ETL (reserved for future attribution data).
  - name: first_touch_utm_content
    type: STRING
    mode: NULLABLE
    description: The UTM content parameter from the first marketing touch. Always
      NULL in the current ETL (reserved for future attribution data).
  - name: first_touch_utm_medium
    type: STRING
    mode: NULLABLE
    description: The UTM medium parameter from the first marketing touch. Always NULL
      in the current ETL (reserved for future attribution data).
  - name: first_touch_utm_source
    type: STRING
    mode: NULLABLE
    description: The UTM source parameter from the first marketing touch. Always NULL
      in the current ETL (reserved for future attribution data).
  - name: first_touch_utm_term
    type: STRING
    mode: NULLABLE
    description: The UTM term parameter from the first marketing touch. Always NULL
      in the current ETL (reserved for future attribution data).
  - name: last_touch_impression_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp of the most recent marketing impression before the subscription
      was created.
  - name: last_touch_entrypoint
    type: STRING
    mode: NULLABLE
    description: The FxA entrypoint associated with the last marketing touch before
      the subscription was created.
  - name: last_touch_entrypoint_experiment
    type: STRING
    mode: NULLABLE
    description: The experiment slug associated with the last-touch entrypoint before
      the subscription was created.
  - name: last_touch_entrypoint_variation
    type: STRING
    mode: NULLABLE
    description: The experiment variation associated with the last-touch entrypoint
      before the subscription was created.
  - name: last_touch_utm_campaign
    type: STRING
    mode: NULLABLE
    description: The UTM campaign parameter from the last marketing touch before the
      subscription was created.
  - name: last_touch_utm_content
    type: STRING
    mode: NULLABLE
    description: The UTM content parameter from the last marketing touch before the
      subscription was created.
  - name: last_touch_utm_medium
    type: STRING
    mode: NULLABLE
    description: The UTM medium parameter from the last marketing touch before the
      subscription was created.
  - name: last_touch_utm_source
    type: STRING
    mode: NULLABLE
    description: The UTM source parameter from the last marketing touch before the
      subscription was created.
  - name: last_touch_utm_term
    type: STRING
    mode: NULLABLE
    description: The UTM term parameter from the last marketing touch before the subscription
      was created.
  - name: subscription_created_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the subscription was first created in the provider's
      system.
  - name: subscription_updated_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the subscription was most recently updated in the
      provider's system.
  description: An array of subscription product records for the user, joined from
    products_v1. NULL when the user has no Mozilla subscription products.
