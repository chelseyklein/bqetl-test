fields:
- name: external_id
  type: STRING
  mode: NULLABLE
  description: The unique Braze user identifier (CTMS email_id UUID). Used to join
    this profile with newsletters_v1, waitlists_v1, and products_v1.
- name: email
  type: STRING
  mode: NULLABLE
  description: The lowercased primary email address of the user, sourced from CTMS
    via users_v1.
- name: mailing_country
  type: STRING
  mode: NULLABLE
  description: The two-letter ISO country code representing the user's mailing country,
    as stored in CTMS. NULL where country information is unavailable.
- name: email_subscribe
  type: STRING
  mode: NULLABLE
  description: The user's email subscription status. Values are 'opted_in' (double
    opt-in confirmed), 'subscribed' (single opt-in), or 'unsubscribed' (opted out).
- name: basket_token
  type: STRING
  mode: NULLABLE
  description: A UUID token that uniquely identifies the user in Mozilla's Basket
    email subscription service.
- name: email_lang
  type: STRING
  mode: NULLABLE
  description: The user's preferred language for email communications, stored as a
    lowercased BCP 47 language code (e.g., 'en', 'fr', 'de'). Sourced from CTMS.
- name: create_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user record was first created in CTMS.
- name: update_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user record was most recently updated in CTMS.
- name: fxa_id_sha256
  type: STRING
  mode: NULLABLE
  description: SHA-256 hash of the user's Firefox Accounts (FxA) user ID. NULL when
    the user has no associated FxA account.
- name: has_fxa
  type: BOOLEAN
  mode: NULLABLE
  description: True if the user has an active, non-deleted Firefox Accounts (FxA)
    account linked to their email; false otherwise.
- name: fxa_primary_email
  type: STRING
  mode: NULLABLE
  description: The primary email address registered in Firefox Accounts (FxA), lowercased.
    Populated only when it differs from the CTMS email address; NULL for most users.
- name: fxa_lang
  type: STRING
  mode: NULLABLE
  description: The browser-reported Accept-Language string from the user's Firefox
    Accounts session (e.g., 'en-US,en;q=0.5'). NULL when FxA language data is unavailable.
- name: fxa_first_service
  type: STRING
  mode: NULLABLE
  description: The first Mozilla service the user authenticated with to create their
    Firefox Accounts (FxA) account (e.g., 'sync', 'fenix', 'pocket-web'). NULL when
    not available.
- name: fxa_created_at
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user's Firefox Accounts (FxA) account was created.
    NULL for users with no associated FxA account.
- name: newsletters
  type: RECORD
  mode: REPEATED
  fields:
  - name: newsletter_name
    type: STRING
    mode: NULLABLE
    description: The slug identifying the newsletter (e.g., 'mozilla-and-you', 'firefox-news').
      Corresponds to braze_subscription_name in subscriptions_map_v1.
  - name: subscribed
    type: BOOLEAN
    mode: NULLABLE
    description: True if the user is currently subscribed to this newsletter; false
      if they have unsubscribed.
  - name: newsletter_lang
    type: STRING
    mode: NULLABLE
    description: The lowercased language code in which the user elected to receive
      this newsletter (e.g., 'en', 'fr').
  - name: newsletter_source
    type: STRING
    mode: NULLABLE
    description: The acquisition source indicating how the user subscribed to this
      newsletter, as stored in CTMS.
  - name: create_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the newsletter subscription record was first created
      in CTMS.
  - name: update_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the newsletter subscription record was most recently
      updated in CTMS.
  description: Array of newsletter subscription records joined from newsletters_v1.
    Each element describes one newsletter the user is or was subscribed to.
- name: waitlists
  type: RECORD
  mode: REPEATED
  fields:
  - name: waitlist_name
    type: STRING
    mode: NULLABLE
    description: The slug identifying the product waitlist in CTMS (e.g., 'vpn', 'relay').
      Used to construct the Braze subscription group name.
  - name: waitlist_geo
    type: STRING
    mode: NULLABLE
    description: The lowercased geographic region or country the user selected when
      joining the waitlist (e.g., 'us', 'gb'). NULL when not provided.
  - name: waitlist_platform
    type: STRING
    mode: NULLABLE
    description: The lowercased platform the user indicated preference for when joining
      the waitlist (e.g., 'windows', 'mac'). NULL when not provided.
  - name: waitlist_source
    type: STRING
    mode: NULLABLE
    description: The lowercased acquisition source indicating how the user joined
      the waitlist, as stored in CTMS.
  - name: create_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the waitlist record was first created in CTMS.
  - name: subscribed
    type: BOOLEAN
    mode: NULLABLE
    description: True if the user is currently active on the waitlist; false if removed
      or opted out.
  - name: unsub_reason
    type: STRING
    mode: NULLABLE
    description: The reason the user was removed from the waitlist, if applicable.
      NULL when still subscribed or no reason was recorded.
  - name: update_timestamp
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the waitlist record was most recently updated in CTMS.
  description: Array of product waitlist records joined from waitlists_v1. Each element
    describes one waitlist the user has joined.
- name: products
  type: RECORD
  mode: REPEATED
  fields:
  - name: provider
    type: STRING
    mode: NULLABLE
    description: The subscription provider responsible for billing (e.g., 'stripe',
      'apple', 'google').
  - name: payment_provider
    type: STRING
    mode: NULLABLE
    description: The payment processor used for the subscription transaction (e.g.,
      'stripe', 'paypal').
  - name: product_name
    type: STRING
    mode: NULLABLE
    description: The human-readable name of the Mozilla product the user is subscribed
      to (e.g., 'Mozilla VPN', 'Firefox Relay').
  - name: service_name
    type: STRING
    mode: NULLABLE
    description: The internal service name for the product within the Mozilla subscription
      platform.
  - name: subscription_plan_id
    type: STRING
    mode: NULLABLE
    description: The provider-specific plan identifier for the subscription plan.
  - name: subscription_product_id
    type: STRING
    mode: NULLABLE
    description: The provider-specific product identifier for the subscription.
  - name: subscription_started_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the user's subscription to this product began.
  - name: subscription_ended_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the user's subscription to this product ended. NULL
      if the subscription is still active.
  - name: subscription_summary
    type: STRING
    mode: NULLABLE
    description: A human-readable summary of the subscription plan (e.g., 'Mozilla
      VPN Monthly').
  - name: subscription_billing_interval
    type: STRING
    mode: NULLABLE
    description: The billing interval type for the subscription plan (e.g., 'month',
      'year').
  - name: subscription_interval_count
    type: INTEGER
    mode: NULLABLE
    description: The number of billing interval units between charges.
  - name: subscription_currency
    type: STRING
    mode: NULLABLE
    description: The three-letter ISO 4217 currency code for the subscription charge
      (e.g., 'usd', 'eur').
  - name: subscription_amount
    type: NUMERIC
    mode: NULLABLE
    description: The amount charged per billing interval for the subscription.
  - name: is_bundle
    type: BOOLEAN
    mode: NULLABLE
    description: True if this subscription is part of a bundled product offering;
      false if standalone.
  - name: is_trial
    type: BOOLEAN
    mode: NULLABLE
    description: True if the user is in a free trial period for this subscription;
      false otherwise.
  - name: is_active
    type: BOOLEAN
    mode: NULLABLE
    description: True if the subscription is currently active; false if lapsed or
      cancelled.
  - name: subscription_status
    type: STRING
    mode: NULLABLE
    description: The subscription status as reported by the provider (e.g., 'active',
      'cancelled', 'past_due').
  - name: subscription_country_code
    type: STRING
    mode: NULLABLE
    description: The lowercased two-letter ISO 3166-1 country code associated with
      the subscription (e.g., 'us', 'de').
  - name: subscription_country_name
    type: STRING
    mode: NULLABLE
    description: The human-readable country name associated with the subscription
      (e.g., 'United States', 'Germany').
  - name: current_period_started_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the current billing period began.
  - name: current_period_ends_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the current billing period ends.
  - name: is_auto_renew
    type: BOOLEAN
    mode: NULLABLE
    description: True if the subscription is set to automatically renew; false if
      auto-renewal has been disabled.
  - name: auto_renew_disabled_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when auto-renewal was disabled. NULL if auto-renewal is
      still enabled.
  - name: has_refunds
    type: BOOLEAN
    mode: NULLABLE
    description: True if the user has received at least one refund for this subscription;
      false otherwise.
  - name: has_fraudulent_charges
    type: BOOLEAN
    mode: NULLABLE
    description: True if any fraudulent charges have been flagged for this subscription;
      false otherwise.
  - name: first_touch_impression_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp of the user's first marketing touchpoint impression. Currently
      always NULL; reserved for future attribution data.
  - name: first_touch_entrypoint
    type: STRING
    mode: NULLABLE
    description: The UI entrypoint of the user's first marketing touchpoint. Currently
      always NULL; reserved for future attribution data.
  - name: first_touch_entrypoint_experiment
    type: STRING
    mode: NULLABLE
    description: The experiment name at the user's first-touch entrypoint. Currently
      always NULL; reserved for future attribution data.
  - name: first_touch_entrypoint_variation
    type: STRING
    mode: NULLABLE
    description: The experiment variation at the user's first-touch entrypoint. Currently
      always NULL; reserved for future attribution data.
  - name: first_touch_utm_campaign
    type: STRING
    mode: NULLABLE
    description: The UTM campaign of the user's first marketing touchpoint. Currently
      always NULL; reserved for future attribution data.
  - name: first_touch_utm_content
    type: STRING
    mode: NULLABLE
    description: The UTM content of the user's first marketing touchpoint. Currently
      always NULL; reserved for future attribution data.
  - name: first_touch_utm_medium
    type: STRING
    mode: NULLABLE
    description: The UTM medium of the user's first marketing touchpoint. Currently
      always NULL; reserved for future attribution data.
  - name: first_touch_utm_source
    type: STRING
    mode: NULLABLE
    description: The UTM source of the user's first marketing touchpoint. Currently
      always NULL; reserved for future attribution data.
  - name: first_touch_utm_term
    type: STRING
    mode: NULLABLE
    description: The UTM term of the user's first marketing touchpoint. Currently
      always NULL; reserved for future attribution data.
  - name: last_touch_impression_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp of the user's most recent marketing touchpoint impression
      before subscribing.
  - name: last_touch_entrypoint
    type: STRING
    mode: NULLABLE
    description: The UI entrypoint of the user's most recent marketing touchpoint
      before subscribing.
  - name: last_touch_entrypoint_experiment
    type: STRING
    mode: NULLABLE
    description: The experiment name associated with the user's last-touch entrypoint.
  - name: last_touch_entrypoint_variation
    type: STRING
    mode: NULLABLE
    description: The experiment variation associated with the user's last-touch entrypoint.
  - name: last_touch_utm_campaign
    type: STRING
    mode: NULLABLE
    description: The UTM campaign of the user's most recent marketing touchpoint.
  - name: last_touch_utm_content
    type: STRING
    mode: NULLABLE
    description: The UTM content of the user's most recent marketing touchpoint.
  - name: last_touch_utm_medium
    type: STRING
    mode: NULLABLE
    description: The UTM medium of the user's most recent marketing touchpoint.
  - name: last_touch_utm_source
    type: STRING
    mode: NULLABLE
    description: The UTM source of the user's most recent marketing touchpoint.
  - name: last_touch_utm_term
    type: STRING
    mode: NULLABLE
    description: The UTM term of the user's most recent marketing touchpoint.
  - name: subscription_created_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the subscription was first created in the provider's
      system.
  - name: subscription_updated_at
    type: TIMESTAMP
    mode: NULLABLE
    description: Timestamp when the subscription was most recently updated in the
      provider's system.
  description: Array of Mozilla product subscription records joined from products_v1.
    Each element describes one active or historical subscription across Mozilla services.
