fields:
- name: external_id
  type: STRING
  mode: NULLABLE
  description: The unique identifier for the user in Braze, sourced from the CTMS
    email_id (a UUID). Always populated; ~107M distinct values (sampled 2026-05-28).
- name: email
  type: STRING
  mode: NULLABLE
  description: The lowercased primary email address of the user, sourced from CTMS
    via users_v1. Used as the Braze contact address for marketing communications.
- name: mailing_country
  type: STRING
  mode: NULLABLE
  description: The two-letter ISO country code representing the user's mailing country
    as stored in CTMS. NULL for approximately 36% of users where country information
    is unavailable (sampled 2026-05-28).
- name: email_subscribe
  type: STRING
  mode: NULLABLE
  description: The user's email subscription status in Braze. Values are 'opted_in'
    (double opt-in confirmed, ~99% of users) or 'subscribed' (single opt-in, no explicit
    opt-out). Sourced from users_v1 (sampled 2026-05-28).
- name: basket_token
  type: STRING
  mode: NULLABLE
  description: A UUID token that uniquely identifies the user in Mozilla's Basket
    email subscription service. Nearly always populated; NULL for fewer than 0.01%
    of rows (sampled 2026-05-28).
- name: email_lang
  type: STRING
  mode: NULLABLE
  description: The user's preferred language for email communications, stored as a
    lowercased BCP 47 language code (e.g., 'en', 'fr', 'de'). The most common value
    is 'en' (~62% of users). Sourced from CTMS via users_v1 (sampled 2026-05-28).
- name: create_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user record was first created in the Contact Management
    System (CTMS). Always populated.
- name: update_timestamp
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user record was most recently updated in the Contact
    Management System (CTMS). Always populated.
- name: fxa_id_sha256
  type: STRING
  mode: NULLABLE
  description: SHA-256 hash of the user's Firefox Accounts (FxA) user ID, used to
    join to FxA records without exposing raw account identifiers. NULL for approximately
    7.5% of users who have no associated FxA account (sampled 2026-05-28).
- name: has_fxa
  type: BOOLEAN
  mode: NULLABLE
  description: True if the user has an active, non-deleted Firefox Accounts (FxA)
    account linked to their email; false otherwise. Approximately 92.5% of users in
    this table have an FxA account (sampled 2026-05-28).
- name: fxa_primary_email
  type: STRING
  mode: NULLABLE
  description: The primary email address registered in Firefox Accounts (FxA), lowercased.
    Populated only when it differs from the CTMS email address; NULL for the vast
    majority of users.
- name: fxa_lang
  type: STRING
  mode: NULLABLE
  description: The browser-reported Accept-Language string from the user's Firefox
    Accounts session (e.g., 'en-us,en;q=0.5'). NULL for approximately 47% of users
    where FxA language data is unavailable (sampled 2026-05-28).
- name: fxa_first_service
  type: STRING
  mode: NULLABLE
  description: The first Mozilla service the user used to create or authenticate their
    Firefox Accounts (FxA) account (e.g., 'sync', 'fenix', 'pocket-web', 'firefox-ios').
    NULL for approximately 48.6% of users (sampled 2026-05-28).
- name: fxa_created_at
  type: TIMESTAMP
  mode: NULLABLE
  description: Timestamp when the user's Firefox Accounts (FxA) account was created.
    NULL for approximately 7.6% of users who have no associated FxA account (sampled
    2026-05-28).
- name: newsletters
  type: RECORD
  mode: REPEATED
  fields:
  - name: newsletter_name
    type: STRING
    mode: NULLABLE
  - name: subscribed
    type: BOOLEAN
    mode: NULLABLE
  - name: newsletter_lang
    type: STRING
    mode: NULLABLE
  - name: newsletter_source
    type: STRING
    mode: NULLABLE
  - name: create_timestamp
    type: TIMESTAMP
    mode: NULLABLE
  - name: update_timestamp
    type: TIMESTAMP
    mode: NULLABLE
  description: Array of newsletter subscription records for this user, joined from
    braze_derived.newsletters_v1. Each element contains the newsletter name, subscription
    status, language, source, and creation/update timestamps. NULL when the user has
    no active newsletter subscriptions.
- name: waitlists
  type: RECORD
  mode: REPEATED
  fields:
  - name: waitlist_name
    type: STRING
    mode: NULLABLE
  - name: waitlist_geo
    type: STRING
    mode: NULLABLE
  - name: waitlist_platform
    type: STRING
    mode: NULLABLE
  - name: waitlist_source
    type: STRING
    mode: NULLABLE
  - name: create_timestamp
    type: TIMESTAMP
    mode: NULLABLE
  - name: subscribed
    type: BOOLEAN
    mode: NULLABLE
  - name: unsub_reason
    type: STRING
    mode: NULLABLE
  - name: update_timestamp
    type: TIMESTAMP
    mode: NULLABLE
  description: Array of waitlist membership records for this user, joined from braze_derived.waitlists_v1.
    Each element contains the waitlist name, geographic and platform attributes, source,
    subscription status, unsubscribe reason, and creation/update timestamps. NULL
    when the user has no waitlist memberships.
- name: products
  type: RECORD
  mode: REPEATED
  fields:
  - name: provider
    type: STRING
    mode: NULLABLE
  - name: payment_provider
    type: STRING
    mode: NULLABLE
  - name: product_name
    type: STRING
    mode: NULLABLE
  - name: service_name
    type: STRING
    mode: NULLABLE
  - name: subscription_plan_id
    type: STRING
    mode: NULLABLE
  - name: subscription_product_id
    type: STRING
    mode: NULLABLE
  - name: subscription_started_at
    type: TIMESTAMP
    mode: NULLABLE
  - name: subscription_ended_at
    type: TIMESTAMP
    mode: NULLABLE
  - name: subscription_summary
    type: STRING
    mode: NULLABLE
  - name: subscription_billing_interval
    type: STRING
    mode: NULLABLE
  - name: subscription_interval_count
    type: INTEGER
    mode: NULLABLE
  - name: subscription_currency
    type: STRING
    mode: NULLABLE
  - name: subscription_amount
    type: NUMERIC
    mode: NULLABLE
  - name: is_bundle
    type: BOOLEAN
    mode: NULLABLE
  - name: is_trial
    type: BOOLEAN
    mode: NULLABLE
  - name: is_active
    type: BOOLEAN
    mode: NULLABLE
  - name: subscription_status
    type: STRING
    mode: NULLABLE
  - name: subscription_country_code
    type: STRING
    mode: NULLABLE
  - name: subscription_country_name
    type: STRING
    mode: NULLABLE
  - name: current_period_started_at
    type: TIMESTAMP
    mode: NULLABLE
  - name: current_period_ends_at
    type: TIMESTAMP
    mode: NULLABLE
  - name: is_auto_renew
    type: BOOLEAN
    mode: NULLABLE
  - name: auto_renew_disabled_at
    type: TIMESTAMP
    mode: NULLABLE
  - name: has_refunds
    type: BOOLEAN
    mode: NULLABLE
  - name: has_fraudulent_charges
    type: BOOLEAN
    mode: NULLABLE
  - name: first_touch_impression_at
    type: TIMESTAMP
    mode: NULLABLE
  - name: first_touch_entrypoint
    type: STRING
    mode: NULLABLE
  - name: first_touch_entrypoint_experiment
    type: STRING
    mode: NULLABLE
  - name: first_touch_entrypoint_variation
    type: STRING
    mode: NULLABLE
  - name: first_touch_utm_campaign
    type: STRING
    mode: NULLABLE
  - name: first_touch_utm_content
    type: STRING
    mode: NULLABLE
  - name: first_touch_utm_medium
    type: STRING
    mode: NULLABLE
  - name: first_touch_utm_source
    type: STRING
    mode: NULLABLE
  - name: first_touch_utm_term
    type: STRING
    mode: NULLABLE
  - name: last_touch_impression_at
    type: TIMESTAMP
    mode: NULLABLE
  - name: last_touch_entrypoint
    type: STRING
    mode: NULLABLE
  - name: last_touch_entrypoint_experiment
    type: STRING
    mode: NULLABLE
  - name: last_touch_entrypoint_variation
    type: STRING
    mode: NULLABLE
  - name: last_touch_utm_campaign
    type: STRING
    mode: NULLABLE
  - name: last_touch_utm_content
    type: STRING
    mode: NULLABLE
  - name: last_touch_utm_medium
    type: STRING
    mode: NULLABLE
  - name: last_touch_utm_source
    type: STRING
    mode: NULLABLE
  - name: last_touch_utm_term
    type: STRING
    mode: NULLABLE
  - name: subscription_created_at
    type: TIMESTAMP
    mode: NULLABLE
  - name: subscription_updated_at
    type: TIMESTAMP
    mode: NULLABLE
  description: Array of Mozilla product subscription records for this user, joined
    from braze_derived.products_v1. Each element contains details about a subscription
    including provider, product name, billing interval, currency, amounts, status,
    and attribution data. NULL when the user has no associated product subscriptions.
