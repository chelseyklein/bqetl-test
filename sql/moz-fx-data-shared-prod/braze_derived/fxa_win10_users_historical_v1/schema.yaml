fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date the user was identified as inactive on Windows 10 and added
    to this historical list. Derived from the FxA accounts last-seen table at the
    time of ingestion.
- name: external_id
  type: STRING
  mode: NULLABLE
  description: The unique identifier for the user in Braze, corresponding to the CTMS
    email_id UUID. Used to link this re-engagement list back to the main Braze user
    profile.
- name: email
  type: STRING
  mode: NULLABLE
  description: The email address used to contact the user. Sourced from the Braze
    users table when available, otherwise from the FxA primary email associated with
    the user's FxA account.
- name: locale
  type: STRING
  mode: NULLABLE
  description: The application locale of the user's most recent Firefox Desktop FxA
    ping (e.g. 'en-US', 'de', 'fr'). Only users with locales in a supported set (de,
    en-US, en-GB, es-ES, fr, it, pl, pt-BR) are included in this table.
- name: fxa_id_sha256
  type: STRING
  mode: NULLABLE
  description: SHA-256 hash of the user's Firefox Accounts (FxA) user ID. Used to
    link this re-engagement list to FxA account data without exposing raw account
    identifiers.
