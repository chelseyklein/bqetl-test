fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date the fx_accounts Glean ping was received, representing when
    this Windows 10 user was identified as inactive (14–21 days since last FxA service
    activity). Used to track when users were added to the re-engagement list.
- name: external_id
  type: STRING
  mode: NULLABLE
  description: The unique identifier for the user in Braze, sourced from braze_derived.users_v1
    when available, or a newly generated SHA-256 UUID for users not yet in the Braze
    user table. Always populated.
- name: email
  type: STRING
  mode: NULLABLE
  description: The primary email address for the user, sourced from braze_derived.users_v1
    when the user exists there, or from accounts_backend_external.emails_v1 for the
    FxA primary email otherwise. Used for Braze re-engagement outreach targeting inactive
    Windows 10 FxA users.
- name: locale
  type: STRING
  mode: NULLABLE
  description: The application locale of the user's most recent Firefox Desktop fx_accounts
    ping (e.g. 'en-US', 'de', 'fr'). Only users with one of eight targeted locales
    (de, en-US, en-GB, es-ES, fr, it, pl, pt-BR) are included in this table.
- name: fxa_id_sha256
  type: STRING
  mode: NULLABLE
  description: SHA-256 hash of the user's Firefox Accounts (FxA) user ID, derived
    from the fx_accounts ping's client_association_uid metric. Used to link this re-engagement
    record back to FxA account data without exposing raw identifiers.
