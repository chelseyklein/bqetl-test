fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date on which the user was identified as an inactive Windows 10
    Firefox user and added to this historical list. Derived from the accounts_backend_derived
    last-seen table.
- name: external_id
  type: STRING
  mode: NULLABLE
  description: The unique identifier for the user in Braze, sourced from the CTMS
    email_id or a generated UUID when no Braze record exists. Used to link back to
    Braze user records.
- name: email
  type: STRING
  mode: NULLABLE
  description: The primary email address of the user, sourced from the CTMS braze_derived.users_v1
    record or the FxA accounts email if no Braze record is found. Only users with
    non-NULL email addresses are included.
- name: locale
  type: STRING
  mode: NULLABLE
  description: The browser locale of the user at the time of their last Firefox fx_accounts
    ping on Windows 10, e.g. 'en-US', 'de', 'fr'. Only a subset of locales are included
    (en-US, en-GB, de, es-ES, fr, it, pl, pt-BR).
- name: fxa_id_sha256
  type: STRING
  mode: NULLABLE
  description: SHA-256 hash of the user's Firefox Accounts (FxA) user ID. Used to
    link to FxA records without exposing raw account identifiers.
