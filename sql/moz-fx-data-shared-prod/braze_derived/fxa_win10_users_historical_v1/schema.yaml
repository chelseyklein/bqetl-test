fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date (14 days before the processing date) on which the user was
    last seen active on Firefox for Windows 10 before becoming inactive.
- name: external_id
  type: STRING
  mode: NULLABLE
  description: Unique identifier for the user in Braze. Populated from the CTMS external_id
    when the user exists in braze_derived.users_v1, otherwise a synthetic SHA-256
    UUID generated at ingestion time.
- name: email
  type: STRING
  mode: NULLABLE
  description: The primary email address of the user. Sourced from braze_derived.users_v1
    when available, otherwise from the FxA accounts_backend_external.emails_v1 table.
- name: locale
  type: STRING
  mode: NULLABLE
  description: The browser locale of the user at the time of last activity (e.g. 'en-US',
    'de'). Only users with locales in a supported set (de, en-US, en-GB, es-ES, fr,
    it, pl, pt-BR) are included.
- name: fxa_id_sha256
  type: STRING
  mode: NULLABLE
  description: SHA-256 hash of the Firefox Accounts (FxA) user ID. Used to join to
    FxA records without exposing raw account identifiers.
