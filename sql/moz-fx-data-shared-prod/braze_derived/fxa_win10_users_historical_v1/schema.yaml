fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date associated with the pipeline run that added this user to the
    historical list. Corresponds to the submission date used to query the fx_accounts
    Glean ping.
- name: external_id
  type: STRING
  mode: NULLABLE
  description: The unique identifier for the user in Braze, sourced from the CTMS
    email_id (a UUID). Falls back to a hashed generated UUID if the user is not yet
    present in the Braze users table.
- name: email
  type: STRING
  mode: NULLABLE
  description: The primary email address of the user, sourced from the Braze users
    table or the FxA emails table. Used to contact Windows 10 users who have been
    inactive for 14–21 days.
- name: locale
  type: STRING
  mode: NULLABLE
  description: The browser locale of the user at the time of their most recent fx_accounts
    ping, used to filter to supported campaign locales (e.g., 'en-US', 'de', 'fr',
    'pt-BR').
- name: fxa_id_sha256
  type: STRING
  mode: NULLABLE
  description: SHA-256 hash of the user's Firefox Accounts (FxA) user ID, derived
    from the client_association_uid metric in the fx_accounts Glean ping. Used to
    deduplicate against the historical list.
