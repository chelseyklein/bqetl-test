fields:
- name: submission_date
  type: DATE
  mode: NULLABLE
  description: The date on which the user was identified as an inactive Windows 10
    Firefox Accounts user eligible for re-engagement (14 days prior to the pipeline
    run date).
- name: external_id
  type: STRING
  mode: NULLABLE
  description: The unique identifier for the user in Braze, sourced from braze_derived.users_v1
    or generated as a SHA-256-based UUID for users not yet in Braze. Links this record
    back to the Braze user profile.
- name: email
  type: STRING
  mode: NULLABLE
  description: The primary email address of the user, sourced from braze_derived.users_v1
    when available, otherwise from the Firefox Accounts emails table. Used for Braze
    re-engagement campaigns targeting inactive Windows 10 users.
- name: locale
  type: STRING
  mode: NULLABLE
  description: The browser locale of the user at the time of their last fx_accounts
    ping, e.g. 'en-US', 'de', 'fr'. Only users with locales in the set (de, en-US,
    en-GB, es-ES, fr, it, pl, pt-BR) are included.
- name: fxa_id_sha256
  type: STRING
  mode: NULLABLE
  description: SHA-256 hash of the user's Firefox Accounts (FxA) user ID. Used to
    link to FxA records without exposing raw account identifiers. Always populated
    for rows in this table.
