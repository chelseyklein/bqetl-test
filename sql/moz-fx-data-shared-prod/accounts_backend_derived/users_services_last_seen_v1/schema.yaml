fields:
- mode: NULLABLE
  name: submission_date
  type: DATE
  description: The date for which this last-seen record applies. Each row represents the most recent 28-day
    activity window ending on this date for a given user and service combination.
- mode: NULLABLE
  name: user_id_sha256
  type: STRING
  description: A hex string SHA-256 hash of the Firefox Accounts user ID (uid), used as a pseudonymous identifier
    to track activity across services without exposing the raw account ID.
- mode: NULLABLE
  name: service
  type: STRING
  description: The identifier of the relying party service that the user authenticated with (e.g., 'sync',
    'vpn', 'relay', or an opaque OAuth client ID string). An empty string indicates no specific service
    was recorded.
- mode: NULLABLE
  name: country
  type: STRING
  description: The two-letter ISO 3166-1 alpha-2 country code associated with the user's most recent activity
    for this service, derived from GeoIP lookup. Null when the country cannot be determined.
- mode: NULLABLE
  name: days_seen_bits
  type: INTEGER
  description: |
    No. of days since the user had activity event.
- mode: NULLABLE
  name: days_seen_in_tier1_country_bits
  type: INTEGER
  description: |
    No. of days since seen_in_tier1_country was last True.
- mode: NULLABLE
  name: days_registered_bits
  type: INTEGER
  description: |
    No. of days since registration event.
- name: user_agent_device_count
  type: INTEGER
  mode: NULLABLE
  description: Number of devices associated with the user, per service, per day. Estimated from the number of unique user agent strings.
