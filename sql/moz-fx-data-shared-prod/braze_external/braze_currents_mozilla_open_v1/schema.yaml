fields:
- name: id
  type: STRING
  mode: NULLABLE
  description: Globally unique ID for this event
- name: user_id
  type: STRING
  mode: NULLABLE
  description: Braze user ID of the user who performed this event
- name: dispatch_id
  type: STRING
  mode: NULLABLE
  description: ID of the dispatch this message belongs to
- name: external_user_id
  type: STRING
  mode: NULLABLE
  description: '[PII] External ID of the user'
- name: time
  type: INT64
  mode: NULLABLE
  description: UNIX timestamp at which the event happened
- name: timezone
  type: STRING
  mode: NULLABLE
  description: Time zone of the user
- name: campaign_id
  type: STRING
  mode: NULLABLE
  description: API ID of the campaign this event belongs to
- name: campaign_name
  type: STRING
  mode: NULLABLE
  description: Name of the campaign
- name: message_variation_id
  type: STRING
  mode: NULLABLE
  description: API ID of the message variation this user received
- name: message_variation_name
  type: STRING
  mode: NULLABLE
  description: Name of the message variation
- name: email_address
  type: STRING
  mode: NULLABLE
  description: '[PII] Email address of the user'
- name: canvas_id
  type: STRING
  mode: NULLABLE
  description: API ID of the Canvas this event belongs to
- name: canvas_name
  type: STRING
  mode: NULLABLE
  description: Name of the Canvas
- name: canvas_variation_id
  type: STRING
  mode: NULLABLE
  description: API ID of the Canvas variation this event belongs to
- name: canvas_variation_name
  type: STRING
  mode: NULLABLE
  description: Name of the Canvas variation this user received
- name: canvas_step_id
  type: STRING
  mode: NULLABLE
  description: API ID of the Canvas step this event belongs to
- name: canvas_step_name
  type: STRING
  mode: NULLABLE
  description: Name of the Canvas step
- name: send_id
  type: STRING
  mode: NULLABLE
  description: Message send ID this message belongs to
- name: user_agent
  type: STRING
  mode: NULLABLE
  description: User agent on which the spam report occurred
- name: ip_pool
  type: STRING
  mode: NULLABLE
  description: IP pool from which the email send was made
- name: machine_open
  type: STRING
  mode: NULLABLE
  description: Populated to 'true' if the open event is triggered without user engagement, for example by an Apple device with Mail Privacy Protection enabled. Value
    may change over time to provide more granularity.
- name: esp
  type: STRING
  mode: NULLABLE
  description: ESP related to the event (SparkPost, SendGrid, or Amazon SES)
- name: from_domain
  type: STRING
  mode: NULLABLE
  description: Sending domain for the email
- name: is_amp
  type: BOOLEAN
  mode: NULLABLE
  description: Indicates that this is an AMP event
- name: app_group_id
  type: STRING
  mode: NULLABLE
  description: API ID of the app group this user belongs to
- name: device_class
  type: STRING
  mode: NULLABLE
  description: Device class extracted from user_agent (mobile, desktop, tablet, etc...)
- name: device_os
  type: STRING
  mode: NULLABLE
  description: Device operating system extracted from user_agent
- name: device_model
  type: STRING
  mode: NULLABLE
  description: Model of the device
- name: browser
  type: STRING
  mode: NULLABLE
  description: Device browser - extracted from user_agent - on which the open occurred
- name: mailbox_provider
  type: STRING
  mode: NULLABLE
  description: Mailbox provider value returned by the esp for this event
