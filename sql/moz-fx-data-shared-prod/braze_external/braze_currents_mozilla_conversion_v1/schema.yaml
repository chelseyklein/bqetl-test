fields:
- name: id
  type: STRING
  mode: NULLABLE
  description: Globally unique ID for this event
- name: user_id
  type: STRING
  mode: NULLABLE
  description: Braze user ID of the user who performed this event
- name: external_user_id
  type: STRING
  mode: NULLABLE
  description: '[PII] External ID of the user'
- name: app_id
  type: STRING
  mode: NULLABLE
  description: API ID of the app on which this event occurred
- name: time
  type: INT64
  mode: NULLABLE
  description: UNIX timestamp at which the event happened
- name: timezone
  type: STRING
  mode: NULLABLE
  description: Time zone of the user
- name: campaign_id
  type: STRING
  mode: NULLABLE
  description: API ID of the campaign this event belongs to
- name: campaign_name
  type: STRING
  mode: NULLABLE
  description: Name of the campaign
- name: message_variation_id
  type: STRING
  mode: NULLABLE
  description: API ID of the message variation this user received
- name: message_variation_name
  type: STRING
  mode: NULLABLE
  description: Name of the message variation
- name: send_id
  type: STRING
  mode: NULLABLE
  description: Message send ID this message belongs to
- name: conversion_behavior_index
  type: INT64
  mode: NULLABLE
  description: Index of the conversion behavior
- name: conversion_behavior
  type: STRING
  mode: NULLABLE
  description: JSON-encoded string describing the conversion behavior
- name: app_group_id
  type: STRING
  mode: NULLABLE
  description: API ID of the app group this user belongs to
