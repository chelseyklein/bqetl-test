fields:
- name: app_group_id
  type: STRING
  description: Braze app group (workspace) identifier for the Firefox product workspace.
- name: browser
  type: STRING
  description: Browser used when the email link was clicked (e.g. Chrome, Firefox, Mobile Safari).
- name: campaign_id
  type: STRING
  description: Braze campaign identifier; populated when the email was sent via a campaign rather than a Canvas.
- name: campaign_name
  type: STRING
  description: Human-readable name of the Braze campaign that sent this email; null when the message originated from a Canvas.
- name: canvas_id
  type: STRING
  description: Braze Canvas identifier; populated when the email was sent as part of a multi-step Canvas journey rather than a standalone campaign.
- name: canvas_name
  type: STRING
  description: Human-readable name of the Braze Canvas through which this email was sent; null for standalone campaigns.
- name: canvas_step_id
  type: STRING
  description: Identifier for the specific step within the Canvas at which this email was sent.
- name: canvas_step_name
  type: STRING
  description: Human-readable name of the Canvas step at which this email was sent.
- name: canvas_variation_id
  type: STRING
  description: Identifier for the specific variation path within the Canvas that this user was assigned to.
- name: canvas_variation_name
  type: STRING
  description: Human-readable name of the Canvas variation (journey path) assigned to this user.
- name: device_class
  type: STRING
  description: Classification of the device used to click the link, such as desktop, mobile, tablet, or other.
- name: device_model
  type: STRING
  description: Model of the device used to click the link; not populated in this dataset.
- name: device_os
  type: STRING
  description: Operating system of the device on which the email link was clicked (e.g. Windows, iOS, Android).
- name: dispatch_id
  type: STRING
  description: Identifier for the specific message dispatch batch in which this email was sent.
- name: esp
  type: STRING
  description: Email service provider used to send the message (always SparkPost for Firefox emails).
- name: external_user_id
  type: STRING
  description: Mozilla-assigned external identifier for the user (e.g. a UUID), used to join Braze records to Mozilla's own user tables.
- name: from_domain
  type: STRING
  description: The sending domain from which the email was delivered (e.g. mail.mozilla.org or today.getpocket.com).
- name: id
  type: STRING
  description: Unique identifier for this Braze Currents email click event record.
- name: ip_pool
  type: STRING
  description: Name of the sending IP pool used to deliver this email (e.g. marketing, newsletter, or transactional).
- name: is_amp
  type: BOOLEAN
  description: Whether this click occurred in an AMP (Accelerated Mobile Pages) version of the email; not populated in this dataset.
- name: is_suspected_bot_click
  type: BOOLEAN
  description: Whether Braze flagged this click as likely originating from an automated bot rather than a human; not populated in this dataset.
- name: link_alias
  type: STRING
  description: Human-readable alias assigned to the clicked link in Braze; not populated in this dataset.
- name: link_id
  type: STRING
  description: Braze link identifier for the clicked link; not populated in this dataset.
- name: mailbox_provider
  type: STRING
  description: Mailbox provider of the recipient's email address; not populated in this dataset.
- name: message_variation_id
  type: STRING
  description: Identifier for the message variation (A/B test arm) within the campaign or Canvas that was sent to this user.
- name: message_variation_name
  type: STRING
  description: Human-readable name of the message variation (A/B test arm) within the campaign or Canvas.
- name: send_id
  type: STRING
  description: Braze send identifier associated with this message; typically null for Currents data where send IDs are not populated.
- name: suspected_bot_click_reason
  type: STRING
  description: List of reasons why Braze suspects this click was generated by a bot.
- name: time
  type: INT64
  description: Unix timestamp (seconds since epoch) indicating when the email click event occurred.
- name: timezone
  type: STRING
  description: Time zone of the user at the time of the event; not populated in this dataset.
- name: url
  type: STRING
  description: The full URL that the user clicked within the email.
- name: user_agent
  type: STRING
  description: The HTTP user-agent string of the client used when the link was clicked, identifying the browser and operating system.
- name: user_id
  type: STRING
  description: Braze internal user identifier for the recipient who clicked the email.
- name: app_id
  type: STRING
  description: Braze application identifier; not populated for email channel conversion events.
- name: sending_ip
  type: STRING
  description: The specific IP address used to deliver this email to the recipient's mail server.
- name: channel
  type: STRING
  description: The communication channel for which the subscription state changed; always 'email' in this table.
- name: channel_identifier
  type: STRING
  description: The email address of the user whose global subscription state changed; populated for opt-in and unsubscribe events.
- name: state_change_source
  type: STRING
  description: The mechanism by which this subscription state change was initiated, such as REST API, List-Unsubscribe, Subscription Page, CSV
    Import, or Preference Center.
- name: subscription_status
  type: STRING
  description: The new global email subscription status applied to the user, such as Opted In, Subscribed, or Unsubscribed.
- name: bounce_reason
  type: STRING
  description: The SMTP error message or reason code returned by the receiving mail server explaining why the email permanently bounced (e.g.
    account does not exist, mailbox disabled).
- name: conversion_behavior
  type: STRING
  description: JSON-encoded description of the conversion goal that was met, including the action type (e.g. Opens Email, Clicks Email) and the
    attribution window in seconds.
- name: conversion_behavior_index
  type: INT64
  description: Zero-based index identifying which configured conversion goal (primary, secondary, etc.) was achieved for this campaign.
- name: email_address
  type: STRING
  description: Email address of the recipient. Suppressed due to PII.
- name: is_drop
  type: BOOLEAN
  description: Whether this hard bounce was silently dropped by Braze (true) rather than resulting in
    a delivery attempt. Always null in the current dataset.
- name: machine_open
  description: Indicates whether the open was triggered automatically by a mail scanning or privacy proxy
    (e.g., Apple Mail Privacy Protection) rather than by a human. 'true' when a machine open is detected;
    null otherwise.
- name: phone_number
  description: Phone number of the user. Suppressed due to PII.
- name: subscription_group_id
  description: UUID of the Braze email subscription group whose state changed for this user.
